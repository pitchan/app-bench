<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
:root{--bg:#f6f6f4;--ink:#1c1c1e;--line:#c9c9c4;--accent:#1f5fbf;--sel:#dce9ff;--head:#ececea;--err:#8a1c1c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
[hidden]{display:none !important}
h1{font-size:20px;margin:0 0 12px}
main{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid #8a8a85;border-radius:6px;padding:6px 10px;min-height:32px;cursor:pointer}
button:hover:not(:disabled){background:#eef3fb}
button:disabled{opacity:.5;cursor:default}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1px solid #8a8a85;border-radius:6px;padding:6px 8px;min-height:32px;max-width:100%}
input[type=text]{width:170px}
input[type=checkbox]{width:16px;height:16px;margin:0}
input:disabled,select:disabled,textarea:disabled{opacity:.5}
textarea{width:100%;min-height:96px;font-family:ui-monospace,Consolas,monospace}
.check{display:inline-flex;align-items:center;gap:6px}
:focus{outline:3px solid var(--accent);outline-offset:2px}
.namebox{min-width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
#formula-input{flex:1 1 220px;width:auto;min-width:0}
.grid-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
[role=row]{display:grid;grid-template-columns:48px repeat(8,112px)}
[role=columnheader],[role=rowheader],[role=presentation]{background:var(--head);border:1px solid var(--line);height:28px;display:flex;align-items:center;justify-content:center;font-weight:600}
[role=gridcell]{border:1px solid var(--line);height:28px;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;background:#fff}
[role=gridcell][data-kind=number]{justify-content:flex-end}
[role=gridcell][data-in-selection=true]{background:var(--sel)}
[role=gridcell][aria-selected=true]{box-shadow:inset 0 0 0 2px var(--accent)}
.summary{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;min-width:0;flex:1 1 100%;padding-bottom:4px}
[role=tab]{white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;background:#e9e9e6;flex:0 0 auto}
[role=tab][aria-selected=true]{background:#fff;border-bottom:3px solid var(--accent);font-weight:600}
.msg{color:var(--err);font-weight:600;flex:1 1 100%;overflow-wrap:anywhere}
.names{display:flex;flex-direction:column;gap:4px;flex:1 1 100%;min-width:0}
[role=listitem]{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;overflow-wrap:anywhere}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Haiku 5.5</h1></header>
<main>
<div class="bar" data-testid="toolbar">
<button type="button" data-testid="undo-button">Undo</button>
<button type="button" data-testid="redo-button">Redo</button>
<button type="button" data-testid="copy-button">Copy</button>
<button type="button" data-testid="cut-button">Cut</button>
<button type="button" data-testid="paste-button">Paste</button>
<button type="button" data-testid="clear-button">Clear</button>
<button type="button" data-testid="insert-row">Insert row</button>
<button type="button" data-testid="delete-row">Delete row</button>
<button type="button" data-testid="insert-col">Insert column</button>
<button type="button" data-testid="delete-col">Delete column</button>
<button type="button" data-testid="sort-asc">Sort ascending</button>
<button type="button" data-testid="sort-desc">Sort descending</button>
<button type="button" data-testid="fill-down">Fill down</button>
<button type="button" data-testid="fill-right">Fill right</button>
<button type="button" data-testid="fill-series">Fill series</button>
<label for="format-select">Number format</label>
<select id="format-select" data-testid="format-select">
<option value="general">General</option>
<option value="fixed2">1,234.50</option>
<option value="percent1">12.5%</option>
<option value="date">2024-12-31</option>
</select>
</div>
<div class="bar">
<div class="namebox" data-testid="name-box">A1</div>
<label for="formula-input">Cell content</label>
<input type="text" id="formula-input" data-testid="formula-input" autocomplete="off" data-editing="false">
</div>
<div class="grid-wrap">
<div role="grid" aria-label="Sheet" tabindex="0" data-testid="grid" id="grid"></div>
</div>
<div class="summary" data-testid="selection-summary" hidden></div>
<section class="bar" data-testid="sheet-bar">
<div class="tabs" role="tablist" aria-label="Sheets" data-testid="sheet-tabs"></div>
<button type="button" data-testid="add-sheet">Add sheet</button>
<label for="sheet-name-input">Sheet name</label>
<input type="text" id="sheet-name-input" data-testid="sheet-name-input" autocomplete="off">
<button type="button" data-testid="rename-sheet">Rename sheet</button>
<button type="button" data-testid="delete-sheet">Delete sheet</button>
<div class="msg" data-testid="sheet-message" hidden></div>
</section>
<section class="bar" data-testid="names-panel">
<label for="name-input">Name</label>
<input type="text" id="name-input" data-testid="name-input" autocomplete="off">
<button type="button" data-testid="define-name">Define name</button>
<button type="button" data-testid="delete-name">Delete name</button>
<div class="msg" data-testid="name-message" hidden></div>
<div class="names" role="list" aria-label="Names" data-testid="name-list"></div>
</section>
<section class="bar" data-testid="find-panel">
<label for="find-input">Find</label>
<input type="text" id="find-input" data-testid="find-input" autocomplete="off">
<label for="replace-input">Replace with</label>
<input type="text" id="replace-input" data-testid="replace-input" autocomplete="off">
<label class="check"><input type="checkbox" data-testid="find-case"><span>Match case</span></label>
<label class="check"><input type="checkbox" data-testid="find-whole"><span>Whole cell</span></label>
<button type="button" data-testid="find-next">Find next</button>
<button type="button" data-testid="replace-all">Replace all</button>
<div class="msg" data-testid="find-status" hidden></div>
</section>
<section class="bar" data-testid="csv-panel">
<label class="check"><input type="checkbox" data-testid="csv-raw"><span>Raw contents</span></label>
<button type="button" data-testid="csv-export">Export CSV</button>
<button type="button" data-testid="csv-import">Import CSV</button>
<label for="csv-text">CSV</label>
<textarea id="csv-text" data-testid="csv-text"></textarea>
<div class="msg" data-testid="csv-message" hidden></div>
</section>
</main>
<script>
'use strict';
const ROWS = 12, COLS = 8, MAX_SERIAL = 2958464, HIST_LIMIT = 20, STORE_KEY = 'tally-book';
const WB = { sheets: [], active: 0, names: [], nextId: 1, past: [], future: [] };

/* ---------- errors ---------- */
class Err { constructor(c) { this.c = c; } }
const E = (c) => new Err(c);
const isErr = (v) => v instanceof Err;

/* ---------- numbers ---------- */
function plainOf(x) {
  const neg = x < 0;
  const s = Math.abs(x).toPrecision(12);
  let m = s, e = 0;
  if (s.indexOf('e') >= 0) { const p = s.split('e'); m = p[0]; e = Number(p[1]); }
  const parts = m.split('.');
  const digits = parts[0] + (parts[1] || '');
  const point = parts[0].length + e;
  let out;
  if (point <= 0) out = '0.' + '0'.repeat(-point) + digits;
  else if (point >= digits.length) out = digits + '0'.repeat(point - digits.length);
  else out = digits.slice(0, point) + '.' + digits.slice(point);
  return (neg ? '-' : '') + out;
}
function incDigits(s) {
  const a = s.split('');
  let i = a.length - 1;
  while (i >= 0) {
    if (a[i] === '9') { a[i] = '0'; i--; }
    else { a[i] = String.fromCharCode(a[i].charCodeAt(0) + 1); return a.join(''); }
  }
  return '1' + a.join('');
}
/* R(x, d) with mode 'half' (ties away), 'up' (R-up) or 'down' (R-down); returns a plain string */
function roundStr(x, d, mode) {
  const s = plainOf(x);
  const neg = s[0] === '-';
  const abs = neg ? s.slice(1) : s;
  const dot = abs.indexOf('.');
  let ip = dot < 0 ? abs : abs.slice(0, dot);
  let fp = dot < 0 ? '' : abs.slice(dot + 1);
  let kept, dropped;
  if (d >= 0) {
    fp = fp.padEnd(d, '0');
    kept = ip + fp.slice(0, d);
    dropped = fp.slice(d);
  } else {
    const k = -d;
    ip = ip.padStart(k, '0');
    kept = ip.slice(0, ip.length - k);
    dropped = ip.slice(ip.length - k) + fp;
  }
  if (kept === '') kept = '0';
  let up = false;
  if (mode === 'up') up = /[1-9]/.test(dropped);
  else if (mode === 'half') up = (dropped[0] || '0') >= '5';
  if (up) kept = incDigits(kept);
  let res;
  if (d >= 0) {
    const cut = kept.length - d;
    res = kept.slice(0, cut) + (d > 0 ? '.' + kept.slice(cut) : '');
  } else {
    res = kept + '0'.repeat(-d);
  }
  return (neg ? '-' : '') + res;
}
/* N(x): normalization with the range rule */
function N(x) {
  if (!isFinite(x)) return E('#NUM!');
  const n = Number(x.toPrecision(12));
  if (!isFinite(n) || Math.abs(n) >= 1e15) return E('#NUM!');
  return n === 0 ? 0 : n;
}
/* normalization without the range rule */
function nraw(x) { const n = Number(x.toPrecision(12)); return n === 0 ? 0 : n; }
function groupInt(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function numText(x, dec, grouped, pct) {
  let s = roundStr(x, dec, 'half');
  const neg = s[0] === '-';
  if (neg) s = s.slice(1);
  const parts = s.split('.');
  let ip = parts[0];
  const fp = parts[1] || '';
  if (grouped) ip = groupInt(ip);
  let out = ip + (dec > 0 ? '.' + fp : '') + (pct ? '%' : '');
  if (neg && Number(s) !== 0) out = '-' + out;
  return out;
}
function generalText(x) {
  const s = roundStr(x, 6, 'half');
  if (Number(s) === 0) return '0';
  let t = s;
  if (t.indexOf('.') >= 0) t = t.replace(/0+$/, '').replace(/\.$/, '');
  return t;
}
/* P(x): plain text of a normalized number, used as raw content */
function plainText(x) {
  let s = plainOf(x);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s === '-0' ? '0' : s;
}

/* ---------- dates ---------- */
const BASE = (() => { const t = new Date(0); t.setUTCFullYear(1900, 0, 1); return t.getTime(); })();
function serialOf(y, m, d) {
  const t = new Date(0);
  t.setUTCFullYear(y, m - 1, d);
  return Math.round((t.getTime() - BASE) / 864e5) + 1;
}
function ymdOf(s) {
  const t = new Date(BASE + (s - 1) * 864e5);
  return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()];
}
function serialToIso(s) {
  const [y, m, d] = ymdOf(s);
  return String(y).padStart(4, '0') + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function dateEntry(t) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1) return null;
  const s = serialOf(y, mo, d);
  if (s < 1 || s > MAX_SERIAL) return null;
  const back = ymdOf(s);
  if (back[0] !== y || back[1] !== mo || back[2] !== d) return null;
  return s;
}
function entryNumber(t) {
  const m = /^([+-]?)(\d+(\.\d+)?|\.\d+)(%?)$/.exec(t);
  if (!m) return null;
  let v = Number(m[2]);
  if (m[4] === '%') v = v / 100;
  if (m[1] === '-') v = -v;
  const n = Number(v.toPrecision(12));
  if (!isFinite(n) || Math.abs(n) >= 1e15) return null;
  return n === 0 ? 0 : n;
}
function trimSp(s) { return s.replace(/^ +| +$/g, ''); }

/* value of a raw content that is not a formula (02, section 2.2) */
function constValue(raw) {
  if (raw === '') return null;
  if (raw[0] === "'") return raw.slice(1);
  const t = trimSp(raw);
  const ser = dateEntry(t);
  if (ser !== null) return ser;
  const num = entryNumber(t);
  if (num !== null) return num;
  if (/^(TRUE|FALSE)$/i.test(t)) return t.toUpperCase() === 'TRUE';
  return raw;
}

/* display text (02, section 2.5) */
function displayText(v, fmt) {
  if (v === null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (isErr(v)) return v.c;
  if (fmt === 'fixed2') return numText(v, 2, true, false);
  if (fmt === 'percent1') return numText(nraw(v * 100), 1, false, true);
  if (fmt === 'date') {
    const d = Math.floor(v);
    if (d >= 1 && d <= MAX_SERIAL) return serialToIso(d);
    return generalText(v);
  }
  return generalText(v);
}

/* ---------- columns and references ---------- */
function colIndex(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}
function colLetters(n) {
  let s = '';
  while (n > 0) { s = String.fromCharCode(65 + ((n - 1) % 26)) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function addr(r, c) { return colLetters(c) + r; }
function inGrid(c, r) { return c >= 1 && c <= COLS && r >= 1 && r <= ROWS; }
function quoteSheet(name) {
  return /^[A-Za-z_][A-Za-z0-9_]*$/.test(name) ? name : "'" + name.replace(/'/g, "''") + "'";
}

/* ---------- tokenizer and parser ---------- */
const OPS2 = ['<>', '<=', '>='];
const OPS1 = '+-*/^&%=<>';
function tokenize(src) {
  const toks = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const ch = src[i];
    if (ch === ' ') { i++; continue; }
    if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      const m = /^(\d+(\.\d+)?|\.\d+)/.exec(src.slice(i));
      toks.push({ t: 'num', v: m[0] });
      i += m[0].length;
      continue;
    }
    if (ch === '"') {
      let j = i + 1;
      for (;;) {
        if (j >= n) return null;
        if (src[j] === '"') {
          if (src[j + 1] === '"') { j += 2; continue; }
          break;
        }
        j++;
      }
      toks.push({ t: 'str', v: src.slice(i, j + 1) });
      i = j + 1;
      continue;
    }
    if (ch === "'") {
      let j = i + 1, name = '';
      for (;;) {
        if (j >= n) return null;
        if (src[j] === "'") {
          if (src[j + 1] === "'") { name += "'"; j += 2; continue; }
          break;
        }
        name += src[j];
        j++;
      }
      if (name === '' || src[j + 1] !== '!') return null;
      toks.push({ t: 'prefix', v: name });
      i = j + 2;
      continue;
    }
    if (/[A-Za-z_$]/.test(ch)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_$]/.test(src[j])) j++;
      const w = src.slice(i, j);
      if (src[j] === '!') {
        if (w.indexOf('$') >= 0) return null;
        toks.push({ t: 'prefix', v: w });
        i = j + 1;
        continue;
      }
      if (/^(TRUE|FALSE)$/i.test(w)) toks.push({ t: 'bool', v: w.toUpperCase() === 'TRUE' });
      else {
        const m = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);
        if (m) toks.push({ t: 'ref', cabs: !!m[1], col: colIndex(m[2]), rabs: !!m[3], row: parseInt(m[4], 10) });
        else if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(w)) toks.push({ t: 'name', v: w });
        else return null;
      }
      i = j;
      continue;
    }
    if (ch === '#' && src.substr(i, 5).toUpperCase() === '#REF!') { toks.push({ t: 'refErr' }); i += 5; continue; }
    const two = src.substr(i, 2);
    if (OPS2.indexOf(two) >= 0) { toks.push({ t: 'op', v: two }); i += 2; continue; }
    if (OPS1.indexOf(ch) >= 0) { toks.push({ t: 'op', v: ch }); i++; continue; }
    if ('(),:'.indexOf(ch) >= 0) { toks.push({ t: 'p', v: ch }); i++; continue; }
    return null;
  }
  return toks;
}
function unquote(raw) { return raw.slice(1, -1).replace(/""/g, '"'); }
/* parses a raw content starting with "="; returns the tree, or null when not valid */
function parseFormula(src) {
  if (src[0] !== '=') return null;
  const toks = tokenize(src.slice(1));
  if (!toks || toks.length === 0) return null;
  let p = 0;
  const fail = () => { throw 0; };
  const isOp = (v) => toks[p] && toks[p].t === 'op' && toks[p].v === v;
  const isP = (v) => toks[p] && toks[p].t === 'p' && toks[p].v === v;
  const binLevel = (sub, ops) => {
    let a = sub();
    while (toks[p] && toks[p].t === 'op' && ops.indexOf(toks[p].v) >= 0) {
      const op = toks[p].v;
      p++;
      a = { t: 'bin', op, a, b: sub() };
    }
    return a;
  };
  const expression = () => binLevel(concat, ['=', '<>', '<', '<=', '>', '>=']);
  const concat = () => binLevel(sum, ['&']);
  const sum = () => binLevel(product, ['+', '-']);
  const product = () => binLevel(signed, ['*', '/']);
  const signed = () => {
    if (isOp('-') || isOp('+')) { const op = toks[p].v; p++; return { t: 'un', op, a: signed() }; }
    return power();
  };
  const power = () => {
    const a = percent();
    if (isOp('^')) { p++; return { t: 'bin', op: '^', a, b: signed() }; }
    return a;
  };
  const percent = () => {
    let a = primary();
    while (isOp('%')) { p++; a = { t: 'pct', a }; }
    return a;
  };
  const refOrRange = (sheet, t) => {
    const a = { col: t.col, row: t.row, cabs: t.cabs, rabs: t.rabs };
    if (isP(':')) {
      p++;
      const nx = toks[p];
      if (!nx || nx.t !== 'ref') fail();
      p++;
      return { t: 'range', sheet, a, b: { col: nx.col, row: nx.row, cabs: nx.cabs, rabs: nx.rabs } };
    }
    return { t: 'ref', sheet, ...a };
  };
  const primary = () => {
    const t = toks[p];
    if (!t) fail();
    if (t.t === 'num') { p++; return { t: 'num', text: t.v }; }
    if (t.t === 'str') { p++; return { t: 'str', text: t.v, v: unquote(t.v) }; }
    if (t.t === 'bool') { p++; return { t: 'bool', v: t.v }; }
    if (t.t === 'refErr') { p++; return { t: 'refErr' }; }
    if (t.t === 'prefix') {
      p++;
      const nx = toks[p];
      if (!nx || nx.t !== 'ref') fail();
      p++;
      return refOrRange(t.v, nx);
    }
    if (t.t === 'ref') { p++; return refOrRange(null, t); }
    if (t.t === 'name') {
      p++;
      if (isP('(')) {
        p++;
        const args = [];
        if (isP(')')) p++;
        else {
          for (;;) {
            args.push(expression());
            if (isP(',')) { p++; continue; }
            if (isP(')')) { p++; break; }
            fail();
          }
        }
        return { t: 'call', name: t.v.toUpperCase(), args };
      }
      return { t: 'name', name: t.v.toUpperCase() };
    }
    if (t.t === 'p' && t.v === '(') {
      p++;
      const e = expression();
      if (!isP(')')) fail();
      p++;
      return { t: 'paren', a: e };
    }
    fail();
  };
  try {
    const ast = expression();
    if (p !== toks.length) return null;
    return ast;
  } catch (err) {
    return null;
  }
}

/* ---------- writing a tree back (canonical form) ---------- */
function refText(r) { return (r.cabs ? '$' : '') + colLetters(r.col) + (r.rabs ? '$' : '') + r.row; }
function rangeText(a, b) {
  const minC = a.col <= b.col ? a : b;
  const maxC = a.col > b.col ? a : b;
  const minR = a.row <= b.row ? a : b;
  const maxR = a.row > b.row ? a : b;
  return refText({ col: minC.col, cabs: minC.cabs, row: minR.row, rabs: minR.rabs }) + ':' +
    refText({ col: maxC.col, cabs: maxC.cabs, row: maxR.row, rabs: maxR.rabs });
}
function pre(sheet) { return sheet === null ? '' : quoteSheet(sheet) + '!'; }
function genNode(n) {
  switch (n.t) {
    case 'num': return n.text;
    case 'str': return n.text;
    case 'bool': return n.v ? 'TRUE' : 'FALSE';
    case 'refErr': return '#REF!';
    case 'ref': return pre(n.sheet) + refText(n);
    case 'range': return pre(n.sheet) + rangeText(n.a, n.b);
    case 'call': return n.name + '(' + n.args.map(genNode).join(',') + ')';
    case 'name': return n.name;
    case 'un': return n.op + genNode(n.a);

  const rc = rectOf(sh);
  clip = { mode, sheetName: sh.name, r1: rc.r1, c1: rc.c1, cells: copyCells(sh, rc) };
  finish();
}
function doPaste() {
  if (!clip) return;
  const sh = cur();
  const sel = rectOf(sh);
  const h = clip.cells.length, w = clip.cells[0].length;
  transact(() => {
    if (clip.mode === 'cut') {
      const src = sheetByName(clip.sheetName);
      if (src) {
        for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) {
          src.cells[clip.r1 - 1 + i][clip.c1 - 1 + j] = { raw: '', fmt: 'general' };
        }
      }
    }
    const dr = sel.r1 - clip.r1, dc = sel.c1 - clip.c1;
    for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) {
      const r = sel.r1 + i, c = sel.c1 + j;
      if (r > ROWS || c > COLS) continue;
      const cell = clip.cells[i][j];
      const raw = clip.mode === 'copy' ? adjustRaw(cell.raw, dr, dc, sh) : cell.raw;
      sh.cells[r - 1][c - 1] = { raw, fmt: cell.fmt };
    }
    sh.anchor = { r: sel.r1, c: sel.c1 };
    sh.active = { r: sel.r1, c: sel.c1 };
    if (clip.mode === 'cut') clip = null;
    return true;
  });
}
function applyFormat(f) {
  transact(() => {
    const sh = cur();
    const rc = rectOf(sh);
    for (let r = rc.r1; r <= rc.r2; r++) for (let c = rc.c1; c <= rc.c2; c++) sh.cells[r - 1][c - 1].fmt = f;
  });
}
function structureAction(axis, insert) {
  const sh = cur();
  const pos = axis === 'row' ? sh.active.r : sh.active.c;
  transact(() => { structure(sh, axis, pos, insert); return true; });
}
function sortRows(desc) {
  transact(() => {
    const sh = cur();
    const sel = rectOf(sh);
    const keyC = sh.active.c;
    const rows = [];
    for (let r = sel.r1; r <= sel.r2; r++) rows.push(r);
    const keys = rows.map((r) => valueAt(sh, r, keyC));
    const order = rows.map((_, i) => i);
    order.sort((i, j) => {
      const c = cmpKey(keys[i], keys[j], desc);
      return c !== 0 ? c : i - j;
    });
    if (order.every((v, i) => v === i)) return false;
    const saved = rows.map((r) => copyCells(sh, { r1: r, r2: r, c1: sel.c1, c2: sel.c2 })[0]);
    rows.forEach((r, k) => {
      const src = saved[order[k]];
      for (let c = sel.c1; c <= sel.c2; c++) sh.cells[r - 1][c - 1] = { ...src[c - sel.c1] };
    });
    return false;
  });
}
function rankOf(v) {
  if (v === null) return 4;
  if (isErr(v)) return 3;
  if (typeof v === 'boolean') return 2;
  if (typeof v === 'string') return 1;
  return 0;
}
function ascCmp(a, b) {
  const ra = rankOf(a), rb = rankOf(b);
  if (ra !== rb) return ra - rb;
  if (ra === 0) return a - b;
  if (ra === 1) {
    const x = a.toUpperCase(), y = b.toUpperCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }
  if (ra === 2) return Number(a) - Number(b);
  return 0;
}
function cmpKey(a, b, desc) {
  const ra = rankOf(a), rb = rankOf(b);
  if (ra === 4 || rb === 4) return ra === rb ? 0 : (ra === 4 ? 1 : -1);
  return desc ? -ascCmp(a, b) : ascCmp(a, b);
}
function fillDir(down) {
  transact(() => {
    const sh = cur();
    const sel = rectOf(sh);
    if (down ? sel.r2 === sel.r1 : sel.c2 === sel.c1) return false;
    if (down) {
      for (let c = sel.c1; c <= sel.c2; c++) {
        const src = { ...sh.cells[sel.r1 - 1][c - 1] };
        for (let r = sel.r1 + 1; r <= sel.r2; r++) {
          sh.cells[r - 1][c - 1] = { raw: adjustRaw(src.raw, r - sel.r1, 0, sh), fmt: src.fmt };
        }
      }
    } else {
      for (let r = sel.r1; r <= sel.r2; r++) {
        const src = { ...sh.cells[r - 1][sel.c1 - 1] };
        for (let c = sel.c1 + 1; c <= sel.c2; c++) {
          sh.cells[r - 1][c - 1] = { raw: adjustRaw(src.raw, 0, c - sel.c1, sh), fmt: src.fmt };
        }
      }
    }
    return true;
  });
}
function isNumberSeed(cell) {
  return cell.raw !== '' && cell.raw[0] !== '=' && typeof constValue(cell.raw) === 'number';
}
function fillSeries() {
  transact(() => {
    const sh = cur();
    const sel = rectOf(sh);
    const lines = [];
    if (sel.r1 === sel.r2) {
      const line = [];
      for (let c = sel.c1; c <= sel.c2; c++) line.push([sel.r1, c]);
      lines.push(line);
    } else {
      for (let c = sel.c1; c <= sel.c2; c++) {
        const line = [];
        for (let r = sel.r1; r <= sel.r2; r++) line.push([r, c]);
        lines.push(line);
      }
    }
    let any = false;
    for (const line of lines) {
      if (line.length < 3) continue;
      const cell = (p) => sh.cells[p[0] - 1][p[1] - 1];
      const s1 = cell(line[0]), s2 = cell(line[1]);
      if (!isNumberSeed(s1) || !isNumberSeed(s2)) continue;
      const a = constValue(s1.raw), b = constValue(s2.raw);
      const step = N(b - a);
      if (isErr(step)) continue;
      const vals = [];
      let ok = true;
      for (let i = 2; i < line.length; i++) {
        const v = N(a + i * step);
        if (isErr(v)) { ok = false; break; }
        vals.push(v);
      }
      if (!ok) continue;
      any = true;
      vals.forEach((v, k) => {
        const p = line[k + 2];
        sh.cells[p[0] - 1][p[1] - 1] = { raw: plainText(v), fmt: s1.fmt };
      });
    }
    return any;
  });
}

/* ---------- names and sheets actions ---------- */
function defineName() {
  setMsg(els.nameMsg, '');
  const nm = els.nameInput.value;
  if (!validName(nm)) return setMsg(els.nameMsg, 'Invalid name');
  if (findName(nm)) return setMsg(els.nameMsg, 'Name already used');
  if (WB.names.length >= 10) return setMsg(els.nameMsg, 'Too many names');
  transact(() => {
    const sh = cur();
    const rc = rectOf(sh);
    const single = rc.r1 === rc.r2 && rc.c1 === rc.c2;
    const target = { kind: single ? 'cell' : 'range', sheetId: sh.id, r1: rc.r1, c1: rc.c1, r2: rc.r2, c2: rc.c2 };
    WB.names.push({ name: nm, target });
    els.nameInput.value = '';
    return true;
  });
}
function deleteName() {
  setMsg(els.nameMsg, '');
  const d = findName(els.nameInput.value);
  if (!d) return setMsg(els.nameMsg, 'Unknown name');
  transact(() => {
    WB.names = WB.names.filter((x) => x !== d);
    els.nameInput.value = '';
    return true;
  });
}
function addSheet() {
  setMsg(els.sheetMsg, '');
  if (WB.sheets.length >= 5) return;
  let n = 1;
  while (WB.sheets.some((s) => s.name.toUpperCase() === 'SHEET' + n)) n++;
  const sh = newSheet('Sheet' + n);
  transact(() => {
    WB.sheets.push(sh);
    WB.active = WB.sheets.length - 1;
    syncSheetName();
    return true;
  });
}
function renameSheet() {
  setMsg(els.sheetMsg, '');
  const v = els.sheetNameInput.value;
  const sh = cur();
  if (!validSheetName(v)) return setMsg(els.sheetMsg, 'Invalid sheet name');
  if (WB.sheets.some((s) => s !== sh && s.name.toUpperCase() === v.toUpperCase())) return setMsg(els.sheetMsg, 'Sheet name already used');
  if (v === sh.name) return;
  transact(() => {
    const old = sh.name.toUpperCase();
    sh.name = v;
    rewriteAllFormulas((n) => (n.sheet !== null && n.sheet.toUpperCase() === old ? { ...n, sheet: v } : n));
    return false;
  });
}
function deleteSheet() {
  setMsg(els.sheetMsg, '');
  if (WB.sheets.length <= 1) return;
  transact(() => {
    const idx = WB.active;
    const gone = WB.sheets[idx];
    const up = gone.name.toUpperCase();
    WB.sheets.splice(idx, 1);
    WB.active = Math.min(idx, WB.sheets.length - 1);
    for (const d of WB.names) {
      if (d.target.kind !== 'removed' && d.target.sheetId === gone.id) d.target = { kind: 'removed' };
    }
    rewriteAllFormulas((n) => (n.sheet !== null && n.sheet.toUpperCase() === up ? { t: 'refErr' } : n));
    syncSheetName();
    return true;
  });
}
function switchSheet(i) {
  WB.active = i;
  syncSheetName();
  finish();
}

/* ---------- find and replace ---------- */
function asciiUpper(s) { return s.replace(/[a-z]/g, (ch) => ch.toUpperCase()); }
function findMatches(sh, needle, mc, whole) {
  const out = [];
  if (needle === '') return out;
  const nd = mc ? needle : asciiUpper(needle);
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) {
    const raw = sh.cells[r - 1][c - 1].raw;
    if (raw === '') continue;
    const h = mc ? raw : asciiUpper(raw);
    if (whole ? h === nd : h.indexOf(nd) >= 0) out.push({ r, c, idx: (r - 1) * COLS + (c - 1) });
  }
  return out;
}
function replaceOcc(raw, needle, rep, mc) {
  const h = mc ? raw : asciiUpper(raw);
  const nd = mc ? needle : asciiUpper(needle);
  let out = '', last = 0, from = 0, i;
  while ((i = h.indexOf(nd, from)) >= 0) {
    out += raw.slice(last, i) + rep;
    last = i + nd.length;
    from = last;
  }
  return out + raw.slice(last);
}
function findNext() {
  setMsg(els.findStatus, '');
  const sh = cur();
  const list = findMatches(sh, els.findInput.value, els.findCase.checked, els.findWhole.checked);
  setMsg(els.findStatus, 'Matches: ' + list.length);
  if (list.length) {
    const ai = (sh.active.r - 1) * COLS + (sh.active.c - 1);
    const pick = list.find((p) => p.idx > ai) || list[0];
    sh.anchor = { r: pick.r, c: pick.c };
    sh.active = { r: pick.r, c: pick.c };
  }
  finish();
  setMsg(els.findStatus, 'Matches: ' + list.length);
}
function replaceAll() {
  setMsg(els.findStatus, '');
  const sh = cur();
  const needle = els.findInput.value, rep = els.replaceInput.value;
  const mc = els.findCase.checked, whole = els.findWhole.checked;
  const list = findMatches(sh, needle, mc, whole);
  transact(() => {
    for (const p of list) {
      const raw = sh.cells[p.r - 1][p.c - 1].raw;
      const s = whole ? rep : replaceOcc(raw, needle, rep, mc);
      commitRaw(sh, p.r, p.c, s);
    }
    return false;
  });
  setMsg(els.findStatus, 'Replaced: ' + list.length);
}

/* ---------- CSV ---------- */
function csvField(s) { return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvExport() {
  setMsg(els.csvMsg, '');
  computeAll();
  const sh = cur();
  const raw = els.csvRaw.checked;
  let R = 0, C = 0;
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) {
    if (sh.cells[r - 1][c - 1].raw !== '') { R = Math.max(R, r); C = Math.max(C, c); }
  }
  const lines = [];
  for (let r = 1; r <= R; r++) {
    const fields = [];
    for (let c = 1; c <= C; c++) {
      const cell = sh.cells[r - 1][c - 1];
      fields.push(csvField(raw ? cell.raw : displayText(valueAt(sh, r, c), cell.fmt)));
    }
    lines.push(fields.join(','));
  }
  els.csvText.value = lines.join('\n');
}
/* reads a CSV text (02, section 2.17.2); null when malformed */
function parseCsv(t) {
  const recs = [];
  let i = 0;
  const n = t.length;
  for (;;) {
    const fields = [];
    for (;;) {
      let buf = '';
      if (t[i] === '"') {
        i++;
        for (;;) {
          if (i >= n) return null;
          if (t[i] === '"') {
            if (t[i + 1] === '"') { buf += '"'; i += 2; continue; }
            i++;
            break;
          }
          if (t[i] === '\r') { buf += ' '; i += t[i + 1] === '\n' ? 2 : 1; continue; }
          if (t[i] === '\n') { buf += ' '; i++; continue; }
          buf += t[i];
          i++;
        }
        if (i < n && t[i] !== ',' && t[i] !== '\r' && t[i] !== '\n') return null;
      } else {
        while (i < n && t[i] !== ',' && t[i] !== '\r' && t[i] !== '\n') { buf += t[i]; i++; }
      }
      fields.push(buf);
      if (i < n && t[i] === ',') { i++; continue; }
      break;
    }
    recs.push(fields);
    if (i >= n) break;
    if (t[i] === '\r') i += t[i + 1] === '\n' ? 2 : 1;
    else i++;
    if (i >= n) break;
  }
  return recs;
}
function csvImport() {
  setMsg(els.csvMsg, '');
  const text = els.csvText.value;
  if (text === '') return setMsg(els.csvMsg, 'Nothing to import');
  const recs = parseCsv(text);
  if (!recs) return setMsg(els.csvMsg, 'Invalid CSV');
  let k = 0, d = 0;
  transact(() => {
    const sh = cur();
    for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) sh.cells[r - 1][c - 1].raw = '';
    recs.forEach((rec, i) => rec.forEach((f, j) => {
      if (f === '') return;
      if (i < ROWS && j < COLS) { commitRaw(sh, i + 1, j + 1, f); k++; }
      else d++;
    }));
    return true;
  });
  setMsg(els.csvMsg, 'Imported: ' + k + ' | Dropped: ' + d);
}

/* ---------- selection and editing ---------- */
function commitEdit() {
  const sh = cur();
  commitRaw(sh, sh.active.r, sh.active.c, els.formulaInput.value);
}
function cellClick(e) {
  const el = e.target.closest('[role=gridcell]');
  if (!el) return;
  const r = Number(el.dataset.r), c = Number(el.dataset.c);
  transact(() => {
    if (editing) { commitEdit(); editing = false; }
    const sh = cur();
    sh.active = { r, c };
    if (!e.shiftKey) sh.anchor = { r, c };
  });
  els.grid.focus();
}
function formulaKey(e) {
  if (e.key === 'Escape') {
    e.preventDefault();
    editing = false;
    render();
    els.grid.focus();
    return;
  }
  if (e.key === 'Enter' || e.key === 'Tab') {
    if (e.key === 'Tab' && e.shiftKey) return;
    e.preventDefault();
    transact(() => {
      commitEdit();
      editing = false;
      const sh = cur();
      const r = Math.min(ROWS, sh.active.r + (e.key === 'Enter' ? 1 : 0));
      const c = Math.min(COLS, sh.active.c + (e.key === 'Tab' ? 1 : 0));
      sh.active = { r, c };
      sh.anchor = { r, c };
    });
    els.formulaInput.focus();
  }
}
function gridKey(e) {
  const k = e.key;
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (arrows[k]) {
    e.preventDefault();
    if (!editing) moveSel(arrows[k][0], arrows[k][1], e.shiftKey);
    return;
  }
  if (k === 'Delete' || k === 'Backspace') {
    e.preventDefault();
    if (!editing) clearSel();
    return;
  }
  if (k === 'Enter') {
    e.preventDefault();
    els.formulaInput.focus();
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    const kk = k.toLowerCase();
    if (kk === 'z') { e.preventDefault(); if (!editing) { undo(); syncSheetName(); } }
    else if (kk === 'y') { e.preventDefault(); if (!editing) { redo(); syncSheetName(); } }
  }
}

/* ---------- rendering ---------- */
function kindOf(v, raw) {
  if (raw === '' || v === null) return 'empty';
  if (typeof v === 'number') return 'number';
  if (typeof v === 'string') return 'text';
  if (typeof v === 'boolean') return 'logical';
  return 'error';
}
function targetText(t) {
  if (t.kind === 'removed') return '#REF!';
  const sh = sheetById(t.sheetId);
  if (!sh) return '#REF!';
  const p = quoteSheet(sh.name) + '!';
  if (t.kind === 'cell') return p + addr(t.r1, t.c1);
  return p + addr(t.r1, t.c1) + ':' + addr(t.r2, t.c2);
}
function summaryText(sh) {
  const rc = rectOf(sh);
  let n = 0, sum = 0;
  for (let r = rc.r1; r <= rc.r2; r++) for (let c = rc.c1; c <= rc.c2; c++) {
    const v = valueAt(sh, r, c);
    if (typeof v === 'number') { n++; sum += v; }
  }
  if (n === 0) return null;
  const s = N(sum), a = N(sum / n);
  const sTxt = isErr(s) ? '#NUM!' : generalText(s);
  const aTxt = isErr(a) ? '#NUM!' : generalText(a);
  return 'Sum: ' + sTxt + ' | Average: ' + aTxt + ' | Count: ' + n;
}
function buildGrid() {
  const grid = els.grid;
  const head = document.createElement('div');
  head.setAttribute('role', 'row');
  const corner = document.createElement('div');
  corner.setAttribute('role', 'presentation');
  head.appendChild(corner);
  for (let c = 1; c <= COLS; c++) {
    const h = document.createElement('div');
    h.setAttribute('role', 'columnheader');
    h.dataset.testid = 'col-header-' + colLetters(c);
    h.textContent = colLetters(c);
    head.appendChild(h);
  }
  grid.appendChild(head);
  els.cellEls = [];
  for (let r = 1; r <= ROWS; r++) {
    const row = document.createElement('div');
    row.setAttribute('role', 'row');
    const rh = document.createElement('div');
    rh.setAttribute('role', 'rowheader');
    rh.dataset.testid = 'row-header-' + r;
    rh.textContent = String(r);
    row.appendChild(rh);
    els.cellEls[r - 1] = [];
    for (let c = 1; c <= COLS; c++) {
      const cell = document.createElement('div');
      cell.setAttribute('role', 'gridcell');
      cell.dataset.testid = 'cell-' + addr(r, c);
      cell.dataset.r = r;
      cell.dataset.c = c;
      row.appendChild(cell);
      els.cellEls[r - 1][c - 1] = cell;
    }
    grid.appendChild(row);
  }
}
function renderTabs() {
  const list = els.tabs;
  const n = WB.sheets.length;
  els.tabEls = els.tabEls || [];
  while (els.tabEls.length < n) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    list.appendChild(b);
    els.tabEls.push(b);
  }
  while (els.tabEls.length > n) list.removeChild(els.tabEls.pop());
  WB.sheets.forEach((s, i) => {
    const b = els.tabEls[i];
    b.dataset.testid = 'sheet-tab-' + (i + 1);
    b.textContent = s.name;
    b.setAttribute('aria-selected', i === WB.active ? 'true' : 'false');
    b.onclick = () => { if (!editing) switchSheet(i); };
  });
}
function renderNames() {
  const list = els.nameList;
  list.textContent = '';
  const sorted = WB.names.slice().sort((a, b) => {
    const x = a.name.toUpperCase(), y = b.name.toUpperCase();
    return x < y ? -1 : x > y ? 1 : 0;
  });
  sorted.forEach((d, i) => {
    const li = document.createElement('div');
    li.setAttribute('role', 'listitem');
    li.dataset.testid = 'name-item-' + (i + 1);
    li.textContent = d.name + ' = ' + targetText(d.target);
    list.appendChild(li);
  });
}
function render() {
  computeAll();
  const sh = cur();
  const rc = rectOf(sh);
  for (let r = 1; r <= ROWS; r++) for (let c = 1; c <= COLS; c++) {
    const el = els.cellEls[r - 1][c - 1];
    const cell = sh.cells[r - 1][c - 1];
    const v = valueAt(sh, r, c);
    el.textContent = displayText(v, cell.fmt);
    el.setAttribute('data-kind', kindOf(v, cell.raw));
    el.setAttribute('aria-selected', sh.active.r === r && sh.active.c === c ? 'true' : 'false');
    const inSel = r >= rc.r1 && r <= rc.r2 && c >= rc.c1 && c <= rc.c2;
    el.setAttribute('data-in-selection', inSel ? 'true' : 'false');
  }
  const single = rc.r1 === rc.r2 && rc.c1 === rc.c2;
  els.nameBox.textContent = single ? addr(rc.r1, rc.c1) : addr(rc.r1, rc.c1) + ':' + addr(rc.r2, rc.c2);
  const act = sh.cells[sh.active.r - 1][sh.active.c - 1];
  if (!editing) els.formulaInput.value = act.raw;
  els.formulaInput.setAttribute('data-editing', editing ? 'true' : 'false');
  els.formatSelect.value = act.fmt;
  const sum = summaryText(sh);
  setMsg(els.summary, sum);
  els.summary.hidden = sum === null;
  renderTabs();
  renderNames();
  const ctrls = document.querySelectorAll('button, select, input, textarea');
  ctrls.forEach((el) => {
    if (el === els.formulaInput) return;
    let dis = editing;
    if (el === els.undo) dis = dis || WB.past.length === 0;
    else if (el === els.redo) dis = dis || WB.future.length === 0;
    else if (el === els.paste) dis = dis || !clip;
    else if (el === els.addSheet) dis = dis || WB.sheets.length >= 5;
    else if (el === els.deleteSheet) dis = dis || WB.sheets.length <= 1;
    el.disabled = dis;
  });
}
/* ---------- wiring ---------- */
function bind(id, fn) { document.querySelector('[data-testid="' + id + '"]').addEventListener('click', (e) => { if (!e.currentTarget.disabled) fn(); }); }
function init() {
  const $ = (id) => document.querySelector('[data-testid="' + id + '"]');

  els.nameBox = $('name-box');
  els.formulaInput = $('formula-input');
  els.formatSelect = $('format-select');
  els.summary = $('selection-summary');

  els.nameMsg = $('name-message');

  els.replaceInput = $('replace-input');
  els.findCase = $('find-case');
  els.findWhole = $('find-whole');
  els.findStatus = $('find-status');
  els.csvRaw = $('csv-raw');
  els.csvText = $('csv-text');
  els.csvMsg = $('csv-message');
  els.undo = $('undo-button');
  els.redo = $('redo-button');
  els.paste = $('paste-button');
  buildGrid();
  load();
  els.findInput.value = '';
  els.replaceInput.value = '';
  els.findCase.checked = false;
  els.findWhole.checked = false;
  els.csvRaw.checked = false;
  els.csvText.value = '';
  els.nameInput.value = '';
  setMsg(els.sheetMsg, '');
  setMsg(els.nameMsg, '');
  setMsg(els.findStatus, '');
  setMsg(els.csvMsg, '');
  syncSheetName();

  els.grid.addEventListener('click', cellClick);
  els.grid.addEventListener('keydown', gridKey);
  els.formulaInput.addEventListener('input', () => { editing = true; render(); });
  els.formulaInput.addEventListener('keydown', formulaKey);
  els.formatSelect.addEventListener('change', () => applyFormat(els.formatSelect.value));

  bind('undo-button', () => { undo(); syncSheetName(); });
  bind('redo-button', () => { redo(); syncSheetName(); });
  bind('copy-button', () => doCopy('copy'));
  bind('cut-button', () => doCopy('cut'));
  bind('paste-button', doPaste);
  bind('clear-button', clearSel);
  bind('insert-row', () => structureAction('row', true));
  bind('delete-row', () => structureAction('row', false));
  bind('insert-col', () => structureAction('col', true));
  bind('delete-col', () => structureAction('col', false));
  bind('sort-asc', () => sortRows(false));
  bind('sort-desc', () => sortRows(true));
  bind('fill-down', () => fillDir(true));
  bind('fill-right', () => fillDir(false));
  bind('fill-series', fillSeries);
  bind('add-sheet', addSheet);
  bind('rename-sheet', renameSheet);
  bind('delete-sheet', deleteSheet);
  bind('define-name', defineName);
  bind('delete-name', deleteName);
  bind('find-next', findNext);
  bind('replace-all', replaceAll);
  bind('csv-export', csvExport);
  bind('csv-import', csvImport);
  render();
}
init();
</script>
</body>
</html>
