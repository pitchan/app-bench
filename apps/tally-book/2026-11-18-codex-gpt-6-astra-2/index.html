function sortRows(dir){let q=rect(),key=pos(S().active).c,rows=Array.from({length:q.R-q.r+1},(_,j)=>({r:q.r+j,v:values[book.active][idx(key,q.r+j)]}));const rank=v=>v===null?4:iserr(v)?3:typeof v==='number'?0:typeof v==='string'?1:2;rows.sort((a,b)=>{let x=rank(a.v),y=rank(b.v);if(x===4||y===4)return x-y;return dir*(x===y?(x===3?0:cmp(a.v,b.v)):x-y)});if(rows.every((r,i)=>r.r===q.r+i))return;action(()=>{let old=clone(S().cells);rows.forEach((row,j)=>{for(let c=q.c;c<=q.C;c++)S().cells[idx(c,q.r+j)]=old[idx(c,row.r)]})},true)}
function fill(right){let q=rect();if(right?q.c===q.C:q.r===q.R)return;action(()=>{let old=clone(S().cells);cells(q).forEach(i=>{let p=pos(i),src=right?idx(q.c,p.r):idx(p.c,q.r);if(i===src)return;let a=old[src],sp=pos(src);S().cells[i]={raw:adjust(a.raw,p.c-sp.c,p.r-sp.r),format:a.format}})},true)}
function series(){let q=rect(),lines=q.r===q.R?[cells(q)]:Array.from({length:q.C-q.c+1},(_,j)=>Array.from({length:q.R-q.r+1},(_,k)=>idx(q.c+j,q.r+k))),writes=[];for(let line of lines){if(line.length<3)continue;let x=S().cells[line[0]],y=S().cells[line[1]],a=literal(x.raw),b=literal(y.raw);if(x.raw.startsWith('=')||y.raw.startsWith('=')||typeof a!=='number'||typeof b!=='number')continue;let vs=safe(()=>{let step=num(b-a);return line.slice(2).map((_,k)=>num(a+(k+2)*step))});if(iserr(vs))continue;line.slice(2).forEach((i,j)=>writes.push([i,{raw:plain(vs[j]),format:x.format}]))}if(writes.length)action(()=>writes.forEach(([i,c])=>S().cells[i]=c),true)}
function find(replace){let needle=$('find-input').value,rep=$('replace-input').value,whole=$('find-whole').checked,fold=s=>$('find-case').checked?s:s.replace(/[a-z]/g,c=>c.toUpperCase()),n=fold(needle),matches=S().cells.map((c,i)=>({i,raw:c.raw})).filter(c=>n&&c.raw&&(whole?fold(c.raw)===n:fold(c.raw).includes(n)));msg('find-status',(replace?'Replaced: ':'Matches: ')+matches.length);if(!replace){if(matches.length){let hit=matches.find(c=>c.i>S().active)||matches[0];select(hit.i);render();save()}return}action(()=>{matches.forEach(({i,raw})=>{let out=rep;if(!whole){out='';let st=0,k,src=fold(raw);while((k=src.indexOf(n,st))>=0){out+=raw.slice(st,k)+rep;st=k+n.length}out+=raw.slice(st)}commit(S().cells[i],out)})})}
function exportCSV(){let R=0,C=0;S().cells.forEach((c,i)=>{if(c.raw){let p=pos(i);R=Math.max(R,p.r);C=Math.max(C,p.c)}});let rows=[];for(let r=1;r<=R;r++){let row=[];for(let c=1;c<=C;c++){let i=idx(c,r),v=$('csv-raw').checked?S().cells[i].raw:display(values[book.active][i],S().cells[i].format);row.push(/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v)}rows.push(row.join(','))}$('csv-text').value=rows.join('\n')}
function readCSV(s){let rows=[],row=[],i=0;while(true){let out='';if(s[i]==='"'){i++;let closed=false;while(i<s.length){if(s[i]==='"'){if(s[i+1]==='"'){out+='"';i+=2}else{i++;closed=true;break}}else if(s[i]==='\r'||s[i]==='\n'){if(s[i]==='\r'&&s[i+1]==='\n')i++;i++;out+=' '}else out+=s[i++]}if(!closed||i<s.length&&![',','\r','\n'].includes(s[i]))return null}else{while(i<s.length&&![',','\r','\n'].includes(s[i]))out+=s[i++]}row.push(out);if(i===s.length){rows.push(row);break}if(s[i]===','){i++;continue}rows.push(row);row=[];if(s[i]==='\r'&&s[i+1]==='\n')i++;i++;if(i===s.length)break}return rows}
function importCSV(){let text=$('csv-text').value;if(!text)return msg('csv-message','Nothing to import');let rows=readCSV(text);if(!rows)return msg('csv-message','Invalid CSV');let k=0,d=0;action(()=>{S().cells.forEach(c=>c.raw='');rows.forEach((row,r)=>row.forEach((v,c)=>{if(v==='')return;if(r>=12||c>=8){d++;return}commit(S().cells[r*8+c],v);k++}))},true);msg('csv-message','Imported: '+k+' | Dropped: '+d)}
$('sheet-name-input').value=S().name;['name-input','find-input','replace-input','csv-text'].forEach(id=>$(id).value='');['find-case','find-whole','csv-raw'].forEach(id=>$(id).checked=false);render();
