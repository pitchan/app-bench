<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#1a2030; --muted:#465064; --line:#c6ccd8; --line-strong:#8f98ab;
  --accent:#1f4fbf; --sel:#dce7fb; --head:#e8ebf1; --head-on:#cbd8f2; --err:#a3122a; --note:#eef2fb;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app-header{background-color:#182033;color:#ffffff;padding:10px 16px}
.app-header h1{margin:0 auto;max-width:1240px;font-size:17px;font-weight:650;letter-spacing:.01em}
main{max-width:1272px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px}
.card{background-color:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}

button,select,input,textarea{font:inherit;color:var(--ink)}
button{background-color:#ffffff;border:1px solid var(--line-strong);border-radius:6px;padding:5px 10px;min-height:32px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background-color:#edf1f9}
button:active:not(:disabled){background-color:#dfe6f5}
button:disabled{color:#7c8496;background-color:#eceef2;border-color:#cfd4de;cursor:default}
select,input[type=text],textarea{background-color:#ffffff;border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;min-height:32px;min-width:0;max-width:100%}
input[type=text]:disabled,select:disabled,textarea:disabled{background-color:#eceef2;color:#6b7386;border-color:#cfd4de}
input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none}
label{color:var(--muted);font-size:12.5px;font-weight:600}
button:focus,select:focus,input:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
[role=grid]:focus{outline:3px solid var(--accent);outline-offset:-3px}

.toolbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tgroup label{margin-right:2px}

.fbar{display:flex;gap:6px;align-items:stretch}
.name-box{flex:none;min-width:84px;display:flex;align-items:center;justify-content:center;padding:0 8px;border:1px solid var(--line-strong);border-radius:6px;background-color:var(--head);font-weight:650;font-variant-numeric:tabular-nums}
.fx{flex:none;display:flex;align-items:center;color:var(--muted);font-style:italic;font-weight:600;padding:0 2px}
.fbar input{flex:1 1 auto;width:100%;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13.5px}
.fbar input[data-editing=true]{border-color:var(--accent);background-color:#f6f9ff}

.grid-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:8px;background-color:var(--panel)}
[role=grid]{min-width:812px;user-select:none;-webkit-user-select:none;cursor:cell;font-variant-numeric:tabular-nums}
.g-row{display:grid;grid-template-columns:44px repeat(8,minmax(96px,1fr))}
.g-row>div{height:30px;line-height:29px;padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:pre;text-overflow:ellipsis;min-width:0}
.g-row>div:last-child{border-right:0}
.g-row:last-child>div{border-bottom:0}
[role=columnheader],[role=rowheader],.g-corner{background-color:var(--head);color:var(--ink);text-align:center;font-weight:600;font-size:12.5px;cursor:default}
[role=columnheader][data-on=true],[role=rowheader][data-on=true]{background-color:var(--head-on)}
[role=gridcell]{background-color:#ffffff;color:var(--ink)}
[role=gridcell][data-kind=number]{text-align:right}
[role=gridcell][data-kind=logical]{text-align:center}
[role=gridcell][data-kind=error]{color:var(--err);text-align:center}
[role=gridcell][data-in-selection=true]{background-color:var(--sel)}
[role=gridcell][aria-selected=true]{background-color:#ffffff;box-shadow:inset 0 0 0 2px var(--accent)}

.status-line{min-height:24px;display:flex;align-items:center;padding:0 2px}
.summary{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.sheet-bar{display:flex;flex-direction:column;gap:8px}
.tab-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
[role=tab]{background-color:var(--head);border-color:var(--line-strong);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:pre;font-weight:600}
[role=tab][aria-selected=true],[role=tab][aria-selected=true]:hover:not(:disabled){background-color:var(--accent);border-color:var(--accent);color:#ffffff}
[role=tab][aria-selected=true]:disabled{background-color:#d5ddf0;border-color:#b9c4de;color:#59627a}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.field{display:flex;flex-direction:column;gap:2px;flex:1 1 160px;min-width:0}
.field input,.field textarea{width:100%}
.msg{margin:0;padding:5px 9px;border-radius:6px;background-color:var(--note);color:var(--ink);font-weight:600;overflow-wrap:anywhere;border-left:3px solid var(--accent)}

.panels{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.panel{display:flex;flex-direction:column;gap:8px;min-width:0}
.check{display:inline-flex;align-items:center;gap:6px}
.check label{color:var(--ink);font-size:13.5px;font-weight:500}
.name-list{display:flex;flex-direction:column;gap:4px}
.name-list>div{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background-color:#f7f8fb;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12.5px;overflow-wrap:anywhere;white-space:pre-wrap}
textarea{width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px;display:block}

@media (max-width:900px){.panels{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
  main{padding:8px 8px 28px;gap:8px}
  .app-header{padding:9px 12px}
  button{min-height:36px;padding:6px 9px}
  select,input[type=text]{min-height:36px}
  .name-box{min-width:72px}
  .fx{display:none}
}
</style>
</head>
<body>
<header data-testid="app-header" class="app-header"><h1>Claude Fable 5.2</h1></header>
<main>
  <div data-testid="toolbar" class="toolbar card">
    <div class="tgroup">
      <button type="button" data-testid="undo-button">Undo</button>
      <button type="button" data-testid="redo-button">Redo</button>
    </div>
    <div class="tgroup">
      <button type="button" data-testid="copy-button">Copy</button>
      <button type="button" data-testid="cut-button">Cut</button>
      <button type="button" data-testid="paste-button">Paste</button>
      <button type="button" data-testid="clear-button">Clear</button>
    </div>
    <div class="tgroup">
      <button type="button" data-testid="insert-row">Insert row</button>
      <button type="button" data-testid="delete-row">Delete row</button>
      <button type="button" data-testid="insert-col">Insert column</button>
      <button type="button" data-testid="delete-col">Delete column</button>
    </div>
    <div class="tgroup">
      <button type="button" data-testid="sort-asc">Sort ascending</button>
      <button type="button" data-testid="sort-desc">Sort descending</button>
    </div>
    <div class="tgroup">
      <button type="button" data-testid="fill-down">Fill down</button>
      <button type="button" data-testid="fill-right">Fill right</button>
      <button type="button" data-testid="fill-series">Fill series</button>
    </div>
    <div class="tgroup">
      <label for="format-select">Number format</label>
      <select id="format-select" data-testid="format-select" autocomplete="off">
        <option value="general">General</option>
        <option value="fixed2">1,234.50</option>
        <option value="percent1">12.5%</option>
        <option value="date">2024-12-31</option>
      </select>
    </div>
  </div>

  <div class="fbar">
    <div data-testid="name-box" class="name-box">A1</div>
    <span class="fx" aria-hidden="true">fx</span>
    <input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="grid-wrap">
    <div data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></div>
  </div>

  <div class="status-line"><div data-testid="selection-summary" class="summary" hidden></div></div>

  <div data-testid="sheet-bar" class="sheet-bar card">
    <div class="tab-row">
      <div data-testid="sheet-tabs" class="tabs" role="tablist" aria-label="Sheets"></div>
      <button type="button" data-testid="add-sheet">Add sheet</button>
    </div>
    <div class="row">
      <div class="field">
        <label for="sheet-name-input">Sheet name</label>
        <input type="text" id="sheet-name-input" data-testid="sheet-name-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
    <div class="row">
      <button type="button" data-testid="rename-sheet">Rename sheet</button>
      <button type="button" data-testid="delete-sheet">Delete sheet</button>
    </div>
    <p data-testid="sheet-message" class="msg" aria-live="polite" hidden></p>
  </div>

  <div class="panels">
    <div data-testid="names-panel" class="panel card">
      <div class="field">
        <label for="name-input">Name</label>
        <input type="text" id="name-input" data-testid="name-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="row">
        <button type="button" data-testid="define-name">Define name</button>
        <button type="button" data-testid="delete-name">Delete name</button>
      </div>
      <p data-testid="name-message" class="msg" aria-live="polite" hidden></p>
      <div data-testid="name-list" class="name-list" role="list" aria-label="Names"></div>
    </div>

    <div data-testid="find-panel" class="panel card">
      <div class="field">
        <label for="find-input">Find</label>
        <input type="text" id="find-input" data-testid="find-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="replace-input">Replace with</label>
        <input type="text" id="replace-input" data-testid="replace-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="row">
        <span class="check"><input type="checkbox" id="find-case" data-testid="find-case" autocomplete="off"><label for="find-case">Match case</label></span>
        <span class="check"><input type="checkbox" id="find-whole" data-testid="find-whole" autocomplete="off"><label for="find-whole">Whole cell</label></span>
      </div>
      <div class="row">
        <button type="button" data-testid="find-next">Find next</button>
        <button type="button" data-testid="replace-all">Replace all</button>
      </div>
      <p data-testid="find-status" class="msg" aria-live="polite" hidden></p>
    </div>

    <div data-testid="csv-panel" class="panel card">
      <div class="row">
        <span class="check"><input type="checkbox" id="csv-raw" data-testid="csv-raw" autocomplete="off"><label for="csv-raw">Raw contents</label></span>
      </div>
      <div class="row">
        <button type="button" data-testid="csv-export">Export CSV</button>
        <button type="button" data-testid="csv-import">Import CSV</button>
      </div>
      <div class="field">
        <label for="csv-text">CSV</label>
        <textarea id="csv-text" data-testid="csv-text" rows="5" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
      <p data-testid="csv-message" class="msg" aria-live="polite" hidden></p>
    </div>
  </div>
</main>

<script>
(function () {
'use strict';

/* ================= constants ================= */
var ROWS = 12, COLS = 8, NCELL = 96, MAXSER = 2958464, KEY = 'tally-book';
var FORMATS = ['general', 'fixed2', 'percent1', 'date'];
var LETTERS = 'ABCDEFGH';
var ERR = {};
['SYNTAX:#SYNTAX!', 'NAME:#NAME?', 'ARGS:#ARGS!', 'REF:#REF!', 'VALUE:#VALUE!', 'DIV0:#DIV/0!', 'NUM:#NUM!', 'NA:#N/A', 'CYCLE:#CYCLE!']
  .forEach(function (s) { var p = s.split(':'); ERR[p[0]] = new Err(p[1]); });
function Err(e) { this.e = e; }
function isErr(v) { return v instanceof Err; }

/* ================= numbers ================= */
function N(x) { var n = Number(x.toPrecision(12)); return n === 0 ? 0 : n; }
function num(x) {
  if (typeof x !== 'number' || !isFinite(x)) return ERR.NUM;
  var n = N(x);
  return Math.abs(n) >= 1e15 ? ERR.NUM : n;
}
function decParts(x) {
  var s = Math.abs(x).toPrecision(12), int, frac, ei = s.indexOf('e');
  if (ei < 0) {
    var p = s.indexOf('.');
    if (p < 0) { int = s; frac = ''; } else { int = s.slice(0, p); frac = s.slice(p + 1); }
  } else {
    var mant = s.slice(0, ei).replace('.', ''), pp = 1 + Number(s.slice(ei + 1));
    if (pp <= 0) { int = '0'; frac = '0'.repeat(-pp) + mant; }
    else if (pp >= mant.length) { int = mant + '0'.repeat(pp - mant.length); frac = ''; }
    else { int = mant.slice(0, pp); frac = mant.slice(pp); }
  }
  return { neg: x < 0, int: int, frac: frac };
}
/* mode: 0 = ties away from zero, 1 = away from zero, -1 = toward zero */
function roundDec(x, d, mode) {
  var p = decParts(x), all = p.int + p.frac, c = p.int.length + d;
  if (c < 0) { all = '0'.repeat(-c) + all; c = 0; }
  var kept, bump = false;
  if (c >= all.length) kept = all + '0'.repeat(c - all.length);
  else {
    kept = all.slice(0, c);
    var dropped = all.slice(c);
    if (mode === 0) bump = dropped.charCodeAt(0) >= 53;
    else if (mode === 1) bump = /[1-9]/.test(dropped);
  }
  var k = BigInt(kept || '0');
  if (bump) k += 1n;
  var ks = k.toString(), int, frac;
  if (d > 0) { ks = ks.padStart(d + 1, '0'); int = ks.slice(0, ks.length - d); frac = ks.slice(ks.length - d); }
  else { int = k === 0n ? '0' : ks + '0'.repeat(-d); frac = ''; }
  return { neg: p.neg && k !== 0n, int: int, frac: frac };
}
function partsToNumber(r) { return Number((r.neg ? '-' : '') + r.int + (r.frac ? '.' + r.frac : '')); }
function general(x) {
  var r = roundDec(x, 6, 0), f = r.frac.replace(/0+$/, '');
  return (r.neg ? '-' : '') + r.int + (f ? '.' + f : '');
}
function fixedText(x, k, group, pct) {
  var r = roundDec(x, k, 0), i = r.int;
  if (group) i = i.replace(/\B(?=(\d{3})+$)/g, ',');
  return (r.neg ? '-' : '') + i + (k ? '.' + r.frac : '') + (pct ? '%' : '');
}
function plain(x) {
  var p = decParts(x), f = p.frac.replace(/0+$/, '');
  return (p.neg ? '-' : '') + p.int + (f ? '.' + f : '');
}

/* ================= dates ================= */
function daysFromCivil(y, m, d) {
  if (m <= 2) y -= 1;
  var era = Math.floor(y / 400), yoe = y - era * 400;
  var doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
  var doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}
var EPOCH = daysFromCivil(1900, 1, 1) - 1;
function serialOf(y, m, d) { return daysFromCivil(y, m, d) - EPOCH; }
function civil(serial) {
  var z = serial + EPOCH + 719468, era = Math.floor(z / 146097), doe = z - era * 146097;
  var yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
  var y = yoe + era * 400, doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  var mp = Math.floor((5 * doy + 2) / 153), d = doy - Math.floor((153 * mp + 2) / 5) + 1, m = mp < 10 ? mp + 3 : mp - 9;
  if (m <= 2) y += 1;
  return [y, m, d];
}
function isLeap(y) { return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); }
function dim(y, m) { return m === 2 ? (isLeap(y) ? 29 : 28) : (m === 4 || m === 6 || m === 9 || m === 11) ? 30 : 31; }
function pad(n, w) { return String(n).padStart(w, '0'); }
function dateText(serial) { var a = civil(serial); return pad(a[0], 4) + '-' + pad(a[1], 2) + '-' + pad(a[2], 2); }
function showNum(x, fmt) {
  if (fmt === 'fixed2') return fixedText(x, 2, true, false);
  if (fmt === 'percent1') return fixedText(N(x * 100), 1, false, true);
  if (fmt === 'date') { var d = Math.floor(x); if (d >= 1 && d <= MAXSER) return dateText(d); }
  return general(x);
}

/* ================= entered content ================= */
var RE_DATE = /^(\d{4})-(\d{2})-(\d{2})$/, RE_NUM = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
function dateEntry(t) {
  var m = RE_DATE.exec(t);
  if (!m) return null;
  var y = +m[1], mo = +m[2], d = +m[3];
  if (y < 1900 || mo < 1 || mo > 12 || d < 1 || d > dim(y, mo)) return null;
  return serialOf(y, mo, d);
}
function entryNumber(t) {
  if (!RE_NUM.test(t)) return null;
  var pct = t.charAt(t.length - 1) === '%', x = Number(pct ? t.slice(0, -1) : t);
  if (pct) x /= 100;
  if (!isFinite(x)) return null;
  x = N(x);
  return Math.abs(x) < 1e15 ? x : null;
}
function trimSp(s) { return s.replace(/^ +/, '').replace(/ +$/, ''); }
function classify(s) {
  if (s === '') return { k: 'empty' };
  var c0 = s.charAt(0);
  if (c0 === '=') return { k: 'formula' };
  if (c0 === "'") return { k: 'text', v: s.slice(1) };
  var t = trimSp(s), d = dateEntry(t);
  if (d !== null) return { k: 'number', v: d, date: true };
  d = entryNumber(t);
  if (d !== null) return { k: 'number', v: d };
  var u = t.toUpperCase();
  if (u === 'TRUE') return { k: 'logical', v: true };
  if (u === 'FALSE') return { k: 'logical', v: false };
  return { k: 'text', v: s };
}
var classCache = new Map();
function classifyC(s) {
  var c = classCache.get(s);
  if (!c) { if (classCache.size > 4000) classCache.clear(); c = classify(s); classCache.set(s, c); }
  return c;
}

/* ================= formula language ================= */
var RE_WORD = /[A-Za-z0-9_$]+/y, RE_NUMTOK = /\d+(?:\.\d+)?|\.\d+/y, RE_REF = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/;
var CMP_OPS = { '=': 1, '<>': 1, '<': 1, '<=': 1, '>': 1, '>=': 1 };
function stripZeros(s) { return s.replace(/^0+(?=\d)/, ''); }
function tokenize(src) {
  var toks = [], i = 0, n = src.length, m, j, v;
  while (i < n) {
    var ch = src.charAt(i);
    if (ch === ' ') { i++; continue; }
    if ((ch >= '0' && ch <= '9') || ch === '.') {
      RE_NUMTOK.lastIndex = i; m = RE_NUMTOK.exec(src);
      if (!m) return null;
      toks.push({ t: 'num', raw: m[0] }); i += m[0].length; continue;
    }
    if (ch === '"') {
      j = i + 1; v = '';
      for (;;) {
        if (j >= n) return null;
        if (src.charAt(j) === '"') { if (src.charAt(j + 1) === '"') { v += '"'; j += 2; } else { j++; break; } }
        else v += src.charAt(j++);
      }
      toks.push({ t: 'str', raw: src.slice(i, j), v: v }); i = j; continue;
    }
    if (ch === "'") {
      j = i + 1; v = '';
      for (;;) {
        if (j >= n) return null;
        if (src.charAt(j) === "'") { if (src.charAt(j + 1) === "'") { v += "'"; j += 2; } else { j++; break; } }
        else v += src.charAt(j++);
      }
      if (v === '' || src.charAt(j) !== '!') return null;
      toks.push({ t: 'prefix', name: v }); i = j + 1; continue;
    }
    if ((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || ch === '_' || ch === '$') {
      RE_WORD.lastIndex = i; m = RE_WORD.exec(src);
      var w = m[0]; i += w.length;
      if (src.charAt(i) === '!') {
        if (w.indexOf('$') >= 0) return null;
        toks.push({ t: 'prefix', name: w }); i++; continue;
      }
      var u = w.toUpperCase();
      if (u === 'TRUE' || u === 'FALSE') toks.push({ t: 'bool', v: u === 'TRUE' });
      else if ((m = RE_REF.exec(w))) toks.push({ t: 'ref', ca: m[1] === '$', cs: m[2].toUpperCase(), ra: m[3] === '$', rs: stripZeros(m[4]) });
      else if (w.indexOf('$') < 0) toks.push({ t: 'name', name: u });
      else return null;
      continue;
    }
    if (ch === '#') {
      if (src.substr(i, 5).toUpperCase() === '#REF!') { toks.push({ t: 'referr' }); i += 5; continue; }
      return null;
    }
    var two = src.substr(i, 2);
    if (two === '<>' || two === '<=' || two === '>=') { toks.push({ t: 'op', v: two }); i += 2; continue; }
    if ('+-*/^&%=<>'.indexOf(ch) >= 0) { toks.push({ t: 'op', v: ch }); i++; continue; }
    if ('(),:'.indexOf(ch) >= 0) { toks.push({ t: 'punct', v: ch }); i++; continue; }
    return null;
  }
  return toks;

      }

    }
    setMsg(el['find-status'], 'Matches: ' + n);
  });
  on('replace-all', 'click', function () {
    if (editing) return;
    setMsg(el['find-status'], '');
    var needle = el['find-input'].value, rep = el['replace-input'].value, mc = el['find-case'].checked, whole = el['find-whole'].checked, n = 0;
    step(function () {
      var sh = cur(), ch = false;
      for (var i = 0; i < NCELL; i++) {
        if (!cellMatches(sh.cells[i], needle, mc, whole)) continue;
        n++;
        if (commitTo(sh, i, replaceIn(sh.cells[i], needle, rep, mc, whole))) ch = true;
      }
      return ch;
    });
    setMsg(el['find-status'], 'Replaced: ' + n);
  });

  /* CSV */
  on('csv-export', 'click', function () {
    if (editing) return;
    setMsg(el['csv-message'], '');
    el['csv-text'].value = csvWrite(cur(), el['csv-raw'].checked);
  });
  on('csv-import', 'click', function () {
    if (editing) return;
    setMsg(el['csv-message'], '');
    var text = el['csv-text'].value;
    if (text === '') { setMsg(el['csv-message'], 'Nothing to import'); return; }
    var recs = csvRead(text);
    if (!recs) { setMsg(el['csv-message'], 'Invalid CSV'); return; }
    var k = 0, d = 0;
    step(function () {
      var sh = cur(), i, j;
      for (i = 0; i < NCELL; i++) sh.cells[i] = '';
      for (i = 0; i < recs.length; i++) for (j = 0; j < recs[i].length; j++) {
        if (recs[i][j] === '') continue;
        if (i < ROWS && j < COLS) { commitTo(sh, i * COLS + j, recs[i][j]); k++; } else d++;
      }
      return true;
    });
    setMsg(el['csv-message'], 'Imported: ' + k + ' | Dropped: ' + d);
  });
}

function init() {
  W = load() || newBook();
  buildGrid();
  bind();
  ['name-input', 'find-input', 'replace-input', 'csv-text'].forEach(function (id) { el[id].value = ''; });
  ['find-case', 'find-whole', 'csv-raw'].forEach(function (id) { el[id].checked = false; });
  ['sheet-message', 'name-message', 'find-status', 'csv-message'].forEach(function (id) { setMsg(el[id], ''); });
  fin.value = '';
  syncSheetName();
  recalc();
  render();
}
init();
})();
</script>
</body>
