function findMatches(){let needle=$('find-input').value;if(!needle)return [];let sh=sheet(),cs=[];for(let r=0;r<12;r++)for(let c=0;c<8;c++){let s=sh.cells[r][c].raw,hay=$('find-case').checked?s:s.replace(/[A-Z]/g,x=>x.toLowerCase());let n=$('find-case').checked?needle:needle.replace(/[A-Z]/g,x=>x.toLowerCase());if($('find-whole').checked?hay===n:hay.includes(n))cs.push([r,c])}return cs}bind('find-next',()=>{let m=findMatches();msg('find-status',`Matches: ${m.length}`);if(m.length){findCursor=(findCursor+1)%m.length;sheet().anchor=sheet().pos=m[findCursor];render()}},'find-status');bind('replace-all',()=>{let m=findMatches(),needle=$('find-input').value,rep=$('replace-input').value,old=snap();for(let [r,c] of m){let o=cell(sheet(),r,c),raw=o.raw;if($('find-whole').checked)raw=rep;else{let q=needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags=$('find-case').checked?'g':'gi';raw=raw.replace(new RegExp(q,flags),rep)}commit(raw,r,c,false)}if(old!==snap())hist();msg('find-status',`Replaced: ${m.length}`);render()},'find-status');
function quoteCSV(s){return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}bind('csv-export',()=>{let sh=sheet(),R=-1,C=-1;for(let r=0;r<12;r++)for(let c=0;c<8;c++)if(sh.cells[r][c].raw!==''){R=Math.max(R,r);C=Math.max(C,c)}if(R<0){$('csv-text').value='';return}let lines=[];for(let r=0;r<=R;r++){let row=[];for(let c=0;c<=C;c++){let o=sh.cells[r][c],v=valueAt(active,r,c,new Set());row.push(quoteCSV($('csv-raw').checked?o.raw:display(v,o.fmt)))}lines.push(row.join(','))}$('csv-text').value=lines.join('\n')},'csv-message');function readCSV(t){let rows=[],row=[],field='',i=0,quoted=false,atStart=true;while(i<t.length){let ch=t[i++];if(quoted){if(ch==='"'){if(t[i]==='"'){field+='"';i++}else{quoted=false;if(i<t.length&&t[i]!==','&&t[i]!=='\r'&&t[i]!=='\n')throw 0}}else if(ch==='\r'||ch==='\n'){if(ch==='\r'&&t[i]==='\n')i++;field+=' '}else field+=ch}else if(atStart&&ch==='"'){quoted=true;atStart=false}else if(ch===','){row.push(field);field='';atStart=true}else if(ch==='\r'||ch==='\n'){if(ch==='\r'&&t[i]==='\n')i++;row.push(field);rows.push(row);row=[];field='';atStart=true}else{field+=ch;atStart=false}}if(quoted)throw 0;if(field!==''||row.length||(!t.endsWith('\n')&&!t.endsWith('\r'))){row.push(field);rows.push(row)}return rows}bind('csv-import',()=>{let t=$('csv-text').value;if(!t){msg('csv-message','Nothing to import');return}let rows;try{rows=readCSV(t)}catch(e){msg('csv-message','Invalid CSV');return}let old=snap(),sh=sheet(),k=0,d=0;for(let r=0;r<12;r++)for(let c=0;c<8;c++)sh.cells[r][c].raw='';rows.forEach((row,r)=>row.forEach((x,c)=>{if(x!==''){if(r<12&&c<8){commit(x,r,c,false);k++}else d++}}));hist();msg('csv-message',`Imported: ${k} | Dropped: ${d}`);render()},'csv-message');
restore();$('formula-input').value='';$('formula-input').dataset.editing='false';$('name-input').value='';$('find-input').value='';$('replace-input').value='';$('csv-text').value='';render();persist();})();
</script></body></html>
