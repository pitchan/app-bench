<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
*{box-sizing:border-box}
html{background:#eef1f7}
body{margin:0;background:#eef1f7;color:#111827;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#1e293b;color:#fff;padding:10px 16px}
header h1{margin:0;font-size:20px;font-weight:700;color:#fff}
main{max-width:1100px;margin:0 auto;padding:10px 16px 24px;display:flex;flex-direction:column;gap:10px}
.panel{background:#fff;border:1px solid #b6bfd0;border-radius:6px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=text],textarea{font:inherit;color:#111827;background:#fff;border:1px solid #6b7690;border-radius:4px;padding:5px 9px;min-height:34px}
button{cursor:pointer;background:#f1f4fa}
button:hover:not(:disabled){background:#dde5f5}
button:disabled,select:disabled,input:disabled,textarea:disabled{color:#6b7280;background:#e5e7eb;border-color:#b6bfd0;cursor:not-allowed}
label{display:inline-flex;align-items:center;gap:6px;color:#111827}
input[type=checkbox]{width:18px;height:18px;margin:0}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#nameBox{min-width:90px;padding:6px 10px;background:#fff;border:1px solid #6b7690;border-radius:4px;font-weight:600;color:#111827}
.fbar label{flex:1 1 220px}
.fbar label input{flex:1;min-width:0}
.gridwrap{overflow-x:auto;background:#fff;border:1px solid #6b7690;border-radius:4px}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:620px}
table:focus-visible{outline:3px solid #1d4ed8;outline-offset:-3px}
th,td{border:1px solid #c5ccdb;height:34px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#111827}
th{background:#e3e8f2;font-weight:600;text-align:center}
th.rh{width:44px}
td{background:#fff;cursor:cell}
td[data-kind=number]{text-align:right}
td[data-kind=error]{color:#8a1414;text-align:center}
td[data-kind=logical]{text-align:center}
td[data-in-selection=true]{background:#dbeafe}
td[aria-selected=true]{background:#bfdbfe;box-shadow:inset 0 0 0 2px #1d4ed8}
#summary,.msg{padding:5px 10px;border-radius:4px;background:#fff4d6;color:#4a2f00;border:1px solid #d9b45a}
#summary{background:#e0ecff;color:#10224a;border-color:#7b96d4;align-self:flex-start}
[hidden]{display:none!important}
[role=tablist]{display:flex;flex-wrap:wrap;gap:4px;max-width:100%}
[role=tab]{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#f1f4fa;color:#111827}
[role=tab][aria-selected=true]{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
[role=tab][aria-selected=true]:hover:not(:disabled){background:#1e3a8a}
[role=list]{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
[role=listitem]{background:#f1f4fa;border:1px solid #b6bfd0;border-radius:4px;padding:3px 8px;color:#111827;max-width:100%;overflow-wrap:anywhere}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace}
.grow{flex:1 1 100%;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.row input[type=text]{min-width:0;flex:1 1 120px}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Sonnet 5.5</h1></header>
<main>
<div class="panel" data-testid="toolbar">
<button data-testid="undo-button">Undo</button>
<button data-testid="redo-button">Redo</button>
<button data-testid="copy-button">Copy</button>
<button data-testid="cut-button">Cut</button>
<button data-testid="paste-button">Paste</button>
<button data-testid="clear-button">Clear</button>
<button data-testid="insert-row">Insert row</button>
<button data-testid="delete-row">Delete row</button>
<button data-testid="insert-col">Insert column</button>
<button data-testid="delete-col">Delete column</button>
<button data-testid="sort-asc">Sort ascending</button>
<button data-testid="sort-desc">Sort descending</button>
<button data-testid="fill-down">Fill down</button>
<button data-testid="fill-right">Fill right</button>
<button data-testid="fill-series">Fill series</button>
<label>Number format <select data-testid="format-select" autocomplete="off"><option value="general">General</option><option value="fixed2">1,234.50</option><option value="percent1">12.5%</option><option value="date">2024-12-31</option></select></label>
</div>
<div class="fbar">
<div id="nameBox" data-testid="name-box"></div>

</div>
<div class="gridwrap"><table role="grid" aria-label="Sheet" tabindex="0" data-testid="grid" id="grid"></table></div>
<div id="summary" data-testid="selection-summary" hidden></div>

<button data-testid="add-sheet">Add sheet</button>
<label>Sheet name <input type="text" data-testid="sheet-name-input" autocomplete="off"></label>

</div>
<div class="panel" data-testid="names-panel">

<div class="panel" data-testid="find-panel">

<label>Replace with <input type="text" data-testid="replace-input" autocomplete="off"></label>

<label><input type="checkbox" data-testid="find-whole" autocomplete="off">Whole cell</label>

<div class="msg" data-testid="find-status" hidden></div>
</div>

<label><input type="checkbox" data-testid="csv-raw" autocomplete="off">Raw contents</label>

<div class="grow"><label style="display:flex;flex-direction:column;align-items:stretch;gap:4px">CSV <textarea data-testid="csv-text" autocomplete="off" spellcheck="false"></textarea></label></div>
</div>
</main>
<script>
"use strict";
/* ================= ENGINE ================= */
class Err{constructor(e){this.e=e}}
const E=c=>new Err(c);
const N=x=>{const y=Number(x.toPrecision(12));return y===0?0:y};
const num=x=>{const n=N(x);if(!isFinite(n)||Math.abs(n)>=1e15)return E('#NUM!');return n};
const FUNCS=['SUM','AVERAGE','MIN','MAX','COUNT','COUNTA','ROUND','ROUNDUP','ROUNDDOWN','ABS','INT','MOD','IF','AND','OR','NOT','IFERROR','ISERROR','ISBLANK','CHOOSE','LEN','UPPER','LOWER','TRIM','LEFT','RIGHT','MID','CONCAT','REPT','FIND','SUBSTITUTE','TEXT','MATCH','INDEX','VLOOKUP','COUNTIF','COUNTIFS','SUMIF','SUMIFS','AVERAGEIF','DATE','YEAR','MONTH','DAY','WEEKDAY','EDATE','DAYS'];
const ARITY={SUM:[1,99],AVERAGE:[1,99],MIN:[1,99],MAX:[1,99],COUNT:[1,99],COUNTA:[1,99],ROUND:[2,2],ROUNDUP:[2,2],ROUNDDOWN:[2,2],ABS:[1,1],INT:[1,1],MOD:[2,2],IF:[3,3],AND:[1,99],OR:[1,99],NOT:[1,1],IFERROR:[2,2],ISERROR:[1,1],ISBLANK:[1,1],CHOOSE:[2,99],LEN:[1,1],UPPER:[1,1],LOWER:[1,1],TRIM:[1,1],LEFT:[2,2],RIGHT:[2,2],MID:[3,3],CONCAT:[1,99],REPT:[2,2],FIND:[2,3],SUBSTITUTE:[3,4],TEXT:[2,2],MATCH:[2,3],INDEX:[2,3],VLOOKUP:[3,4],COUNTIF:[2,2],COUNTIFS:[2,99,'even'],SUMIF:[3,3],SUMIFS:[3,99,'odd'],AVERAGEIF:[2,3],DATE:[3,3],YEAR:[1,1],MONTH:[1,1],DAY:[1,1],WEEKDAY:[1,2],EDATE:[2,2],DAYS:[2,2]};
const colName=n=>{let s='';while(n>0){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s};
const colNum=t=>{if(t.length>7)return 1e9;let n=0;for(const ch of t)n=n*26+ch.charCodeAt(0)-64;return n};
const cn=p=>colNum(p.ct), rn=p=>Number(p.rt);
const inGrid=p=>{const c=cn(p),r=rn(p);return c>=1&&c<=8&&r>=1&&r<=12};
const mkPt=(c,r,ca,ra)=>({ct:colName(c),rt:String(r),ca,ra});
const ptS=p=>(p.ca?'$':'')+p.ct+(p.ra?'$':'')+p.rt;
const bareRe=/^[A-Za-z_][A-Za-z0-9_]*$/;
const pfx=n=>(bareRe.test(n)?n:"'"+n.replace(/'/g,"''")+"'")+'!';
const addr=(c,r)=>'ABCDEFGH'[c]+(r+1);
function normRange(p,q){
  const cc=(a,b)=>a.ct.length-b.ct.length||(a.ct<b.ct?-1:a.ct>b.ct?1:0);
  const rr=(a,b)=>a.rt.length-b.rt.length||(a.rt<b.rt?-1:a.rt>b.rt?1:0);
  const [tc,bc]=cc(p,q)<=0?[p,q]:[q,p];
  const [tr,br]=rr(p,q)<=0?[p,q]:[q,p];
  return [{ct:tc.ct,ca:tc.ca,rt:tr.rt,ra:tr.ra},{ct:bc.ct,ca:bc.ca,rt:br.rt,ra:br.ra}];
}
/* ---- tokenizer / parser ---- */
const reNum=/(\d+(\.\d+)?|\.\d+)/y, reWord=/[A-Za-z0-9_$]+/y;
function tokenize(s){
  const t=[];let i=0;const n=s.length;
  while(i<n){
    const ch=s[i];
    if(ch===' '){i++;continue}
    if(ch==='"'){let j=i+1,o='';for(;;){if(j>=n)return null;if(s[j]==='"'){if(s[j+1]==='"'){o+='"';j+=2;continue}break}o+=s[j++]}t.push({t:'str',v:o});i=j+1;continue}
    if(ch==="'"){let j=i+1,o='';for(;;){if(j>=n)return null;if(s[j]==="'"){if(s[j+1]==="'"){o+="'";j+=2;continue}break}o+=s[j++]}
      if(o===''||s[j+1]!=='!')return null;t.push({t:'pre',v:o});i=j+2;continue}
    if((ch>='0'&&ch<='9')||(ch==='.'&&s[i+1]>='0'&&s[i+1]<='9')){reNum.lastIndex=i;const m=reNum.exec(s);t.push({t:'num',v:m[0]});i+=m[0].length;continue}
    if(/[A-Za-z_$]/.test(ch)){reWord.lastIndex=i;const w=reWord.exec(s)[0];i+=w.length;
      if(s[i]==='!'){if(w.includes('$'))return null;t.push({t:'pre',v:w});i++;continue}
      if(/^(true|false)$/i.test(w))t.push({t:'bool',v:w.toUpperCase()==='TRUE'});
      else if(/^\$?[A-Za-z]+\$?[0-9]+$/.test(w)){const m=/^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);t.push({t:'ref',p:{ct:m[2].toUpperCase(),ca:!!m[1],rt:m[4].replace(/^0+(?=\d)/,''),ra:!!m[3]}})}
      else if(/^[A-Za-z0-9_]+$/.test(w))t.push({t:'name',v:w});
      else return null;
      continue}
    if(ch==='#'){if(/^#REF!/i.test(s.substr(i,5))){t.push({t:'referr'});i+=5;continue}return null}
    const two=s.substr(i,2);
    if(two==='<>'||two==='<='||two==='>='){t.push({t:'op',v:two});i+=2;continue}
    if('+-*/^&%=<>(),:'.includes(ch)){t.push({t:'op',v:ch});i++;continue}
    return null;
  }
  return t;
}
class Parser{
  constructor(t){this.t=t;this.i=0}
  isOp(...vs){const k=this.t[this.i];return !!k&&k.t==='op'&&vs.includes(k.v)}
  next(){return this.t[this.i++]}
  parse(){const e=this.cmp();if(this.i<this.t.length)throw 0;return e}
  bin(sub,ops){let l=this[sub]();while(this.isOp(...ops)){const op=this.next().v;l={type:'bin',op,l,r:this[sub]()}}return l}
  cmp(){return this.bin('cat',['=','<>','<','<=','>','>='])}
  cat(){return this.bin('sum',['&'])}
  sum(){return this.bin('prod',['+','-'])}
  prod(){return this.bin('signed',['*','/'])}
  signed(){if(this.isOp('-','+')){const op=this.next().v;return {type:'un',op,e:this.signed()}}return this.power()}
  power(){const b=this.percent();if(this.isOp('^')){this.i++;return {type:'bin',op:'^',l:b,r:this.signed()}}return b}
  percent(){let p=this.primary();while(this.isOp('%')){this.i++;p={type:'pct',e:p}}return p}
  refOrRange(prefix){
    const k=this.next();if(!k||k.t!=='ref')throw 0;
    if(this.isOp(':')){this.i++;const k2=this.next();if(!k2||k2.t!=='ref')throw 0;const [p,q]=normRange(k.p,k2.p);return {type:'range',prefix,p,q}}
    return {type:'ref',prefix,p:k.p};
  }
  primary(){
    const k=this.t[this.i];if(!k)throw 0;
    switch(k.t){
      case 'num':this.i++;return {type:'num',text:k.v};
      case 'str':this.i++;return {type:'str',v:k.v};
      case 'bool':this.i++;return {type:'bool',v:k.v};
      case 'referr':this.i++;return {type:'referr'};
      case 'pre':this.i++;return this.refOrRange(k.v);
      case 'ref':return this.refOrRange(null);
      case 'name':{this.i++;if(this.isOp('(')){this.i++;const args=[];if(this.isOp(')')){this.i++}else{for(;;){args.push(this.cmp());if(this.isOp(',')){this.i++;continue}if(this.isOp(')')){this.i++;break}throw 0}}return {type:'call',name:k.v,args}}return {type:'name',name:k.v}}
      case 'op':if(k.v==='('){this.i++;const e=this.cmp();if(!this.isOp(')'))throw 0;this.i++;return {type:'paren',e}}throw 0;
    }
    throw 0;
  }
}
const pcache=new Map();
function parseF(raw){
  if(pcache.has(raw))return pcache.get(raw);
  let r=null;try{const t=tokenize(raw.slice(1));if(t)r=new Parser(t).parse()}catch(e){r=null}
  if(pcache.size>4000)pcache.clear();pcache.set(raw,r);return r;
}
function ser(n){
  switch(n.type){
    case 'num':return n.text;
    case 'str':return '"'+n.v.replace(/"/g,'""')+'"';
    case 'bool':return n.v?'TRUE':'FALSE';
    case 'referr':return '#REF!';
    case 'name':return n.name.toUpperCase();
    case 'call':return n.name.toUpperCase()+'('+n.args.map(ser).join(',')+')';
    case 'bin':return ser(n.l)+n.op+ser(n.r);
    case 'un':return n.op+ser(n.e);
    case 'pct':return ser(n.e)+'%';
    case 'paren':return '('+ser(n.e)+')';
    case 'ref':return (n.prefix!==null?pfx(n.prefix):'')+ptS(n.p);
    case 'range':return (n.prefix!==null?pfx(n.prefix):'')+ptS(n.p)+':'+ptS(n.q);
  }
}
function mapNode(n,f){
  switch(n.type){
    case 'ref':case 'range':return f(n);
    case 'call':return {...n,args:n.args.map(a=>mapNode(a,f))};
    case 'bin':return {...n,l:mapNode(n.l,f),r:mapNode(n.r,f)};
    case 'un':case 'pct':case 'paren':return {...n,e:mapNode(n.e,f)};
    default:return n;
  }
}
const REFERR={type:'referr'};
/* ---- numbers ---- */
function plain(x){
  let s=x.toPrecision(12),neg=false;if(s[0]==='-'){neg=true;s=s.slice(1)}
  const m=/^(\d)(?:\.(\d+))?e([+-]\d+)$/.exec(s);let int,frac;
  if(m){const dg=m[1]+(m[2]||''),e=+m[3];
    if(e>=0){if(dg.length-1<=e){int=dg+'0'.repeat(e-(dg.length-1));frac=''}else{int=dg.slice(0,e+1);frac=dg.slice(e+1)}}
    else{int='0';frac='0'.repeat(-e-1)+dg}}
  else{const p=s.split('.');int=p[0];frac=p[1]||''}
  return {neg,int,frac};
}
function rdec(x,d,mode){
  const {neg,int,frac}=plain(x);const f=frac.length;const big=BigInt(int+frac);let q;
  if(d>=f)q=big*10n**BigInt(d-f);
  else{const div=10n**BigInt(f-d);q=big/div;const rem=big%div;if(mode==='r'){if(rem*2n>=div)q+=1n}else if(mode==='u'){if(rem>0n)q+=1n}}
  return {neg:neg&&q!==0n,q};
}
const qNum=(o,d)=>{const n=Number(o.q.toString()+'e'+(-d));return o.neg?-n:n};
function decStr(o,d){let s=o.q.toString();if(d>0){s=s.padStart(d+1,'0');s=s.slice(0,-d)+'.'+s.slice(-d)}return (o.neg?'-':'')+s}
const group=s=>{const neg=s[0]==='-';if(neg)s=s.slice(1);const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-':'')+p.join('.')};
function G(x){let s=decStr(rdec(x,6,'r'),6);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s}
function P(x){const {neg,int,frac}=plain(x);let f=frac.replace(/0+$/,'');const isz=/^0*$/.test(int)&&f==='';return (neg&&!isz?'-':'')+int+(f?'.'+f:'')}
/* ---- dates ---- */
function dfc(y,m,d){y-=m<=2?1:0;const era=Math.floor(y/400),yoe=y-era*400,doy=Math.floor((153*(m+(m>2?-3:9))+2)/5)+d-1,doe=yoe*365+Math.floor(yoe/4)-Math.floor(yoe/100)+doy;return era*146097+doe-719468}
const BASE=dfc(1899,12,31);
const serialOf=(y,m,d)=>dfc(y,m,d)-BASE;
function civil(s){const z=s+BASE+719468,era=Math.floor(z/146097),doe=z-era*146097,yoe=Math.floor((doe-Math.floor(doe/1460)+Math.floor(doe/36524)-Math.floor(doe/146096))/365),doy=doe-(365*yoe+Math.floor(yoe/4)-Math.floor(yoe/100)),mp=Math.floor((5*doy+2)/153),d=doy-Math.floor((153*mp+2)/5)+1,m=mp<10?mp+3:mp-9;return {y:yoe+era*400+(m<=2?1:0),m,d}}
const leap=y=>(y%4===0&&y%100!==0)||y%400===0;
const dim=(y,m)=>[31,leap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
const isSerial=s=>s>=1&&s<=2958464;
const p2=n=>String(n).padStart(2,'0');
function dateStr(s){const c=civil(s);return String(c.y).padStart(4,'0')+'-'+p2(c.m)+'-'+p2(c.d)}
function isDateEntry(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(y<1900||mo<1||mo>12||d<1||d>dim(y,mo))return null;return serialOf(y,mo,d)}
/* ---- content kinds ---- */
const trimSp=s=>s.replace(/^ +| +$/g,'');
function entryNum(s){if(!/^[+-]?(\d+(\.\d+)?|\.\d+)%?$/.test(s))return null;let x=Number(s.replace('%',''));if(s.endsWith('%'))x=x/100;x=N(x);if(!isFinite(x)||Math.abs(x)>=1e15)return null;return x}
function classify(s){
  if(s==='')return {k:'empty'};
  if(s[0]==='=')return {k:'formula'};
  if(s[0]==="'")return {k:'text',v:s.slice(1)};
  const t=trimSp(s);const d=isDateEntry(t);if(d!==null)return {k:'date',v:d};
  const n=entryNum(t);if(n!==null)return {k:'number',v:n};
  if(/^(true|false)$/i.test(t))return {k:'logical',v:t.toUpperCase()==='TRUE'};
  return {k:'text',v:s};
}
/* ---- conversions ---- */
const cnv=v=>v instanceof Err?v:v===null?0:typeof v==='boolean'?(v?1:0):typeof v==='number'?v:E('#VALUE!');
const ctx=v=>v instanceof Err?v:v===null?'':typeof v==='boolean'?(v?'TRUE':'FALSE'):typeof v==='number'?G(v):v;
const clg=v=>v instanceof Err?v:v===null?false:typeof v==='boolean'?v:typeof v==='number'?v!==0:E('#VALUE!');
const cint=v=>{const n=cnv(v);if(n instanceof Err)return n;const t=Math.trunc(n);return t===0?0:t};
const trank=v=>typeof v==='number'?0:typeof v==='string'?1:2;
function cmpV(a,b){const ta=trank(a),tb=trank(b);if(ta!==tb)return ta-tb;if(ta===1){a=a.toUpperCase();b=b.toUpperCase()}return a<b?-1:a>b?1:0}
const isRangeArg=n=>n.type==='ref'||n.type==='range'||n.type==='referr'||n.type==='name';
function fmtNumber(x,f){
  if(f==='fixed2')return group(decStr(rdec(x,2,'r'),2));
  if(f==='percent1'){const y=N(x*100);return decStr(rdec(y,1,'r'),1)+'%'}
  if(f==='date'){const d=Math.floor(x);if(isSerial(d))return dateStr(d)}
  return G(x);
}
function show(v,f){if(v===null)return '';if(v instanceof Err)return v.e;if(typeof v==='string')return v;if(typeof v==='boolean')return v?'TRUE':'FALSE';return fmtNumber(v,f)}
/* ---- evaluator ---- */
class Ev{

/* names */
grp('name',['define-name','delete-name'],id=>{
  const v=ni.value,u=v.toUpperCase();
  if(id==='define-name'){
    if(!validName(v)){setMsg('name','Invalid name');return}
    if(S.names.some(n=>n.name.toUpperCase()===u)){setMsg('name','Name already used');return}
    if(S.names.length>=10){setMsg('name','Too many names');return}
    act(()=>{const s=sh(),R=selR(s);const one=R.c1===R.c2&&R.r1===R.r2;
      S.names.push({name:v,k:one?'cell':'range',sid:s.id,c1:R.c1,r1:R.r1,c2:R.c2,r2:R.r2});ni.value='';return true});
  }else{
    const i=S.names.findIndex(n=>n.name.toUpperCase()===u);
    if(i<0){setMsg('name','Unknown name');return}
    act(()=>{S.names.splice(i,1);ni.value='';return true});
  }
});
/* find / replace */
const fold=(s,mc)=>mc?s:s.replace(/[A-Z]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+32));
const matchesCell=(raw,nd,mc,wh)=>{if(nd===''||raw==='')return false;const a=fold(raw,mc),b=fold(nd,mc);return wh?a===b:a.includes(b)};
function replaceStr(raw,nd,rep,mc,wh){
  if(wh)return rep;const a=fold(raw,mc),b=fold(nd,mc);let out='',pos=0;
  for(;;){const i=a.indexOf(b,pos);if(i<0)break;out+=raw.slice(pos,i)+rep;pos=i+b.length}
  return out+raw.slice(pos);
}
grp('find',['find-next','replace-all'],id=>{
  const nd=finp.value,mc=fcase.checked,wh=fwhole.checked,s=sh();
  const hits=[];s.cells.forEach((x,i)=>{if(matchesCell(x.raw,nd,mc,wh))hits.push(i)});
  if(id==='find-next'){
    setMsg('find','Matches: '+hits.length);
    if(hits.length){const a=s.b[1]*8+s.b[0];for(let k=1;k<=96;k++){const i=(a+k)%96;if(hits.includes(i)){const c=i%8,r=Math.floor(i/8);s.a=[c,r];s.b=[c,r];break}}refresh()}
  }else{
    const rep=rinp.value;
    act(()=>{let ch=false;hits.forEach(i=>{const x=s.cells[i];const fmt0=x.fmt;if(commitStr(s,i%8,Math.floor(i/8),replaceStr(x.raw,nd,rep,mc,wh))||x.fmt!==fmt0)ch=true});
      setMsg('find','Replaced: '+hits.length);return ch});
  }
});
/* csv */
const csvq=f=>/[",\r\n]/.test(f)?'"'+f.replace(/"/g,'""')+'"':f;
function parseCsv(t){
  const recs=[];let i=0;const n=t.length;let rec=[];
  for(;;){
    let f;
    if(t[i]==='"'){
      i++;f='';
      for(;;){
        if(i>=n)return null;
        const ch=t[i];
        if(ch==='"'){if(t[i+1]==='"'){f+='"';i+=2;continue}i++;break}
        if(ch==='\r'){f+=' ';i+=(t[i+1]==='\n')?2:1;continue}
        if(ch==='\n'){f+=' ';i++;continue}
        f+=ch;i++;
      }
      if(i<n&&t[i]!==','&&t[i]!=='\n'&&t[i]!=='\r')return null;
    }else{
      const st=i;while(i<n&&t[i]!==','&&t[i]!=='\n'&&t[i]!=='\r')i++;f=t.slice(st,i);
    }
    rec.push(f);
    if(i>=n){recs.push(rec);break}
    if(t[i]===','){i++;continue}
    i+=(t[i]==='\r'&&t[i+1]==='\n')?2:1;
    recs.push(rec);rec=[];
    if(i>=n)break;
  }
  return recs;
}
grp('csv',['csv-export','csv-import'],id=>{
  const s=sh();
  if(id==='csv-export'){
    let R=-1,C=-1;s.cells.forEach((x,i)=>{if(x.raw!==''){R=Math.max(R,Math.floor(i/8));C=Math.max(C,i%8)}});
    const raw=craw.checked,lines=[];
    for(let r=0;r<=R;r++){const f=[];for(let c=0;c<=C;c++){const x=s.cells[r*8+c];f.push(csvq(raw?x.raw:show(EV.cell(S.active,c,r),x.fmt)))}lines.push(f.join(','))}
    ctext.value=lines.join('\n');
  }else{
    const t=ctext.value;
    if(t===''){setMsg('csv','Nothing to import');return}
    const recs=parseCsv(t);
    if(!recs){setMsg('csv','Invalid CSV');return}
    act(()=>{
      s.cells.forEach(x=>{x.raw=''});let k=0,d=0;
      recs.forEach((rec,i)=>rec.forEach((f,j)=>{if(f==='')return;if(i<12&&j<8){commitStr(s,j,i,f);k++}else d++}));
      setMsg('csv','Imported: '+k+' | Dropped: '+d);return true;
    });
  }
});
/* init */
function resetFields(){sni.value=sh().name;ni.value='';finp.value='';rinp.value='';fcase.checked=false;fwhole.checked=false;craw.checked=false;ctext.value=''}
resetFields();refresh();
window.addEventListener('pageshow',()=>{if(!editing&&!hist.undo.length&&!hist.redo.length){resetFields()}});
</script>
