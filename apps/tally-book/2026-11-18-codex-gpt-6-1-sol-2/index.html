const grid=$('grid');let head=document.createElement('tr');head.setAttribute('role','row');let corner=document.createElement('th');corner.setAttribute('role','presentation');head.append(corner);for(let c=0;c<8;c++){let th=document.createElement('th');th.setAttribute('role','columnheader');th.dataset.testid='col-header-'+String.fromCharCode(65+c);th.textContent=String.fromCharCode(65+c);head.append(th)}grid.append(head);for(let r=0;r<12;r++){let tr=document.createElement('tr');tr.setAttribute('role','row');let th=document.createElement('th');th.setAttribute('role','rowheader');th.dataset.testid='row-header-'+(r+1);th.textContent=r+1;tr.append(th);for(let c=0;c<8;c++){let td=document.createElement('td'),i=index(c,r);td.id='cell-'+addr(i);td.dataset.testid=td.id;td.setAttribute('role','gridcell');td.addEventListener('click',e=>selectCell(i,e.shiftKey));tr.append(td)}grid.append(tr)}
function endEdit(){let changed=false;if(editing){changed=commitCell(sheet().cells[sheet().active],$('formula-input').value);editing=false}return changed}
function selectCell(i,shift){let before=clone(book),changed=endEdit();sheet().active=i;if(!shift)sheet().anchor=i;if(changed)record(before);save();render();grid.focus()}
$('formula-input').addEventListener('input',()=>{editing=true;$('formula-input').dataset.editing='true';renderDisabled()});$('formula-input').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus()}else if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();let before=clone(book),changed=endEdit(),i=sheet().active;sheet().active=sheet().anchor=e.key==='Enter'?Math.min(11,Math.floor(i/8)+1)*8+i%8:Math.floor(i/8)*8+Math.min(7,i%8+1);if(changed)record(before);save();render()}});
grid.addEventListener('keydown',e=>{let k=e.key,ctrl=e.ctrlKey&&['z','y'].includes(k.toLowerCase());if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Backspace','Enter'].includes(k)&&!ctrl)return;e.preventDefault();if(k==='Enter'){$('formula-input').focus();return}if(editing)return;if(ctrl){history(k.toLowerCase()==='z');return}if(k==='Delete'||k==='Backspace'){clear();return}let [c,r]=xy(sheet().active);if(k==='ArrowUp')r=Math.max(0,r-1);if(k==='ArrowDown')r=Math.min(11,r+1);if(k==='ArrowLeft')c=Math.max(0,c-1);if(k==='ArrowRight')c=Math.min(7,c+1);sheet().active=index(c,r);if(!e.shiftKey)sheet().anchor=sheet().active;save();render()});
function renderDisabled(){document.querySelectorAll('button,input,textarea,select').forEach(el=>{if(el.id==='formula-input')return;el.disabled=editing||el.id==='undo-button'&&!undo.length||el.id==='redo-button'&&!redo.length||el.id==='paste-button'&&!clip||el.id==='add-sheet'&&book.sheets.length===5||el.id==='delete-sheet'&&book.sheets.length===1})}
function render(){recalc();let s=sheet(),z=rect(),ids=selected();for(let i=0;i<96;i++){let el=$('cell-'+addr(i)),v=value(book.active,i);el.textContent=show(v,s.cells[i].fmt);el.dataset.kind=v===null?'empty':isE(v)?'error':typeof v==='boolean'?'logical':typeof v==='number'?'number':'text';el.dataset.inSelection=String(ids.includes(i));el.setAttribute('aria-selected',String(i===s.active))}$('name-box').textContent=ids.length===1?addr(s.active):addr(index(z.l,z.t))+':'+addr(index(z.r,z.b));$('formula-input').dataset.editing=String(editing);if(!editing){$('formula-input').value=s.cells[s.active].raw;fs.value=s.cells[s.active].fmt}let nums=ids.map(i=>value(book.active,i)).filter(x=>typeof x==='number'),summary=$('selection-summary');summary.hidden=!nums.length;if(nums.length){let sum=nums.reduce((a,b)=>a+b,0),format=n=>{try{return G(num(n))}catch(e){return '#NUM!'}};summary.textContent=`Sum: ${format(sum)} | Average: ${format(sum/nums.length)} | Count: ${nums.length}`}let tabs=$('sheet-tabs');tabs.replaceChildren();book.sheets.forEach((sh,i)=>{let b=button(tabs,'sheet-tab-'+(i+1),sh.name,()=>{book.active=i;$('sheet-name-input').value=sheet().name;save();render()});b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===book.active))});nl.replaceChildren();[...book.names].sort((a,b)=>up(a.name)<up(b.name)?-1:1).forEach((n,i)=>{let el=document.createElement('div');el.dataset.testid='name-item-'+(i+1);el.setAttribute('role','listitem');let t=n.target;el.textContent=n.name+' = '+(t?prefix(book.sheets[t.s].name)+addr(t.a)+(t.range?':'+addr(t.b):''):'#REF!');nl.append(el)});renderDisabled()}
$('sheet-name-input').value=sheet().name;render();
