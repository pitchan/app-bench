function input(parent,id,label,type='text'){let e=document.createElement('input');e.type=type;e.id=id;e.dataset.testid=id;e.setAttribute('aria-label',label);e.autocomplete='off';if(type==='checkbox'){let l=document.createElement('label');l.append(e,document.createTextNode(label));$(parent).append(l)}else $(parent).append(e);return e}
const actions=[['undo-button','Undo',undo],['redo-button','Redo',redo],['copy-button','Copy',()=>clipboard('copy')],['cut-button','Cut',()=>clipboard('cut')],['paste-button','Paste',paste],['clear-button','Clear',clear],['insert-row','Insert row',()=>structure('r',true)],['delete-row','Delete row',()=>structure('r',false)],['insert-col','Insert column',()=>structure('c',true)],['delete-col','Delete column',()=>structure('c',false)],['sort-asc','Sort ascending',()=>sort(false)],['sort-desc','Sort descending',()=>sort(true)],['fill-down','Fill down',()=>fill(false)],['fill-right','Fill right',()=>fill(true)],['fill-series','Fill series',series]];actions.forEach(([id,t,fn])=>button('toolbar',id,t,fn));let select=document.createElement('select');select.id='format-select';select.dataset.testid='format-select';select.setAttribute('aria-label','Number format');[['general','General'],['fixed2','1,234.50'],['percent1','12.5%'],['date','2024-12-31']].forEach(([v,t])=>select.add(new Option(t,v)));select.onchange=()=>changedAction(()=>indices(rectangle()).forEach(i=>cell(i).fmt=select.value));$('toolbar').append(select);
button('sheet-controls','add-sheet','Add sheet',addSheet,'sheet-message');input('sheet-controls','sheet-name-input','Sheet name');button('sheet-controls','rename-sheet','Rename sheet',rename,'sheet-message');button('sheet-controls','delete-sheet','Delete sheet',deleteSheet,'sheet-message');input('name-controls','name-input','Name');button('name-controls','define-name','Define name',defineName,'name-message');button('name-controls','delete-name','Delete name',deleteName,'name-message');input('find-controls','find-input','Find');input('find-controls','replace-input','Replace with');input('find-controls','find-case','Match case','checkbox');input('find-controls','find-whole','Whole cell','checkbox');button('find-controls','find-next','Find next',findNext,'find-status');button('find-controls','replace-all','Replace all',replaceAll,'find-status');input('csv-controls','csv-raw','Raw contents','checkbox');button('csv-controls','csv-export','Export CSV',csvExport,'csv-message');button('csv-controls','csv-import','Import CSV',csvImport,'csv-message');
let header=document.createElement('tr');header.setAttribute('role','row');let corner=document.createElement('th');corner.setAttribute('role','presentation');header.append(corner);for(let c=0;c<8;c++){let th=document.createElement('th');th.setAttribute('role','columnheader');th.dataset.testid='col-header-'+col(c);th.textContent=col(c);header.append(th)}$('grid').append(header);for(let r=0;r<12;r++){let tr=document.createElement('tr');tr.setAttribute('role','row');let th=document.createElement('th');th.setAttribute('role','rowheader');th.dataset.testid='row-header-'+(r+1);th.textContent=r+1;tr.append(th);for(let c=0;c<8;c++){let td=document.createElement('td'),id='cell-'+address(r,c);td.id=id;td.dataset.testid=id;td.setAttribute('role','gridcell');td.onclick=e=>choose(r*8+c,e.shiftKey);tr.append(td)}$('grid').append(tr)}
$('formula-input').oninput=()=>{editing=true;renderControls()};$('formula-input').onkeydown=editKey;$('grid').onkeydown=e=>{let k=e.key.toLowerCase(),arrow=e.key.startsWith('Arrow'),handled=arrow||['delete','backspace','enter'].includes(k)||e.ctrlKey&&['z','y'].includes(k);if(!handled)return;e.preventDefault();if(k==='enter'){$('formula-input').focus();return}if(editing)return;if(arrow){move(e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0,e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0,e.shiftKey);save();render()}else if(k==='delete'||k==='backspace')clear();else if(k==='z')undo();else if(k==='y')redo()};
function renderControls(){document.querySelectorAll('button,input,select,textarea').forEach(e=>{if(e.id==='formula-input')return;e.disabled=editing||e.id==='undo-button'&&!history.length||e.id==='redo-button'&&!future.length||e.id==='paste-button'&&!clip||e.id==='add-sheet'&&W.sheets.length>=5||e.id==='delete-sheet'&&W.sheets.length===1});$('formula-input').dataset.editing=String(editing)}
function render(){recalc();let q=rectangle(),ids=indices(q),nums=[];for(let i=0;i<96;i++){let c=cell(i),v=value(W.active,i),td=$('cell-'+address(i/8|0,i%8));td.textContent=show(v,c.fmt);td.dataset.kind=c.raw===''?'empty':isE(v)?'error':typeof v==='boolean'?'logical':typeof v;td.setAttribute('aria-selected',String(i===sh().active));td.dataset.inSelection=String(ids.includes(i));if(ids.includes(i)&&typeof v==='number')nums.push(v)}$('name-box').textContent=address(q.t,q.l)+(ids.length>1?':'+address(q.b,q.r):'');if(!editing)$('formula-input').value=cell(sh().active).raw;$('format-select').value=cell(sh().active).fmt;let summary=$('selection-summary');summary.hidden=!nums.length;if(nums.length){let sum=nums.reduce((a,b)=>a+b,0);summary.textContent=`Sum: ${show(num(sum))} | Average: ${show(num(sum/nums.length))} | Count: ${nums.length}`}
let tabs=$('sheet-tabs');if(tabs.children.length!==W.sheets.length){tabs.replaceChildren();W.sheets.forEach((s,i)=>{let b=button('sheet-tabs','sheet-tab-'+(i+1),s.name,()=>{W.active=i;$('sheet-name-input').value=sh().name;save();render()});b.setAttribute('role','tab')})}W.sheets.forEach((s,i)=>{let b=$('sheet-tab-'+(i+1));b.textContent=s.name;b.setAttribute('aria-selected',String(i===W.active))});let list=$('name-list');list.replaceChildren();[...W.names].sort((a,b)=>upper(a.name)<upper(b.name)?-1:upper(a.name)>upper(b.name)?1:0).forEach((n,i)=>{let e=document.createElement('div');e.dataset.testid='name-item-'+(i+1);e.setAttribute('role','listitem');let t=n.target,text='#REF!';if(t){text=prefix(W.sheets[t.sheet].name)+address(t.a.r,t.a.c)+(t.b?':'+address(t.b.r,t.b.c):'')}e.textContent=n.name+' = '+text;list.append(e)});renderControls()}
$('sheet-name-input').value=sh().name;$('csv-text').value='';render();
