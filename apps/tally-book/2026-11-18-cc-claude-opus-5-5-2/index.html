<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
:root{--ink:#1b1f24;--muted:#3d4450;--line:#a7aeb8;--accent:#1d4ed8;--sel:#dbeafe;--head:#eef1f5;--panel:#f7f8fa;--focus:#b45309}
*{box-sizing:border-box}
html,body{margin:0;background:#ffffff;color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#ffffff;border-bottom:1px solid var(--line);padding:10px 16px}
header h1{margin:0;font-size:20px;font-weight:650;color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:#f1f3f6;border:1px solid #8a929e;border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){background:#e3e7ed}
button:disabled{color:#767b83;background:#f6f7f9;border-color:#c9ced5;cursor:default}
select,input[type=text],textarea{background:#ffffff;border:1px solid #8a929e;border-radius:6px;padding:5px 8px}
select:disabled,input:disabled,textarea:disabled{background:#f3f4f6;color:#6b7078}
button:focus-visible,select:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text]:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid #d5d9df;border-radius:8px;padding:8px}
.toolbar .sep{width:1px;height:22px;background:#c9ced5;margin:0 2px}
.toolbar label{color:var(--muted);margin-left:4px}
.fbar{display:flex;gap:8px;align-items:center}
.namebox{min-width:72px;padding:5px 8px;border:1px solid #8a929e;border-radius:6px;background:#ffffff;font-family:ui-monospace,Consolas,monospace;text-align:center}
.fbar input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace}
.fbar input[data-editing=true]{background:#fffbea}
.gridwrap{overflow:auto;max-width:100%;border:1px solid #c9ced5;border-radius:6px;background:#ffffff}
table.grid{border-collapse:collapse;table-layout:fixed;width:872px;user-select:none;-webkit-user-select:none;background:#ffffff}
table.grid:focus{outline:3px solid var(--focus);outline-offset:-3px}
table.grid th,table.grid td{border:1px solid #d0d5dc;height:28px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.grid th{background:var(--head);color:#2b313a;font-weight:600;text-align:center}
table.grid td.corner{background:var(--head);width:40px}
table.grid th.rh{width:40px}
table.grid td.c{background:#ffffff;color:var(--ink);cursor:cell}
table.grid td.c[data-kind=number]{text-align:right}
table.grid td.c[data-kind=error]{color:#a30016}
table.grid td.c[data-in-selection=true]{background:var(--sel)}
table.grid td.c[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--accent)}
.summary{background:#eef2ff;color:#1e2a52;border:1px solid #c7d2fe;border-radius:6px;padding:6px 10px;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.panel{background:var(--panel);border:1px solid #d5d9df;border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel h2{margin:0 0 2px;font-size:14px;width:100%;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.tabs button{max-width:100%;overflow-wrap:anywhere;border-radius:6px 6px 0 0;background:#ffffff}
.tabs button[aria-selected=true]{background:var(--accent);color:#ffffff;border-color:var(--accent)}
.tabs button:disabled[aria-selected=true]{background:#cfd8ee;color:#3b4252}
.field{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.field input[type=text]{width:190px;max-width:100%}
.check{display:flex;gap:4px;align-items:center}
.msg{background:#fff5ec;color:#7a1f00;border:1px solid #f3c9a6;border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.msg[hidden]{display:none}
ul.names{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:2px}
ul.names li{background:#ffffff;border:1px solid #d5d9df;border-radius:4px;padding:3px 8px;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere;color:var(--ink)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;resize:vertical}
.csvlabel{width:100%;color:var(--muted)}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <span class="sep"></span>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <span class="sep"></span>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <span class="sep"></span>
    <button type="button" data-testid="sort-asc">Sort ascending</button>
    <button type="button" data-testid="sort-desc">Sort descending</button>
    <button type="button" data-testid="fill-down">Fill down</button>
    <button type="button" data-testid="fill-right">Fill right</button>
    <button type="button" data-testid="fill-series">Fill series</button>
    <label for="format-select">Number format</label>
    <select id="format-select" data-testid="format-select" autocomplete="off">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
      <option value="date">2024-12-31</option>
    </select>
  </div>
  <div class="fbar">
    <div class="namebox" data-testid="name-box">A1</div>
    <input type="text" id="formula-input" data-testid="formula-input" aria-label="Cell content" autocomplete="off" spellcheck="false" data-editing="false">
  </div>
  <div class="gridwrap" id="gridwrap"></div>
  <div class="summary" data-testid="selection-summary" hidden></div>
  <section class="panel" data-testid="sheet-bar">
    <div class="tabs" role="tablist" aria-label="Sheets" data-testid="sheet-tabs"></div>
    <button type="button" data-testid="add-sheet">Add sheet</button>
    <span class="field"><label for="sheet-name-input">Sheet name</label><input type="text" id="sheet-name-input" data-testid="sheet-name-input" autocomplete="off" spellcheck="false"></span>
    <button type="button" data-testid="rename-sheet">Rename sheet</button>
    <button type="button" data-testid="delete-sheet">Delete sheet</button>
    <div class="msg" data-testid="sheet-message" hidden></div>
  </section>
  <section class="panel" data-testid="names-panel">
    <span class="field"><label for="name-input">Name</label><input type="text" id="name-input" data-testid="name-input" autocomplete="off" spellcheck="false"></span>
    <button type="button" data-testid="define-name">Define name</button>
    <button type="button" data-testid="delete-name">Delete name</button>
    <div class="msg" data-testid="name-message" hidden></div>
    <ul class="names" role="list" aria-label="Names" data-testid="name-list"></ul>
  </section>
  <section class="panel" data-testid="find-panel">
    <span class="field"><label for="find-input">Find</label><input type="text" id="find-input" data-testid="find-input" autocomplete="off" spellcheck="false"></span>
    <span class="field"><label for="replace-input">Replace with</label><input type="text" id="replace-input" data-testid="replace-input" autocomplete="off" spellcheck="false"></span>
    <span class="check"><input type="checkbox" id="find-case" data-testid="find-case" autocomplete="off"><label for="find-case">Match case</label></span>
    <span class="check"><input type="checkbox" id="find-whole" data-testid="find-whole" autocomplete="off"><label for="find-whole">Whole cell</label></span>
    <button type="button" data-testid="find-next">Find next</button>
    <button type="button" data-testid="replace-all">Replace all</button>
    <div class="msg" data-testid="find-status" hidden></div>
  </section>
  <section class="panel" data-testid="csv-panel">
    <span class="check"><input type="checkbox" id="csv-raw" data-testid="csv-raw" autocomplete="off"><label for="csv-raw">Raw contents</label></span>
    <button type="button" data-testid="csv-export">Export CSV</button>
    <button type="button" data-testid="csv-import">Import CSV</button>
    <label class="csvlabel" for="csv-text">CSV</label>
    <textarea id="csv-text" data-testid="csv-text" autocomplete="off" spellcheck="false"></textarea>
    <div class="msg" data-testid="csv-message" hidden></div>
  </section>
</main>
<script>
"use strict";
/* ================= Engine ================= */
const COLS = 8, ROWS = 12, NC = 96, L = 'ABCDEFGH', MAXSERIAL = 2958464;
const FORMATS = ['general', 'fixed2', 'percent1', 'date'];
class Err { constructor(c) { this.c = c; } }
const E = {
  SYNTAX: new Err('#SYNTAX!'), NAME: new Err('#NAME?'), ARGS: new Err('#ARGS!'), REF: new Err('#REF!'),
  VALUE: new Err('#VALUE!'), DIV: new Err('#DIV/0!'), NUM: new Err('#NUM!'), NA: new Err('#N/A'), CYCLE: new Err('#CYCLE!')
};
const isErr = v => v instanceof Err;
const addr = (r, c) => L[c] + (r + 1);

function N(x) {
  if (typeof x !== 'number' || !isFinite(x)) return E.NUM;
  let y = Number(x.toPrecision(12));
  if (y === 0) y = 0;
  if (Math.abs(y) >= 1e15) return E.NUM;
  return y;
}
function N0(x) { let y = Number(x.toPrecision(12)); return y === 0 ? 0 : y; }

/* decimal digits of a normalized number */
function decParts(x) {
  if (x === 0 || !isFinite(x)) return { neg: false, int: '0', frac: '' };
  const neg = x < 0;
  const s = Math.abs(x).toPrecision(12);
  const ei = s.indexOf('e');
  const m = ei < 0 ? s : s.slice(0, ei);
  const e = ei < 0 ? 0 : parseInt(s.slice(ei + 1), 10);
  const dot = m.indexOf('.');
  const digits = m.replace('.', '');
  const point = (dot < 0 ? m.length : dot) + e;
  let int, frac;
  if (point <= 0) { int = '0'; frac = '0'.repeat(-point) + digits; }
  else if (point >= digits.length) { int = digits + '0'.repeat(point - digits.length); frac = ''; }
  else { int = digits.slice(0, point); frac = digits.slice(point); }
  int = int.replace(/^0+(?=\d)/, '');
  return { neg, int, frac };
}
function incDigits(s) {
  const a = s.split('');
  let i = a.length - 1;
  while (i >= 0) { if (a[i] === '9') { a[i] = '0'; i--; } else { a[i] = String(+a[i] + 1); break; } }
  if (i < 0) a.unshift('1');
  return a.join('');
}
/* mode: 'h' half away from zero, 'd' toward zero, 'u' away from zero */
function roundParts(p, d, mode) {
  let all = p.int + p.frac;
  const ip = p.int.length;
  let kept, dropped;
  if (d >= 0) {
    const need = ip + d;
    if (all.length < need) all = all + '0'.repeat(need - all.length);
    kept = all.slice(0, need); dropped = all.slice(need);
  } else {
    const cut = ip + d;
    if (cut <= 0) { kept = ''; dropped = (cut < 0 ? '0'.repeat(-cut) : '') + all; }
    else { kept = all.slice(0, cut); dropped = all.slice(cut); }
  }
  let inc = false;
  if (mode === 'h') inc = dropped.length > 0 && dropped[0] >= '5';
  else if (mode === 'u') inc = /[1-9]/.test(dropped);
  if (kept === '') kept = '0';
  if (inc) kept = incDigits(kept);
  let int, frac;
  if (d >= 0) {
    if (kept.length < d + 1) kept = '0'.repeat(d + 1 - kept.length) + kept;
    int = kept.slice(0, kept.length - d); frac = d > 0 ? kept.slice(kept.length - d) : '';
  } else { int = kept + '0'.repeat(-d); frac = ''; }
  int = int.replace(/^0+(?=\d)/, '');
  const zero = !/[1-9]/.test(int + frac);
  return { neg: p.neg && !zero, int, frac };
}
const partsNum = p => { const v = parseFloat((p.neg ? '-' : '') + p.int + '.' + (p.frac || '0')); return v === 0 ? 0 : v; };
const groupInt = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
function partsText(p, group, trim) {
  let f = p.frac; if (trim) f = f.replace(/0+$/, '');
  const zero = !/[1-9]/.test(p.int + f);
  return (p.neg && !zero ? '-' : '') + (group ? groupInt(p.int) : p.int) + (f ? '.' + f : '');
}
function G(x) { return partsText(roundParts(decParts(x), 6, 'h'), false, true); }
function P(x) { return partsText(decParts(x), false, true); }
function fixed2(x) { return partsText(roundParts(decParts(x), 2, 'h'), true, false); }
function percent1(x) { return partsText(roundParts(decParts(N0(x * 100)), 1, 'h'), false, false) + '%'; }

/* dates */
function dfc(y, m, d) {
  y -= m <= 2 ? 1 : 0;
  const era = Math.floor(y / 400), yoe = y - era * 400;
  const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
  const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}
function cfd(z) {
  z += 719468;
  const era = Math.floor(z / 146097), doe = z - era * 146097;
  const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
  let y = yoe + era * 400;
  const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  const mp = Math.floor((5 * doy + 2) / 153);
  const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
  const m = mp + (mp < 10 ? 3 : -9);
  if (m <= 2) y++;
  return [y, m, d];
}
const BASE = dfc(1900, 1, 1);
const serialOf = (y, m, d) => dfc(y, m, d) - BASE + 1;
const ymdOf = s => cfd(s - 1 + BASE);
const isSerial = s => Number.isInteger(s) && s >= 1 && s <= MAXSERIAL;
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const dim = (y, m) => [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
function dateText(s) {
  const [y, m, d] = ymdOf(s);
  return String(y).padStart(4, '0') + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* entered content */
const trimSp = s => s.replace(/^ +| +$/g, '');
function dateEntry(t) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (y < 1900 || mo < 1 || mo > 12 || d < 1 || d > dim(y, mo)) return null;
  return serialOf(y, mo, d);
}
function entryNumber(t) {
  if (!/^[+-]?(\d+(\.\d+)?|\.\d+)%?$/.test(t)) return null;
  const pct = t.endsWith('%');
  let v = parseFloat(pct ? t.slice(0, -1) : t);
  if (!isFinite(v)) return null;
  if (pct) v = v / 100;
  v = N0(v);
  if (!isFinite(v) || Math.abs(v) >= 1e15) return null;
  return v;
}
function literalValue(raw) {
  if (raw === '') return null;
  if (raw[0] === "'") return raw.slice(1);
  const t = trimSp(raw);
  const d = dateEntry(t); if (d !== null) return d;
  const n = entryNumber(t); if (n !== null) return n;
  const u = t.toUpperCase();
  if (u === 'TRUE') return true;
  if (u === 'FALSE') return false;
  return raw;
}
function isNumberKind(raw) {
  if (raw === '' || raw[0] === '=' || raw[0] === "'") return false;
  const t = trimSp(raw);
  return dateEntry(t) !== null || entryNumber(t) !== null;
}

/* ---------- tokens ---------- */
function colNum(cs) { if (cs.length > 4) return Infinity; let n = 0; for (const ch of cs) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
function rowNum(rs) { return rs.length > 6 ? Infinity : parseInt(rs, 10); }
const refIn = r => { const c = colNum(r.cs), w = rowNum(r.rs); return c >= 1 && c <= COLS && w >= 1 && w <= ROWS; };

function tokenize(src) {
  const T = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const ch = src[i];
    if (ch === ' ') { i++; continue; }
    if ((ch >= '0' && ch <= '9') || ch === '.') {
      const m = /^(\d+(\.\d+)?|\.\d+)/.exec(src.slice(i, i + 400));
      if (!m) return null;
      let len = m[0].length;
      if (len >= 399) { const m2 = /^(\d+(\.\d+)?|\.\d+)/.exec(src.slice(i)); len = m2[0].length; T.push({ k: 'num', text: m2[0] }); }
      else T.push({ k: 'num', text: m[0] });
      i += len; continue;
    }
    if (ch === '"') {
      let j = i + 1, v = '';
      for (;;) {
        if (j >= n) return null;
        if (src[j] === '"') { if (src[j + 1] === '"') { v += '"'; j += 2; continue; } j++; break; }
        v += src[j++];
      }
      T.push({ k: 'str', text: src.slice(i, j), v }); i = j; continue;
    }
    if (ch === "'") {
      let j = i + 1, v = '';
      for (;;) {
        if (j >= n) return null;
        if (src[j] === "'") { if (src[j + 1] === "'") { v += "'"; j += 2; continue; } j++; break; }
        v += src[j++];
      }
      if (v === '' || src[j] !== '!') return null;
      T.push({ k: 'pre', name: v }); i = j + 1; continue;
    }
    if (ch === '#') {
      if (src.substr(i, 5).toUpperCase() === '#REF!') { T.push({ k: 'referr' }); i += 5; continue; }
      return null;
    }
    if (/[A-Za-z_$]/.test(ch)) {
      let j = i; while (j < n && /[A-Za-z0-9_$]/.test(src[j])) j++;
      const w = src.slice(i, j); i = j;
      if (src[i] === '!') { if (w.includes('$')) return null; T.push({ k: 'pre', name: w }); i++; continue; }
      const u = w.toUpperCase();
      if (u === 'TRUE' || u === 'FALSE') { T.push({ k: 'bool', v: u === 'TRUE' }); continue; }
      const rm = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);
      if (rm) { T.push({ k: 'ref', r: { ca: rm[1] === '$', cs: rm[2].toUpperCase(), ra: rm[3] === '$', rs: rm[4].replace(/^0+(?=\d)/, '') } }); continue; }
      if (/^[A-Za-z0-9_]+$/.test(w)) { T.push({ k: 'name', text: u }); continue; }
      return null;
    }
    const two = src.substr(i, 2);
    if (two === '<>' || two === '<=' || two === '>=') { T.push({ k: 'op', text: two }); i += 2; continue; }
    if ('+-*/^&%=<>'.includes(ch)) { T.push({ k: 'op', text: ch }); i++; continue; }
    if ('(),:'.includes(ch)) { T.push({ k: 'p', text: ch }); i++; continue; }
    return null;
  }
  const Gt = [];
  for (let j = 0; j < T.length; j++) {
    const t = T[j];
    if (t.k === 'pre' || t.k === 'ref') {
      let pre = null;
      if (t.k === 'pre') { pre = t.name; j++; if (!T[j] || T[j].k !== 'ref') return null; }
      const a = T[j].r; let b = null;
      if (T[j + 1] && T[j + 1].k === 'p' && T[j + 1].text === ':' && T[j + 2] && T[j + 2].k === 'ref') { b = T[j + 2].r; j += 2; }
      Gt.push({ k: 'unit', pre, a, b });
    } else Gt.push(t);
  }
  return Gt;
}

const CMP_OPS = ['=', '<>', '<', '<=', '>', '>='];
function parseTokens(toks) {
  let p = 0;
  const fail = () => { throw 0; };
  const isOp = list => { const t = toks[p]; return t && t.k === 'op' && list.includes(t.text); };
  const isP = s => { const t = toks[p]; return t && t.k === 'p' && t.text === s; };
  function expr() { return comparison(); }
  function comparison() { let l = concat(); while (isOp(CMP_OPS)) { const op = toks[p++].text; l = { t: 'bin', op, l, r: concat() }; } return l; }
  function concat() { let l = sum(); while (isOp(['&'])) { p++; l = { t: 'bin', op: '&', l, r: sum() }; } return l; }
  function sum() { let l = product(); while (isOp(['+', '-'])) { const op = toks[p++].text; l = { t: 'bin', op, l, r: product() }; } return l; }
  function product() { let l = signed(); while (isOp(['*', '/'])) { const op = toks[p++].text; l = { t: 'bin', op, l, r: signed() }; } return l; }
  function signed() { if (isOp(['+', '-'])) { const op = toks[p++].text; return { t: 'un', op, e: signed() }; } return power(); }
  function power() { const b = percent(); if (isOp(['^'])) { p++; return { t: 'bin', op: '^', l: b, r: signed() }; } return b; }
  function percent() { let e = primary(); while (isOp(['%'])) { p++; e = { t: 'pct', e }; } return e; }
  function primary() {
    const t = toks[p++];
    if (!t) fail();
    switch (t.k) {
      case 'num': { const v = parseFloat(t.text); return { t: 'num', v: N(v) }; }
      case 'str': return { t: 'str', v: t.v };
      case 'bool': return { t: 'bool', v: t.v };
      case 'referr': return { t: 'referr' };
      case 'unit': return { t: 'unit', u: t };
      case 'name':
        if (isP('(')) {
          p++;
          const args = [];
          if (isP(')')) { p++; return { t: 'call', name: t.text, args }; }
          for (;;) {
            args.push(expr());
            if (isP(',')) { p++; continue; }
            if (isP(')')) { p++; break; }
            fail();
          }
          return { t: 'call', name: t.text, args };

  } else { summary.hidden = true; summary.textContent = ''; }
  // tabs
  while (tabBtns.length < wb.sheets.length) {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab');
    const idx = tabBtns.length;
    b.addEventListener('click', guard(() => onTab(idx)));
    tabsEl.appendChild(b); tabBtns.push(b);
  }
  while (tabBtns.length > wb.sheets.length) tabBtns.pop().remove();
  tabBtns.forEach((b, i) => {
    b.dataset.testid = 'sheet-tab-' + (i + 1);

  const items = sorted.map(nm => nm.name + ' = ' + targetText(nm.target));
  const lis = nameList.children;
  while (lis.length > items.length) nameList.lastChild.remove();
  while (lis.length < items.length) { const li = document.createElement('li'); li.setAttribute('role', 'listitem'); nameList.appendChild(li); }
  items.forEach((t, i) => { const li = lis[i]; li.dataset.testid = 'name-item-' + (i + 1); if (li.textContent !== t) li.textContent = t; });
  // disabled
  const dis = (el, d) => { el.disabled = !!d; };
  document.querySelectorAll('button, select, input, textarea').forEach(el => { if (el !== fi) dis(el, editing); });
  if (!editing) {
    dis($('undo-button'), !undoS.length);
    dis($('redo-button'), !redoS.length);
    dis($('paste-button'), !clip);
    dis($('add-sheet'), wb.sheets.length >= 5);
    dis($('delete-sheet'), wb.sheets.length <= 1);

}
function refresh() { recalc(); render(); saveState(); }
function guard(fn) { return function (e) { try { fn.call(this, e); } catch (err) { console.error(err); } }; }

/* ---------- actions ---------- */
function clampMove(sh, dr, dc) { sh.act = [Math.max(0, Math.min(ROWS - 1, sh.act[0] + dr)), Math.max(0, Math.min(COLS - 1, sh.act[1] + dc))]; }
function commitIfEditing() {

  editing = false;

}
function selectCell(r, c, shift) {
  const sh = cur();
  sh.act = [r, c];
  if (!shift) sh.anchor = [r, c];
}
function onCellClick(e) {
  const td = e.target.closest('td.c');

  const r = +td.dataset.r, c = +td.dataset.c;
  if (editing) step(() => { const ch = commitIfEditing(); selectCell(r, c, e.shiftKey); return ch; });
  else { selectCell(r, c, e.shiftKey); refresh(); }
  grid.focus();
}
function undo() { if (!undoS.length) return; const s = undoS.pop(); restore(s.before); redoS.push(s); refresh(); sni.value = cur().name; }
function redo() { if (!redoS.length) return; const s = redoS.pop(); restore(s.after); undoS.push(s); refresh(); sni.value = cur().name; }
function clearSel() {
  step(() => {
    const sh = cur(), s = selRect(sh); let ch = false;
    for (let r = s.r1; r <= s.r2; r++) for (let c = s.c1; c <= s.c2; c++) { const i = r * COLS + c; if (sh.raw[i] !== '') { sh.raw[i] = ''; ch = true; } }
    return ch;
  });
}
function onGridKey(e) {
  const k = e.key, kl = k.length === 1 ? k.toLowerCase() : k;
  const ctrl = e.ctrlKey || e.metaKey;
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };

  else if (ctrl && kl === 'y') { if (!editing) redo(); }

}
function onFormulaKey(e) {

    const tab = e.key === 'Tab';
    step(() => { const ch = commitIfEditing(); const sh = cur(); clampMove(sh, tab ? 0 : 1, tab ? 1 : 0); sh.anchor = sh.act.slice(); return ch; });
    fi.focus();
  } else if (e.key === 'Escape') {

}
function setFormat(f) {
  if (editing || !FORMATS.includes(f)) return;
  step(() => {
    const sh = cur(), s = selRect(sh); let ch = false;
    for (let r = s.r1; r <= s.r2; r++) for (let c = s.c1; c <= s.c2; c++) { const i = r * COLS + c; if (sh.fmt[i] !== f) { sh.fmt[i] = f; ch = true; } }
    return ch;
  });
}
function takeClip(mode) {
  const sh = cur(), s = selRect(sh);
  const raw = [], fmt = [];
  for (let r = s.r1; r <= s.r2; r++) { const rr = [], ff = []; for (let c = s.c1; c <= s.c2; c++) { rr.push(sh.raw[r * COLS + c]); ff.push(sh.fmt[r * COLS + c]); } raw.push(rr); fmt.push(ff); }

}
function paste() {
  if (!clip) return;
  step(() => {
    const b = clip;
    if (b.mode === 'cut') {
      const si = findSheet(b.sheet);
      if (si >= 0) {
        const src = wb.sheets[si];
        for (let i = 0; i < b.raw.length; i++) for (let j = 0; j < b.raw[0].length; j++) { const x = (b.r1 + i) * COLS + b.c1 + j; src.raw[x] = ''; src.fmt[x] = 'general'; }
      }
    }
    const sh = cur(), s = selRect(sh);
    const tr = s.r1, tc = s.c1;
    for (let i = 0; i < b.raw.length; i++) for (let j = 0; j < b.raw[0].length; j++) {
      const r = tr + i, c = tc + j;
      if (r >= ROWS || c >= COLS) continue;
      const x = r * COLS + c;
      sh.raw[x] = b.mode === 'copy' ? adjustRaw(b.raw[i][j], tc - b.c1, tr - b.r1) : b.raw[i][j];
      sh.fmt[x] = b.fmt[i][j];
    }

  });
}
function sortKeyRank(raw, v) { if (raw === '') return 4; if (isErr(v)) return 3; return typeof v === 'number' ? 0 : typeof v === 'string' ? 1 : 2; }
function sortRows(desc) {
  step(() => {
    const S = wb.active, sh = cur(), s = selRect(sh), kc = sh.act[1];
    const rows = [];
    for (let r = s.r1; r <= s.r2; r++) { const i = r * COLS + kc; rows.push({ r, rank: sortKeyRank(sh.raw[i], vals[S][i]), v: vals[S][i] }); }
    const asc = (a, b) => a.rank - b.rank || (a.rank <= 2 ? cmpSame(a.v, b.v) : 0);
    rows.sort((a, b) => {
      if (!desc) return asc(a, b);

      if (ae || be) return (ae ? 1 : 0) - (be ? 1 : 0);

  });
}
function fill(down) {
  step(() => {
    const sh = cur(), s = selRect(sh);
    if (down ? s.r2 === s.r1 : s.c2 === s.c1) return false;
    for (let r = s.r1; r <= s.r2; r++) for (let c = s.c1; c <= s.c2; c++) {
      if (down ? r === s.r1 : c === s.c1) continue;
      const src = down ? s.r1 * COLS + c : r * COLS + s.c1;
      sh.raw[r * COLS + c] = adjustRaw(sh.raw[src], down ? 0 : c - s.c1, down ? r - s.r1 : 0);
      sh.fmt[r * COLS + c] = sh.fmt[src];
    }
    return true;
  });
}
function fillSeries() {
  step(() => {
    const sh = cur(), s = selRect(sh);
    const lines = [];
    if (s.r1 === s.r2) { const l = []; for (let c = s.c1; c <= s.c2; c++) l.push(s.r1 * COLS + c); lines.push(l); }
    else for (let c = s.c1; c <= s.c2; c++) { const l = []; for (let r = s.r1; r <= s.r2; r++) l.push(r * COLS + c); lines.push(l); }
    let any = false;
    for (const l of lines) {
      if (l.length < 3) continue;
      if (!isNumberKind(sh.raw[l[0]]) || !isNumberKind(sh.raw[l[1]])) continue;
      const a = literalValue(sh.raw[l[0]]), b = literalValue(sh.raw[l[1]]);
      const st = N(b - a); if (isErr(st)) continue;
      const out = [];
      let ok = true;
      for (let k = 3; k <= l.length; k++) { const v = N(a + (k - 1) * st); if (isErr(v)) { ok = false; break; } out.push(v); }
      if (!ok) continue;
      out.forEach((v, j) => { sh.raw[l[j + 2]] = P(v); sh.fmt[l[j + 2]] = sh.fmt[l[0]]; });
      any = true;
    }
    return any;
  });
}
function onTab(i) {
  if (editing || i >= wb.sheets.length) return;
  wb.active = i;
  refresh();
  sni.value = cur().name;
}
function defaultSheetName() { for (let n = 1; ; n++) if (findSheet('Sheet' + n) < 0) return 'Sheet' + n; }
function addSheet() {
  setMsg('sheet', '');
  if (wb.sheets.length >= 5) return;
  step(() => { wb.sheets.push(newSheet(defaultSheetName())); wb.active = wb.sheets.length - 1; return true; });
  sni.value = cur().name;
}
function renameSheet() {
  setMsg('sheet', '');
  const v = sni.value, sh = cur();
  if (!validSheetName(v)) { setMsg('sheet', 'Invalid sheet name'); return; }
  const o = findSheet(v);
  if (o >= 0 && o !== wb.active) { setMsg('sheet', 'Sheet name already used'); return; }
  if (v === sh.name) return;
  step(() => {
    const old = sh.name.toUpperCase();
    wb.sheets.forEach(s2 => { for (let i = 0; i < NC; i++) s2.raw[i] = rewriteRaw(s2.raw[i], u => u.pre !== null && u.pre.toUpperCase() === old ? { ...u, pre: v } : u); });
    sh.name = v;
    return true;
  });
  sni.value = cur().name;
}
function deleteSheet() {
  setMsg('sheet', '');
  if (wb.sheets.length <= 1) return;
  step(() => {
    const S = wb.active, sh = wb.sheets[S], up = sh.name.toUpperCase();
    wb.sheets.forEach((s2, si) => { if (si === S) return; for (let i = 0; i < NC; i++) s2.raw[i] = rewriteRaw(s2.raw[i], u => u.pre !== null && u.pre.toUpperCase() === up ? null : u); });
    for (const nm of wb.names) if (!nm.target.removed && nm.target.sid === sh.id) nm.target = { removed: true };
    wb.sheets.splice(S, 1);
    wb.active = Math.min(S, wb.sheets.length - 1);
    return true;
  });
  sni.value = cur().name;
}
function defineName() {
  setMsg('name', '');
  const v = nameInput.value;
  if (!validName(v)) { setMsg('name', 'Invalid name'); return; }
  if (findName(v)) { setMsg('name', 'Name already used'); return; }
  if (wb.names.length >= 10) { setMsg('name', 'Too many names'); return; }
  step(() => {
    const sh = cur(), s = selRect(sh);
    const range = !(s.r1 === s.r2 && s.c1 === s.c2);
    wb.names.push({ name: v, target: { sid: sh.id, r1: s.r1, c1: s.c1, r2: s.r2, c2: s.c2, range } });
    return true;
  });
  nameInput.value = '';
}
function deleteName() {
  setMsg('name', '');
  const d = findName(nameInput.value);
  if (!d) { setMsg('name', 'Unknown name'); return; }
  step(() => { wb.names.splice(wb.names.indexOf(d), 1); return true; });
  nameInput.value = '';
}
function asciiUp(s) { return s.replace(/[a-z]/g, ch => ch.toUpperCase()); }
function matcher() {
  const needle = findInput.value, mc = findCase.checked, whole = findWhole.checked;
  const norm = mc ? (s => s) : asciiUp;
  const nn = norm(needle);
  return {
    needle,
    test(raw) { if (!needle || raw === '') return false; const h = norm(raw); return whole ? h === nn : h.includes(nn); },
    replace(raw, rep) {
      if (whole) return rep;
      const h = norm(raw); let out = '', pos = 0;
      for (;;) { const i = h.indexOf(nn, pos); if (i < 0) break; out += raw.slice(pos, i) + rep; pos = i + nn.length; }

}
function findNext() {
  setMsg('find', '');
  const m = matcher(), sh = cur();

  setMsg('find', 'Matches: ' + count);
  if (count) {
    const start = sh.act[0] * COLS + sh.act[1];
    for (let k = 1; k <= NC; k++) { const i = (start + k) % NC; if (m.test(sh.raw[i])) { sh.act = [Math.floor(i / COLS), i % COLS]; sh.anchor = sh.act.slice(); break; } }
  }
  refresh();
}
function replaceAll() {
  setMsg('find', '');
  const m = matcher(), rep = replInput.value;
  let count = 0;
  step(() => {
    const sh = cur(); let ch = false;
    const hits = [];
    for (let i = 0; i < NC; i++) if (m.test(sh.raw[i])) hits.push(i);
    count = hits.length;
    for (const i of hits) { if (commitString(sh, i, m.replace(sh.raw[i], rep))) ch = true; }
    return ch;

function exportCSV() {
  setMsg('csv', '');
  const sh = cur(), S = wb.active, raw = csvRaw.checked;
  let R = -1, C = -1;
  for (let i = 0; i < NC; i++) if (sh.raw[i] !== '') { R = Math.max(R, Math.floor(i / COLS)); C = Math.max(C, i % COLS); }

  for (let r = 0; r <= R; r++) {
    const f = [];
    for (let c = 0; c <= C; c++) { const i = r * COLS + c; f.push(csvField(raw ? sh.raw[i] : display(vals[S][i], sh.fmt[i]))); }

function importCSV() {

  const text = csvText.value;

  const recs = parseCSV(text);
  if (!recs) { setMsg('csv', 'Invalid CSV'); return; }
  let k = 0, d = 0;
  step(() => {
    const sh = cur();
    for (let i = 0; i < NC; i++) sh.raw[i] = '';
    recs.forEach((rec, i) => rec.forEach((f, j) => {
      if (f === '') return;
      if (i < ROWS && j < COLS) { commitString(sh, i * COLS + j, f); k++; } else d++;
    }));

  });

/* ---------- wiring ---------- */
function init() {
  buildGrid();
  let loaded = null;
  try { loaded = loadState(); } catch (e) { loaded = null; }
  wb = loaded || newWorkbook();
  // fields start empty on every load
  sni.value = cur().name; nameInput.value = ''; findInput.value = ''; replInput.value = ''; csvText.value = '';
  findCase.checked = false; findWhole.checked = false; csvRaw.checked = false;
  recalc(); render();
  grid.addEventListener('click', guard(onCellClick));
  grid.addEventListener('mousedown', e => { if (e.shiftKey) e.preventDefault(); });
  grid.addEventListener('keydown', guard(onGridKey));
  fi.addEventListener('input', guard(() => { if (!editing) { editing = true; render(); } }));
  fi.addEventListener('keydown', guard(onFormulaKey));
  fmtSel.addEventListener('change', guard(() => setFormat(fmtSel.value)));
  const on = (id, fn) => $(id).addEventListener('click', guard(fn));
  on('undo-button', undo); on('redo-button', redo);
  on('copy-button', () => takeClip('copy')); on('cut-button', () => takeClip('cut')); on('paste-button', paste);
  on('clear-button', clearSel);
  on('insert-row', () => step(() => { structChange('r', true); return true; }));
  on('delete-row', () => step(() => { structChange('r', false); return true; }));
  on('insert-col', () => step(() => { structChange('c', true); return true; }));
  on('delete-col', () => step(() => { structChange('c', false); return true; }));
  on('sort-asc', () => sortRows(false)); on('sort-desc', () => sortRows(true));
  on('fill-down', () => fill(true)); on('fill-right', () => fill(false)); on('fill-series', fillSeries);
  on('add-sheet', addSheet); on('rename-sheet', renameSheet); on('delete-sheet', deleteSheet);
  on('define-name', defineName); on('delete-name', deleteName);
  on('find-next', findNext); on('replace-all', replaceAll);
  on('csv-export', exportCSV); on('csv-import', importCSV);
}
init();
