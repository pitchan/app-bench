on('delete-sheet',()=>transaction(()=>{let si=book.active,old=S().name;book.sheets.forEach(s=>s.cells.forEach(c=>c.raw=rewrite(c.raw,n=>n.pr&&eq(n.pr.name,old)?dead():n)));book.names.forEach(n=>{if(n.target){if(n.target.si===si)n.target=null;else if(n.target.si>si)n.target.si--}});book.sheets.splice(si,1);book.active=Math.min(si,book.sheets.length-1);syncSheetName()},true),'sheet-message');
on('define-name',()=>{let name=$('name-input').value;if(!/^[A-Za-z_][A-Za-z0-9_]{0,19}$/.test(name)||/^[A-Za-z]+[0-9]+$/.test(name)||/^(TRUE|FALSE)$/i.test(name)||Object.hasOwn(signatures,upper(name))){message('name-message','Invalid name');return}if(book.names.some(n=>eq(n.name,name))){message('name-message','Name already used');return}if(book.names.length===10){message('name-message','Too many names');return}transaction(()=>{book.names.push({name,target:selection()});$('name-input').value=''},true)},'name-message');
on('delete-name',()=>{let i=book.names.findIndex(n=>eq(n.name,$('name-input').value));if(i<0){message('name-message','Unknown name');return}transaction(()=>{book.names.splice(i,1);$('name-input').value=''},true)},'name-message');
['asc','desc'].forEach(dir=>on('sort-'+dir,()=>{recalc();let r=selection(),key=S().active%8,rows=[];for(let y=r.a.r;y<=r.b.r;y++)rows.push({y,v:value(book.active,(y-1)*8+key),cells:S().cells.slice(idx(r.a.c,y),idx(r.b.c,y)+1).map(clone)});let sorted=rows.slice().sort((a,b)=>{let x=a.v,y=b.v;if(x===null||y===null)return x===null?(y===null?0:1):-1;let c=isErr(x)?(isErr(y)?0:1):isErr(y)?-1:compare(x,y);return dir==='asc'?c:-c});if(sorted.every((x,i)=>x.y===rows[i].y))return;transaction(()=>sorted.forEach((row,j)=>row.cells.forEach((cell,k)=>S().cells[idx(r.a.c+k,r.a.r+j)]=cell)),true)}));
['down','right'].forEach(dir=>on('fill-'+dir,()=>{let r=selection();if(dir==='down'?r.a.r===r.b.r:r.a.c===r.b.c)return;transaction(()=>{let old=clone(S().cells);positions(r).forEach(i=>{let c=i%8+1,y=Math.floor(i/8)+1,sc=dir==='down'?c:r.a.c,sr=dir==='down'?r.a.r:y;if(sc===c&&sr===y)return;let cell=clone(old[idx(sc,sr)]);cell.raw=adjust(cell.raw,c-sc,y-sr);S().cells[i]=cell})},true)}));
on('fill-series',()=>{let r=selection(),lines=[];if(r.a.r===r.b.r)lines.push(positions(r));else for(let c=r.a.c;c<=r.b.c;c++)lines.push(Array.from({length:r.b.r-r.a.r+1},(_,j)=>idx(c,r.a.r+j)));let updates=[];for(let line of lines){if(line.length<3)continue;let [a,b]=line.slice(0,2).map(i=>S().cells[i]);if(a.raw.startsWith('=')||b.raw.startsWith('='))continue;let x=literal(a.raw),y=literal(b.raw);if(typeof x!=='number'||typeof y!=='number')continue;let step=attempt(()=>number(y-x));if(isErr(step))continue;let ns=line.slice(2).map((_,j)=>attempt(()=>number(x+(j+2)*step)));if(ns.some(isErr))continue;ns.forEach((v,j)=>updates.push({i:line[j+2],cell:{raw:P(v),fmt:a.fmt}}))}if(updates.length)transaction(()=>updates.forEach(u=>S().cells[u.i]=u.cell),true)});
function findMatches(){let needle=$('find-input').value,whole=$('find-whole').checked,cs=$('find-case').checked,fold=s=>cs?s:s.replace(/[a-z]/g,c=>c.toUpperCase()),n=fold(needle),matches=[];if(!needle)return {matches,needle,whole,fold};S().cells.forEach((c,i)=>{if(c.raw&&(whole?fold(c.raw)===n:fold(c.raw).includes(n)))matches.push(i)});return {matches,needle,whole,fold}}
on('find-next',()=>{let {matches}=findMatches();message('find-status','Matches: '+matches.length);if(matches.length){let i=matches.find(i=>i>S().active);if(i===undefined)i=matches[0];S().anchor=S().active=i;render();save()}},'find-status');
on('replace-all',()=>{let {matches,needle,whole,fold}=findMatches(),replacement=$('replace-input').value;message('find-status','Replaced: '+matches.length);transaction(()=>{for(let i of matches){let raw=S().cells[i].raw,out=replacement;if(!whole){let start=0,p,outparts=[],folded=fold(raw),n=fold(needle);while((p=folded.indexOf(n,start))>=0){outparts.push(raw.slice(start,p),replacement);start=p+needle.length}outparts.push(raw.slice(start));out=outparts.join('')}commit(S().cells[i],out)}})},'find-status');
function csvRead(text){let rows=[],row=[],i=0;while(true){let field='';if(text[i]==='"'){i++;let closed=false;while(i<text.length){if(text[i]==='"'){if(text[i+1]==='"'){field+='"';i+=2}else{i++;closed=true;break}}else if(text[i]==='\r'||text[i]==='\n'){if(text[i]==='\r'&&text[i+1]==='\n')i++;i++;field+=' '}else field+=text[i++]}if(!closed||(i<text.length&&![',','\r','\n'].includes(text[i])))return null}else{while(i<text.length&&![',','\r','\n'].includes(text[i]))field+=text[i++]}row.push(field);if(i===text.length){rows.push(row);break}if(text[i]===','){i++;continue}if(text[i]==='\r'&&text[i+1]==='\n')i++;i++;rows.push(row);row=[];if(i===text.length)break}return rows}
on('csv-export',()=>{let cells=S().cells,lastR=0,lastC=0;cells.forEach((c,i)=>{if(c.raw){lastR=Math.max(lastR,Math.floor(i/8)+1);lastC=Math.max(lastC,i%8+1)}});let rows=[];for(let r=1;r<=lastR;r++){let row=[];for(let c=1;c<=lastC;c++){let i=idx(c,r),s=$('csv-raw').checked?cells[i].raw:format(value(book.active,i),cells[i].fmt);row.push(/[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s)}rows.push(row.join(','))}$('csv-text').value=rows.join('\n')},'csv-message');
on('csv-import',()=>{let text=$('csv-text').value;if(!text){message('csv-message','Nothing to import');return}let rows=csvRead(text);if(!rows){message('csv-message','Invalid CSV');return}transaction(()=>{S().cells.forEach(c=>c.raw='');let k=0,d=0;rows.forEach((row,y)=>row.forEach((s,x)=>{if(s==='')return;if(y<12&&x<8){commit(S().cells[y*8+x],s);k++}else d++}));message('csv-message',`Imported: ${k} | Dropped: ${d}`)},true)},'csv-message');
$('formula-input').addEventListener('input',()=>{editing=true;disabledState()});
$('formula-input').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();$('grid').focus()}else if(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();finishEdit(()=>move(e.key==='Tab'?1:0,e.key==='Enter'?1:0));$('formula-input').focus()}});
$('grid').addEventListener('keydown',e=>{let arrows={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]},key=e.key,ctrl=e.ctrlKey?key.toLowerCase():'';if(arrows[key]||['Enter','Delete','Backspace'].includes(key)||['z','y'].includes(ctrl)){e.preventDefault();if(key==='Enter'){$('formula-input').focus();return}if(editing)return;if(arrows[key]){move(...arrows[key],e.shiftKey);render();save()}else if(key==='Delete'||key==='Backspace')clearCells();else history(ctrl==='y')}});
function validBook(b){let point=p=>p&&Number.isInteger(p.c)&&p.c>=1&&p.c<=8&&Number.isInteger(p.r)&&p.r>=1&&p.r<=12;return b&&b.version===1&&Array.isArray(b.sheets)&&b.sheets.length>=1&&b.sheets.length<=5&&Number.isInteger(b.active)&&b.active>=0&&b.active<b.sheets.length&&b.sheets.every(s=>s&&typeof s.name==='string'&&/^[A-Za-z0-9 _.'-]{1,20}$/.test(s.name)&&!s.name.startsWith(' ')&&!s.name.endsWith(' ')&&Array.isArray(s.cells)&&s.cells.length===96&&s.cells.every(c=>c&&typeof c.raw==='string'&&['general','fixed2','percent1','date'].includes(c.fmt))&&[s.anchor,s.active].every(i=>Number.isInteger(i)&&i>=0&&i<96))&&new Set(b.sheets.map(s=>upper(s.name))).size===b.sheets.length&&Array.isArray(b.names)&&b.names.length<=10&&b.names.every(n=>n&&typeof n.name==='string'&&/^[A-Za-z_][A-Za-z0-9_]{0,19}$/.test(n.name)&&!/^[A-Za-z]+[0-9]+$/.test(n.name)&&!/^(TRUE|FALSE)$/i.test(n.name)&&!Object.hasOwn(signatures,upper(n.name))&&(n.target===null||(n.target&&Number.isInteger(n.target.si)&&n.target.si>=0&&n.target.si<b.sheets.length&&point(n.target.a)&&point(n.target.b)&&n.target.a.c<=n.target.b.c&&n.target.a.r<=n.target.b.r&&typeof n.target.isRange==='boolean'&&(n.target.isRange||(n.target.a.c===n.target.b.c&&n.target.a.r===n.target.b.r)))))&&new Set(b.names.map(n=>upper(n.name))).size===b.names.length}
try{let saved=JSON.parse(localStorage.getItem('tally-book'));if(validBook(saved))book=saved}catch(e){}
['name-input','find-input','replace-input','csv-text'].forEach(id=>$(id).value='');['find-case','find-whole','csv-raw'].forEach(id=>$(id).checked=false);syncSheetName();render();
</script>
