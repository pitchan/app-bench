<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f7;color:#14171a}
[hidden]{display:none !important}
header{padding:10px 16px;background:#ffffff;border-bottom:1px solid #c5cbd5}
h1{margin:0;font-size:18px;font-weight:700;color:#14171a}
main{max-width:1200px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
main>*{min-width:0}
.panel{background:#ffffff;border:1px solid #c5cbd5;border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.panel label{color:#14171a;font-weight:600}
.sep{width:1px;align-self:stretch;background:#c5cbd5;margin:0 2px}
button{font:inherit;padding:6px 10px;border:1px solid #6f7887;border-radius:6px;background:#edf0f4;color:#14171a;cursor:pointer;max-width:100%}
button:disabled{color:#7b8494;border-color:#c5cbd5;background:#f3f4f7;cursor:default}
input[type=text],select,textarea{font:inherit;padding:6px 8px;border:1px solid #6f7887;border-radius:6px;background:#ffffff;color:#14171a;min-width:0;max-width:100%}
input[type=text]:disabled,select:disabled,textarea:disabled{background:#f3f4f7;color:#7b8494;border-color:#c5cbd5}
input[type=checkbox]{width:16px;height:16px;margin:0}
button:focus,input:focus,select:focus,textarea:focus,[role=grid]:focus{outline:3px solid #1d4ed8;outline-offset:1px}
.fbar{display:flex;gap:6px;align-items:stretch}
.namebox{flex:0 0 auto;min-width:84px;padding:6px 8px;border:1px solid #6f7887;border-radius:6px;background:#ffffff;color:#14171a;font-weight:600;text-align:center}
.fbar input{flex:1 1 auto;width:100%;font-family:ui-monospace,Consolas,Menlo,monospace}
.fbar input[data-editing=true]{border-color:#1d4ed8;background:#f5f8ff}
.grid{overflow-x:auto;background:#ffffff;border:1px solid #6f7887;border-radius:6px;user-select:none;-webkit-user-select:none;scroll-padding-left:46px}
.row{display:grid;grid-template-columns:46px repeat(8,minmax(104px,1fr));min-width:878px}
.row>*{height:30px;line-height:29px;padding:0 6px;border-right:1px solid #d3d8e0;border-bottom:1px solid #d3d8e0;overflow:hidden;white-space:pre;text-overflow:ellipsis}
.hd{background:#e6e9ef;color:#14171a;font-weight:600;text-align:center}
.row>[role=rowheader]{position:sticky;left:0;z-index:1}
.cell{background:#ffffff;color:#14171a;cursor:cell}
.cell[data-kind=number]{text-align:right}
.cell[data-kind=logical]{text-align:center}
.cell[data-kind=error]{color:#a30000;text-align:center}
.cell[data-in-selection=true]{background:#dbe8fe}
.cell[aria-selected=true]{box-shadow:inset 0 0 0 2px #1d4ed8}
.sumwrap{min-height:22px}
.summary{color:#14171a;font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tabs button{border-radius:6px 6px 0 0;white-space:pre}
.tabs button[aria-selected=true]{background:#1e40af;color:#ffffff;border-color:#1e40af}
.tabs button[aria-selected=true]:disabled{background:#c9d3ee;color:#4b5563;border-color:#c5cbd5}
.msg{color:#9b1c1c;font-weight:600;overflow-wrap:anywhere}
.status{color:#14171a;font-weight:600;overflow-wrap:anywhere}
.names{flex:1 1 100%;display:flex;flex-direction:column;gap:2px;min-width:0}
.names>div{color:#14171a;overflow-wrap:anywhere;padding:2px 4px;font-family:ui-monospace,Consolas,Menlo,monospace}
.grow{flex:1 1 150px}
.chk{display:inline-flex;align-items:center;gap:5px}
textarea{flex:1 1 100%;width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,Consolas,Menlo,monospace}
@media (min-width:900px){.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.pair>*{min-width:0;align-content:flex-start}}
@media (max-width:899px){.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Fable 5.2</h1></header>
<main>
<div class="panel" data-testid="toolbar">
<button type="button" data-testid="undo-button">Undo</button>
<button type="button" data-testid="redo-button">Redo</button>
<span class="sep"></span>
<button type="button" data-testid="copy-button">Copy</button>
<button type="button" data-testid="cut-button">Cut</button>
<button type="button" data-testid="paste-button">Paste</button>
<button type="button" data-testid="clear-button">Clear</button>
<span class="sep"></span>
<button type="button" data-testid="insert-row">Insert row</button>
<button type="button" data-testid="delete-row">Delete row</button>

<button type="button" data-testid="delete-col">Delete column</button>
<span class="sep"></span>
<button type="button" data-testid="sort-asc">Sort ascending</button>
<button type="button" data-testid="sort-desc">Sort descending</button>
<button type="button" data-testid="fill-down">Fill down</button>
<button type="button" data-testid="fill-right">Fill right</button>
<button type="button" data-testid="fill-series">Fill series</button>
<span class="sep"></span>

</div>
<div class="fbar">
<div class="namebox" data-testid="name-box"></div>
<input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>

<span class="sep"></span>

<input type="text" id="sheet-name-input" class="grow" data-testid="sheet-name-input" autocomplete="off" spellcheck="false">
<button type="button" data-testid="rename-sheet">Rename sheet</button>
<button type="button" data-testid="delete-sheet">Delete sheet</button>
<div class="msg" data-testid="sheet-message" hidden></div>
</div>
<div class="pair">
<div class="panel" data-testid="names-panel">
<label for="name-input">Name</label>
<input type="text" id="name-input" class="grow" data-testid="name-input" autocomplete="off" spellcheck="false">
<button type="button" data-testid="define-name">Define name</button>
<button type="button" data-testid="delete-name">Delete name</button>

</div>
<div class="panel" data-testid="find-panel">

<span class="chk"><input type="checkbox" id="find-whole" data-testid="find-whole" autocomplete="off"><label for="find-whole">Whole cell</label></span>
<button type="button" data-testid="find-next">Find next</button>
<button type="button" data-testid="replace-all">Replace all</button>
<div class="status" data-testid="find-status" hidden></div>
</div>
</div>
<div class="panel" data-testid="csv-panel">
<span class="chk"><input type="checkbox" id="csv-raw" data-testid="csv-raw" autocomplete="off"><label for="csv-raw">Raw contents</label></span>
<button type="button" data-testid="csv-export">Export CSV</button>
<button type="button" data-testid="csv-import">Import CSV</button>
<div class="msg" data-testid="csv-message" hidden></div>
<textarea data-testid="csv-text" aria-label="CSV" autocomplete="off" spellcheck="false"></textarea>
</div>
</main>
<script>
(function(){
'use strict';
var COLS=8, ROWS=12, MAXS=2958464, KEY='tally-book';
var FORMATS=['general','fixed2','percent1','date'];

/* ---------- values ---------- */
function Err(c){this.c=c;}
var E={};
['#SYNTAX!','#NAME?','#ARGS!','#REF!','#VALUE!','#DIV/0!','#NUM!','#N/A','#CYCLE!'].forEach(function(c){E[c]=new Err(c);});
var SYNTAX=E['#SYNTAX!'],NAME=E['#NAME?'],ARGS=E['#ARGS!'],REF=E['#REF!'],VALUE=E['#VALUE!'],DIV0=E['#DIV/0!'],NUM=E['#NUM!'],NA=E['#N/A'],CYCLE=E['#CYCLE!'];
function isErr(v){return v instanceof Err;}
function N(x){var y=Number(x.toPrecision(12));return y===0?0:y;}
function num(x){if(!isFinite(x))return NUM;x=N(x);if(Math.abs(x)>=1e15)return NUM;return x;}

/* decimal representation of a normalized number: m * 10^e, m of 12 digits */
function dec(x){
  if(x===0||!isFinite(x))return{neg:false,m:0n,e:0};
  var s=Math.abs(x).toExponential(11),i=s.indexOf('e');
  return{neg:x<0,m:BigInt(s[0]+s.slice(2,i)),e:parseInt(s.slice(i+1),10)-11};
}
/* mode 0: half away from zero, 1: away from zero, -1: toward zero */
function roundQ(x,d,mode){
  var D=dec(x),sh=D.e+d,q;
  if(sh>=0)q=D.m*(10n**BigInt(sh));
  else{
    var k=-sh;
    if(k>40){q=(mode===1&&D.m!==0n)?1n:0n;}
    else{
      var p=10n**BigInt(k);q=D.m/p;var rem=D.m%p;
      if(mode===0){if(rem*2n>=p)q+=1n;}
      else if(mode===1){if(rem!==0n)q+=1n;}
    }
  }
  return{neg:D.neg&&q!==0n,q:q};
}
function fmtQ(r,d,group){
  var s=r.q.toString(),ip,fp='';
  if(d>0){s=s.padStart(d+1,'0');ip=s.slice(0,-d);fp=s.slice(-d);}
  else ip=r.q===0n?'0':s+'0'.repeat(-d);
  if(group)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return(r.neg?'-':'')+ip+(d>0?'.'+fp:'');
}
function roundNum(x,d,mode){return Number(fmtQ(roundQ(x,d,mode),d,false));}
function general(x){return fmtQ(roundQ(x,6,0),6,false).replace(/0+$/,'').replace(/\.$/,'');}
function plain(x){
  var D=dec(x);if(D.m===0n)return'0';
  var ds=D.m.toString(),out;
  if(D.e>=0)out=ds+'0'.repeat(D.e);
  else{var s=ds.padStart(-D.e+1,'0');out=s.slice(0,D.e)+'.'+s.slice(D.e);out=out.replace(/0+$/,'').replace(/\.$/,'');}
  return(D.neg?'-':'')+out;
}

/* ---------- dates ---------- */
function dfc(y,m,d){
  y-=m<=2?1:0;
  var era=Math.floor(y/400),yoe=y-era*400;
  var doy=Math.floor((153*(m+(m>2?-3:9))+2)/5)+d-1;
  var doe=yoe*365+Math.floor(yoe/4)-Math.floor(yoe/100)+doy;
  return era*146097+doe-719468;
}
var BASE=dfc(1899,12,31);
function serial(y,m,d){return dfc(y,m,d)-BASE;}
function civil(s){
  var z=s+BASE+719468,era=Math.floor(z/146097),doe=z-era*146097;
  var yoe=Math.floor((doe-Math.floor(doe/1460)+Math.floor(doe/36524)-Math.floor(doe/146096))/365);
  var y=yoe+era*400,doy=doe-(365*yoe+Math.floor(yoe/4)-Math.floor(yoe/100));
  var mp=Math.floor((5*doy+2)/153),d=doy-Math.floor((153*mp+2)/5)+1,m=mp<10?mp+3:mp-9;
  return[y+(m<=2?1:0),m,d];
}
function dim(y,m){
  if(m===2)return(y%4===0&&(y%100!==0||y%400===0))?29:28;
  return[31,28,31,30,31,30,31,31,30,31,30,31][m-1];
}
function p2(n){return n<10?'0'+n:''+n;}
function dateStr(s){var c=civil(s);return String(c[0]).padStart(4,'0')+'-'+p2(c[1])+'-'+p2(c[2]);}
function dateEntry(t){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t);if(!m)return null;
  var y=+m[1],mo=+m[2],d=+m[3];
  if(y<1900||mo<1||mo>12||d<1||d>dim(y,mo))return null;
  return serial(y,mo,d);
}
function entryNumber(t){
  if(!/^[+-]?(\d+(\.\d+)?|\.\d+)%?$/.test(t))return null;
  var pct=t.charAt(t.length-1)==='%',x=Number(pct?t.slice(0,-1):t);
  if(pct)x=x/100;
  if(!isFinite(x))return null;
  x=N(x);if(Math.abs(x)>=1e15)return null;
  return x;
}
function trimSp(s){return s.replace(/^ +/,'').replace(/ +$/,'');}
function classify(s){
  if(s==='')return{kind:'empty',v:null};
  var c=s.charAt(0);
  if(c==='=')return{kind:'formula',v:null};
  if(c==="'")return{kind:'text',v:s.slice(1)};
  var t=trimSp(s),d=dateEntry(t);
  if(d!==null)return{kind:'number',v:d,date:true};
  var n=entryNumber(t);
  if(n!==null)return{kind:'number',v:n};
  var u=t.toUpperCase();
  if(u==='TRUE'||u==='FALSE')return{kind:'logical',v:u==='TRUE'};
  return{kind:'text',v:s};
}

/* ---------- display ---------- */
function show(v,fmt){
  if(v===null)return'';
  if(typeof v==='string')return v;
  if(typeof v==='boolean')return v?'TRUE':'FALSE';
  if(isErr(v))return v.c;
  if(fmt==='fixed2')return fmtQ(roundQ(v,2,0),2,true);
  if(fmt==='percent1')return fmtQ(roundQ(N(v*100),1,0),1,false)+'%';
  if(fmt==='date'){var d=Math.floor(v);if(d>=1&&d<=MAXS)return dateStr(d);}
  return general(v);
}
function kindOf(v){
  if(v===null)return'empty';
  if(typeof v==='number')return'number';
  if(typeof v==='string')return'text';
  if(typeof v==='boolean')return'logical';
  return'error';
}

/* ---------- tokens and grammar ---------- */
var CMP={'=':1,'<>':1,'<':1,'<=':1,'>':1,'>=':1};
var SYN={syn:true};
var REFERR={t:'referr'};
function tokenize(src){
  var toks=[],i=0,n=src.length,m,j,v,ch,reNum=/(\d+(\.\d+)?|\.\d+)/y,reWord=/[A-Za-z_$][A-Za-z0-9_$]*/y;
  while(i<n){
    ch=src.charAt(i);
    if(ch===' '){i++;continue;}
    var nx=src.charAt(i+1);
    if((ch>='0'&&ch<='9')||(ch==='.'&&nx>='0'&&nx<='9'&&nx!=='')){
      reNum.lastIndex=i;m=reNum.exec(src);toks.push({k:'num',text:m[0]});i+=m[0].length;continue;
    }
    if(ch==='"'){
      j=i+1;v='';
      for(;;){
        if(j>=n)return null;
        if(src.charAt(j)==='"'){if(src.charAt(j+1)==='"'){v+='"';j+=2;}else{j++;break;}}
        else v+=src.charAt(j++);
      }
      toks.push({k:'str',text:src.slice(i,j),v:v});i=j;continue;
    }
    if(/[A-Za-z_$]/.test(ch)){
      reWord.lastIndex=i;m=reWord.exec(src);var w=m[0];i+=w.length;
      if(src.charAt(i)==='!'){
        if(w.indexOf('$')>=0)return null;
        i++;toks.push({k:'sheet',name:w});continue;
      }
      var up=w.toUpperCase(),m2;
      if(up==='TRUE'||up==='FALSE')toks.push({k:'bool',v:up==='TRUE'});
      else if((m2=/^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w)))
        toks.push({k:'ref',ref:{ca:!!m2[1],col:m2[2].toUpperCase(),ra:!!m2[3],row:m2[4].replace(/^0+(?=\d)/,'')}});
      else if(w.indexOf('$')<0)toks.push({k:'name',name:up});
      else return null;
      continue;
    }
    if(ch==="'"){
      j=i+1;v='';
      for(;;){
        if(j>=n)return null;
        if(src.charAt(j)==="'"){if(src.charAt(j+1)==="'"){v+="'";j+=2;}else{j++;break;}}
        else v+=src.charAt(j++);
      }
      if(!v.length||src.charAt(j)!=='!')return null;
      toks.push({k:'sheet',name:v});i=j+1;continue;
    }
    if(ch==='#'){
      if(src.substr(i,5).toUpperCase()==='#REF!'){toks.push({k:'referr'});i+=5;continue;}
      return null;
    }
    var two=src.substr(i,2);
    if(two==='<>'||two==='<='||two==='>='){toks.push({k:'op',v:two});i+=2;continue;}
    if('+-*/^&%=<>'.indexOf(ch)>=0){toks.push({k:'op',v:ch});i++;continue;}
    if('(),:'.indexOf(ch)>=0){toks.push({k:'p',v:ch});i++;continue;}
    return null;
  }
  return toks;
}
function cmpStr(a,b){return a.length-b.length||(a<b?-1:a>b?1:0);}
function mkRange(sheet,a,b){
  var c1={abs:a.ca,v:a.col},c2={abs:b.ca,v:b.col},r1={abs:a.ra,v:a.row},r2={abs:b.ra,v:b.row},t;
  if(cmpStr(c1.v,c2.v)>0){t=c1;c1=c2;c2=t;}
  if(cmpStr(r1.v,r2.v)>0){t=r1;r1=r2;r2=t;}
  return{t:'range',sheet:sheet,a:{ca:c1.abs,col:c1.v,ra:r1.abs,row:r1.v},b:{ca:c2.abs,col:c2.v,ra:r2.abs,row:r2.v}};
}
var astCache=new Map();
function parseFormula(raw){
  var hit=astCache.get(raw);
  if(hit!==undefined)return hit;
  var ast=null;
  try{
    var toks=tokenize(raw.slice(1));
    if(toks){
      var p=0;
      var isOp=function(v){var t=toks[p];return !!t&&t.k==='op'&&t.v===v;};
      var isP=function(v){var t=toks[p];return !!t&&t.k==='p'&&t.v===v;};
      var expr=function(){
        var l=concat();
        while(toks[p]&&toks[p].k==='op'&&CMP[toks[p].v]===1){var op=toks[p++].v;l={t:'bin',op:op,l:l,r:concat()};}
        return l;
      };
      var concat=function(){var l=sum();while(isOp('&')){p++;l={t:'bin',op:'&',l:l,r:sum()};}return l;};
      var sum=function(){var l=product();while(isOp('+')||isOp('-')){var op=toks[p++].v;l={t:'bin',op:op,l:l,r:product()};}return l;};
      var product=function(){var l=signed();while(isOp('*')||isOp('/')){var op=toks[p++].v;l={t:'bin',op:op,l:l,r:signed()};}return l;};
      var signed=function(){if(isOp('-')||isOp('+')){var op=toks[p++].v;return{t:'un',op:op,x:signed()};}return power();};
      var power=function(){var b=percent();if(isOp('^')){p++;return{t:'bin',op:'^',l:b,r:signed()};}return b;};
      var percent=function(){var x=primary();while(isOp('%')){p++;x={t:'pct',x:x};}return x;};
      var refOrRange=function(sheet){
        var a=toks[p++].ref;
        if(isP(':')){var b=toks[p+1];if(!b||b.k!=='ref')throw SYN;p+=2;return mkRange(sheet,a,b.ref);}
        return{t:'ref',sheet:sheet,ref:a};
      };
      var primary=function(){
        var t=toks[p];if(!t)throw SYN;
        switch(t.k){
          case'num':p++;return{t:'num',text:t.text};
          case'str':p++;return{t:'str',text:t.text,v:t.v};
          case'bool':p++;return{t:'bool',v:t.v};
          case'referr':p++;return REFERR;
          case'sheet':p++;if(!toks[p]||toks[p].k!=='ref')throw SYN;return refOrRange(t.name);
          case'ref':return refOrRange(null);
          case'name':
            p++;
            if(isP('(')){
              p++;var args=[];
              if(!isP(')')){for(;;){args.push(expr());if(isP(',')){p++;continue;}break;}}
              if(!isP(')'))throw SYN;
              p++;return{t:'call',name:t.name,args:args};
            }
            return{t:'name',name:t.name};
          case'p':
            if(t.v==='('){p++;var x=expr();if(!isP(')'))throw SYN;p++;return{t:'paren',x:x};}
            throw SYN;
          default:throw SYN;
        }
      };
      ast=expr();
      if(p!==toks.length)ast=null;
    }
  }catch(e){ast=null;}
  if(astCache.size>4000)astCache.clear();
  astCache.set(raw,ast);
  return ast;
}
function quoteName(n){return /^[A-Za-z_][A-Za-z0-9_]*$/.test(n)?n:"'"+n.replace(/'/g,"''")+"'";}
function refText(r){return(r.ca?'$':'')+r.col+(r.ra?'$':'')+r.row;}
function ser(n,canon){
  switch(n.t){
    case'num':case'str':return n.text;
    case'bool':return n.v?'TRUE':'FALSE';
    case'referr':return'#REF!';
    case'ref':return pre(n.sheet,canon)+refText(n.ref);
    case'range':return pre(n.sheet,canon)+refText(n.a)+':'+refText(n.b);

    var sh=S.sheets[si];
    for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
      var raw=sh.raw[r][c];
      if(raw.charAt(0)!=='=')continue;
      var ast=parseFormula(raw);if(!ast)continue;

    index.set(v,cnt);low.set(v,cnt);cnt++;stack.push(v);on.add(v);

    for(var i=0;i<ws.length;i++){
      var w=ws[i];

      if(w===v){circ.add(v);continue;}
      if(!index.has(w)){strong(w);if(low.get(w)<low.get(v))low.set(v,low.get(w));}
      else if(on.has(w)){if(index.get(w)<low.get(v))low.set(v,index.get(w));}
    }
    if(low.get(v)===index.get(v)){
      var comp=[],x;
      do{x=stack.pop();on.delete(x);comp.push(x);}while(x!==v);

/* ---------- reference rewriting ---------- */
function mapN(n,f){
  var x,l,r;
  switch(n.t){
    case'ref':case'range':return f(n);
    case'call':
      var ch=false,args=n.args.map(function(a){var y=mapN(a,f);if(y!==a)ch=true;return y;});
      return ch?{t:'call',name:n.name,args:args}:n;
    case'bin':l=mapN(n.l,f);r=mapN(n.r,f);return(l!==n.l||r!==n.r)?{t:'bin',op:n.op,l:l,r:r}:n;
    case'un':x=mapN(n.x,f);return x!==n.x?{t:'un',op:n.op,x:x}:n;
    case'pct':x=mapN(n.x,f);return x!==n.x?{t:'pct',x:x}:n;
    case'paren':x=mapN(n.x,f);return x!==n.x?{t:'paren',x:x}:n;
  }
  return n;
}
function rewriteRaw(raw,f){
  if(raw.charAt(0)!=='=')return raw;
  var ast=parseFormula(raw);if(!ast)return raw;
  try{
    var n2=mapN(ast,f);
    return n2===ast?raw:'='+ser(n2,false);
  }catch(e){return raw;}
}
function rewriteAll(f){
  for(var fi=0;fi<S.sheets.length;fi++){
    var sh=S.sheets[fi];
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      var raw=sh.raw[r][c];
      if(raw.charAt(0)==='=')sh.raw[r][c]=rewriteRaw(raw,function(n){return f(n,fi);});
    }
  }
}
function insPoint(n,at,lim){return n<at?n:(n+1>lim?null:n+1);}
function insRange(t,b,at,lim){var t2=t<at?t:t+1,b2=b<at?b:b+1;if(t2>lim)return null;return[t2,Math.min(b2,lim)];}
function delPoint(n,at){return n<at?n:(n===at?null:n-1);}
function delRange(t,b,at){if(at>b)return[t,b];if(at<t)return[t-1,b-1];if(t===b)return null;return[t,b-1];}
function getAx(ref,axis){return axis==='row'?rowIdx(ref)+1:colIdx(ref)+1;}
function setAx(ref,axis,n){
  return axis==='row'?{ca:ref.ca,col:ref.col,ra:ref.ra,row:String(n)}:{ca:ref.ca,col:String.fromCharCode(64+n),ra:ref.ra,row:ref.row};
}
function structNode(node,axis,ins,at,lim){
  if(node.t==='ref'){
    if(!inGrid(node.ref))return node;
    var n=getAx(node.ref,axis),p=ins?insPoint(n,at,lim):delPoint(n,at);
    if(p===null)return REFERR;
    if(p===n)return node;
    return{t:'ref',sheet:node.sheet,ref:setAx(node.ref,axis,p)};
  }
  if(!inGrid(node.a)||!inGrid(node.b))return node;
  var t=getAx(node.a,axis),b=getAx(node.b,axis),rg=ins?insRange(t,b,at,lim):delRange(t,b,at);
  if(rg===null)return REFERR;
  if(rg[0]===t&&rg[1]===b)return node;
  return{t:'range',sheet:node.sheet,a:setAx(node.a,axis,rg[0]),b:setAx(node.b,axis,rg[1])};
}
function moveRef(ref,dc,dr){
  var c=colIdx(ref),r=rowIdx(ref);
  if(!ref.ca)c+=dc;
  if(!ref.ra)r+=dr;
  if(c<0||c>=COLS||r<0||r>=ROWS)return null;
  return{ca:ref.ca,col:String.fromCharCode(65+c),ra:ref.ra,row:String(r+1)};
}
function adjust(raw,dc,dr){
  if(dc===0&&dr===0)return raw;
  return rewriteRaw(raw,function(node){
    if(node.t==='ref'){
      if(!inGrid(node.ref))return node;
      var m=moveRef(node.ref,dc,dr);
      return m?{t:'ref',sheet:node.sheet,ref:m}:REFERR;
    }
    if(!inGrid(node.a)||!inGrid(node.b))return node;
    var a=moveRef(node.a,dc,dr),b=moveRef(node.b,dc,dr);
    if(!a||!b)return REFERR;
    return mkRange(node.sheet,a,b);
  });
}

/* ---------- committing ---------- */
function prepare(s){
  if(s.charAt(0)==='='){
    var ast=parseFormula(s);
    if(ast){try{return{raw:'='+ser(ast,true),date:false};}catch(e){}}
    return{raw:s,date:false};
  }
  return{raw:s,date:s!==''&&s.charAt(0)!=="'"&&dateEntry(trimSp(s))!==null};
}
function commitForce(sh,r,c,s){
  var p=prepare(s),ch=p.raw!==sh.raw[r][c];
  sh.raw[r][c]=p.raw;
  if(p.date&&sh.fmt[r][c]==='general'){sh.fmt[r][c]='date';ch=true;}
  return ch;
}

/* ---------- names and sheets rules ---------- */
function validSheetName(v){return /^[A-Za-z0-9 _.'-]{1,20}$/.test(v)&&v.charAt(0)!==' '&&v.charAt(v.length-1)!==' ';}
function validName(v){
  if(!/^[A-Za-z_][A-Za-z0-9_]{0,19}$/.test(v))return false;
  var u=v.toUpperCase();
  if(u==='TRUE'||u==='FALSE'||FN.has(u))return false;
  return !/^[A-Za-z]+[0-9]+$/.test(v);
}
function targetText(d){
  if(d.kind==='removed')return'#REF!';
  var i=sheetById(d.sid);if(i<0)return'#REF!';
  var p=quoteName(S.sheets[i].name)+'!';
  return d.kind==='cell'?p+addr(d.r1,d.c1):p+addr(d.r1,d.c1)+':'+addr(d.r2,d.c2);
}
function sortedNames(){
  return S.names.slice().sort(function(a,b){var x=a.name.toUpperCase(),y=b.name.toUpperCase();return x<y?-1:x>y?1:0;});
}

/* ---------- CSV ---------- */
function csvField(f){return /[",\r\n]/.test(f)?'"'+f.replace(/"/g,'""')+'"':f;}
function csvParse(text){
  var recs=[],rec=[],i=0,n=text.length,ch,buf;
  for(;;){
    if(text.charAt(i)==='"'&&i<n){
      i++;buf='';
      for(;;){
        if(i>=n)return null;
        ch=text.charAt(i);
        if(ch==='"'){if(text.charAt(i+1)==='"'){buf+='"';i+=2;}else{i++;break;}}
        else if(ch==='\r'){if(text.charAt(i+1)==='\n')i++;buf+=' ';i++;}
        else if(ch==='\n'){buf+=' ';i++;}
        else{buf+=ch;i++;}
      }
      if(i<n){ch=text.charAt(i);if(ch!==','&&ch!=='\r'&&ch!=='\n')return null;}
    }else{
      var st=i;
      while(i<n){ch=text.charAt(i);if(ch===','||ch==='\r'||ch==='\n')break;i++;}
      buf=text.slice(st,i);
    }
    rec.push(buf);
    if(i>=n){recs.push(rec);break;}
    ch=text.charAt(i);
    if(ch===','){i++;continue;}
    if(ch==='\r'&&text.charAt(i+1)==='\n')i+=2;else i++;
    recs.push(rec);rec=[];
    if(i>=n)break;
  }
  return recs;
}

/* ---------- finding ---------- */
function fold(s){return s.replace(/[A-Z]/g,function(c){return c.toLowerCase();});}
function matcher(needle,mcase,whole){
  var nd=mcase?needle:fold(needle);
  return function(raw){
    if(needle===''||raw==='')return false;
    var h=mcase?raw:fold(raw);
    return whole?h===nd:h.indexOf(nd)>=0;
  };
}
function replaced(raw,needle,rep,mcase,whole){
  if(whole)return rep;
  var nd=mcase?needle:fold(needle),h=mcase?raw:fold(raw),out='',pos=0,i;
  for(;;){
    i=h.indexOf(nd,pos);
    if(i<0)break;
    out+=raw.slice(pos,i)+rep;
    pos=i+nd.length;
  }
  return out+raw.slice(pos);
}

/* ---------- persistence ---------- */
function isPos(p){return !!p&&typeof p==='object'&&Number.isInteger(p.r)&&Number.isInteger(p.c)&&p.r>=0&&p.r<ROWS&&p.c>=0&&p.c<COLS;}
function restore(o){
  if(!o||typeof o!=='object'||Array.isArray(o)||o.v!==1)return null;
  if(!Array.isArray(o.sheets)||o.sheets.length<1||o.sheets.length>5)return null;
  if(!Number.isInteger(o.active)||o.active<0||o.active>=o.sheets.length)return null;
  if(!Array.isArray(o.names)||o.names.length>10)return null;
  var out={v:1,sheets:[],names:[],active:o.active},ids={},seen={},i,r,c,maxId=0;
  for(i=0;i<o.sheets.length;i++){
    var s=o.sheets[i];
    if(!s||typeof s!=='object')return null;
    if(!Number.isInteger(s.id)||s.id<1||ids[s.id])return null;
    ids[s.id]=true;if(s.id>maxId)maxId=s.id;
    if(typeof s.name!=='string'||!validSheetName(s.name))return null;
    var u=s.name.toUpperCase();if(seen['n'+u])return null;seen['n'+u]=true;
    if(!Array.isArray(s.raw)||s.raw.length!==ROWS||!Array.isArray(s.fmt)||s.fmt.length!==ROWS)return null;
    var raw=[],fmt=[];
    for(r=0;r<ROWS;r++){
      if(!Array.isArray(s.raw[r])||s.raw[r].length!==COLS||!Array.isArray(s.fmt[r])||s.fmt[r].length!==COLS)return null;
      for(c=0;c<COLS;c++){
        if(typeof s.raw[r][c]!=='string'||FORMATS.indexOf(s.fmt[r][c])<0)return null;
      }
      raw.push(s.raw[r].slice());fmt.push(s.fmt[r].slice());
    }

    out.sheets.push({id:s.id,name:s.name,raw:raw,fmt:fmt,anchor:{r:s.anchor.r,c:s.anchor.c},active:{r:s.active.r,c:s.active.c}});
  }
  var ns={};
  for(i=0;i<o.names.length;i++){
    var d=o.names[i];
    if(!d||typeof d!=='object'||typeof d.name!=='string'||!validName(d.name))return null;
    var nu=d.name.toUpperCase();if(ns['n'+nu])return null;ns['n'+nu]=true;
    if(d.kind==='removed'){out.names.push({name:d.name,kind:'removed',sid:null,r1:0,c1:0,r2:0,c2:0});continue;}
    if(d.kind!=='cell'&&d.kind!=='range')return null;
    if(!ids[d.sid])return null;
    if(!isPos({r:d.r1,c:d.c1})||!isPos({r:d.r2,c:d.c2})||d.r1>d.r2||d.c1>d.c2)return null;
    if(d.kind==='cell'&&(d.r1!==d.r2||d.c1!==d.c2))return null;
    out.names.push({name:d.name,kind:d.kind,sid:d.sid,r1:d.r1,c1:d.c1,r2:d.r2,c2:d.c2});
  }

}

});
grid.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[role="gridcell"]'):null;
  if(!el||!grid.contains(el))return;
  var b=snap(),ch=false;
  if(editing)ch=commitEdit();
  var sh=cur();
  sh.active={r:el._r,c:el._c};
  if(!e.shiftKey)sh.anchor={r:el._r,c:el._c};
  if(ch)step(b);
  render();
  grid.focus({preventScroll:true});
});
function reveal(){
  var sh=cur(),el=cells[sh.active.r][sh.active.c];
  try{el.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
}
grid.addEventListener('keydown',function(e){
  if(e.target!==grid)return;
  var k=e.key,sh=cur(),dr=0,dc=0,handled=true;
  if(k==='ArrowUp')dr=-1;else if(k==='ArrowDown')dr=1;else if(k==='ArrowLeft')dc=-1;else if(k==='ArrowRight')dc=1;
  if(dr||dc){
    if(!editing){
      var r=sh.active.r+dr,c=sh.active.c+dc;
      if(r>=0&&r<ROWS&&c>=0&&c<COLS)sh.active={r:r,c:c};
      if(!e.shiftKey)sh.anchor={r:sh.active.r,c:sh.active.c};
      render();reveal();
    }
  }else if(k==='Delete'||k==='Backspace'){if(!editing)clearSel();}
  else if(k==='Enter'){fi.focus();}
  else if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='Z')){if(!editing)doUndo();}
  else if((e.ctrlKey||e.metaKey)&&(k==='y'||k==='Y')){if(!editing)doRedo();}
  else handled=false;
  if(handled)e.preventDefault();
});

/* ---------- actions ---------- */
function doUndo(){
  if(!undoSt.length)return;
  var st=undoSt.pop();redoSt.push(st);S=JSON.parse(st.b);syncSheetName();render();
}
function doRedo(){
  if(!redoSt.length)return;
  var st=redoSt.pop();undoSt.push(st);S=JSON.parse(st.a);syncSheetName();render();
}
function clearSel(){
  var sh=cur(),s=selRect(sh),b=snap(),ch=false;
  for(var r=s.r1;r<=s.r2;r++)for(var c=s.c1;c<=s.c2;c++)if(sh.raw[r][c]!==''){sh.raw[r][c]='';ch=true;}
  if(ch){step(b);render();}
}
function takeBlock(mode){
  var sh=cur(),s=selRect(sh),raw=[],fmt=[];
  for(var r=s.r1;r<=s.r2;r++){raw.push(sh.raw[r].slice(s.c1,s.c2+1));fmt.push(sh.fmt[r].slice(s.c1,s.c2+1));}
  clip={mode:mode,r1:s.r1,c1:s.c1,r2:s.r2,c2:s.c2,sheet:sh.name,raw:raw,fmt:fmt};
  updControls();
}
function paste(){
  if(!clip)return;
  var b=snap(),r,c,i,j;
  if(clip.mode==='cut'){
    var t=sheetIdx(clip.sheet);
    if(t>=0){
      var src=S.sheets[t];
      for(r=clip.r1;r<=clip.r2;r++)for(c=clip.c1;c<=clip.c2;c++){src.raw[r][c]='';src.fmt[r][c]='general';}
    }
  }
  var sh=cur(),s=selRect(sh),r0=s.r1,c0=s.c1,dr=r0-clip.r1,dc=c0-clip.c1;
  for(i=0;i<clip.raw.length;i++)for(j=0;j<clip.raw[i].length;j++){
    r=r0+i;c=c0+j;
    if(r>=ROWS||c>=COLS)continue;
    var raw=clip.raw[i][j];
    if(clip.mode==='copy')raw=adjust(raw,dc,dr);
    sh.raw[r][c]=raw;sh.fmt[r][c]=clip.fmt[i][j];
  }
  sh.anchor={r:r0,c:c0};sh.active={r:r0,c:c0};
  if(clip.mode==='cut')clip=null;
  step(b);render();
}
function structOp(axis,ins){
  var b=snap(),si=S.active,sh=cur(),at=axis==='row'?sh.active.r:sh.active.c,r;
  if(axis==='row'){
    if(ins){sh.raw.splice(at,0,mkRow(''));sh.raw.pop();sh.fmt.splice(at,0,mkRow('general'));sh.fmt.pop();}
    else{sh.raw.splice(at,1);sh.raw.push(mkRow(''));sh.fmt.splice(at,1);sh.fmt.push(mkRow('general'));}
  }else{
    for(r=0;r<ROWS;r++){
      if(ins){sh.raw[r].splice(at,0,'');sh.raw[r].pop();sh.fmt[r].splice(at,0,'general');sh.fmt[r].pop();}
      else{sh.raw[r].splice(at,1);sh.raw[r].push('');sh.fmt[r].splice(at,1);sh.fmt[r].push('general');}
    }
  }
  var at1=at+1,lim=axis==='row'?ROWS:COLS;
  rewriteAll(function(n,fi2){
    var pt=n.sheet===null?fi2===si:sheetIdx(n.sheet)===si;
    return pt?structNode(n,axis,ins,at1,lim):n;
  });
  S.names.forEach(function(d){
    if(d.kind==='removed'||d.sid!==sh.id)return;
    var lo=(axis==='row'?d.r1:d.c1)+1,hi=(axis==='row'?d.r2:d.c2)+1,rg;
    if(d.kind==='cell'){var p=ins?insPoint(lo,at1,lim):delPoint(lo,at1);rg=p===null?null:[p,p];}
    else rg=ins?insRange(lo,hi,at1,lim):delRange(lo,hi,at1);
    if(rg===null){d.kind='removed';d.sid=null;d.r1=d.c1=d.r2=d.c2=0;}
    else if(axis==='row'){d.r1=rg[0]-1;d.r2=rg[1]-1;}
    else{d.c1=rg[0]-1;d.c2=rg[1]-1;}
  });
  step(b);render();
}
function sortRows(desc){
  var sh=cur(),s=selRect(sh),kc=sh.active.c,rows=[],r,c;
  recalc();
  for(r=s.r1;r<=s.r2;r++){
    var v=cellVal(S.active,r,kc);
    rows.push({r:r,v:v,cls:v===null?4:isErr(v)?3:rank(v)});
  }
  var asc=function(a,b){
    if(a.cls!==b.cls)return a.cls<b.cls?-1:1;
    if(a.cls>=3)return 0;
    return cmp(a.v,b.v);
  };
  var sorted=rows.slice().sort(desc?function(a,b){
    if(a.cls===4||b.cls===4)return a.cls===b.cls?0:(a.cls===4?1:-1);
    return -asc(a,b);
  }:asc);
  var moved=false,i;
  for(i=0;i<rows.length;i++)if(sorted[i].r!==rows[i].r){moved=true;break;}
  if(!moved)return;
  var b=snap(),raws=[],fmts=[];
  for(i=0;i<sorted.length;i++){raws.push(sh.raw[sorted[i].r].slice(s.c1,s.c2+1));fmts.push(sh.fmt[sorted[i].r].slice(s.c1,s.c2+1));}
  for(i=0;i<sorted.length;i++)for(c=s.c1;c<=s.c2;c++){
    sh.raw[s.r1+i][c]=raws[i][c-s.c1];sh.fmt[s.r1+i][c]=fmts[i][c-s.c1];
  }
  step(b);render();
}
function fill(down){
  var sh=cur(),s=selRect(sh),r,c;
  if(down?s.r1===s.r2:s.c1===s.c2)return;
  var b=snap();
  if(down){
    for(c=s.c1;c<=s.c2;c++)for(r=s.r1+1;r<=s.r2;r++){
      sh.raw[r][c]=adjust(sh.raw[s.r1][c],0,r-s.r1);sh.fmt[r][c]=sh.fmt[s.r1][c];
    }
  }else{
    for(r=s.r1;r<=s.r2;r++)for(c=s.c1+1;c<=s.c2;c++){
      sh.raw[r][c]=adjust(sh.raw[r][s.c1],c-s.c1,0);sh.fmt[r][c]=sh.fmt[r][s.c1];
    }
  }
  step(b);render();
}
function fillSeries(){
  var sh=cur(),s=selRect(sh),lines=[],line,r,c,any=false,b=snap();
  if(s.r1===s.r2){line=[];for(c=s.c1;c<=s.c2;c++)line.push([s.r1,c]);lines.push(line);}
  else for(c=s.c1;c<=s.c2;c++){line=[];for(r=s.r1;r<=s.r2;r++)line.push([r,c]);lines.push(line);}
  lines.forEach(function(ln){
    if(ln.length<3)return;
    var k0=classify(sh.raw[ln[0][0]][ln[0][1]]),k1=classify(sh.raw[ln[1][0]][ln[1][1]]);
    if(k0.kind!=='number'||k1.kind!=='number')return;
    var a=k0.v,st=num(k1.v-a);
    if(isErr(st))return;
    var vals=[],k,v;
    for(k=3;k<=ln.length;k++){v=num(a+(k-1)*st);if(isErr(v))return;vals.push(v);}
    var f=sh.fmt[ln[0][0]][ln[0][1]];
    for(k=2;k<ln.length;k++){sh.raw[ln[k][0]][ln[k][1]]=plain(vals[k-2]);sh.fmt[ln[k][0]][ln[k][1]]=f;}
    any=true;
  });
  if(any){step(b);render();}
}
function on(id,fn){$(id).addEventListener('click',function(){if(editing)return;fn();});}
on('undo-button',doUndo);
on('redo-button',doRedo);
on('copy-button',function(){takeBlock('copy');});
on('cut-button',function(){takeBlock('cut');});
on('paste-button',paste);
on('clear-button',clearSel);
on('insert-row',function(){structOp('row',true);});
on('delete-row',function(){structOp('row',false);});
on('insert-col',function(){structOp('col',true);});
on('delete-col',function(){structOp('col',false);});
on('sort-asc',function(){sortRows(false);});
on('sort-desc',function(){sortRows(true);});
on('fill-down',function(){fill(true);});
on('fill-right',function(){fill(false);});
on('fill-series',fillSeries);
fmtSel.addEventListener('change',function(){
  if(editing)return;
  var f=fmtSel.value;if(FORMATS.indexOf(f)<0)return;
  var sh=cur(),s=selRect(sh),b=snap(),ch=false;
  for(var r=s.r1;r<=s.r2;r++)for(var c=s.c1;c<=s.c2;c++)if(sh.fmt[r][c]!==f){sh.fmt[r][c]=f;ch=true;}
  if(ch)step(b);
  render();
});

/* sheets */
tabsEl.addEventListener('click',function(e){
  var btn=e.target&&e.target.closest?e.target.closest('[role="tab"]'):null;
  if(!btn||editing||btn.disabled)return;
  var i=Array.prototype.indexOf.call(tabsEl.children,btn);
  if(i<0||i>=S.sheets.length)return;
  S.active=i;syncSheetName();render();
});
on('add-sheet',function(){
  setMsg(sheetMsg,'');
  if(S.sheets.length>=5)return;
  var b=snap(),n=1;
  while(sheetIdx('Sheet'+n)>=0)n++;
  S.sheets.push(mkSheet('Sheet'+n));
  S.active=S.sheets.length-1;
  step(b);syncSheetName();render();
});
on('rename-sheet',function(){
  setMsg(sheetMsg,'');
  var v=sni.value,sh=cur();
  if(!validSheetName(v)){setMsg(sheetMsg,'Invalid sheet name');return;}
  var other=sheetIdx(v);
  if(other>=0&&other!==S.active){setMsg(sheetMsg,'Sheet name already used');return;}
  if(v===sh.name)return;
  var b=snap(),old=sh.name.toUpperCase();
  rewriteAll(function(n){
    if(n.sheet===null||n.sheet.toUpperCase()!==old)return n;
    return n.t==='ref'?{t:'ref',sheet:v,ref:n.ref}:{t:'range',sheet:v,a:n.a,b:n.b};
  });
  sh.name=v;
  step(b);syncSheetName();render();
});
on('delete-sheet',function(){
  setMsg(sheetMsg,'');
  if(S.sheets.length<=1)return;
  var b=snap(),idx=S.active,sh=cur(),old=sh.name.toUpperCase();
  S.sheets.splice(idx,1);
  rewriteAll(function(n){return(n.sheet!==null&&n.sheet.toUpperCase()===old)?REFERR:n;});
  S.names.forEach(function(d){if(d.kind!=='removed'&&d.sid===sh.id){d.kind='removed';d.sid=null;d.r1=d.c1=d.r2=d.c2=0;}});
  S.active=Math.min(idx,S.sheets.length-1);
  step(b);syncSheetName();render();
});

/* names */
on('define-name',function(){
  setMsg(nameMsg,'');
  var v=ni.value;
  if(!validName(v)){setMsg(nameMsg,'Invalid name');return;}
  if(findName(v.toUpperCase())){setMsg(nameMsg,'Name already used');return;}
  if(S.names.length>=10){setMsg(nameMsg,'Too many names');return;}
  var b=snap(),sh=cur(),s=selRect(sh),single=s.r1===s.r2&&s.c1===s.c2;
  S.names.push({name:v,kind:single?'cell':'range',sid:sh.id,r1:s.r1,c1:s.c1,r2:s.r2,c2:s.c2});
  ni.value='';
  step(b);render();
});
on('delete-name',function(){
  setMsg(nameMsg,'');
  var d=findName(ni.value.toUpperCase());
  if(!d){setMsg(nameMsg,'Unknown name');return;}
  var b=snap();
  S.names.splice(S.names.indexOf(d),1);
  ni.value='';
  step(b);render();
});

/* find and replace */
on('find-next',function(){
  setMsg(findStatus,'');
  var sh=cur(),m=matcher(findIn.value,findCase.checked,findWhole.checked),n=0,r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(m(sh.raw[r][c]))n++;
  setMsg(findStatus,'Matches: '+n);
  if(!n)return;
  var start=sh.active.r*COLS+sh.active.c;
  for(var k=1;k<=ROWS*COLS;k++){
    var idx=(start+k)%(ROWS*COLS);r=Math.floor(idx/COLS);c=idx%COLS;
    if(m(sh.raw[r][c])){sh.active={r:r,c:c};sh.anchor={r:r,c:c};break;}
  }
  render();
});
on('replace-all',function(){
  setMsg(findStatus,'');
  var sh=cur(),needle=findIn.value,rep=replIn.value,mc=findCase.checked,wh=findWhole.checked;
  var m=matcher(needle,mc,wh),n=0,ch=false,b=snap(),todo=[],r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(m(sh.raw[r][c]))todo.push([r,c]);
  todo.forEach(function(p){
    n++;
    if(commitForce(sh,p[0],p[1],replaced(sh.raw[p[0]][p[1]],needle,rep,mc,wh)))ch=true;
  });
  setMsg(findStatus,'Replaced: '+n);
  if(ch){step(b);render();}
});

/* CSV */
on('csv-export',function(){
  setMsg(csvMsg,'');
  recalc();
  var sh=cur(),R=-1,C=-1,r,c,lines=[],rawMode=csvRaw.checked;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(sh.raw[r][c]!==''){if(r>R)R=r;if(c>C)C=c;}
  for(r=0;r<=R;r++){
    var f=[];
    for(c=0;c<=C;c++)f.push(csvField(rawMode?sh.raw[r][c]:show(cellVal(S.active,r,c),sh.fmt[r][c])));
    lines.push(f.join(','));
  }
  csvText.value=lines.join('\n');
});
on('csv-import',function(){
  setMsg(csvMsg,'');
  var text=csvText.value;
  if(text===''){setMsg(csvMsg,'Nothing to import');return;}
  var recs=csvParse(text);
  if(!recs){setMsg(csvMsg,'Invalid CSV');return;}
  var b=snap(),sh=cur(),r,c,k=0,d=0;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)sh.raw[r][c]='';
  for(r=0;r<recs.length;r++)for(c=0;c<recs[r].length;c++){
    var f=recs[r][c];
    if(f==='')continue;
    if(r<ROWS&&c<COLS){commitForce(sh,r,c,f);k++;}else d++;
  }
  setMsg(csvMsg,'Imported: '+k+' | Dropped: '+d);
  step(b);render();
});

/* ---------- start ---------- */
function resetFields(){
  ni.value='';findIn.value='';replIn.value='';csvText.value='';
  findCase.checked=false;findWhole.checked=false;csvRaw.checked=false;
  setMsg(sheetMsg,'');setMsg(nameMsg,'');setMsg(findStatus,'');setMsg(csvMsg,'');
  if(!editing)syncSheetName();
}
S=load();
resetFields();
render(false);
window.addEventListener('pageshow',function(e){
  if(e.persisted){editing=false;resetFields();render(false);}
});
})();
</script>
