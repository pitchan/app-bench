for(const id of ['cw','pm','short','long','sling','release','gravity','drag','wallDist'])$(id).addEventListener('change',()=>{sync();if(phase==='armed')resetShot()});$('fire').onclick=fire;$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Play':'Pause'};$('speedRange').oninput=e=>{$('speed').selectedIndex=+e.target.value};$('speed').onchange=e=>{$('speedRange').value=({'0.1':0,'0.25':1,'1':2})[e.target.value]};$('clear').onclick=clearMarks;$('wallBtn').onclick=rebuildWall;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();$('play').click()}if(e.key.toLowerCase()==='f'&&!['INPUT','SELECT'].includes(document.activeElement.tagName))fire()});document.querySelectorAll('.cam').forEach(b=>b.onclick=()=>{camMode=b.dataset.cam;document.querySelectorAll('.cam').forEach(x=>x.style.borderColor=x===b?'#dbab65':'')});
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(dragging&&camMode==='orbit'){orbitYaw-=(e.clientX-lastX)*.006;orbitPitch=clamp(orbitPitch+(e.clientY-lastY)*.006,-.1,1.35);lastX=e.clientX;lastY=e.clientY}});renderer.domElement.addEventListener('wheel',e=>{if(camMode==='orbit')orbitDist=clamp(orbitDist+e.deltaY*.025,12,150)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
window.trebuchetState=()=>({lastShot:shots.length?shots[shots.length-1]:null,shots:shots.slice(),settings:{...settings}});
})();</script></body></html>
