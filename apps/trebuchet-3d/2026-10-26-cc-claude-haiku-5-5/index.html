<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
:root{--ink:#1d1a16;--paper:rgba(252,248,240,.95);--line:#d6cbb8;--accent:#9a3412;--on-accent:#fff;--muted:#6b6258}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f1ebe0;--paper:rgba(30,27,24,.94);--line:#4a4137;--accent:#f59e0b;--on-accent:#111;--muted:#a79b8b}}
:root[data-theme="dark"]{--ink:#f1ebe0;--paper:rgba(30,27,24,.94);--line:#4a4137;--accent:#f59e0b;--on-accent:#111;--muted:#a79b8b}
html,body{margin:0;height:100%;overflow:hidden;background:#b9d2e0;color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.panel{position:fixed;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18);backdrop-filter:blur(4px);box-sizing:border-box;padding:10px 12px}
#top{top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px}
#brand{font-weight:700;font-size:16px;margin-right:6px}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
#status{margin-left:auto;font-variant-numeric:tabular-nums}
#settings{top:70px;right:10px;width:272px;max-height:calc(100vh - 90px);overflow:auto}
#settings h2,#readout h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:2px 0 8px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;margin:8px 0}
.row input[type=range]{grid-column:1/-1;width:100%;margin:0}
.row.check{grid-template-columns:1fr auto}
.row.check input{width:18px;height:18px;margin:0}
.presets{grid-template-columns:1fr}
.presets div{display:flex;gap:6px;flex-wrap:wrap}
.presets button{padding:3px 8px;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
#readout{left:10px;bottom:10px;width:300px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#score{margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.mark{position:fixed;left:0;top:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.mark.wall{color:var(--accent)}
.hidden{display:none !important}
@media (max-width:720px){
  #top{left:8px;right:8px;top:8px;padding:6px 8px}
  #settings{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:52vh}
  #readout{left:8px;right:8px;width:auto;bottom:8px}
  #readout{display:none}
  #readout.open{display:block}
  #status{margin-left:0}
  #toggle-readout{display:inline-block}
}
#toggle-readout{display:none}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header id="top" class="panel">
  <span id="brand">Claude Haiku 5.5</span>
  <button id="fire" class="primary" title="Shortcut: F">Fire (F)</button>
  <button id="pause" title="Shortcut: Space">Pause</button>
  <select id="speed" title="Simulation speed">
    <option value="0.1">0.1×</option>
    <option value="0.25">0.25×</option>
    <option value="1" selected>1×</option>
  </select>
  <select id="camera" title="Camera">
    <option value="side">Side</option>
    <option value="follow" selected>Follow</option>
    <option value="orbit">Orbit</option>
  </select>
  <button id="rebuild">Rebuild wall</button>
  <button id="clear">Clear</button>
  <button id="toggle-settings">Settings</button>
  <button id="toggle-readout">Last shot</button>
  <span id="status" class="muted">Ready</span>
</header>

<aside id="settings" class="panel">
  <h2>Settings</h2>
  <div id="settings-body"></div>
  <div class="row check"><label for="in-airDrag">Air drag</label><input id="in-airDrag" type="checkbox"></div>
  <div class="row presets">
    <span>Gravity presets</span>
    <div>
      <button data-g="9.81">Earth 9.81</button>
      <button data-g="3.71">Mars 3.71</button>
      <button data-g="1.62">Moon 1.62</button>
    </div>
  </div>
  <p class="hint">Settings apply to the next shot. Press Fire to throw.</p>
</aside>

<section id="readout" class="panel">
  <h2>Last shot</h2>
  <dl>
    <dt>Release speed</dt><dd id="r-speed">—</dd>
    <dt>Release angle</dt><dd id="r-angle">—</dd>
    <dt>Release height</dt><dd id="r-height">—</dd>
    <dt>Flight time</dt><dd id="r-time">—</dd>
    <dt>Range</dt><dd id="r-range">—</dd>
    <dt>Vacuum range</dt><dd id="r-vac">—</dd>
    <dt>Counterweight drop</dt><dd id="r-drop">—</dd>
    <dt>Efficiency</dt><dd id="r-eff">—</dd>
  </dl>
  <div id="score" class="muted">Wall hits: 0 · blocks moved: 0</div>
</section>

<div id="labels"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

/* ---------- constants (SI units) ---------- */
const DT = 1 / 1200;              // mechanism and stone step, s (fixed)
const MAX_STEPS_PER_FRAME = 240;  // cap on steps per rendered frame
const CANNON_DT = 1 / 240;        // wall physics step, s (fixed)
const CANNON_EVERY = 5;           // 5 mechanism steps = 1 wall step
const AXLE_H = 4.0;               // axle height above ground, m
const ARM_MASS = 50;              // uniform beam, kg
const STONE_DENSITY = 2400;       // kg/m^3
const AIR_RHO = 1.225;            // kg/m^3
const AIR_CD = 0.47;
const GROUND_MU = 0.5;            // sliding friction of the stone on the ground
const ALPHA = 5, BETA = 10;       // Baumgarte stabilisation of the sling constraint (1/s)
const WALL_H = 5, WALL_COLS = 16, WALL_ROWS = 10, WALL_LAYERS = 2;
const WALL_W = 8, BLOCK = 0.5, BLOCK_MASS = 250;
const LAUNCH_AT = 1.0;            // s after page load
const TRAIL_MAX = 40000, DUST_MAX = 240;

const DEFAULTS = {
  counterweightMass: 500, projectileMass: 10, shortArm: 1.5, longArm: 6.0,
  slingLength: 5.0, releaseAngle: 40, airDrag: false, gravity: 9.81, castleDistance: 120
};
const SLIDERS = [
  { key: 'counterweightMass', label: 'Counterweight', unit: 'kg', min: 100, max: 2000, step: 10 },
  { key: 'projectileMass', label: 'Stone mass', unit: 'kg', min: 1, max: 50, step: 0.5 },
  { key: 'shortArm', label: 'Short arm', unit: 'm', min: 0.5, max: 2.5, step: 0.05 },
  { key: 'longArm', label: 'Long arm', unit: 'm', min: 3, max: 9, step: 0.1 },
  { key: 'slingLength', label: 'Sling length', unit: 'm', min: 2, max: 8, step: 0.1 },
  { key: 'releaseAngle', label: 'Release angle', unit: '°', min: 10, max: 80, step: 1 },
  { key: 'gravity', label: 'Gravity', unit: 'm/s²', min: 0.5, max: 20, step: 0.01 },
  { key: 'castleDistance', label: 'Castle distance', unit: 'm', min: 40, max: 300, step: 1 }
];

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const UP = new THREE.Vector3(0, 1, 0);

// Deterministic generator for visuals only (grass, block tint, dust). Never used in physics.
let rngState = 20260527;
function rnd() { rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0; return rngState / 4294967296; }

/* ---------- settings panel ---------- */
const settingsBody = $('settings-body');
for (const c of SLIDERS) {
  c.dec = (String(c.step).split('.')[1] || '').length;
  settingsBody.insertAdjacentHTML('beforeend',
    `<div class="row"><label for="in-${c.key}">${c.label}</label>` +
    `<span><output id="out-${c.key}"></output> ${c.unit}</span>` +
    `<input id="in-${c.key}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${DEFAULTS[c.key]}"></div>`);
  $('in-' + c.key).addEventListener('input', showOutputs);
}
$('in-airDrag').checked = DEFAULTS.airDrag;
function showOutputs() {
  for (const c of SLIDERS) $('out-' + c.key).textContent = Number($('in-' + c.key).value).toFixed(c.dec);
}
showOutputs();
document.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {
  $('in-gravity').value = b.dataset.g;
  showOutputs();
}));

function readSettings() {
  const s = {};
  for (const c of SLIDERS) s[c.key] = Number($('in-' + c.key).value);
  s.airDrag = $('in-airDrag').checked;
  s.simSpeed = Number($('speed').value);
  s.cameraMode = $('camera').value;
  s.paused = paused;
  return s;
}

/* ---------- renderer, scene, camera ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d2e0);
scene.fog = new THREE.Fog(0xb9d2e0, 350, 1400);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(-20, 12, 40);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.minDistance = 5;
orbit.maxDistance = 900;
orbit.enabled = false;

const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x5a6b3a, 0.6));

function applyCastleVisuals(D) {
  const h = D * 0.5 + 30;
  sun.position.set(D * 0.5 + 40, 130, 90);
  sun.target.position.set(D * 0.5, 0, 0);
  const cam = sun.shadow.camera;
  cam.left = -h; cam.right = h; cam.top = h; cam.bottom = -h;
  cam.near = 1; cam.far = 600;
  cam.updateProjectionMatrix();
}

/* ---------- materials ---------- */
function makeGrassTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#5f8a3a';
  g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `hsl(${92 + rnd() * 18} ${40 + rnd() * 20}% ${28 + rnd() * 22}%)`;
    g.fillRect(rnd() * 128, rnd() * 128, 2, 2 + rnd() * 3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(300, 300);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const grassTex = makeGrassTexture();
const wood = new THREE.MeshStandardMaterial({ color: 0x7b5836, roughness: 0.85 });
const iron = new THREE.MeshStandardMaterial({ color: 0x3d3f44, metalness: 0.7, roughness: 0.45 });
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xd2bc8f, roughness: 1 });
const stoneVisMat = new THREE.MeshStandardMaterial({ color: 0x8d8a84, roughness: 0.92 });
const markMat = new THREE.MeshBasicMaterial({ color: 0xb91c1c, transparent: true, opacity: 0.85, depthWrite: false });
const markWallMat = new THREE.MeshBasicMaterial({ color: 0xea580c, transparent: true, opacity: 0.85, depthWrite: false });

function mesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
// Beam between two points, as a box of width w.
function member(a, b, w, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = mesh(new THREE.BoxGeometry(w, dir.length(), w), mat);
  m.position.addVectors(a, b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  return m;
}
// Round rod between two points.
function rod(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = mesh(new THREE.CylinderGeometry(r, r, dir.length(), 12), mat);
  m.position.addVectors(a, b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  return m;
}

/* ---------- static scene: ground, frame, trough, lights ---------- */
function buildStaticScene() {
  const ground = mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2;
  ground.castShadow = false;
  scene.add(ground);

  // Stone trough the stone rests in before the throw
  const trough = mesh(new THREE.BoxGeometry(10, 0.2, 0.6), wood);
  trough.position.set(4.0, 0.1, 0);
  scene.add(trough);

  // Wooden frame: two A-frames at z = ±1.2, sills and ties, iron axle
  const V = THREE.Vector3;
  for (const z of [-1.2, 1.2]) {
    scene.add(member(new V(-1.9, 0.15, z), new V(0, AXLE_H, z), 0.28, wood));
    scene.add(member(new V(1.9, 0.15, z), new V(0, AXLE_H, z), 0.28, wood));
    scene.add(member(new V(-2.6, 0.14, z), new V(2.6, 0.14, z), 0.25, wood));
    scene.add(member(new V(-1.0, 2.0, z), new V(1.0, 2.0, z), 0.2, wood));
  }
  scene.add(rod(new V(0, AXLE_H, -1.5), new V(0, AXLE_H, 1.5), 0.09, iron));

  // Sling rope: unit-height cylinder, stretched every frame
  ropeMesh = mesh(new THREE.CylinderGeometry(0.035, 0.035, 1, 6), ropeMat);
  scene.add(ropeMesh);

  // Stone
  stoneMesh = mesh(new THREE.SphereGeometry(1, 24, 16), stoneVisMat);
  scene.add(stoneMesh);

  // Trail of the stone path, drawn until the next shot
  trailGeo.setAttribute('position', trailAttr);
  trailGeo.setDrawRange(0, 0);
  scene.add(new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xfff3b0 })));

  // Dust puffs on impact
  scene.add(dust);

  // Sun and wall-block instancing
  applyCastleVisuals(readSettings().castleDistance);
  blockMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK),
    new THREE.MeshStandardMaterial({ roughness: 0.92 }), WALL_COLS * WALL_ROWS * WALL_LAYERS);
  blockMesh.castShadow = true;
  blockMesh.receiveShadow = true;
  scene.add(blockMesh);
}

let armGroup = null, stoneMesh = null, ropeMesh = null, blockMesh = null;
const trailPos = new Float32Array(TRAIL_MAX * 3);
const trailAttr = new THREE.BufferAttribute(trailPos, 3).setUsage(THREE.DynamicDrawUsage);
const trailGeo = new THREE.BufferGeometry();
let trailCount = 0;
function addTrail(x, y) {
  if (trailCount >= TRAIL_MAX) return;
  trailPos[3 * trailCount] = x;
  trailPos[3 * trailCount + 1] = y;
  trailPos[3 * trailCount + 2] = 0;
  trailCount++;
  trailGeo.setDrawRange(0, trailCount);
  trailAttr.needsUpdate = true;
}
function clearTrail() {
  trailCount = 0;
  trailGeo.setDrawRange(0, 0);
}

const dustPos = new Float32Array(DUST_MAX * 3);
const dustVel = new Float32Array(DUST_MAX * 3);
const dustLife = new Float32Array(DUST_MAX);
let dustNext = 0;
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3).setUsage(THREE.DynamicDrawUsage));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xd9c9a8, size: 0.8, transparent: true, opacity: 0.75, depthWrite: false
}));
function spawnDust(x, y, z, power) {
  for (let k = 0; k < 40; k++) {
    const i = dustNext++ % DUST_MAX;
    dustPos.set([x, y, z], i * 3);
    dustVel.set([(rnd() - 0.5) * 6 * power, (0.5 + rnd()) * 4 * power, (rnd() - 0.5) * 4 * power], i * 3);
    dustLife[i] = 1.4;
  }
}
function updateDust(dt) {
  for (let i = 0; i < DUST_MAX; i++) {
    if (dustLife[i] <= 0) continue;
    dustLife[i] -= dt;
    for (let j = 0; j < 3; j++) dustPos[i * 3 + j] += dustVel[i * 3 + j] * dt;
    dustVel[i * 3 + 1] -= 4 * dt;
    if (dustPos[i * 3 + 1] < 0.05 || dustLife[i] <= 0) {
      dustLife[i] = 0;
      dustPos[i * 3 + 1] = -1000;
    }
  }
  dustGeo.attributes.position.needsUpdate = true;
}

/* ---------- arm (rigid beam + counterweight + tip fitting) ---------- */
function buildArm() {
  if (armGroup) {
    scene.remove(armGroup);
    armGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
  armGroup = new THREE.Group();
  armGroup.position.set(0, AXLE_H, 0);
  const beam = mesh(new THREE.BoxGeometry(P.Ll + P.Ls, 0.22, 0.22), wood);
  beam.position.x = (P.Ll - P.Ls) / 2;            // beam runs from -Ls (counterweight) to +Ll (sling tip)
  const cw = mesh(new THREE.BoxGeometry(1.1, 1.3, 1.0), iron);
  cw.position.x = -P.Ls;
  const tip = mesh(new THREE.SphereGeometry(0.16, 16, 12), iron);
  tip.position.x = P.Ll;
  armGroup.add(beam, cw, tip);
  scene.add(armGroup);
}

/* ---------- wall: individual blocks in cannon-es ---------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 20;
world.defaultContactMaterial.friction = 0.5;
world.defaultContactMaterial.restitution = 0.1;
const blockPhys = new CANNON.Material('block');
world.addContactMaterial(new CANNON.ContactMaterial(blockPhys, blockPhys, { friction: 0.6, restitution: 0.05 }));
const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

let wallBodies = [], wallBase = [], wallD = null, displacedBlocks = 0;
const blockDummy = new THREE.Object3D();
function buildWall(D) {
  for (const b of wallBodies) world.removeBody(b);
  wallBodies = [];
  wallBase = [];
  wallD = D;
  const half = BLOCK / 2;
  let i = 0;
  for (let l = 0; l < WALL_LAYERS; l++) {
    for (let r = 0; r < WALL_ROWS; r++) {
      for (let c = 0; c < WALL_COLS; c++) {
        const p = new CANNON.Vec3(D - 0.25 + BLOCK * l, half + BLOCK * r, -WALL_W / 2 + half + BLOCK * c);
        const body = new CANNON.Body({
          mass: BLOCK_MASS, material: blockPhys,
          shape: new CANNON.Box(new CANNON.Vec3(half, half, half))
        });
        body.position.copy(p);
        world.addBody(body);
        wallBodies.push(body);
        wallBase.push(p.clone());
        const tint = (((i * 73856093) ^ (i * 19349663)) % 1000) / 1000;
        blockMesh.setColorAt(i, new THREE.Color().setHSL(0.11, 0.12, 0.62 + 0.12 * tint));
        i++;
      }
    }
  }
  blockMesh.instanceColor.needsUpdate = true;
}
function syncWall() {
  let moved = 0;
  for (let i = 0; i < wallBodies.length; i++) {
    const b = wallBodies[i];
    blockDummy.position.set(b.position.x, b.position.y, b.position.z);
    blockDummy.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
    blockDummy.updateMatrix();
    blockMesh.setMatrixAt(i, blockDummy.matrix);
    if (b.position.distanceTo(wallBase[i]) > 0.5) moved++;
  }
  blockMesh.instanceMatrix.needsUpdate = true;
  displacedBlocks = moved;
}

/* ---------- physics: mechanism and stone ---------- */
// P: parameters of the current shot, read from the settings at Fire.
// st: state of the arm (th, om) and the stone (x, y, vx, vy); x, y are the stone centre relative to the axle foot on the ground.
let P = null, st = null;
let mode = 'idle';                  // idle | sling | flight | cannon | landed
let simT = 0, accum = 0, t0 = 0, finishT = Infinity;
let lastN = 0, armed = false, relRec = null, landPoint = null;
let wallStone = null, wallTicks = 0, cannonTime = 0, cannonStill = 0, cannonDone = false;
let wallHits = 0, trailTick = 0, paused = false;
const shots = [];
let lastShot = null;

function makeParams(s) {
  const rs = Math.cbrt(3 * s.projectileMass / (4 * Math.PI * STONE_DENSITY));
  const Ls = s.shortArm, Ll = s.longArm, mcw = s.counterweightMass;
  const th0 = Math.PI - Math.asin(clamp((0.5 - AXLE_H) / Ll, -0.999, 0.999)); // tip 0.5 m above ground
  const tipX = Ll * Math.cos(th0), tipY = AXLE_H + Ll * Math.sin(th0);
  const dy = rs - tipY;
  return {
    g: s.gravity, mcw, ms: s.projectileMass, rs, Ls, Ll, Lsl: s.slingLength,
    drag: s.airDrag, dragK: s.airDrag ? 0.5 * AIR_RHO * AIR_CD * Math.PI * rs * rs : 0,
    relAng: s.releaseAngle * Math.PI / 180,
    // first moment of arm + counterweight about the axle (beam coordinate, signed)
    G: ARM_MASS * (Ll - Ls) / 2 - mcw * Ls,
    // moment of inertia about the axle: uniform beam from -Ls to +Ll, plus the counterweight as a point at -Ls
    Ith: ARM_MASS * (Ll ** 3 + Ls ** 3) / (3 * (Ll + Ls)) + mcw * Ls * Ls,
    th0,
    thStop: Math.asin(clamp(-(AXLE_H - 0.3) / Ll, -1, 0)),   // arm stop: tip stays 0.3 m above ground
    x0: tipX + Math.sqrt(Math.max(s.slingLength ** 2 - dy * dy, 0.01)), // stone on the ground, sling taut
    cwY0: AXLE_H - Ls * Math.sin(th0),
    D: s.castleDistance
  };
}
function cwHeight(th) { return AXLE_H - P.Ls * Math.sin(th); }

// Accelerations while the sling is attached. Unknowns: arm angle (th) and stone (x, y).
// Constraints: rope |stone - tip| = Lsl (may only pull), ground y = rs (may only push).
function slingAccel(y) {
  const th = y[0], om = y[1], x = y[2], yy = y[3], vx = y[4], vy = y[5];
  const c = Math.cos(th), s = Math.sin(th), A = P.Ll, L = P.Lsl, m = P.ms;
  const rx = x - A * c, ry = yy - (AXLE_H + A * s);          // r = stone - tip
  const rdx = vx + A * s * om, rdy = vy - A * c * om;         // dr/dt
  const r2 = rx * rx + ry * ry;
  const rowR = [A * (rx * s - ry * c), rx, ry];               // rope row of the Jacobian
  const cR = -(rdx * rdx + rdy * rdy) - 2 * ALPHA * (rx * rdx + ry * rdy)
           - BETA * BETA * (r2 - L * L) / 2 - A * om * om * (rx * c + ry * s);
  const cG = -2 * ALPHA * vy - BETA * BETA * (yy - P.rs);     // ground row
  const onGround = yy - P.rs < 1e-3;
  const dragF = P.dragK * Math.hypot(vx, vy);
  const fx0 = -dragF * vx, fy0 = -dragF * vy - m * P.g;
  const tau = -P.g * P.G * c;                                 // gravity torque on arm
  const iI = 1 / P.Ith, iM = 1 / m;
  const kRR = rowR[0] * rowR[0] * iI + r2 * iM;
  const kGG = iM;
  const kRG = ry * iM;

  const solve = (useR, useG) => {
    const fx = useG ? fx0 - GROUND_MU * lastN * Math.tanh(vx / 0.05) : fx0;
    const fy = fy0;
    const bR = cR - (rowR[0] * tau * iI + rowR[1] * fx * iM + rowR[2] * fy * iM);
    const bG = cG - fy * iM;
    let lR = 0, lG = 0;
    if (useR && useG) {
      const det = kRR * kGG - kRG * kRG;
      lR = (bR * kGG - kRG * bG) / det;
      lG = (kRR * bG - kRG * bR) / det;
    } else if (useR) {
      lR = bR / kRR;
    } else if (useG) {
      lG = bG / kGG;
    }
    return {
      lR, lG,
      ath: (tau + (useR ? rowR[0] * lR : 0)) * iI,
      ax: (fx + (useR ? rowR[1] * lR : 0)) * iM,
      ay: (fy + (useR ? rowR[2] * lR : 0) + lG) * iM
    };
  };

  const combos = onGround ? [[true, true], [true, false], [false, true]] : [[true, false]];
  for (const [useR, useG] of combos) {
    const r = solve(useR, useG);
    if (useR && r.lR > 0) continue;   // rope would have to push: slack
    if (useG && r.lG < 0) continue;   // ground would have to pull: stone lifts off
    return r;
  }
  return solve(false, false);
}

// Free flight, arm alone (stone released or in the trough without sling).
function freeAccel(y) {
  const vx = y[4], vy = y[5];
  const dragF = P.dragK * Math.hypot(vx, vy) / P.ms;
  return {
    ath: -P.g * P.G * Math.cos(y[0]) / P.Ith,
    ax: -dragF * vx,
    ay: -dragF * vy - P.g
  };
}

function deriv(y, accel) {
  const a = accel(y);
  return [y[1], a.ath, y[4], y[5], a.ax, a.ay];
}
function rk4(y, h, accel) {
  const k1 = deriv(y, accel);
  const k2 = deriv(y.map((v, i) => v + 0.5 * h * k1[i]), accel);
  const k3 = deriv(y.map((v, i) => v + 0.5 * h * k2[i]), accel);
  const k4 = deriv(y.map((v, i) => v + h * k3[i]), accel);
  return y.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}

function checkRelease() {
  const sp = Math.hypot(st.vx, st.vy);
  if (sp < 0.5) return;
  const elev = Math.atan2(st.vy, st.vx);
  if (elev > P.relAng + 0.01) armed = true;             // the velocity has swung above the release angle
  if (armed && st.vx > 0 && elev <= P.relAng) doRelease();
}
function doRelease() {
  relRec = {
    t: simT, speed: Math.hypot(st.vx, st.vy), angle: Math.atan2(st.vy, st.vx),
    x: st.x, y: st.y, cwY: cwHeight(st.th)
  };
  mode = 'flight';
  addTrail(st.x, st.y);
}

function checkFlightEvents(px, py, t) {
  const face = P.D - 0.5;                 // front face of the 1 m thick wall
  const xc = face - P.rs;                 // stone centre when its surface touches the face
  const ev = [];
  if (px < xc && st.x >= xc) {
    const f = (xc - px) / (st.x - px);
    const y = py + f * (st.y - py);
    if (y >= P.rs && y <= WALL_H + P.rs) ev.push({ f, kind: 'wall', x: xc, y });
  }
  if (py - P.rs > 0 && st.y - P.rs <= 0) {
    const f = (py - P.rs) / (py - st.y);
    ev.push({ f, kind: 'ground', x: px + f * (st.x - px), y: P.rs });
  }
  if (!ev.length) return;
  ev.sort((a, b) => a.f - b.f);
  const e = ev[0];
  const tEv = t + e.f * DT;
  if (e.kind === 'wall') startWallImpact(e, tEv);
  else landOnGround(e, tEv);
}

function landOnGround(e, tEv) {
  landPoint = { x: e.x, y: P.rs, z: 0 };
  mode = 'landed';
  addMark(e.x, `${e.x.toFixed(1)} m`, false);
  spawnDust(e.x, 0, 0, 1);
  finalize(e.x, false, tEv - relRec.t);
  finishT = simT + 3;
}

function startWallImpact(e, tEv) {
  const b = new CANNON.Body({ mass: P.ms, shape: new CANNON.Sphere(P.rs), linearDamping: 0.01 });
  b.position.set(e.x, e.y, 0);
  b.velocity.set(st.vx, st.vy, 0);
  world.addBody(b);
  wallStone = b;
  mode = 'cannon';
  addMark(P.D - 0.5, 'wall hit', true);
  spawnDust(e.x, e.y, 0, 2);
  finalize(P.D - 0.5, true, tEv - relRec.t);
  wallHits++;
}

// Wall physics, stepped at 1/240 s, with the same air drag as in flight.
function cannonStep() {
  if (!wallStone) return;
  wallTicks++;
  if (wallTicks % CANNON_EVERY !== 0) return;
  if (P.drag) {
    const v = wallStone.velocity;
    wallStone.applyForce(v.scale(-P.dragK * v.length()));
  }
  world.step(CANNON_DT);
  cannonTime += CANNON_DT;
  if (wallStone.velocity.length() < 0.3) cannonStill += CANNON_DT;
  else cannonStill = 0;
  if (!cannonDone && (cannonStill > 1.5 || cannonTime > 12)) {
    cannonDone = true;
    finishT = simT + 1;
  }
}

function finalize(range, wallHit, flightTime) {
  const r = relRec, v = r.speed, th = r.angle, g = P.g;
  const sn = Math.sin(th), cs = Math.cos(th);
  const h = Math.max(r.y - P.rs, 0);
  // Vacuum landing point from the release state, measured from the axle
  const vacuum = r.x + (v * cs / g) * (v * sn + Math.sqrt(v * v * sn * sn + 2 * g * h));
  const drop = P.cwY0 - r.cwY;
  const ke = 0.5 * P.ms * v * v;
  const pe = P.mcw * g * drop;
  const shot = {
    releaseSpeed: v,
    releaseAngle: th * 180 / Math.PI,
    releaseHeight: r.y,
    flightTime,
    range,
    wallHit,
    predictedVacuumRange: vacuum,
    counterweightDrop: drop,
    efficiency: pe > 0 ? clamp(ke / pe, 0, 1) : 0
  };
  shots.push(shot);
  lastShot = shot;
  showShot(shot);
}

function step() {
  const wasFlight = mode === 'flight';
  const px = st.x, py = st.y, tStart = simT;
  if (mode === 'sling') lastN = Math.max(0, slingAccel([st.th, st.om, st.x, st.y, st.vx, st.vy]).lG);
  const y1 = rk4([st.th, st.om, st.x, st.y, st.vx, st.vy], DT, mode === 'sling' ? slingAccel : freeAccel);
  st.th = y1[0]; st.om = y1[1]; st.x = y1[2]; st.y = y1[3]; st.vx = y1[4]; st.vy = y1[5];
  simT = tStart + DT;

  // Arm stop: the arm rests on its stop and cannot go further
  if (st.th < P.thStop) {
    st.th = P.thStop;
    if (st.om < 0) st.om = 0;
    if (mode === 'sling') doRelease();
  }
  if (mode === 'sling') {
    if (simT - t0 > 30) doRelease();      // safety: the sling must not hold forever
    else checkRelease();
  } else if (wasFlight) {
    checkFlightEvents(px, py, tStart);
  }
  if (mode === 'sling' || mode === 'flight') {
    if (++trailTick % 3 === 0) addTrail(st.x, st.y);
  }
  if (mode === 'flight' && simT - relRec.t > 60) {       // safety: no contact within 60 s
    finalize(st.x, false, simT - relRec.t);
    landPoint = { x: st.x, y: P.rs, z: 0 };
    mode = 'landed';
    finishT = simT + 3;
  }
  if (mode === 'cannon') cannonStep();
}

function runActive() { return mode !== 'idle' && simT < finishT; }

function advance(frameDt) {
  if (paused || !runActive()) { accum = 0; return; }
  accum += Math.min(frameDt * Number($('speed').value), 0.05);
  let n = 0;
  while (accum >= DT && n < MAX_STEPS_PER_FRAME && runActive()) {
    step();
    accum -= DT;
    n++;
  }
  if (!runActive()) accum = 0;
}

/* ---------- shot lifecycle ---------- */
function resetMechanism(startNow) {
  P = makeParams(readSettings());
  if (wallD !== P.D) buildWall(P.D);
  applyCastleVisuals(P.D);
  if (wallStone) { world.removeBody(wallStone); wallStone = null; }
  world.gravity.set(0, -P.g, 0);
  buildArm();
  stoneMesh.scale.setScalar(P.rs);
  st = { th: P.th0, om: 0, x: P.x0, y: P.rs, vx: 0, vy: 0 };
  lastN = P.ms * P.g;
  armed = false;
  relRec = null;
  landPoint = null;
  finishT = Infinity;
  wallTicks = 0; cannonTime = 0; cannonStill = 0; cannonDone = false;
  t0 = simT;
  accum = 0;
  trailTick = 0;
  clearTrail();
  addTrail(st.x, st.y);
  mode = startNow ? 'sling' : 'idle';
}

function fire() {
  resetMechanism(true);
  paused = false;
  $('pause').textContent = 'Pause';
}

function togglePause() {
  paused = !paused;
  $('pause').textContent = paused ? 'Play' : 'Pause';
}

function clearShots() {
  shots.length = 0;
  lastShot = null;
  wallHits = 0;
  clearTrail();
  clearMarks();
  showShot(null);
}

/* ---------- marks, labels, readout ---------- */
const marks = [];
const labelsEl = $('labels');
function addMark(x, text, wall) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.6, 1.0, 48), wall ? markWallMat : markMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.03, 0);
  scene.add(ring);
  const el = document.createElement('div');
  el.className = wall ? 'mark wall' : 'mark';
  el.textContent = text;
  labelsEl.appendChild(el);
  marks.push({ x, ring, el });
}
function clearMarks() {
  for (const m of marks) {
    scene.remove(m.ring);
    m.ring.geometry.dispose();
    m.el.remove();
  }
  marks.length = 0;
}
const tmpV = new THREE.Vector3();
function updateLabels() {
  for (const m of marks) {
    tmpV.set(m.x, 1.5, 0).project(camera);
    if (tmpV.z >= 1) { m.el.style.display = 'none'; continue; }
    const px = (tmpV.x * 0.5 + 0.5) * window.innerWidth;
    const py = (-tmpV.y * 0.5 + 0.5) * window.innerHeight;
    m.el.style.display = 'block';
    m.el.style.transform = `translate(${px}px, ${py}px) translate(-50%, -110%)`;
  }
}

const readoutIds = ['r-speed', 'r-angle', 'r-height', 'r-time', 'r-range', 'r-vac', 'r-drop', 'r-eff'];
function showShot(shot) {
  const f = (v, d) => (v == null ? '—' : v.toFixed(d));
  const vals = shot ? [
    `${f(shot.releaseSpeed, 1)} m/s`,
    `${f(shot.releaseAngle, 1)}°`,
    `${f(shot.releaseHeight, 2)} m`,
    `${f(shot.flightTime, 2)} s`,
    shot.wallHit ? `${f(shot.range, 1)} m · wall hit` : `${f(shot.range, 1)} m`,
    `${f(shot.predictedVacuumRange, 1)} m`,
    `${f(shot.counterweightDrop, 2)} m`,
    `${f(shot.efficiency * 100, 1)} %`
  ] : readoutIds.map(() => '—');
  readoutIds.forEach((id, i) => { $(id).textContent = vals[i]; });
}

const STATUS = { idle: 'Ready', sling: 'Sling whipping', flight: 'In flight', cannon: 'Wall contact', landed: 'Landed' };
let shownMode = '';

/* ---------- per-frame sync ---------- */
const ropeDir = new THREE.Vector3();
function placeRope(ax, ay, bx, by) {
  ropeDir.set(bx - ax, by - ay, 0);
  const len = ropeDir.length();
  if (len < 1e-6) return;
  ropeMesh.position.set((ax + bx) / 2, (ay + by) / 2, 0);
  ropeMesh.quaternion.setFromUnitVectors(UP, ropeDir.divideScalar(len));
  ropeMesh.scale.set(1, len, 1);
}
function stonePos() {
  if (mode === 'cannon' && wallStone) return { x: wallStone.position.x, y: wallStone.position.y, z: wallStone.position.z };
  if (mode === 'landed' && landPoint) return landPoint;
  return { x: st.x, y: st.y, z: 0 };
}
function syncScene() {
  armGroup.rotation.z = st.th;
  const p = stonePos();
  stoneMesh.position.set(p.x, p.y, p.z);
  if (mode === 'cannon' && wallStone) {
    const q = wallStone.quaternion;
    stoneMesh.quaternion.set(q.x, q.y, q.z, q.w);
  }
  ropeMesh.visible = mode === 'sling';
  if (ropeMesh.visible) placeRope(P.Ll * Math.cos(st.th), AXLE_H + P.Ll * Math.sin(st.th), p.x, p.y);
  syncWall();
  if (shownMode !== mode) {
    shownMode = mode;
    $('status').textContent = STATUS[mode];
  }
  $('score').textContent = `Wall hits: ${wallHits} · blocks moved: ${displacedBlocks}`;
}

const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), lookNow = new THREE.Vector3(2, 3, 0);
let prevCam = '';
function updateCamera(dt) {
  const m = $('camera').value;
  orbit.enabled = m === 'orbit';
  if (m === 'orbit') {
    if (prevCam !== 'orbit') orbit.target.copy(lookNow);
    prevCam = m;
    orbit.update();
    return;
  }
  prevCam = m;
  const k = 1 - Math.exp(-dt * 3);
  if (m === 'side') {
    const D = Number($('in-castleDistance').value);
    camGoal.set(D * 0.5, 22, 0.55 * D + 80);
    lookGoal.set(D * 0.5, 8, 0);
  } else {
    const p = stonePos();
    const h = Math.max(p.y, 0);
    camGoal.set(p.x - 8, h + 6, 28);
    lookGoal.set(p.x + 2, h * 0.6 + 1, 0);
  }
  camera.position.lerp(camGoal, k);
  lookNow.lerp(lookGoal, k);
  camera.lookAt(lookNow);
}

/* ---------- controls ---------- */
function bindButton(id, fn) {
  $(id).addEventListener('click', e => { fn(); e.currentTarget.blur(); });
}
bindButton('fire', fire);
bindButton('pause', togglePause);
bindButton('rebuild', () => buildWall(Number($('in-castleDistance').value)));
bindButton('clear', clearShots);
bindButton('toggle-settings', () => $('settings').classList.toggle('hidden'));
bindButton('toggle-readout', () => $('readout').classList.toggle('open'));

window.addEventListener('keydown', e => {
  const tag = e.target.tagName || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (e.key === 'f' || e.key === 'F') fire();
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ---------- inspection hook ---------- */
window.trebuchetState = () => ({
  lastShot: lastShot ? { ...lastShot } : null,
  shots: shots.map(s => ({ ...s })),
  settings: readSettings()
});

/* ---------- boot ---------- */
buildStaticScene();
buildWall(DEFAULTS.castleDistance);
resetMechanism(false);
if (window.matchMedia('(max-width: 720px)').matches) $('settings').classList.add('hidden');

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  advance(dt);
  syncScene();
  updateCamera(dt);
  updateDust(dt);
  updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(fire, LAUNCH_AT * 1000);
</script>
</body>
