<!DOCTYPE html>
<html lang="en">
<head>

<title>Claude Sonnet 5.5</title>
<style>
  :root { --bg: rgba(16,20,26,.74); --fg: #eef2f6; --mut: #9fb0c0; --acc: #ffb347; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9db6cc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  canvas.gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .glass { background: var(--bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; }
  #brand { position: fixed; left: 14px; top: 12px; padding: 7px 14px; font-weight: 700; font-size: 17px; letter-spacing: .02em; z-index: 5; }
  #status { position: fixed; left: 14px; top: 56px; padding: 5px 10px; font-size: 12px; color: var(--mut); z-index: 5; font-variant-numeric: tabular-nums; }
  #readout { position: fixed; left: 14px; top: 92px; width: 262px; padding: 10px 12px; z-index: 5; font-size: 13px; }
  #readout table { width: 100%; border-collapse: collapse; }
  #readout td { padding: 2.5px 0; }
  #readout td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  #readout td:first-child { color: var(--mut); }
  #readout .badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 9px; background: #c4412b; color: #fff; font-size: 11px; font-weight: 700; }
  #readout .hdr { color: var(--mut); font-size: 12px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 8px 10px; z-index: 6; align-items: center; justify-content: center; max-width: calc(100vw - 20px); }
  .grp { display: flex; gap: 3px; padding-left: 10px; border-left: 1px solid var(--line); }
  .grp:first-child { border-left: 0; padding-left: 0; }
  button { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,.09); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.18); }
  button.on { background: var(--acc); color: #1b1408; border-color: var(--acc); font-weight: 700; }
  button.fire { background: #d9482b; border-color: #d9482b; font-weight: 700; color: #fff; }

  #panelWrap { position: fixed; right: 12px; top: 12px; z-index: 6; width: 276px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
  #ptoggle { align-self: flex-end; margin-bottom: 6px; }

  @media (max-width: 760px) {
    #readout { top: auto; bottom: 108px; width: 220px; font-size: 12px; }

    #hint { display: none; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

/* =====================================================================
   Constants, settings, shot records
   ===================================================================== */
const DT = 0.001;            // fixed physics step (s)
const MAXSTEPS = 250;        // cap on steps per rendered frame
const FIX = { armMass: 50, axleHeight: 4, stoneDensity: 2400, airDensity: 1.225, dragCoefficient: 0.47,
              wallWidth: 8, wallHeight: 5, wallThickness: 1, blockSize: 0.5, blockDensity: 1400, cwDensity: 2700 };
const DEF = { counterweightMass: 500, projectileMass: 10, shortArm: 1.5, longArm: 6, slingLength: 5,
              releaseAngle: 40, airDrag: false, gravity: 9.81, castleDistance: 120 };
const settings = { ...DEF };
const shots = [];
let lastShot = null;
let hits = 0;
let paused = false, simSpeed = 1, camMode = 'follow';

function rngMaker(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function fin(x) { return Number.isFinite(x) ? x : 0; }
window.trebuchetState = function () {
  const cp = (s) => s ? Object.fromEntries(Object.entries(s).map(([k, v]) => [k, typeof v === 'number' ? fin(v) : v])) : null;
  return JSON.parse(JSON.stringify({
    lastShot: cp(lastShot),
    shots: shots.map(cp),
    settings: { ...settings, armMass: FIX.armMass, axleHeight: FIX.axleHeight, stoneDensity: FIX.stoneDensity,
                airDensity: FIX.airDensity, dragCoefficient: FIX.dragCoefficient, simulationSpeed: simSpeed, paused, camera: camMode }
  }));
};

/* =====================================================================
   Mechanism model (planar: x downrange, y up, axle at (0, H))
   Generalised coordinates: arm angle th (long arm direction from +x, CCW),
   stone position (sling length fixed while taut).  Rope tension T is a
   Lagrange multiplier solved from the constraint every step.
   ===================================================================== */
function makeCfg() {
  const s = settings;
  const c = { g: s.gravity, M: s.counterweightMass, m: s.projectileMass, Ls: s.shortArm, Ll: s.longArm, ls: s.slingLength,
              rel: s.releaseAngle * Math.PI / 180, drag: !!s.airDrag, D: s.castleDistance, ma: FIX.armMass, H: FIX.axleHeight, mu: 0.3 };
  c.r = Math.cbrt(3 * c.m / (4 * Math.PI * FIX.stoneDensity));
  c.I = c.ma / (c.Ll + c.Ls) * (Math.pow(c.Ll, 3) + Math.pow(c.Ls, 3)) / 3 + c.M * c.Ls * c.Ls;
  c.Kg = (c.M * c.Ls - c.ma * (c.Ll - c.Ls) / 2) * c.g;          // gravity torque = Kg*cos(th)
  c.kd = 0.5 * FIX.airDensity * FIX.dragCoefficient * Math.PI * c.r * c.r;
  c.th0 = Math.PI + Math.asin(Math.min(1, (c.H - 0.5) / c.Ll));   // tip 0.5 m above ground, pointing down/back
  return c;
}
let cfg = makeCfg();

const S = { active: false, phase: 'armed', th: 0, om: 0, sx: 0, sy: 0, vx: 0, vy: 0, mode: 'ground', released: false, t: 0,
            resolved: false, prevAng: Math.PI, rel: null, pouch: null, maxX: 0, trailT: 0, lx: 0, kind: '' };

function resetState() {
  const c = cfg;
  S.th = c.th0; S.om = 0;
  const ty = c.H + c.Ll * Math.sin(S.th), tx = c.Ll * Math.cos(S.th);
  S.sy = c.r;
  S.sx = tx + Math.sqrt(Math.max(1e-4, c.ls * c.ls - (ty - c.r) * (ty - c.r)));
  S.vx = 0; S.vy = 0; S.mode = 'ground'; S.released = false; S.t = 0; S.resolved = false;
  S.prevAng = Math.PI; S.rel = null; S.pouch = null; S.maxX = Math.max(0, S.sx); S.trailT = 0; S.active = false;
}

const A = new Float64Array(5);   // al, ax, ay, T, N
function accel(th, om, sx, sy, vx, vy, mode, out) {
  const c = cfg;
  const co = Math.cos(th), si = Math.sin(th);
  const tx = c.Ll * co, ty = c.H + c.Ll * si;
  const vtx = -om * c.Ll * si, vty = om * c.Ll * co;
  const dx = sx - tx, dy = sy - ty;
  let dist = Math.hypot(dx, dy); if (dist < 1e-9) dist = 1e-9;
  const nx = dx / dist, ny = dy / dist;
  const rx = vx - vtx, ry = vy - vty, rr = rx * rx + ry * ry;
  const k = c.Ll * (-nx * si + ny * co);          // Ll * (n . up_perp): torque arm of rope force
  const nu = nx * co + ny * si;
  const tg = c.Kg * co;
  let ex = 0, ey = -c.g;
  if (c.drag && mode !== 'ground') { const sp = Math.hypot(vx, vy), kk = c.kd * sp / c.m; ex = -kk * vx; ey -= kk * vy; }
  const I = c.I, m = c.m;
  let T = 0, N = 0, al, ax, ay;
  if (mode === 'ground') {
    const s = Math.tanh(vx / 0.02), mu = c.mu;
    const den = nx * (nx + mu * s * ny) / m + k * k / I;
    const B = nx * (ex + mu * s * ey) - tg * k / I + om * om * c.Ll * nu + rr / c.ls;
    T = (nx > 0.05 && den > 1e-9) ? B / den : -1;
    if (T >= 0) { al = (tg + T * k) / I; ax = -T * (nx + mu * s * ny) / m + ex + mu * s * ey; N = T * ny + m * c.g; }
    else { T = 0; al = tg / I; ax = ex + mu * s * ey; N = m * c.g; }
    ay = 0;
  } else {
    const den = 1 / m + k * k / I;
    const B = nx * ex + ny * ey - tg * k / I + om * om * c.Ll * nu + rr / c.ls;
    T = B / den;
    if (T >= 0 && dist >= c.ls - 1e-4) { al = (tg + T * k) / I; ax = ex - T * nx / m; ay = ey - T * ny / m; }
    else { T = 0; al = tg / I; ax = ex; ay = ey; }
  }
  out[0] = al; out[1] = ax; out[2] = ay; out[3] = T; out[4] = N;
}

const Y = new Float64Array(6), Yt = new Float64Array(6);
const K = [new Float64Array(6), new Float64Array(6), new Float64Array(6), new Float64Array(6)];
function deriv(y, mode, out) {
  accel(y[0], y[1], y[2], y[3], y[4], y[5], mode, A);
  out[0] = y[1]; out[1] = A[0]; out[2] = y[4];
  if (mode === 'ground') { out[3] = 0; out[5] = 0; } else { out[3] = y[5]; out[5] = A[2]; }
  out[4] = A[1];
}
function rk4(dt, mode) {
  Y[0] = S.th; Y[1] = S.om; Y[2] = S.sx; Y[3] = S.sy; Y[4] = S.vx; Y[5] = S.vy;
  deriv(Y, mode, K[0]);
  for (let i = 0; i < 6; i++) Yt[i] = Y[i] + K[0][i] * dt / 2;
  deriv(Yt, mode, K[1]);
  for (let i = 0; i < 6; i++) Yt[i] = Y[i] + K[1][i] * dt / 2;
  deriv(Yt, mode, K[2]);
  for (let i = 0; i < 6; i++) Yt[i] = Y[i] + K[2][i] * dt;
  deriv(Yt, mode, K[3]);
  for (let i = 0; i < 6; i++) Y[i] += dt / 6 * (K[0][i] + 2 * K[1][i] + 2 * K[2][i] + K[3][i]);
  S.th = Y[0]; S.om = Y[1]; S.sx = Y[2]; S.sy = Y[3]; S.vx = Y[4]; S.vy = Y[5];
}

function stepMech(dt) {
  const c = cfg;
  if (S.mode === 'ground') {
    const tipy0 = c.H + c.Ll * Math.sin(S.th);
    accel(S.th, S.om, S.sx, S.sy, S.vx, S.vy, 'ground', A);
    if (A[4] < 0 || tipy0 - c.r >= c.ls * 0.999) S.mode = 'free';
  }
  rk4(dt, S.mode);
  const co = Math.cos(S.th), si = Math.sin(S.th);
  const tx = c.Ll * co, ty = c.H + c.Ll * si;
  const vtx = -S.om * c.Ll * si, vty = S.om * c.Ll * co;
  if (S.mode === 'ground') {
    S.sy = c.r; S.vy = 0;
    const h = ty - c.r;
    if (h >= c.ls) S.mode = 'free';
    else {
      const xc = tx + Math.sqrt(c.ls * c.ls - h * h);
      if (S.sx > xc) {
        S.sx = xc;
        const dx = S.sx - tx, dy = S.sy - ty, d = Math.hypot(dx, dy);
        const nx = dx / d, ny = dy / d;
        if (nx > 0.05) { const vc = (nx * vtx + ny * vty) / nx; if (S.vx > vc) S.vx = vc; }
      }
    }
  } else {
    if (S.sy < c.r) { S.sy = c.r; if (S.vy < 0) S.vy = 0; S.mode = 'ground'; }
    else {
      const dx = S.sx - tx, dy = S.sy - ty, dist = Math.hypot(dx, dy);
      if (dist > c.ls) {
        const nx = dx / dist, ny = dy / dist;
        S.sx = tx + nx * c.ls; S.sy = ty + ny * c.ls;
        const vr = (S.vx - vtx) * nx + (S.vy - vty) * ny;
        if (vr > 0) {
          const k = c.Ll * (-nx * si + ny * co);
          const J = vr / (1 / c.m + k * k / c.I);
          S.vx -= J * nx / c.m; S.vy -= J * ny / c.m; S.om += J * k / c.I;
        }
      }
    }
  }
  if (S.sx > S.maxX) S.maxX = S.sx;
  // release test: velocity forward and its elevation angle comes down to the release angle
  if (S.mode === 'free' && S.sy > c.r + 0.05) {
    if (S.vx > 0) {
      const ang = Math.atan2(S.vy, S.vx);
      if (ang <= c.rel && S.prevAng > c.rel) { doRelease(); return; }
      S.prevAng = ang;
    } else S.prevAng = Math.PI;
  }
  if (S.t > 12) doRelease();   // stalled mechanism: let go with whatever speed it has
}

function doRelease() {
  const c = cfg;
  const sp = Math.hypot(S.vx, S.vy), ang = Math.atan2(S.vy, S.vx);
  const drop = c.Ls * (Math.sin(S.th) - Math.sin(c.th0));      // counterweight height lost
  const ke = 0.5 * c.m * sp * sp;
  const eff = drop > 1e-6 ? ke / (c.M * c.g * drop) : 0;
  const disc = sp * sp * Math.pow(Math.sin(ang), 2) + 2 * c.g * Math.max(0, S.sy - c.r);
  const pred = S.sx + (sp * Math.cos(ang) / c.g) * (sp * Math.sin(ang) + Math.sqrt(disc));
  S.rel = { t: S.t, x: S.sx, y: S.sy, speed: sp, angleDeg: ang * 180 / Math.PI, drop, eff: Math.min(1, Math.max(0, eff)), pred };
  S.released = true; S.phase = 'flight';
  S.pouch = { x: S.sx, y: S.sy, vx: S.vx, vy: S.vy };
}

function stepArmFree(dt) {      // after release: arm swings on (visual), sling pouch trails
  const c = cfg;
  const al = c.Kg * Math.cos(S.th) / c.I - 1.2 * S.om;
  S.om += al * dt; S.th += S.om * dt;
  const lim = -(c.H - 0.12) / c.Ll, s = Math.sin(S.th), co = Math.cos(S.th);
  if (s < lim) { S.th = co > 0 ? Math.asin(lim) : Math.PI - Math.asin(lim); S.om = 0; }
  const P = S.pouch;
  P.vy -= c.g * dt; P.x += P.vx * dt; P.y += P.vy * dt;
  const si = Math.sin(S.th);
  const tx = c.Ll * co, ty = c.H + c.Ll * si, vtx = -S.om * c.Ll * si, vty = S.om * c.Ll * co;
  const dx = P.x - tx, dy = P.y - ty, d = Math.hypot(dx, dy);
  if (d > c.ls) {
    const nx = dx / d, ny = dy / d;
    P.x = tx + nx * c.ls; P.y = ty + ny * c.ls;
    const vr = (P.vx - vtx) * nx + (P.vy - vty) * ny;
    if (vr > 0) { P.vx -= vr * nx; P.vy -= vr * ny; }
  }
  if (P.y < 0.05) { P.y = 0.05; if (P.vy < 0) P.vy = 0; P.vx *= 0.97; }
  P.vx *= 1 - 0.6 * dt; P.vy *= 1 - 0.6 * dt;
}

function stepStone(dt) {
  const c = cfg;
  const px = S.sx, py = S.sy;
  const ab = S.sy > c.r + 1e-4;
  const f = (vx, vy) => { if (c.drag && ab) { const k = c.kd * Math.hypot(vx, vy) / c.m; return [-k * vx, -c.g - k * vy]; } return [0, -c.g]; };
  const vx = S.vx, vy = S.vy;
  const a1 = f(vx, vy);
  const v2x = vx + a1[0] * dt / 2, v2y = vy + a1[1] * dt / 2, a2 = f(v2x, v2y);
  const v3x = vx + a2[0] * dt / 2, v3y = vy + a2[1] * dt / 2, a3 = f(v3x, v3y);
  const v4x = vx + a3[0] * dt, v4y = vy + a3[1] * dt, a4 = f(v4x, v4y);
  S.sx += dt / 6 * (vx + 2 * v2x + 2 * v3x + v4x);
  S.sy += dt / 6 * (vy + 2 * v2y + 2 * v3y + v4y);
  S.vx = vx + dt / 6 * (a1[0] + 2 * a2[0] + 2 * a3[0] + a4[0]);
  S.vy = vy + dt / 6 * (a1[1] + 2 * a2[1] + 2 * a3[1] + a4[1]);
  if (S.sx > S.maxX) S.maxX = S.sx;
  collideWall(dt);
  if (S.sy <= c.r) {
    if (!S.resolved) {
      const f2 = Math.min(1, Math.max(0, (py - c.r) / Math.max(1e-9, py - S.sy)));
      resolveShot('ground', px + (S.sx - px) * f2, S.t - dt + f2 * dt);
    }
    S.sy = c.r;
    if (S.vy < 0) {
      if (S.vy < -1.0) { S.vy = -S.vy * 0.25; S.vx *= 0.8; }
      else { S.vy = 0; const dec = 0.5 * c.g * dt; if (Math.abs(S.vx) <= dec) S.vx = 0; else S.vx -= Math.sign(S.vx) * dec; }
    }
  }
}

function resolveShot(kind, x, tAbs) {
  const R = S.rel;
  S.resolved = true; S.phase = 'landed'; S.lx = x; S.kind = kind;
  const rec = { releaseSpeed: R.speed, releaseAngle: R.angleDeg, releaseHeight: R.y, flightTime: tAbs - R.t, range: x,
                wallHit: kind === 'wall', predictedVacuumRange: R.pred, counterweightDrop: R.drop, efficiency: R.eff };
  if (kind === 'wall') hits++;
  shots.push(rec); lastShot = rec;
  addMark(x, kind, rec);
  if (kind === 'ground') emitDust(x, 0.1, 0, 45, 3.2, 2.4);
  renderReadout(); renderScore();
}

function physStep() {
  wallStep();
  if (!S.active) return;
  S.t += DT;
  if (!S.released) stepMech(DT);
  else { stepArmFree(DT); stepStone(DT); }
  S.trailT += DT;
  if (S.trailT >= 0.02) { S.trailT = 0; if (!S.resolved) addTrail(S.sx, S.sy); }
}

/* =====================================================================
   Wall: rigid blocks in cannon-es.  The stone is integrated above and
   hands momentum to blocks through impulses (sphere vs oriented box).
   ===================================================================== */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
world.allowSleep = true;
world.solver.iterations = 14;
world.defaultContactMaterial.friction = 0.6;
world.defaultContactMaterial.restitution = 0.02;
{
  const ground = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  ground.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
  world.addBody(ground);
}
const wallBodies = [];
let wallX = settings.castleDistance, wallDist = -1, wallActive = false, wallTick = 0, wallDirty = true;

function rebuildWall() {
  for (const b of wallBodies) world.removeBody(b.body);
  wallBodies.length = 0;
  wallX = settings.castleDistance; wallDist = settings.castleDistance;
  world.gravity.set(0, -settings.gravity, 0);
  const bs = FIX.blockSize;
  for (let layer = 0; layer < 2; layer++) for (let row = 0; row < 10; row++) {
    const list = [];
    if (row % 2 === 0) { for (let j = 0; j < 16; j++) list.push([-4 + 0.25 + 0.5 * j, 0.5]); }
    else { list.push([-4 + 0.125, 0.25]); for (let j = 0; j < 15; j++) list.push([-3.5 + 0.5 * j, 0.5]); list.push([3.875, 0.25]); }
    for (const [zc, wz] of list) {
      const hx = bs / 2 * 0.998, hy = bs / 2 * 0.998, hz = wz / 2 * 0.998;
      const mass = FIX.blockDensity * 8 * hx * hy * hz;
      const body = new CANNON.Body({ mass, shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)),

  transparent: true, depthWrite: false, uniforms: { uScale: { value: 500 } },
  vertexShader: 'attribute float aSize; attribute float aAlpha; uniform float uScale; varying float vA; void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=aSize*uScale/max(0.1,-mv.z); gl_Position=projectionMatrix*mv; }',
  fragmentShader: 'varying float vA; void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.12,d)*vA; if(a<0.01) discard; gl_FragColor=vec4(0.66,0.58,0.46,a); }'
});
const dust = new THREE.Points(dGeo, dustMat); dust.frustumCulled = false; scene.add(dust);
const drand = rngMaker(4242); let dHead = 0;
function emitDust(x, y, z, n, spd, up) {
  for (let k = 0; k < n; k++) {
    const i = dHead; dHead = (dHead + 1) % MAXD;
    dPos[i * 3] = x + (drand() - .5) * 0.6; dPos[i * 3 + 1] = Math.max(0.05, y + (drand() - .3) * 0.4); dPos[i * 3 + 2] = z + (drand() - .5) * 1.2;
    dVel[i * 3] = (drand() - .35) * spd; dVel[i * 3 + 1] = drand() * up; dVel[i * 3 + 2] = (drand() - .5) * spd;
    dAge[i] = 0; dLife[i] = 1.2 + drand() * 1.6; dS0[i] = 0.7 + drand() * 1.1;
  }
}
function updateDust(dt) {
  for (let i = 0; i < MAXD; i++) {
    if (dAge[i] >= dLife[i]) { dAlpha[i] = 0; continue; }
    dAge[i] += dt;
    const k = Math.exp(-1.6 * dt);
    dVel[i * 3] *= k; dVel[i * 3 + 1] = dVel[i * 3 + 1] * k + 0.25 * dt; dVel[i * 3 + 2] *= k;
    dPos[i * 3] += dVel[i * 3] * dt; dPos[i * 3 + 1] += dVel[i * 3 + 1] * dt; dPos[i * 3 + 2] += dVel[i * 3 + 2] * dt;
    const f = Math.min(1, dAge[i] / dLife[i]);
    dAlpha[i] = 0.5 * (1 - f) * Math.min(1, dAge[i] * 8); dSize[i] = dS0[i] * (1 + 2.2 * f);
  }
  dGeo.attributes.position.needsUpdate = true; dGeo.attributes.aSize.needsUpdate = true; dGeo.attributes.aAlpha.needsUpdate = true;
}

/* =====================================================================
   Shot control
   ===================================================================== */
function applyCfg() { cfg = makeCfg(); resetState(); buildMech(); }
function fire() {
  cfg = makeCfg();
  world.gravity.set(0, -cfg.g, 0);
  if (wallDist !== settings.castleDistance) rebuildWall();
  resetState(); buildMech(); clearTrail();
  S.active = true; S.phase = 'swing';
  autoDone = true;
}

/* =====================================================================
   UI
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const SPEC = [
  ['counterweightMass', 'Counterweight mass', 'kg', 200, 3000, 10, 0],
  ['projectileMass', 'Projectile mass', 'kg', 1, 200, 1, 0],
  ['shortArm', 'Short arm', 'm', 0.5, 3, 0.05, 2],
  ['longArm', 'Long arm', 'm', 4, 10, 0.1, 1],
  ['slingLength', 'Sling length', 'm', 1, 10, 0.1, 1],
  ['releaseAngle', 'Release angle', '°', 5, 80, 1, 0],
  ['gravity', 'Gravity', 'm/s²', 1, 25, 0.01, 2],
  ['castleDistance', 'Castle distance', 'm', 40, 300, 5, 0]
];
const panel = $('#panel');
const inputs = {}, outs = {};
function addSlider(spec) {
  const [key, label, unit, min, max, step, dec] = spec;
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div class="top"><span>${label}</span><output></output></div><input type="range" min="${min}" max="${max}" step="${step}">`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.value = settings[key]; inputs[key] = inp; outs[key] = out;
  const show = () => { out.textContent = (+settings[key]).toFixed(dec) + ' ' + unit; };
  show();
  inp.addEventListener('input', () => { settings[key] = +inp.value; show(); onSettings(key); });
  inp.addEventListener('change', () => inp.blur());
  panel.appendChild(row);
  outs[key].show = show;
  return row;
}
SPEC.slice(0, 2).forEach(addSlider);
const stoneInfo = document.createElement('div'); stoneInfo.className = 'note'; panel.appendChild(stoneInfo);
SPEC.slice(2, 6).forEach(addSlider);
{
  const lab = document.createElement('label'); lab.className = 'chk';
  lab.innerHTML = '<input type="checkbox" id="drag"><span>Air drag (ρ 1.225, Cd 0.47)</span>';
  panel.appendChild(lab);
  const cb = lab.querySelector('input'); cb.checked = settings.airDrag;
  cb.addEventListener('change', () => { settings.airDrag = cb.checked; cb.blur(); onSettings('airDrag'); });
}
addSlider(SPEC[6]);
{
  const pr = document.createElement('div'); pr.className = 'presets';
  [['Earth', 9.81], ['Mars', 3.71], ['Moon', 1.62]].forEach(([n, g]) => {
    const b = document.createElement('button'); b.textContent = n + ' ' + g;
    b.addEventListener('click', () => { settings.gravity = g; inputs.gravity.value = g; outs.gravity.show(); b.blur(); onSettings('gravity'); });
    pr.appendChild(b);
  });
  panel.appendChild(pr);
}
addSlider(SPEC[7]);
{ const n = document.createElement('div'); n.className = 'note'; n.textContent = 'Changes apply to the next shot.'; panel.appendChild(n); }

function onSettings(key) {
  const r = Math.cbrt(3 * settings.projectileMass / (4 * Math.PI * FIX.stoneDensity));
  stoneInfo.textContent = 'Stone radius ' + (r * 100).toFixed(1) + ' cm (density 2400 kg/m³)';
  if (S.phase === 'armed' || S.phase === 'landed') {
    applyCfg();
    if (settings.castleDistance !== wallDist) rebuildWall();
    else world.gravity.set(0, -settings.gravity, 0);
  }
}
onSettings();

$('#ptoggle').addEventListener('click', () => { panel.classList.toggle('hide'); $('#ptoggle').blur(); });
if (innerWidth < 760) panel.classList.add('hide');

$('#bFire').addEventListener('click', (e) => { fire(); e.target.blur(); });
$('#bPause').addEventListener('click', (e) => { togglePause(); e.target.blur(); });
$('#bClear').addEventListener('click', (e) => { clearMarks(); shots.length = 0; lastShot = null; renderReadout(); renderScore(); e.target.blur(); });
$('#bRebuild').addEventListener('click', (e) => { rebuildWall(); e.target.blur(); });
function togglePause() { paused = !paused; $('#bPause').textContent = paused ? 'Play' : 'Pause'; $('#bPause').classList.toggle('on', paused); }
document.querySelectorAll('#gSpeed button').forEach((b) => b.addEventListener('click', () => {
  simSpeed = +b.dataset.s; document.querySelectorAll('#gSpeed button').forEach((x) => x.classList.toggle('on', x === b)); b.blur();
}));
document.querySelectorAll('#gCam button').forEach((b) => b.addEventListener('click', () => {
  camMode = b.dataset.c; document.querySelectorAll('#gCam button').forEach((x) => x.classList.toggle('on', x === b)); b.blur();
  if (camMode === 'orbit') { controls.target.copy(camLook); controls.enabled = true; controls.update(); } else controls.enabled = false;
}));
function typing(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { if (typing(e.target)) return; e.preventDefault(); if (!e.repeat) togglePause(); }
  else if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) { if (typing(e.target) && e.target.type !== 'range' && e.target.type !== 'checkbox') return; if (!e.repeat) fire(); }
});
addEventListener('keyup', (e) => { if (e.code === 'Space' && !typing(e.target)) e.preventDefault(); });

function renderReadout() {
  const el = $('#readout'), s = lastShot;
  const f = (v, d) => s ? v.toFixed(d) : '—';
  el.innerHTML = `<div class="hdr"><span>Shot readout</span><span>${s ? '#' + shots.length : ''}</span></div><table>
    <tr><td>Release speed</td><td>${f(s && s.releaseSpeed, 2)} m/s</td></tr>
    <tr><td>Release angle</td><td>${f(s && s.releaseAngle, 1)} °</td></tr>
    <tr><td>Release height</td><td>${f(s && s.releaseHeight, 2)} m</td></tr>
    <tr><td>Flight time</td><td>${f(s && s.flightTime, 2)} s</td></tr>
    <tr><td>Range${s && s.wallHit ? '<span class="badge">wall hit</span>' : ''}</td><td>${f(s && s.range, 1)} m</td></tr>
    <tr><td>Vacuum range (pred.)</td><td>${f(s && s.predictedVacuumRange, 1)} m</td></tr>
    <tr><td>Counterweight drop</td><td>${f(s && s.counterweightDrop, 2)} m</td></tr>
    <tr><td>Efficiency</td><td>${s ? (s.efficiency * 100).toFixed(1) : '—'} %</td></tr></table>`;
}
function renderScore() { $('#score').innerHTML = `Wall hits <b>${hits}</b> · shots <b>${shots.length}</b> · blocks moved <b>${blocksMoved()}</b>`; }
renderReadout(); renderScore();

/* =====================================================================
   Camera
   ===================================================================== */
const camPos = new THREE.Vector3(4, 4.8, 17), camLook = new THREE.Vector3(-0.5, 3.2, 0);
const dp = new THREE.Vector3(), dl = new THREE.Vector3();
let camInit = false;
function updateCamera(dt) {
  if (camMode === 'orbit') { controls.update(); camPos.copy(camera.position); camLook.copy(controls.target); return; }
  let kp = 3, kl = 4;
  const aspect = camera.aspect;
  if (camMode === 'side') {
    const ext = Math.max(cfg.D + 18, S.maxX + 12, lastShot ? lastShot.range + 12 : 0);
    const Z = ext * 0.5 / (Math.tan(25 * Math.PI / 180) * Math.min(aspect, 2)) * 1.1 + 12;
    dp.set(ext * 0.5, 10 + ext * 0.06, Z); dl.set(ext * 0.5, ext * 0.04 + 2, 0); kp = 2.5; kl = 2.5;
  } else if (S.phase === 'armed') { dp.set(5, 5, 18); dl.set(-0.5, 3.2, 0); }
  else if (S.phase === 'swing') { dp.set(3, 5.5, 19); dl.set(S.sx * 0.35, Math.max(3.4, S.sy * 0.4 + 2), 0); kp = 3; kl = 5; }
  else if (S.phase === 'flight') { dp.set(S.sx - 12, Math.max(2, S.sy * 0.55 + 2.5), 10 + Math.min(10, S.sy * 0.1)); dl.set(S.sx + 7, Math.max(1.5, S.sy * 0.85), 0); kp = 4.5; kl = 7; }
  else { const wallish = S.kind === 'wall'; dp.set(S.lx - (wallish ? 20 : 16), wallish ? 6 : 5, wallish ? 14 : 12); dl.set(S.lx + 2, wallish ? 3 : 1.5, 0); kp = 2.2; kl = 3; }
  if (!camInit) { camPos.copy(dp); camLook.copy(dl); camInit = true; }
  camPos.lerp(dp, 1 - Math.exp(-kp * dt)); camLook.lerp(dl, 1 - Math.exp(-kl * dt));
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* =====================================================================
   Visual sync + main loop
   ===================================================================== */
function syncVisuals() {
  const c = cfg;
  armG.rotation.z = S.th;
  const tx = c.Ll * Math.cos(S.th), ty = c.H + c.Ll * Math.sin(S.th);
  stoneMesh.position.set(S.sx, S.sy, 0);
  if (!S.released) {
    updateRope(tx, ty, S.sx, S.sy);
    const dx = S.sx - tx, dy = S.sy - ty, d = Math.hypot(dx, dy) || 1;
    _d.set(dx / d, dy / d, 0);
    pouchMesh.position.set(S.sx - _d.x * c.r * 0.55, S.sy - _d.y * c.r * 0.55, 0);
    pouchMesh.quaternion.setFromUnitVectors(_up, _d); pouchMesh.scale.set(c.r * 1.7, c.r * 0.55, c.r * 1.7);
  } else {
    const P = S.pouch;
    updateRope(tx, ty, P.x, P.y);
    _d.set(P.x - tx, P.y - ty, 0).normalize();
    pouchMesh.position.set(P.x, P.y, 0);
    pouchMesh.quaternion.setFromUnitVectors(_up, _d); pouchMesh.scale.set(c.r * 1.5, c.r * 0.5, c.r * 1.5);
  }
  if (S.active) stoneMesh.rotation.z -= 0.0 + (S.released && !S.resolved ? 0.04 : 0);
}

let acc = 0, last = performance.now(), realClock = 0, autoDone = false, hudT = 0;
const statusEl = $('#status');
function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000); last = now;
  if (!autoDone) { realClock += dtReal; if (realClock >= 1) fire(); }
  let simDt = 0;
  if (!paused) {
    simDt = dtReal * simSpeed; acc += simDt;
    let n = 0;
    while (acc >= DT && n < MAXSTEPS) { physStep(); acc -= DT; n++; }
    if (n >= MAXSTEPS) acc = 0;
  }
  if (wallDirty) updateWallMesh();
  updateDust(simDt);
  syncVisuals();
  updateCamera(dtReal);
  sky.position.copy(camera.position);
  // shadows follow the view
  const half = camMode === 'side' ? Math.min(160, Math.max(60, (Math.max(cfg.D, S.maxX) + 20) * 0.6)) : 36;
  setShadowHalf(half);
  const cx = Math.round(camLook.x), cz = Math.round(camLook.z);
  sun.target.position.set(cx, 0, cz); sun.position.set(cx - 40, 65, cz + 20); sun.target.updateMatrixWorld();
  hudT += dtReal;
  if (hudT > 0.1) {
    hudT = 0;
    let txt;
    if (S.phase === 'armed') txt = autoDone ? 'Armed' : 'Armed · firing at t = 1 s';
    else if (S.phase === 'swing') txt = 'Throw · t = ' + S.t.toFixed(2) + ' s · arm ' + ((S.th * 180 / Math.PI) % 360).toFixed(0) + '°';
    else if (S.phase === 'flight') txt = 'Flight · ' + (S.t - S.rel.t).toFixed(2) + ' s · v ' + Math.hypot(S.vx, S.vy).toFixed(1) + ' m/s · x ' + S.sx.toFixed(1) + ' m';
    else txt = S.kind === 'wall' ? 'Wall hit at ' + S.lx.toFixed(1) + ' m' : 'Landed at ' + S.lx.toFixed(1) + ' m';
    statusEl.textContent = txt + (paused ? ' · paused' : '') + ' · ' + simSpeed + '×';
    if (wallActive || S.phase === 'landed') renderScore();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  dustMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
}
addEventListener('resize', onResize); onResize();

// init
world.gravity.set(0, -settings.gravity, 0);
rebuildWall();
applyCfg();
camPos.set(5, 5, 18); camLook.set(-0.5, 3.2, 0);
requestAnimationFrame(frame);
</script>
</body>
