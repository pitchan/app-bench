<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --text: #14181f;
  --muted: #4b5563;
  --line: #d1d5db;
  --edge: #6b7280;
  --head: #e5e7eb;
  --accent: #1d4ed8;
  --sel: #dbeafe;
  --active: #bfdbfe;
  --err: #9f1239;
  --disabled: #6b7280;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.4;
}
.app {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
header h1 { margin: 0; font-size: 18px; font-weight: 650; }
.toolbar, .formula-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  max-width: 100%;
}
.toolbar button {
  padding: 6px 10px;
  border: 1px solid var(--edge);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.toolbar button:disabled {
  color: var(--disabled);
  background: #f9fafb;
  border-color: var(--line);
  cursor: default;
}
.toolbar label { color: var(--muted); margin-left: 6px; }
select, input[type="text"] {
  font: inherit;
  padding: 5px 8px;
  border: 1px solid var(--edge);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
}
select:disabled { color: var(--disabled); background: #f9fafb; border-color: var(--line); }
.name-box {
  min-width: 96px;
  padding: 6px 8px;
  border: 1px solid var(--edge);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font-family: ui-monospace, Consolas, monospace;
  white-space: nowrap;
}
#formula-input { flex: 1 1 200px; min-width: 0; font-family: ui-monospace, Consolas, monospace; }
#formula-input[data-editing="true"] { border: 2px solid var(--accent); padding: 4px 7px; }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.sheet {
  max-width: 100%;
  overflow: auto;
  border: 1px solid var(--edge);
  background: var(--surface);
}
[data-testid="grid"] { outline: none; user-select: none; -webkit-user-select: none; }
[data-testid="grid"]:focus { outline: 3px solid var(--accent); outline-offset: -3px; }
.row { display: flex; width: max-content; }
.corner, .col, .rowh, .cell {
  flex: 0 0 auto;
  height: 28px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  line-height: 26px;
  padding: 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.corner, .col, .rowh { background: var(--head); color: var(--text); font-weight: 600; text-align: center; }
.corner, .rowh { width: 44px; }
.col, .cell { width: 112px; }
.cell { background: var(--surface); color: var(--text); text-align: left; }
.cell[data-kind="number"] { text-align: right; font-variant-numeric: tabular-nums; }
.cell[data-kind="error"] { color: var(--err); }
.cell[data-in-selection="true"] { background: var(--sel); }
.cell[aria-selected="true"] { background: var(--active); box-shadow: inset 0 0 0 2px var(--accent); }
.summary {
  padding: 8px 10px;
  border: 1px solid var(--edge);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  overflow-wrap: anywhere;
}
.summary[hidden] { display: none; }
</style>
</head>
<body>
<div class="app">
  <header data-testid="app-header"><h1>Claude Haiku 5.5</h1></header>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <label for="format-select">Number format</label>
    <select id="format-select" data-testid="format-select">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="formula-bar">
    <div class="name-box" data-testid="name-box">A1</div>
    <input type="text" id="formula-input" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="summary" data-testid="selection-summary" hidden></div>
</div>
<script>
(function () {
'use strict';

// ---------- values ----------
const BLANK = { t: 'blank' };
const num = v => ({ t: 'n', v });
const txt = v => ({ t: 's', v });
const bool = v => ({ t: 'b', v });
const err = code => ({ t: 'e', v: code });
const isErr = x => x.t === 'e';
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

// normalization: 12 significant digits, no negative zero
const norm = x => { const y = Number(x.toPrecision(12)); return y === 0 ? 0 : y; };
// result of an operator or function: normalized, range rule
const calc = x => (!isFinite(x) || Math.abs(norm(x)) >= 1e15) ? err('#NUM!') : num(norm(x));

// decimal rounding on the digits of the 12-digit decimal representation
function incr(s) {
  const r = s.split('');
  let i = r.length - 1;
  while (i >= 0) {
    if (r[i] === '9') { r[i] = '0'; i--; }
    else { r[i] = String.fromCharCode(r[i].charCodeAt(0) + 1); return r.join(''); }
  }
  return '1' + r.join('');
}
function roundDec(x, d) {
  const neg = x < 0;
  const ex = Math.abs(x).toExponential(11).split('e');
  const a = ex[0].replace('.', '');
  const p = parseInt(ex[1], 10) + 1;
  const k = p + d;
  let kept = '0', up = false;
  if (k >= 0) {
    const padded = a + '0'.repeat(Math.max(0, k + 1 - a.length));
    kept = padded.slice(0, k) || '0';
    up = padded[k] >= '5';
  }
  if (up) kept = incr(kept);
  kept = kept.replace(/^0+(?=\d)/, '');
  let s;
  if (d > 0) { const z = kept.padStart(d + 1, '0'); s = z.slice(0, -d) + '.' + z.slice(-d); }
  else s = kept === '0' ? '0' : kept + '0'.repeat(-d);
  return neg && kept !== '0' ? '-' + s : s;
}
// general text of a number: R(x, 6), no trailing zeros
function generalText(x) {
  let s = roundDec(x, 6);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function groupThousands(s) {
  const neg = s[0] === '-';
  const body = neg ? s.slice(1) : s;
  const parts = body.split('.');
  const g = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + g + (parts.length > 1 ? '.' + parts[1] : '');
}
function formatNumber(x, fmt) {
  if (fmt === 'fixed2') return groupThousands(roundDec(x, 2));
  if (fmt === 'percent1') return roundDec(norm(x * 100), 1) + '%';
  return generalText(x);
}

const ENTRY = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
function entryNumber(s) {
  if (!ENTRY.test(s)) return null;
  const pct = s.endsWith('%');
  const x = Number(pct ? s.slice(0, -1) : s) / (pct ? 100 : 1);
  const y = norm(x);
  return Math.abs(y) >= 1e15 ? null : y;
}
const trimSp = s => s.replace(/^ +| +$/g, '');

// value of a raw content that is not a formula
function constValue(raw) {
  if (raw === '') return BLANK;
  if (raw[0] === "'") return txt(raw.slice(1));
  const t = trimSp(raw);
  if (/^(TRUE|FALSE)$/i.test(t)) return bool(t.toUpperCase() === 'TRUE');
  const n = entryNumber(t);
  if (n !== null) return num(n);
  return txt(raw);
}

// ---------- addresses ----------
const COL = 'ABCDEFGH';
const colLetters = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const colNum = s => { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n; };
const at0 = (r, c) => r * 8 + c;
const pos = i => ({ r: Math.floor(i / 8), c: i % 8 });
const addr = i => COL[i % 8] + (Math.floor(i / 8) + 1);
const inGrid = ref => ref.c >= 1 && ref.c <= 8 && ref.r >= 1 && ref.r <= 12;

// ---------- formula language ----------
const FUNCS = {
  SUM: [1, Infinity], AVERAGE: [1, Infinity], MIN: [1, Infinity], MAX: [1, Infinity],
  COUNT: [1, Infinity], COUNTA: [1, Infinity], ROUND: [2, 2], ABS: [1, 1], INT: [1, 1], MOD: [2, 2],
  IF: [3, 3], AND: [1, Infinity], OR: [1, Infinity], NOT: [1, 1], IFERROR: [2, 2], ISERROR: [1, 1],
  ISBLANK: [1, 1], LEN: [1, 1], UPPER: [1, 1], LEFT: [2, 2], RIGHT: [2, 2], MID: [3, 3],
  CONCAT: [1, Infinity], COUNTIF: [2, 2], SUMIF: [3, 3]
};
const OPS2 = ['<>', '<=', '>='];
const OPS1 = '+-*/^&%=<>(),:';

function classifyWord(w) {
  const u = w.toUpperCase();
  if (u === 'TRUE' || u === 'FALSE') return { k: 'lit', v: u === 'TRUE', s: u };
  const m = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);
  if (m) return { k: 'ref', ref: { cAbs: m[1] === '$', c: colNum(m[2]), rAbs: m[3] === '$', r: parseInt(m[4], 10) } };
  if (/^[A-Za-z][A-Za-z0-9]*$/.test(w)) return { k: 'name', s: u };
  return null;
}

// returns the tokens after the leading "=", or null when a character starts no token
function tokenize(src) {
  const toks = [];
  let i = 1;
  while (i < src.length) {
    const c = src[i];
    if (c === ' ') { i++; continue; }
    const rest = src.slice(i);
    let m;
    if ((m = /^(\d+(\.\d+)?|\.\d+)/.exec(rest))) {
      toks.push({ k: 'num', s: m[0] });
      i += m[0].length;
    } else if (c === '"') {
      let j = i + 1, v = '';
      for (;;) {
        if (j >= src.length) return null;
        if (src[j] === '"') {
          if (src[j + 1] === '"') { v += '"'; j += 2; continue; }
          break;
        }
        v += src[j];
        j++;
      }
      toks.push({ k: 'str', s: src.slice(i, j + 1), v });
      i = j + 1;
    } else if (/^#REF!/i.test(rest)) {
      toks.push({ k: 'refErr' });
      i += 5;
    } else if ((m = /^[A-Za-z$][A-Za-z0-9$]*/.exec(rest))) {
      const t = classifyWord(m[0]);
      if (!t) return null;
      toks.push(t);
      i += m[0].length;
    } else if (OPS2.indexOf(rest.slice(0, 2)) >= 0) {
      toks.push({ k: 'op', s: rest.slice(0, 2) });
      i += 2;
    } else if (OPS1.indexOf(c) >= 0) {
      toks.push({ k: 'op', s: c });
      i++;
    } else {
      return null;
    }
  }
  return toks;
}

// parses a raw content "=..." into { ast } or returns null when not valid
function parseFormula(raw) {
  const toks = tokenize(raw);
  if (!toks || toks.length === 0) return null;
  let p = 0;
  const is = s => p < toks.length && toks[p].k === 'op' && toks[p].s === s;
  const expect = s => { if (!is(s)) throw new Error(s); p++; };
  const binLevel = (next, ops) => {
    let l = next();
    while (p < toks.length && toks[p].k === 'op' && ops.indexOf(toks[p].s) >= 0) {
      const op = toks[p++].s;
      l = { k: 'bin', op, l, r: next() };
    }
    return l;
  };
  function call(name) {
    p++;
    const args = [];
    if (!is(')')) {
      args.push(expression());
      while (is(',')) { p++; args.push(expression()); }
    }
    expect(')');
    return { k: 'call', name, known: hasOwn(FUNCS, name), args };
  }
  function primary() {
    const t = toks[p];
    if (!t) throw new Error('end');
    if (t.k === 'op' && t.s === '(') {
      p++;
      const e = expression();
      expect(')');
      return { k: 'group', e };
    }
    p++;
    switch (t.k) {
      case 'num': return { k: 'lit', v: calc(Number(t.s)), s: t.s };
      case 'str': return { k: 'lit', v: txt(t.v), s: t.s };
      case 'lit': return { k: 'lit', v: bool(t.v), s: t.s };
      case 'refErr': return { k: 'refErr' };
      case 'name': return is('(') ? call(t.s) : { k: 'name', s: t.s };
      case 'ref':
        if (is(':')) {
          p++;
          const u = toks[p];
          if (!u || u.k !== 'ref') throw new Error('range');
          p++;
          return { k: 'range', a: t.ref, b: u.ref };
        }
        return { k: 'ref', ref: t.ref };
      default: throw new Error('primary');
    }
  }
  function pctE() {
    let e = primary();
    while (is('%')) { p++; e = { k: 'pct', e }; }
    return e;
  }
  function powerE() {
    const b = pctE();
    if (is('^')) { p++; return { k: 'bin', op: '^', l: b, r: signedE() }; }
    return b;
  }
  function signedE() {
    if (is('-') || is('+')) { const op = toks[p++].s; return { k: 'un', op, e: signedE() }; }
    return powerE();
  }
  const productE = () => binLevel(signedE, ['*', '/']);
  const sumE = () => binLevel(productE, ['+', '-']);
  const concatE = () => binLevel(sumE, ['&']);
  const cmpE = () => binLevel(concatE, ['=', '<>', '<', '<=', '>', '>=']);
  function expression() { return cmpE(); }
  try {
    const ast = expression();
    return p === toks.length ? { ast } : null;
  } catch (e) {
    return null;
  }
}

function refText(ref) {
  return (ref.cAbs ? '$' : '') + colLetters(ref.c) + (ref.rAbs ? '$' : '') + ref.r;
}
// canonical range: top-left, bottom-right; each $ stays on the part it was typed on
function rangeText(a, b) {
  const leftIsA = a.c <= b.c;
  const left = leftIsA ? a : b, right = leftIsA ? b : a;
  const topIsA = a.r <= b.r;
  const top = topIsA ? a : b, bottom = topIsA ? b : a;
  return refText({ cAbs: left.cAbs, c: left.c, rAbs: top.rAbs, r: top.r }) + ':' +
    refText({ cAbs: right.cAbs, c: right.c, rAbs: bottom.rAbs, r: bottom.r });
}
function ser(n) {
  switch (n.k) {
    case 'lit': return n.s;
    case 'refErr': return '#REF!';
    case 'ref': return refText(n.ref);
    case 'range': return rangeText(n.a, n.b);
    case 'name': return n.s;
    case 'call': return n.name + '(' + n.args.map(ser).join(',') + ')';
    case 'group': return '(' + ser(n.e) + ')';
    case 'un': return n.op + ser(n.e);
    case 'pct': return ser(n.e) + '%';
    case 'bin': return ser(n.l) + n.op + ser(n.r);
    default: return '';
  }
}

// content kind of a committed string (02, section 2.2): formulas get their canonical form
function classify(s) {
  if (s === '' || s[0] !== '=') return s;
  const p = parseFormula(s);
  return p ? '=' + ser(p.ast) : s;
}

// rewriting of the references of a formula; f = { ref(ref), range(a, b) } returning nodes
function mapNodes(n, f) {
  switch (n.k) {
    case 'ref': return f.ref(n.ref);
    case 'range': return f.range(n.a, n.b);
    case 'group': return { k: 'group', e: mapNodes(n.e, f) };
    case 'un': return { k: 'un', op: n.op, e: mapNodes(n.e, f) };
    case 'pct': return { k: 'pct', e: mapNodes(n.e, f) };
    case 'bin': return { k: 'bin', op: n.op, l: mapNodes(n.l, f), r: mapNodes(n.r, f) };
    case 'call': return { k: 'call', name: n.name, known: n.known, args: n.args.map(x => mapNodes(x, f)) };
    default: return n;
  }
}
const REF_ERR = () => ({ k: 'refErr' });
function rewriteRaw(raw, f) {
  if (raw[0] !== '=') return raw;
  const p = parseFormula(raw);
  if (!p) return raw;
  return '=' + ser(mapNodes(p.ast, f));
}
// insertion (02, 2.10.1) or deletion (02, 2.10.2) of line p (1-based) along key 'r' or 'c'
function structuralRules(key, p, L, insert) {
  const single = n => {
    if (insert) { if (n < p) return n; return n + 1 > L ? null : n + 1; }
    if (n < p) return n;
    if (n === p) return null;
    return n - 1;
  };
  const range = (lo, hi) => {
    if (insert) {
      const t = lo < p ? lo : lo + 1;
      if (t > L) return null;
      const b = hi < p ? hi : hi + 1;
      return [t, Math.min(b, L)];
    }
    if (p > hi) return [lo, hi];
    if (p < lo) return [lo - 1, hi - 1];
    if (lo === hi) return null;
    return [lo, hi - 1];
  };
  return {
    ref: ref => {
      if (!inGrid(ref)) return { k: 'ref', ref };
      const n = single(ref[key]);
      return n === null ? REF_ERR() : { k: 'ref', ref: Object.assign({}, ref, { [key]: n }) };
    },
    range: (a, b) => {
      if (!inGrid(a) || !inGrid(b)) return { k: 'range', a, b };
      const aLow = a[key] <= b[key];
      const lo = aLow ? a[key] : b[key], hi = aLow ? b[key] : a[key];
      const res = range(lo, hi);
      if (res === null) return REF_ERR();
      const na = Object.assign({}, a), nb = Object.assign({}, b);
      if (aLow) { na[key] = res[0]; nb[key] = res[1]; } else { nb[key] = res[0]; na[key] = res[1]; }
      return { k: 'range', a: na, b: nb };
    }
  };
}
// paste adjustment (02, 2.10.3) by dr rows and dc columns; parts with $ do not move
function pasteRules(dr, dc) {
  const moved = ref => Object.assign({}, ref, {
    c: ref.cAbs ? ref.c : ref.c + dc,
    r: ref.rAbs ? ref.r : ref.r + dr
  });
  return {
    ref: ref => { const m = moved(ref); return inGrid(m) ? { k: 'ref', ref: m } : REF_ERR(); },
    range: (a, b) => {
      const ma = moved(a), mb = moved(b);
      if (!inGrid(ma) || !inGrid(mb)) return REF_ERR();
      return { k: 'range', a: ma, b: mb };
    }
  };
}

// ---------- evaluation ----------
const isRangeArg = a => a.k === 'ref' || a.k === 'range' || a.k === 'refErr';

function toNum(v) {
  if (v.t === 'n') return v;
  if (v.t === 'b') return num(v.v ? 1 : 0);
  if (v.t === 'blank') return num(0);
  if (v.t === 'e') return v;
  return err('#VALUE!');
}
function toLogic(v) {
  if (v.t === 'b') return v;
  if (v.t === 'n') return bool(v.v !== 0);
  if (v.t === 'blank') return bool(false);
  if (v.t === 'e') return v;
  return err('#VALUE!');
}
function toText(v) {
  if (v.t === 'n') return generalText(v.v);
  if (v.t === 'b') return v.v ? 'TRUE' : 'FALSE';
  if (v.t === 'blank') return '';
  return v.v;
}
const RANK = { n: 0, s: 1, b: 2 };
function blankAs(v) { return v.t === 'n' ? num(0) : v.t === 's' ? txt('') : bool(false); }
function compare(a, b) {
  if (a.t === 'blank' && b.t === 'blank') { a = num(0); b = num(0); }
  else if (a.t === 'blank') a = blankAs(b);
  else if (b.t === 'blank') b = blankAs(a);
  if (RANK[a.t] !== RANK[b.t]) return RANK[a.t] < RANK[b.t] ? -1 : 1;
  if (a.t === 's') {
    const x = a.v.toUpperCase(), y = b.v.toUpperCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }
  if (a.t === 'b') return a.v === b.v ? 0 : (a.v ? 1 : -1);
  return a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
}

// cv(c, r) gives the value of a cell, c and r being 1-based
function ev(n, cv) {
  switch (n.k) {
    case 'lit': return n.v;
    case 'refErr': return err('#REF!');
    case 'ref': return inGrid(n.ref) ? cv(n.ref.c, n.ref.r) : err('#REF!');
    case 'range': return err('#VALUE!');
    case 'name': return err('#NAME?');
    case 'group': return ev(n.e, cv);
    case 'un': {
      const x = toNum(ev(n.e, cv));
      if (isErr(x)) return x;
      return calc(n.op === '-' ? -x.v : x.v);
    }
    case 'pct': {
      const x = toNum(ev(n.e, cv));
      if (isErr(x)) return x;
      return calc(x.v / 100);
    }
    case 'bin': return binary(n, cv);
    case 'call': return callFn(n, cv);
    default: return err('#SYNTAX!');
  }
}
function binary(n, cv) {

  }
  if (k === 'Delete' || k === 'Backspace') {
    e.preventDefault();
    if (!editing) clearSel();
    return;
  }
  if (k === 'Enter') {
    e.preventDefault();
    input.focus();
    return;
  }
  if (e.ctrlKey && lk === 'z') {
    e.preventDefault();
    undo();
    return;
  }
  if (e.ctrlKey && lk === 'y') {
    e.preventDefault();
    redo();
  }
}
function onInputKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    commitAndMove(1, 0);
  } else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    commitAndMove(0, 1);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    cancelEdit();
  }
}

// ---------- rendering ----------
function selectionSummary() {
  const rect = selRect();
  let sum = 0, cnt = 0;
  forEachRect(rect, i => {
    const v = vals[i];
    if (v.t === 'n') { sum += v.v; cnt++; }
  });
  if (cnt === 0) return null;
  const fmtOrErr = x => (isErr(x) ? '#NUM!' : generalText(x.v));
  const s = fmtOrErr(calc(sum));
  const a = fmtOrErr(calc(sum / cnt));
  return 'Sum: ' + s + ' | Average: ' + a + ' | Count: ' + cnt;
}
function selectionLabel() {
  const rect = selRect();
  if (rect.r1 === rect.r2 && rect.c1 === rect.c2) return addr(at0(rect.r1, rect.c1));
  return addr(at0(rect.r1, rect.c1)) + ':' + addr(at0(rect.r2, rect.c2));
}
function renderAll() {
  vals = evaluate(cells.map(c => c.raw));
  const rect = selRect();
  cells.forEach((cl, i) => {
    const el = cellEls[i];
    const v = vals[i];
    el.textContent = display(v, cl.fmt);
    el.setAttribute('data-kind', cl.raw === '' ? 'empty' : kindOf(v));
    el.setAttribute('aria-selected', i === active ? 'true' : 'false');
    const inSel = pos(i).r >= rect.r1 && pos(i).r <= rect.r2 && pos(i).c >= rect.c1 && pos(i).c <= rect.c2;
    el.setAttribute('data-in-selection', inSel ? 'true' : 'false');
  });
  nameBox.textContent = selectionLabel();
  input.setAttribute('data-editing', editing ? 'true' : 'false');
  if (!editing) input.value = cells[active].raw;
  select.value = cells[active].fmt;
  const text = editing ? null : summaryText();
  summaryEl.textContent = text || '';
  summaryEl.hidden = text === null;
  setToolbarState();
}
function summaryText() { return selectionSummary(); }
function setToolbarState() {
  const dis = {
    'undo-button': editing || undoSteps.length === 0,
    'redo-button': editing || redoSteps.length === 0,
    'paste-button': editing || !clip,
    'copy-button': editing,
    'cut-button': editing,
    'clear-button': editing,
    'insert-row': editing,
    'delete-row': editing,
    'insert-col': editing,
    'delete-col': editing
  };
  for (const id in dis) qt(id).disabled = dis[id];
  select.disabled = editing;
}

// ---------- wiring ----------
input.addEventListener('input', () => {
  if (!editing) { editing = true; renderAll(); }
});
input.addEventListener('keydown', onInputKey);
select.addEventListener('change', () => setFormat(select.value));
const actions = {
  'undo-button': undo,
  'redo-button': redo,
  'copy-button': copySel,
  'cut-button': cutSel,
  'paste-button': paste,
  'clear-button': clearSel,
  'insert-row': () => structural('row', true),
  'delete-row': () => structural('row', false),
  'insert-col': () => structural('col', true),
  'delete-col': () => structural('col', false)
};
for (const id in actions) qt(id).addEventListener('click', actions[id]);

renderAll();
})();
</script>
</body>
