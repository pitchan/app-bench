<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
:root {
  --page: #f3f4f6;
  --surface: #ffffff;
  --ink: #15171c;
  --muted-line: #6b7280;
  --line: #cfd4dc;
  --head: #e9ecf1;
  --in-sel: #eef5ff;
  --active: #dbeafe;
  --accent: #1d4ed8;
  --error: #991b1b;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
[hidden] { display: none !important; }
header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
}
h1 { margin: 0; font-size: 18px; font-weight: 650; }
main {
  max-width: 1040px;
  margin: 0 auto;
  padding: 12px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
button, select, input { font: inherit; color: var(--ink); }
button, select {
  min-height: 34px;
  padding: 4px 10px;
  border: 1px solid var(--muted-line);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
}
button:disabled, select:disabled {
  color: var(--muted-line);
  background: #e5e7eb;
  border-color: #9ca3af;
  cursor: not-allowed;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fmt-label { margin-left: 8px; }
.formula-bar { display: flex; gap: 8px; align-items: stretch; }
.name-box {
  flex: 0 0 96px;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
}
#formula-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 34px;
  padding: 4px 10px;
  border: 1px solid var(--muted-line);
  border-radius: 6px;
  background: var(--surface);
}
#formula-input[data-editing="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px #bfdbfe; }
.grid-wrap {
  max-width: 100%;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.grid { display: block; width: max-content; }
.grid:focus-visible { outline-offset: -3px; }
.row { display: grid; grid-template-columns: 46px repeat(8, 112px); }
.row > * {
  min-width: 0;
  height: 30px;
  line-height: 28px;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.hdr { background: var(--head); font-weight: 600; text-align: center; padding: 0; }
.corner { background: var(--head); }
.cell {
  background: var(--surface);
  cursor: cell;
  user-select: none;
  text-align: left;
}
.cell[data-kind="number"] { text-align: right; }
.cell[data-kind="error"] { color: var(--error); font-weight: 600; }
.cell[data-in-selection="true"] { background: var(--in-sel); }
.cell[aria-selected="true"] { background: var(--active); box-shadow: inset 0 0 0 2px var(--accent); }
.summary {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Haiku 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <label class="fmt-label" for="format-select">Number format</label>
    <select id="format-select" data-testid="format-select">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="formula-bar">
    <div class="name-box" data-testid="name-box">A1</div>
    <input type="text" id="formula-input" data-testid="formula-input" aria-label="Cell content" autocomplete="off" spellcheck="false">
  </div>
  <div class="grid-wrap">
    <div class="grid" id="grid" role="grid" aria-label="Sheet" tabindex="0" data-testid="grid"></div>
  </div>
  <div class="summary" data-testid="selection-summary" hidden></div>
</main>
<script>
'use strict';

// ---- Engine ----

const ROWS = 12;
const COLS = 8;
const HISTORY_LIMIT = 20;
const COL_LETTERS = 'ABCDEFGH';
const CMP_OPS = ['=', '<>', '<', '<=', '>', '>='];
const CRIT_OPS = ['>=', '<=', '<>', '>', '<', '='];
const ENTRY_RE = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
const FUNC_ARGS = new Map([
  ['SUM', [1, Infinity]], ['AVERAGE', [1, Infinity]], ['MIN', [1, Infinity]], ['MAX', [1, Infinity]],
  ['COUNT', [1, Infinity]], ['COUNTA', [1, Infinity]], ['ROUND', [2, 2]], ['ABS', [1, 1]],
  ['INT', [1, 1]], ['MOD', [2, 2]], ['IF', [3, 3]], ['AND', [1, Infinity]], ['OR', [1, Infinity]],
  ['NOT', [1, 1]], ['IFERROR', [2, 2]], ['ISERROR', [1, 1]], ['ISBLANK', [1, 1]], ['LEN', [1, 1]],
  ['UPPER', [1, 1]], ['LEFT', [2, 2]], ['RIGHT', [2, 2]], ['MID', [3, 3]], ['CONCAT', [1, Infinity]],
  ['COUNTIF', [2, 2]], ['SUMIF', [3, 3]],
]);
const BAD = { syntax: true };
const parseCache = new Map();

class XErr {
  constructor(code) { this.code = code; }
}
const fail = code => new XErr(code);

const blankCell = () => ({ raw: '', fmt: 'general' });
const blankRow = () => Array.from({ length: COLS }, blankCell);
let cells = Array.from({ length: ROWS }, blankRow);
let anchor = { r: 0, c: 0 };
let active = { r: 0, c: 0 };
let editing = false;
let clip = null;
let undoStack = [];
let redoStack = [];
let memo = new Map();
let circ = new Set();

// Number normalization (02, 2.4)
function norm(x) {
  if (!isFinite(x)) return fail('#NUM!');
  const y = Number(x.toPrecision(12));
  if (Math.abs(y) >= 1e15) return fail('#NUM!');
  return y === 0 ? 0 : y;
}

// Decimal rounding on the digits of D(x) (02, 2.4)
function decParts(x) {
  const [mant, exp] = Math.abs(x).toExponential(11).split('e');
  const digits = mant.replace('.', '');
  const point = Number(exp) + 1;
  let int;
  let frac;
  if (point <= 0) {
    int = '0';
    frac = '0'.repeat(-point) + digits;
  } else if (point >= 12) {
    int = digits + '0'.repeat(point - 12);
    frac = '';
  } else {
    int = digits.slice(0, point);
    frac = digits.slice(point);
  }
  return { neg: x < 0, int, frac };
}

function incDigits(s) {
  const a = s.split('');
  let i = a.length - 1;
  while (i >= 0 && a[i] === '9') { a[i] = '0'; i--; }
  if (i < 0) return '1' + a.join('');
  a[i] = String(Number(a[i]) + 1);
  return a.join('');
}

function stripZeros(s) { return s.replace(/^0+(?=\d)/, ''); }

// R(x, d): x rounded to d decimal places (negative d: to the left), ties away from zero
function roundDec(x, d) {
  const p = decParts(x);
  if (d >= 0) {
    if (p.frac.length <= d) return { neg: p.neg, int: p.int, frac: p.frac.padEnd(d, '0') };
    let keep = p.int + p.frac.slice(0, d);
    if (p.frac[d] >= '5') keep = incDigits(keep);
    const cut = keep.length - d;
    return { neg: p.neg, int: stripZeros(keep.slice(0, cut)), frac: keep.slice(cut) };
  }
  const k = -d;
  const padded = p.int.padStart(k + 1, '0');
  let keep = padded.slice(0, padded.length - k);
  if (padded[padded.length - k] >= '5') keep = incDigits(keep);
  return { neg: p.neg, int: stripZeros(keep + '0'.repeat(k)), frac: '' };
}

function decStr(r) {
  return (r.neg ? '-' : '') + r.int + (r.frac ? '.' + r.frac : '');
}

function signOf(r) {
  return r.neg && /[1-9]/.test(r.int + r.frac) ? '-' : '';
}

function group(int) {
  return int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// Text shown for a number in a format (02, 2.5). General text when fmt is general.
function fmtNum(x, fmt) {
  if (fmt === 'percent1') {
    const y = norm(x * 100);
    if (y instanceof XErr) return y.code;
    const r = roundDec(y, 1);
    return signOf(r) + r.int + '.' + r.frac + '%';
  }
  if (fmt === 'fixed2') {
    const r = roundDec(x, 2);
    return signOf(r) + group(r.int) + '.' + r.frac;
  }
  const r = roundDec(x, 6);
  const frac = r.frac.replace(/0+$/, '');
  return signOf(r) + r.int + (frac ? '.' + frac : '');
}

function entryNumber(s) {
  if (!ENTRY_RE.test(s)) return null;
  const pct = s.endsWith('%');
  const n = norm(Number(pct ? s.slice(0, -1) : s) / (pct ? 100 : 1));
  return n instanceof XErr ? null : n;
}

// Conversions (02, 2.7.3)
function toNum(v) {
  if (v instanceof XErr) return v;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v === null) return 0;
  return fail('#VALUE!');
}

function toText(v) {
  if (v instanceof XErr) return v;
  if (typeof v === 'number') return fmtNum(v, 'general');
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (v === null) return '';
  return v;
}

function toLogical(v) {
  if (v instanceof XErr) return v;
  if (typeof v === 'number') return v !== 0;
  if (typeof v === 'boolean') return v;
  if (v === null) return false;
  return fail('#VALUE!');
}

const RANK = v => (typeof v === 'number' ? 0 : typeof v === 'string' ? 1 : 2);

function cmpVals(a, b) {
  const ra = RANK(a);
  const rb = RANK(b);
  if (ra !== rb) return ra < rb ? -1 : 1;
  if (ra === 0) return a < b ? -1 : a > b ? 1 : 0;
  if (ra === 1) {
    const x = a.toUpperCase();
    const y = b.toUpperCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }
  return (a ? 1 : 0) - (b ? 1 : 0);
}

function cmpOp(op, c) {
  switch (op) {
    case '=': return c === 0;
    case '<>': return c !== 0;
    case '<': return c < 0;
    case '<=': return c <= 0;
    case '>': return c > 0;
    case '>=': return c >= 0;
  }
  return false;
}

// Tokens and grammar (02, 2.6)
function colIndex(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}

function colName(n) {
  let s = '';
  while (n > 0) {
    s = String.fromCharCode(65 + ((n - 1) % 26)) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function wordToken(w) {
  if (/^(TRUE|FALSE)$/i.test(w)) return { t: 'bool', v: w.toUpperCase() === 'TRUE' };
  const m = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);
  if (m) {
    return { t: 'ref', col: colIndex(m[2].toUpperCase()), row: Number(m[4]), cabs: m[1] === '$', rabs: m[3] === '$' };
  }
  if (/^[A-Za-z][A-Za-z0-9]*$/.test(w)) return { t: 'name', name: w.toUpperCase() };
  throw BAD;
}

function tokenize(src) {
  const toks = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    const rest = src.slice(i);
    let m;
    if (ch === ' ') {
      i++;
    } else if ((m = /^(\d+(\.\d+)?|\.\d+)/.exec(rest))) {
      toks.push({ t: 'num', text: m[0] });
      i += m[0].length;
    } else if (ch === '"') {
      let j = i + 1;
      let val = '';
      let closed = false;
      while (j < src.length) {
        if (src[j] === '"') {
          if (src[j + 1] === '"') { val += '"'; j += 2; continue; }
          closed = true;
          break;
        }
        val += src[j];
        j++;
      }
      if (!closed) throw BAD;
      toks.push({ t: 'str', text: src.slice(i, j + 1), v: val });
      i = j + 1;
    } else if ((m = /^[A-Za-z$][A-Za-z0-9$]*/.exec(rest))) {
      toks.push(wordToken(m[0]));
      i += m[0].length;
    } else if (rest.slice(0, 5).toUpperCase() === '#REF!') {
      toks.push({ t: 'refErr' });
      i += 5;
    } else if (['<>', '<=', '>='].includes(rest.slice(0, 2))) {
      toks.push({ t: 'op', v: rest.slice(0, 2) });
      i += 2;
    } else if ('+-*/^&%=<>'.includes(ch)) {
      toks.push({ t: 'op', v: ch });
      i++;
    } else if ('(),:'.includes(ch)) {
      toks.push({ t: 'p', v: ch });
      i++;
    } else {
      throw BAD;
    }
  }
  return toks;
}

const isOp = (P, ...ops) => {
  const t = P.toks[P.i];
  return !!t && t.t === 'op' && ops.includes(t.v);
};
const isP = (P, v) => {
  const t = P.toks[P.i];
  return !!t && t.t === 'p' && t.v === v;
};
function expectP(P, v) {
  if (!isP(P, v)) throw BAD;
  P.i++;
}

const LEVELS = [CMP_OPS, ['&'], ['+', '-'], ['*', '/']];

function parseExpr(P) {
  if (++P.depth > 200) throw BAD;
  const e = parseLevel(P, 0);
  P.depth--;
  return e;
}

function parseLevel(P, lvl) {
  if (lvl === LEVELS.length) return parseSigned(P);
  let l = parseLevel(P, lvl + 1);
  while (isOp(P, ...LEVELS[lvl])) {
    const op = P.toks[P.i++].v;
    const r = parseLevel(P, lvl + 1);
    l = { t: 'bin', op, l, r };
  }
  return l;
}

function parseSigned(P) {
  if (isOp(P, '-', '+')) {
    const op = P.toks[P.i++].v;
    if (++P.depth > 200) throw BAD;
    const e = parseSigned(P);
    P.depth--;
    return { t: 'un', op, e };
  }
  return parsePower(P);
}

function parsePower(P) {
  const b = parsePercent(P);
  if (isOp(P, '^')) {
    P.i++;
    return { t: 'bin', op: '^', l: b, r: parseSigned(P) };
  }
  return b;
}

function parsePercent(P) {
  let e = parsePrimary(P);
  while (isOp(P, '%')) {
    P.i++;
    e = { t: 'pct', e };
  }
  return e;
}

function parsePrimary(P) {
  const tk = P.toks[P.i];
  if (!tk) throw BAD;
  switch (tk.t) {
    case 'num':
      P.i++;
      return { t: 'num', text: tk.text, v: norm(Number(tk.text)) };
    case 'str':
      P.i++;
      return { t: 'str', text: tk.text, v: tk.v };
    case 'bool':
      P.i++;
      return { t: 'bool', v: tk.v };
    case 'refErr':
      P.i++;
      return { t: 'refErr' };
    case 'ref': {
      P.i++;
      const a = { t: 'ref', col: tk.col, row: tk.row, cabs: tk.cabs, rabs: tk.rabs };
      if (isP(P, ':')) {
        const nx = P.toks[P.i + 1];
        if (!nx || nx.t !== 'ref') throw BAD;
        P.i += 2;
        return { t: 'range', a, b: { t: 'ref', col: nx.col, row: nx.row, cabs: nx.cabs, rabs: nx.rabs } };
      }
      return a;
    }
    case 'name':
      P.i++;
      if (isP(P, '(')) return parseCall(P, tk.name);
      return { t: 'name', name: tk.name };
    case 'p':
      if (tk.v !== '(') throw BAD;
      P.i++;
      {
        const e = parseExpr(P);
        expectP(P, ')');
        return { t: 'paren', e };
      }
    default:
      throw BAD;
  }
}

function parseCall(P, name) {
  P.i++;
  const args = [];
  if (isP(P, ')')) {
    P.i++;
    return { t: 'call', name, args };
  }
  for (;;) {
    const start = P.i;
    const e = parseExpr(P);
    const n = P.i - start;
    const first = P.toks[start];
    const sep = P.toks[start + 1];
    e.isRange = (n === 1 && (first.t === 'ref' || first.t === 'refErr'))
      || (n === 3 && first.t === 'ref' && sep.t === 'p' && sep.v === ':' && P.toks[start + 2].t === 'ref');
    args.push(e);
    if (isP(P, ',')) {
      P.i++;
      continue;
    }
    expectP(P, ')');
    return { t: 'call', name, args };
  }
}

// Parses a raw formula (starting with "="). Returns the tree, or null when not valid.
function parseFormula(raw) {
  if (parseCache.has(raw)) return parseCache.get(raw);
  let ast = null;
  try {
    const toks = tokenize(raw.slice(1));
    const P = { toks, i: 0, depth: 0 };
    if (toks.length) {
      const e = parseExpr(P);
      if (P.i === toks.length) ast = e;
    }
  } catch (e) {
    ast = null;
  }
  if (parseCache.size > 5000) parseCache.clear();
  parseCache.set(raw, ast);
  return ast;
}

// Canonical writing (02, 2.6.4)
function normalizeCorners(a, b) {
  let c1 = { col: a.col, cabs: a.cabs };
  let c2 = { col: b.col, cabs: b.cabs };
  if (a.col > b.col) [c1, c2] = [c2, c1];
  let r1 = { row: a.row, rabs: a.rabs };
  let r2 = { row: b.row, rabs: b.rabs };
  if (a.row > b.row) [r1, r2] = [r2, r1];
  return [{ ...c1, ...r1 }, { ...c2, ...r2 }];
}

function refText(n) {
  return (n.cabs ? '$' : '') + colName(n.col) + (n.rabs ? '$' : '') + n.row;
}

function ser(n) {
  switch (n.t) {
    case 'num':
    case 'str':
      return n.text;
    case 'bool': return n.v ? 'TRUE' : 'FALSE';
    case 'refErr': return '#REF!';
    case 'ref': return refText(n);
    case 'range': {
      const [p, q] = normalizeCorners(n.a, n.b);
      return refText(p) + ':' + refText(q);
    }
    case 'name': return n.name;
    case 'paren': return '(' + ser(n.e) + ')';
    case 'un': return n.op + ser(n.e);
    case 'pct': return ser(n.e) + '%';
    case 'bin': return ser(n.l) + n.op + ser(n.r);
    case 'call': return n.name + '(' + n.args.map(ser).join(',') + ')';
  }
  return '';
}

// Rewrites every reference of a tree through refFn (single reference) and rangeFn (range corners)
function mapRefs(n, refFn, rangeFn) {
  switch (n.t) {
    case 'ref': return refFn(n);
    case 'range': return rangeFn(n.a, n.b);
    case 'paren': return { t: 'paren', e: mapRefs(n.e, refFn, rangeFn) };
    case 'un': return { t: 'un', op: n.op, e: mapRefs(n.e, refFn, rangeFn) };
    case 'pct': return { t: 'pct', e: mapRefs(n.e, refFn, rangeFn) };
    case 'bin': return { t: 'bin', op: n.op, l: mapRefs(n.l, refFn, rangeFn), r: mapRefs(n.r, refFn, rangeFn) };
    case 'call': return { t: 'call', name: n.name, args: n.args.map(a => mapRefs(a, refFn, rangeFn)) };
    default: return n;
  }
}

function inGrid(n) {
  return n.col >= 1 && n.col <= COLS && n.row >= 1 && n.row <= ROWS;
}

function keyOf(row, col) {
  return (row - 1) * COLS + (col - 1);
}

// Insertion and deletion (02, 2.10.1 and 2.10.2). axis: 'row' or 'col', k: 1-based index.
function shiftValue(v, axis, k, ins) {
  if (ins) {
    if (v < k) return v;
    const w = v + 1;
    return w === (axis === 'row' ? ROWS + 1 : COLS + 1) ? null : w;
  }
  if (v < k) return v;
  if (v === k) return null;
  return v - 1;
}

function shiftRef(n, axis, k, ins) {
  if (!inGrid(n)) return n;
  const v = shiftValue(n[axis], axis, k, ins);
  if (v === null) return { t: 'refErr' };
  return { ...n, [axis]: v };
}

function shiftRange(a, b, axis, k, ins) {
  if (!inGrid(a) || !inGrid(b)) return { t: 'range', a, b };
  const lo0 = Math.min(a[axis], b[axis]);
  const hi0 = Math.max(a[axis], b[axis]);
  const limit = axis === 'row' ? ROWS + 1 : COLS + 1;
  let lo;
  let hi;
  if (ins) {
    lo = lo0 >= k ? lo0 + 1 : lo0;
    hi = hi0 >= k ? hi0 + 1 : hi0;
    if (lo === limit) return { t: 'refErr' };
    hi = Math.min(hi, limit - 1);
  } else if (k > hi0) {
    lo = lo0;
    hi = hi0;
  } else if (k < lo0) {
    lo = lo0 - 1;
    hi = hi0 - 1;
  } else {
    if (lo0 === hi0) return { t: 'refErr' };
    lo = lo0;
    hi = hi0 - 1;
  }
  const na = { ...a };
  const nb = { ...b };
  if (a[axis] <= b[axis]) {
    na[axis] = lo;
    nb[axis] = hi;
  } else {
    nb[axis] = lo;
    na[axis] = hi;
  }
  return { t: 'range', a: na, b: nb };
}

function rewriteRaw(raw, refFn, rangeFn) {
  if (raw[0] !== '=') return raw;
  const ast = parseFormula(raw);
  if (!ast) return raw;
  return '=' + ser(mapRefs(ast, refFn, rangeFn));
}

// Paste adjustment (02, 2.10.3)
function adjustRaw(raw, dr, dc) {
  if (raw[0] !== '=') return raw;
  const ast = parseFormula(raw);
  if (!ast) return raw;
  const moved = n => ({ ...n, col: n.cabs ? n.col : n.col + dc, row: n.rabs ? n.row : n.row + dr });
  const refFn = n => {
    const m = moved(n);
    return inGrid(m) ? m : { t: 'refErr' };
  };
  const rangeFn = (a, b) => {
    const ma = moved(a);
    const mb = moved(b);
    return inGrid(ma) && inGrid(mb) ? { t: 'range', a: ma, b: mb } : { t: 'refErr' };
  };
  return '=' + ser(mapRefs(ast, refFn, rangeFn));
}

// Raw content from a committed string (02, 2.2)
function makeRaw(text) {
  if (text === '') return '';
  if (text[0] === '=') {
    const ast = parseFormula(text);
    return ast ? '=' + ser(ast) : text;
  }
  return text;
}

function entryValue(raw) {
  if (raw[0] === "'") return raw.slice(1);
  const s = raw.replace(/^ +| +$/g, '');
  const n = entryNumber(s);
  if (n !== null) return n;
  if (/^(TRUE|FALSE)$/i.test(s)) return s.toUpperCase() === 'TRUE';
  return raw;
}

// Recalculation (02, 2.9)
function precedents(n, out) {
  switch (n.t) {
    case 'ref':
      if (inGrid(n)) out.push(keyOf(n.row, n.col));
      break;
    case 'range':
      if (inGrid(n.a) && inGrid(n.b)) {
        for (let r = Math.min(n.a.row, n.b.row); r <= Math.max(n.a.row, n.b.row); r++) {
          for (let c = Math.min(n.a.col, n.b.col); c <= Math.max(n.a.col, n.b.col); c++) out.push(keyOf(r, c));
        }
      }
      break;
    case 'paren':
    case 'un':
    case 'pct':
      precedents(n.e, out);
      break;
    case 'bin':
      precedents(n.l, out);
      precedents(n.r, out);
      break;
    case 'call':
      for (const a of n.args) precedents(a, out);
      break;
  }
  return out;
}

function recalc() {
  memo = new Map();
  circ = new Set();
  const deps = new Map();
  for (let r = 1; r <= ROWS; r++) {
    for (let c = 1; c <= COLS; c++) {
      const raw = cells[r - 1][c - 1].raw;
      if (raw[0] === '=') {
        const ast = parseFormula(raw);
        if (ast) deps.set(keyOf(r, c), precedents(ast, []));
      }
    }
  }
  for (const [k, ds] of deps) {
    const seen = new Set();
    const stack = ds.slice();
    while (stack.length) {
      const x = stack.pop();
      if (x === k) {
        circ.add(k);
        break;
      }
      if (seen.has(x)) continue;
      seen.add(x);
      const next = deps.get(x);
      if (next) for (const y of next) stack.push(y);
    }
  }
}

function valAt(row, col) {
  const key = keyOf(row, col);
  if (circ.has(key)) return fail('#CYCLE!');
  if (memo.has(key)) return memo.get(key);
  const v = valueOfRaw(cells[row - 1][col - 1].raw);
  memo.set(key, v);
  return v;
}

function valueOfRaw(raw) {
  if (raw === '') return null;
  if (raw[0] === '=') {
    const ast = parseFormula(raw);
    if (!ast) return fail('#SYNTAX!');
    const v = evalNode(ast);
    return v === null ? 0 : v;
  }
  return entryValue(raw);
}

// Evaluation (02, 2.7 and 2.8)
function evalNode(n) {
  switch (n.t) {
    case 'num':
    case 'str':
    case 'bool':
      return n.v;
    case 'refErr':
      return fail('#REF!');
    case 'ref':
      return inGrid(n) ? valAt(n.row, n.col) : fail('#REF!');
    case 'range':
      return fail('#VALUE!');
    case 'name':
      return fail('#NAME?');
    case 'paren':
      return evalNode(n.e);
    case 'un': {
      const v = evalNode(n.e);
      if (v instanceof XErr) return v;
      const x = toNum(v);
      if (x instanceof XErr) return x;
      return norm(n.op === '-' ? -x : x);
    }
    case 'pct': {
      const v = evalNode(n.e);
      if (v instanceof XErr) return v;
      const x = toNum(v);
      if (x instanceof XErr) return x;
      return norm(x / 100);
    }
    case 'bin':
      return evalBin(n);
    case 'call':
      return evalCall(n);
  }
  return fail('#SYNTAX!');
}

function blankAs(other) {
  if (typeof other === 'number') return 0;
  if (typeof other === 'string') return '';
  return false;
}

function evalBin(n) {
  const l = evalNode(n.l);
  if (l instanceof XErr) return l;
  const r = evalNode(n.r);
  if (r instanceof XErr) return r;
  if (n.op === '&') return toText(l) + toText(r);
  if (CMP_OPS.includes(n.op)) {
    let a = l;
    let b = r;
    if (a === null && b === null) {
      a = 0;
      b = 0;
    } else if (a === null) {
      a = blankAs(b);
    } else if (b === null) {
      b = blankAs(a);
    }
    return cmpOp(n.op, cmpVals(a, b));
  }
  const a = toNum(l);
  if (a instanceof XErr) return a;
  const b = toNum(r);
  if (b instanceof XErr) return b;
  switch (n.op) {
    case '+': return norm(a + b);
    case '-': return norm(a - b);
    case '*': return norm(a * b);
    case '/': return b === 0 ? fail('#DIV/0!') : norm(a / b);
    case '^':
      if (a === 0 && b === 0) return fail('#NUM!');
      if (a === 0 && b < 0) return fail('#DIV/0!');
      if (a < 0 && !Number.isInteger(b)) return fail('#NUM!');
      return norm(Math.pow(a, b));
  }
  return fail('#SYNTAX!');
}

// Range argument as a list of cells, visiting order (1-based row and column)
function rangeOf(n) {
  if (n.t === 'refErr') return fail('#REF!');
  if (n.t === 'ref') {
    return inGrid(n) ? { rows: 1, cols: 1, cells: [[n.row, n.col]] } : fail('#REF!');
  }
  if (!inGrid(n.a) || !inGrid(n.b)) return fail('#REF!');
  const r1 = Math.min(n.a.row, n.b.row);
  const r2 = Math.max(n.a.row, n.b.row);
  const c1 = Math.min(n.a.col, n.b.col);
  const c2 = Math.max(n.a.col, n.b.col);
  const list = [];
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) list.push([r, c]);
  }
  return { rows: r2 - r1 + 1, cols: c2 - c1 + 1, cells: list };
}

function criterionOf(v) {
  if (v === null) return { op: '=', operand: '' };
  if (typeof v !== 'string') return { op: '=', operand: v };
  for (const op of CRIT_OPS) {
    if (v.startsWith(op)) return { op, operand: operandOf(v.slice(op.length)) };
  }
  return { op: '=', operand: v };
}

function operandOf(s) {
  const n = entryNumber(s);
  if (n !== null) return n;
  if (/^(TRUE|FALSE)$/i.test(s)) return s.toUpperCase() === 'TRUE';
  return s;
}

function critMatch(v, op, operand) {
  const same = RANK(v) === RANK(operand);
  if (op === '<>') return !(same && cmpVals(v, operand) === 0);
  if (op === '=') return same && cmpVals(v, operand) === 0;
  return same && cmpOp(op, cmpVals(v, operand));
}

function argNum(a) {
  return toNum(evalNode(a));
}

function argInt(a) {
  const x = argNum(a);
  return x instanceof XErr ? x : Math.trunc(x);
}

function argText(a) {
  return toText(evalNode(a));
}

function argLogical(a) {
  return toLogical(evalNode(a));
}

function aggregate(f, args) {
  const nums = [];
  let count = 0;
  for (const a of args) {
    if (a.isRange) {
      const rg = rangeOf(a);
      if (rg instanceof XErr) return rg;
      for (const [r, c] of rg.cells) {
        const v = valAt(r, c);
        if (v instanceof XErr) return v;
        if (f === 'COUNTA') {
          if (v !== null) count++;
        } else if (typeof v === 'number') {
          nums.push(v);
          count++;
        }
      }
    } else {
      const v = evalNode(a);
      if (v instanceof XErr) return v;
      if (f === 'COUNTA') {
        count++;
      } else if (f === 'COUNT') {
        if (typeof v === 'number') count++;
      } else {
        const x = toNum(v);
        if (x instanceof XErr) return x;
        nums.push(x);
      }
    }
  }
  const total = () => nums.reduce((s, x) => s + x, 0);
  switch (f) {
    case 'COUNT':
    case 'COUNTA':
      return count;
    case 'SUM':
      return norm(total());
    case 'AVERAGE':
      return nums.length ? norm(total() / nums.length) : fail('#DIV/0!');
    case 'MIN':
      return nums.length ? norm(Math.min(...nums)) : 0;
    case 'MAX':
      return nums.length ? norm(Math.max(...nums)) : 0;
  }
  return fail('#NAME?');
}

function evalCall(n) {
  const spec = FUNC_ARGS.get(n.name);
  if (!spec) return fail('#NAME?');
  const args = n.args;
  if (args.length < spec[0] || args.length > spec[1]) return fail('#ARGS!');
  switch (n.name) {
    case 'SUM':
    case 'AVERAGE':
    case 'MIN':
    case 'MAX':
    case 'COUNT':
    case 'COUNTA':
      return aggregate(n.name, args);
    case 'ROUND': {
      const x = argNum(args[0]);
      if (x instanceof XErr) return x;
      const d = argInt(args[1]);
      if (d instanceof XErr) return d;
      if (d < -9 || d > 9) return fail('#NUM!');
      return norm(Number(decStr(roundDec(x, d))));
    }
    case 'ABS': {
      const x = argNum(args[0]);
      return x instanceof XErr ? x : norm(Math.abs(x));
    }
    case 'INT': {
      const x = argNum(args[0]);
      return x instanceof XErr ? x : norm(Math.floor(x));
    }
    case 'MOD': {
      const a = argNum(args[0]);
      if (a instanceof XErr) return a;
      const b = argNum(args[1]);
      if (b instanceof XErr) return b;
      if (b === 0) return fail('#DIV/0!');
      return norm(a - b * Math.floor(a / b));
    }
    case 'IF': {
      const c = argLogical(args[0]);
      if (c instanceof XErr) return c;
      return evalNode(c ? args[1] : args[2]);
    }
    case 'AND':
    case 'OR': {
      let res = n.name === 'AND';
      for (const a of args) {
        const v = argLogical(a);
        if (v instanceof XErr) return v;
        res = n.name === 'AND' ? res && v : res || v;
      }
      return res;
    }
    case 'NOT': {
      const v = argLogical(args[0]);
      return v instanceof XErr ? v : !v;
    }
    case 'IFERROR': {
      const v = evalNode(args[0]);
      return v instanceof XErr ? evalNode(args[1]) : v;
    }
    case 'ISERROR':
      return evalNode(args[0]) instanceof XErr;
    case 'ISBLANK': {
      const a = args[0];
      if (a.isRange) {
        if (a.t === 'refErr') return fail('#REF!');
        if (a.t === 'ref') {
          if (!inGrid(a)) return fail('#REF!');
          return cells[a.row - 1][a.col - 1].raw === '';
        }
        if (!inGrid(a.a) || !inGrid(a.b)) return fail('#REF!');
        return fail('#VALUE!');
      }
      const v = evalNode(a);
      return v instanceof XErr ? v : false;
    }
    case 'LEN': {
      const t = argText(args[0]);
      return t instanceof XErr ? t : t.length;
    }
    case 'UPPER': {
      const t = argText(args[0]);
      return t instanceof XErr ? t : t.toUpperCase();
    }
    case 'LEFT': {
      const t = argText(args[0]);
      if (t instanceof XErr) return t;
      const k = argInt(args[1]);
      if (k instanceof XErr) return k;
      if (k < 0) return fail('#VALUE!');
      return t.slice(0, k);
    }
    case 'RIGHT': {
      const t = argText(args[0]);
      if (t instanceof XErr) return t;
      const k = argInt(args[1]);
      if (k instanceof XErr) return k;
      if (k < 0) return fail('#VALUE!');
      return t.slice(Math.max(0, t.length - k));
    }
    case 'MID': {
      const t = argText(args[0]);
      if (t instanceof XErr) return t;
      const s = argInt(args[1]);
      if (s instanceof XErr) return s;
      const k = argInt(args[2]);
      if (k instanceof XErr) return k;
      if (s < 1 || k < 0) return fail('#VALUE!');
      return t.substr(s - 1, k);
    }
    case 'CONCAT': {
      let out = '';
      for (const a of args) {
        if (a.isRange) {
          const rg = rangeOf(a);
          if (rg instanceof XErr) return rg;
          for (const [r, c] of rg.cells) {
            const v = valAt(r, c);
            if (v instanceof XErr) return v;
            out += toText(v);
          }
        } else {
          const t = argText(a);
          if (t instanceof XErr) return t;
          out += t;
        }
      }
      return out;
    }
    case 'COUNTIF': {
      if (!args[0].isRange) return fail('#VALUE!');
      const rg = rangeOf(args[0]);
      if (rg instanceof XErr) return rg;
      const crit = evalNode(args[1]);
      if (crit instanceof XErr) return crit;
      const { op, operand } = criterionOf(crit);
      let count = 0;
      for (const [r, c] of rg.cells) {
        const v = valAt(r, c);
        if (v instanceof XErr) return v;
        if (v !== null && critMatch(v, op, operand)) count++;
      }
      return count;
    }
    case 'SUMIF': {
      if (!args[0].isRange || !args[2].isRange) return fail('#VALUE!');
      const rg = rangeOf(args[0]);
      if (rg instanceof XErr) return rg;
      const sg = rangeOf(args[2]);
      if (sg instanceof XErr) return sg;
      if (rg.rows !== sg.rows || rg.cols !== sg.cols) return fail('#VALUE!');
      const crit = evalNode(args[1]);
      if (crit instanceof XErr) return crit;
      const { op, operand } = criterionOf(crit);
      let total = 0;
      for (let i = 0; i < rg.cells.length; i++) {
        const [r, c] = rg.cells[i];
        const v = valAt(r, c);
        if (v instanceof XErr) return v;
        if (v === null || !critMatch(v, op, operand)) continue;
        const [sr, sc] = sg.cells[i];
        const sv = valAt(sr, sc);
        if (sv instanceof XErr) return sv;
        if (typeof sv === 'number') total += sv;
      }
      return norm(total);
    }
  }
  return fail('#NAME?');
}

function show(v, fmt) {
  if (v === null) return { text: '', kind: 'empty' };
  if (v instanceof XErr) return { text: v.code, kind: 'error' };
  if (typeof v === 'string') return { text: v, kind: 'text' };
  if (typeof v === 'boolean') return { text: v ? 'TRUE' : 'FALSE', kind: 'logical' };
  return { text: fmtNum(v, fmt), kind: 'number' };
}

// ---- Interface ----

const tid = name => document.querySelector(`[data-testid="${name}"]`);
const gridEl = tid('grid');
const inputEl = tid('formula-input');
const nameBoxEl = tid('name-box');
const summaryEl = tid('selection-summary');
const formatSel = tid('format-select');
const undoBtn = tid('undo-button');
const redoBtn = tid('redo-button');
const copyBtn = tid('copy-button');
const cutBtn = tid('cut-button');
const pasteBtn = tid('paste-button');
const clearBtn = tid('clear-button');
const insRowBtn = tid('insert-row');
const delRowBtn = tid('delete-row');
const insColBtn = tid('insert-col');
const delColBtn = tid('delete-col');
const cellEls = [];

function make(tag, attrs, text) {
  const el = document.createElement(tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  return el;
}

function buildGrid() {
  const head = make('div', { role: 'row', class: 'row' });
  head.appendChild(make('div', { role: 'presentation', class: 'corner' }));
  for (let c = 0; c < COLS; c++) {
    const L = COL_LETTERS[c];
    head.appendChild(make('div', { role: 'columnheader', class: 'hdr', 'data-testid': 'col-header-' + L }, L));
  }
  gridEl.appendChild(head);
  for (let r = 0; r < ROWS; r++) {
    const line = make('div', { role: 'row', class: 'row' });
    line.appendChild(make('div', { role: 'rowheader', class: 'hdr', 'data-testid': 'row-header-' + (r + 1) }, String(r + 1)));
    cellEls.push([]);
    for (let c = 0; c < COLS; c++) {
      const td = make('div', { role: 'gridcell', class: 'cell', 'data-testid': 'cell-' + COL_LETTERS[c] + (r + 1) });
      td.addEventListener('click', e => onCellClick(e, r, c));
      line.appendChild(td);
      cellEls[r].push(td);
    }
    gridEl.appendChild(line);
  }
}

const addr = (r, c) => COL_LETTERS[c] + (r + 1);

function selRect() {
  return {
    r1: Math.min(anchor.r, active.r),
    r2: Math.max(anchor.r, active.r),
    c1: Math.min(anchor.c, active.c),
    c2: Math.max(anchor.c, active.c),
  };
}

function forEachCell(rect, fn) {
  for (let r = rect.r1; r <= rect.r2; r++) {
    for (let c = rect.c1; c <= rect.c2; c++) fn(r, c);
  }
}

function snapshot() {
  return {
    cells: cells.map(row => row.map(c => ({ raw: c.raw, fmt: c.fmt }))),
    anchor: { ...anchor },
    active: { ...active },
  };
}

function restore(st) {
  cells = st.cells.map(row => row.map(c => ({ ...c })));
  anchor = { ...st.anchor };
  active = { ...st.active };
}

function record(before) {
  undoStack.push({ before, after: snapshot() });
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
}

function undo() {
  if (editing || !undoStack.length) return;
  const step = undoStack.pop();
  redoStack.push(step);
  restore(step.before);
  render();
}

function redo() {
  if (editing || !redoStack.length) return;
  const step = redoStack.pop();
  undoStack.push(step);
  restore(step.after);
  render();
}

function setRaw(r, c, text) {
  const raw = makeRaw(text);
  if (raw === cells[r][c].raw) return false;
  cells[r][c].raw = raw;
  return true;
}

function moveActive(dr, dc, extend) {
  active = {
    r: Math.min(ROWS - 1, Math.max(0, active.r + dr)),
    c: Math.min(COLS - 1, Math.max(0, active.c + dc)),
  };
  if (!extend) anchor = { ...active };
  render();
}

// Commit of the formula bar (Enter, Tab), then a move of the active cell
function commitMove(dr, dc) {
  const before = snapshot();
  let changed = false;
  if (editing) {
    changed = setRaw(active.r, active.c, inputEl.value);
    editing = false;
  }
  active = {
    r: Math.min(ROWS - 1, Math.max(0, active.r + dr)),
    c: Math.min(COLS - 1, Math.max(0, active.c + dc)),
  };
  anchor = { ...active };
  if (changed) record(before);
  render();
  inputEl.focus({ preventScroll: true });
}

function cancelEdit() {
  editing = false;
  render();
  gridEl.focus({ preventScroll: true });
}

function onCellClick(e, r, c) {
  const before = snapshot();
  let changed = false;
  if (editing) {
    changed = setRaw(active.r, active.c, inputEl.value);
    editing = false;
  }
  active = { r, c };
  if (!e.shiftKey) anchor = { r, c };
  if (changed) record(before);
  gridEl.focus({ preventScroll: true });
  render();
}

function clearSelection() {
  const before = snapshot();
  let changed = false;
  forEachCell(selRect(), (r, c) => {
    if (cells[r][c].raw !== '') {
      changed = true;
      cells[r][c].raw = '';
    }
  });
  if (changed) record(before);
  render();
}

function applyFormat(fmt) {
  if (editing) return;
  const before = snapshot();
  let changed = false;
  forEachCell(selRect(), (r, c) => {
    if (cells[r][c].fmt !== fmt) {
      changed = true;
      cells[r][c].fmt = fmt;
    }
  });
  if (changed) record(before);
  render();
}

function takeBlock(mode) {
  const rect = selRect();
  const rows = [];
  for (let r = rect.r1; r <= rect.r2; r++) {
    const line = [];
    for (let c = rect.c1; c <= rect.c2; c++) line.push({ ...cells[r][c] });
    rows.push(line);
  }
  clip = { mode, rect, cells: rows };
}

function pasteClipboard() {
  if (!clip) return;
  const before = snapshot();
  const origin = clip.rect;
  const dest = selRect();
  const dr = dest.r1 - origin.r1;
  const dc = dest.c1 - origin.c1;
  if (clip.mode === 'cut') {
    forEachCell(origin, (r, c) => {
      cells[r][c] = blankCell();
    });
  }
  clip.cells.forEach((line, i) => {
    line.forEach((src, j) => {
      const r = dest.r1 + i;
      const c = dest.c1 + j;
      if (r >= ROWS || c >= COLS) return;
      const raw = clip.mode === 'copy' ? adjustRaw(src.raw, dr, dc) : src.raw;
      cells[r][c] = { raw, fmt: src.fmt };
    });
  });
  if (clip.mode === 'cut') clip = null;
  active = { r: dest.r1, c: dest.c1 };
  anchor = { ...active };
  record(before);
  render();
}

function rewriteAll(refFn, rangeFn) {
  for (const row of cells) {
    for (const cell of row) cell.raw = rewriteRaw(cell.raw, refFn, rangeFn);
  }
}

function insertLine(axis, k) {
  const before = snapshot();
  rewriteAll(n => shiftRef(n, axis, k, true), (a, b) => shiftRange(a, b, axis, k, true));
  if (axis === 'row') {
    for (let r = ROWS - 1; r >= k; r--) cells[r] = cells[r - 1];
    cells[k - 1] = blankRow();
  } else {
    for (const row of cells) {
      for (let c = COLS - 1; c >= k; c--) row[c] = row[c - 1];
      row[k - 1] = blankCell();
    }
  }
  record(before);
  render();
}

function deleteLine(axis, k) {
  const before = snapshot();
  rewriteAll(n => shiftRef(n, axis, k, false), (a, b) => shiftRange(a, b, axis, k, false));
  if (axis === 'row') {
    for (let r = k - 1; r < ROWS - 1; r++) cells[r] = cells[r + 1];
    cells[ROWS - 1] = blankRow();
  } else {
    for (const row of cells) {
      for (let c = k - 1; c < COLS - 1; c++) row[c] = row[c + 1];
      row[COLS - 1] = blankCell();
    }
  }
  record(before);
  render();
}

function onKeyGrid(e) {
  const key = e.key;
  const low = key.toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  if (mod && low === 'z') {
    e.preventDefault();
    undo();
    return;
  }
  if (mod && low === 'y') {
    e.preventDefault();
    redo();
    return;
  }
  switch (key) {
    case 'ArrowUp':
    case 'ArrowDown':
    case 'ArrowLeft':
    case 'ArrowRight': {
      e.preventDefault();
      if (editing) return;
      const dr = key === 'ArrowUp' ? -1 : key === 'ArrowDown' ? 1 : 0;
      const dc = key === 'ArrowLeft' ? -1 : key === 'ArrowRight' ? 1 : 0;
      moveActive(dr, dc, e.shiftKey);
      return;
    }
    case 'Delete':
    case 'Backspace':
      e.preventDefault();
      if (!editing) clearSelection();
      return;
    case 'Enter':
      e.preventDefault();
      inputEl.focus({ preventScroll: true });
      return;
  }
}

function onKeyInput(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    commitMove(1, 0);
  } else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    commitMove(0, 1);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    cancelEdit();
  }
}

function renderSummary(rect) {
  let n = 0;
  let total = 0;
  forEachCell(rect, (r, c) => {
    const v = valAt(r + 1, c + 1);
    if (typeof v === 'number') {
      n++;
      total += v;
    }
  });
  if (!n) {
    summaryEl.hidden = true;
    return;
  }
  const s = norm(total);
  const a = norm(total / n);
  const sText = s instanceof XErr ? '#NUM!' : fmtNum(s, 'general');
  const aText = a instanceof XErr ? '#NUM!' : fmtNum(a, 'general');
  summaryEl.textContent = `Sum: ${sText} | Average: ${aText} | Count: ${n}`;
  summaryEl.hidden = false;
}

function render() {
  recalc();
  const rect = selRect();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = cellEls[r][c];
      const shown = show(valAt(r + 1, c + 1), cells[r][c].fmt);
      el.textContent = shown.text;
      el.setAttribute('data-kind', shown.kind);
      el.setAttribute('aria-selected', String(r === active.r && c === active.c));
      el.setAttribute('data-in-selection', String(r >= rect.r1 && r <= rect.r2 && c >= rect.c1 && c <= rect.c2));
    }
  }
  const single = rect.r1 === rect.r2 && rect.c1 === rect.c2;
  nameBoxEl.textContent = single ? addr(active.r, active.c) : addr(rect.r1, rect.c1) + ':' + addr(rect.r2, rect.c2);
  renderSummary(rect);

  const current = cells[active.r][active.c];
  undoBtn.disabled = editing || undoStack.length === 0;
  redoBtn.disabled = editing || redoStack.length === 0;
  pasteBtn.disabled = editing || clip === null;
  for (const b of [copyBtn, cutBtn, clearBtn, insRowBtn, delRowBtn, insColBtn, delColBtn]) b.disabled = editing;
  formatSel.disabled = editing;
  formatSel.value = current.fmt;
  inputEl.setAttribute('data-editing', String(editing));
  if (!editing) inputEl.value = current.raw;
}

function init() {
  buildGrid();
  inputEl.addEventListener('input', () => {
    if (!editing) {
      editing = true;
      render();
    }
  });
  inputEl.addEventListener('keydown', onKeyInput);
  gridEl.addEventListener('keydown', onKeyGrid);
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  copyBtn.addEventListener('click', () => {
    takeBlock('copy');
    render();
  });
  cutBtn.addEventListener('click', () => {
    takeBlock('cut');
    render();
  });
  pasteBtn.addEventListener('click', pasteClipboard);
  clearBtn.addEventListener('click', clearSelection);
  insRowBtn.addEventListener('click', () => insertLine('row', active.r + 1));
  delRowBtn.addEventListener('click', () => deleteLine('row', active.r + 1));
  insColBtn.addEventListener('click', () => insertLine('col', active.c + 1));
  delColBtn.addEventListener('click', () => deleteLine('col', active.c + 1));
  formatSel.addEventListener('change', () => applyFormat(formatSel.value));
  render();
}

init();
</script>
</body>
</html>
