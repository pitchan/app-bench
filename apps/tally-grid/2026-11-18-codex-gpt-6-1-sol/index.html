function action(id){if(editing)return;if(id==='undo-button'){if(history.length){let s=history.pop();future.push(s);restore(s.before)}render();return}if(id==='redo-button'){if(future.length){let s=future.pop();history.push(s);restore(s.after)}render();return}let q=rect(),ids=cells(q);if(id==='copy-button'||id==='cut-button'){clipboard={mode:id==='copy-button'?'copy':'cut',q,items:ids.map(i=>({i,...clone(sheet[i])}))};render();return}let before=snapshot(),changed=false;if(id==='clear-button'){for(let i of ids)if(sheet[i].raw!==''){sheet[i].raw='';changed=true}}else if(id==='paste-button'){if(!clipboard)return;let cp=clipboard,dc=q.l-cp.q.l,dr=q.t-cp.q.t;if(cp.mode==='cut')for(let it of cp.items)sheet[it.i]={raw:'',fmt:'general'};for(let it of cp.items){let p=pos(it.i);p.c+=dc;p.r+=dr;if(inside(p))sheet[idx(p)]={raw:cp.mode==='copy'?rewrite(it.raw,'paste',null,0,dc,dr):it.raw,fmt:it.fmt}}active=anchor=ids[0];if(cp.mode==='cut')clipboard=null;changed=true}else{let axis=id.endsWith('row')?'r':'c',k=pos(active)[axis],insert=id.startsWith('insert'),old=clone(sheet);sheet=sheet.map((_,i)=>{let p=pos(i),v=p[axis];if(v<k)return clone(old[i]);if(insert&&v===k||!insert&&v===(axis==='r'?12:8))return {raw:'',fmt:'general'};p[axis]+=insert?-1:1;return clone(old[idx(p)])});for(let it of sheet)it.raw=rewrite(it.raw,insert?'insert':'delete',axis,k);changed=true}if(changed)record(before);render()}
select.onchange=()=>{if(editing)return;let before=snapshot(),changed=false;for(let i of cells(rect()))if(sheet[i].fmt!==select.value){sheet[i].fmt=select.value;changed=true}if(changed)record(before);render()};input.oninput=()=>{editing=true;render()};input.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus()}else if(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();let before=snapshot(),changed=commit(),p=pos(active);if(e.key==='Enter')p.r=Math.min(12,p.r+1);else p.c=Math.min(8,p.c+1);active=anchor=idx(p);if(changed)record(before);render()}};grid.onkeydown=e=>{let key=e.key,ctrl=e.ctrlKey&&['z','y'].includes(key.toLowerCase());if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Backspace','Enter'].includes(key)&&!ctrl)return;e.preventDefault();if(key==='Enter'){input.focus();return}if(editing)return;if(ctrl){action(key.toLowerCase()==='z'?'undo-button':'redo-button');return}if(key==='Delete'||key==='Backspace'){action('clear-button');return}let p=pos(active);if(key==='ArrowUp')p.r=Math.max(1,p.r-1);if(key==='ArrowDown')p.r=Math.min(12,p.r+1);if(key==='ArrowLeft')p.c=Math.max(1,p.c-1);if(key==='ArrowRight')p.c=Math.min(8,p.c+1);active=idx(p);if(!e.shiftKey)anchor=active;render()};render();
</script></body></html>
