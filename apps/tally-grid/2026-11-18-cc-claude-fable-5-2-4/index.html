<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background-color: #f4f1ea; }
body {
  margin: 0;
  background-color: #f4f1ea;
  color: #1c1917;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.4;
}
header {
  background-color: #1f2a37;
  color: #ffffff;
  padding: 12px 16px;
  border-bottom: 3px solid #c2410c;
}
header .inner, main { max-width: 1240px; margin: 0 auto; }
h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
main { padding: 12px 16px 24px; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  background-color: #ffffff; border: 1px solid #d6d3d1; border-radius: 8px;
  padding: 8px;
}
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sep { width: 1px; align-self: stretch; background-color: #d6d3d1; margin: 0 2px; }
button, select, input { font: inherit; }
.toolbar button, .toolbar select {
  min-height: 34px; padding: 4px 10px;
  background-color: #ffffff; color: #1c1917;
  border: 1px solid #a8a29e; border-radius: 6px;
  cursor: pointer;
}
.toolbar button:hover:enabled { background-color: #f5f5f4; }
.toolbar button:active:enabled { background-color: #e7e5e4; }
.toolbar button:disabled, .toolbar select:disabled {
  background-color: #f5f5f4; color: #a8a29e; border-color: #e7e5e4; cursor: default;
}
.toolbar label { color: #44403c; background-color: #ffffff; font-size: 13px; }
.toolbar button:focus, .toolbar select:focus, #fin:focus {
  outline: 3px solid #c2410c; outline-offset: 1px;
}
.fbar {
  display: flex; gap: 6px; align-items: stretch; margin-top: 10px;
}
.namebox {
  flex: 0 0 auto; min-width: 76px; padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  background-color: #ffffff; color: #1c1917;
  border: 1px solid #a8a29e; border-radius: 6px;
  font-weight: 600; font-variant-numeric: tabular-nums;
}
.fx {
  flex: 0 0 auto; display: flex; align-items: center; padding: 0 2px;
  color: #57534e; font-style: italic; font-family: Georgia, "Times New Roman", serif;
}
#fin {
  flex: 1 1 auto; min-width: 0; width: 100%; min-height: 36px; padding: 4px 10px;
  background-color: #ffffff; color: #1c1917;
  border: 1px solid #a8a29e; border-radius: 6px;
  font-family: Consolas, "Cascadia Mono", Menlo, monospace;
}

  margin-top: 10px; max-width: 100%; overflow-x: auto;
  background-color: #ffffff; border: 1px solid #a8a29e; border-radius: 8px;
}

  min-width: 812px; background-color: #ffffff;
  user-select: none; -webkit-user-select: none;
  font-variant-numeric: tabular-nums;
}
.grid:focus { outline: 3px solid #c2410c; outline-offset: -3px; }
.row { display: grid; grid-template-columns: 44px repeat(8, minmax(96px, 1fr)); }
.ch, .rh, .corner {
  background-color: #ece8e1; color: #44403c;
  border-right: 1px solid #c8c2ba; border-bottom: 1px solid #c8c2ba;
  height: 30px; line-height: 29px; text-align: center; font-size: 12px; font-weight: 600;
}
.rh, .corner { position: sticky; left: 0; z-index: 1; }
.ch.on, .rh.on { background-color: #fed7aa; color: #431407; }
.cell {
  min-width: 0; height: 30px; line-height: 29px; padding: 0 6px;
  background-color: #ffffff; color: #1c1917;
  border-right: 1px solid #e0dbd4; border-bottom: 1px solid #e0dbd4;
  overflow: hidden; white-space: pre; text-overflow: ellipsis;
  cursor: cell;
}
.row > :last-child { border-right-color: transparent; }
.row:last-child > * { border-bottom-color: transparent; }

.cell[data-kind="logical"] { text-align: center; }
.cell[data-kind="error"] { text-align: center; color: #9f1239; }
.cell[data-in-selection="true"] { background-color: #ffedd5; }

  background-color: #ffffff; box-shadow: inset 0 0 0 2px #78716c;
}
.grid:focus .cell[aria-selected="true"] { box-shadow: inset 0 0 0 2px #c2410c; background-color: #fffbf5; }
.status { min-height: 36px; margin-top: 10px; }
.summary {
  display: inline-block; max-width: 100%; padding: 7px 12px;
  background-color: #1f2a37; color: #ffffff; border-radius: 6px;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
@media (max-width: 520px) {
  main { padding: 10px 10px 20px; }
  .sep { display: none; }
  .toolbar button, .toolbar select { padding: 4px 8px; }
}
</style>
</head>
<body>
<header data-testid="app-header"><div class="inner"><h1>Claude Fable 5.2</h1></div></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <div class="group">
      <button type="button" data-testid="undo-button" id="b-undo">Undo</button>
      <button type="button" data-testid="redo-button" id="b-redo">Redo</button>
    </div>
    <span class="sep"></span>
    <div class="group">

      <button type="button" data-testid="cut-button" id="b-cut">Cut</button>
      <button type="button" data-testid="paste-button" id="b-paste">Paste</button>
      <button type="button" data-testid="clear-button" id="b-clear">Clear</button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button type="button" data-testid="insert-row" id="b-insrow">Insert row</button>
      <button type="button" data-testid="delete-row" id="b-delrow">Delete row</button>
      <button type="button" data-testid="insert-col" id="b-inscol">Insert column</button>
      <button type="button" data-testid="delete-col" id="b-delcol">Delete column</button>

    <span class="sep"></span>
    <div class="group">

        <option value="fixed2">1,234.50</option>

    </div>
  </div>
  <div class="fbar">
    <div class="namebox" data-testid="name-box" id="namebox">A1</div>
    <span class="fx" aria-hidden="true">fx</span>
    <input type="text" data-testid="formula-input" id="fin" aria-label="Cell content" data-editing="false" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="scroller">
    <div class="grid" data-testid="grid" id="grid" role="grid" aria-label="Sheet" tabindex="0"></div>
  </div>
  <div class="status"><div class="summary" data-testid="selection-summary" id="summary" hidden></div></div>
</main>

  function clearSel() {
    if (editing) return;
    var q = rect(), any = false, r, c;
    for (r = q.r0; r <= q.r1; r++) for (c = q.c0; c <= q.c1; c++) if (cells[r][c].raw !== '') any = true;
    if (!any) return;
    var before = snap();
    for (r = q.r0; r <= q.r1; r++) for (c = q.c0; c <= q.c1; c++) cells[r][c].raw = '';
    pushStep(before); render();
  }
  function undo() {
    if (editing || !undoStack.length) return;
    var s = undoStack.pop(); redoStack.push(s); restore(s.before); render();
  }
  function redo() {
    if (editing || !redoStack.length) return;
    var s = redoStack.pop(); undoStack.push(s); restore(s.after); render();
  }
  function takeBlock(mode) {
    if (editing) return;
    var q = rect(), rows = [];
    for (var r = q.r0; r <= q.r1; r++) {
      rows.push([]);
      for (var c = q.c0; c <= q.c1; c++) rows[r - q.r0].push({ raw: cells[r][c].raw, fmt: cells[r][c].fmt });
    }
    clip = { mode: mode, r0: q.r0, c0: q.c0, r1: q.r1, c1: q.c1, rows: rows };
    render();
  }
  function paste() {
    if (editing || !clip) return;
    var before = snap(), q = rect(), b = clip, r, c;
    var fix = null;
    if (b.mode === 'cut') {
      for (r = b.r0; r <= b.r1; r++) for (c = b.c0; c <= b.c1; c++) cells[r][c] = blank();
    } else fix = pasteRewriter(q.c0 - b.c0, q.r0 - b.r0);
    for (var j = 0; j < b.rows.length; j++) for (var i = 0; i < b.rows[j].length; i++) {
      r = q.r0 + j; c = q.c0 + i;
      if (r >= ROWS || c >= COLS) continue;
      var src = b.rows[j][i];
      cells[r][c] = { raw: fix ? fix(src.raw) : src.raw, fmt: src.fmt };
    }
    sel = { ar: q.r0, ac: q.c0, r: q.r0, c: q.c0 };
    if (b.mode === 'cut') clip = null;
    pushStep(before); render();
  }
  function structure(axis, kind) {
    if (editing) return;
    var before = snap(), r, c;
    if (axis === 'row') {
      var at = sel.r;
      if (kind === 'ins') { cells.splice(ROWS - 1, 1); cells.splice(at, 0, newRow()); }
      else { cells.splice(at, 1); cells.push(newRow()); }
    } else {
      var ac = sel.c;
      for (r = 0; r < ROWS; r++) {
        if (kind === 'ins') { cells[r].splice(COLS - 1, 1); cells[r].splice(ac, 0, blank()); }
        else { cells[r].splice(ac, 1); cells[r].push(blank()); }
      }
    }
    var fix = structRewriter(axis, kind, (axis === 'row' ? sel.r : sel.c) + 1);
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) cells[r][c].raw = fix(cells[r][c].raw);
    pushStep(before); render();
  }
  function newRow() { var a = []; for (var c = 0; c < COLS; c++) a.push(blank()); return a; }
  function setFormat() {
    if (editing) return;
    var f = fmtSel.value;
    if (f !== 'general' && f !== 'fixed2' && f !== 'percent1') { render(); return; }
    var q = rect(), any = false, r, c;
    for (r = q.r0; r <= q.r1; r++) for (c = q.c0; c <= q.c1; c++) if (cells[r][c].fmt !== f) any = true;
    if (!any) { render(); return; }
    var before = snap();
    for (r = q.r0; r <= q.r1; r++) for (c = q.c0; c <= q.c1; c++) cells[r][c].fmt = f;
    pushStep(before); render();
  }

  btn.undo.addEventListener('click', undo);
  btn.redo.addEventListener('click', redo);
  btn.copy.addEventListener('click', function () { takeBlock('copy'); });
  btn.cut.addEventListener('click', function () { takeBlock('cut'); });
  btn.paste.addEventListener('click', paste);
  btn.clear.addEventListener('click', clearSel);
  btn.insrow.addEventListener('click', function () { structure('row', 'ins'); });
  btn.delrow.addEventListener('click', function () { structure('row', 'del'); });
  btn.inscol.addEventListener('click', function () { structure('col', 'ins'); });
  btn.delcol.addEventListener('click', function () { structure('col', 'del'); });
  fmtSel.addEventListener('change', setFormat);

  render();
})();
</script>
</body>
</html>
