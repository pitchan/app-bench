function selected(){let r=rect(),ids=[];for(let y=r.t;y<=r.b;y++)for(let x=r.l;x<=r.r;x++)ids.push(y*8+x);return ids}
function buttons(){controls.forEach(c=>c.disabled=editing);if(!editing){$('undo-button').disabled=!history.length;$('redo-button').disabled=!future.length;$('paste-button').disabled=!clipboard}input.dataset.editing=String(editing)}
function render(){recalc();let ids=selected(),set=new Set(ids);cells.forEach((e,i)=>{let v=values[i];e.textContent=display(v,sheet[i].format);e.dataset.kind=v===null?'empty':isE(v)?'error':typeof v==='boolean'?'logical':typeof v==='number'?'number':'text';e.setAttribute('aria-selected',String(i===active));e.dataset.inSelection=String(set.has(i))});let r=rect();$('name-box').textContent=anchor===active?address(active):address(r.t*8+r.l)+':'+address(r.b*8+r.r);if(!editing){input.value=sheet[active].raw;format.value=sheet[active].format}let numbers=ids.map(i=>values[i]).filter(v=>typeof v==='number'),summary=$('selection-summary');summary.hidden=!numbers.length;if(numbers.length){let s=numbers.reduce((a,b)=>a+b,0);summary.textContent='Sum: '+general(num(s))+' | Average: '+general(num(s/numbers.length))+' | Count: '+numbers.length}buttons()}
const clone=x=>JSON.parse(JSON.stringify(x)),snapshot=()=>({sheet:clone(sheet),active,anchor});
function record(before){history.push({before,after:snapshot()});if(history.length>20)history.shift();future=[]}
function commit(){if(!editing)return false;let raw=canonical(input.value),changed=raw!==sheet[active].raw;sheet[active].raw=raw;editing=false;return changed}
function selectCell(i,shift){let before=snapshot(),changed=commit();active=i;if(!shift)anchor=i;if(changed)record(before);render();grid.focus({preventScroll:true})}
function move(dx,dy,shift=false){active=Math.min(11,Math.max(0,Math.floor(active/8)+dy))*8+Math.min(7,Math.max(0,active%8+dx));if(!shift)anchor=active}
function undo(){if(editing||!history.length)return;let step=history.pop();future.push(step);restore(step.before)}function redo(){if(editing||!future.length)return;let step=future.pop();history.push(step);restore(step.after)}function restore(s){sheet=clone(s.sheet);active=s.active;anchor=s.anchor;render()}
function action(fn,always=false){if(editing)return;let before=snapshot();fn();if(always||JSON.stringify(sheet)!==JSON.stringify(before.sheet))record(before);render()}
function clear(){action(()=>selected().forEach(i=>sheet[i].raw=''))}
function structure(mode,axis){action(()=>{let pos=axis==='row'?Math.floor(active/8):active%8,old=clone(sheet);for(let r=0;r<12;r++)for(let c=0;c<8;c++){let v=axis==='row'?r:c,source=mode==='insert'?(v===pos?-1:v>pos?v-1:v):(v>=pos?v+1:v),id=r*8+c;if(source<0||source>=(axis==='row'?12:8))sheet[id]={raw:'',format:'general'};else sheet[id]=clone(old[axis==='row'?source*8+c:r*8+source])}sheet.forEach(c=>c.raw=rewrite(c.raw,mode,axis,pos+1))},true)}
function copy(mode){if(editing)return;clipboard={mode,rect:rect(),items:selected().map(i=>({id:i,cell:clone(sheet[i])}))};buttons()}
function paste(){if(editing||!clipboard)return;action(()=>{let r=rect(),dest=r.t*8+r.l,block=clipboard;if(block.mode==='cut')block.items.forEach(x=>sheet[x.id]={raw:'',format:'general'});for(let item of block.items){let x=item.id%8-block.rect.l+r.l,y=Math.floor(item.id/8)-block.rect.t+r.t;if(x>7||y>11)continue;let c=clone(item.cell);if(block.mode==='copy')c.raw=rewrite(c.raw,'copy',null,null,r.l-block.rect.l,r.t-block.rect.t);sheet[y*8+x]=c}active=anchor=dest;if(block.mode==='cut')clipboard=null},true)}
input.addEventListener('input',()=>{editing=true;buttons()});input.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();editing=false;render();grid.focus({preventScroll:true})}else if(ev.key==='Enter'||(ev.key==='Tab'&&!ev.shiftKey)){ev.preventDefault();let before=snapshot(),changed=commit();move(ev.key==='Tab'?1:0,ev.key==='Enter'?1:0);if(changed)record(before);render()}});
grid.addEventListener('keydown',ev=>{let dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(ev.key in dirs){ev.preventDefault();move(...dirs[ev.key],ev.shiftKey);render();cells[active].scrollIntoView({block:'nearest',inline:'nearest'})}else if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();clear()}else if(ev.key==='Enter'){ev.preventDefault();input.focus()}else if(ev.ctrlKey&&['z','y'].includes(ev.key.toLowerCase())){ev.preventDefault();if(ev.key.toLowerCase()==='z')undo();else redo()}});
format.addEventListener('change',()=>{let f=format.value;action(()=>selected().forEach(i=>sheet[i].format=f))});
for(let [id,fn]of Object.entries({'undo-button':undo,'redo-button':redo,'copy-button':()=>copy('copy'),'cut-button':()=>copy('cut'),'paste-button':paste,'clear-button':clear,'insert-row':()=>structure('insert','row'),'delete-row':()=>structure('delete','row'),'insert-col':()=>structure('insert','col'),'delete-col':()=>structure('delete','col')}))$(id).addEventListener('click',fn);
render();
</script>
</body>
</html>
