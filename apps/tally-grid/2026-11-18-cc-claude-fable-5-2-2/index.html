<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f8; --panel:#ffffff; --ink:#1b2130; --muted:#465064; --line:#d3d9e4;
  --accent:#2a55d0; --sel:#dbe6ff; --head:#eaeef5; --headsel:#cfdcf8; --err:#ad241c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 24px}
header{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.mark{width:22px;height:22px;border-radius:5px;background:var(--accent);display:grid;
  grid-template-columns:1fr 1fr;gap:2px;padding:4px;flex:none}
.mark i{background:#fff;border-radius:1px}
.mark i:nth-child(4){background:#a9c0ff}
h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group + .group{padding-left:14px;border-left:1px solid var(--line)}
button,select{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid #b9c1cf;
  border-radius:7px;min-height:34px;padding:0 11px;cursor:pointer}
button:hover:not(:disabled){background:#eef2fb;border-color:#8e9ab0}
button:active:not(:disabled){background:#dfe6f6}
button:disabled,select:disabled{color:#737c8c;background:#f1f2f5;border-color:#dcdfe6;cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fmt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select{padding-right:6px}

.bar{display:flex;gap:8px;align-items:stretch;margin:10px 0}
#name-box{flex:none;min-width:78px;display:flex;align-items:center;justify-content:center;padding:0 10px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;font-weight:600;
  font-variant-numeric:tabular-nums}
.inwrap{flex:1;min-width:0;display:flex;align-items:center;background:var(--panel);
  border:1px solid #b9c1cf;border-radius:8px}
.inwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fx{flex:none;padding:0 4px 0 11px;color:var(--muted);font-style:italic;font-family:Georgia,"Times New Roman",serif}
#formula-input{flex:1;min-width:0;width:100%;height:38px;border:0;border-radius:8px;background:#fff;
  color:var(--ink);font:14px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:0 10px 0 6px;outline:0}
#formula-input:focus{background:#f4f7ff;outline:2px solid transparent}
#formula-input[data-editing="true"]{background:#fff9e5}

#grid{position:relative;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;scroll-padding-left:46px;user-select:none;-webkit-user-select:none;
  font-variant-numeric:tabular-nums}
#grid:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:46px repeat(8,minmax(112px,1fr));min-width:942px}
.row > div{height:32px;line-height:31px;padding:0 8px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);overflow:hidden;white-space:pre;text-overflow:ellipsis}
.row > div:last-child{border-right:0}
.row:last-child > div{border-bottom:0}
.corner,[role=columnheader],[role=rowheader]{background:var(--head);color:var(--muted);
  text-align:center;font-size:12px;font-weight:600}
.corner,[role=rowheader]{position:sticky;left:0;z-index:1;padding:0!important}
[role=columnheader].on,[role=rowheader].on{background:var(--headsel);color:#1c2a4a}
[role=gridcell]{background:#fff;color:var(--ink);cursor:cell}
[role=gridcell][data-kind=number]{text-align:right}
[role=gridcell][data-kind=logical],[role=gridcell][data-kind=error]{text-align:center}
[role=gridcell][data-kind=error]{color:var(--err)}
[role=gridcell][data-in-selection=true]{background:var(--sel)}
[role=gridcell][aria-selected=true]{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
#grid:focus [role=gridcell][aria-selected=true]{background:#f3f7ff}

.status{min-height:36px;margin-top:10px;display:flex;justify-content:flex-end}
#selection-summary{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;
  max-width:100%;overflow-wrap:anywhere}
@media (max-width:520px){
  .wrap{padding:0 10px 20px}
  .group + .group{padding-left:0;border-left:0}
  button{padding:0 9px}
}
</style>
</head>
<body>
<div class="wrap">
  <header data-testid="app-header"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>Claude Fable 5.2</h1></header>
  <main>
    <div class="toolbar" data-testid="toolbar">
      <div class="group">
        <button type="button" data-testid="undo-button" disabled>Undo</button>
        <button type="button" data-testid="redo-button" disabled>Redo</button>
      </div>
      <div class="group">
        <button type="button" data-testid="copy-button">Copy</button>
        <button type="button" data-testid="cut-button">Cut</button>
        <button type="button" data-testid="paste-button" disabled>Paste</button>
        <button type="button" data-testid="clear-button">Clear</button>
      </div>
      <div class="group">
        <button type="button" data-testid="insert-row">Insert row</button>
        <button type="button" data-testid="delete-row">Delete row</button>
        <button type="button" data-testid="insert-col">Insert column</button>
        <button type="button" data-testid="delete-col">Delete column</button>
      </div>
      <div class="group fmt">
        <label for="format-select">Number format</label>
        <select id="format-select" data-testid="format-select">
          <option value="general">General</option>
          <option value="fixed2">1,234.50</option>
          <option value="percent1">12.5%</option>
        </select>
      </div>
    </div>
    <div class="bar">
      <div id="name-box" data-testid="name-box">A1</div>
      <div class="inwrap">
        <span class="fx" aria-hidden="true">fx</span>
        <label class="sr" for="formula-input">Cell content</label>
        <input type="text" id="formula-input" data-testid="formula-input" data-editing="false"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
    <div id="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></div>
    <div class="status"><div id="selection-summary" data-testid="selection-summary" hidden></div></div>
  </main>
</div>
<script>
(function(){
'use strict';
/*ENGINE-START*/
const Engine=(function(){
  const LET='ABCDEFGH';
  function Err(c){this.err=c;}
  const ERRS=Object.create(null);
  const E=c=>ERRS[c]||(ERRS[c]=new Err(c));
  const isErr=v=>v instanceof Err;

  /* ---------- numbers ---------- */
  function N(x){
    if(!isFinite(x)) return x;
    const y=Number(x.toPrecision(12));
    return y===0?0:y;
  }
  function numRes(x){
    x=N(x);
    return (!isFinite(x)||Math.abs(x)>=1e15)?E('#NUM!'):x;
  }
  // |x| rounded to d decimals on its 12-digit decimal writing, as an integer count of 10^-d
  function roundQ(x,d){
    const s=Math.abs(x).toPrecision(12);
    const ei=s.indexOf('e');
    const m=ei<0?s:s.slice(0,ei);
    const ex=ei<0?0:parseInt(s.slice(ei+1),10);
    const dot=m.indexOf('.');
    const digits=dot<0?m:m.slice(0,dot)+m.slice(dot+1);
    const fl=dot<0?0:m.length-dot-1;
    const M=BigInt(digits);
    const drop=-d-(ex-fl);
    if(drop<=0) return M*10n**BigInt(-drop);
    const p=10n**BigInt(drop);
    let q=M/p;
    if((M%p)*2n>=p) q+=1n;
    return q;
  }
  function fixedParts(x,d){
    const q=roundQ(x,d);
    let s=q.toString(),ip=s,fp='';
    if(d>0){s=s.padStart(d+1,'0');ip=s.slice(0,-d);fp=s.slice(-d);}
    return {neg:x<0&&q!==0n,ip:ip,fp:fp};
  }
  function general(x){
    const r=fixedParts(x,6);
    const fp=r.fp.replace(/0+$/,'');
    return (r.neg?'-':'')+r.ip+(fp?'.'+fp:'');
  }
  function roundTo(x,d){
    const q=roundQ(x,d);
    let v;
    if(d>0){const s=q.toString().padStart(d+1,'0');v=Number(s.slice(0,-d)+'.'+s.slice(-d));}
    else v=Number(q*10n**BigInt(-d));
    return x<0?-v:v;
  }
  function formatNumber(x,fmt){
    if(fmt==='fixed2'){
      const r=fixedParts(x,2);
      return (r.neg?'-':'')+r.ip.replace(/\B(?=(\d{3})+$)/g,',')+'.'+r.fp;
    }
    if(fmt==='percent1'){
      const r=fixedParts(N(x*100),1);
      return (r.neg?'-':'')+r.ip+'.'+r.fp+'%';
    }
    return general(x);
  }
  function display(v,fmt){
    if(v===null) return '';
    if(typeof v==='number') return formatNumber(v,fmt);
    if(typeof v==='boolean') return v?'TRUE':'FALSE';
    if(isErr(v)) return v.err;
    return v;
  }
  function kindOf(v){
    if(v===null) return 'empty';
    if(typeof v==='number') return 'number';
    if(typeof v==='boolean') return 'logical';
    if(isErr(v)) return 'error';
    return 'text';
  }
  function numText(x){
    x=N(x);
    return (!isFinite(x)||Math.abs(x)>=1e15)?'#NUM!':general(x);
  }
  const RE_ENTRY=/^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
  function entryNum(t){
    if(!RE_ENTRY.test(t)) return null;
    const pc=t.charCodeAt(t.length-1)===37;
    let x=Number(pc?t.slice(0,-1):t);
    if(pc) x/=100;
    x=N(x);
    if(!isFinite(x)||Math.abs(x)>=1e15) return null;
    return x;
  }

  /* ---------- references ---------- */
  const colIdx=c=>(c.length===1&&c>='A'&&c<='H')?c.charCodeAt(0)-64:0;
  const rowIdx=r=>{if(r.length>2) return 0;const n=+r;return n>=1&&n<=12?n:0;};
  const inGrid=r=>colIdx(r.c)>0&&rowIdx(r.r)>0;
  const cmpStr=(a,b)=>a.length!==b.length?a.length-b.length:(a<b?-1:a>b?1:0);
  const refStr=r=>(r.ca?'$':'')+r.c+(r.ra?'$':'')+r.r;
  function normRange(a,b){
    let c1={a:a.ca,v:a.c},c2={a:b.ca,v:b.c},r1={a:a.ra,v:a.r},r2={a:b.ra,v:b.r},t;
    if(cmpStr(c1.v,c2.v)>0){t=c1;c1=c2;c2=t;}
    if(cmpStr(r1.v,r2.v)>0){t=r1;r1=r2;r2=t;}
    return {k:'range',a:{ca:c1.a,c:c1.v,ra:r1.a,r:r1.v},b:{ca:c2.a,c:c2.v,ra:r2.a,r:r2.v}};
  }

  /* ---------- tokens ---------- */
  const RE_NUM=/(?:\d+(?:\.\d+)?|\.\d+)/y;
  const RE_WORD=/[A-Za-z$][A-Za-z0-9$]*/y;
  const RE_REF=/^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/;
  const REFERR_T={k:'referr'};
  function tokenize(src){
    const t=[],n=src.length;
    let i=0;
    while(i<n){
      const ch=src[i];
      if(ch===' '){i++;continue;}
      if((ch>='0'&&ch<='9')||ch==='.'){
        RE_NUM.lastIndex=i;
        const m=RE_NUM.exec(src);
        if(!m) return null;
        t.push({k:'num',s:m[0]});i+=m[0].length;continue;
      }
      if((ch>='A'&&ch<='Z')||(ch>='a'&&ch<='z')||ch==='$'){
        RE_WORD.lastIndex=i;
        const w=RE_WORD.exec(src)[0];
        i+=w.length;
        if(/^(true|false)$/i.test(w)){t.push({k:'bool',s:w.toUpperCase()});continue;}
        const m=RE_REF.exec(w);
        if(m){
          t.push({k:'ref',ref:{ca:m[1]==='$',c:m[2].toUpperCase(),ra:m[3]==='$',r:m[4].replace(/^0+(?=\d)/,'')}});
          continue;
        }
        if(/^[A-Za-z0-9]+$/.test(w)){t.push({k:'name',s:w.toUpperCase()});continue;}
        return null;
      }
      if(ch==='"'){
        let j=i+1,v='',closed=false;
        while(j<n){
          if(src[j]==='"'){
            if(src[j+1]==='"'){v+='"';j+=2;continue;}
            closed=true;j++;break;
          }
          v+=src[j];j++;
        }
        if(!closed) return null;
        t.push({k:'str',s:src.slice(i,j),v:v});i=j;continue;
      }
      if(ch==='#'){
        if(src.substr(i,5).toUpperCase()==='#REF!'){t.push(REFERR_T);i+=5;continue;}
        return null;
      }
      const two=src.substr(i,2);
      if(two==='<>'||two==='<='||two==='>='){t.push({k:'op',s:two});i+=2;continue;}
      if('+-*/^&%=<>'.indexOf(ch)>=0){t.push({k:'op',s:ch});i++;continue;}
      if('(),:'.indexOf(ch)>=0){t.push({k:'p',s:ch});i++;continue;}
      return null;
    }
    // ranges
    const out=[];
    for(let j=0;j<t.length;j++){
      const a=t[j],c=t[j+1],b=t[j+2];
      if(a.k==='ref'&&c&&c.k==='p'&&c.s===':'&&b&&b.k==='ref'){out.push(normRange(a.ref,b.ref));j+=2;continue;}
      if(a.k==='p'&&a.s===':') return null;
      out.push(a);
    }
    return out;
  }
  function tokStr(t){
    switch(t.k){
      case 'ref': return refStr(t.ref);
      case 'range': return refStr(t.a)+':'+refStr(t.b);
      case 'referr': return '#REF!';
      default: return t.s;
    }
  }

  /* ---------- parser ---------- */
  const SYN={};
  const CMP={'=':1,'<>':1,'<':1,'<=':1,'>':1,'>=':1};
  function parseTokens(t){
    let p=0;
    const n=t.length;
    const isOp=s=>p<n&&t[p].k==='op'&&t[p].s===s;
    const isP=s=>p<n&&t[p].k==='p'&&t[p].s===s;
    function expr(){
      let l=concat();
      while(p<n&&t[p].k==='op'&&CMP[t[p].s]===1){const op=t[p++].s;l={t:'cmp',op:op,l:l,r:concat()};}
      return l;
    }
    function concat(){
      let l=sum();
      while(isOp('&')){p++;l={t:'cat',l:l,r:sum()};}
      return l;
    }
    function sum(){
      let l=product();
      while(isOp('+')||isOp('-')){const op=t[p++].s;l={t:'ar',op:op,l:l,r:product()};}
      return l;
    }
    function product(){
      let l=signed();
      while(isOp('*')||isOp('/')){const op=t[p++].s;l={t:'ar',op:op,l:l,r:signed()};}
      return l;
    }
    function signed(){
      if(isOp('-')||isOp('+')){const op=t[p++].s;return {t:'un',op:op,e:signed()};}
      return power();
    }
    function power(){
      const b=percent();
      if(isOp('^')){p++;return {t:'ar',op:'^',l:b,r:signed()};}
      return b;
    }
    function percent(){
      let e=primary();
      while(isOp('%')){p++;e={t:'pct',e:e};}
      return e;
    }
    function primary(){
      if(p>=n) throw SYN;
      const k=t[p++];
      switch(k.k){
        case 'num': return {t:'lit',v:numRes(Number(k.s))};
        case 'str': return {t:'lit',v:k.v};
        case 'bool': return {t:'lit',v:k.s==='TRUE'};
        case 'referr': return {t:'referr'};
        case 'ref': return {t:'ref',ref:k.ref};
        case 'range': return {t:'range',a:k.a,b:k.b};
        case 'name':
          if(isP('(')){
            p++;
            const args=[];
            if(isP(')')){p++;}
            else for(;;){
              args.push(expr());
              if(isP(',')){p++;continue;}
              if(isP(')')){p++;break;}
              throw SYN;
            }
            return {t:'call',name:k.s,args:args};
          }
          return {t:'name'};
        case 'p':
          if(k.s==='('){
            const e=expr();
            if(!isP(')')) throw SYN;
            p++;
            return {t:'paren',e:e};
          }
      }
      throw SYN;
    }
    const ast=expr();
    if(p!==n) throw SYN;
    return ast;
  }

  const cache=new Map();
  const BAD={ok:false};
  function parseFormula(s){
    let f=cache.get(s);
    if(f) return f;
    f=BAD;
    try{
      const tokens=tokenize(s.slice(1));
      if(tokens&&tokens.length){
        const ast=parseTokens(tokens);
        const precs=[];
        for(const k of tokens){
          if(k.k==='ref'){if(inGrid(k.ref)) precs.push((rowIdx(k.ref.r)-1)*8+colIdx(k.ref.c)-1);}
          else if(k.k==='range'&&inGrid(k.a)&&inGrid(k.b)){
            const c1=colIdx(k.a.c),c2=colIdx(k.b.c),r1=rowIdx(k.a.r),r2=rowIdx(k.b.r);
            for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) precs.push((r-1)*8+c-1);
          }
        }
        f={ok:true,tokens:tokens,ast:ast,precs:precs,canon:'='+tokens.map(tokStr).join('')};
      }
    }catch(e){f=BAD;}
    if(cache.size>4000) cache.clear();
    cache.set(s,f);
    return f;
  }
  // the raw content stored when s is committed
  function stored(s){
    if(s.charCodeAt(0)===61){const f=parseFormula(s);if(f.ok) return f.canon;}
    return s;
  }

  /* ---------- evaluation ---------- */
  let RAW=[],vals=[],st=null,circ=null;
  const toNum=v=>typeof v==='number'?v:typeof v==='boolean'?(v?1:0):v===null?0:E('#VALUE!');
  const toText=v=>typeof v==='string'?v:typeof v==='number'?general(v):typeof v==='boolean'?(v?'TRUE':'FALSE'):'';
  const toBool=v=>typeof v==='boolean'?v:typeof v==='number'?v!==0:v===null?false:E('#VALUE!');
  const rank=v=>typeof v==='number'?0:typeof v==='string'?1:2;
  function cmpSame(a,b){
    if(typeof a==='string'){a=a.toUpperCase();b=b.toUpperCase();}
    return a<b?-1:a>b?1:0;
  }
  function cmpVals(l,r){
    if(l===null) l=(r===null||typeof r==='number')?0:typeof r==='string'?'':false;
    if(r===null) r=typeof l==='number'?0:typeof l==='string'?'':false;
    const a=rank(l),b=rank(r);
    if(a!==b) return a<b?-1:1;
    return cmpSame(l,r);
  }
  function arith(op,a,b){
    switch(op){
      case '+': return numRes(a+b);
      case '-': return numRes(a-b);
      case '*': return numRes(a*b);
      case '/': return b===0?E('#DIV/0!'):numRes(a/b);
      default:
        if(a===0&&b===0) return E('#NUM!');
        if(a===0&&b<0) return E('#DIV/0!');
        if(a<0&&!Number.isInteger(b)) return E('#NUM!');
        return numRes(Math.pow(a,b));
    }
  }
  function ev(n){
    switch(n.t){
      case 'lit': return n.v;
      case 'referr': return E('#REF!');
      case 'ref': {
        const c=colIdx(n.ref.c),r=rowIdx(n.ref.r);
        return (c&&r)?cellValue((r-1)*8+c-1):E('#REF!');
      }
      case 'range': return E('#VALUE!');
      case 'name': return E('#NAME?');
      case 'paren': return ev(n.e);
      case 'un': {
        const v=ev(n.e);
        if(isErr(v)) return v;
        const x=toNum(v);
        if(isErr(x)) return x;
        return numRes(n.op==='-'?-x:x);
      }
      case 'pct': {
        const v=ev(n.e);
        if(isErr(v)) return v;
        const x=toNum(v);
        if(isErr(x)) return x;
        return numRes(x/100);
      }
      case 'ar': {
        const l=ev(n.l),r=ev(n.r);
        if(isErr(l)) return l;
        if(isErr(r)) return r;
        const a=toNum(l);
        if(isErr(a)) return a;
        const b=toNum(r);
        if(isErr(b)) return b;
        return arith(n.op,a,b);
      }
      case 'cat': {
        const l=ev(n.l),r=ev(n.r);
        if(isErr(l)) return l;
        if(isErr(r)) return r;
        return toText(l)+toText(r);
      }
      case 'cmp': {
        const l=ev(n.l),r=ev(n.r);
        if(isErr(l)) return l;
        if(isErr(r)) return r;
        const c=cmpVals(l,r);
        switch(n.op){
          case '=': return c===0;
          case '<>': return c!==0;
          case '<': return c<0;
          case '<=': return c<=0;
          case '>': return c>0;
          default: return c>=0;
        }
      }
      case 'call': return callFn(n);
    }
    return E('#VALUE!');
  }

  const INF=Infinity;
  const ARITY=Object.assign(Object.create(null),{
    SUM:[1,INF],AVERAGE:[1,INF],MIN:[1,INF],MAX:[1,INF],COUNT:[1,INF],COUNTA:[1,INF],
    ROUND:[2,2],ABS:[1,1],INT:[1,1],MOD:[2,2],IF:[3,3],AND:[1,INF],OR:[1,INF],NOT:[1,1],
    IFERROR:[2,2],ISERROR:[1,1],ISBLANK:[1,1],LEN:[1,1],UPPER:[1,1],LEFT:[2,2],RIGHT:[2,2],
    MID:[3,3],CONCAT:[1,INF],COUNTIF:[2,2],SUMIF:[3,3]
  });
  const isRangeArg=n=>n.t==='ref'||n.t==='range'||n.t==='referr';
  function rangeCells(n){
    if(n.t==='referr') return E('#REF!');
    const a=n.t==='ref'?n.ref:n.a,b=n.t==='ref'?n.ref:n.b;
    const c1=colIdx(a.c),r1=rowIdx(a.r),c2=colIdx(b.c),r2=rowIdx(b.r);
    if(!c1||!r1||!c2||!r2) return E('#REF!');
    const cells=[];
    const ra=Math.min(r1,r2),rb=Math.max(r1,r2),ca=Math.min(c1,c2),cb=Math.max(c1,c2);
    for(let r=ra;r<=rb;r++) for(let c=ca;c<=cb;c++) cells.push((r-1)*8+c-1);
    return {cells:cells,rows:rb-ra+1,cols:cb-ca+1};
  }
  const evNum=a=>{const v=ev(a);return isErr(v)?v:toNum(v);};
  const evInt=a=>{const x=evNum(a);return isErr(x)?x:Math.trunc(x);};
  const evText=a=>{const v=ev(a);return isErr(v)?v:toText(v);};

  function condAgg(a,isSum){
    if(!isRangeArg(a[0])) return E('#VALUE!');
    if(isSum&&!isRangeArg(a[2])) return E('#VALUE!');
    const rg=rangeCells(a[0]);
    if(isErr(rg)) return rg;
    let sg=null;
    if(isSum){
      sg=rangeCells(a[2]);
      if(isErr(sg)) return sg;
      if(sg.rows!==rg.rows||sg.cols!==rg.cols) return E('#VALUE!');
    }
    const c=ev(a[1]);
    if(isErr(c)) return c;
    let op='=',operand=c;
    if(c===null) operand='';
    else if(typeof c==='string'){
      const m=/^(>=|<=|<>|>|<|=)/.exec(c);
      if(m){
        op=m[1];
        const rest=c.slice(op.length);
        const x=entryNum(rest);
        operand=x!==null?x:/^true$/i.test(rest)?true:/^false$/i.test(rest)?false:rest;
      }
    }
    let acc=0;
    for(let k=0;k<rg.cells.length;k++){
      const i=rg.cells[k];
      const v=cellValue(i);
      if(isErr(v)) return v;
      if(v===null) continue;
      const same=typeof v===typeof operand;
      const cm=same?cmpSame(v,operand):0;
      let hit;
      switch(op){
        case '=': hit=same&&cm===0;break;
        case '<>': hit=!(same&&cm===0);break;
        case '<': hit=same&&cm<0;break;
        case '<=': hit=same&&cm<=0;break;
        case '>': hit=same&&cm>0;break;
        default: hit=same&&cm>=0;
      }
      if(!hit) continue;
      if(!isSum) acc++;
      else{
        const w=cellValue(sg.cells[k]);
        if(isErr(w)) return w;
        if(typeof w==='number') acc+=w;
      }
    }
    return numRes(acc);
  }

  function callFn(n){
    const name=n.name,a=n.args,ar=ARITY[name];
    if(!ar) return E('#NAME?');
    if(a.length<ar[0]||a.length>ar[1]) return E('#ARGS!');
    switch(name){
      case 'SUM': case 'AVERAGE': case 'MIN': case 'MAX': {
        const xs=[];
        for(const arg of a){
          if(isRangeArg(arg)){
            const rg=rangeCells(arg);
            if(isErr(rg)) return rg;
            for(const i of rg.cells){
              const v=cellValue(i);
              if(isErr(v)) return v;
              if(typeof v==='number') xs.push(v);
            }
          }else{
            const x=evNum(arg);
            if(isErr(x)) return x;
            xs.push(x);
          }
        }
        if(name==='MIN'||name==='MAX'){
          if(!xs.length) return 0;
          let m=xs[0];
          for(const x of xs) if(name==='MIN'?x<m:x>m) m=x;
          return numRes(m);
        }
        let s=0;
        for(const x of xs) s+=x;
        if(name==='SUM') return numRes(s);
        if(!xs.length) return E('#DIV/0!');
        return numRes(s/xs.length);
      }
      case 'COUNT': case 'COUNTA': {
        let c=0;

      }
      case 'ROUND': {
        const x=evNum(a[0]);
        if(isErr(x)) return x;
        const d=evInt(a[1]);
        if(isErr(d)) return d;
        if(d<-9||d>9) return E('#NUM!');
        return numRes(roundTo(x,d));
      }
      case 'ABS': {const x=evNum(a[0]);return isErr(x)?x:numRes(Math.abs(x));}
      case 'INT': {const x=evNum(a[0]);return isErr(x)?x:numRes(Math.floor(x));}
      case 'MOD': {
        const x=evNum(a[0]);
        if(isErr(x)) return x;
        const y=evNum(a[1]);
        if(isErr(y)) return y;
        if(y===0) return E('#DIV/0!');
        return numRes(x-y*Math.floor(x/y));
      }
      case 'IF': {
        const v=ev(a[0]);
        if(isErr(v)) return v;
        const c=toBool(v);
        if(isErr(c)) return c;
        return ev(c?a[1]:a[2]);
      }
      case 'AND': case 'OR': {
        let all=true,any=false;
        for(const arg of a){
          const v=ev(arg);
          if(isErr(v)) return v;
          const b=toBool(v);
          if(isErr(b)) return b;
          if(b) any=true; else all=false;
        }
        return name==='AND'?all:any;
      }
      case 'NOT': {
        const v=ev(a[0]);
        if(isErr(v)) return v;
        const b=toBool(v);
        return isErr(b)?b:!b;
      }
      case 'IFERROR': {const v=ev(a[0]);return isErr(v)?ev(a[1]):v;}
      case 'ISERROR': return isErr(ev(a[0]));
      case 'ISBLANK': {
        const arg=a[0];
        if(isRangeArg(arg)){
          const rg=rangeCells(arg);
          if(isErr(rg)) return rg;
          if(arg.t==='range') return E('#VALUE!');
          return RAW[rg.cells[0]]==='';
        }
        const v=ev(arg);
        return isErr(v)?v:false;
      }
      case 'LEN': {const t=evText(a[0]);return isErr(t)?t:t.length;}
      case 'UPPER': {const t=evText(a[0]);return isErr(t)?t:t.toUpperCase();}
      case 'LEFT': case 'RIGHT': {
        const t=evText(a[0]);
        if(isErr(t)) return t;
        const k=evInt(a[1]);
        if(isErr(k)) return k;
        if(k<0) return E('#VALUE!');
        if(k>=t.length) return t;
        return name==='LEFT'?t.slice(0,k):t.slice(t.length-k);
      }
      case 'MID': {
        const t=evText(a[0]);
        if(isErr(t)) return t;
        const s=evInt(a[1]);
        if(isErr(s)) return s;
        const k=evInt(a[2]);
        if(isErr(k)) return k;
        if(s<1||k<0) return E('#VALUE!');
        if(s>t.length) return '';
        return t.slice(s-1,Math.min(t.length,s-1+k));
      }
      case 'CONCAT': {
        let out='';
        for(const arg of a){
          if(isRangeArg(arg)){
            const rg=rangeCells(arg);
            if(isErr(rg)) return rg;
            for(const i of rg.cells){
              const v=cellValue(i);
              if(isErr(v)) return v;
              out+=toText(v);
            }
          }else{
            const t=evText(arg);
            if(isErr(t)) return t;
            out+=t;
          }
        }
        return out;
      }
      case 'COUNTIF': return condAgg(a,false);
      case 'SUMIF': return condAgg(a,true);
    }
    return E('#NAME?');
  }

  function compute(i){
    const s=RAW[i];
    if(s==='') return null;
    const c0=s.charCodeAt(0);
    if(c0===61){
      const f=parseFormula(s);
      if(!f.ok) return E('#SYNTAX!');
      if(circ[i]) return E('#CYCLE!');
      let v;
      try{v=ev(f.ast);}catch(e){v=E('#VALUE!');}
      return v===null?0:v;
    }
    if(c0===39) return s.slice(1);
    const t=s.replace(/^ +/,'').replace(/ +$/,'');
    const x=entryNum(t);
    if(x!==null) return x;
    if(/^true$/i.test(t)) return true;
    if(/^false$/i.test(t)) return false;
    return s;
  }
  function cellValue(i){
    if(st[i]===2) return vals[i];
    if(st[i]===1) return E('#CYCLE!');
    st[i]=1;
    const v=compute(i);
    vals[i]=v;st[i]=2;
    return v;
  }
  function recalc(raw){
    RAW=raw;
    const n=raw.length;
    vals=new Array(n);st=new Uint8Array(n);circ=new Uint8Array(n);
    const precs=new Array(n);
    for(let i=0;i<n;i++){
      precs[i]=null;
      if(raw[i].charCodeAt(0)===61){const f=parseFormula(raw[i]);if(f.ok&&f.precs.length) precs[i]=f.precs;}
    }
    for(let i=0;i<n;i++){
      if(!precs[i]) continue;
      const seen=new Uint8Array(n),stack=precs[i].slice();
      while(stack.length){
        const j=stack.pop();
        if(j===i){circ[i]=1;break;}
        if(seen[j]) continue;
        seen[j]=1;
        if(precs[j]) for(const k of precs[j]) stack.push(k);
      }
    }
    for(let i=0;i<n;i++) cellValue(i);
    return vals;
  }

  /* ---------- rewriting ---------- */
  function rewrite(s,fRef,fRange){
    if(s.charCodeAt(0)!==61) return s;
    const f=parseFormula(s);
    if(!f.ok) return s;
    return '='+f.tokens.map(t=>t.k==='ref'?fRef(t):t.k==='range'?fRange(t):t).map(tokStr).join('');
  }
  const getAx=(ref,ax)=>ax==='r'?rowIdx(ref.r):colIdx(ref.c);
  function setAx(ref,ax,n){
    const o={ca:ref.ca,c:ref.c,ra:ref.ra,r:ref.r};
    if(ax==='r') o.r=String(n); else o.c=LET[n-1];
    return o;
  }
  function rewriteInsert(s,ax,at){
    const max=ax==='r'?12:8;
    return rewrite(s,function(t){
      if(!inGrid(t.ref)) return t;
      const n=getAx(t.ref,ax);
      if(n<at) return t;
      if(n+1>max) return REFERR_T;
      return {k:'ref',ref:setAx(t.ref,ax,n+1)};
    },function(t){
      if(!inGrid(t.a)||!inGrid(t.b)) return t;
      let lo=getAx(t.a,ax),hi=getAx(t.b,ax);
      if(lo>=at) lo++;
      if(hi>=at) hi++;
      if(lo>max) return REFERR_T;
      if(hi>max) hi=max;
      return {k:'range',a:setAx(t.a,ax,lo),b:setAx(t.b,ax,hi)};
    });
  }
  function rewriteDelete(s,ax,at){
    return rewrite(s,function(t){
      if(!inGrid(t.ref)) return t;
      const n=getAx(t.ref,ax);
      if(n<at) return t;
      if(n===at) return REFERR_T;
      return {k:'ref',ref:setAx(t.ref,ax,n-1)};
    },function(t){
      if(!inGrid(t.a)||!inGrid(t.b)) return t;
      let lo=getAx(t.a,ax),hi=getAx(t.b,ax);
      if(at>hi) return t;
      if(at<lo){lo--;hi--;}
      else if(lo===hi) return REFERR_T;
      else hi--;
      return {k:'range',a:setAx(t.a,ax,lo),b:setAx(t.b,ax,hi)};
    });
  }
  function moved(ref,dc,dr){
    const c=colIdx(ref.c)+(ref.ca?0:dc),r=rowIdx(ref.r)+(ref.ra?0:dr);
    if(c<1||c>8||r<1||r>12) return null;
    return {ca:ref.ca,c:LET[c-1],ra:ref.ra,r:String(r)};
  }
  function rewritePaste(s,dc,dr){
    return rewrite(s,function(t){
      if(!inGrid(t.ref)) return t;
      const m=moved(t.ref,dc,dr);
      return m?{k:'ref',ref:m}:REFERR_T;
    },function(t){
      if(!inGrid(t.a)||!inGrid(t.b)) return t;
      const a=moved(t.a,dc,dr),b=moved(t.b,dc,dr);
      if(!a||!b) return REFERR_T;

    });
  }

  return {recalc:recalc,stored:stored,display:display,kindOf:kindOf,numText:numText,
    rewriteInsert:rewriteInsert,rewriteDelete:rewriteDelete,rewritePaste:rewritePaste};
})();
/*ENGINE-END*/
if(typeof document==='undefined'){globalThis.__Engine=Engine;return;}

/* ================= UI ================= */
const LET='ABCDEFGH',NC=8,NR=12,TOTAL=96;
const $=id=>document.querySelector('[data-testid="'+id+'"]');
const grid=$('grid'),input=$('formula-input'),nameBox=$('name-box'),fmtSel=$('format-select'),
  summary=$('selection-summary');
const B={undo:$('undo-button'),redo:$('redo-button'),copy:$('copy-button'),cut:$('cut-button'),
  paste:$('paste-button'),clear:$('clear-button'),insRow:$('insert-row'),delRow:$('delete-row'),
  insCol:$('insert-col'),delCol:$('delete-col')};
const addr=i=>LET[i%NC]+(Math.floor(i/NC)+1);
const rowOf=i=>Math.floor(i/NC),colOf=i=>i%NC;

let raw=new Array(TOTAL).fill(''),fmt=new Array(TOTAL).fill('general');
let anchor=0,active=0,editing=false,clip=null;
let vals=[];
const undoStack=[],redoStack=[];

/* ----- DOM ----- */
const cells=[],colHeads=[],rowHeads=[];
(function build(){
  const mk=(role,cls)=>{const d=document.createElement('div');d.setAttribute('role',role);if(cls)d.className=cls;return d;};
  const head=mk('row','row');
  head.appendChild(mk('presentation','corner'));
  for(let c=0;c<NC;c++){
    const h=mk('columnheader');
    h.setAttribute('data-testid','col-header-'+LET[c]);
    h.textContent=LET[c];
    head.appendChild(h);colHeads.push(h);
  }
  grid.appendChild(head);
  for(let r=0;r<NR;r++){
    const row=mk('row','row');
    const h=mk('rowheader');
    h.setAttribute('data-testid','row-header-'+(r+1));
    h.textContent=String(r+1);
    row.appendChild(h);rowHeads.push(h);
    for(let c=0;c<NC;c++){
      const i=r*NC+c,d=mk('gridcell');
      d.setAttribute('data-testid','cell-'+addr(i));
      d.setAttribute('data-kind','empty');
      d.setAttribute('aria-selected',i===0?'true':'false');
      d.setAttribute('data-in-selection',i===0?'true':'false');
      d.dataset.i=String(i);
      row.appendChild(d);cells.push(d);
    }
    grid.appendChild(row);
  }
})();

function setAttr(el,name,v){if(el.getAttribute(name)!==v) el.setAttribute(name,v);}
function selRect(){
  return {r1:Math.min(rowOf(anchor),rowOf(active)),r2:Math.max(rowOf(anchor),rowOf(active)),
    c1:Math.min(colOf(anchor),colOf(active)),c2:Math.max(colOf(anchor),colOf(active))};
}
function selCells(){
  const s=selRect(),out=[];
  for(let r=s.r1;r<=s.r2;r++) for(let c=s.c1;c<=s.c2;c++) out.push(r*NC+c);
  return out;
}

function render(){
  vals=Engine.recalc(raw);
  const s=selRect();
  let n=0,sum=0;
  for(let i=0;i<TOTAL;i++){
    const el=cells[i],v=vals[i];
    const text=Engine.display(v,fmt[i]);
    if(el.textContent!==text) el.textContent=text;
    setAttr(el,'data-kind',Engine.kindOf(v));
    const r=rowOf(i),c=colOf(i),inSel=r>=s.r1&&r<=s.r2&&c>=s.c1&&c<=s.c2;
    setAttr(el,'aria-selected',i===active?'true':'false');
    setAttr(el,'data-in-selection',inSel?'true':'false');
    if(inSel&&typeof v==='number'){n++;sum+=v;}
  }
  for(let c=0;c<NC;c++) colHeads[c].classList.toggle('on',c>=s.c1&&c<=s.c2);
  for(let r=0;r<NR;r++) rowHeads[r].classList.toggle('on',r>=s.r1&&r<=s.r2);
  const name=anchor===active?addr(active):addr(s.r1*NC+s.c1)+':'+addr(s.r2*NC+s.c2);
  if(nameBox.textContent!==name) nameBox.textContent=name;
  setAttr(input,'data-editing',editing?'true':'false');
  if(!editing){
    if(input.value!==raw[active]) input.value=raw[active];
    if(fmtSel.value!==fmt[active]) fmtSel.value=fmt[active];
  }
  B.undo.disabled=editing||!undoStack.length;
  B.redo.disabled=editing||!redoStack.length;
  B.paste.disabled=editing||!clip;
  B.copy.disabled=B.cut.disabled=B.clear.disabled=B.insRow.disabled=B.delRow.disabled=
    B.insCol.disabled=B.delCol.disabled=fmtSel.disabled=editing;
  if(n>0){
    const text='Sum: '+Engine.numText(sum)+' | Average: '+Engine.numText(sum/n)+' | Count: '+n;
    if(summary.textContent!==text) summary.textContent=text;
    summary.hidden=false;
  }else{
    summary.hidden=true;
    if(summary.textContent!=='') summary.textContent='';
  }
}

/* ----- history ----- */
const snap=()=>({raw:raw.slice(),fmt:fmt.slice(),anchor:anchor,active:active});
function restore(s){raw=s.raw.slice();fmt=s.fmt.slice();anchor=s.anchor;active=s.active;}
function record(before){
  undoStack.push({before:before,after:snap()});
  if(undoStack.length>20) undoStack.shift();
  redoStack.length=0;
}
function undo(){
  if(editing||!undoStack.length) return;
  const st=undoStack.pop();
  redoStack.push(st);
  restore(st.before);
  render();
}
function redo(){
  if(editing||!redoStack.length) return;
  const st=redoStack.pop();
  undoStack.push(st);
  restore(st.after);
  render();
}

/* ----- actions ----- */
// commits the formula bar to the active cell; true when the raw content changed
function commitEdit(){
  if(!editing) return false;
  editing=false;
  const s=Engine.stored(input.value);
  if(s===raw[active]) return false;
  raw[active]=s;
  return true;
}
function revealActive(vertical){
  const c=cells[active],hw=rowHeads[0].offsetWidth;
  const l=c.offsetLeft,r=l+c.offsetWidth;
  if(l-hw<grid.scrollLeft) grid.scrollLeft=l-hw;
  else if(r>grid.scrollLeft+grid.clientWidth) grid.scrollLeft=r-grid.clientWidth;
  if(vertical){
    const rc=c.getBoundingClientRect();
    if(rc.top<0) window.scrollBy(0,rc.top-8);
    else if(rc.bottom>window.innerHeight) window.scrollBy(0,rc.bottom-window.innerHeight+8);
  }
}
function clearSelection(){
  if(editing) return;
  const list=selCells();
  if(!list.some(i=>raw[i]!=='')) return;
  const b=snap();
  for(const i of list) raw[i]='';
  record(b);
  render();
}
function setFormat(f){
  if(editing) return;
  const list=selCells();
  if(list.some(i=>fmt[i]!==f)){
    const b=snap();
    for(const i of list) fmt[i]=f;
    record(b);
  }
  render();
}
function structure(kind,ax){
  if(editing) return;
  const b=snap();
  const at=ax==='r'?rowOf(active):colOf(active);
  const len=ax==='r'?NR:NC;
  const idx=(line,k)=>ax==='r'?line*NC+k:k*NC+line;
  const span=ax==='r'?NC:NR;
  if(kind==='ins'){
    for(let line=len-1;line>at;line--) for(let k=0;k<span;k++){
      raw[idx(line,k)]=raw[idx(line-1,k)];fmt[idx(line,k)]=fmt[idx(line-1,k)];
    }
    for(let k=0;k<span;k++){raw[idx(at,k)]='';fmt[idx(at,k)]='general';}
    for(let i=0;i<TOTAL;i++) raw[i]=Engine.rewriteInsert(raw[i],ax,at+1);
  }else{
    for(let line=at;line<len-1;line++) for(let k=0;k<span;k++){
      raw[idx(line,k)]=raw[idx(line+1,k)];fmt[idx(line,k)]=fmt[idx(line+1,k)];
    }
    for(let k=0;k<span;k++){raw[idx(len-1,k)]='';fmt[idx(len-1,k)]='general';}
    for(let i=0;i<TOTAL;i++) raw[i]=Engine.rewriteDelete(raw[i],ax,at+1);
  }
  record(b);
  render();
}
function take(mode){
  if(editing) return;
  const s=selRect(),R=[],F=[];
  for(let r=s.r1;r<=s.r2;r++){
    const rr=[],ff=[];
    for(let c=s.c1;c<=s.c2;c++){rr.push(raw[r*NC+c]);ff.push(fmt[r*NC+c]);}
    R.push(rr);F.push(ff);
  }
  clip={mode:mode,r0:s.r1,c0:s.c1,rows:R.length,cols:R[0].length,raw:R,fmt:F};
  render();
}
function paste(){
  if(editing||!clip) return;
  const b=snap(),s=selRect(),top=s.r1,left=s.c1,k=clip;
  if(k.mode==='cut'){
    for(let r=0;r<k.rows;r++) for(let c=0;c<k.cols;c++){
      const i=(k.r0+r)*NC+k.c0+c;
      raw[i]='';fmt[i]='general';
    }
  }
  for(let r=0;r<k.rows;r++) for(let c=0;c<k.cols;c++){
    const R=top+r,C=left+c;
    if(R>=NR||C>=NC) continue;
    let v=k.raw[r][c];
    if(k.mode==='copy') v=Engine.rewritePaste(v,left-k.c0,top-k.r0);
    raw[R*NC+C]=v;fmt[R*NC+C]=k.fmt[r][c];
  }
  if(k.mode==='cut') clip=null;
  anchor=active=top*NC+left;
  record(b);
  render();
}

/* ----- events ----- */
B.undo.addEventListener('click',undo);
B.redo.addEventListener('click',redo);
B.copy.addEventListener('click',()=>take('copy'));
B.cut.addEventListener('click',()=>take('cut'));
B.paste.addEventListener('click',paste);
B.clear.addEventListener('click',clearSelection);
B.insRow.addEventListener('click',()=>structure('ins','r'));
B.delRow.addEventListener('click',()=>structure('del','r'));
B.insCol.addEventListener('click',()=>structure('ins','c'));
B.delCol.addEventListener('click',()=>structure('del','c'));
fmtSel.addEventListener('change',()=>setFormat(fmtSel.value));

grid.addEventListener('click',function(e){
  const t=e.target instanceof Element?e.target.closest('[role="gridcell"]'):null;
  if(!t||!grid.contains(t)) return;
  const i=Number(t.dataset.i);
  const b=snap();
  const changed=commitEdit();
  if(e.shiftKey) active=i; else anchor=active=i;
  if(changed) record(b);
  grid.focus({preventScroll:true});
  render();
});

const ARROWS={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
grid.addEventListener('keydown',function(e){
  if(e.target!==grid) return;
  const k=e.key,ctrl=e.ctrlKey||e.metaKey,lower=k.length===1?k.toLowerCase():k;
  let act='';
  if(!ctrl&&!e.altKey){
    if(ARROWS[k]) act='arrow';
    else if(k==='Delete'||k==='Backspace') act='clear';
    else if(k==='Enter') act='enter';
  }else if(ctrl&&!e.altKey&&!e.shiftKey){
    if(lower==='z') act='undo';
    else if(lower==='y') act='redo';
  }
  if(!act) return;
  e.preventDefault();
  if(act==='enter'){input.focus();return;}
  if(editing) return;
  if(act==='arrow'){
    const d=ARROWS[k];
    const r=Math.min(NR-1,Math.max(0,rowOf(active)+d[0])),c=Math.min(NC-1,Math.max(0,colOf(active)+d[1]));
    active=r*NC+c;
    if(!e.shiftKey) anchor=active;
    render();
    revealActive(true);
  }else if(act==='clear') clearSelection();
  else if(act==='undo') undo();
  else redo();
});

input.addEventListener('input',function(){
  if(!editing){editing=true;render();}
});
input.addEventListener('keydown',function(e){
  const k=e.key;
  if(k==='Enter'||(k==='Tab'&&!e.shiftKey)){
    if(e.isComposing) return;
    e.preventDefault();
    const b=snap();
    const changed=commitEdit();
    if(k==='Enter'){if(rowOf(active)<NR-1) active+=NC;}
    else if(colOf(active)<NC-1) active+=1;
    anchor=active;
    if(changed) record(b);
    render();
    revealActive(false);
  }else if(k==='Escape'){
    e.preventDefault();
    editing=false;
    render();
    grid.focus({preventScroll:true});
  }
});

render();
})();
</script>
</body>
</html>
