<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:#f3f4f7;color:#1a1d24;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:100%;overflow-x:hidden}
header{padding:10px 16px;background:#1f2a44;color:#fff}
header h1{margin:0;font-size:18px;font-weight:600}
main{padding:10px 12px 16px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,select,input{font:inherit;color:#1a1d24}
button{background:#fff;border:1px solid #7c828d;border-radius:6px;padding:6px 10px;min-height:34px;cursor:pointer}
button:hover:not(:disabled){background:#e8eefc}
button:disabled,select:disabled{background:#e4e6ea;color:#5a606b;border-color:#b8bcc4;cursor:default}
select{background:#fff;border:1px solid #7c828d;border-radius:6px;padding:6px 8px;min-height:34px}
button:focus,select:focus,input:focus,.grid:focus{outline:3px solid #1d4ed8;outline-offset:2px}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.namebox{flex:0 0 auto;min-width:84px;padding:6px 8px;background:#fff;color:#1a1d24;border:1px solid #7c828d;border-radius:6px;text-align:center;font-weight:600}
#formula-input{flex:1 1 auto;min-width:0;padding:6px 8px;min-height:34px;background:#fff;border:1px solid #7c828d;border-radius:6px}
#formula-input[data-editing="true"]{border-color:#1d4ed8;box-shadow:0 0 0 2px #bfd2ff}
.grid{overflow-x:auto;overflow-y:hidden;background:#fff;border:1px solid #9aa0ab;border-radius:4px;max-width:100%;user-select:none;-webkit-user-select:none;margin:4px 0}
.sheet{min-width:830px}
.row{display:grid;grid-template-columns:46px repeat(8,minmax(98px,1fr))}
.hdr,.cell,.corner{height:32px;line-height:31px;padding:0 8px;border-right:1px solid #cdd1d8;border-bottom:1px solid #cdd1d8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hdr,.corner{background:#e6e9ef;color:#1f2430;text-align:center;font-weight:600;padding:0 2px}
.rowh{position:sticky;left:0;z-index:2}
.corner{position:sticky;left:0;z-index:2}
.cell{background:#fff;color:#1a1d24;cursor:cell}
.cell[data-kind="number"]{text-align:right}
.cell[data-kind="error"]{color:#9b1c1c;font-weight:600}
.cell[data-in-selection="true"]{background:#dbe7ff}
.cell[aria-selected="true"]{background:#fff;box-shadow:inset 0 0 0 2px #1d4ed8}
.grid:focus .cell[aria-selected="true"]{box-shadow:inset 0 0 0 3px #0b2a8f}
.summary{margin-top:8px;padding:6px 10px;background:#fff;color:#1a1d24;border:1px solid #9aa0ab;border-radius:6px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Sonnet 5.5</h1></header>
<main>
<div class="toolbar" data-testid="toolbar">
<button type="button" data-testid="undo-button" id="b-undo">Undo</button>
<button type="button" data-testid="redo-button" id="b-redo">Redo</button>
<button type="button" data-testid="copy-button" id="b-copy">Copy</button>
<button type="button" data-testid="cut-button" id="b-cut">Cut</button>
<button type="button" data-testid="paste-button" id="b-paste">Paste</button>
<button type="button" data-testid="clear-button" id="b-clear">Clear</button>
<button type="button" data-testid="insert-row" id="b-insrow">Insert row</button>
<button type="button" data-testid="delete-row" id="b-delrow">Delete row</button>
<button type="button" data-testid="insert-col" id="b-inscol">Insert column</button>
<button type="button" data-testid="delete-col" id="b-delcol">Delete column</button>
<select data-testid="format-select" id="fmt" aria-label="Number format">
<option value="general">General</option>
<option value="fixed2">1,234.50</option>
<option value="percent1">12.5%</option>
</select>
</div>
<div class="fbar">
<span class="namebox" data-testid="name-box" id="namebox">A1</span>
<input type="text" data-testid="formula-input" id="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
</div>
<div class="grid" id="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0">
<div class="sheet" id="sheet"></div>
</div>
<div class="summary" data-testid="selection-summary" id="summary" hidden></div>
</main>
<script>
"use strict";
// ENGINE-START
const NC = 8, NR = 12;
const ERR = c => ({ t: 'e', v: c });
const BLANK = { t: 'blank' };
const E_REF = ERR('#REF!'), E_VALUE = ERR('#VALUE!'), E_NAME = ERR('#NAME?'), E_NUM = ERR('#NUM!'),
  E_DIV = ERR('#DIV/0!'), E_ARGS = ERR('#ARGS!'), E_CYCLE = ERR('#CYCLE!'), E_SYNTAX = ERR('#SYNTAX!');

function norm(x) { const y = Number(x.toPrecision(12)); return y === 0 ? 0 : y; }
function num(x) {
  if (!isFinite(x)) return E_NUM;
  const y = norm(x);
  if (Math.abs(y) >= 1e15) return E_NUM;
  return { t: 'n', v: y };
}

// ---- decimal representation and rounding ----
function dparts(x) {
  const neg = x < 0;
  const s = Math.abs(x).toPrecision(12);
  let int, frac;
  if (s.indexOf('e') >= 0) {
    const [m, e] = s.split('e');
    const digits = m.replace('.', '');
    const pp = Number(e) + 1;
    if (pp <= 0) { int = '0'; frac = '0'.repeat(-pp) + digits; }
    else if (pp >= digits.length) { int = digits + '0'.repeat(pp - digits.length); frac = ''; }
    else { int = digits.slice(0, pp); frac = digits.slice(pp); }
  } else {
    const a = s.split('.'); int = a[0]; frac = a[1] || '';
  }
  return { neg, int, frac };
}
function roundK(x, d) {
  const { neg, int, frac } = dparts(x);
  const digits = int + frac, k = int.length + d;
  let K;
  if (k >= digits.length) K = BigInt(digits + '0'.repeat(k - digits.length));
  else if (k < 0) K = 0n;
  else { K = BigInt(digits.slice(0, k) || '0'); if (digits[k] >= '5') K += 1n; }
  return { neg, K };
}
function roundNum(x, d) {
  const { neg, K } = roundK(x, d);
  const y = Number(K.toString() + 'e' + (-d));
  return neg ? -y : y;
}
function fixedParts(x, d) {
  const { neg, K } = roundK(x, d);
  const s = K.toString().padStart(d + 1, '0');
  return { neg: neg && K !== 0n, int: s.slice(0, s.length - d), frac: d ? s.slice(s.length - d) : '' };
}
function genText(x) {
  const p = fixedParts(x, 6);
  const f = p.frac.replace(/0+$/, '');
  return (p.neg ? '-' : '') + p.int + (f ? '.' + f : '');
}
function numText(x, fmt) {
  if (fmt === 'fixed2') {
    const p = fixedParts(x, 2);
    return (p.neg ? '-' : '') + p.int.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p.frac;
  }
  if (fmt === 'percent1') {
    const p = fixedParts(Number((x * 100).toPrecision(12)), 1);
    return (p.neg ? '-' : '') + p.int + '.' + p.frac + '%';
  }
  return genText(x);
}
function valueText(v, fmt) {
  switch (v.t) {
    case 'blank': return '';
    case 's': return v.v;
    case 'b': return v.v ? 'TRUE' : 'FALSE';
    case 'e': return v.v;
    default: return numText(v.v, fmt);
  }
}
function kindOf(v) { return { blank: 'empty', n: 'number', s: 'text', b: 'logical', e: 'error' }[v.t]; }

const ENTRY = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
function entryNumber(s) {
  if (!ENTRY.test(s)) return null;
  const pct = s.endsWith('%');
  let x = parseFloat(pct ? s.slice(0, -1) : s);
  if (pct) x = x / 100;
  if (!isFinite(x)) return null;
  x = norm(x);
  if (Math.abs(x) >= 1e15) return null;
  return x;
}

// ---- references ----
function colName(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function mk(c, r, ca, ra) { return { c, r, ca, ra, cs: colName(c), rs: String(r) }; }
function inGrid(o) { return o.c >= 1 && o.c <= NC && o.r >= 1 && o.r <= NR; }
const REFERR = { type: 'referr' };

// ---- tokenizer ----
function tokenize(s) {
  const t = []; const n = s.length; let i = 0;
  const isD = ch => ch >= '0' && ch <= '9';
  while (i < n) {
    const ch = s[i];
    if (ch === ' ') { i++; continue; }
    if (isD(ch) || (ch === '.' && i + 1 < n && isD(s[i + 1]))) {
      let j = i;
      while (j < n && isD(s[j])) j++;
      if (s[j] === '.' && j + 1 < n && isD(s[j + 1])) { j++; while (j < n && isD(s[j])) j++; }
      t.push({ k: 'num', text: s.slice(i, j) }); i = j; continue;
    }
    if (ch === '"') {
      let j = i + 1, out = '';
      for (;;) {
        if (j >= n) throw new Error('syntax');
        if (s[j] === '"') { if (s[j + 1] === '"') { out += '"'; j += 2; continue; } break; }
        out += s[j++];
      }
      t.push({ k: 'str', text: s.slice(i, j + 1), val: out }); i = j + 1; continue;
    }
    if (/[A-Za-z$]/.test(ch)) {
      let j = i;
      while (j < n && /[A-Za-z0-9$]/.test(s[j])) j++;
      const w = s.slice(i, j); i = j;
      if (/^(true|false)$/i.test(w)) { t.push({ k: 'bool', val: w.toLowerCase() === 'true' }); continue; }
      const m = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);
      if (m) {
        let c = 0; const cs = m[2].toUpperCase();
        for (const x of cs) c = c * 26 + (x.charCodeAt(0) - 64);
        const rs = m[4].replace(/^0+(?=.)/, '');
        t.push({ k: 'ref', ref: { c, r: Number(rs), ca: m[1] === '$', ra: m[3] === '$', cs, rs } });
        continue;
      }
      if (/^[A-Za-z0-9]+$/.test(w)) { t.push({ k: 'name', name: w.toUpperCase() }); continue; }
      throw new Error('syntax');
    }
    if (ch === '#') {
      if (s.substr(i, 5).toUpperCase() === '#REF!') { t.push({ k: 'referr' }); i += 5; continue; }
      throw new Error('syntax');
    }
    const two = s.substr(i, 2);
    if (two === '<>' || two === '<=' || two === '>=') { t.push({ k: 'op', op: two }); i += 2; continue; }
    if ('+-*/^&%=<>'.indexOf(ch) >= 0) { t.push({ k: 'op', op: ch }); i++; continue; }
    if ('(),:'.indexOf(ch) >= 0) { t.push({ k: 'p', op: ch }); i++; continue; }
    throw new Error('syntax');
  }
  return t;
}

// ---- parser ----
function parseFormula(s) {
  try {
    const toks = tokenize(s);
    let p = 0;
    const bad = () => { throw new Error('syntax'); };
    const isOp = (x, set) => x && (x.k === 'op') && set.indexOf(x.op) >= 0;
    const isP = (x, c) => x && x.k === 'p' && x.op === c;
    function expression() { return comparison(); }
    function comparison() {
      let l = concat();
      while (isOp(toks[p], ['=', '<>', '<', '<=', '>', '>='])) { const op = toks[p++].op; l = { type: 'bin', op, l, r: concat() }; }
      return l;
    }
    function concat() {
      let l = sum();
      while (isOp(toks[p], ['&'])) { p++; l = { type: 'bin', op: '&', l, r: sum() }; }
      return l;
    }
    function sum() {
      let l = product();
      while (isOp(toks[p], ['+', '-'])) { const op = toks[p++].op; l = { type: 'bin', op, l, r: product() }; }
      return l;
    }
    function product() {
      let l = signed();
      while (isOp(toks[p], ['*', '/'])) { const op = toks[p++].op; l = { type: 'bin', op, l, r: signed() }; }
      return l;
    }
    function signed() {
      if (isOp(toks[p], ['-', '+'])) { const op = toks[p++].op; return { type: 'un', op, e: signed() }; }
      return power();
    }
    function power() {
      const l = percent();
      if (isOp(toks[p], ['^'])) { p++; return { type: 'bin', op: '^', l, r: signed() }; }
      return l;
    }
    function percent() {
      let e = primary();
      while (isOp(toks[p], ['%'])) { p++; e = { type: 'pct', e }; }
      return e;
    }
    function primary() {
      const t = toks[p];
      if (!t) bad();
      p++;
      switch (t.k) {
        case 'num': {
          const x = parseFloat(t.text);
          return { type: 'num', text: t.text, val: num(x) };
        }
        case 'str': return { type: 'str', text: t.text, val: t.val };
        case 'bool': return { type: 'bool', val: t.val };
        case 'referr': return { type: 'referr' };
        case 'ref': {
          if (isP(toks[p], ':')) {
            p++;
            const u = toks[p++];
            if (!u || u.k !== 'ref') bad();
            return { type: 'range', a: t.ref, b: u.ref };
          }
          return Object.assign({ type: 'ref' }, t.ref);
        }
        case 'name': {
          if (isP(toks[p], '(')) {
            p++;
            const args = [];
            if (isP(toks[p], ')')) { p++; return { type: 'call', name: t.name, args }; }
            args.push(expression());
            while (isP(toks[p], ',')) { p++; args.push(expression()); }
            if (!isP(toks[p], ')')) bad();
            p++;
            return { type: 'call', name: t.name, args };
          }
          return { type: 'name', name: t.name };
        }
        case 'p':
          if (t.op === '(') {
            const e = expression();
            if (!isP(toks[p], ')')) bad();
            p++;
            return { type: 'paren', e };
          }
          bad();
          break;
        default: bad();
      }
    }
    const ast = expression();
    if (p !== toks.length) bad();
    return ast;
  } catch (e) { return null; }
}

// ---- canonical writing ----
function normRange(a, b) {
  a = Object.assign({}, a); b = Object.assign({}, b);
  if (a.c > b.c) { [a.c, b.c] = [b.c, a.c]; [a.ca, b.ca] = [b.ca, a.ca]; [a.cs, b.cs] = [b.cs, a.cs]; }
  if (a.r > b.r) { [a.r, b.r] = [b.r, a.r]; [a.ra, b.ra] = [b.ra, a.ra]; [a.rs, b.rs] = [b.rs, a.rs]; }
  return [a, b];
}
function wref(o) { return (o.ca ? '$' : '') + o.cs + (o.ra ? '$' : '') + o.rs; }
function write(n) {
  switch (n.type) {
    case 'num': return n.text;
    case 'str': return n.text;
    case 'bool': return n.val ? 'TRUE' : 'FALSE';
    case 'referr': return '#REF!';
    case 'ref': return wref(n);
    case 'range': { const [a, b] = normRange(n.a, n.b); return wref(a) + ':' + wref(b); }
    case 'name': return n.name;
    case 'paren': return '(' + write(n.e) + ')';
    case 'un': return n.op + write(n.e);
    case 'pct': return write(n.e) + '%';
    case 'bin': return write(n.l) + n.op + write(n.r);
    case 'call': return n.name + '(' + n.args.map(write).join(',') + ')';
  }
  return '';
}
function canonical(s) { const a = parseFormula(s.slice(1)); return a ? '=' + write(a) : null; }

function mapRefs(n, fr, fg) {
  const m = x => mapRefs(x, fr, fg);
  switch (n.type) {
    case 'ref': return fr(n);
    case 'range': return fg(n);
    case 'paren': return { type: 'paren', e: m(n.e) };
    case 'un': return { type: 'un', op: n.op, e: m(n.e) };
    case 'pct': return { type: 'pct', e: m(n.e) };
    case 'bin': return { type: 'bin', op: n.op, l: m(n.l), r: m(n.r) };
    case 'call': return { type: 'call', name: n.name, args: n.args.map(m) };
  }
  return n;
}
function rewriteStruct(raw, mode, axis, p) {
  const ast = raw[0] === '=' ? parseFormula(raw.slice(1)) : null;
  if (!ast) return raw;
  const L = axis === 'r' ? NR : NC;
  const get = o => axis === 'r' ? o.r : o.c;
  const set = (o, n) => axis === 'r' ? mk(o.c, n, o.ca, o.ra) : mk(n, o.r, o.ca, o.ra);
  const fr = ref => {
    if (!inGrid(ref)) return ref;
    const n = get(ref);
    if (mode === 'ins') { const n2 = n >= p ? n + 1 : n; return n2 > L ? REFERR : Object.assign({ type: 'ref' }, set(ref, n2)); }
    if (n < p) return ref;
    if (n === p) return REFERR;
    return Object.assign({ type: 'ref' }, set(ref, n - 1));
  };
  const fg = rg => {
    const a = rg.a, b = rg.b;
    if (!inGrid(a) || !inGrid(b)) return rg;
    const t = get(a), e = get(b);
    if (mode === 'ins') {
      const t2 = t >= p ? t + 1 : t; let e2 = e >= p ? e + 1 : e;
      if (t2 > L) return REFERR;
      e2 = Math.min(e2, L);
      return { type: 'range', a: set(a, t2), b: set(b, e2) };
    }
    if (p > e) return rg;
    if (p < t) return { type: 'range', a: set(a, t - 1), b: set(b, e - 1) };
    if (t === e) return REFERR;
    return { type: 'range', a: a, b: set(b, e - 1) };
  };
  return '=' + write(mapRefs(ast, fr, fg));
}
function adjustPaste(raw, dc, dr) {
  const ast = raw[0] === '=' ? parseFormula(raw.slice(1)) : null;
  if (!ast) return raw;
  const mv = o => {
    const c = o.ca ? o.c : o.c + dc, r = o.ra ? o.r : o.r + dr;
    return (c >= 1 && c <= NC && r >= 1 && r <= NR) ? mk(c, r, o.ca, o.ra) : null;
  };
  const fr = ref => { const x = mv(ref); return x ? Object.assign({ type: 'ref' }, x) : REFERR; };
  const fg = rg => { const a = mv(rg.a), b = mv(rg.b); return (a && b) ? { type: 'range', a, b } : REFERR; };

function normalizeContent(s) {
  if (s !== '' && s[0] === '=') { const c = canonical(s); return c === null ? s : c; }
  return s;
}

// ---- content classification ----
function precedents(ast) {
  const set = new Set();
  const add = o => set.add((o.r - 1) * NC + (o.c - 1));
  (function walk(n) {
    switch (n.type) {
      case 'ref': if (inGrid(n)) add(n); break;
      case 'range': {
        if (inGrid(n.a) && inGrid(n.b)) {
          const [a, b] = normRange(n.a, n.b);
          for (let r = a.r; r <= b.r; r++) for (let c = a.c; c <= b.c; c++) set.add((r - 1) * NC + (c - 1));
        }
        break;
      }
      case 'paren': case 'un': case 'pct': walk(n.e); break;
      case 'bin': walk(n.l); walk(n.r); break;
      case 'call': n.args.forEach(walk); break;

const ccache = new Map();
function classify(raw) {
  let r = ccache.get(raw);
  if (r) return r;
  r = classifyRaw(raw);
  if (ccache.size > 5000) ccache.clear();
  ccache.set(raw, r);
  return r;
}
function classifyRaw(raw) {
  if (raw === '') return { empty: true, val: BLANK, prec: [] };
  if (raw[0] === '=') {
    const ast = parseFormula(raw.slice(1));
    if (!ast) return { val: E_SYNTAX, prec: [] };
    return { ast, val: null, prec: precedents(ast) };
  }
  if (raw[0] === "'") return { val: { t: 's', v: raw.slice(1) }, prec: [] };
  const t = raw.replace(/^ +| +$/g, '');
  const n = entryNumber(t);
  if (n !== null) return { val: { t: 'n', v: n }, prec: [] };
  if (/^(true|false)$/i.test(t)) return { val: { t: 'b', v: t.toLowerCase() === 'true' }, prec: [] };
  return { val: { t: 's', v: raw }, prec: [] };
}

// ---- evaluation ----
let infos = [], cvFn = null;
function toNum(v) {
  switch (v.t) {
    case 'n': return v;
    case 'b': return { t: 'n', v: v.v ? 1 : 0 };
    case 'blank': return { t: 'n', v: 0 };
    case 's': return E_VALUE;
    default: return v;
  }
}
function toText(v) {
  switch (v.t) {
    case 'n': return genText(v.v);
    case 'b': return v.v ? 'TRUE' : 'FALSE';
    case 'blank': return '';
    default: return v.v;
  }
}
function toLog(v) {
  switch (v.t) {
    case 'n': return { t: 'b', v: v.v !== 0 };
    case 'b': return v;
    case 'blank': return { t: 'b', v: false };
    case 's': return E_VALUE;
    default: return v;
  }
}
function compareVals(l, r) {
  if (l.t === 'blank') l = r.t === 'n' || r.t === 'blank' ? { t: 'n', v: 0 } : r.t === 's' ? { t: 's', v: '' } : { t: 'b', v: false };
  if (r.t === 'blank') r = l.t === 'n' ? { t: 'n', v: 0 } : l.t === 's' ? { t: 's', v: '' } : { t: 'b', v: false };
  const rank = { n: 0, s: 1, b: 2 };
  if (l.t !== r.t) return rank[l.t] < rank[r.t] ? -1 : 1;
  let a = l.v, b = r.v;
  if (l.t === 's') { a = a.toUpperCase(); b = b.toUpperCase(); }

btn.redo.addEventListener('click', doRedo);
btn.copy.addEventListener('click', () => { if (!editing) takeBlock('copy'); });
btn.cut.addEventListener('click', () => { if (!editing) takeBlock('cut'); });
btn.paste.addEventListener('click', () => { if (!editing) doPaste(); });
btn.clear.addEventListener('click', () => { if (!editing) doClear(); });
btn.insrow.addEventListener('click', () => { if (!editing) structural('ins', 'r'); });
btn.delrow.addEventListener('click', () => { if (!editing) structural('del', 'r'); });
btn.inscol.addEventListener('click', () => { if (!editing) structural('ins', 'c'); });
btn.delcol.addEventListener('click', () => { if (!editing) structural('del', 'c'); });
fmtEl.addEventListener('change', () => { if (!editing) doFormat(fmtEl.value); });

build();
render();
</script>
</body>
</html>
