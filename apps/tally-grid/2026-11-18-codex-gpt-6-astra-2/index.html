function restore(s){cells=clone(s.cells);active=s.active;anchor=s.anchor;render()}
function undo(){if(pointer>0)restore(history[--pointer].before)}function redo(){if(pointer<history.length)restore(history[pointer++].after)}
function render(){values=calculate(cells);let ids=new Set(selected());for(let i=0;i<96;i++){let e=cellEls[i],v=values[i];e.textContent=display(v,cells[i].format);e.dataset.kind=v===null?'empty':isErr(v)?'error':typeof v==='boolean'?'logical':typeof v==='string'?'text':'number';e.setAttribute('aria-selected',String(i===active));e.dataset.inSelection=String(ids.has(i))}let b=bounds();$('name-box').textContent=ids.size===1?address(active):address(b.t*8+b.l)+':'+address(b.b*8+b.r);if(!editing){input.value=cells[active].raw;format.value=cells[active].format}input.dataset.editing=String(editing);document.querySelectorAll('.toolbar button,.toolbar select').forEach(e=>e.disabled=editing);$('undo-button').disabled=editing||pointer===0;$('redo-button').disabled=editing||pointer===history.length;$('paste-button').disabled=editing||!clipboard;let numbers=[...ids].map(i=>values[i]).filter(v=>typeof v==='number'),summary=$('selection-summary');summary.hidden=!numbers.length;if(numbers.length){let sum=numbers.reduce((a,b)=>a+b,0);summary.textContent='Sum: '+display(num(sum))+' | Average: '+display(num(sum/numbers.length))+' | Count: '+numbers.length}}
function commit(){if(!editing)return false;let raw=canonical(input.value);editing=false;if(raw===cells[active].raw)return false;cells[active].raw=raw;return true}
function selectCell(i,shift){let before=snapshot(),changed=commit();active=i;if(!shift)anchor=i;if(changed)record(before);render();grid.focus({preventScroll:true})}
function move(dr,dc,shift){let r=Math.max(0,Math.min(11,Math.floor(active/8)+dr)),c=Math.max(0,Math.min(7,active%8+dc));active=r*8+c;if(!shift)anchor=active}
function clear(){let ids=selected();if(!ids.some(i=>cells[i].raw!==''))return;let before=snapshot();ids.forEach(i=>cells[i].raw='');record(before);render()}
function structure(axis,mode){let before=snapshot(),pos=axis==='r'?Math.floor(active/8):active%8,old=clone(cells);cells=Array.from({length:96},(_,i)=>{let r=Math.floor(i/8),c=i%8,k=axis==='r'?r:c,source=k;if(mode==='insert'){if(k===pos)return empty();if(k>pos)source--}else{if(k===(axis==='r'?11:7))return empty();if(k>=pos)source++}return clone(old[axis==='r'?source*8+c:r*8+source])});cells.forEach(c=>c.raw=rewrite(c.raw,mode,axis,pos+1));record(before);render()}
function copy(mode){let b=bounds();clipboard={mode,b,items:selected().map(i=>({i,cell:clone(cells[i])}))};render()}
function paste(){if(!clipboard)return;let before=snapshot(),b=bounds(),dc=b.l-clipboard.b.l,dr=b.t-clipboard.b.t;if(clipboard.mode==='cut')clipboard.items.forEach(x=>cells[x.i]=empty());for(let item of clipboard.items){let r=Math.floor(item.i/8)+dr,c=item.i%8+dc;if(r>11||c>7)continue;let data=clone(item.cell);if(clipboard.mode==='copy')data.raw=rewrite(data.raw,'paste',null,null,dc,dr);cells[r*8+c]=data}active=anchor=b.t*8+b.l;if(clipboard.mode==='cut')clipboard=null;record(before);render()}
let head=document.createElement('tr');head.setAttribute('role','row');let corner=document.createElement('th');corner.setAttribute('role','presentation');head.append(corner);for(let c=0;c<8;c++){let th=document.createElement('th'),letter=String.fromCharCode(65+c);th.setAttribute('role','columnheader');th.dataset.testid='col-header-'+letter;th.textContent=letter;head.append(th)}grid.querySelector('thead').append(head);
for(let r=0;r<12;r++){let tr=document.createElement('tr');tr.setAttribute('role','row');let th=document.createElement('th');th.setAttribute('role','rowheader');th.dataset.testid='row-header-'+(r+1);th.textContent=r+1;tr.append(th);for(let c=0;c<8;c++){let i=r*8+c,td=document.createElement('td');td.setAttribute('role','gridcell');td.dataset.testid='cell-'+address(i);td.addEventListener('click',e=>selectCell(i,e.shiftKey));tr.append(td);cellEls.push(td)}grid.querySelector('tbody').append(tr)}
input.addEventListener('input',()=>{editing=true;render()});
input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus({preventScroll:true})}else if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();let before=snapshot(),changed=commit();move(e.key==='Enter'?1:0,e.key==='Tab'?1:0,false);if(changed)record(before);render()}});
grid.addEventListener('keydown',e=>{let key=e.key.toLowerCase(),arrow={arrowup:[-1,0],arrowdown:[1,0],arrowleft:[0,-1],arrowright:[0,1]}[key],hist=e.ctrlKey&&(key==='z'||key==='y');if(!arrow&&!hist&&!['delete','backspace','enter'].includes(key))return;e.preventDefault();if(key==='enter'){input.focus();return}if(editing)return;if(arrow){move(...arrow,e.shiftKey);render()}else if(hist){key==='z'?undo():redo()}else clear()});
const actions={'undo-button':undo,'redo-button':redo,'copy-button':()=>copy('copy'),'cut-button':()=>copy('cut'),'paste-button':paste,'clear-button':clear,'insert-row':()=>structure('r','insert'),'delete-row':()=>structure('r','delete'),'insert-col':()=>structure('c','insert'),'delete-col':()=>structure('c','delete')};
for(let [id,fn]of Object.entries(actions))$(id).addEventListener('click',()=>{if(!editing&&!$(id).disabled)fn()});
format.addEventListener('change',()=>{if(editing)return;let f=format.value,ids=selected();if(ids.every(i=>cells[i].format===f))return;let before=snapshot();ids.forEach(i=>cells[i].format=f);record(before);render()});
render();
</script>
</body>
</html>
