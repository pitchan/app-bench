function precedents(ast,out){if(!ast)return; if(ast.k==='ref'){if(inside(ast.ref.r,ast.ref.c))out.add(addr(ast.ref.r,ast.ref.c))}if(ast.k==='range'){let cs=rangeCoords(ast);if(!isErr(cs))for(let [r,c]of cs)out.add(addr(r,c))}for(let k of ['a','b','x','e'])if(ast[k]&&typeof ast[k]==='object')precedents(ast[k],out);if(ast.args)for(let x of ast.args)precedents(x,out)}
function getCell(r,c,stack=new Set()){if(!inside(r,c))return E;let key=addr(r,c),o=sheet[r][c];if(!o.raw)return null;if(!o.raw.startsWith('=')){if(o.raw[0]==="'")return o.raw.slice(1);let n=entry(o.raw);if(n!==null)return n;if(/^ *true *$/i.test(o.raw))return true;if(/^ *false *$/i.test(o.raw))return false;return o.raw}let ast=astOf(o.raw);if(!ast)return E;if(isCircular(key))return E;let v=formulaValue(o.raw,key,stack);return v===null?0:v}
function isCircular(target){let seen=new Set(),path=new Set();function visit(k){if(path.has(k))return true;if(seen.has(k))return false;seen.add(k);path.add(k);let [r,c]=coord(k),raw=sheet[r][c].raw;if(raw.startsWith('=')){let p=new Set();precedents(astOf(raw),p);for(let x of p)if(x===target||visit(x)){path.delete(k);return true}}path.delete(k);return false}return visit(target)}
function valueKind(v,o){return o.raw===''?'empty':type(v)}function display(r,c){let o=sheet[r][c],v=getCell(r,c);if(v===null)return '';if(isErr(v))return '#SYNTAX!';if(typeof v==='number'){if(o.fmt==='fixed2')return plain(v,2,false,true);if(o.fmt==='percent1'){let x=norm(v*100);return x===E?'#NUM!':plain(x,1,false,false)+'%'}return plain(v,6,true,false)}return typeof v==='boolean'?v?'TRUE':'FALSE':v}
function setRaw(s){let o=sheet[active[0]][active[1]],raw=s;if(s.startsWith('=')){let ast=astOf(s);if(ast)raw='='+canon(ast)}o.raw=raw}
function makeGrid(){for(let c=0;c<C;c++){let h=document.createElement('th');h.setAttribute('role','columnheader');h.dataset.testid='col-header-'+cols[c];h.textContent=cols[c];head.appendChild(h)}for(let r=0;r<R;r++){let tr=document.createElement('tr');tr.setAttribute('role','row');let th=document.createElement('th');th.setAttribute('role','rowheader');th.className='rowhead';th.dataset.testid='row-header-'+(r+1);th.textContent=r+1;tr.appendChild(th);for(let c=0;c<C;c++){let td=document.createElement('td');td.setAttribute('role','gridcell');td.dataset.testid='cell-'+addr(r,c);td.addEventListener('click',e=>{if(editing)commitClick();select([r,c],e.shiftKey)});tr.appendChild(td)}tbody.appendChild(tr)}}
function bounds(){return [Math.min(anchor[0],active[0]),Math.min(anchor[1],active[1]),Math.max(anchor[0],active[0]),Math.max(anchor[1],active[1])]}function update(){let [r0,c0,r1,c1]=bounds();nameBox.textContent=r0===r1&&c0===c1?addr(...active):addr(r0,c0)+':'+addr(r1,c1);if(!editing){input.value=sheet[active[0]][active[1]].raw;format.value=sheet[active[0]][active[1]].fmt}for(let r=0;r<R;r++)for(let c=0;c<C;c++){let td=tbody.rows[r].cells[c+1],v=getCell(r,c);td.textContent=display(r,c);td.dataset.kind=valueKind(v,sheet[r][c]);td.setAttribute('aria-selected',r===active[0]&&c===active[1]?'true':'false');td.dataset.inSelection=r>=r0&&r<=r1&&c>=c0&&c<=c1?'true':'false';td.title=''}let nums=[];for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){let v=getCell(r,c);if(typeof v==='number')nums.push(v)}if(nums.length){let s=0;for(let n of nums)s+=n;let sn=norm(s),avg=norm(s/nums.length);summary.hidden=false;summary.textContent=`Sum: ${sn===E?'#NUM!':plain(sn,6,true)} | Average: ${avg===E?'#NUM!':plain(avg,6,true)} | Count: ${nums.length}`}else summary.hidden=true;btn.undo.disabled=!undo.length;btn.redo.disabled=!redo.length;btn.paste.disabled=!clip;for(let [k,b]of Object.entries(btn))if(!['undo','redo','paste'].includes(k))b.disabled=editing;format.disabled=editing;input.dataset.editing=editing?'true':'false'}
function select(pos,shift=false){if(editing)return;if(shift)active=pos;else anchor=active=pos;grid.focus();update()}function snapshot(){return {sheet:sheet.map(row=>row.map(o=>({...o}))),anchor:[...anchor],active:[...active]}}function restore(s){for(let r=0;r<R;r++)for(let c=0;c<C;c++)Object.assign(sheet[r][c],s.sheet[r][c]);anchor=[...s.anchor];active=[...s.active];editing=false;update()}function record(before){let after=snapshot();if(JSON.stringify(before)===JSON.stringify(after))return;undo.push({before,after});if(undo.length>20)undo.shift();redo=[]}
function startEdit(){editing=true;update()}function commit(move){let before=snapshot(),old=sheet[active[0]][active[1]].raw;if(editing)setRaw(input.value);editing=false;let changed=old!==sheet[active[0]][active[1]].raw;if(changed)record(before);if(move==='enter')active=[Math.min(R-1,active[0]+1),active[1]],anchor=[...active];if(move==='tab')active=[active[0],Math.min(C-1,active[1]+1)],anchor=[...active];update();input.focus()}function commitClick(){commit(null)}function clear(){let before=snapshot(),changed=false,[r0,c0,r1,c1]=bounds();for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(sheet[r][c].raw!==''){sheet[r][c].raw='';changed=true}if(changed)record(before);update()}
function formatRange(v){let before=snapshot(),changed=false,[r0,c0,r1,c1]=bounds();for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(sheet[r][c].fmt!==v){sheet[r][c].fmt=v;changed=true}if(changed)record(before);update()}
function rewrite(ast,kind,axis,index,dc=0,dr=0){if(!ast)return null;function ref(t,inRange){let q={...t};if(kind==='paste'){if(!q.ac)q.c+=dc;if(!q.ar)q.r+=dr}else if(kind==='insert'){let v=axis==='row'?q.r:q.c;if(v>=index){if(v+1>=(axis==='row'?R:C))return null;if(axis==='row')q.r++;else q.c++}}else {let v=axis==='row'?q.r:q.c;if(v===index)return null;if(v>index){if(axis==='row')q.r--;else q.c--}}return q}function walk(n){if(n.k==='ref'){let q=ref(n.ref,false);return q?{...n,ref:q}: {k:'errref'}}if(n.k==='range'){let a=ref(n.a,true),b=ref(n.b,true);if(kind==='insert'&&a&&b){if(axis==='row'){let lo=Math.min(a.r,b.r),hi=Math.max(a.r,b.r);if(lo>=R)return {k:'errref'};if(hi>=R){if(a.r>b.r)a.r=R-1;else b.r=R-1}}else{let lo=Math.min(a.c,b.c),hi=Math.max(a.c,b.c);if(lo>=C)return {k:'errref'};if(hi>=C){if(a.c>b.c)a.c=C-1;else b.c=C-1}}}if(!a||!b)return {k:'errref'};return {k:'range',a,b}}let x={...n};for(let k of ['a','b','x','e'])if(x[k]?.k)x[k]=walk(x[k]);if(x.args)x.args=x.args.map(walk);return x}return walk(ast)}
function rewriteAll(kind,axis,index){for(let r=0;r<R;r++)for(let c=0;c<C;c++){let o=sheet[r][c];if(o.raw.startsWith('=')){let a=astOf(o.raw);if(a){let b=rewrite(a,kind,axis,index);o.raw='='+canon(b)}}}}
function structural(what){let before=snapshot(),axis=what.endsWith('row')?'row':'col',idx=active[axis==='row'?0:1],ins=what.startsWith('insert');if(axis==='row'){if(ins){for(let r=R-1;r>idx;r--)for(let c=0;c<C;c++)sheet[r][c]={...sheet[r-1][c]};for(let c=0;c<C;c++)sheet[idx][c]=cell()}else{for(let r=idx;r<R-1;r++)for(let c=0;c<C;c++)sheet[r][c]={...sheet[r+1][c]};for(let c=0;c<C;c++)sheet[R-1][c]=cell()}}else{if(ins){for(let c=C-1;c>idx;c--)for(let r=0;r<R;r++)sheet[r][c]={...sheet[r][c-1]};for(let r=0;r<R;r++)sheet[r][idx]=cell()}else{for(let c=idx;c<C-1;c++)for(let r=0;r<R;r++)sheet[r][c]={...sheet[r][c+1]};for(let r=0;r<R;r++)sheet[r][C-1]=cell()}}rewriteAll(ins?'insert':'delete',axis,idx);record(before);update()}
function copy(cut){let [r0,c0,r1,c1]=bounds();clip={mode:cut?'cut':'copy',src:[r0,c0],height:r1-r0+1,width:c1-c0+1,block:[]};for(let r=r0;r<=r1;r++){let row=[];for(let c=c0;c<=c1;c++)row.push({...sheet[r][c]});clip.block.push(row)}update()}
function paste(){if(!clip)return;let before=snapshot(),[r0,c0]=bounds();if(clip.mode==='cut')for(let r=0;r<clip.height;r++)for(let c=0;c<clip.width;c++){let rr=clip.src[0]+r,cc=clip.src[1]+c;if(inside(rr,cc))sheet[rr][cc]=cell()}for(let r=0;r<clip.height;r++)for(let c=0;c<clip.width;c++){let rr=r0+r,cc=c0+c;if(!inside(rr,cc))continue;let x={...clip.block[r][c]};if(clip.mode==='copy'&&x.raw.startsWith('=')){let a=astOf(x.raw);if(a)x.raw='='+canon(rewrite(a,'paste','',0,cc-(clip.src[1]+c),rr-(clip.src[0]+r)))}sheet[rr][cc]=x}if(clip.mode==='cut')clip=null;anchor=active=[r0,c0];record(before);update()}
function history(back){let from=back?undo:redo,to=back?redo:undo;if(!from.length)return;let s=from.pop();restore(back?s.before:s.after);to.push(s)}
makeGrid();input.addEventListener('input',()=>{if(!editing)startEdit()});input.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();commit(e.key==='Enter'?'enter':'tab')}else if(e.key==='Escape'){e.preventDefault();editing=false;update();grid.focus()}});grid.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Backspace','Enter'].includes(e.key)||e.ctrlKey&&['z','y'].includes(e.key.toLowerCase()))e.preventDefault();if(editing){if(e.key==='Enter')input.focus();return}if(e.ctrlKey&&e.key.toLowerCase()==='z'){history(true);return}if(e.ctrlKey&&e.key.toLowerCase()==='y'){history(false);return}if(e.key==='Delete'||e.key==='Backspace'){clear();return}if(e.key==='Enter'){input.focus();return}let d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d){let p=[Math.max(0,Math.min(R-1,active[0]+d[0])),Math.max(0,Math.min(C-1,active[1]+d[1]))];if(e.shiftKey)active=p;else anchor=active=p;update()}});
format.addEventListener('input',()=>formatRange(format.value));format.addEventListener('change',()=>formatRange(format.value));btn.undo.onclick=()=>history(true);btn.redo.onclick=()=>history(false);btn.copy.onclick=()=>copy(false);btn.cut.onclick=()=>copy(true);btn.paste.onclick=paste;btn.clear.onclick=clear;btn.ir.onclick=()=>structural('insert-row');btn.dr.onclick=()=>structural('delete-row');btn.ic.onclick=()=>structural('insert-col');btn.dc.onclick=()=>structural('delete-col');update();
})();
