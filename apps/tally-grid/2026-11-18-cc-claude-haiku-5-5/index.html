<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; }
body { background: #f3f5f8; color: #111827; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #b45309; outline-offset: 2px; }

header { background: #1f2937; color: #ffffff; padding: 12px 16px; }
header h1 { margin: 0; font-size: 18px; font-weight: 600; }

main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.toolbar button, .toolbar select {
  font: inherit; padding: 6px 10px; background: #ffffff; color: #111827;
  border: 1px solid #8b96a5; border-radius: 4px; cursor: pointer;
}
.toolbar button:disabled, .toolbar select:disabled { background: #e5e7eb; color: #6b7280; border-color: #c4cad3; cursor: default; }
.toolbar .lbl { margin-left: 6px; }

.formula { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.name-box {
  min-width: 96px; padding: 6px 8px; background: #ffffff; color: #111827;
  border: 1px solid #8b96a5; border-radius: 4px; font-family: ui-monospace, Consolas, monospace;
}
.lbl { white-space: nowrap; color: #374151; }
#formula-input {
  flex: 1 1 180px; min-width: 0; padding: 6px 8px; font: inherit;
  background: #ffffff; color: #111827; border: 1px solid #8b96a5; border-radius: 4px;
}
#formula-input[data-editing="true"] { border-color: #1d4ed8; box-shadow: 0 0 0 2px #bfdbfe; }

.grid-wrap { max-width: 100%; max-height: 60vh; overflow: auto; background: #ffffff; border: 1px solid #8b96a5; border-radius: 4px; }
#grid { min-width: 816px; user-select: none; background: #ffffff; }
#grid:focus-visible { outline-offset: -3px; }
.row { display: grid; grid-template-columns: 48px repeat(8, minmax(96px, 1fr)); }
.corner, .head { background: #eef2f6; color: #334155; text-align: center; height: 30px; line-height: 30px; border-right: 1px solid #cbd3dd; border-bottom: 1px solid #cbd3dd; }
.cell {
  height: 30px; line-height: 30px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  background: #ffffff; color: #111827; border-right: 1px solid #e1e6ed; border-bottom: 1px solid #e1e6ed;
}
.cell[data-kind="number"] { text-align: right; }
.cell[data-kind="error"] { color: #b42318; }
.cell[data-in-selection="true"] { background: #eef5ff; }
.cell[aria-selected="true"] { background: #dbeafe; outline: 2px solid #1d4ed8; outline-offset: -2px; }

#selection-summary { padding: 8px 10px; background: #ffffff; color: #111827; border: 1px solid #8b96a5; border-radius: 4px; }
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Haiku 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" id="undo-button" data-testid="undo-button" disabled>Undo</button>
    <button type="button" id="redo-button" data-testid="redo-button" disabled>Redo</button>
    <button type="button" id="copy-button" data-testid="copy-button">Copy</button>
    <button type="button" id="cut-button" data-testid="cut-button">Cut</button>
    <button type="button" id="paste-button" data-testid="paste-button" disabled>Paste</button>
    <button type="button" id="clear-button" data-testid="clear-button">Clear</button>
    <button type="button" id="insert-row" data-testid="insert-row">Insert row</button>
    <button type="button" id="delete-row" data-testid="delete-row">Delete row</button>
    <button type="button" id="insert-col" data-testid="insert-col">Insert column</button>
    <button type="button" id="delete-col" data-testid="delete-col">Delete column</button>
    <label for="format-select" class="lbl">Number format</label>
    <select id="format-select" data-testid="format-select">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="formula">
    <div id="name-box" data-testid="name-box" class="name-box">A1</div>
    <label for="formula-input" class="lbl">Cell content</label>
    <input id="formula-input" data-testid="formula-input" type="text" autocomplete="off" spellcheck="false" data-editing="false">
  </div>
  <div class="grid-wrap">
    <div id="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></div>
  </div>
  <div id="selection-summary" data-testid="selection-summary" hidden></div>
</main>
<script>
// ===== Tally Grid engine, part 1: numbers, display, formula syntax (no DOM) =====
const NROWS = 12;
const NCOLS = 8;
const COL_LETTERS = 'ABCDEFGH';
const MAX_UNDO = 20;
const SYN = 'syntax';

const ERR = (v) => ({ t: 'e', v });
const BOOL = (v) => ({ t: 'b', v });
const BLANK = { t: 'blank' };
const EMPTY_CELL = { raw: '', fmt: 'general' };

function colLetters(c) {
  let s = '';
  for (let n = c + 1; n > 0; n = Math.floor((n - 1) / 26)) {
    s = String.fromCharCode(65 + ((n - 1) % 26)) + s;
  }
  return s;
}

function colIndex(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

const inside = (n) => n.c >= 0 && n.c < NCOLS && n.r >= 0 && n.r < NROWS;
const addr = (r, c) => COL_LETTERS[c] + (r + 1);

// ---- Numbers (02 section 2.4) ----
function norm(x) {
  const n = Number(x.toPrecision(12));
  return n === 0 ? 0 : n;
}

function numRes(x) {
  if (!Number.isFinite(x)) return ERR('#NUM!');
  const n = norm(x);
  return Math.abs(n) >= 1e15 ? ERR('#NUM!') : { t: 'n', v: n };
}

function plainDigits(x) {
  const s = x.toPrecision(12);
  const m = /^(\d)(?:\.(\d+))?e([+-]\d+)$/.exec(s);
  if (!m) return s;
  const digits = m[1] + (m[2] || '');
  const point = 1 + Number(m[3]);
  if (point <= 0) return '0.' + '0'.repeat(-point) + digits;
  if (point >= digits.length) return digits + '0'.repeat(point - digits.length);
  return digits.slice(0, point) + '.' + digits.slice(point);
}

// R(x, d) on the digits of D(x), ties away from zero; returns a plain string.
function roundDec(x, d) {
  const [ip, fp = ''] = plainDigits(Math.abs(x)).split('.');
  let out;
  if (d >= 0) {
    let keep = ip + fp.slice(0, d).padEnd(d, '0');
    if (fp.length > d && fp[d] >= '5') keep = (BigInt(keep) + 1n).toString();
    keep = keep.padStart(d + 1, '0');
    const cut = keep.length - d;
    out = d > 0 ? keep.slice(0, cut) + '.' + keep.slice(cut) : keep;
  } else {
    const k = -d;
    let head = ip.length > k ? ip.slice(0, ip.length - k) : '';
    const next = ip.length >= k ? ip[ip.length - k] : '0';
    if (next >= '5') head = (BigInt(head || '0') + 1n).toString();
    out = (head || '0') + '0'.repeat(k);
  }
  return x < 0 && /[1-9]/.test(out) ? '-' + out : out;
}

function groupThousands(s) {
  const neg = s[0] === '-';
  const [ip, fp] = (neg ? s.slice(1) : s).split('.');
  const g = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + g + (fp !== undefined ? '.' + fp : '');
}

// G(x): the general text of a normalized number.
function generalText(x) {
  let s = roundDec(x, 6);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}

function fixedText(x) {
  return groupThousands(roundDec(x, 2));
}

function percentText(x) {
  return roundDec(norm(x * 100), 1) + '%';
}

function displayText(v, fmt) {
  switch (v.t) {
    case 'n':
      return fmt === 'fixed2' ? fixedText(v.v) : fmt === 'percent1' ? percentText(v.v) : generalText(v.v);
    case 's':
    case 'e':
      return v.v;
    case 'b':
      return v.v ? 'TRUE' : 'FALSE';
    default:
      return '';
  }
}

// ---- Entered content (02 section 2.2) ----
const ENTRY_RE = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;

function entryNumber(s) {
  if (!ENTRY_RE.test(s)) return null;
  let x = Number(s.replace('%', ''));
  if (s.endsWith('%')) x = x / 100;
  const n = norm(x);
  return Math.abs(n) < 1e15 ? n : null;
}

const trimSp = (s) => s.replace(/^ +| +$/g, '');

function constValue(raw) {
  if (raw[0] === "'") return { t: 's', v: raw.slice(1) };
  const tr = trimSp(raw);
  const en = entryNumber(tr);
  if (en !== null) return { t: 'n', v: en };
  if (/^(TRUE|FALSE)$/i.test(tr)) return BOOL(tr.toUpperCase() === 'TRUE');
  return { t: 's', v: raw };
}

// ---- Tokens (02 section 2.6.1) ----
function tokenize(src) {
  const toks = [];
  let i = 0;
  while (i < src.length) {
    const rest = src.slice(i);
    const ch = rest[0];
    if (ch === ' ') {
      i++;
      continue;
    }
    let m;
    if ((m = /^(\d+(\.\d+)?|\.\d+)/.exec(rest))) {
      toks.push({ t: 'num', s: m[0] });
    } else if (ch === '"') {
      let j = 1;
      let end = -1;
      while (j < rest.length) {
        if (rest[j] === '"') {
          if (rest[j + 1] === '"') {
            j += 2;
            continue;
          }
          end = j;
          break;
        }
        j++;
      }
      if (end < 0) throw new Error(SYN);
      m = [rest.slice(0, end + 1)];
      toks.push({ t: 'str', s: m[0] });
    } else if ((m = /^[A-Za-z$][A-Za-z0-9$]*/.exec(rest))) {
      toks.push({ t: 'word', s: m[0] });
    } else if (/^#REF!/i.test(rest)) {
      m = [rest.slice(0, 5)];
      toks.push({ t: 'err', s: '#REF!' });
    } else if ((m = /^(<>|<=|>=|[-+*\/^&%=<>])/.exec(rest))) {
      toks.push({ t: 'op', s: m[0] });
    } else if ((m = /^[(),:]/.exec(rest))) {
      toks.push({ t: 'p', s: m[0] });
    } else {
      throw new Error(SYN);
    }
    i += m[0].length;
  }
  return toks;
}

// ---- Parser (02 section 2.6.2) ----
const REF_RE = /^\$?[A-Za-z]+\$?[0-9]+$/;
const CMP_OPS = ['=', '<>', '<', '<=', '>', '>='];

const isOp = (P, s) => {
  const k = P.toks[P.i];
  return !!k && k.t === 'op' && k.s === s;
};
const isP = (P, s) => {
  const k = P.toks[P.i];
  return !!k && k.t === 'p' && k.s === s;
};
function expectP(P, s) {
  if (!isP(P, s)) throw new Error(SYN);
  P.i++;
}

function makeRef(w) {
  const m = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w);
  return { k: 'ref', ca: m[1] === '$', c: colIndex(m[2].toUpperCase()), ra: m[3] === '$', r: parseInt(m[4], 10) - 1 };
}

function parseCmp(P) {
  let l = parseConcat(P);
  while (P.toks[P.i] && P.toks[P.i].t === 'op' && CMP_OPS.includes(P.toks[P.i].s)) {
    const op = P.toks[P.i++].s;
    l = { k: 'bin', op, l, r: parseConcat(P) };
  }
  return l;
}

function parseConcat(P) {
  let l = parseSum(P);
  while (isOp(P, '&')) {
    P.i++;
    l = { k: 'bin', op: '&', l, r: parseSum(P) };
  }
  return l;
}

function parseSum(P) {
  let l = parseProduct(P);
  while (isOp(P, '+') || isOp(P, '-')) {
    const op = P.toks[P.i++].s;
    l = { k: 'bin', op, l, r: parseProduct(P) };
  }
  return l;
}

function parseProduct(P) {
  let l = parseSigned(P);
  while (isOp(P, '*') || isOp(P, '/')) {
    const op = P.toks[P.i++].s;
    l = { k: 'bin', op, l, r: parseSigned(P) };
  }
  return l;
}

function parseSigned(P) {
  if (isOp(P, '-') || isOp(P, '+')) {
    const op = P.toks[P.i++].s;
    return { k: 'un', op, e: parseSigned(P) };
  }
  return parsePower(P);
}

function parsePower(P) {
  const b = parsePercent(P);
  if (isOp(P, '^')) {
    P.i++;
    return { k: 'bin', op: '^', l: b, r: parseSigned(P) };
  }
  return b;
}

function parsePercent(P) {
  let e = parsePrimary(P);
  while (isOp(P, '%')) {
    P.i++;
    e = { k: 'pct', e };
  }
  return e;
}

function parsePrimary(P) {
  const k = P.toks[P.i];
  if (!k) throw new Error(SYN);
  P.i++;
  switch (k.t) {
    case 'num':
      return { k: 'num', raw: k.s };
    case 'str':
      return { k: 'str', raw: k.s };
    case 'err':
      return { k: 'referr' };
    case 'word':
      return parseWord(P, k.s);
    case 'p':
      if (k.s === '(') {
        const e = parseCmp(P);
        expectP(P, ')');
        return { k: 'paren', e };
      }
  }
  throw new Error(SYN);
}

function parseWord(P, w) {
  const next = P.toks[P.i];
  const callNext = !!next && next.t === 'p' && next.s === '(';
  if (/^(TRUE|FALSE)$/i.test(w)) {
    if (callNext) throw new Error(SYN);
    return { k: 'bool', v: w.toUpperCase() === 'TRUE' };
  }
  if (REF_RE.test(w)) {
    if (callNext) throw new Error(SYN);
    const a = makeRef(w);
    if (isP(P, ':')) {
      P.i++;
      const w2 = P.toks[P.i];
      if (!w2 || w2.t !== 'word' || !REF_RE.test(w2.s)) throw new Error(SYN);
      P.i++;
      return { k: 'range', a, b: makeRef(w2.s) };
    }
    return a;
  }
  if (!/^[A-Za-z0-9]+$/.test(w)) throw new Error(SYN);
  if (callNext) {
    P.i++;
    const args = [];
    if (!isP(P, ')')) {
      args.push(parseCmp(P));
      while (isP(P, ',')) {
        P.i++;
        args.push(parseCmp(P));
      }
    }
    expectP(P, ')');
    return { k: 'call', n: w.toUpperCase(), args };
  }
  return { k: 'name', n: w.toUpperCase() };
}

function parseFormula(raw) {
  try {
    const toks = tokenize(raw.slice(1));
    if (toks.length === 0) return null;
    const P = { toks, i: 0 };
    const ast = parseCmp(P);
    return P.i === toks.length ? { ast } : null;
  } catch (e) {
    return null;
  }
}

// ---- Canonical form (02 section 2.6.4) ----
const colPart = (x) => (x.ca ? '$' : '') + colLetters(x.c);
const rowPart = (x) => (x.ra ? '$' : '') + (x.r + 1);

function rangeText(a, b) {
  const cols = a.c <= b.c ? [colPart(a), colPart(b)] : [colPart(b), colPart(a)];
  const rows = a.r <= b.r ? [rowPart(a), rowPart(b)] : [rowPart(b), rowPart(a)];
  return cols[0] + rows[0] + ':' + cols[1] + rows[1];
}

function genC(n) {
  switch (n.k) {
    case 'num':
    case 'str':
      return n.raw;
    case 'bool':
      return n.v ? 'TRUE' : 'FALSE';
    case 'referr':
      return '#REF!';
    case 'name':
      return n.n;
    case 'ref':
      return colPart(n) + rowPart(n);
    case 'range':
      return rangeText(n.a, n.b);
    case 'call':
      return n.n + '(' + n.args.map(genC).join(',') + ')';
    case 'paren':
      return '(' + genC(n.e) + ')';
    case 'un':
      return n.op + genC(n.e);
    case 'pct':
      return genC(n.e) + '%';
    case 'bin':
      return genC(n.l) + n.op + genC(n.r);
  }
  throw new Error('unknown node');
}

// Raw content of a string committed to a cell (02 section 2.2, rules 1 to 6).
function rawFromInput(s) {
  if (s === '') return '';
  if (s[0] === '=') {
    const p = parseFormula(s);
    return p ? '=' + genC(p.ast) : s;
  }
  return s;
}

// ===== Tally Grid engine, part 2: evaluation (02 sections 2.7 and 2.8) =====
let ENV = null; // { get(r, c) } while a sheet is evaluated

function toNum(v) {
  switch (v.t) {
    case 'n': return v;
    case 'b': return { t: 'n', v: v.v ? 1 : 0 };
    case 'blank': return { t: 'n', v: 0 };
    case 'e': return v;
    default: return ERR('#VALUE!');
  }
}

function toText(v) {
  switch (v.t) {
    case 'n': return { t: 's', v: generalText(v.v) };
    case 'b': return { t: 's', v: v.v ? 'TRUE' : 'FALSE' };
    case 'blank': return { t: 's', v: '' };
    default: return v;
  }
}

function toLogical(v) {
  switch (v.t) {
    case 'n': return BOOL(v.v !== 0);
    case 'b': return v;
    case 'blank': return BOOL(false);
    case 'e': return v;
    default: return ERR('#VALUE!');
  }
}

function toInt(v) {
  const x = toNum(v);
  return x.t === 'e' ? x : { t: 'n', v: Math.trunc(x.v) };
}

const RANK = { n: 0, s: 1, b: 2 };

function cmpVals(a, b) {
  if (a.t !== b.t) return RANK[a.t] - RANK[b.t];
  if (a.t === 'n') return a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
  if (a.t === 's') {
    const x = a.v.toUpperCase();
    const y = b.v.toUpperCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }
  return (a.v ? 1 : 0) - (b.v ? 1 : 0);
}

function unblank(v, other) {
  if (v.t !== 'blank') return v;
  if (other.t === 'n' || other.t === 'blank') return { t: 'n', v: 0 };
  if (other.t === 's') return { t: 's', v: '' };
  return BOOL(false);
}

function arith(op, x, y) {
  switch (op) {
    case '+': return numRes(x + y);
    case '-': return numRes(x - y);
    case '*': return numRes(x * y);
    case '/': return y === 0 ? ERR('#DIV/0!') : numRes(x / y);
    default:
      if (x === 0 && y === 0) return ERR('#NUM!');
      if (x === 0 && y < 0) return ERR('#DIV/0!');
      if (x < 0 && !Number.isInteger(y)) return ERR('#NUM!');
      return numRes(Math.pow(x, y));
  }
}

function evBin(n) {
  const l = ev(n.l);
  if (l.t === 'e') return l;
  const r = ev(n.r);
  if (r.t === 'e') return r;
  if (n.op === '&') {
    const a = toText(l);
    const b = toText(r);
    return { t: 's', v: a.v + b.v };
  }
  if (n.op === '+' || n.op === '-' || n.op === '*' || n.op === '/' || n.op === '^') {
    const a = toNum(l);
    if (a.t === 'e') return a;
    const b = toNum(r);
    if (b.t === 'e') return b;
    return arith(n.op, a.v, b.v);
  }
  const l2 = unblank(l, r);
  const c = cmpVals(l2, unblank(r, l2));
  switch (n.op) {
    case '=': return BOOL(c === 0);
    case '<>': return BOOL(c !== 0);
    case '<': return BOOL(c < 0);
    case '<=': return BOOL(c <= 0);
    case '>': return BOOL(c > 0);
    default: return BOOL(c >= 0);
  }
}

function ev(n) {
  switch (n.k) {
    case 'num': return numRes(Number(n.raw));
    case 'str': return { t: 's', v: n.raw.slice(1, -1).replace(/""/g, '"') };
    case 'bool': return BOOL(n.v);
    case 'referr': return ERR('#REF!');
    case 'name': return ERR('#NAME?');
    case 'ref': return inside(n) ? ENV.get(n.r, n.c) : ERR('#REF!');
    case 'range': return ERR('#VALUE!');
    case 'paren': return ev(n.e);
    case 'un': {
      const x = toNum(ev(n.e));
      if (x.t === 'e') return x;
      return numRes(n.op === '-' ? -x.v : x.v);
    }
    case 'pct': {
      const x = toNum(ev(n.e));
      return x.t === 'e' ? x : numRes(x.v / 100);
    }
    case 'bin': return evBin(n);
    case 'call': return evCall(n);
  }
  return ERR('#SYNTAX!');
}

// ---- Range arguments (02 section 2.8.1) ----
const isRangeArg = (a) => a.k === 'ref' || a.k === 'range' || a.k === 'referr';

// Visiting-order list of {r, c}, or an error value.
function rangeCells(a) {
  if (a.k === 'referr') return ERR('#REF!');
  if (a.k === 'ref') return inside(a) ? [{ r: a.r, c: a.c }] : ERR('#REF!');
  if (!inside(a.a) || !inside(a.b)) return ERR('#REF!');
  const out = [];
  for (let r = Math.min(a.a.r, a.b.r); r <= Math.max(a.a.r, a.b.r); r++) {
    for (let c = Math.min(a.a.c, a.b.c); c <= Math.max(a.a.c, a.b.c); c++) out.push({ r, c });
  }
  return out;
}

function rangeDims(n) {
  if (n.k === 'ref') return [1, 1];
  return [Math.abs(n.a.r - n.b.r) + 1, Math.abs(n.a.c - n.b.c) + 1];
}

// SUM-like contributions: numbers from ranges, converted values otherwise.
function contributions(args) {
  const out = [];
  for (const a of args) {
    if (isRangeArg(a)) {
      const cells = rangeCells(a);
      if (!Array.isArray(cells)) return cells;
      for (const p of cells) {
        const v = ENV.get(p.r, p.c);
        if (v.t === 'e') return v;
        if (v.t === 'n') out.push(v.v);
      }
    } else {
      const v = ev(a);
      if (v.t === 'e') return v;
      const x = toNum(v);
      if (x.t === 'e') return x;
      out.push(x.v);
    }
  }
  return out;
}

function sumFn(args) {
  const xs = contributions(args);
  if (!Array.isArray(xs)) return xs;
  return numRes(xs.reduce((s, x) => s + x, 0));
}

function averageFn(args) {
  const xs = contributions(args);
  if (!Array.isArray(xs)) return xs;
  if (xs.length === 0) return ERR('#DIV/0!');
  return numRes(xs.reduce((s, x) => s + x, 0) / xs.length);
}

function extremeFn(args, pick) {
  const xs = contributions(args);
  if (!Array.isArray(xs)) return xs;
  return xs.length === 0 ? { t: 'n', v: 0 } : numRes(pick(...xs));
}

function countFn(args, nonEmpty) {
  let count = 0;
  for (const a of args) {
    if (isRangeArg(a)) {
      const cells = rangeCells(a);
      if (!Array.isArray(cells)) return cells;
      for (const p of cells) {
        const v = ENV.get(p.r, p.c);
        if (v.t === 'e') return v;
        if (nonEmpty ? v.t !== 'blank' : v.t === 'n') count++;
      }
    } else {
      const v = ev(a);
      if (v.t === 'e') return v;
      if (nonEmpty || v.t === 'n') count++;
    }
  }
  return { t: 'n', v: count };
}

function unaryNum(node, f) {
  const x = toNum(ev(node));
  return x.t === 'e' ? x : numRes(f(x.v));
}

function roundFn([a0, a1]) {
  const x = toNum(ev(a0));
  if (x.t === 'e') return x;
  const d = toInt(ev(a1));
  if (d.t === 'e') return d;
  if (d.v < -9 || d.v > 9) return ERR('#NUM!');
  return numRes(Number(roundDec(x.v, d.v)));
}

function modFn([a0, a1]) {
  const x = toNum(ev(a0));
  if (x.t === 'e') return x;
  const y = toNum(ev(a1));
  if (y.t === 'e') return y;
  if (y.v === 0) return ERR('#DIV/0!');
  return numRes(x.v - y.v * Math.floor(x.v / y.v));
}

function ifFn([c, a, b]) {
  const cond = toLogical(ev(c));
  if (cond.t === 'e') return cond;
  return ev(cond.v ? a : b);
}

function logicFn(args, isAnd) {
  let all = true;
  let any = false;
  for (const a of args) {
    const l = toLogical(ev(a));
    if (l.t === 'e') return l;
    if (l.v) any = true;
    else all = false;
  }
  return BOOL(isAnd ? all : any);
}

function notFn([a]) {
  const l = toLogical(ev(a));
  return l.t === 'e' ? l : BOOL(!l.v);
}

function iferrorFn([x, y]) {
  const v = ev(x);
  return v.t === 'e' ? ev(y) : v;
}

function isblankFn([x]) {
  if (isRangeArg(x)) {
    if (x.k === 'referr') return ERR('#REF!');
    if (x.k === 'ref') {
      if (!inside(x)) return ERR('#REF!');
      return BOOL(ENV.get(x.r, x.c).t === 'blank');
    }
    if (!inside(x.a) || !inside(x.b)) return ERR('#REF!');
    return ERR('#VALUE!');
  }
  const v = ev(x);
  return v.t === 'e' ? v : BOOL(false);
}

function lenFn([a]) {
  const t = toText(ev(a));
  return t.t === 'e' ? t : { t: 'n', v: t.v.length };
}

function upperFn([a]) {
  const t = toText(ev(a));
  return t.t === 'e' ? t : { t: 's', v: t.v.toUpperCase() };
}

function leftFn([a, b]) {
  const t = toText(ev(a));
  if (t.t === 'e') return t;
  const k = toInt(ev(b));
  if (k.t === 'e') return k;
  return k.v < 0 ? ERR('#VALUE!') : { t: 's', v: t.v.slice(0, k.v) };
}

function rightFn([a, b]) {
  const t = toText(ev(a));
  if (t.t === 'e') return t;
  const k = toInt(ev(b));
  if (k.t === 'e') return k;
  return k.v < 0 ? ERR('#VALUE!') : { t: 's', v: t.v.slice(Math.max(0, t.v.length - k.v)) };
}

function midFn([a, b, c]) {
  const t = toText(ev(a));
  if (t.t === 'e') return t;
  const s = toInt(ev(b));
  if (s.t === 'e') return s;
  const n = toInt(ev(c));
  if (n.t === 'e') return n;
  if (s.v < 1 || n.v < 0) return ERR('#VALUE!');
  return { t: 's', v: t.v.substr(s.v - 1, n.v) };
}

function concatFn(args) {
  let out = '';
  for (const a of args) {
    if (isRangeArg(a)) {
      const cells = rangeCells(a);
      if (!Array.isArray(cells)) return cells;
      for (const p of cells) {
        const t = toText(ENV.get(p.r, p.c));
        if (t.t === 'e') return t;
        out += t.v;
      }
    } else {
      const t = toText(ev(a));
      if (t.t === 'e') return t;
      out += t.v;
    }
  }
  return { t: 's', v: out };
}

// Criterion to operator and operand (02 section 2.8.3, SUMIF/COUNTIF step 5).
function criterionOf(v) {
  if (v.t === 'n' || v.t === 'b') return { op: '=', operand: v };
  if (v.t === 'blank') return { op: '=', operand: { t: 's', v: '' } };
  const s = v.v;
  for (const op of ['>=', '<=', '<>', '>', '<', '=']) {
    if (s.startsWith(op)) {
      const rest = s.slice(op.length);
      const en = entryNumber(rest);
      if (en !== null) return { op, operand: { t: 'n', v: en } };
      if (/^(TRUE|FALSE)$/i.test(rest)) return { op, operand: BOOL(rest.toUpperCase() === 'TRUE') };
      return { op, operand: { t: 's', v: rest } };
    }
  }
  return { op: '=', operand: { t: 's', v: s } };
}

// A non-error cell value against a criterion (step 6).
function matches(cell, crit) {
  if (cell.t === 'blank') return false;
  const same = cell.t === crit.operand.t;
  const c = same ? cmpVals(cell, crit.operand) : 0;
  switch (crit.op) {
    case '=': return same && c === 0;
    case '<>': return !(same && c === 0);
    case '<': return same && c < 0;
    case '<=': return same && c <= 0;
    case '>': return same && c > 0;
    default: return same && c >= 0;
  }
}

function countifFn([rg, critNode]) {
  if (!isRangeArg(rg)) return ERR('#VALUE!');
  const cells = rangeCells(rg);
  if (!Array.isArray(cells)) return cells;
  const crit = ev(critNode);
  if (crit.t === 'e') return crit;
  const cr = criterionOf(crit);
  let n = 0;
  for (const p of cells) {
    const v = ENV.get(p.r, p.c);
    if (v.t === 'e') return v;
    if (matches(v, cr)) n++;
  }
  return { t: 'n', v: n };
}

function sumifFn([rg, critNode, sg]) {
  if (!isRangeArg(rg)) return ERR('#VALUE!');
  if (!isRangeArg(sg)) return ERR('#VALUE!');
  const cells = rangeCells(rg);
  if (!Array.isArray(cells)) return cells;
  const sumCells = rangeCells(sg);
  if (!Array.isArray(sumCells)) return sumCells;
  const d1 = rangeDims(rg);
  const d2 = rangeDims(sg);
  if (d1[0] !== d2[0] || d1[1] !== d2[1]) return ERR('#VALUE!');
  const crit = ev(critNode);
  if (crit.t === 'e') return crit;
  const cr = criterionOf(crit);
  let s = 0;
  for (let i = 0; i < cells.length; i++) {
    const v = ENV.get(cells[i].r, cells[i].c);
    if (v.t === 'e') return v;
    if (!matches(v, cr)) continue;
    const w = ENV.get(sumCells[i].r, sumCells[i].c);
    if (w.t === 'e') return w;
    if (w.t === 'n') s += w.v;
  }
  return numRes(s);
}

const FUNCS = new Map([
  ['SUM', { min: 1, max: Infinity, fn: sumFn }],
  ['AVERAGE', { min: 1, max: Infinity, fn: averageFn }],
  ['MIN', { min: 1, max: Infinity, fn: (a) => extremeFn(a, Math.min) }],
  ['MAX', { min: 1, max: Infinity, fn: (a) => extremeFn(a, Math.max) }],
  ['COUNT', { min: 1, max: Infinity, fn: (a) => countFn(a, false) }],
  ['COUNTA', { min: 1, max: Infinity, fn: (a) => countFn(a, true) }],
  ['ROUND', { min: 2, max: 2, fn: roundFn }],
  ['ABS', { min: 1, max: 1, fn: (a) => unaryNum(a[0], Math.abs) }],
  ['INT', { min: 1, max: 1, fn: (a) => unaryNum(a[0], Math.floor) }],
  ['MOD', { min: 2, max: 2, fn: modFn }],
  ['IF', { min: 3, max: 3, fn: ifFn }],
  ['AND', { min: 1, max: Infinity, fn: (a) => logicFn(a, true) }],
  ['OR', { min: 1, max: Infinity, fn: (a) => logicFn(a, false) }],
  ['NOT', { min: 1, max: 1, fn: notFn }],
  ['IFERROR', { min: 2, max: 2, fn: iferrorFn }],
  ['ISERROR', { min: 1, max: 1, fn: (a) => BOOL(ev(a[0]).t === 'e') }],
  ['ISBLANK', { min: 1, max: 1, fn: isblankFn }],
  ['LEN', { min: 1, max: 1, fn: lenFn }],
  ['UPPER', { min: 1, max: 1, fn: upperFn }],
  ['LEFT', { min: 2, max: 2, fn: leftFn }],
  ['RIGHT', { min: 2, max: 2, fn: rightFn }],
  ['MID', { min: 3, max: 3, fn: midFn }],
  ['CONCAT', { min: 1, max: Infinity, fn: concatFn }],
  ['COUNTIF', { min: 2, max: 2, fn: countifFn }],
  ['SUMIF', { min: 3, max: 3, fn: sumifFn }],
]);

function evCall(n) {
  const f = FUNCS.get(n.n);
  if (!f) return ERR('#NAME?');
  if (n.args.length < f.min || n.args.length > f.max) return ERR('#ARGS!');
  return f.fn(n.args);
}

// ===== Tally Grid engine, part 3: sheet evaluation, rewriting, structure, clipboard (no DOM) =====
function analyze(raw) {
  if (raw === '') return { kind: 'empty' };
  if (raw[0] !== '=') return { kind: 'const', val: constValue(raw) };
  const p = parseFormula(raw);
  return { kind: 'formula', ast: p ? p.ast : null };
}

// Cell indexes a formula reads, including those its evaluation may not reach (02 section 2.9).
function collectRefs(n, out) {
  switch (n.k) {
    case 'ref':
      if (inside(n)) out.push(n.r * NCOLS + n.c);
      break;
    case 'range': {
      const cells = rangeCells(n);
      if (Array.isArray(cells)) cells.forEach((p) => out.push(p.r * NCOLS + p.c));
      break;
    }
    case 'bin':
      collectRefs(n.l, out);
      collectRefs(n.r, out);
      break;
    case 'un':
    case 'pct':
    case 'paren':
      collectRefs(n.e, out);
      break;
    case 'call':
      n.args.forEach((x) => collectRefs(x, out));
      break;
  }
}

// Values of the 96 cells, in index order r * 8 + c.
function evaluateSheet(cells) {
  const info = cells.map((c) => analyze(c.raw));
  const prec = info.map((f) => {
    const out = [];
    if (f.kind === 'formula' && f.ast) collectRefs(f.ast, out);
    return out;
  });
  const circ = info.map((f, i) => {
    if (f.kind !== 'formula' || !f.ast) return false;
    const seen = new Set();
    const stack = prec[i].slice();
    while (stack.length) {
      const j = stack.pop();
      if (j === i) return true;
      if (seen.has(j)) continue;
      seen.add(j);
      stack.push(...prec[j]);
    }
    return false;
  });
  const memo = [];
  const get = (r, c) => valueAt(r * NCOLS + c);
  const valueAt = (i) => {
    const f = info[i];
    if (f.kind === 'empty') return BLANK;
    if (circ[i]) return ERR('#CYCLE!');
    if (memo[i]) return memo[i];
    let v;
    if (f.kind === 'const') {
      v = f.val;
    } else if (!f.ast) {
      v = ERR('#SYNTAX!');
    } else {
      try {
        v = ev(f.ast);
      } catch (e) {
        v = ERR('#VALUE!');
      }
      if (v.t === 'blank') v = { t: 'n', v: 0 };
    }
    memo[i] = v;
    return v;
  };
  ENV = { get };
  return cells.map((_, i) => valueAt(i));
}

// ---- Rewriting references (02 sections 2.10.1 to 2.10.3) ----
function mapTree(n, onRef, onRange) {
  switch (n.k) {
    case 'ref': return onRef(n);
    case 'range': return onRange(n);
    case 'bin': return { ...n, l: mapTree(n.l, onRef, onRange), r: mapTree(n.r, onRef, onRange) };
    case 'un':
    case 'pct':
    case 'paren':
      return { ...n, e: mapTree(n.e, onRef, onRange) };
    case 'call': return { ...n, args: n.args.map((x) => mapTree(x, onRef, onRange)) };
    default: return n;
  }
}

// axis is 'r' (rows) or 'c' (columns); idx is the 0-based line inserted or deleted.
function insertOrDeleteRewriter(ins, axis, idx) {
  const max = axis === 'r' ? NROWS - 1 : NCOLS - 1;
  const removed = { k: 'referr' };
  const onRef = (n) => {
    if (!inside(n)) return n;
    const p = n[axis];
    let np;
    if (ins) np = p >= idx ? p + 1 : p;
    else if (p === idx) return removed;
    else np = p > idx ? p - 1 : p;
    return np > max ? removed : { ...n, [axis]: np };
  };
  const onRange = (n) => {
    if (!inside(n.a) || !inside(n.b)) return n;
    const lo = Math.min(n.a[axis], n.b[axis]);
    const hi = Math.max(n.a[axis], n.b[axis]);
    let nlo;
    let nhi;
    if (ins) {
      nlo = lo >= idx ? lo + 1 : lo;
      if (nlo > max) return removed;
      nhi = Math.min(hi >= idx ? hi + 1 : hi, max);
    } else if (idx > hi) {
      nlo = lo;
      nhi = hi;
    } else if (idx < lo) {
      nlo = lo - 1;
      nhi = hi - 1;
    } else {
      if (lo === hi) return removed;
      nlo = lo;
      nhi = hi - 1;
    }
    const aIsLo = n.a[axis] <= n.b[axis];
    return {
      k: 'range',
      a: { ...n.a, [axis]: aIsLo ? nlo : nhi },
      b: { ...n.b, [axis]: aIsLo ? nhi : nlo },
    };
  };
  return (ast) => mapTree(ast, onRef, onRange);
}

// Offset dc columns and dr rows; parts with $ stay; leaving the grid gives #REF!.
function pasteRewriter(dc, dr) {
  const moved = (n) => ({ k: 'ref', c: n.ca ? n.c : n.c + dc, r: n.ra ? n.r : n.r + dr, ca: n.ca, ra: n.ra });
  const onRef = (n) => {
    const m = moved(n);
    return inside(m) ? m : { k: 'referr' };
  };
  const onRange = (n) => {
    const a = moved(n.a);
    const b = moved(n.b);
    return inside(a) && inside(b) ? { k: 'range', a, b } : { k: 'referr' };
  };
  return (ast) => mapTree(ast, onRef, onRange);
}

// Rewrites every valid formula of the cells; other contents are kept.
function rewriteCells(cells, rewrite) {
  return cells.map((cell) => {
    if (cell.raw[0] !== '=') return cell;
    const p = parseFormula(cell.raw);
    return p ? { raw: '=' + genC(rewrite(p.ast)), fmt: cell.fmt } : cell;
  });
}

function insertLine(cells, axis, idx) {
  const out = cells.slice();
  for (let r = NROWS - 1; r >= 0; r--) {
    for (let c = NCOLS - 1; c >= 0; c--) {
      if (axis === 'r' && r > idx) out[r * NCOLS + c] = out[(r - 1) * NCOLS + c];
      if (axis === 'c' && c > idx) out[r * NCOLS + c] = out[r * NCOLS + c - 1];
    }
  }
  for (let r = 0; r < NROWS; r++) {
    for (let c = 0; c < NCOLS; c++) {
      if ((axis === 'r' && r === idx) || (axis === 'c' && c === idx)) out[r * NCOLS + c] = EMPTY_CELL;
    }
  }
  return rewriteCells(out, insertOrDeleteRewriter(true, axis, idx));
}

function deleteLine(cells, axis, idx) {
  const out = cells.slice();
  for (let r = 0; r < NROWS; r++) {
    for (let c = 0; c < NCOLS; c++) {
      if (axis === 'r' && r >= idx && r < NROWS - 1) out[r * NCOLS + c] = out[(r + 1) * NCOLS + c];
      if (axis === 'c' && c >= idx && c < NCOLS - 1) out[r * NCOLS + c] = out[r * NCOLS + c + 1];
    }
  }
  for (let r = 0; r < NROWS; r++) {
    for (let c = 0; c < NCOLS; c++) {
      if ((axis === 'r' && r === NROWS - 1) || (axis === 'c' && c === NCOLS - 1)) out[r * NCOLS + c] = EMPTY_CELL;
    }
  }
  return rewriteCells(out, insertOrDeleteRewriter(false, axis, idx));
}

// ---- Clipboard (06, section 6.2) ----
function rectIdx(rect) {
  const out = [];
  for (let r = rect.r1; r <= rect.r2; r++) {
    for (let c = rect.c1; c <= rect.c2; c++) out.push(r * NCOLS + c);
  }
  return out;
}

function takeBlock(cells, rect) {
  const items = [];
  for (let r = rect.r1; r <= rect.r2; r++) {
    const row = [];
    for (let c = rect.c1; c <= rect.c2; c++) row.push(cells[r * NCOLS + c]);
    items.push(row);
  }
  return { items, r1: rect.r1, c1: rect.c1, rows: rect.r2 - rect.r1 + 1, cols: rect.c2 - rect.c1 + 1 };
}

function pasteCells(cells, block, dest) {
  const out = cells.slice();
  if (block.mode === 'cut') {
    for (let r = block.r1; r < block.r1 + block.rows; r++) {
      for (let c = block.c1; c < block.c1 + block.cols; c++) out[r * NCOLS + c] = EMPTY_CELL;
    }
  }
  const rewrite = block.mode === 'copy' ? pasteRewriter(dest.c - block.c1, dest.r - block.r1) : null;
  for (let i = 0; i < block.rows; i++) {
    for (let j = 0; j < block.cols; j++) {
      const r = dest.r + i;
      const c = dest.c + j;
      if (r >= NROWS || c >= NCOLS) continue;
      const src = block.items[i][j];
      let raw = src.raw;
      if (rewrite && raw[0] === '=') {
        const p = parseFormula(raw);
        if (p) raw = '=' + genC(rewrite(p.ast));
      }
      out[r * NCOLS + c] = { raw, fmt: src.fmt };
    }
  }
  return out;
}

// ===== Tally Grid page: state, actions, rendering =====
const $ = (id) => document.getElementById(id);
const KIND = { n: 'number', s: 'text', b: 'logical', e: 'error' };
const TOOLBAR = [
  'undo-button', 'redo-button', 'copy-button', 'cut-button', 'paste-button', 'clear-button',
  'insert-row', 'delete-row', 'insert-col', 'delete-col', 'format-select',
];
const ARROW_KEYS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };

const state = {
  cells: Array.from({ length: NROWS * NCOLS }, () => EMPTY_CELL),
  anchor: { r: 0, c: 0 },
  active: { r: 0, c: 0 },
  editing: false,
  clip: null,
  undo: [],
  redo: [],
};

const gridEl = $('grid');
const inputEl = $('formula-input');
const cellEls = [];

const safe = (fn) => (e) => {
  try {
    fn(e);
  } catch (err) {
    console.error(err);
  }
};

function el(tag, attrs, text) {
  const node = document.createElement(tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text !== undefined) node.textContent = text;
  return node;
}

function buildGrid() {
  const head = el('div', { role: 'row', class: 'row' });
  head.appendChild(el('div', { role: 'presentation', class: 'corner' }));
  for (let c = 0; c < NCOLS; c++) {
    head.appendChild(el('div', {
      role: 'columnheader', class: 'head', 'data-testid': 'col-header-' + COL_LETTERS[c],
    }, COL_LETTERS[c]));
  }
  gridEl.appendChild(head);
  for (let r = 0; r < NROWS; r++) {
    const row = el('div', { role: 'row', class: 'row' });
    row.appendChild(el('div', { role: 'rowheader', class: 'head', 'data-testid': 'row-header-' + (r + 1) }, String(r + 1)));
    for (let c = 0; c < NCOLS; c++) {
      const cell = el('div', { role: 'gridcell', class: 'cell', 'data-testid': 'cell-' + addr(r, c) });
      cell.addEventListener('click', safe((e) => onCellClick(r, c, e.shiftKey)));
      cellEls.push(cell);
      row.appendChild(cell);
    }
    gridEl.appendChild(row);
  }
}

const snap = () => ({ cells: state.cells, anchor: { ...state.anchor }, active: { ...state.active } });

function restore(s) {
  state.cells = s.cells;
  state.anchor = { ...s.anchor };
  state.active = { ...s.active };
}

function recordStep(before) {
  state.undo.push({ before, after: snap() });
  if (state.undo.length > MAX_UNDO) state.undo.shift();
  state.redo = [];
}

function undo() {
  if (!state.undo.length) return;
  const s = state.undo.pop();
  restore(s.before);
  state.redo.push(s);
}

function redo() {
  if (!state.redo.length) return;
  const s = state.redo.pop();
  restore(s.after);
  state.undo.push(s);
  if (state.undo.length > MAX_UNDO) state.undo.shift();
}

function selRect() {
  const { anchor: a, active: b } = state;
  return {
    r1: Math.min(a.r, b.r), r2: Math.max(a.r, b.r),
    c1: Math.min(a.c, b.c), c2: Math.max(a.c, b.c),
  };
}

const activeIdx = () => state.active.r * NCOLS + state.active.c;

// Commits the formula bar when editing; returns the "before" snapshot when the content changed.
function commitIfEditing() {
  if (!state.editing) return null;
  const before = snap();
  state.editing = false;
  const raw = rawFromInput(inputEl.value);
  const i = activeIdx();
  if (raw === state.cells[i].raw) return null;
  state.cells = state.cells.slice();
  state.cells[i] = { raw, fmt: state.cells[i].fmt };
  return before;
}

function moveFromInput(dr, dc) {
  const before = commitIfEditing();
  const r = Math.min(state.active.r + dr, NROWS - 1);
  const c = Math.min(state.active.c + dc, NCOLS - 1);
  state.active = { r, c };
  state.anchor = { r, c };
  if (before) recordStep(before);
}

function onCellClick(r, c, shift) {
  const before = commitIfEditing();
  if (shift) {
    state.active = { r, c };
  } else {
    state.anchor = { r, c };
    state.active = { r, c };
  }
  if (before) recordStep(before);
  gridEl.focus();
  render();
}

function moveBy(dr, dc, extend) {
  const r = Math.min(Math.max(state.active.r + dr, 0), NROWS - 1);
  const c = Math.min(Math.max(state.active.c + dc, 0), NCOLS - 1);
  state.active = { r, c };
  if (!extend) state.anchor = { r, c };
}

function clearSel() {
  const idxs = rectIdx(selRect());
  if (idxs.every((i) => state.cells[i].raw === '')) return;
  const before = snap();
  const next = state.cells.slice();
  for (const i of idxs) next[i] = { raw: '', fmt: next[i].fmt };
  state.cells = next;
  recordStep(before);
}

function setFormat(f) {
  const idxs = rectIdx(selRect());
  if (idxs.every((i) => state.cells[i].fmt === f)) return;
  const before = snap();
  const next = state.cells.slice();
  for (const i of idxs) next[i] = { raw: next[i].raw, fmt: f };
  state.cells = next;
  recordStep(before);
}

function structural(ins, axis) {
  const line = axis === 'r' ? state.active.r : state.active.c;
  const before = snap();
  state.cells = ins ? insertLine(state.cells, axis, line) : deleteLine(state.cells, axis, line);
  recordStep(before);
}

function copySel(mode) {
  state.clip = { ...takeBlock(state.cells, selRect()), mode };
}

function pasteSel() {
  if (!state.clip) return;
  const before = snap();
  const rect = selRect();
  const dest = { r: rect.r1, c: rect.c1 };
  state.cells = pasteCells(state.cells, state.clip, dest);
  state.anchor = { ...dest };
  state.active = { ...dest };
  if (state.clip.mode === 'cut') state.clip = null;
  recordStep(before);
}

function selectionSummary(nums) {
  const total = nums.reduce((s, x) => s + x, 0);
  const text = (res) => (res.t === 'e' ? res.v : generalText(res.v));
  return 'Sum: ' + text(numRes(total)) + ' | Average: ' + text(numRes(total / nums.length)) +
    ' | Count: ' + nums.length;
}

function render() {
  const vals = evaluateSheet(state.cells);
  const rect = selRect();
  const nums = [];
  for (let r = 0; r < NROWS; r++) {
    for (let c = 0; c < NCOLS; c++) {
      const i = r * NCOLS + c;
      const cell = state.cells[i];
      const v = vals[i];
      const inSel = r >= rect.r1 && r <= rect.r2 && c >= rect.c1 && c <= rect.c2;
      const node = cellEls[i];
      node.textContent = displayText(v, cell.fmt);
      node.dataset.kind = cell.raw === '' ? 'empty' : KIND[v.t];
      node.setAttribute('aria-selected', r === state.active.r && c === state.active.c ? 'true' : 'false');
      node.setAttribute('data-in-selection', inSel ? 'true' : 'false');
      if (inSel && v.t === 'n') nums.push(v.v);
    }
  }
  const single = rect.r1 === rect.r2 && rect.c1 === rect.c2;
  $('name-box').textContent = single ? addr(rect.r1, rect.c1)
    : addr(rect.r1, rect.c1) + ':' + addr(rect.r2, rect.c2);

  const active = state.cells[activeIdx()];
  inputEl.dataset.editing = String(state.editing);
  if (!state.editing) {
    inputEl.value = active.raw;
    $('format-select').value = active.fmt;
  }

  const off = { 'undo-button': !state.undo.length, 'redo-button': !state.redo.length, 'paste-button': !state.clip };
  for (const id of TOOLBAR) $(id).disabled = state.editing || !!off[id];

  const summary = $('selection-summary');
  summary.hidden = nums.length === 0;
  if (nums.length) summary.textContent = selectionSummary(nums);
}

function bindActions() {
  const act = (id, fn) => $(id).addEventListener('click', safe(() => {
    fn();
    render();
  }));
  act('undo-button', undo);
  act('redo-button', redo);
  act('copy-button', () => copySel('copy'));
  act('cut-button', () => copySel('cut'));
  act('paste-button', pasteSel);
  act('clear-button', clearSel);
  act('insert-row', () => structural(true, 'r'));
  act('delete-row', () => structural(false, 'r'));
  act('insert-col', () => structural(true, 'c'));
  act('delete-col', () => structural(false, 'c'));
  $('format-select').addEventListener('change', safe((e) => {
    setFormat(e.target.value);
    render();
  }));

  inputEl.addEventListener('input', safe(() => {
    state.editing = true;
    render();
  }));

  inputEl.addEventListener('keydown', safe((e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      moveFromInput(1, 0);
    } else if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      moveFromInput(0, 1);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      state.editing = false;
      gridEl.focus();
    } else {
      return;
    }
    render();
  }));

  gridEl.addEventListener('keydown', safe((e) => {
    const k = e.key;
    const mod = e.ctrlKey || e.metaKey;
    const lk = k.length === 1 ? k.toLowerCase() : k;
    const handled = k === 'Delete' || k === 'Backspace' || k === 'Enter' || k in ARROW_KEYS ||
      (mod && (lk === 'z' || lk === 'y'));
    if (!handled) return;
    e.preventDefault();
    if (state.editing) {
      if (k === 'Enter') inputEl.focus();
      return;
    }
    if (mod && lk === 'z') undo();
    else if (mod && lk === 'y') redo();
    else if (k === 'Enter') inputEl.focus();
    else if (k === 'Delete' || k === 'Backspace') clearSel();
    else moveBy(ARROW_KEYS[k][0], ARROW_KEYS[k][1], e.shiftKey);
    render();
  }));
}

buildGrid();
bindActions();
render();
</script>
</body>
</html>
