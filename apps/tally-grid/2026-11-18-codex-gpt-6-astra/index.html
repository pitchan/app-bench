const clone=x=>JSON.parse(JSON.stringify(x)),snapshot=()=>({sheet:clone(sheet),anchor,active});function record(before){undo.push({before,after:snapshot()});if(undo.length>20)undo.shift();redo=[]}function restore(s){sheet=clone(s.sheet);anchor=s.anchor;active=s.active;render()}function action(fn,always=false){if(editing)return;let before=snapshot();fn();if(always||JSON.stringify(before.sheet)!==JSON.stringify(sheet))record(before);render()}
function commitAnd(move,focusGrid=false){let before=snapshot(),changed=false;if(editing){let raw=input.value,ast=parse(raw);if(ast)raw='='+serial(ast);changed=raw!==sheet[active].raw;sheet[active].raw=raw;editing=false}move();if(changed)record(before);render();if(focusGrid)grid.focus()}
function move(dr,dc,shift=false){let r=Math.max(0,Math.min(11,Math.floor(active/8)+dr)),c=Math.max(0,Math.min(7,active%8+dc));active=r*8+c;if(!shift)anchor=active}
function clear(){action(()=>selected().forEach(i=>sheet[i].raw=''))}
function history(isRedo){if(editing)return;let from=isRedo?redo:undo,to=isRedo?undo:redo;if(!from.length)return;let step=from.pop();to.push(step);restore(isRedo?step.after:step.before)}
input.addEventListener('input',()=>{editing=true;render()});input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus()}else if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();commitAnd(()=>move(e.key==='Enter'?1:0,e.key==='Tab'?1:0))}});
grid.addEventListener('keydown',e=>{let directions={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]},hist=e.ctrlKey&&['z','y'].includes(e.key.toLowerCase());if(!(e.key in directions)&&!['Enter','Delete','Backspace'].includes(e.key)&&!hist)return;e.preventDefault();if(e.key==='Enter'){input.focus();return}if(editing)return;if(hist){history(e.key.toLowerCase()==='y');return}if(e.key in directions){move(...directions[e.key],e.shiftKey);render();cells[active].scrollIntoView({block:'nearest',inline:'nearest'})}else clear()});
$('undo-button').onclick=()=>history(false);$('redo-button').onclick=()=>history(true);$('clear-button').onclick=clear;format.onchange=()=>action(()=>selected().forEach(i=>sheet[i].format=format.value));
for(let mode of ['copy','cut'])$(mode+'-button').onclick=()=>{if(editing)return;let q=rect();clipboard={mode,q,block:[]};for(let r=q.t;r<=q.b;r++){let row=[];for(let c=q.l;c<=q.r;c++)row.push({...sheet[r*8+c]});clipboard.block.push(row)}render()};
$('paste-button').onclick=()=>{if(!clipboard||editing)return;action(()=>{let q=rect(),clip=clipboard;if(clip.mode==='cut')for(let r=clip.q.t;r<=clip.q.b;r++)for(let c=clip.q.l;c<=clip.q.r;c++)sheet[r*8+c]=blank();clip.block.forEach((row,r)=>row.forEach((cell,c)=>{if(q.t+r<12&&q.l+c<8)sheet[(q.t+r)*8+q.l+c]={format:cell.format,raw:clip.mode==='copy'?rewrite(cell.raw,'paste',null,null,q.l-clip.q.l,q.t-clip.q.t):cell.raw}}));active=anchor=q.t*8+q.l;if(clip.mode==='cut')clipboard=null},true)};
for(let axis of ['row','col'])for(let mode of ['insert','delete'])$(mode+'-'+axis).onclick=()=>action(()=>{let isRow=axis==='row',pos=isRow?Math.floor(active/8):active%8,old=clone(sheet);for(let r=0;r<12;r++)for(let c=0;c<8;c++){let k=isRow?r:c,source=k;if(mode==='insert'){if(k===pos)source=-1;else if(k>pos)source=k-1}else if(k>=pos)source=k+1;sheet[r*8+c]=source<0||source>=(isRow?12:8)?blank():{...old[isRow?source*8+c:r*8+source]}}sheet.forEach(cell=>cell.raw=rewrite(cell.raw,mode,isRow?'r':'c',pos+1))},true);
render();
</script></body></html>
