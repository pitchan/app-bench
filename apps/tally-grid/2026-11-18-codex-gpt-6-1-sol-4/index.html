grid.onkeydown=e=>{let key=e.key.toLowerCase(),handled=['arrowup','arrowdown','arrowleft','arrowright','delete','backspace','enter'].includes(key)||e.ctrlKey&&['z','y'].includes(key);if(!handled)return;e.preventDefault();if(key==='enter'){input.focus();return}if(editing)return;if(e.ctrlKey&&['z','y'].includes(key)){history(key==='z');return}if(['delete','backspace'].includes(key)){action('clear-button');return}let r=active/8|0,c=active%8;if(key==='arrowup')r=Math.max(0,r-1);if(key==='arrowdown')r=Math.min(11,r+1);if(key==='arrowleft')c=Math.max(0,c-1);if(key==='arrowright')c=Math.min(7,c+1);active=r*8+c;if(!e.shiftKey)anchor=active;render();els[active].scrollIntoView({block:'nearest',inline:'nearest'})};
format.onchange=()=>{if(editing)return;let ids=selected(),f=format.value;if(ids.every(i=>sheet[i].fmt===f))return;let before=snapshot();ids.forEach(i=>sheet[i].fmt=f);record(before);render()};
function action(id){if(editing)return;if(id==='undo-button'||id==='redo-button'){history(id==='undo-button');return}let ids=selected(),q=rect();if(id==='copy-button'||id==='cut-button'){clip={mode:id==='copy-button'?'copy':'cut',q:clone(q),cells:ids.map(i=>clone(sheet[i]))};render();return}if(id==='clear-button'){if(ids.every(i=>sheet[i].raw===''))return;let before=snapshot();ids.forEach(i=>sheet[i].raw='');record(before);render();return}if(id==='paste-button'){if(!clip)return;let before=snapshot(),b=clip,w=b.q.r-b.q.l+1;if(b.mode==='cut')for(let r=b.q.t;r<=b.q.b;r++)for(let c=b.q.l;c<=b.q.r;c++)sheet[r*8+c]={raw:'',fmt:'general'};b.cells.forEach((cell,i)=>{let r=q.t+(i/w|0),c=q.l+i%w;if(r<12&&c<8){let target=clone(cell);if(b.mode==='copy')target.raw=rewrite(target.raw,'copy',null,0,q.l-b.q.l,q.t-b.q.t);sheet[r*8+c]=target}});anchor=active=q.t*8+q.l;if(b.mode==='cut')clip=null;record(before);render();return}let before=snapshot(),axis=id.endsWith('row')?'row':'col',insert=id.startsWith('insert'),pos=axis==='row'?(active/8|0):active%8,old=clone(sheet);for(let r=0;r<12;r++)for(let c=0;c<8;c++){let v=axis==='row'?r:c,source=v;if(insert){if(v===pos)source=-1;else if(v>pos)source--}else if(v>=pos)source++;let sr=axis==='row'?source:r,sc=axis==='col'?source:c;sheet[r*8+c]=sr<0||sr>11||sc<0||sc>7?{raw:'',fmt:'general'}:clone(old[sr*8+sc])}sheet.forEach(cell=>cell.raw=rewrite(cell.raw,insert?'insert':'delete',axis,pos+1));record(before);render()}
render();
</script></body></html>
