let v=args.map(evalArg),err=v.find(isErr);if(err)return err;let t=(i)=>txt(v[i]),nn=(i)=>num(v[i]),ii=(i)=>integer(v[i]);switch(name){case'ABS':{let x=nn(0);return isErr(x)?x:N(Math.abs(x.v))}case'INT':{let x=nn(0);return isErr(x)?x:N(Math.floor(x.v))}case'MOD':{let a=nn(0),b=nn(1);return isErr(a)?a:isErr(b)?b:b.v===0?E('#DIV/0!'):N(a.v-b.v*Math.floor(a.v/b.v))}case'ROUND':{let a=nn(0),d=ii(1);if(isErr(a))return a;if(isErr(d))return d;if(d.v<-9||d.v>9)return E('#NUM!');return N(roundDec(a.v,d.v))}case'AND':case'OR':{let all=name==='AND',seen=false;for(let x of v){let l=logical(x);if(isErr(l))return l;if(name==='AND'&&!l.v)return V('logical',false);if(name==='OR'&&l.v)return V('logical',true);seen=true}return V('logical',all)}case'NOT':{let x=logical(v[0]);return isErr(x)?x:V('logical',!x.v)}case'LEN':{let x=t(0);return isErr(x)?x:N(x.v.length)}case'UPPER':{let x=t(0);return isErr(x)?x:V('text',x.v.toUpperCase())}case'LEFT':case'RIGHT':{let x=t(0),n=ii(1);if(isErr(x))return x;if(isErr(n))return n;if(n.v<0)return E('#VALUE!');return V('text',name==='LEFT'?x.v.slice(0,n.v):x.v.slice(Math.max(0,x.v.length-n.v)))}case'MID':{let x=t(0),s=ii(1),n=ii(2);if(isErr(x))return x;if(isErr(s))return s;if(isErr(n))return n;if(s.v<1||n.v<0)return E('#VALUE!');return V('text',x.v.slice(s.v-1,s.v-1+n.v))}case'CONCAT':{let out='';for(let q of args){let b=argRange(q);if(b){if(isErr(b))return b;for(let cell of valsRange(b)){let x=txt(cell.v);if(isErr(x))return x;out+=x.v}}else{let x=txt(evalArg(q));if(isErr(x))return x;out+=x.v}}return V('text',out)}}return E('#NAME?')}
function formulaRaw(s){if(!s.startsWith('='))return s;let z=validFormula(s);return z?canonical(z.ast):s}
function rewriteAst(n,kind,axis,pos,dr,dc){if(n.k==='ref'){let p=parseAddr(n.col+n.row),isRange=false;if(kind==='paste'){let c=p.c+(n.colAbs?0:dc),r=p.r+(n.rowAbs?0:dr);if(r<0||r>=12||c<0||c>=8)return{k:'referr',v:'#REF!'};return{...n,col:colName(c+1),row:r+1}}let v=axis==='row'?p.r:p.c,edge=axis==='row'?11:7;if(kind==='insert'){if(v>=pos)v++;if(v>edge)return{k:'referr',v:'#REF!'}}else{if(v===pos)return{k:'referr',v:'#REF!'};if(v>pos)v--}return{...n,...(axis==='row'?{row:v+1}:{col:colName(v+1)})}}if(n.k==='range'){if(kind==='paste'){let a=rewriteAst(n.a,kind,axis,pos,dr,dc),b=rewriteAst(n.b,kind,axis,pos,dr,dc);if(a.k==='referr'||b.k==='referr')return{k:'referr',v:'#REF!'};return{k:'range',a,b}}let [a,b]=normRange(n.a,n.b),start=axis==='row'?a.row-1:parseAddr(a.col+a.row).c,end=axis==='row'?b.row-1:parseAddr(b.col+b.row).c;let changed;if(kind==='insert'){let ns=start>=pos?start+1:start,ne=end>=pos?end+1:end;if(ns> (axis==='row'?11:7))return{k:'referr',v:'#REF!'};ne=Math.min(ne,axis==='row'?11:7);changed=[ns,ne]}else if(pos>end)changed=[start,end];else if(pos<start)changed=[start-1,end-1];else if(start===end)return{k:'referr',v:'#REF!'};else changed=[start,end-1];let [s,e]=changed;let x=axis==='row'?{...a,row:s+1}:{...a,col:colName(s+1)},y=axis==='row'?{...b,row:e+1}:{...b,col:colName(e+1)};return{k:'range',a:x,b:y}}if(n.k==='group')return{k:'group',x:rewriteAst(n.x,kind,axis,pos,dr,dc)};if(n.k==='unary')return{k:'unary',op:n.op,x:rewriteAst(n.x,kind,axis,pos,dr,dc)};if(n.k==='bin')return{k:'bin',op:n.op,a:rewriteAst(n.a,kind,axis,pos,dr,dc),b:rewriteAst(n.b,kind,axis,pos,dr,dc)};if(n.args)return{...n,args:n.args.map(x=>rewriteAst(x,kind,axis,pos,dr,dc))};return n}

function rect(){return{r1:Math.min(anchor.r,active.r),r2:Math.max(anchor.r,active.r),c1:Math.min(anchor.c,active.c),c2:Math.max(anchor.c,active.c)}}function snap(){return{data:cells.map(row=>row.map(x=>({...x}))),anchor:{...anchor},active:{...active}}}function restore(s){for(let r=0;r<ROWS;r++)for(let c=0;c<8;c++)cells[r][c]={...s.data[r][c]};anchor={...s.anchor};active={...s.active};rebuildCycles();render()}function record(before){let after=snap();undo.push({before,after});if(undo.length>20)undo.shift();redo=[];updateButtons()}
function updateButtons(){ $('undo-button').disabled=!undo.length;$('redo-button').disabled=!redo.length;$('paste-button').disabled=!clipboard||editing;for(let id of KEYS)$(id).disabled=editing||(id==='undo-button'?!undo.length:id==='redo-button'?!redo.length:id==='paste-button'?!clipboard:false)}
function render(){rebuildCycles();let q=rect(),nums=[];for(let r=0;r<ROWS;r++)for(let c=0;c<8;c++){let el=tbody.rows[r].cells[c+1],v=cellVal(r,c),cell=cells[r][c];el.textContent=shown(v,cell.fmt);el.dataset.kind=v.t==='formula'?'error':v.t;/* evaluated below */if(rawValue(cell.raw).t==='formula')el.dataset.kind=v.t;el.setAttribute('aria-selected',r===active.r&&c===active.c?'true':'false');el.dataset.inSelection=r>=q.r1&&r<=q.r2&&c>=q.c1&&c<=q.c2?'true':'false';if(v.t==='number')nums.push({r,c,v:v.v})}let multi=q.r1!==q.r2||q.c1!==q.c2;$('name-box').textContent=multi?addr(q.r1,q.c1)+':'+addr(q.r2,q.c2):addr(active.r,active.c);if(!editing)input.value=cells[active.r][active.c].raw;let sum=0;for(let x of nums)if(x.r>=q.r1&&x.r<=q.r2&&x.c>=q.c1&&x.c<=q.c2)sum+=x.v;let selected=nums.filter(x=>x.r>=q.r1&&x.r<=q.r2&&x.c>=q.c1&&x.c<=q.c2);let sm=$('selection-summary');if(selected.length){let ns=N(sum),av=N(sum/selected.length);sm.textContent=`Sum: ${ns.t==='error'?'#NUM!':general(ns.v)} | Average: ${av.t==='error'?'#NUM!':general(av.v)} | Count: ${selected.length}`;sm.hidden=false}else sm.hidden=true;$('format-select').value=cells[active.r][active.c].fmt;updateButtons()}

function structure(type,axis){let before=snap(),pos=axis==='row'?active.r:active.c,limit=axis==='row'?ROWS:8;for(let r=0;r<ROWS;r++)for(let c=0;c<8;c++){if((axis==='row'?r:c)<pos)continue;let src=type==='insert'?(axis==='row'?r-1:c-1):(axis==='row'?r+1:c+1);if(type==='insert'){if((axis==='row'?r:c)===pos)cells[r][c]={raw:'',fmt:'general'};else if((axis==='row'?r:c)<limit-1)cells[r][c]={...cells[axis==='row'?src:r][axis==='col'?src:c]};else cells[r][c]={raw:'',fmt:'general'}}else{if((axis==='row'?r:c)<limit-1)cells[r][c]={...cells[axis==='row'?src:r][axis==='col'?src:c]};else cells[r][c]={raw:'',fmt:'general'}}}for(let r=0;r<ROWS;r++)for(let c=0;c<8;c++)if(cells[r][c].raw.startsWith('='))cells[r][c].raw=rewriteFormula(cells[r][c].raw,type,axis,pos);rebuildCycles();render();record(before)}

function history(which){if(which==='undo'&&undo.length){let s=undo.pop();redo.push(s);restore(s.before)}else if(which==='redo'&&redo.length){let s=redo.pop();undo.push(s);restore(s.after)}}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{switch(b.dataset.testid){case'undo-button':history('undo');break;case'redo-button':history('redo');break;case'copy-button':copy(false);break;case'cut-button':copy(true);break;case'paste-button':paste();break;case'clear-button':clear();break;case'insert-row':structure('insert','row');break;case'delete-row':structure('delete','row');break;case'insert-col':structure('insert','col');break;case'delete-col':structure('delete','col');break}}));$('format-select').addEventListener('change',formatChange);
