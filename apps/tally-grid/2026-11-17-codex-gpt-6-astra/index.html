function render(){recalc();let b=selection(),selected=new Set(indices(b));cells.forEach((el,i)=>{el.textContent=show(values[i],sheet[i].format);el.dataset.kind=values[i].t;el.setAttribute('aria-selected',String(i===active));el.dataset.inSelection=String(selected.has(i))});$('name-box').textContent=selected.size===1?address(active):address(b[1]*8+b[0])+':'+address(b[3]*8+b[2]);input.dataset.editing=String(editing);if(!editing){input.value=sheet[active].raw;format.value=sheet[active].format}controls.forEach(c=>c.disabled=editing);$('undo-button').disabled=editing||!undo.length;$('redo-button').disabled=editing||!redo.length;$('paste-button').disabled=editing||!clipboard;let nums=[...selected].map(i=>values[i]).filter(v=>v.t==='number'),summary=$('selection-summary');summary.hidden=!nums.length;if(nums.length){let s=nums.reduce((a,b)=>a+b.v,0);summary.textContent='Sum: '+show(num(s))+' | Average: '+show(num(s/nums.length))+' | Count: '+nums.length}}
function commit(){if(!editing)return false;editing=false;let raw=canonical(input.value),changed=sheet[active].raw!==raw;sheet[active].raw=raw;return changed}
function select(i,shift){let before=snapshot(),changed=commit();active=i;if(!shift)anchor=i;if(changed)record(before);render();grid.focus()}
function move(dx,dy,shift){active=Math.max(0,Math.min(11,(active/8|0)+dy))*8+Math.max(0,Math.min(7,active%8+dx));if(!shift)anchor=active}
input.addEventListener('input',()=>{editing=true;input.dataset.editing='true';controls.forEach(c=>c.disabled=true)});input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus()}else if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();let before=snapshot(),changed=commit();move(e.key==='Tab'?1:0,e.key==='Enter'?1:0,false);if(changed)record(before);render()}});
function clear(){if(editing)return;let ii=indices(selection());if(ii.every(i=>sheet[i].raw===''))return;let before=snapshot();ii.forEach(i=>sheet[i].raw='');record(before);render()}
function history(back){if(editing)return;let from=back?undo:redo,to=back?redo:undo;if(!from.length)return;let s=from.pop();to.push(s);restore(back?s.before:s.after)}
grid.addEventListener('keydown',e=>{let directions={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(e.key in directions){e.preventDefault();if(!editing){move(...directions[e.key],e.shiftKey);render();cells[active].scrollIntoView({block:'nearest',inline:'nearest'})}}else if(e.key==='Enter'){e.preventDefault();input.focus()}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();clear()}else if(e.ctrlKey&&['z','y'].includes(e.key.toLowerCase())){e.preventDefault();history(e.key.toLowerCase()==='z')}});
$('clear-button').onclick=clear;$('undo-button').onclick=()=>history(true);$('redo-button').onclick=()=>history(false);
format.onchange=()=>{if(editing)return;let f=format.value,ii=indices(selection());if(ii.some(i=>sheet[i].format!==f)){let before=snapshot();ii.forEach(i=>sheet[i].format=f);record(before)}render()};
for(let mode of ['copy','cut'])$(mode+'-button').onclick=()=>{if(editing)return;let b=selection();clipboard={mode,b,block:indices(b).map(i=>({...sheet[i],source:i}))};render()};
$('paste-button').onclick=()=>{if(editing||!clipboard)return;let before=snapshot(),b=selection(),clip=clipboard,dc=b[0]-clip.b[0],dr=b[1]-clip.b[1];if(clip.mode==='cut')indices(clip.b).forEach(i=>sheet[i]=fresh());clip.block.forEach(c=>{let r=(c.source/8|0)+dr,col=c.source%8+dc;if(r<12&&col<8){sheet[r*8+col]={raw:clip.mode==='copy'?rewrite(c.raw,'copy',null,0,dc,dr):c.raw,format:c.format}}});active=anchor=b[1]*8+b[0];if(clip.mode==='cut')clipboard=null;record(before);render()};
for(let axis of ['row','col'])for(let mode of ['insert','delete'])$(mode+'-'+axis).onclick=()=>{if(editing)return;let before=snapshot(),at=axis==='row'?active/8|0:active%8,old=sheet;sheet=Array.from({length:96},(_,i)=>{let r=i/8|0,c=i%8,k=axis==='row'?r:c,src=k;if(mode==='insert'){if(k===at)return fresh();if(k>at)src--}else{if(k=== (axis==='row'?11:7))return fresh();if(k>=at)src++}return {...old[axis==='row'?src*8+c:r*8+src]}});sheet.forEach(c=>c.raw=rewrite(c.raw,mode,axis,at));record(before);render()};
render();
</script></body>
