<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f8;
  --panel: #ffffff;
  --ink: #1a1e25;
  --muted: #454d5a;
  --line: #d3d8e0;
  --head: #eceff4;
  --accent: #2148c0;
  --sel: #dde7fb;
  --err: #a3141a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background-color: var(--bg);
  color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
[hidden] { display: none !important; }
.page { max-width: 1120px; margin: 0 auto; padding: 12px; }
header { display: flex; align-items: center; gap: 10px; padding: 6px 2px 12px; }
header .mark {
  width: 14px; height: 14px; border-radius: 3px; flex: none;
  background-color: var(--accent); box-shadow: 6px 6px 0 -2px #9db3ee;
}
header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .01em; color: var(--ink); }
main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  background-color: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
}
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.toolbar button, .toolbar select {
  font: inherit; color: var(--ink); background-color: #ffffff;
  border: 1px solid #b4bbc7; border-radius: 6px; min-height: 32px; padding: 4px 10px;
}
.toolbar button { cursor: pointer; }
.toolbar button:hover:not(:disabled) { background-color: #eef2fb; border-color: #8795b3; }
.toolbar button:disabled, .toolbar select:disabled {
  color: #5f6673; background-color: #eceef2; border-color: #dcdfe5; cursor: default; opacity: 1;
}
.toolbar label { color: var(--muted); font-size: 13px; margin-right: 2px; }
.toolbar button:focus, .toolbar select:focus, .fbar input:focus {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.fbar { display: flex; gap: 8px; align-items: stretch; }
.namebox {
  flex: none; min-width: 84px; text-align: center; font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--ink);
  background-color: var(--head); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; line-height: 20px;
}
.fbar input {
  flex: 1 1 auto; min-width: 0; width: 100%;
  font: 14px/20px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color: var(--ink); background-color: #ffffff;
  border: 1px solid #b4bbc7; border-radius: 6px; padding: 6px 10px;
}
.fbar input[data-editing="true"] { border-color: var(--accent); background-color: #fbfcff; }
.gridwrap {
  overflow-x: auto; overflow-y: hidden; max-width: 100%;
  background-color: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
table.sheet {
  border-collapse: separate; border-spacing: 0; table-layout: fixed;
  width: 100%; min-width: 876px; user-select: none; -webkit-user-select: none;
  background-color: #ffffff; cursor: cell;
}
table.sheet:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.sheet th, .sheet td {
  height: 31px; padding: 0 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  overflow: hidden; white-space: pre; text-overflow: ellipsis; font-weight: 400;
}
.sheet tr > :last-child { border-right: 0; }
.sheet tr:last-child > * { border-bottom: 0; }
.sheet th, .sheet .corner {
  background-color: var(--head); color: var(--muted); font-size: 12px; font-weight: 600;
  text-align: center; cursor: default;
}
.sheet .corner, .sheet th[role="rowheader"] { width: 44px; position: sticky; left: 0; z-index: 1; }
.sheet td[role="gridcell"] {
  background-color: #ffffff; color: var(--ink); text-align: left;
  font-variant-numeric: tabular-nums;
}
.sheet td[data-kind="number"] { text-align: right; }
.sheet td[data-kind="logical"] { text-align: center; }
.sheet td[data-kind="error"] { color: var(--err); text-align: center; }
.sheet td[data-in-selection="true"] { background-color: var(--sel); }
.sheet td[aria-selected="true"] { background-color: #ffffff; box-shadow: inset 0 0 0 2px #7f96d6; }
.sheet:focus td[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--accent); background-color: #f5f8ff; }
.status { min-height: 34px; }
.summary {
  display: inline-block; max-width: 100%; color: var(--ink); background-color: var(--head);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
@media (max-width: 520px) {
  .page { padding: 10px; }
  .toolbar button, .toolbar select { padding: 4px 8px; }
  .namebox { min-width: 68px; }
}
</style>
</head>
<body>
<div class="page">
  <header data-testid="app-header"><span class="mark" aria-hidden="true"></span><h1>Claude Fable 5.2</h1></header>
  <main>
    <div class="toolbar" data-testid="toolbar">
      <div class="group">
        <button type="button" data-testid="undo-button" disabled>Undo</button>
        <button type="button" data-testid="redo-button" disabled>Redo</button>
      </div>
      <div class="group">
        <button type="button" data-testid="copy-button">Copy</button>
        <button type="button" data-testid="cut-button">Cut</button>
        <button type="button" data-testid="paste-button" disabled>Paste</button>
        <button type="button" data-testid="clear-button">Clear</button>
      </div>
      <div class="group">
        <button type="button" data-testid="insert-row">Insert row</button>
        <button type="button" data-testid="delete-row">Delete row</button>
        <button type="button" data-testid="insert-col">Insert column</button>
        <button type="button" data-testid="delete-col">Delete column</button>
      </div>
      <div class="group">
        <label for="fmt">Number format</label>
        <select id="fmt" data-testid="format-select">
          <option value="general">General</option>
          <option value="fixed2">1,234.50</option>
          <option value="percent1">12.5%</option>
        </select>
      </div>
    </div>
    <div class="fbar">
      <div class="namebox" data-testid="name-box">A1</div>
      <input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="gridwrap" id="gridwrap">
      <table class="sheet" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></table>
    </div>
    <div class="status"><div class="summary" data-testid="selection-summary" hidden></div></div>
  </main>
</div>
<script>
(function () {
'use strict';

/* ================= Engine ================= */
var NC = 8, NR = 12, N = NC * NR, COLS = 'ABCDEFGH';
var raws = new Array(N).fill(''), fmts = new Array(N).fill('general');

function E(c) { return { err: c }; }
function isErr(v) { return v !== null && typeof v === 'object' && typeof v.err === 'string'; }
function norm(x) {
  if (!isFinite(x)) return E('#NUM!');
  var y = Number(x.toPrecision(12));
  if (!isFinite(y) || Math.abs(y) >= 1e15) return E('#NUM!');
  return y === 0 ? 0 : y;
}

/* R(x, d) on the 12 digits of D(x): value = q * 10^-d */
function roundDec(x, d) {
  if (x === 0 || !isFinite(x)) return { neg: false, q: 0n };
  var p = Math.abs(x).toExponential(11).split('e');
  var digits = BigInt(p[0].replace('.', ''));
  var k = Number(p[1]) - 11 + d, q;
  if (k >= 0) q = digits * 10n ** BigInt(k);
  else if (-k > 12) q = 0n;
  else {
    var m = 10n ** BigInt(-k);
    q = digits / m;
    if ((digits % m) * 2n >= m) q += 1n;
  }
  return { neg: x < 0 && q !== 0n, q: q };
}
function roundNum(x, d) {
  var r = roundDec(x, d), v;
  if (d > 0) {
    var s = r.q.toString().padStart(d + 1, '0');
    v = Number(s.slice(0, -d) + '.' + s.slice(-d));
  } else v = Number(r.q * 10n ** BigInt(-d));
  return norm(r.neg ? -v : v);
}
function fmtNumber(x, fmt) {
  var r, s;
  if (fmt === 'fixed2') {
    r = roundDec(x, 2); s = r.q.toString().padStart(3, '0');
    return (r.neg ? '-' : '') + s.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + s.slice(-2);
  }
  if (fmt === 'percent1') {
    r = roundDec(Number((x * 100).toPrecision(12)), 1); s = r.q.toString().padStart(2, '0');
    return (r.neg ? '-' : '') + s.slice(0, -1) + '.' + s.slice(-1) + '%';
  }
  r = roundDec(x, 6); s = r.q.toString().padStart(7, '0');
  var fp = s.slice(-6).replace(/0+$/, '');
  return (r.neg ? '-' : '') + s.slice(0, -6) + (fp ? '.' + fp : '');
}
function G(x) { return fmtNumber(x, 'general'); }
function display(v, fmt) {
  if (v === null) return '';
  if (typeof v === 'number') return fmtNumber(v, fmt);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'string') return v;
  return v.err;
}
function kindOf(v) {
  if (v === null) return 'empty';
  if (typeof v === 'number') return 'number';
  if (typeof v === 'boolean') return 'logical';
  if (typeof v === 'string') return 'text';
  return 'error';
}

var ENTRY_RE = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
function entryNumber(t) {
  if (!ENTRY_RE.test(t)) return null;
  var pct = t.charAt(t.length - 1) === '%';
  var x = Number(pct ? t.slice(0, -1) : t);
  if (pct) x = x / 100;
  if (!isFinite(x)) return null;
  x = Number(x.toPrecision(12));
  if (!isFinite(x) || Math.abs(x) >= 1e15) return null;
  return x === 0 ? 0 : x;
}

/* ----- references ----- */
function colIdx(ref) {
  if (ref.col.length !== 1) return -1;
  var i = COLS.indexOf(ref.col);
  return i;
}
function rowIdx(ref) {
  if (ref.row.length > 2) return -1;
  var n = Number(ref.row);
  return n >= 1 && n <= NR ? n - 1 : -1;
}
function inGrid(ref) { return colIdx(ref) >= 0 && rowIdx(ref) >= 0; }
function fmtRef(r) { return (r.cabs ? '$' : '') + r.col + (r.rabs ? '$' : '') + r.row; }
function cmpKey(a, b) { return a.length !== b.length ? a.length - b.length : (a < b ? -1 : a > b ? 1 : 0); }
function normRange(a, b) {
  var c1 = { col: a.col, cabs: a.cabs }, c2 = { col: b.col, cabs: b.cabs };
  var r1 = { row: a.row, rabs: a.rabs }, r2 = { row: b.row, rabs: b.rabs }, t;
  if (cmpKey(c1.col, c2.col) > 0) { t = c1; c1 = c2; c2 = t; }
  if (cmpKey(r1.row, r2.row) > 0) { t = r1; r1 = r2; r2 = t; }
  return [{ col: c1.col, cabs: c1.cabs, row: r1.row, rabs: r1.rabs },
          { col: c2.col, cabs: c2.cabs, row: r2.row, rabs: r2.rabs }];
}

/* ----- tokenizer ----- */
var NUM_RE = /(?:\d+(?:\.\d+)?|\.\d+)/y, WORD_RE = /[A-Za-z0-9$]+/y;
var REF_RE = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/, NAME_RE = /^[A-Za-z0-9]+$/;
var ONE = '+-*/^&%=<>(),:';
function tokenize(s) {
  var toks = [], i = 0, n = s.length, m, ch;
  while (i < n) {
    ch = s.charAt(i);
    if (ch === ' ') { i++; continue; }
    if ((ch >= '0' && ch <= '9') || ch === '.') {
      NUM_RE.lastIndex = i; m = NUM_RE.exec(s);
      if (!m) return null;
      toks.push({ t: 'num', text: m[0] }); i += m[0].length; continue;
    }
    if (ch === '"') {
      var j = i + 1, val = '', closed = false, st = j;
      while (j < n) {
        if (s.charAt(j) === '"') {
          val += s.slice(st, j);
          if (s.charAt(j + 1) === '"') { val += '"'; j += 2; st = j; }
          else { closed = true; j++; break; }
        } else j++;
      }
      if (!closed) return null;
      toks.push({ t: 'str', text: s.slice(i, j), val: val }); i = j; continue;
    }
    if ((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || ch === '$') {
      WORD_RE.lastIndex = i; m = WORD_RE.exec(s);
      var w = m[0], up = w.toUpperCase(); i += w.length;
      if (up === 'TRUE' || up === 'FALSE') { toks.push({ t: 'bool', text: up, val: up === 'TRUE' }); continue; }
      var rm = REF_RE.exec(w);
      if (rm) {
        var ref = { col: rm[2].toUpperCase(), cabs: rm[1] === '$', row: rm[4].replace(/^0+(?=\d)/, ''), rabs: rm[3] === '$' };
        toks.push({ t: 'ref', ref: ref, text: fmtRef(ref) }); continue;
      }
      if (NAME_RE.test(w)) { toks.push({ t: 'name', text: up }); continue; }
      return null;
    }
    if (ch === '#') {
      if (s.substr(i, 5).toUpperCase() === '#REF!') { toks.push({ t: 'referr', text: '#REF!' }); i += 5; continue; }
      return null;
    }
    var two = s.substr(i, 2);
    if (two === '<>' || two === '<=' || two === '>=') { toks.push({ t: 'op', text: two }); i += 2; continue; }
    if (ONE.indexOf(ch) >= 0) { toks.push({ t: 'op', text: ch }); i++; continue; }
    return null;
  }

}

/* ----- parser ----- */
var CMP = { '=': 1, '<>': 1, '<': 1, '<=': 1, '>': 1, '>=': 1 };
var SYN = { syntax: true };
var parseCache = new Map();
function parse(raw) {
  var c = parseCache.get(raw);
  if (c) return c;
  try { c = parseUncached(raw); } catch (e) { c = { valid: false }; }
  if (parseCache.size > 4000) parseCache.clear();
  parseCache.set(raw, c);
  return c;
}
function parseUncached(raw) {
  var toks = tokenize(raw.slice(1));
  if (!toks || !toks.length) return { valid: false };
  var pos = 0, len = toks.length;
  function isOp(o) { return pos < len && toks[pos].t === 'op' && toks[pos].text === o; }
  function expr() {
    var l = concat();
    while (pos < len && toks[pos].t === 'op' && CMP[toks[pos].text] === 1) {
      var op = toks[pos++].text; l = { k: 'bin', op: op, l: l, r: concat() };
    }
    return l;
  }
  function concat() {
    var l = sum();
    while (isOp('&')) { pos++; l = { k: 'bin', op: '&', l: l, r: sum() }; }
    return l;
  }
  function sum() {
    var l = product();
    while (isOp('+') || isOp('-')) { var op = toks[pos++].text; l = { k: 'bin', op: op, l: l, r: product() }; }
    return l;
  }
  function product() {
    var l = signed();
    while (isOp('*') || isOp('/')) { var op = toks[pos++].text; l = { k: 'bin', op: op, l: l, r: signed() }; }
    return l;
  }
  function signed() {
    if (isOp('-') || isOp('+')) { var op = toks[pos++].text; return { k: 'un', op: op, e: signed() }; }
    return power();
  }
  function power() {
    var l = percent();
    if (isOp('^')) { pos++; return { k: 'bin', op: '^', l: l, r: signed() }; }
    return l;
  }

    var p = primary();
    while (isOp('%')) { pos++; p = { k: 'pct', e: p }; }
    return p;
  }
  function primary() {
    if (pos >= len) throw SYN;
    var t = toks[pos];
    switch (t.t) {
      case 'num': pos++; return { k: 'val', v: norm(Number(t.text)) };
      case 'str': pos++; return { k: 'val', v: t.val };
      case 'bool': pos++; return { k: 'val', v: t.val };
      case 'referr': pos++; return { k: 'referr' };

        pos++;

        var c1 = colIdx(t.range[0]), c2 = colIdx(t.range[1]), r1 = rowIdx(t.range[0]), r2 = rowIdx(t.range[1]);

      }

}
/* Writes the canonical form; mapRef / mapRange rewrite the references inside the grid (null = removed). */
function write(toks, mapRef, mapRange) {
  var out = '=', i, t, r;
  for (i = 0; i < toks.length; i++) {
    t = toks[i];
    if (t.skip) continue;
    if (t.range) {
      if (!mapRange || !inGrid(t.range[0]) || !inGrid(t.range[1])) out += fmtRef(t.range[0]) + ':' + fmtRef(t.range[1]);
      else {
        r = mapRange(t.range[0], t.range[1]);
        if (r) { r = normRange(r[0], r[1]); out += fmtRef(r[0]) + ':' + fmtRef(r[1]); }
        else out += '#REF!';
      }
    } else if (t.t === 'ref') {
      if (!mapRef || !inGrid(t.ref)) out += fmtRef(t.ref);

function rewrite(raw, mapRef, mapRange) {
  if (raw.charAt(0) !== '=') return raw;
  var p = parse(raw);
  return p.valid ? write(p.toks, mapRef, mapRange) : raw;

  return s;

/* axis helpers: 1-based position of a reference part */
function getAx(ref, isRow) { return isRow ? rowIdx(ref) + 1 : colIdx(ref) + 1; }
function setAx(ref, isRow, n) {
  return isRow ? { col: ref.col, cabs: ref.cabs, row: String(n), rabs: ref.rabs }
               : { col: COLS.charAt(n - 1), cabs: ref.cabs, row: ref.row, rabs: ref.rabs };
}
function insertMaps(isRow, at) {
  var lim = isRow ? NR : NC;
  function sh(n) { return n < at ? n : n + 1; }
  return [function (ref) {
    var n = sh(getAx(ref, isRow));
    return n > lim ? null : setAx(ref, isRow, n);
  }, function (a, b) {
    var t = sh(getAx(a, isRow)), e = sh(getAx(b, isRow));
    if (t > lim) return null;
    if (e > lim) e = lim;
    return [setAx(a, isRow, t), setAx(b, isRow, e)];
  }];
}
function deleteMaps(isRow, at) {
  return [function (ref) {
    var n = getAx(ref, isRow);
    if (n === at) return null;
    return n < at ? ref : setAx(ref, isRow, n - 1);
  }, function (a, b) {
    var t = getAx(a, isRow), e = getAx(b, isRow);
    if (at > e) return [a, b];
    if (at < t) return [setAx(a, isRow, t - 1), setAx(b, isRow, e - 1)];
    if (t === e) return null;
    return [a, setAx(b, isRow, e - 1)];
  }];
}
function pasteMaps(dc, dr) {
  function mv(ref) {
    var c = colIdx(ref) + (ref.cabs ? 0 : dc), r = rowIdx(ref) + (ref.rabs ? 0 : dr);
    if (c < 0 || c >= NC || r < 0 || r >= NR) return null;
    return { col: COLS.charAt(c), cabs: ref.cabs, row: String(r + 1), rabs: ref.rabs };
  }
  return [mv, function (a, b) {
    var x = mv(a), y = mv(b);
    return x && y ? [x, y] : null;
  }];
}

/* ----- evaluation ----- */
var cellGet = null;
function toNum(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v === null) return 0;
  if (typeof v === 'string') return E('#VALUE!');
  return v;
}
function toText(v) {
  if (typeof v === 'string') return v;
  if (typeof v === 'number') return G(v);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (v === null) return '';
  return v;
}
function toBool(v) {
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  if (v === null) return false;
  if (typeof v === 'string') return E('#VALUE!');
  return v;
}

    r = s.r1 + i; c = s.c1 + j;
    if (r >= NR || c >= NC) continue;
    raw = b.rows[i][j].raw;
    if (maps) raw = rewrite(raw, maps[0], maps[1]);
    raws[r * NC + c] = raw; fmts[r * NC + c] = b.rows[i][j].fmt;
  }
  if (b.mode === 'cut') clipboard = null;
  anchor = active = s.r1 * NC + s.c1;
  record(before); render();
}
function structure(isRow, insert) {
  var before = snap(), at = isRow ? Math.floor(active / NC) : active % NC;
  var lim = isRow ? NR : NC, other = isRow ? NC : NR, o, p;
  function ix(p, o) { return isRow ? p * NC + o : o * NC + p; }
  for (o = 0; o < other; o++) {
    if (insert) {
      for (p = lim - 1; p > at; p--) { raws[ix(p, o)] = raws[ix(p - 1, o)]; fmts[ix(p, o)] = fmts[ix(p - 1, o)]; }
      raws[ix(at, o)] = ''; fmts[ix(at, o)] = 'general';
    } else {
      for (p = at; p < lim - 1; p++) { raws[ix(p, o)] = raws[ix(p + 1, o)]; fmts[ix(p, o)] = fmts[ix(p + 1, o)]; }
      raws[ix(lim - 1, o)] = ''; fmts[ix(lim - 1, o)] = 'general';
    }
  }
  var maps = insert ? insertMaps(isRow, at + 1) : deleteMaps(isRow, at + 1);
  for (o = 0; o < N; o++) if (raws[o].charAt(0) === '=') raws[o] = rewrite(raws[o], maps[0], maps[1]);
  record(before); render();
}
function guard(fn) { return function () { if (!editing) fn(); }; }
btn['undo-button'].addEventListener('click', guard(undo));
btn['redo-button'].addEventListener('click', guard(redo));
btn['copy-button'].addEventListener('click', guard(function () { takeBlock('copy'); }));
btn['cut-button'].addEventListener('click', guard(function () { takeBlock('cut'); }));
btn['paste-button'].addEventListener('click', guard(paste));
btn['clear-button'].addEventListener('click', guard(clearSel));
btn['insert-row'].addEventListener('click', guard(function () { structure(true, true); }));
btn['delete-row'].addEventListener('click', guard(function () { structure(true, false); }));
btn['insert-col'].addEventListener('click', guard(function () { structure(false, true); }));
btn['delete-col'].addEventListener('click', guard(function () { structure(false, false); }));
fmtSel.addEventListener('change', function () {
  if (editing) return;
  var f = fmtSel.value, list = selCells(), any = false, i;
  if (f !== 'general' && f !== 'fixed2' && f !== 'percent1') { render(); return; }
  for (i = 0; i < list.length; i++) if (fmts[list[i]] !== f) any = true;
  if (any) {
    var before = snap();
    for (i = 0; i < list.length; i++) fmts[list[i]] = f;
    record(before);
  }
  render();
});

render();
})();
</script>
