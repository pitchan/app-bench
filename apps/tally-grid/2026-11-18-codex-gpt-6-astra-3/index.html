function controls(){for(let b of document.querySelectorAll('.toolbar button,.toolbar select'))b.disabled=editing; $('undo-button').disabled=editing||!undo.length;$('redo-button').disabled=editing||!redo.length;$('paste-button').disabled=editing||!clipboard;input.dataset.editing=String(editing)}
function render(){values=calculate();let ids=selected(),set=new Set(ids);for(let i=0;i<96;i++){let el=cellEls[i],v=values[i];el.textContent=display(v,sheet[i].format);el.dataset.kind=v.t;el.dataset.inSelection=String(set.has(i));el.setAttribute('aria-selected',String(i===active))}let q=rect();$('name-box').textContent=ids.length===1?address(active):address(q.t*8+q.l)+':'+address(q.b*8+q.r);if(!editing){input.value=sheet[active].raw;format.value=sheet[active].format}let ns=ids.map(i=>values[i]).filter(v=>v.t==='number'),s=ns.reduce((x,y)=>x+y.v,0),summary=$('selection-summary');summary.hidden=!ns.length;summary.textContent=ns.length?'Sum: '+display(num(s))+' | Average: '+display(num(s/ns.length))+' | Count: '+ns.length:'';controls()}
function commit(){if(!editing)return false;let raw=input.value,p=parse(raw);if(p)raw=p.raw;editing=false;if(raw===sheet[active].raw)return false;sheet[active].raw=raw;return true}function move(dr,dc,extend=false){let r=Math.max(0,Math.min(11,Math.floor(active/8)+dr)),c=Math.max(0,Math.min(7,active%8+dc));active=r*8+c;if(!extend)anchor=active}
input.addEventListener('input',()=>{editing=true;controls()});input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus({preventScroll:true})}else if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();let before=snapshot(),changed=commit();move(e.key==='Enter'?1:0,e.key==='Tab'?1:0);if(changed)record(before);render()}});
function action(name){if(editing)return;let before=snapshot(),changed=false;if(name==='undo'||name==='redo'){let source=name==='undo'?undo:redo,target=name==='undo'?redo:undo;if(source.length){let s=source.pop();target.push(s);restore(name==='undo'?s.before:s.after)}render();return}if(name==='copy'||name==='cut'){clipboard={mode:name,rect:rect(),cells:selected().map(i=>({i,...clone(sheet[i])}))};render();return}if(name==='clear'){for(let i of selected()){if(sheet[i].raw!=='')changed=true;sheet[i].raw=''}}else if(name==='format'){for(let i of selected()){if(sheet[i].format!==format.value)changed=true;sheet[i].format=format.value}}else if(name==='paste'){if(!clipboard)return;let q=rect(),clip=clipboard;if(clip.mode==='cut')for(let x of clip.cells)sheet[x.i]=emptyCell();for(let x of clip.cells){let r=Math.floor(x.i/8)-clip.rect.t+q.t,c=x.i%8-clip.rect.l+q.l;if(r>11||c>7)continue;sheet[r*8+c]={raw:clip.mode==='copy'?rewrite(x.raw,'paste',null,0,q.l-clip.rect.l,q.t-clip.rect.t):x.raw,format:x.format}}active=anchor=q.t*8+q.l;if(clip.mode==='cut')clipboard=null;changed=true}else if(/^(insert|delete)-/.test(name)){let[mode,kind]=name.split('-'),axis=kind==='row'?'r':'c',pos=axis==='r'?Math.floor(active/8):active%8,old=clone(sheet);for(let i=0;i<96;i++){let r=Math.floor(i/8),c=i%8,n=axis==='r'?r:c,src=n;if(mode==='insert'){if(n===pos)src=-1;else if(n>pos)src=n-1}else if(n>=pos)src=n+1;sheet[i]=src<0||src>=(axis==='r'?12:8)?emptyCell():clone(old[axis==='r'?src*8+c:r*8+src])}for(let cell of sheet)cell.raw=rewrite(cell.raw,mode,axis,pos+1);changed=true}if(changed)record(before);render()}
for(let b of document.querySelectorAll('button'))b.onclick=()=>action(b.dataset.testid.replace('-button',''));format.onchange=()=>action('format');grid.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),arrows={arrowup:[-1,0],arrowdown:[1,0],arrowleft:[0,-1],arrowright:[0,1]},history=e.ctrlKey&&(k==='z'||k==='y');if(!arrows[k]&&!['delete','backspace','enter'].includes(k)&&!history)return;e.preventDefault();if(k==='enter'){input.focus();return}if(editing)return;if(arrows[k]){move(...arrows[k],e.shiftKey);render();cellEls[active].scrollIntoView({block:'nearest',inline:'nearest'})}else if(history)action(k==='z'?'undo':'redo');else action('clear')});render();
</script></body>
