<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;padding:12px;background:#f8fafc;color:#111827;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:100%;overflow-x:hidden}
[hidden]{display:none!important}
h1{margin:0 0 10px;font-size:20px;font-weight:700;color:#0f172a}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
button,select,input{font:inherit;color:#111827}
button{background:#eef2f7;border:1px solid #6b7280;border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){background:#dbe4ef}
button:disabled,select:disabled{color:#6b7280;background:#e5e7eb;border-color:#d1d5db;cursor:default}
select{background:#fff;border:1px solid #6b7280;border-radius:6px;padding:5px 6px}
.fbar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
#name-box{flex:0 0 auto;min-width:64px;padding:5px 8px;background:#fff;border:1px solid #6b7280;border-radius:6px;text-align:center;font-weight:600;color:#111827}
#formula-input{flex:1 1 auto;min-width:0;padding:5px 8px;background:#fff;border:1px solid #6b7280;border-radius:6px}
button:focus,select:focus,input:focus{outline:3px solid #1d4ed8;outline-offset:1px}
.gridwrap{max-width:100%;overflow-x:auto;border:1px solid #6b7280;border-radius:6px;background:#fff}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:748px;background:#fff}
#grid:focus{outline:3px solid #1d4ed8;outline-offset:-3px}
th,td{height:28px;padding:0 6px;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{background:#e2e8f0;color:#111827;font-weight:600;text-align:center;user-select:none}
th.corner{width:44px;padding:0}
td{background:#fff;color:#111827;cursor:cell;text-align:left}
td[data-kind=number]{text-align:right;font-variant-numeric:tabular-nums}
td[data-kind=error]{color:#9b1c1c}
td[data-in-selection=true]{background:#dbeafe}
td[aria-selected=true]{background:#bfdbfe;box-shadow:inset 0 0 0 2px #1d4ed8}
#selection-summary{margin-top:10px;padding:6px 10px;background:#e0f2fe;color:#0c1f33;border-radius:6px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Sonnet 5.5</h1></header>
<main>
<div class="toolbar" data-testid="toolbar">
<button type="button" data-testid="undo-button">Undo</button>
<button type="button" data-testid="redo-button">Redo</button>
<button type="button" data-testid="copy-button">Copy</button>
<button type="button" data-testid="cut-button">Cut</button>
<button type="button" data-testid="paste-button">Paste</button>
<button type="button" data-testid="clear-button">Clear</button>
<button type="button" data-testid="insert-row">Insert row</button>
<button type="button" data-testid="delete-row">Delete row</button>
<button type="button" data-testid="insert-col">Insert column</button>
<button type="button" data-testid="delete-col">Delete column</button>
<select data-testid="format-select" aria-label="Number format">
<option value="general">General</option>
<option value="fixed2">1,234.50</option>
<option value="percent1">12.5%</option>
</select>
</div>
<div class="fbar">
<div id="name-box" data-testid="name-box">A1</div>
<input id="formula-input" data-testid="formula-input" type="text" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
</div>
<div class="gridwrap" id="wrap">
<table id="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></table>
</div>
<div id="selection-summary" data-testid="selection-summary" hidden></div>
</main>
<script>

    if (a.t === "ref") return inside(a) ? { cells: [idxOf(a)], rows: 1, cols: 1 } : { err: ERR.REF };
    if (a.t === "range") {
      if (!inside(a.a) || !inside(a.b)) return { err: ERR.REF };
      const c1 = Math.min(colNum(a.a.cs), colNum(a.b.cs)), c2 = Math.max(colNum(a.a.cs), colNum(a.b.cs));
      const r1 = Math.min(Number(a.a.rs), Number(a.b.rs)), r2 = Math.max(Number(a.a.rs), Number(a.b.rs));
      const cells = [];
      for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) cells.push((r - 1) * NC + c - 1);
      return { cells, rows: r2 - r1 + 1, cols: c2 - c1 + 1, multi: true };
    }
    return null;
  }

  function aggregate(name, args) {
    let sum = 0, n = 0, mn = Infinity, mx = -Infinity, count = 0;
    const add = x => { sum += x; n++; if (x < mn) mn = x; if (x > mx) mx = x; };
    for (const a of args) {
      const rg = asRange(a);
      if (rg) {
        if (rg.err) return rg.err;
        for (const i of rg.cells) {
          const rec = cellRec(i);
          if (isErr(rec.v)) return rec.v;
          if (name === "COUNTA") { if (!rec.empty) count++; }
          else if (typeof rec.v === "number") { if (name === "COUNT") count++; else add(rec.v); }
        }
      } else {
        const v = ev(a);
        if (isErr(v)) return v;
        if (name === "COUNTA") count++;
        else if (name === "COUNT") { if (typeof v === "number") count++; }
        else { const x = toNum(v); if (isErr(x)) return x; add(x); }
      }
    }
    switch (name) {
      case "SUM": return numRes(sum);
      case "AVERAGE": return n === 0 ? ERR.DIV0 : numRes(sum / n);
      case "MIN": return numRes(n ? mn : 0);
      case "MAX": return numRes(n ? mx : 0);
      default: return count;
    }
  }

  function criterion(v) {
    if (typeof v === "number" || typeof v === "boolean") return { op: "=", val: v };
    if (v === BLANK) return { op: "=", val: "" };
    const m = /^(>=|<=|<>|>|<|=)/.exec(v);
    if (!m) return { op: "=", val: v };
    const rest = v.slice(m[0].length);
    const num = entryNum(rest);
    let val;
    if (num !== null) val = num;
    else if (rest.toUpperCase() === "TRUE") val = true;
    else if (rest.toUpperCase() === "FALSE") val = false;
    else val = rest;
    return { op: m[0], val };
  }
  function matches(v, c) {
    const same = typeRank(v) === typeRank(c.val);
    const eq = same && cmpVals(v, c.val) === 0;
    switch (c.op) {
      case "=": return eq;
      case "<>": return !eq;
    }
    if (!same) return false;
    const r = cmpVals(v, c.val);
    return c.op === "<" ? r < 0 : c.op === "<=" ? r <= 0 : c.op === ">" ? r > 0 : r >= 0;
  }
  function condAgg(name, args) {
    const rg = asRange(args[0]);
    if (!rg) return ERR.VALUE;
    let sr = null;
    if (name === "SUMIF") { sr = asRange(args[2]); if (!sr) return ERR.VALUE; }
    if (rg.err) return rg.err;
    if (sr && sr.err) return sr.err;
    if (sr && (sr.rows !== rg.rows || sr.cols !== rg.cols)) return ERR.VALUE;
    const cv = ev(args[1]);
    if (isErr(cv)) return cv;
    const crit = criterion(cv);
    let count = 0, sum = 0;
    for (let p = 0; p < rg.cells.length; p++) {
      const rec = cellRec(rg.cells[p]);
      if (isErr(rec.v)) return rec.v;
      if (rec.empty) continue;
      if (!matches(rec.v, crit)) continue;
      if (name === "COUNTIF") count++;
      else {
        const s = cellRec(sr.cells[p]);
        if (isErr(s.v)) return s.v;
        if (typeof s.v === "number") sum += s.v;
      }
    }
    return name === "COUNTIF" ? count : numRes(sum);
  }

  function call(n) {
    const ar = ARITY[n.name];
    if (!ar) return ERR.NAME;
    const args = n.args;
    if (args.length < ar[0] || args.length > ar[1]) return ERR.ARGS;
    switch (n.name) {
      case "SUM": case "AVERAGE": case "MIN": case "MAX": case "COUNT": case "COUNTA":
        return aggregate(n.name, args);
      case "ROUND": {
        const x = ev(args[0]); if (isErr(x)) return x;
        const xn = toNum(x); if (isErr(xn)) return xn;
        const d = ev(args[1]); if (isErr(d)) return d;
        const di = toInt(d); if (isErr(di)) return di;
        if (di < -9 || di > 9) return ERR.NUM;
        return numRes(decRound(xn, di));
      }
      case "ABS": case "INT": {
        const x = ev(args[0]); if (isErr(x)) return x;
        const xn = toNum(x); if (isErr(xn)) return xn;
        return numRes(n.name === "ABS" ? Math.abs(xn) : Math.floor(xn));
      }
      case "MOD": {
        const a = ev(args[0]); if (isErr(a)) return a;
        const an = toNum(a); if (isErr(an)) return an;
        const b = ev(args[1]); if (isErr(b)) return b;
        const bn = toNum(b); if (isErr(bn)) return bn;
        if (bn === 0) return ERR.DIV0;
        return numRes(an - bn * Math.floor(an / bn));
      }
      case "IF": {
        const c = ev(args[0]); if (isErr(c)) return c;
        const cl = toLogical(c); if (isErr(cl)) return cl;
        return ev(cl ? args[1] : args[2]);
      }
      case "AND": case "OR": {
        let acc = n.name === "AND";
        for (const a of args) {
          const v = ev(a); if (isErr(v)) return v;
          const l = toLogical(v); if (isErr(l)) return l;
          if (n.name === "AND") acc = acc && l; else acc = acc || l;
        }
        return acc;
      }
      case "NOT": {
        const v = ev(args[0]); if (isErr(v)) return v;
        const l = toLogical(v); return isErr(l) ? l : !l;
      }
      case "IFERROR": {
        const v = ev(args[0]);
        return isErr(v) ? ev(args[1]) : v;
      }
      case "ISERROR": return isErr(ev(args[0]));
      case "ISBLANK": {
        const rg = asRange(args[0]);
        if (rg) {
          if (rg.err) return rg.err;
          if (args[0].t === "range") return ERR.VALUE;
          return cellRec(rg.cells[0]).empty;
        }
        const v = ev(args[0]);
        return isErr(v) ? v : false;
      }
      case "LEN": case "UPPER": {
        const v = ev(args[0]); if (isErr(v)) return v;
        const t = toText(v);
        return n.name === "LEN" ? t.length : t.toUpperCase();
      }
      case "LEFT": case "RIGHT": {
        const v = ev(args[0]); if (isErr(v)) return v;
        const t = toText(v);
        const c = ev(args[1]); if (isErr(c)) return c;
        const k = toInt(c); if (isErr(k)) return k;
        if (k < 0) return ERR.VALUE;
        return n.name === "LEFT" ? t.slice(0, k) : (k === 0 ? "" : t.slice(-k));
      }
      case "MID": {
        const v = ev(args[0]); if (isErr(v)) return v;
        const t = toText(v);
        const sv = ev(args[1]); if (isErr(sv)) return sv;
        const s = toInt(sv); if (isErr(s)) return s;
        const cv = ev(args[2]); if (isErr(cv)) return cv;
        const k = toInt(cv); if (isErr(k)) return k;
        if (s < 1 || k < 0) return ERR.VALUE;
        return t.substr(s - 1, k);
      }
      case "CONCAT": {
        let out = "";
        for (const a of args) {
          const rg = asRange(a);
          if (rg) {
            if (rg.err) return rg.err;
            for (const i of rg.cells) { const v = cellRec(i).v; if (isErr(v)) return v; out += toText(v); }
          } else {
            const v = ev(a); if (isErr(v)) return v;
            out += toText(v);
          }
        }
        return out;
      }
      case "COUNTIF": case "SUMIF": return condAgg(n.name, args);
    }
    return ERR.NAME;
  }

  function ev(n) {
    switch (n.t) {
      case "num": return numRes(Number(n.text));
      case "str": return n.v;
      case "bool": return n.v;
      case "referr": return ERR.REF;
      case "ref": return inside(n) ? cellVal(idxOf(n)) : ERR.REF;
      case "range": return ERR.VALUE;
      case "name": return ERR.NAME;
      case "paren": return ev(n.e);
      case "un": {
        const v = ev(n.e); if (isErr(v)) return v;
        const x = toNum(v); if (isErr(x)) return x;
        return numRes(n.op === "-" ? -x : x);
      }
      case "pct": {
        const v = ev(n.e); if (isErr(v)) return v;
        const x = toNum(v); if (isErr(x)) return x;
        return numRes(x / 100);
      }
      case "bin": {
        const l = ev(n.l); if (isErr(l)) return l;
        const r = ev(n.r); if (isErr(r)) return r;
        const op = n.op;
        if (op === "&") return toText(l) + toText(r);
        if (op === "=" || op === "<>" || op === "<" || op === "<=" || op === ">" || op === ">=") {
          const c = cmpVals(l, r);
          return op === "=" ? c === 0 : op === "<>" ? c !== 0 : op === "<" ? c < 0 : op === "<=" ? c <= 0 : op === ">" ? c > 0 : c >= 0;
        }
        const a = toNum(l); if (isErr(a)) return a;
        const b = toNum(r); if (isErr(b)) return b;
        switch (op) {
          case "+": return numRes(a + b);
          case "-": return numRes(a - b);
          case "*": return numRes(a * b);
          case "/": return b === 0 ? ERR.DIV0 : numRes(a / b);
          case "^":
            if (a === 0 && b === 0) return ERR.NUM;
            if (a === 0 && b < 0) return ERR.DIV0;
            if (a < 0 && !Number.isInteger(b)) return ERR.NUM;
            return numRes(Math.pow(a, b));
        }
        return ERR.VALUE;
      }
      case "call": return call(n);
    }
    return ERR.VALUE;
  }

  const out = [];
  for (let i = 0; i < sheet.length; i++) {
    try { out.push(cellRec(i)); }
    catch (e) { out.push({ empty: false, v: ERR.VALUE }); }
  }
  return out;
}

/* ---------- state ---------- */
const emptyCell = () => ({ raw: "", fmt: "general" });
let sheet = Array.from({ length: NR * NC }, emptyCell);
let anchor = { r: 0, c: 0 }, active = { r: 0, c: 0 };
let editing = false;
let clip = null;
let hist = [], pos = 0;

const $ = id => document.querySelector('[data-testid="' + id + '"]');
const gridEl = $("grid"), input = $("formula-input"), nameBox = $("name-box"), summary = $("selection-summary"), fmtSel = $("format-select");
const btn = {};
for (const id of ["undo-button", "redo-button", "copy-button", "cut-button", "paste-button", "clear-button", "insert-row", "delete-row", "insert-col", "delete-col"]) btn[id] = $(id);

const addrOf = (r, c) => String.fromCharCode(65 + c) + (r + 1);
const sel = () => ({ r0: Math.min(anchor.r, active.r), r1: Math.max(anchor.r, active.r), c0: Math.min(anchor.c, active.c), c1: Math.max(anchor.c, active.c) });

function snap() {
  return { raws: sheet.map(c => c.raw), fmts: sheet.map(c => c.fmt), a: { ...anchor }, f: { ...active } };
}
function restore(s) {
  sheet = s.raws.map((raw, i) => ({ raw, fmt: s.fmts[i] }));
  anchor = { ...s.a }; active = { ...s.f };
}
function perform(fn) {
  const before = snap();
  let changed = false;
  try { changed = fn(); } finally {
    if (changed) {
      hist.length = pos;
      hist.push({ before, after: snap() });
      if (hist.length > 20) hist.shift();
      pos = hist.length;
    }
    render();
  }
}

/* ---------- build grid ---------- */
const cellEls = [];
(function build() {
  const head = document.createElement("tr");
  head.setAttribute("role", "row");
  const corner = document.createElement("th");
  corner.className = "corner";
  corner.setAttribute("role", "presentation");
  head.appendChild(corner);
  for (let c = 0; c < NC; c++) {
    const th = document.createElement("th");
    th.setAttribute("role", "columnheader");
    th.dataset.testid = "col-header-" + String.fromCharCode(65 + c);
    th.textContent = String.fromCharCode(65 + c);
    head.appendChild(th);
  }
  const thead = document.createElement("thead");
  thead.appendChild(head);
  gridEl.appendChild(thead);
  const tbody = document.createElement("tbody");
  for (let r = 0; r < NR; r++) {
    const tr = document.createElement("tr");
    tr.setAttribute("role", "row");
    const th = document.createElement("th");
    th.setAttribute("role", "rowheader");
    th.dataset.testid = "row-header-" + (r + 1);
    th.textContent = String(r + 1);
    tr.appendChild(th);
    for (let c = 0; c < NC; c++) {
      const td = document.createElement("td");
      td.setAttribute("role", "gridcell");
      td.dataset.testid = "cell-" + addrOf(r, c);
      td.dataset.r = r; td.dataset.c = c;
      td.dataset.kind = "empty";
      td.setAttribute("aria-selected", "false");
      td.dataset.inSelection = "false";
      tr.appendChild(td);
      cellEls.push(td);
    }
    tbody.appendChild(tr);
  }
  gridEl.appendChild(tbody);
  // data-testid attributes (dataset.testid maps to data-testid)
})();

/* ---------- render ---------- */
function setAttr(el, k, v) { if (el.getAttribute(k) !== v) el.setAttribute(k, v); }
function render() {
  const recs = computeAll(sheet);
  const s = sel();
  let n = 0, sum = 0;
  for (let i = 0; i < cellEls.length; i++) {
    const el = cellEls[i], rec = recs[i], v = rec.v;
    const r = Math.floor(i / NC), c = i % NC;
    let text, kind;
    if (rec.empty) { text = ""; kind = "empty"; }
    else if (isErr(v)) { text = v.c; kind = "error"; }
    else if (typeof v === "number") { text = fmtNum(v, sheet[i].fmt); kind = "number"; }
    else if (typeof v === "boolean") { text = v ? "TRUE" : "FALSE"; kind = "logical"; }
    else { text = v; kind = "text"; }
    if (el.textContent !== text) el.textContent = text;
    setAttr(el, "data-kind", kind);
    const isActive = r === active.r && c === active.c;
    const inSel = r >= s.r0 && r <= s.r1 && c >= s.c0 && c <= s.c1;
    setAttr(el, "aria-selected", isActive ? "true" : "false");
    setAttr(el, "data-in-selection", inSel ? "true" : "false");
    if (inSel && kind === "number") { n++; sum += v; }
  }
  nameBox.textContent = (s.r0 === s.r1 && s.c0 === s.c1) ? addrOf(s.r0, s.c0) : addrOf(s.r0, s.c0) + ":" + addrOf(s.r1, s.c1);
  if (n > 0) {
    const ss = numRes(sum), aa = numRes(sum / n);
    summary.textContent = "Sum: " + (isErr(ss) ? "#NUM!" : fmtGeneral(ss)) + " | Average: " + (isErr(aa) ? "#NUM!" : fmtGeneral(aa)) + " | Count: " + n;
    summary.hidden = false;
  } else { summary.hidden = true; summary.textContent = ""; }
  setAttr(input, "data-editing", editing ? "true" : "false");
  if (!editing) {
    const cur = sheet[active.r * NC + active.c];
    if (input.value !== cur.raw) input.value = cur.raw;
    fmtSel.value = cur.fmt;
  }
  for (const id in btn) btn[id].disabled = editing;
  fmtSel.disabled = editing;
  if (!editing) {
    btn["undo-button"].disabled = pos === 0;
    btn["redo-button"].disabled = pos === hist.length;
    btn["paste-button"].disabled = !clip;
  } else btn["paste-button"].disabled = true;
}

/* ---------- actions ---------- */
function canonicalRaw(s) {
  if (s === "") return "";
  if (s[0] === "=") { const a = parseFormula(s); return a ? "=" + ser(a) : s; }
  return s;
}
function commitEdit() {
  const raw = canonicalRaw(input.value);
  editing = false;
  const cell = sheet[active.r * NC + active.c];
  if (cell.raw === raw) return false;
  cell.raw = raw;
  return true;
}
function setSel(r, c, extend) {
  active = { r, c };
  if (!extend) anchor = { r, c };
}
function moveCollapse(dr, dc) {
  active = { r: Math.min(NR - 1, active.r + dr), c: Math.min(NC - 1, active.c + dc) };
  anchor = { ...active };
}
function clickCell(td, shift) {
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (editing) perform(() => { const ch = commitEdit(); setSel(r, c, shift); return ch; });
  else { setSel(r, c, shift); render(); }
  gridEl.focus({ preventScroll: true });
}
gridEl.addEventListener("click", e => {
  const td = e.target.closest("td");
  if (td && gridEl.contains(td)) clickCell(td, e.shiftKey);
});

function doClear() {
  const s = sel();
  let any = false;
  for (let r = s.r0; r <= s.r1; r++) for (let c = s.c0; c <= s.c1; c++) if (sheet[r * NC + c].raw !== "") any = true;
  if (!any) return;
  perform(() => {
    for (let r = s.r0; r <= s.r1; r++) for (let c = s.c0; c <= s.c1; c++) sheet[r * NC + c].raw = "";
    return true;
  });
}
function doUndo() { if (editing || pos === 0) return; pos--; restore(hist[pos].before); render(); }
function doRedo() { if (editing || pos === hist.length) return; restore(hist[pos].after); pos++; render(); }

function takeBlock(mode) {
  const s = sel();
  const cells = [];
  for (let r = s.r0; r <= s.r1; r++) {
    const row = [];
    for (let c = s.c0; c <= s.c1; c++) { const x = sheet[r * NC + c]; row.push({ raw: x.raw, fmt: x.fmt }); }
    cells.push(row);
  }
  clip = { mode, cells, r0: s.r0, c0: s.c0 };
  render();
}
function doPaste() {
  if (!clip) return;
  const s = sel();
  perform(() => {
    const b = clip;
    if (b.mode === "cut") {
      for (let i = 0; i < b.cells.length; i++) for (let j = 0; j < b.cells[i].length; j++) sheet[(b.r0 + i) * NC + b.c0 + j] = emptyCell();
    }
    const dr = s.r0 - b.r0, dc = s.c0 - b.c0;
    for (let i = 0; i < b.cells.length; i++) {
      for (let j = 0; j < b.cells[i].length; j++) {
        const r = s.r0 + i, c = s.c0 + j;
        if (r >= NR || c >= NC) continue;
        const src = b.cells[i][j];
        let raw = src.raw;
        if (b.mode === "copy" && raw[0] === "=") {
          const a = parseFormula(raw);
          if (a) raw = "=" + ser(rewritePaste(a, dc, dr));
        }
        sheet[r * NC + c] = { raw, fmt: src.fmt };
      }
    }
    if (b.mode === "cut") clip = null;
    anchor = { r: s.r0, c: s.c0 }; active = { ...anchor };
    return true;
  });
}
function structure(kind) {
  perform(() => {
    const axis = kind[1] === "r" ? "row" : "col";
    const ins = kind[0] === "i";
    const kk = axis === "row" ? active.r : active.c;
    for (const cell of sheet) {
      if (cell.raw[0] !== "=") continue;
      const a = parseFormula(cell.raw);
      if (a) cell.raw = "=" + ser(rewriteStruct(a, axis, kk + 1, ins));
    }
    const old = sheet;
    const ns = new Array(NR * NC);
    for (let r = 0; r < NR; r++) {
      for (let c = 0; c < NC; c++) {
        let sr = r, sc = c, blank = false;
        const p = axis === "row" ? r : c, L = axis === "row" ? NR : NC;
        let q;
        if (ins) { if (p < kk) q = p; else if (p === kk) { blank = true; q = p; } else q = p - 1; }
        else { if (p < kk) q = p; else if (p < L - 1) q = p + 1; else { blank = true; q = p; } }
        if (axis === "row") sr = q; else sc = q;
        ns[r * NC + c] = blank ? emptyCell() : old[sr * NC + sc];
      }
    }
    sheet = ns;
    return true;
  });
}
function applyFormat(f) {
  const s = sel();
  let any = false;
  for (let r = s.r0; r <= s.r1; r++) for (let c = s.c0; c <= s.c1; c++) if (sheet[r * NC + c].fmt !== f) any = true;
  if (!any) { render(); return; }
  perform(() => {
    for (let r = s.r0; r <= s.r1; r++) for (let c = s.c0; c <= s.c1; c++) sheet[r * NC + c].fmt = f;
    return true;
  });
}

btn["undo-button"].addEventListener("click", doUndo);
btn["redo-button"].addEventListener("click", doRedo);
btn["copy-button"].addEventListener("click", () => { if (!editing) takeBlock("copy"); });
btn["cut-button"].addEventListener("click", () => { if (!editing) takeBlock("cut"); });
btn["paste-button"].addEventListener("click", () => { if (!editing) doPaste(); });
btn["clear-button"].addEventListener("click", () => { if (!editing) doClear(); });
btn["insert-row"].addEventListener("click", () => { if (!editing) structure("ir"); });
btn["delete-row"].addEventListener("click", () => { if (!editing) structure("dr"); });
btn["insert-col"].addEventListener("click", () => { if (!editing) structure("ic"); });
btn["delete-col"].addEventListener("click", () => { if (!editing) structure("dc"); });
fmtSel.addEventListener("change", () => { if (!editing) applyFormat(fmtSel.value); });

/* ---------- keyboard ---------- */
const ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
gridEl.addEventListener("keydown", e => {
  const k = e.key, lk = k.length === 1 ? k.toLowerCase() : k;
  const isArrow = k in ARROWS;
  const isCtrl = (e.ctrlKey && !e.altKey) && (lk === "z" || lk === "y");
  if (!(isArrow || k === "Delete" || k === "Backspace" || k === "Enter" || isCtrl)) return;
  e.preventDefault();
  if (k === "Enter") { input.focus(); return; }
  if (editing) return;
  if (isArrow) {
    const [dr, dc] = ARROWS[k];
    const r = Math.max(0, Math.min(NR - 1, active.r + dr)), c = Math.max(0, Math.min(NC - 1, active.c + dc));
    setSel(r, c, e.shiftKey);
    render();
    const td = cellEls[r * NC + c], w = document.getElementById("wrap");
    if (td.offsetLeft < w.scrollLeft + 44) w.scrollLeft = Math.max(0, td.offsetLeft - 44);
    else if (td.offsetLeft + td.offsetWidth > w.scrollLeft + w.clientWidth) w.scrollLeft = td.offsetLeft + td.offsetWidth - w.clientWidth;
  } else if (k === "Delete" || k === "Backspace") doClear();
  else if (lk === "z") doUndo();
  else if (lk === "y") doRedo();
});

input.addEventListener("input", () => {
  if (!editing) { editing = true; render(); }
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey)) {
    e.preventDefault();
    const down = e.key === "Enter";
    perform(() => {
      let ch = false;
      if (editing) ch = commitEdit();
      moveCollapse(down ? 1 : 0, down ? 0 : 1);
      return ch;
    });
  } else if (e.key === "Escape") {
    e.preventDefault();
    editing = false;
    render();
    gridEl.focus({ preventScroll: true });
  }
});

render();
</script>
</body>
</html>
