<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
  :root { --ink:#1e293b; --muted:#475569; --line:#cbd5e1; --head:#eef2f7; --sel:#dbeafe; --act:#bfdbfe; --accent:#1d4ed8; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#ffffff; color:var(--ink); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background:#ffffff; padding:12px 16px 4px; }
  header h1 { margin:0; font-size:20px; font-weight:650; color:var(--ink); }
  main { padding:8px 16px 24px; max-width:100%; }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px; background:#ffffff; }
  .toolbar button, .toolbar select { font:inherit; color:var(--ink); background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  .toolbar button:hover:not(:disabled) { background:#e2e8f0; }
  .toolbar button:disabled, .toolbar select:disabled { color:#94a3b8; cursor:default; }
  .sep { width:1px; height:22px; background:var(--line); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
  .fbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .name-box { min-width:72px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#f8fafc; color:var(--ink); font-weight:600; font-family:ui-monospace, Consolas, monospace; white-space:nowrap; }
  .fbar input { flex:1; min-width:0; font:14px ui-monospace, Consolas, monospace; color:var(--ink); background:#ffffff; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .fbar input[data-editing="true"] { border-color:var(--accent); background:#ffffff; }
  .wrap { overflow-x:auto; max-width:100%; border:1px solid var(--line); border-radius:6px; background:#ffffff; }
  table.grid { border-collapse:collapse; table-layout:fixed; width:max-content; background:#ffffff; }
  table.grid:focus { outline:none; }
  table.grid:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; }
  .grid th { background:var(--head); color:var(--muted); font-weight:600; border:1px solid var(--line); padding:3px 4px; text-align:center; }
  .grid th.rh { width:40px; }
  .grid td { width:124px; max-width:124px; height:28px; border:1px solid var(--line); padding:2px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:#ffffff; color:var(--ink); cursor:cell; user-select:none; }
  .grid td.corner { width:40px; background:var(--head); }
  .grid td[data-kind="number"] { text-align:right; }
  .grid td[data-kind="logical"] { text-align:center; }
  .grid td[data-kind="error"] { color:#a61b1b; text-align:center; }
  .grid td[data-in-selection="true"] { background:var(--sel); }
  .grid td[aria-selected="true"] { background:var(--act); box-shadow:inset 0 0 0 2px var(--accent); }
  table.grid:focus-visible td[aria-selected="true"] { box-shadow:inset 0 0 0 3px #0f172a; }
  .summary { margin-top:10px; padding:6px 10px; background:#f1f5f9; color:var(--ink); border-radius:6px; display:inline-block; font-variant-numeric:tabular-nums; }
  .summary[hidden] { display:none; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <select data-testid="format-select" aria-label="Number format">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="fbar">
    <div class="name-box" data-testid="name-box">A1</div>
    <input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="wrap"><table class="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></table></div>
  <div class="summary" data-testid="selection-summary" hidden></div>
</main>
<script>

    if (nd.k === 'ref') { if (!inGrid(nd.ref)) return E('#REF!'); var p = rc(nd.ref); return { list: [p.r * COLS + p.c], h: 1, w: 1 }; }

    var a = rc(nd.a), b = rc(nd.b);
    return { list: cellsOfRange(nd.a, nd.b), h: Math.abs(a.r - b.r) + 1, w: Math.abs(a.c - b.c) + 1 };
  }
  var ARITY = { SUM: [1, Infinity], AVERAGE: [1, Infinity], MIN: [1, Infinity], MAX: [1, Infinity], COUNT: [1, Infinity], COUNTA: [1, Infinity],

    var name = nd.name, args = nd.args;
    if (!Object.prototype.hasOwnProperty.call(ARITY, name)) return E('#NAME?');
    var ar = ARITY[name];
    if (args.length < ar[0] || args.length > ar[1]) return E('#ARGS!');
    var v, w, x, i, j;
    switch (name) {
      case 'SUM': case 'AVERAGE': case 'MIN': case 'MAX': case 'COUNT': case 'COUNTA': {
        var contrib = [], count = 0;
        for (i = 0; i < args.length; i++) {
          var a = args[i];
          if (isRangeArg(a)) {
            var rg = rangeCells(a); if (rg.t === 'e') return rg;

              var cv = cellValue(rg.list[j]);

      case 'UPPER': v = toText(evalNode(args[0])); return v.t === 'e' ? v : { t: 's', v: v.v.toUpperCase() };
      case 'LEFT': case 'RIGHT':

      case 'CONCAT': {
        var out = '';
        for (i = 0; i < args.length; i++) {

            for (j = 0; j < rr.list.length; j++) { var c2 = cellValue(rr.list[j]); if (c2.t === 'e') return c2; out += toText(c2).v; }

      case 'COUNTIF': case 'SUMIF': {
        var isSum = name === 'SUMIF';

        var R2 = null;
        if (isSum) { R2 = rangeCells(args[2]); if (R2.t === 'e') return R2; if (R2.h !== R1.h || R2.w !== R1.w) return E('#VALUE!'); }

        var op = '=', operand;

        else if (crit.t === 'blank') operand = { t: 's', v: '' };
        else {

          if (isEmpty(R1.list[j])) continue;

}

/* ---------- rewriting ---------- */
function rewriteRaw(raw, fRef, fRange) {

  var f = parseFormula(raw); if (!f) return raw;

}

}

    if (n < k) return ref; if (n === k) return null; return withPos(ref, axis, n - 1);

      if (t2 > lim) return null;
      return [withPos(a, axis, t2), withPos(b, axis, Math.min(b2, lim))];
    }
    if (k > bb) return [a, b];
    if (k < t) return [withPos(a, axis, t - 1), withPos(b, axis, bb - 1)];

}

/* ---------- UI state ---------- */
var sel = { ar: 0, ac: 0, r: 0, c: 0 };
var editing = false, undoStack = [], redoStack = [], clip = null;
function q(id) { return document.querySelector('[data-testid="' + id + '"]'); }
var grid = q('grid'), input = q('formula-input'), nameBox = q('name-box'), fmtSel = q('format-select'), summary = q('selection-summary');
var btn = {};
['undo-button', 'redo-button', 'copy-button', 'cut-button', 'paste-button', 'clear-button', 'insert-row', 'delete-row', 'insert-col', 'delete-col'].forEach(function (k) { btn[k] = q(k); });

var cellEls = [];
(function build() {
  var hr = document.createElement('tr'); hr.setAttribute('role', 'row');
  var corner = document.createElement('td'); corner.setAttribute('role', 'presentation'); corner.className = 'corner'; hr.appendChild(corner);
  for (var c = 0; c < COLS; c++) { var th = document.createElement('th'); th.setAttribute('role', 'columnheader'); th.setAttribute('data-testid', 'col-header-' + LET[c]); th.textContent = LET[c]; hr.appendChild(th); }
  var thead = document.createElement('thead'); thead.appendChild(hr); grid.appendChild(thead);
  var tb = document.createElement('tbody');
  for (var r = 0; r < ROWS; r++) {
    var tr = document.createElement('tr'); tr.setAttribute('role', 'row');
    var rh = document.createElement('th'); rh.className = 'rh'; rh.setAttribute('role', 'rowheader'); rh.setAttribute('data-testid', 'row-header-' + (r + 1)); rh.textContent = r + 1; tr.appendChild(rh);
    for (c = 0; c < COLS; c++) {
      var td = document.createElement('td'); td.setAttribute('role', 'gridcell'); td.setAttribute('data-testid', 'cell-' + addr(r, c)); td.dataset.i = r * COLS + c;
      tr.appendChild(td); cellEls.push(td);
    }
    tb.appendChild(tr);
  }
  grid.appendChild(tb);
})();

function rect() { return { r0: Math.min(sel.ar, sel.r), r1: Math.max(sel.ar, sel.r), c0: Math.min(sel.ac, sel.c), c1: Math.max(sel.ac, sel.c) }; }
function rectCells(R) { var o = []; for (var r = R.r0; r <= R.r1; r++) for (var c = R.c0; c <= R.c1; c++) o.push(r * COLS + c); return o; }
function snap() { return { cells: cells.map(function (x) { return { raw: x.raw, fmt: x.fmt }; }), sel: { ar: sel.ar, ac: sel.ac, r: sel.r, c: sel.c } }; }
function restore(s) { cells = s.cells.map(function (x) { return { raw: x.raw, fmt: x.fmt }; }); sel = { ar: s.sel.ar, ac: s.sel.ac, r: s.sel.r, c: s.sel.c }; }
function record(before) {

  if (undoStack.length > 20) undoStack.shift();
  redoStack = [];
}

function render() {
  var R = rect();
  for (var i = 0; i < cellEls.length; i++) {
    var el = cellEls[i], v = values[i], r = Math.floor(i / COLS), c = i % COLS, txt, kind;
    if (cells[i].raw === '') { txt = ''; kind = 'empty'; }
    else {
      kind = { n: 'number', s: 'text', b: 'logical', e: 'error', blank: 'number' }[v.t];
      txt = v.t === 'n' ? fmtNumber(v.v, cells[i].fmt) : v.t === 's' ? v.v : v.t === 'b' ? (v.v ? 'TRUE' : 'FALSE') : v.t === 'e' ? v.v : '';
    }
    if (el.textContent !== txt) el.textContent = txt;
    el.setAttribute('data-kind', kind);
    el.setAttribute('aria-selected', r === sel.r && c === sel.c ? 'true' : 'false');
    el.setAttribute('data-in-selection', r >= R.r0 && r <= R.r1 && c >= R.c0 && c <= R.c1 ? 'true' : 'false');
  }
  nameBox.textContent = R.r0 === R.r1 && R.c0 === R.c1 ? addr(sel.r, sel.c) : addr(R.r0, R.c0) + ':' + addr(R.r1, R.c1);

  input.setAttribute('data-editing', editing ? 'true' : 'false');
  if (!editing) { if (input.value !== active.raw) input.value = active.raw; fmtSel.value = active.fmt; }
  btn['undo-button'].disabled = editing || !undoStack.length;
  btn['redo-button'].disabled = editing || !redoStack.length;
  btn['paste-button'].disabled = editing || !clip;
  ['copy-button', 'cut-button', 'clear-button', 'insert-row', 'delete-row', 'insert-col', 'delete-col'].forEach(function (k) { btn[k].disabled = editing; });
  fmtSel.disabled = editing;
  // summary

  list.forEach(function (i) { if (cells[i].raw !== '' && values[i].t === 'n') { sum += values[i].v; n++; } });
  if (n) {
    var sTxt = N(sum), aTxt = N(sum / n);
    summary.textContent = 'Sum: ' + (sTxt.t === 'n' ? G(sTxt.v) : '#NUM!') + ' | Average: ' + (aTxt.t === 'n' ? G(aTxt.v) : '#NUM!') + ' | Count: ' + n;
    summary.hidden = false;
  } else { summary.hidden = true; summary.textContent = ''; }
}
function changed() { recalc(); render(); }

/* commit returns before-snapshot when a change occurred */
function commitIfEditing() {
  if (!editing) return null;
  editing = false;
  var raw = commitRaw(input.value), i = sel.r * COLS + sel.c;
  if (raw === cells[i].raw) return null;
  var before = snap();
  cells[i].raw = raw;
  recalc();
  return before;
}
function moveTo(r, c, extend) {
  r = Math.max(0, Math.min(ROWS - 1, r)); c = Math.max(0, Math.min(COLS - 1, c));
  sel.r = r; sel.c = c;
  if (!extend) { sel.ar = r; sel.ac = c; }
}

/* ---------- events ---------- */
grid.addEventListener('mousedown', function (e) { if (e.target.closest('td[role="gridcell"]')) e.preventDefault(); });
grid.addEventListener('click', function (e) {
  var td = e.target.closest('td[role="gridcell"]'); if (!td) return;
  var i = +td.dataset.i, before = commitIfEditing();

  if (before) record(before);
  grid.focus({ preventScroll: true });
  render();
});
grid.addEventListener('keydown', function (e) {
  var k = e.key, lk = k.length === 1 ? k.toLowerCase() : k, ctrl = e.ctrlKey || e.metaKey;
  var arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  var handled = arrows[k] || k === 'Delete' || k === 'Backspace' || k === 'Enter' || (ctrl && (lk === 'z' || lk === 'y'));

    var before = commitIfEditing();
    if (e.key === 'Enter') moveTo(sel.r + 1, sel.c, false); else moveTo(sel.r, sel.c + 1, false);

});
function doClear() {

}

btn['undo-button'].addEventListener('click', doUndo);
btn['redo-button'].addEventListener('click', doRedo);
btn['copy-button'].addEventListener('click', function () { if (!editing) takeBlock('copy'); });
btn['cut-button'].addEventListener('click', function () { if (!editing) takeBlock('cut'); });
btn['paste-button'].addEventListener('click', doPaste);
btn['clear-button'].addEventListener('click', doClear);
btn['insert-row'].addEventListener('click', function () { doStruct('row', true); });
btn['delete-row'].addEventListener('click', function () { doStruct('row', false); });
btn['insert-col'].addEventListener('click', function () { doStruct('col', true); });
btn['delete-col'].addEventListener('click', function () { doStruct('col', false); });
fmtSel.addEventListener('change', function () {
  if (editing) return;
  var f = fmtSel.value, list = rectCells(rect());
  if (list.every(function (i) { return cells[i].fmt === f; })) { render(); return; }
  var before = snap();
  list.forEach(function (i) { cells[i].fmt = f; });
  record(before); changed();

})();
