<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #f4f5f7;
  color: #111827;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.4;
}
[hidden] { display: none !important; }
header {
  background: #1e293b;
  color: #ffffff;
  padding: 10px 16px;
}
header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
main { max-width: 1240px; margin: 0 auto; padding: 12px; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  background: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px;
}
.toolbar .sep { width: 1px; height: 24px; background: #d1d5db; margin: 0 2px; }
button, select, input { font: inherit; }
.toolbar button, .toolbar select {
  min-height: 34px; padding: 4px 10px;
  background: #ffffff; color: #111827;
  border: 1px solid #6b7280; border-radius: 6px;
  outline: 2px none transparent;
}
.toolbar button { cursor: pointer; }
.toolbar button:hover:not(:disabled) { background: #e5e7eb; }
.toolbar button:disabled, .toolbar select:disabled {
  color: #6b7280; background: #f3f4f6; border-color: #d1d5db; cursor: default;
}
.fmt { display: inline-flex; align-items: center; gap: 6px; color: #111827; }
.fmt label { white-space: nowrap; }
.toolbar button:focus, .toolbar select:focus, #formula-input:focus {
  outline: 3px solid #c2410c; outline-offset: 1px;
}
.fbar {
  display: flex; gap: 8px; align-items: flex-end; margin-top: 10px;
}
.name-box {
  flex: 0 0 auto; min-width: 84px; height: 36px; padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  background: #ffffff; color: #111827; border: 1px solid #6b7280; border-radius: 6px;
  font-weight: 600; font-variant-numeric: tabular-nums;
}
.fin { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fin label { font-size: 12px; color: #374151; }
#formula-input {
  width: 100%; height: 36px; padding: 0 8px;
  background: #ffffff; color: #111827; border: 1px solid #6b7280; border-radius: 6px;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  outline: 2px none transparent;
}
#formula-input[data-editing="true"] { border-color: #1d4ed8; background: #fffbeb; }
.wrap {
  margin-top: 10px; overflow-x: auto; overflow-y: hidden;
  background: #ffffff; border: 1px solid #9ca3af; border-radius: 8px;
}
.grid {
  display: table; table-layout: fixed; border-collapse: separate; border-spacing: 0;
  width: 100%; min-width: 780px;
  outline: 3px none transparent; outline-offset: -3px;
  user-select: none; -webkit-user-select: none; cursor: cell;
}
.grid:focus { outline: 3px solid #c2410c; }
.row { display: table-row; }
.ch, .rh, .corner, .cell {
  display: table-cell; height: 32px; vertical-align: middle;
  border-right: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db;
  white-space: nowrap; overflow: hidden;
}
.ch, .rh, .corner {
  background: #e5e7eb; color: #1f2937; text-align: center; font-weight: 600; cursor: default;
}
.corner, .rh { width: 44px; position: sticky; left: 0; z-index: 1; }
.cell {
  background: #ffffff; color: #111827; padding: 0 6px; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.cell[data-kind="number"] { text-align: right; }
.cell[data-kind="logical"] { text-align: center; }
.cell[data-kind="error"] { color: #a3001b; text-align: center; font-weight: 600; }
.cell[data-in-selection="true"] { background: #dbeafe; }
.cell[aria-selected="true"] { background: #ffffff; box-shadow: inset 0 0 0 2px #1d4ed8; }
.grid:focus .cell[aria-selected="true"] { background: #fff7ed; box-shadow: inset 0 0 0 3px #c2410c; }
.summary {
  margin-top: 10px; padding: 8px 10px;
  background: #ffffff; color: #111827; border: 1px solid #d1d5db; border-radius: 8px;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
@media (max-width: 480px) {
  main { padding: 8px; }
  .toolbar .sep { display: none; }
}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Fable 5.2</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar" role="toolbar" aria-label="Sheet actions">
    <button type="button" data-testid="undo-button" id="b-undo" disabled>Undo</button>
    <button type="button" data-testid="redo-button" id="b-redo" disabled>Redo</button>
    <span class="sep"></span>
    <button type="button" data-testid="copy-button" id="b-copy">Copy</button>
    <button type="button" data-testid="cut-button" id="b-cut">Cut</button>
    <button type="button" data-testid="paste-button" id="b-paste" disabled>Paste</button>
    <button type="button" data-testid="clear-button" id="b-clear">Clear</button>
    <span class="sep"></span>
    <button type="button" data-testid="insert-row" id="b-ir">Insert row</button>
    <button type="button" data-testid="delete-row" id="b-dr">Delete row</button>
    <button type="button" data-testid="insert-col" id="b-ic">Insert column</button>
    <button type="button" data-testid="delete-col" id="b-dc">Delete column</button>
    <span class="sep"></span>
    <span class="fmt">
      <label for="format-select">Number format</label>
      <select data-testid="format-select" id="format-select">
        <option value="general">General</option>
        <option value="fixed2">1,234.50</option>
        <option value="percent1">12.5%</option>
      </select>
    </span>
  </div>
  <div class="fbar">
    <div class="name-box" data-testid="name-box" id="name-box">A1</div>
    <div class="fin">
      <label for="formula-input">Cell content</label>
      <input type="text" data-testid="formula-input" id="formula-input" data-editing="false"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
  </div>
  <div class="wrap" id="wrap">
    <div class="grid" data-testid="grid" id="grid" role="grid" aria-label="Sheet" tabindex="0"></div>
  </div>
  <div class="summary" data-testid="selection-summary" id="summary" hidden></div>
</main>

<script>
var Engine = (function () {
  'use strict';
  var COLS = 8, ROWS = 12, N = COLS * ROWS;

  /* ---------- values ---------- */
  function mkErr(s) { return { e: s }; }
  var E_SYN = mkErr('#SYNTAX!'), E_NAME = mkErr('#NAME?'), E_ARGS = mkErr('#ARGS!'), E_REF = mkErr('#REF!'),
      E_VAL = mkErr('#VALUE!'), E_DIV = mkErr('#DIV/0!'), E_NUM = mkErr('#NUM!'), E_CYC = mkErr('#CYCLE!');
  function isErr(v) { return v !== null && typeof v === 'object' && typeof v.e === 'string'; }

  // normalization with the range rule
  function num(x) {
    if (typeof x !== 'number' || !isFinite(x)) return E_NUM;
    var n = Number(x.toPrecision(12));
    if (Math.abs(n) >= 1e15) return E_NUM;
    return n === 0 ? 0 : n;
  }

  // R(x, d) on the 12 digits of D(x); returns { neg, s } with s the plain writing of |R|
  function roundDigits(x, d) {
    var ex = Math.abs(x).toExponential(11).split('e');
    var I = BigInt(ex[0].replace('.', ''));
    var k = Number(ex[1]) - 11 + d;
    var M;
    if (k >= 0) M = I * (10n ** BigInt(k));
    else { var dv = 10n ** BigInt(-k); M = (I + dv / 2n) / dv; }
    var s = M.toString();
    if (d > 0) { s = s.padStart(d + 1, '0'); s = s.slice(0, s.length - d) + '.' + s.slice(s.length - d); }
    else if (d < 0 && M !== 0n) s += '0'.repeat(-d);
    return { neg: x < 0 && M !== 0n, s: s };
  }
  function general(x) {
    var r = roundDigits(x, 6);
    var s = r.s.replace(/0+$/, '').replace(/\.$/, '');
    return (r.neg ? '-' : '') + s;
  }
  function display(v, f) {
    if (v === null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
    if (isErr(v)) return v.e;
    if (f === 'fixed2') {
      var r = roundDigits(v, 2), p = r.s.split('.');
      return (r.neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+$)/g, ',') + '.' + p[1];
    }
    if (f === 'percent1') {
      var y = Number((v * 100).toPrecision(12));
      if (!isFinite(y)) return '#NUM!';
      var q = roundDigits(y, 1);
      return (q.neg ? '-' : '') + q.s + '%';
    }
    return general(v);
  }
  function kindOf(v) {
    if (v === null) return 'empty';
    if (typeof v === 'number') return 'number';
    if (typeof v === 'string') return 'text';
    if (typeof v === 'boolean') return 'logical';
    return 'error';
  }

  var RE_ENTRY = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
  function entryNumber(t) {
    if (!RE_ENTRY.test(t)) return null;
    var pct = t.charAt(t.length - 1) === '%';
    var x = Number(pct ? t.slice(0, -1) : t);
    if (pct) x = x / 100;
    if (!isFinite(x)) return null;
    var n = Number(x.toPrecision(12));
    if (Math.abs(n) >= 1e15) return null;
    return n === 0 ? 0 : n;
  }

  /* ---------- references ---------- */
  function colNum(s) {
    if (s.length > 3) return 99999;
    var n = 0;
    for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
    return n;
  }
  function colName(n) { return String.fromCharCode(64 + n); }
  function inGrid(t) {
    if (t.row.length > 2) return false;
    var r = Number(t.row), c = colNum(t.col);
    return c >= 1 && c <= COLS && r >= 1 && r <= ROWS;
  }
  function refIdx(t) { return (Number(t.row) - 1) * COLS + colNum(t.col) - 1; }
  function cmpStr(a, b) { return a.length !== b.length ? a.length - b.length : (a < b ? -1 : a > b ? 1 : 0); }
  function normPair(a, b) {
    var t;
    if (cmpStr(a.col, b.col) > 0) { t = a.col; a.col = b.col; b.col = t; t = a.cd; a.cd = b.cd; b.cd = t; }
    if (cmpStr(a.row, b.row) > 0) { t = a.row; a.row = b.row; b.row = t; t = a.rd; a.rd = b.rd; b.rd = t; }
  }

  /* ---------- tokens ---------- */
  var RE_NUM = /(\d+(\.\d+)?|\.\d+)/y, RE_WORD = /[A-Za-z$][A-Za-z0-9$]*/y, RE_REFERR = /#REF!/iy,
      RE_OP = /<>|<=|>=|[-+*\/^&%=<>]/y, RE_ISREF = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/, RE_ISNAME = /^[A-Za-z0-9]+$/;
  function tokenize(src) {
    var out = [], i = 0, n = src.length, m;
    while (i < n) {
      var ch = src.charAt(i);
      if (ch === ' ') { i++; continue; }
      if (ch === '"') {
        var j = i + 1, v = '';
        for (;;) {
          if (j >= n) return null;
          if (src.charAt(j) === '"') {
            if (src.charAt(j + 1) === '"') { v += '"'; j += 2; } else break;
          } else { v += src.charAt(j); j++; }
        }
        out.push({ t: 'str', s: src.slice(i, j + 1), v: v });
        i = j + 1; continue;
      }
      if (ch === '(' || ch === ')' || ch === ',' || ch === ':') { out.push({ t: 'p', s: ch }); i++; continue; }
      RE_NUM.lastIndex = i;
      if ((m = RE_NUM.exec(src))) { out.push({ t: 'num', s: m[0] }); i += m[0].length; continue; }
      RE_WORD.lastIndex = i;
      if ((m = RE_WORD.exec(src))) {
        var w = m[0], up = w.toUpperCase(), r;
        if (up === 'TRUE' || up === 'FALSE') out.push({ t: 'bool', v: up === 'TRUE' });
        else if ((r = RE_ISREF.exec(w))) {
          out.push({ t: 'ref', cd: r[1] === '$', col: r[2].toUpperCase(), rd: r[3] === '$', row: r[4].replace(/^0+(?=\d)/, '') });
        }
        else if (RE_ISNAME.test(w)) out.push({ t: 'name', s: up });
        else return null;
        i += w.length; continue;
      }
      RE_REFERR.lastIndex = i;
      if ((m = RE_REFERR.exec(src))) { out.push({ t: 'referr' }); i += 5; continue; }
      RE_OP.lastIndex = i;
      if ((m = RE_OP.exec(src))) { out.push({ t: 'op', s: m[0] }); i += m[0].length; continue; }
      return null;
    }
    return out;
  }
  function refText(t) { return (t.cd ? '$' : '') + t.col + (t.rd ? '$' : '') + t.row; }
  function tokText(t) {
    switch (t.t) {
      case 'bool': return t.v ? 'TRUE' : 'FALSE';
      case 'ref': return refText(t);
      case 'referr': return '#REF!';
      default: return t.s;
    }
  }
  function isRangeAt(tk, i) {
    return tk[i].t === 'ref' && i + 2 < tk.length && tk[i + 1].t === 'p' && tk[i + 1].s === ':' && tk[i + 2].t === 'ref';
  }

  /* ---------- parser ---------- */
  var CMP = { '=': 1, '<>': 1, '<': 1, '<=': 1, '>': 1, '>=': 1 };
  function parseTokens(tk) {
    var p = 0, SYN = new Error('syntax');
    function isOp(s) { return p < tk.length && tk[p].t === 'op' && tk[p].s === s; }
    function isP(s) { return p < tk.length && tk[p].t === 'p' && tk[p].s === s; }
    function comparison() {
      var l = concat();
      while (p < tk.length && tk[p].t === 'op' && CMP[tk[p].s] === 1) { var op = tk[p++].s; l = { t: 'cmp', op: op, l: l, r: concat() }; }
      return l;
    }
    function concat() {
      var l = sum();
      while (isOp('&')) { p++; l = { t: 'cat', l: l, r: sum() }; }
      return l;
    }
    function sum() {
      var l = product();
      while (isOp('+') || isOp('-')) { var op = tk[p++].s; l = { t: 'ar', op: op, l: l, r: product() }; }
      return l;
    }
    function product() {
      var l = signed();
      while (isOp('*') || isOp('/')) { var op = tk[p++].s; l = { t: 'ar', op: op, l: l, r: signed() }; }
      return l;
    }
    function signed() {
      if (isOp('-') || isOp('+')) { var op = tk[p++].s; return { t: 'un', op: op, x: signed() }; }
      return power();
    }
    function power() {
      var b = percent();
      if (isOp('^')) { p++; return { t: 'ar', op: '^', l: b, r: signed() }; }
      return b;
    }
    function percent() {
      var x = primary();
      while (isOp('%')) { p++; x = { t: 'pct', x: x }; }
      return x;
    }
    function primary() {
      var t = tk[p];
      if (!t) throw SYN;
      switch (t.t) {
        case 'num': p++; return { t: 'lit', v: num(Number(t.s)) };
        case 'str': p++; return { t: 'lit', v: t.v };
        case 'bool': p++; return { t: 'lit', v: t.v };
        case 'referr': p++; return { t: 'referr' };
        case 'ref':
          p++;
          if (isP(':')) {
            var b = tk[p + 1];
            if (!b || b.t !== 'ref') throw SYN;
            p += 2;
            return { t: 'range', a: t, b: b };
          }
          return { t: 'ref', tok: t };
        case 'name':
          p++;
          if (isP('(')) {
            p++;
            var args = [];
            if (isP(')')) { p++; return { t: 'call', name: t.s, args: args }; }
            for (;;) {
              args.push(comparison());
              if (isP(',')) { p++; continue; }
              if (isP(')')) { p++; break; }
              throw SYN;
            }
            return { t: 'call', name: t.s, args: args };
          }
          return { t: 'name' };
        case 'p':
          if (t.s === '(') {
            p++;
            var x = comparison();
            if (!isP(')')) throw SYN;
            p++;
            return { t: 'paren', x: x };
          }
          throw SYN;
        default: throw SYN;
      }
    }
    var ast = comparison();
    if (p !== tk.length) throw SYN;
    return ast;
  }

  function precedents(tk) {
    var set = {}, i, r, c;
    for (i = 0; i < tk.length; i++) {
      if (tk[i].t !== 'ref') continue;
      if (inGrid(tk[i])) set[refIdx(tk[i])] = 1;
      if (isRangeAt(tk, i) && inGrid(tk[i]) && inGrid(tk[i + 2])) {
        var a = tk[i], b = tk[i + 2];
        for (r = Number(a.row); r <= Number(b.row); r++)
          for (c = colNum(a.col); c <= colNum(b.col); c++) set[(r - 1) * COLS + c - 1] = 1;
      }
    }
    return Object.keys(set).map(Number);
  }

  var cache = new Map();
  function analyze(raw) {
    var a = cache.get(raw);
    if (a) return a;
    if (raw === '') a = { k: 'empty' };
    else if (raw.charAt(0) === '=') {
      a = { k: 'formula', valid: false };
      try {
        var tk = tokenize(raw.slice(1));
        if (tk) {
          for (var i = 0; i < tk.length; i++) if (isRangeAt(tk, i)) { normPair(tk[i], tk[i + 2]); i += 2; }
          a.ast = parseTokens(tk);
          a.tk = tk;
          a.canon = '=' + tk.map(tokText).join('');
          a.prec = precedents(tk);
          a.valid = true;
        }
      } catch (e) { a = { k: 'formula', valid: false }; }
    }
    else if (raw.charAt(0) === "'") a = { k: 'val', v: raw.slice(1) };
    else {
      var t = raw.replace(/^ +| +$/g, ''), n = entryNumber(t);
      if (n !== null) a = { k: 'val', v: n };
      else if (/^(true|false)$/i.test(t)) a = { k: 'val', v: t.toUpperCase() === 'TRUE' };
      else a = { k: 'val', v: raw };
    }
    if (cache.size > 4000) cache.clear();
    cache.set(raw, a);
    return a;
  }
  function isValidFormula(raw) { var a = analyze(raw); return a.k === 'formula' && a.valid; }
  function storedRaw(s) { var a = analyze(s); return a.k === 'formula' && a.valid ? a.canon : s; }

  /* ---------- sheet state ---------- */
  var S = {
    raw: new Array(N).fill(''), fmt: new Array(N).fill('general'),
    an: { r: 0, c: 0 }, ac: { r: 0, c: 0 }, clip: null, undo: [], redo: []
  };
  var vals = null, circ = null;

  function recalc() {
    var i, prec = new Array(N);
    for (i = 0; i < N; i++) { var a = analyze(S.raw[i]); prec[i] = a.k === 'formula' && a.valid ? a.prec : null; }
    circ = new Array(N).fill(false);
    for (i = 0; i < N; i++) {
      if (!prec[i] || !prec[i].length) continue;
      var seen = new Uint8Array(N), stack = prec[i].slice(), found = false;
      while (stack.length) {
        var j = stack.pop();
        if (j === i) { found = true; break; }
        if (seen[j]) continue;
        seen[j] = 1;
        if (prec[j]) for (var k = 0; k < prec[j].length; k++) if (!seen[prec[j][k]]) stack.push(prec[j][k]);
      }
      circ[i] = found;
    }
    vals = new Array(N);
  }
  // value of a cell: null for an empty cell
  function cellVal(i) {
    var v = vals[i];
    if (v !== undefined) return v;
    var a = analyze(S.raw[i]);
    if (a.k === 'empty') v = null;
    else if (a.k === 'val') v = a.v;
    else if (!a.valid) v = E_SYN;
    else if (circ[i]) v = E_CYC;
    else {
      try { v = ev(a.ast); } catch (e) { v = E_VAL; }
      if (v === null || v === undefined) v = 0;
    }
    vals[i] = v;
    return v;
  }

  /* ---------- evaluation ---------- */
  function toNum(v) {
    if (typeof v === 'number') return v;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (v === null) return 0;
    return E_VAL;
  }
  function toText(v) {
    if (typeof v === 'string') return v;
    if (typeof v === 'number') return general(v);
    if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
    return '';
  }
  function toBool(v) {
    if (typeof v === 'boolean') return v;
    if (typeof v === 'number') return v !== 0;
    if (v === null) return false;
    return E_VAL;
  }
  function rank(v) { return typeof v === 'number' ? 0 : typeof v === 'string' ? 1 : 2; }
  function blankAs(v, other) {
    if (v !== null) return v;
    if (typeof other === 'string') return '';
    if (typeof other === 'boolean') return false;
    return 0;
  }
  // three-way comparison of two non-blank, non-error values
  function cmp3(l, r) {
    var a = rank(l), b = rank(r);
    if (a !== b) return a < b ? -1 : 1;
    if (a === 1) { l = l.toUpperCase(); r = r.toUpperCase(); }
    return l < r ? -1 : l > r ? 1 : 0;
  }
  function testOp(op, c) {
    switch (op) {
      case '=': return c === 0;
      case '<>': return c !== 0;
      case '<': return c < 0;
      case '<=': return c <= 0;
      case '>': return c > 0;
      default: return c >= 0;
    }
  }
  function arith(op, a, b) {
    switch (op) {
      case '+': return num(a + b);
      case '-': return num(a - b);
      case '*': return num(a * b);
      case '/': return b === 0 ? E_DIV : num(a / b);
      default:
        if (a === 0 && b === 0) return E_NUM;
        if (a === 0 && b < 0) return E_DIV;
        if (a < 0 && !Number.isInteger(b)) return E_NUM;
        return num(Math.pow(a, b));
    }
  }
  function ev(n) {
    var l, r, a, b;
    switch (n.t) {
      case 'lit': return n.v;
      case 'referr': return E_REF;

    if (nameBox.textContent !== nb) nameBox.textContent = nb;
    if (!editing && input.value !== S.raw[act]) input.value = S.raw[act];
    setAttr(input, 'data-editing', editing ? 'true' : 'false');
    if (fsel.value !== S.fmt[act]) fsel.value = S.fmt[act];
    btn.undo.disabled = editing || !S.undo.length;
    btn.redo.disabled = editing || !S.redo.length;
    btn.paste.disabled = editing || !S.clip;
    btn.copy.disabled = btn.cut.disabled = btn.clear.disabled = btn.ir.disabled = btn.dr.disabled =
      btn.ic.disabled = btn.dc.disabled = fsel.disabled = editing;
    var sm = E.summary();
    if (sm === null) { summary.hidden = true; summary.textContent = ''; }
    else { if (summary.textContent !== sm) summary.textContent = sm; summary.hidden = false; }
  }

  // keeps the active cell inside the scrolling area of the grid, without moving the window
  function reveal() {
    var c = cells[E.idx(S.ac.r, S.ac.c)].getBoundingClientRect(), w = wrap.getBoundingClientRect();
    var left = w.left + 44, right = w.left + wrap.clientWidth;
    if (c.left < left) wrap.scrollLeft -= left - c.left;
    else if (c.right > right) wrap.scrollLeft += c.right - right;
  }

  grid.addEventListener('click', function (ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest('[role="gridcell"]') : null;
    if (!t || !grid.contains(t)) return;
    var i = Number(t.getAttribute('data-i')), r = Math.floor(i / COLS), c = i % COLS, shift = ev.shiftKey;
    var sel = function () { E.select(r, c, shift); };
    if (editing) { editing = false; E.commit(input.value, sel); }
    else sel();
    if (document.activeElement !== grid) grid.focus({ preventScroll: true });
    render();
  });

  var ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  grid.addEventListener('keydown', function (ev) {
    var k = ev.key, a = ARROWS[k];
    if (a) {
      ev.preventDefault();
      E.move(a[0], a[1], ev.shiftKey);
      render(); reveal();
    } else if (k === 'Delete' || k === 'Backspace') {
      ev.preventDefault();
      if (!editing) { E.clearSel(); render(); }
    } else if (k === 'Enter') {
      ev.preventDefault();
      input.focus();
    } else if ((ev.ctrlKey || ev.metaKey) && typeof k === 'string' && k.toLowerCase() === 'z') {
      ev.preventDefault();
      if (!editing) { E.undo(); render(); }
    } else if ((ev.ctrlKey || ev.metaKey) && typeof k === 'string' && k.toLowerCase() === 'y') {
      ev.preventDefault();
      if (!editing) { E.redo(); render(); }
    }
  });

  input.addEventListener('input', function () {
    if (!editing) { editing = true; render(); }
  });
  input.addEventListener('keydown', function (ev) {
    var k = ev.key;
    if (k === 'Enter' || (k === 'Tab' && !ev.shiftKey)) {
      ev.preventDefault();
      var mv = function () { if (k === 'Enter') E.move(1, 0, false); else E.move(0, 1, false); };
      if (editing) { editing = false; E.commit(input.value, mv); }
      else mv();
      render(); reveal();
      if (document.activeElement !== input) input.focus();
    } else if (k === 'Escape') {
      ev.preventDefault();
      editing = false;
      render();
      grid.focus({ preventScroll: true });
    }
  });

  function on(b, fn) {
    b.addEventListener('click', function () {
      if (editing || b.disabled) return;
      fn(); render();
    });
  }
  on(btn.undo, function () { E.undo(); });
  on(btn.redo, function () { E.redo(); });
  on(btn.copy, function () { E.take('copy'); });
  on(btn.cut, function () { E.take('cut'); });
  on(btn.paste, function () { E.paste(); });
  on(btn.clear, function () { E.clearSel(); });
  on(btn.ir, function () { E.structure('ir'); });
  on(btn.dr, function () { E.structure('dr'); });
  on(btn.ic, function () { E.structure('ic'); });
  on(btn.dc, function () { E.structure('dc'); });
  fsel.addEventListener('change', function () {
    if (editing) return;
    E.setFormat(fsel.value);
    render();
  });

  render();
})();
</script>
</body>
</html>
