function astDisplay(raw){let a=valid(raw);return a?'='+canonical(a.ast):raw}

function snapshot(){return {sheet:state.map(row=>row.map(x=>({...x}))),anchor:[...anchor],active:[...active]}}function restore(s){for(let r=0;r<12;r++)for(let c=0;c<8;c++)state[r][c]={...s.sheet[r][c]};anchor=[...s.anchor];active=[...s.active];render()}function record(before){undo.push({before,after:snapshot()});if(undo.length>20)undo.shift();redo=[];updateButtons()}function updateButtons(){const editingNow=editing;for(const id of ['undo-button','redo-button','copy-button','cut-button','paste-button','clear-button','insert-row','delete-row','insert-col','delete-col','format-select'])$(id).disabled=editingNow; if(!editingNow){$('undo-button').disabled=!undo.length;$('redo-button').disabled=!redo.length;$('paste-button').disabled=!clip}}
