<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #1a1d23; }
  header { background: #1f3a5f; color: #ffffff; padding: 10px 16px; }
  header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
  main { padding: 12px 16px; max-width: 100%; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .toolbar button, .toolbar select { font: inherit; font-size: 0.9rem; padding: 6px 10px; border: 1px solid #8a94a6; border-radius: 6px; background: #ffffff; color: #1a1d23; cursor: pointer; }
  .toolbar button:hover:not(:disabled) { background: #eef2f8; }
  .toolbar button:disabled, .toolbar select:disabled { color: #8a8f99; background: #eceef1; cursor: default; }
  button:focus, select:focus, input:focus { outline: 3px solid #2563eb; outline-offset: 1px; }
  .fbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .namebox { min-width: 76px; padding: 6px 8px; border: 1px solid #8a94a6; border-radius: 6px; background: #ffffff; color: #1a1d23; font-family: ui-monospace, Consolas, monospace; font-size: 0.9rem; text-align: center; }
  .fbar input { flex: 1; min-width: 0; font: inherit; font-family: ui-monospace, Consolas, monospace; font-size: 0.95rem; padding: 6px 8px; border: 1px solid #8a94a6; border-radius: 6px; background: #ffffff; color: #1a1d23; }
  .fbar input[data-editing="true"] { background: #fffbea; }
  .wrap { overflow-x: auto; max-width: 100%; border: 1px solid #c3c9d4; background: #ffffff; }
  table.sheet { border-collapse: collapse; table-layout: fixed; user-select: none; -webkit-user-select: none; }
  table.sheet:focus { outline: 3px solid #2563eb; outline-offset: -3px; }
  .sheet th { background: #e8ebf0; color: #2b3240; font-weight: 600; font-size: 0.8rem; border: 1px solid #c3c9d4; height: 28px; }
  .sheet th.corner { width: 36px; }
  .sheet th[role="rowheader"] { width: 36px; }
  .sheet td { width: 112px; min-width: 112px; max-width: 112px; height: 28px; padding: 0 6px; border: 1px solid #d5dae2; background: #ffffff; color: #1a1d23; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: cell; }
  .sheet td[data-kind="number"] { text-align: right; font-variant-numeric: tabular-nums; }
  .sheet td[data-kind="logical"] { text-align: center; }
  .sheet td[data-kind="error"] { color: #a01818; }
  .sheet td[data-in-selection="true"] { background: #dbe8fb; }
  .sheet td[aria-selected="true"] { box-shadow: inset 0 0 0 2px #1d4ed8; background: #ffffff; }
  .summary { margin-top: 10px; padding: 6px 10px; background: #ffffff; color: #1a1d23; border: 1px solid #c3c9d4; border-radius: 6px; font-size: 0.9rem; display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
  .summary[hidden] { display: none; }
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <select data-testid="format-select" aria-label="Number format">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="fbar">
    <div class="namebox" data-testid="name-box">A1</div>
    <input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="wrap">
    <table class="sheet" role="grid" aria-label="Sheet" tabindex="0" data-testid="grid"><tbody id="gbody"></tbody></table>
  </div>
  <div class="summary" data-testid="selection-summary" hidden></div>
</main>
<script>
(function () {
  'use strict';
  var COLS = 8, ROWS = 12, LETTERS = 'ABCDEFGH';

  // ---------- values ----------
  function num(v) { return { t: 'n', v: v }; }
  function str(v) { return { t: 's', v: v }; }
  function bool(v) { return { t: 'b', v: v }; }
  function err(v) { return { t: 'e', v: v }; }
  var BLANK = { t: 'blank' };
  function N(x) {
    if (typeof x !== 'number' || !isFinite(x)) return err('#NUM!');

  // ---------- decimal rounding ----------
  function plain(x) {

    if (d >= scale) q = D * (10n ** BigInt(d - scale));

    switch (v.t) {

      case 's': return v.v;
      case 'b': return v.v ? 'TRUE' : 'FALSE';
      case 'e': return v.v;

  function entryNum(t) {

    if (!isFinite(x)) return null;

  }

      e.preventDefault();
      editing = false;
      render();
      grid.focus();
    }
  });
  fmtSel.addEventListener('change', function () { if (!editing) setFormat(fmtSel.value); });
  buttons['undo-button'].addEventListener('click', function () { if (!editing) undo(); });
  buttons['redo-button'].addEventListener('click', function () { if (!editing) redo(); });
  buttons['copy-button'].addEventListener('click', function () { if (!editing) takeBlock('copy'); });
  buttons['cut-button'].addEventListener('click', function () { if (!editing) takeBlock('cut'); });
  buttons['paste-button'].addEventListener('click', function () { if (!editing) paste(); });
  buttons['clear-button'].addEventListener('click', function () { if (!editing) clearSel(); });
  buttons['insert-row'].addEventListener('click', function () { if (!editing) structural(true, true); });
  buttons['delete-row'].addEventListener('click', function () { if (!editing) structural(true, false); });
  buttons['insert-col'].addEventListener('click', function () { if (!editing) structural(false, true); });
  buttons['delete-col'].addEventListener('click', function () { if (!editing) structural(false, false); });

  refresh();
})();
</script>
</body>
</html>
