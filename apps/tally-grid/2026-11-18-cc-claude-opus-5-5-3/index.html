<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
  :root { --ink:#16181d; --muted:#4a5160; --line:#c9ced8; --bg:#f6f7f9; --accent:#1d4ed8; --sel:#dbe6ff; --err:#a3001b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: #ffffff; border-bottom: 1px solid var(--line); padding: 10px 16px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  main { padding: 12px 16px 24px; max-width: 100%; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .toolbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
  button, select { font: inherit; color: var(--ink); background: #ffffff; border: 1px solid #9aa3b2; border-radius: 6px; padding: 5px 10px; min-height: 32px; cursor: pointer; }
  button:hover:not(:disabled), select:hover:not(:disabled) { background: #eef2fb; }
  button:disabled, select:disabled { color: #8a8f99; background: #f0f1f4; border-color: #d3d7de; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .fbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .namebox { flex: 0 0 auto; min-width: 72px; padding: 6px 8px; background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font-family: ui-monospace, Consolas, monospace; text-align: center; }
  .fbar input { flex: 1 1 auto; min-width: 0; font: 14px ui-monospace, Consolas, monospace; color: var(--ink); background: #ffffff; border: 1px solid #9aa3b2; border-radius: 6px; padding: 6px 8px; }
  .fbar input[data-editing="true"] { border-color: var(--accent); background: #fffdf3; }
  .wrap { overflow: auto; max-width: 100%; background: #ffffff; border: 1px solid var(--line); border-radius: 6px; }
  table.sheet { border-collapse: collapse; table-layout: fixed; width: 776px; user-select: none; -webkit-user-select: none; }
  table.sheet:focus { outline: none; }
  table.sheet:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .sheet th, .sheet td { border: 1px solid #dde1e8; height: 28px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet th { background: #eceef2; color: var(--muted); font-weight: 600; font-size: 12px; text-align: center; }
  .sheet th.corner { width: 40px; }
  .sheet thead th { width: 92px; }
  .sheet td { background: #ffffff; color: var(--ink); cursor: cell; }
  .sheet td[data-kind="number"] { text-align: right; font-variant-numeric: tabular-nums; }
  .sheet td[data-kind="logical"], .sheet td[data-kind="error"] { text-align: center; }
  .sheet td[data-kind="error"] { color: var(--err); font-weight: 600; }
  .sheet td[data-in-selection="true"] { background: var(--sel); }
  .sheet td[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
  table.sheet:focus-visible td[aria-selected="true"] { box-shadow: inset 0 0 0 3px #0b2a8a; }
  .summary { margin-top: 10px; padding: 6px 10px; background: #ffffff; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; display: inline-block; font-variant-numeric: tabular-nums; }
  .summary[hidden] { display: none; }
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <select data-testid="format-select" aria-label="Number format">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="fbar">
    <div class="namebox" data-testid="name-box">A1</div>
    <input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="wrap"><table class="sheet" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></table></div>
  <div class="summary" data-testid="selection-summary" hidden></div>
</main>
<script>
"use strict";

function Rnum(x, d) { const p = parts(x, d); return Number((p.neg ? "-" : "") + p.ip + "." + (p.fp || "0")); }
function fmtGeneral(x) {

}
function groupInt(s) { return s.replace(/\B(?=(\d{3})+$)/g, ","); }

// ---------- references ----------
function colNum(l) { let n = 0; for (const ch of l) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }

}

    }
