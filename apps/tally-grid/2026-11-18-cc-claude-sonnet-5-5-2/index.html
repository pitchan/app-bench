<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f4f8;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding:10px 12px 24px;max-width:100%;overflow-x:hidden}
header{margin:0 0 10px}
h1{margin:0;font-size:20px;color:#1e3a8a}
main{min-width:0;display:block}
[hidden]{display:none!important}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
button,select,input{font:inherit;color:#111827}
button{background:#e5e9f2;border:1px solid #9aa3b5;border-radius:6px;padding:6px 10px;cursor:pointer;min-height:34px}
button:hover:not(:disabled){background:#d3dbec}
button:disabled,select:disabled{cursor:not-allowed;color:#4b5563;background:#eceef3}
select{background:#fff;border:1px solid #9aa3b5;border-radius:6px;padding:6px;min-height:34px}
label.fmt{display:inline-flex;align-items:center;gap:6px;color:#111827}
button:focus,select:focus,input:focus,table:focus{outline:3px solid #1a56db;outline-offset:2px}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.namebox{min-width:84px;padding:6px 8px;background:#fff;border:1px solid #9aa3b5;border-radius:6px;font-weight:600;text-align:center;color:#111827}
#formula-input{flex:1;min-width:0;padding:6px 8px;background:#fff;border:1px solid #9aa3b5;border-radius:6px;min-height:34px}
.gridwrap{max-width:100%;overflow-x:auto;border:1px solid #9aa3b5;background:#fff;border-radius:6px}
table{border-collapse:collapse;table-layout:fixed;width:712px;user-select:none;-webkit-user-select:none}
th,td{border:1px solid #c3c9d6;height:32px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
th{background:#e8ebf2;color:#1f2937;font-weight:600;text-align:center}
th.corner{width:40px;background:#e8ebf2}
th[role=columnheader]{width:84px}
th[role=rowheader]{width:40px}
td{background:#fff;color:#111827;cursor:cell;text-align:left}
td[data-kind=number]{text-align:right}
td[data-kind=logical]{text-align:center}
td[data-kind=error]{color:#9b1c1c;text-align:center}
td[data-in-selection=true]{background:#d6e4ff}
td[aria-selected=true]{background:#fff6c9;outline:2px solid #1a56db;outline-offset:-2px}
.summary{margin-top:8px;padding:6px 10px;background:#fff;border:1px solid #9aa3b5;border-radius:6px;color:#111827;display:inline-block}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Sonnet 5.5</h1></header>
<main>
<div class="toolbar" data-testid="toolbar" role="toolbar" aria-label="Toolbar">
<button type="button" data-testid="undo-button">Undo</button>
<button type="button" data-testid="redo-button">Redo</button>
<button type="button" data-testid="copy-button">Copy</button>
<button type="button" data-testid="cut-button">Cut</button>
<button type="button" data-testid="paste-button">Paste</button>
<button type="button" data-testid="clear-button">Clear</button>
<button type="button" data-testid="insert-row">Insert row</button>
<button type="button" data-testid="delete-row">Delete row</button>
<button type="button" data-testid="insert-col">Insert column</button>
<button type="button" data-testid="delete-col">Delete column</button>
<label class="fmt">Number format
<select data-testid="format-select">
<option value="general">General</option>
<option value="fixed2">1,234.50</option>
<option value="percent1">12.5%</option>
</select></label>
</div>
<div class="fbar">
<div class="namebox" data-testid="name-box">A1</div>
<input type="text" id="formula-input" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
</div>
<div class="gridwrap"><table role="grid" aria-label="Sheet" tabindex="0" data-testid="grid" id="grid"></table></div>
<div class="summary" data-testid="selection-summary" hidden></div>
</main>
<script>
(function(){
'use strict';
var NC=8,NR=12;
function ERR(c){return {t:'e',v:c};}
var BLANK={t:'b'};
function N(x){var y=Number(x.toPrecision(12));return y===0?0:y;}
function mkNum(x){if(!isFinite(x))return ERR('#NUM!');var y=N(x);if(Math.abs(y)>=1e15)return ERR('#NUM!');return {t:'n',v:y};}

/* ---------- decimal rounding ---------- */
function dec(x){
  var s=Math.abs(x).toPrecision(12),I,F;
  var m=/^(\d)(?:\.(\d+))?e([+-]\d+)$/.exec(s);
  if(m){
    var digs=m[1]+(m[2]||''),e=parseInt(m[3],10);
    if(e>=0){I=digs+'0'.repeat(Math.max(0,e+1-digs.length));F='';if(e+1<digs.length){I=digs.slice(0,e+1);F=digs.slice(e+1);}}
    else{I='0';F='0'.repeat(-e-1)+digs;}
  }else{
    var p=s.split('.');I=p[0];F=p[1]||'';
  }
  return {S:I+F,f:F.length};
}
function inc(K){
  var a=K.split(''),i=a.length-1;
  while(i>=0){if(a[i]==='9'){a[i]='0';i--;}else{a[i]=String(+a[i]+1);return a.join('');}}
  return '1'+a.join('');
}
function roundD(x,d){
  var q=dec(x),S=q.S,drop=q.f-d,K;
  if(drop<=0)K=S+'0'.repeat(-drop);
  else{
    var keep=S.length-drop,digit=keep>=0?S[keep]:'0';
    K=keep>0?S.slice(0,keep):'0';
    if(digit>='5')K=inc(K);
  }
  K=K.replace(/^0+(?=\d)/,'');
  return {K:K,zero:/^0*$/.test(K),neg:x<0};
}
function fmtFixed(x,d){
  var r=roundD(x,d),K=r.K;
  if(K.length<=d)K='0'.repeat(d+1-K.length)+K;
  return {neg:r.neg&&!r.zero,int:K.slice(0,K.length-d),frac:K.slice(K.length-d)};
}
function roundVal(x,d){
  if(d>=0){var g=fmtFixed(x,d);return Number((g.neg?'-':'')+g.int+(g.frac?'.'+g.frac:''));}
  var r=roundD(x,d);
  return Number((r.neg&&!r.zero?'-':'')+r.K+'0'.repeat(-d));
}
function G(x){
  var g=fmtFixed(x,6),fr=g.frac.replace(/0+$/,'');
  return (g.neg?'-':'')+g.int+(fr?'.'+fr:'');
}
function fmtNumber(x,f){
  if(f==='fixed2'){var g=fmtFixed(x,2);return (g.neg?'-':'')+g.int.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+g.frac;}
  if(f==='percent1'){var h=fmtFixed(N(x*100),1);return (h.neg?'-':'')+h.int+'.'+h.frac+'%';}
  return G(x);
}

/* ---------- entry numbers ---------- */
function entryNumber(s){
  var m=/^([+-]?)(\d+(?:\.\d+)?|\.\d+)(%?)$/.exec(s);
  if(!m)return null;
  var x=parseFloat(m[2]);
  if(m[3])x=x/100;
  if(m[1]==='-')x=-x;
  if(!isFinite(x))return null;
  x=N(x);
  if(Math.abs(x)>=1e15)return null;
  return x;
}

/* ---------- references ---------- */
function mkR(cAbs,colL,rAbs,rowS){return {k:'ref',cAbs:cAbs,colL:colL,rAbs:rAbs,rowS:rowS};}
function colN(r){return (r.colL.length===1&&r.colL>='A'&&r.colL<='H')?r.colL.charCodeAt(0)-64:0;}
function rowN(r){return Number(r.rowS);}
function inGrid(r){var c=colN(r),w=rowN(r);return c>=1&&c<=NC&&w>=1&&w<=NR;}
function mkRI(cAbs,cn,rAbs,rn){return mkR(cAbs,String.fromCharCode(64+cn),rAbs,String(rn));}
function cmpStr(x,y){return x.length!==y.length?x.length-y.length:(x<y?-1:x>y?1:0);}
function normRange(a,b){
  var cc=cmpStr(a.colL,b.colL),rc=cmpStr(a.rowS,b.rowS);
  var cmin=cc<=0?a:b,cmax=cc<=0?b:a,rmin=rc<=0?a:b,rmax=rc<=0?b:a;
  return [mkR(cmin.cAbs,cmin.colL,rmin.rAbs,rmin.rowS),mkR(cmax.cAbs,cmax.colL,rmax.rAbs,rmax.rowS)];
}
function pref(r){return (r.cAbs?'$':'')+r.colL+(r.rAbs?'$':'')+r.rowS;}

/* ---------- tokenizer and parser ---------- */
var RE_NUM=/\d+(?:\.\d+)?|\.\d+/y,RE_WORD=/[A-Za-z$][A-Za-z0-9$]*/y,RE_REFERR=/#REF!/iy,RE_OP=/<>|<=|>=|[+\-*\/^&%=<>]/y;
function tokenize(s){
  var toks=[],i=0,m;
  while(i<s.length){
    var ch=s[i];
    if(ch===' '){i++;continue;}
    if(ch==='"'){
      var j=i+1,val='';
      for(;;){
        if(j>=s.length)throw new Error('str');
        if(s[j]==='"'){if(s[j+1]==='"'){val+='"';j+=2;continue;}break;}
        val+=s[j];j++;
      }
      toks.push({k:'str',raw:s.slice(i,j+1),val:val});i=j+1;continue;
    }
    RE_NUM.lastIndex=i;
    if((m=RE_NUM.exec(s))){toks.push({k:'num',text:m[0]});i+=m[0].length;continue;}
    RE_WORD.lastIndex=i;
    if((m=RE_WORD.exec(s))){
      var w=m[0],mm;
      if(/^(true|false)$/i.test(w))toks.push({k:'bool',v:w.toUpperCase()==='TRUE'});
      else if((mm=/^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(w))){
        toks.push(mkR(!!mm[1],mm[2].toUpperCase(),!!mm[3],mm[4].replace(/^0+/,'')||'0'));
      }else if(/^[A-Za-z0-9]+$/.test(w))toks.push({k:'name',name:w.toUpperCase()});
      else throw new Error('word');
      i+=w.length;continue;
    }
    RE_REFERR.lastIndex=i;
    if(RE_REFERR.exec(s)){toks.push({k:'referr'});i+=5;continue;}
    RE_OP.lastIndex=i;
    if((m=RE_OP.exec(s))){toks.push({k:'op',v:m[0]});i+=m[0].length;continue;}
    if('(),:'.indexOf(ch)>=0){toks.push({k:'p',v:ch});i++;continue;}
    throw new Error('char');
  }
  return toks;
}
var toks,pos;
function isP(v){var t=toks[pos];return t&&t.k==='p'&&t.v===v;}
function isOp(list){var t=toks[pos];return t&&t.k==='op'&&list.indexOf(t.v)>=0;}
function pComp(){
  var l=pConcat();
  while(isOp(['=','<>','<','<=','>','>='])){var op=toks[pos++].v;l={k:'bin',op:op,l:l,r:pConcat()};}
  return l;
}
function pConcat(){var l=pSum();while(isOp(['&'])){pos++;l={k:'bin',op:'&',l:l,r:pSum()};}return l;}
function pSum(){
  var l=pProd();
  while(isOp(['+','-'])){var op=toks[pos++].v;l={k:'bin',op:op,l:l,r:pProd()};}
  return l;
}
function pProd(){
  var l=pSigned();
  while(isOp(['*','/'])){var op=toks[pos++].v;l={k:'bin',op:op,l:l,r:pSigned()};}
  return l;
}
function pSigned(){
  if(isOp(['-','+'])){var op=toks[pos++].v;return {k:'un',op:op,e:pSigned()};}
  return pPower();
}
function pPower(){
  var l=pPercent();
  if(isOp(['^'])){pos++;l={k:'bin',op:'^',l:l,r:pSigned()};}
  return l;
}
function pPercent(){
  var e=pPrimary();
  while(isOp(['%'])){pos++;e={k:'pct',e:e};}
  return e;
}
function pPrimary(){
  var t=toks[pos];
  if(!t)throw new Error('eof');
  if(t.k==='num'){pos++;return {k:'num',text:t.text};}
  if(t.k==='str'){pos++;return t;}
  if(t.k==='bool'){pos++;if(isP('('))throw new Error('x');return t;}
  if(t.k==='referr'){pos++;return t;}
  if(t.k==='ref'){
    pos++;
    if(isP(':')){
      pos++;var u=toks[pos];
      if(!u||u.k!=='ref')throw new Error('range');
      pos++;return {k:'range',a:t,b:u};
    }
    if(isP('('))throw new Error('x');
    return t;
  }
  if(t.k==='name'){
    pos++;
    if(isP('(')){
      pos++;var args=[];
      if(isP(')')){pos++;}
      else{
        for(;;){
          args.push(pComp());
          if(isP(',')){pos++;continue;}
          if(isP(')')){pos++;break;}
          throw new Error('call');
        }
      }
      return {k:'call',name:t.name,args:args};
    }
    return t;
  }
  if(t.k==='p'&&t.v==='('){
    pos++;var e=pComp();
    if(!isP(')'))throw new Error('paren');
    pos++;return {k:'paren',e:e};
  }
  throw new Error('primary');
}
var parseCache=new Map();
function parseFormula(raw){
  if(parseCache.has(raw))return parseCache.get(raw);
  var ast=null;
  try{
    toks=tokenize(raw.slice(1));pos=0;
    var e=pComp();
    if(pos<toks.length)throw new Error('left');
    ast=e;
  }catch(err){ast=null;}
  if(parseCache.size>5000)parseCache.clear();
  parseCache.set(raw,ast);
  return ast;
}
function print(n){
  switch(n.k){
    case 'num':return n.text;
    case 'str':return n.raw;
    case 'bool':return n.v?'TRUE':'FALSE';
    case 'referr':return '#REF!';
    case 'name':return n.name;
    case 'ref':return pref(n);
    case 'range':var q=normRange(n.a,n.b);return pref(q[0])+':'+pref(q[1]);
    case 'paren':return '('+print(n.e)+')';
    case 'un':return n.op+print(n.e);
    case 'pct':return print(n.e)+'%';
    case 'bin':return print(n.l)+n.op+print(n.r);
    case 'call':return n.name+'('+n.args.map(print).join(',')+')';
  }
  return '';
}
function xform(n,fr,frg){
  switch(n.k){
    case 'ref':{var r=fr(n);return r?r:{k:'referr'};}
    case 'range':{var q=normRange(n.a,n.b),g=frg(q[0],q[1]);return g?{k:'range',a:g[0],b:g[1]}:{k:'referr'};}
    case 'paren':return {k:'paren',e:xform(n.e,fr,frg)};
    case 'un':return {k:'un',op:n.op,e:xform(n.e,fr,frg)};
    case 'pct':return {k:'pct',e:xform(n.e,fr,frg)};
    case 'bin':return {k:'bin',op:n.op,l:xform(n.l,fr,frg),r:xform(n.r,fr,frg)};
    case 'call':return {k:'call',name:n.name,args:n.args.map(function(a){return xform(a,fr,frg);})};
  }
  return n;
}
/* structural rewriting; axis 'r' or 'c', i is 1-based, mode 'ins' or 'del' */
function structFns(mode,axis,i){
  function get(r){return axis==='r'?rowN(r):colN(r);}
  function set(r,v){return axis==='r'?mkRI(r.cAbs,colN(r),r.rAbs,v):mkRI(r.cAbs,v,r.rAbs,rowN(r));}
  var lim=axis==='r'?NR:NC;
  function fr(r){
    if(!inGrid(r))return r;
    var n=get(r);
    if(mode==='ins'){var m=n<i?n:n+1;return m>lim?null:set(r,m);}
    if(n<i)return r;
    if(n===i)return null;
    return set(r,n-1);
  }
  function frg(a,b){
    if(!inGrid(a)||!inGrid(b))return [a,b];
    var t=get(a),e=get(b);
    if(mode==='ins'){
      var t2=t<i?t:t+1,b2=e<i?e:e+1;
      if(t2>lim)return null;
      if(b2>lim)b2=lim;
      return [set(a,t2),set(b,b2)];
    }
    if(i>e)return [a,b];
    if(i<t)return [set(a,t-1),set(b,e-1)];
    if(t===e)return null;
    return [a,set(b,e-1)];
  }
  return {fr:fr,frg:frg};
}
function pasteFns(dc,dr){
  function mv(r){
    var c=colN(r),w=rowN(r);
    if(!r.cAbs)c+=dc;
    if(!r.rAbs)w+=dr;
    if(c<1||c>NC||w<1||w>NR)return null;
    return mkRI(r.cAbs,c,r.rAbs,w);
  }
  function fr(r){return inGrid(r)?mv(r):r;}
  function frg(a,b){
    if(!inGrid(a)||!inGrid(b))return [a,b];
    var x=mv(a),y=mv(b);
    return x&&y?[x,y]:null;
  }
  return {fr:fr,frg:frg};
}

/* ---------- state ---------- */
var raws=new Array(NC*NR).fill(''),fmts=new Array(NC*NR).fill('general');
var anchor=[0,0],active=[0,0],editing=false,clip=null,undoS=[],redoS=[];
var memo,circ;

/* ---------- evaluation ---------- */
function precedents(n,out){
  switch(n.k){
    case 'ref':if(inGrid(n))out.push((rowN(n)-1)*NC+colN(n)-1);break;
    case 'range':
      if(inGrid(n.a)&&inGrid(n.b)){
        var r0=Math.min(rowN(n.a),rowN(n.b)),r1=Math.max(rowN(n.a),rowN(n.b));
        var c0=Math.min(colN(n.a),colN(n.b)),c1=Math.max(colN(n.a),colN(n.b));
        for(var r=r0;r<=r1;r++)for(var c=c0;c<=c1;c++)out.push((r-1)*NC+c-1);
      }
      break;
    case 'paren':case 'un':case 'pct':precedents(n.e,out);break;
    case 'bin':precedents(n.l,out);precedents(n.r,out);break;
    case 'call':n.args.forEach(function(a){precedents(a,out);});break;
  }
}
function computeCycles(){
  var prec=new Array(NC*NR).fill(null);
  circ=new Array(NC*NR).fill(false);
  for(var k=0;k<NC*NR;k++){
    if(raws[k][0]==='='){
      var ast=parseFormula(raws[k]);
      if(ast){var o=[];try{precedents(ast,o);}catch(e){}prec[k]=o;}
    }
  }
  for(var k2=0;k2<NC*NR;k2++){
    if(!prec[k2])continue;
    var seen=new Array(NC*NR).fill(false),stack=prec[k2].slice(),found=false;
    while(stack.length){
      var x=stack.pop();
      if(x===k2){found=true;break;}
      if(seen[x])continue;
      seen[x]=true;
      if(prec[x])for(var y=0;y<prec[x].length;y++)stack.push(prec[x][y]);
    }
    circ[k2]=found;
  }
}
function computeAll(){memo=new Array(NC*NR);computeCycles();}
function cellValue(r,c){
  var k=r*NC+c;
  if(memo[k])return memo[k];
  var v;
  if(circ[k])v=ERR('#CYCLE!');
  else v=rawValue(raws[k]);
  memo[k]=v;
  return v;
}
function rawValue(s){
  if(s==='')return BLANK;
  if(s[0]==='='){
    var ast=parseFormula(s);
    if(!ast)return ERR('#SYNTAX!');
    var v;
    try{v=ev(ast);}catch(e){window.__e=e.stack;v=ERR("#VALUE!");}
    return v.t==='b'?{t:'n',v:0}:v;
  }
  if(s[0]==="'")return {t:'s',v:s.slice(1)};
  var tr=s.replace(/^ +| +$/g,'');
  var en=entryNumber(tr);
  if(en!==null)return {t:'n',v:en};
  if(/^(true|false)$/i.test(tr))return {t:'l',v:tr.toUpperCase()==='TRUE'};
  return {t:'s',v:s};
}
function toN(v){
  if(v.t==='n')return v.v;
  if(v.t==='l')return v.v?1:0;
  if(v.t==='b')return 0;
  return ERR('#VALUE!');
}
function toText(v){
  if(v.t==='n')return G(v.v);
  if(v.t==='l')return v.v?'TRUE':'FALSE';
  if(v.t==='b')return '';
  return v.v;
}
function toL(v){
  if(v.t==='n')return v.v!==0;
  if(v.t==='l')return v.v;
  if(v.t==='b')return false;
  return ERR('#VALUE!');
}
function rank(v){return v.t==='n'?0:v.t==='s'?1:2;}
function cmpVals(a,b){
  var ra=rank(a),rb=rank(b);
  if(ra!==rb)return ra<rb?-1:1;
  if(a.t==='n')return a.v<b.v?-1:a.v>b.v?1:0;
  if(a.t==='s'){var x=a.v.toUpperCase(),y=b.v.toUpperCase();return x<y?-1:x>y?1:0;}
  return (a.v?1:0)-(b.v?1:0);
}
function blankAs(o){
  if(o.t==='s')return {t:'s',v:''};
  if(o.t==='l')return {t:'l',v:false};
  return {t:'n',v:0};
}
function ev(n){
  switch(n.k){
    case 'num':return mkNum(parseFloat(n.text));
    case 'str':return {t:'s',v:n.val};
    case 'bool':return {t:'l',v:n.v};
    case 'referr':return ERR('#REF!');
    case 'ref':return inGrid(n)?cellValue(rowN(n)-1,colN(n)-1):ERR('#REF!');
    case 'range':return ERR('#VALUE!');
    case 'name':return ERR('#NAME?');
    case 'paren':return ev(n.e);
    case 'un':{
      var v=ev(n.e);if(v.t==='e')return v;
      var x=toN(v);if(typeof x!=='number')return x;
      return mkNum(n.op==='-'?-x:x);
    }
    case 'pct':{
      var v2=ev(n.e);if(v2.t==='e')return v2;
      var x2=toN(v2);if(typeof x2!=='number')return x2;
      return mkNum(x2/100);
    }
    case 'bin':return evBin(n);
    case 'call':return evCall(n);
  }
  return ERR('#VALUE!');
}
function evBin(n){
  var a=ev(n.l),b=ev(n.r);
  if(a.t==='e')return a;
  if(b.t==='e')return b;
  var op=n.op;
  if(op==='&')return {t:'s',v:toText(a)+toText(b)};
  if(op==='='||op==='<>'||op==='<'||op==='<='||op==='>'||op==='>='){
    var x=a,y=b;
    if(x.t==='b')x=blankAs(y.t==='b'?{t:'n'}:y);
    if(y.t==='b')y=blankAs(a.t==='b'?{t:'n'}:a);
    var c=cmpVals(x,y);
    var r=op==='='?c===0:op==='<>'?c!==0:op==='<'?c<0:op==='<='?c<=0:op==='>'?c>0:c>=0;
    return {t:'l',v:r};
  }
  var p=toN(a);if(typeof p!=='number')return p;
  var q=toN(b);if(typeof q!=='number')return q;
  switch(op){
    case '+':return mkNum(p+q);
    case '-':return mkNum(p-q);
    case '*':return mkNum(p*q);
    case '/':return q===0?ERR('#DIV/0!'):mkNum(p/q);
    case '^':
      if(p===0&&q===0)return ERR('#NUM!');
      if(p===0&&q<0)return ERR('#DIV/0!');
      if(p<0&&Math.floor(q)!==q)return ERR('#NUM!');
      return mkNum(Math.pow(p,q));
  }
  return ERR('#VALUE!');
}
var FN=new Map([['SUM',[1,1/0]],['AVERAGE',[1,1/0]],['MIN',[1,1/0]],['MAX',[1,1/0]],['COUNT',[1,1/0]],['COUNTA',[1,1/0]],
  ['ROUND',[2,2]],['ABS',[1,1]],['INT',[1,1]],['MOD',[2,2]],['IF',[3,3]],['AND',[1,1/0]],['OR',[1,1/0]],['NOT',[1,1]],
  ['IFERROR',[2,2]],['ISERROR',[1,1]],['ISBLANK',[1,1]],['LEN',[1,1]],['UPPER',[1,1]],['LEFT',[2,2]],['RIGHT',[2,2]],
  ['MID',[3,3]],['CONCAT',[1,1/0]],['COUNTIF',[2,2]],['SUMIF',[3,3]]]);
function isRangeArg(a){return a.k==='ref'||a.k==='range'||a.k==='referr';}
function rangeOf(a){
  if(a.k==='referr')return {err:ERR('#REF!')};
  var p=a.k==='ref'?a:a.a,q=a.k==='ref'?a:a.b;
  if(!inGrid(p)||!inGrid(q))return {err:ERR('#REF!')};
  return {r0:Math.min(rowN(p),rowN(q))-1,r1:Math.max(rowN(p),rowN(q))-1,c0:Math.min(colN(p),colN(q))-1,c1:Math.max(colN(p),colN(q))-1};
}
function rangeVals(g){
  var out=[];
  for(var r=g.r0;r<=g.r1;r++)for(var c=g.c0;c<=g.c1;c++)out.push(cellValue(r,c));
  return out;
}
function aggregate(name,args){
  var list=[],cnt=0;
  for(var i=0;i<args.length;i++){
    var a=args[i];
    if(isRangeArg(a)){
      var g=rangeOf(a);if(g.err)return g.err;
      var vs=rangeVals(g);
      for(var j=0;j<vs.length;j++){
        var v=vs[j];
        if(v.t==='e')return v;
        if(name==='COUNTA'){if(v.t!=='b')cnt++;}
        else if(name==='COUNT'){if(v.t==='n')cnt++;}
        else if(v.t==='n')list.push(v.v);
      }
    }else{
      var w=ev(a);if(w.t==='e')return w;
      if(name==='COUNTA')cnt++;
      else if(name==='COUNT'){if(w.t==='n')cnt++;}
      else{var x=toN(w);if(typeof x!=='number')return x;list.push(x);}
    }
  }
  if(name==='COUNT'||name==='COUNTA')return mkNum(cnt);
  if(name==='MIN'||name==='MAX'){
    if(!list.length)return mkNum(0);
    return mkNum(name==='MIN'?Math.min.apply(null,list):Math.max.apply(null,list));
  }
  var s=0;for(var k=0;k<list.length;k++)s+=list[k];
  if(name==='AVERAGE')return list.length?mkNum(s/list.length):ERR('#DIV/0!');
  return mkNum(s);
}
function parseCriterion(v){
  if(v.t==='n'||v.t==='l')return {op:'=',val:v};
  if(v.t==='b')return {op:'=',val:{t:'s',v:''}};
  var m=/^(>=|<=|<>|>|<|=)/.exec(v.v);
  if(!m)return {op:'=',val:v};
  var rest=v.v.slice(m[1].length),val,en=entryNumber(rest);
  if(en!==null)val={t:'n',v:en};
  else if(/^(true|false)$/i.test(rest))val={t:'l',v:rest.toUpperCase()==='TRUE'};
  else val={t:'s',v:rest};
  return {op:m[1],val:val};
}
function matches(v,cr){
  var same=v.t===cr.val.t,c=same?cmpVals(v,cr.val):0;
  switch(cr.op){
    case '=':return same&&c===0;
    case '<>':return !(same&&c===0);
    case '<':return same&&c<0;
    case '<=':return same&&c<=0;
    case '>':return same&&c>0;
    case '>=':return same&&c>=0;
  }
  return false;
}
function condAgg(name,args){
  if(!isRangeArg(args[0]))return ERR('#VALUE!');
  if(name==='SUMIF'&&!isRangeArg(args[2]))return ERR('#VALUE!');
  var g=rangeOf(args[0]);if(g.err)return g.err;
  var h=null;
  if(name==='SUMIF'){
    h=rangeOf(args[2]);if(h.err)return h.err;
    if(h.r1-h.r0!==g.r1-g.r0||h.c1-h.c0!==g.c1-g.c0)return ERR('#VALUE!');
  }
  var cv=ev(args[1]);if(cv.t==='e')return cv;
  var cr=parseCriterion(cv);
  var vs=rangeVals(g),ss=h?rangeVals(h):null,cnt=0,sum=0;
  for(var i=0;i<vs.length;i++){
    var v=vs[i];
    if(v.t==='e')return v;
    if(v.t==='b')continue;
    if(!matches(v,cr))continue;
    if(name==='COUNTIF')cnt++;
    else{
      var s=ss[i];
      if(s.t==='e')return s;
      if(s.t==='n')sum+=s.v;
    }
  }
  return mkNum(name==='COUNTIF'?cnt:sum);
}
function evCall(n){
  var spec=FN.get(n.name);
  if(!spec)return ERR('#NAME?');
  var args=n.args;
  if(args.length<spec[0]||args.length>spec[1])return ERR('#ARGS!');
  function num(i){var v=ev(args[i]);if(v.t==='e')return v;return toN(v);}
  function txt(i){var v=ev(args[i]);if(v.t==='e')return v;return toText(v);}
  function lg(i){var v=ev(args[i]);if(v.t==='e')return v;return toL(v);}
  function bad(x,t){return typeof x!==t;}
  var a,b,c;
  switch(n.name){
    case 'SUM':case 'AVERAGE':case 'MIN':case 'MAX':case 'COUNT':case 'COUNTA':return aggregate(n.name,args);
    case 'ROUND':
      a=num(0);if(bad(a,'number'))return a;
      b=num(1);if(bad(b,'number'))return b;
      b=Math.trunc(b);
      if(b<-9||b>9)return ERR('#NUM!');
      return mkNum(roundVal(a,b));
    case 'ABS':a=num(0);return bad(a,'number')?a:mkNum(Math.abs(a));
    case 'INT':a=num(0);return bad(a,'number')?a:mkNum(Math.floor(a));
    case 'MOD':
      a=num(0);if(bad(a,'number'))return a;
      b=num(1);if(bad(b,'number'))return b;
      if(b===0)return ERR('#DIV/0!');
      return mkNum(a-b*Math.floor(a/b));
    case 'IF':
      c=lg(0);if(bad(c,'boolean'))return c;
      return ev(args[c?1:2]);
    case 'AND':case 'OR':{
      var res=n.name==='AND';
      for(var i=0;i<args.length;i++){
        var l=lg(i);if(bad(l,'boolean'))return l;
        if(n.name==='AND')res=res&&l;else res=res||l;
      }
      return {t:'l',v:res};
    }
    case 'NOT':a=lg(0);return bad(a,'boolean')?a:{t:'l',v:!a};
    case 'IFERROR':a=ev(args[0]);return a.t==='e'?ev(args[1]):a;
    case 'ISERROR':return {t:'l',v:ev(args[0]).t==='e'};
    case 'ISBLANK':
      if(isRangeArg(args[0])){
        var g=rangeOf(args[0]);if(g.err)return g.err;
        if(args[0].k==='range')return ERR('#VALUE!');
        return {t:'l',v:raws[g.r0*NC+g.c0]===''};
      }
      a=ev(args[0]);
      return a.t==='e'?a:{t:'l',v:false};
    case 'LEN':a=txt(0);return bad(a,'string')?a:mkNum(a.length);
    case 'UPPER':a=txt(0);return bad(a,'string')?a:{t:'s',v:a.toUpperCase()};
    case 'LEFT':case 'RIGHT':
      a=txt(0);if(bad(a,'string'))return a;
      b=num(1);if(bad(b,'number'))return b;
      b=Math.trunc(b);
      if(b<0)return ERR('#VALUE!');
      return {t:'s',v:n.name==='LEFT'?a.slice(0,b):(b===0?'':a.slice(-b))};
    case 'MID':
      a=txt(0);if(bad(a,'string'))return a;
      b=num(1);if(bad(b,'number'))return b;
      c=num(2);if(bad(c,'number'))return c;
      b=Math.trunc(b);c=Math.trunc(c);
      if(b<1||c<0)return ERR('#VALUE!');
      return {t:'s',v:a.substr(b-1,c)};
    case 'CONCAT':{
      var out='';
      for(var j=0;j<args.length;j++){
        if(isRangeArg(args[j])){
          var rg=rangeOf(args[j]);if(rg.err)return rg.err;
          var vs=rangeVals(rg);
          for(var q=0;q<vs.length;q++){if(vs[q].t==='e')return vs[q];out+=toText(vs[q]);}
        }else{
          var t=txt(j);if(bad(t,'string'))return t;
          out+=t;
        }
      }
      return {t:'s',v:out};
    }
    case 'COUNTIF':case 'SUMIF':return condAgg(n.name,args);
  }
  return ERR('#NAME?');
}

/* ---------- display ---------- */
var KIND={b:'empty',n:'number',s:'text',l:'logical',e:'error'};
function shown(v,f){
  if(v.t==='b')return '';
  if(v.t==='n')return fmtNumber(v.v,f);
  if(v.t==='l')return v.v?'TRUE':'FALSE';
  return v.v;
}
function addr(r,c){return String.fromCharCode(65+c)+(r+1);}

/* ---------- DOM ---------- */
var $=function(t){return document.querySelector('[data-testid="'+t+'"]');};
var grid=$('grid'),input=$('formula-input'),nameBox=$('name-box'),summary=$('selection-summary'),fmtSel=$('format-select');
var btn={};
['undo-button','redo-button','copy-button','cut-button','paste-button','clear-button','insert-row','delete-row','insert-col','delete-col'].forEach(function(t){btn[t]=$(t);});
var cellEls=[];
(function build(){
  var h='<tr role="row"><th class="corner" role="presentation"></th>';
  for(var c=0;c<NC;c++)h+='<th role="columnheader" data-testid="col-header-'+String.fromCharCode(65+c)+'">'+String.fromCharCode(65+c)+'</th>';
  h+='</tr>';
  for(var r=0;r<NR;r++){
    h+='<tr role="row"><th role="rowheader" data-testid="row-header-'+(r+1)+'">'+(r+1)+'</th>';
    for(c=0;c<NC;c++)h+='<td role="gridcell" data-testid="cell-'+addr(r,c)+'" data-r="'+r+'" data-c="'+c+'" data-kind="empty" aria-selected="false" data-in-selection="false"></td>';
    h+='</tr>';
  }
  grid.innerHTML=h;
  for(r=0;r<NR;r++)for(c=0;c<NC;c++)cellEls.push(grid.querySelector('[data-testid="cell-'+addr(r,c)+'"]'));
})();
function setAttr(el,n,v){if(el.getAttribute(n)!==v)el.setAttribute(n,v);}
function rect(){
  return {r0:Math.min(anchor[0],active[0]),r1:Math.max(anchor[0],active[0]),c0:Math.min(anchor[1],active[1]),c1:Math.max(anchor[1],active[1])};
}
function render(){
  computeAll();
  var rc=rect(),sum=0,cnt=0;
  for(var r=0;r<NR;r++)for(var c=0;c<NC;c++){
    var k=r*NC+c,el=cellEls[k],v=cellValue(r,c),t=shown(v,fmts[k]);
    if(el.textContent!==t)el.textContent=t;
    setAttr(el,'data-kind',KIND[v.t]);
    var isA=r===active[0]&&c===active[1];
    var inS=r>=rc.r0&&r<=rc.r1&&c>=rc.c0&&c<=rc.c1;
    setAttr(el,'aria-selected',isA?'true':'false');
    setAttr(el,'data-in-selection',inS?'true':'false');
    if(inS&&v.t==='n'){sum+=v.v;cnt++;}
  }
  var nb=(anchor[0]===active[0]&&anchor[1]===active[1])?addr(active[0],active[1]):addr(rc.r0,rc.c0)+':'+addr(rc.r1,rc.c1);
  if(nameBox.textContent!==nb)nameBox.textContent=nb;
  var ak=active[0]*NC+active[1];
  if(!editing&&input.value!==raws[ak])input.value=raws[ak];
  setAttr(input,'data-editing',editing?'true':'false');
  fmtSel.value=fmts[ak];
  var all=Object.keys(btn);
  all.forEach(function(t){btn[t].disabled=editing;});
  fmtSel.disabled=editing;
  if(!editing){
    btn['undo-button'].disabled=!undoS.length;
    btn['redo-button'].disabled=!redoS.length;
    btn['paste-button'].disabled=!clip;
  }
  if(cnt>0){
    var s=N(sum),a=N(sum/cnt);
    var st=Math.abs(s)>=1e15?'#NUM!':G(s),at=Math.abs(a)>=1e15?'#NUM!':G(a);
    summary.textContent='Sum: '+st+' | Average: '+at+' | Count: '+cnt;
    summary.hidden=false;
  }else{summary.hidden=true;summary.textContent='';}
}

/* ---------- history ---------- */
function snap(){return {raws:raws.slice(),fmts:fmts.slice(),a:anchor.slice(),b:active.slice()};}
function restore(s){raws=s.raws.slice();fmts=s.fmts.slice();anchor=s.a.slice();active=s.b.slice();}
function perform(fn){
  var before=snap(),changed=fn();
  if(changed){
    undoS.push({before:before,after:snap()});
    if(undoS.length>20)undoS.shift();
    redoS=[];
  }
}
function undo(){
  if(editing||!undoS.length)return;
  var s=undoS.pop();restore(s.before);redoS.push(s);render();
}
function redo(){
  if(editing||!redoS.length)return;
  var s=redoS.pop();restore(s.after);undoS.push(s);render();
}

/* ---------- actions ---------- */
function interpret(s){
  if(s==='')return '';
  if(s[0]==='='){
    var ast=parseFormula(s);
    if(!ast)return s;
    try{return '='+print(ast);}catch(e){return s;}
  }
  return s;
}
function commitActive(s){
  var k=active[0]*NC+active[1],raw=interpret(s);
  editing=false;
  if(raw===raws[k])return false;
  raws[k]=raw;
  return true;
}
function moveCommit(dr,dc){
  perform(function(){
    var ch=false;
    if(editing)ch=commitActive(input.value);
    active=[Math.min(active[0]+dr,NR-1),Math.min(active[1]+dc,NC-1)];
    anchor=active.slice();
    return ch;
  });
  render();
}
function cellClick(r,c,shift){
  perform(function(){
    var ch=false;
    if(editing)ch=commitActive(input.value);
    if(shift)active=[r,c];else{anchor=[r,c];active=[r,c];}
    return ch;
  });
  grid.focus();
  render();
}
function clearSel(){
  var rc=rect();
  perform(function(){
    var ch=false;
    for(var r=rc.r0;r<=rc.r1;r++)for(var c=rc.c0;c<=rc.c1;c++){
      var k=r*NC+c;if(raws[k]!==''){raws[k]='';ch=true;}
    }
    return ch;
  });
  render();
}
function rewriteAll(fns){
  for(var k=0;k<raws.length;k++){
    if(raws[k][0]!=='=')continue;
    var ast=parseFormula(raws[k]);
    if(!ast)continue;
    try{raws[k]='='+print(xform(ast,fns.fr,fns.frg));}catch(e){}
  }
}
function structure(mode,axis){
  perform(function(){
    var i=(axis==='r'?active[0]:active[1])+1;
    var nr=raws.slice(),nf=fmts.slice();
    for(var r=0;r<NR;r++)for(var c=0;c<NC;c++){
      var k=r*NC+c,p=axis==='r'?r:c,src=-1;
      if(mode==='ins'){if(p===i-1)src=-2;else if(p>i-1)src=p-1;else src=p;}
      else{if(p===(axis==='r'?NR:NC)-1)src=-2;else if(p>=i-1)src=p+1;else src=p;}
      if(src===-2){nr[k]='';nf[k]='general';}
      else{
        var sk=axis==='r'?src*NC+c:r*NC+src;
        nr[k]=raws[sk];nf[k]=fmts[sk];
      }
    }
    raws=nr;fmts=nf;
    rewriteAll(structFns(mode,axis,i));
    return true;
  });
  render();
}
function takeBlock(mode){
  var rc=rect(),cells=[];
  for(var r=rc.r0;r<=rc.r1;r++)for(var c=rc.c0;c<=rc.c1;c++){var k=r*NC+c;cells.push({raw:raws[k],fmt:fmts[k]});}
  clip={r0:rc.r0,c0:rc.c0,h:rc.r1-rc.r0+1,w:rc.c1-rc.c0+1,cells:cells,mode:mode};
  render();
}
function doPaste(){
  if(!clip)return;
  perform(function(){
    var rc=rect(),dr=rc.r0-clip.r0,dc=rc.c0-clip.c0,i,j;
    if(clip.mode==='cut'){
      for(i=0;i<clip.h;i++)for(j=0;j<clip.w;j++){var sk=(clip.r0+i)*NC+clip.c0+j;raws[sk]='';fmts[sk]='general';}
    }
    var fns=pasteFns(dc,dr);
    for(i=0;i<clip.h;i++)for(j=0;j<clip.w;j++){
      var r=rc.r0+i,c=rc.c0+j;
      if(r>=NR||c>=NC)continue;
      var src=clip.cells[i*clip.w+j],raw=src.raw;
      if(clip.mode==='copy'&&raw[0]==='='){
        var ast=parseFormula(raw);
        if(ast){try{raw='='+print(xform(ast,fns.fr,fns.frg));}catch(e){}}
      }
      raws[r*NC+c]=raw;fmts[r*NC+c]=src.fmt;
    }
    anchor=[rc.r0,rc.c0];active=[rc.r0,rc.c0];
    if(clip.mode==='cut')clip=null;
    return true;
  });
  render();
}
function setFormat(f){
  var rc=rect();
  perform(function(){
    var ch=false;
    for(var r=rc.r0;r<=rc.r1;r++)for(var c=rc.c0;c<=rc.c1;c++){
      var k=r*NC+c;if(fmts[k]!==f){fmts[k]=f;ch=true;}
    }
    return ch;
  });
  render();
}

/* ---------- events ---------- */
grid.addEventListener('click',function(e){
  var td=e.target.closest?e.target.closest('td[data-r]'):null;
  if(!td)return;
  cellClick(+td.dataset.r,+td.dataset.c,e.shiftKey);
});
grid.addEventListener('keydown',function(e){
  var key=e.key,ctrl=e.ctrlKey||e.metaKey,lk=key.length===1?key.toLowerCase():key;
  var arrows={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  var handled=arrows[key]||key==='Delete'||key==='Backspace'||key==='Enter'||(ctrl&&(lk==='z'||lk==='y'));
  if(!handled)return;
  e.preventDefault();
  if(key==='Enter'){input.focus();return;}
  if(editing)return;
  if(arrows[key]){
    var d=arrows[key],nr=active[0]+d[0],nc=active[1]+d[1];
    if(nr>=0&&nr<NR&&nc>=0&&nc<NC)active=[nr,nc];
    if(!e.shiftKey)anchor=active.slice();
    render();
  }else if(key==='Delete'||key==='Backspace')clearSel();
  else if(lk==='z')undo();
  else if(lk==='y')redo();
});
input.addEventListener('input',function(){
  if(!editing){editing=true;render();}
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();moveCommit(1,0);}
  else if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();moveCommit(0,1);}
  else if(e.key==='Escape'){
    e.preventDefault();
    editing=false;
    input.value=raws[active[0]*NC+active[1]];
    render();
    grid.focus();
  }
});
btn['undo-button'].addEventListener('click',undo);
btn['redo-button'].addEventListener('click',redo);
btn['copy-button'].addEventListener('click',function(){takeBlock('copy');});
btn['cut-button'].addEventListener('click',function(){takeBlock('cut');});
btn['paste-button'].addEventListener('click',doPaste);
btn['clear-button'].addEventListener('click',clearSel);
btn['insert-row'].addEventListener('click',function(){structure('ins','r');});
btn['delete-row'].addEventListener('click',function(){structure('del','r');});
btn['insert-col'].addEventListener('click',function(){structure('ins','c');});
btn['delete-col'].addEventListener('click',function(){structure('del','c');});
fmtSel.addEventListener('change',function(){setFormat(fmtSel.value);});
render();
})();
</script>
</body>
</html>
