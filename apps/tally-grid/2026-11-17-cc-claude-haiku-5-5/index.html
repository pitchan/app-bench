<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #f3f4f6;
  color: #1b1f24;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
[hidden] { display: none !important; }

.app-header { background: #1f2937; color: #ffffff; padding: 12px 16px; }
.app-header h1 { margin: 0; font-size: 18px; font-weight: 600; }

main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.toolbar button {
  min-height: 36px;
  padding: 6px 10px;
  font: inherit;
  color: #1b1f24;
  background: #ffffff;
  border: 1px solid #8b93a0;
  border-radius: 6px;
  cursor: pointer;
}
.toolbar button:hover:not(:disabled) { background: #eef2f7; }
.toolbar button:disabled { color: #6b7380; background: #e5e8ed; border-color: #c4cad3; cursor: default; }
.fmt { margin-left: 4px; }

select, input[type="text"] {
  min-height: 36px;
  padding: 4px 8px;
  font: inherit;
  color: #1b1f24;
  background: #ffffff;
  border: 1px solid #8b93a0;
  border-radius: 6px;
}
select:disabled { color: #6b7380; background: #e5e8ed; }

.fbar { display: flex; align-items: flex-end; gap: 8px; min-width: 0; }
.namebox {
  min-width: 90px;
  min-height: 36px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  color: #1b1f24;
  border: 1px solid #8b93a0;
  border-radius: 6px;
  font-weight: 600;
}
.fx { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 2px; }
.fx label { font-size: 12px; color: #374151; }
.fx input { width: 100%; }
[data-editing="true"] { border-color: #1d4ed8; box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.25); }

.sheet {
  max-width: 100%;
  max-height: 60vh;
  overflow: auto;
  background: #ffffff;
  border: 1px solid #8b93a0;
  border-radius: 6px;
}
.grid { width: max-content; outline: none; }
.row { display: grid; grid-template-columns: 44px repeat(8, 104px); }
.corner, .hdr {
  height: 30px;
  line-height: 28px;
  text-align: center;
  font-weight: 600;
  background: #e8ebf0;
  color: #1b1f24;
  border-right: 1px solid #cfd5dd;
  border-bottom: 1px solid #cfd5dd;
}
.cell {
  height: 30px;
  line-height: 28px;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  background: #ffffff;
  color: #1b1f24;
  border-right: 1px solid #e3e7ed;
  border-bottom: 1px solid #e3e7ed;
  min-width: 0;
  cursor: cell;
  user-select: none;
}
.cell[data-kind="number"] { text-align: right; }
.cell[data-kind="error"] { color: #8a1313; font-weight: 600; }
.cell[data-in-selection="true"] { background: #d6e6ff; }
.cell[aria-selected="true"] { box-shadow: inset 0 0 0 2px #1d4ed8; }

.summary {
  padding: 8px 10px;
  background: #ffffff;
  color: #1b1f24;
  border: 1px solid #8b93a0;
  border-radius: 6px;
  overflow-wrap: anywhere;
}

:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
.grid:focus-visible { outline-offset: -3px; }
</style>
</head>
<body>
<header class="app-header" data-testid="app-header"><h1>Claude Haiku 5.5</h1></header>

<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" id="undo-button" data-testid="undo-button">Undo</button>
    <button type="button" id="redo-button" data-testid="redo-button">Redo</button>
    <button type="button" id="copy-button" data-testid="copy-button">Copy</button>
    <button type="button" id="cut-button" data-testid="cut-button">Cut</button>
    <button type="button" id="paste-button" data-testid="paste-button">Paste</button>
    <button type="button" id="clear-button" data-testid="clear-button">Clear</button>
    <button type="button" id="insert-row" data-testid="insert-row">Insert row</button>
    <button type="button" id="delete-row" data-testid="delete-row">Delete row</button>
    <button type="button" id="insert-col" data-testid="insert-col">Insert column</button>
    <button type="button" id="delete-col" data-testid="delete-col">Delete column</button>
    <label class="fmt" for="format-select">Number format</label>
    <select id="format-select" data-testid="format-select">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>

  <div class="fbar">
    <div class="namebox" id="name-box" data-testid="name-box">A1</div>
    <div class="fx">
      <label for="formula-input">Cell content</label>
      <input type="text" id="formula-input" data-testid="formula-input" data-editing="false" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="sheet">
    <div class="grid" id="grid" role="grid" aria-label="Sheet" tabindex="0" data-testid="grid"></div>
  </div>

  <div class="summary" id="selection-summary" data-testid="selection-summary" hidden></div>
</main>

<script>
(() => {
'use strict';

/* ---------- constants and errors ---------- */

const COLS = 8;
const ROWS = 12;
const HISTORY_LIMIT = 20;
const COL_NAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const CMP_OPS = ['=', '<>', '<', '<=', '>', '>='];
const ENTRY_RE = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;

class Err {
  constructor(code) { this.code = code; }
}
const ERR = {
  SYNTAX: new Err('#SYNTAX!'),
  NAME: new Err('#NAME?'),
  ARGS: new Err('#ARGS!'),
  REF: new Err('#REF!'),
  VALUE: new Err('#VALUE!'),
  DIV0: new Err('#DIV/0!'),
  NUM: new Err('#NUM!'),
  CYCLE: new Err('#CYCLE!')
};
const REF_TOKEN = { k: 'err' };

const ARITY = Object.assign(Object.create(null), {
  SUM: [1, Infinity], AVERAGE: [1, Infinity], MIN: [1, Infinity], MAX: [1, Infinity],
  COUNT: [1, Infinity], COUNTA: [1, Infinity],
  ROUND: [2, 2], ABS: [1, 1], INT: [1, 1], MOD: [2, 2],
  IF: [3, 3], AND: [1, Infinity], OR: [1, Infinity], NOT: [1, 1],
  IFERROR: [2, 2], ISERROR: [1, 1], ISBLANK: [1, 1],
  LEN: [1, 1], UPPER: [1, 1], LEFT: [2, 2], RIGHT: [2, 2], MID: [3, 3],
  CONCAT: [1, Infinity], COUNTIF: [2, 2], SUMIF: [3, 3]
});

/* ---------- numbers (02, sections 2.4 and 2.5) ---------- */

function norm(x) {
  const n = Number(x.toPrecision(12));
  return n === 0 ? 0 : n;
}

function fin(x) {
  if (!Number.isFinite(x)) return ERR.NUM;
  const n = norm(x);
  return Math.abs(n) >= 1e15 ? ERR.NUM : n;
}

// R(x, d): x rounded to d decimal places on the digits of its 12-digit writing, ties away from zero.
function roundDec(x, d) {
  if (x === 0) return 0;
  const sign = x < 0 ? -1 : 1;
  const [mant, exp] = Math.abs(x).toExponential(11).split('e');
  const digits = mant.replace('.', '');
  const keep = Number(exp) + 1 + d;
  if (keep < 0) return 0;
  const kept = digits.slice(0, keep).padEnd(keep, '0');
  const up = keep < digits.length && digits[keep] >= '5';
  const k = BigInt(kept || '0') + (up ? 1n : 0n);
  const r = Number(k.toString() + 'e' + -d);
  return r === 0 ? 0 : sign * r;
}

// G(x): text of x in the general format.
function general(x) {
  const r = roundDec(x, 6);
  return r === 0 ? '0' : String(r);
}

function formatNumber(x, fmt) {
  if (fmt === 'fixed2') {
    const r = roundDec(x, 2);
    const parts = Math.abs(r).toFixed(2).split('.');
    return (r < 0 ? '-' : '') + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
  }
  if (fmt === 'percent1') {
    const r = roundDec(norm(x * 100), 1);
    return (r < 0 ? '-' : '') + Math.abs(r).toFixed(1) + '%';
  }
  return general(x);
}

// Entry number of a string that has no spaces to remove (02, section 2.2).
function entryNumber(t) {
  if (!ENTRY_RE.test(t)) return null;
  const pct = t.endsWith('%');
  const v = Number(pct ? t.slice(0, -1) : t) / (pct ? 100 : 1);
  const n = norm(v);
  return Math.abs(n) < 1e15 ? n : null;
}

function trimSpaces(s) {
  return s.replace(/^ +| +$/g, '');
}

// Value of a committed string that is not a formula (02, section 2.2, rules 3 to 6).
function constantValue(raw) {
  if (raw[0] === "'") return raw.slice(1);
  const t = trimSpaces(raw);
  const n = entryNumber(t);
  if (n !== null) return n;
  const upper = t.toUpperCase();
  if (upper === 'TRUE') return true;
  if (upper === 'FALSE') return false;
  return raw;
}

function displayOf(v, fmt) {
  if (typeof v === 'number') return formatNumber(v, fmt);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (v instanceof Err) return v.code;
  return v;
}

function kindOf(v) {
  if (v === null) return 'empty';
  if (typeof v === 'number') return 'number';
  if (typeof v === 'string') return 'text';
  if (typeof v === 'boolean') return 'logical';
  return 'error';
}

/* ---------- tokens (02, section 2.6.1) ---------- */

const OPS2 = ['<>', '<=', '>='];
const OPS1 = '+-*/^&%=<>';
const PUNCT = '(),:';

function colIndex(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}

function colLetters(n) {
  let s = '';
  while (n > 0) {
    s = String.fromCharCode(65 + ((n - 1) % 26)) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function tokenize(src) {
  const out = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ' ') { i++; continue; }
    const rest = src.slice(i);
    let m = /^(\d+(\.\d+)?|\.\d+)/.exec(rest);
    if (m) {
      out.push({ k: 'num', s: m[0] });
      i += m[0].length;
      continue;
    }
    if (ch === '"') {
      let j = i + 1;
      let closed = false;
      while (j < src.length) {
        if (src[j] === '"') {
          if (src[j + 1] === '"') { j += 2; continue; }
          closed = true;
          break;
        }
        j++;
      }
      if (!closed) return null;
      out.push({ k: 'str', s: src.slice(i, j + 1) });
      i = j + 1;
      continue;
    }
    if (ch === '#') {
      if (rest.slice(0, 5).toUpperCase() !== '#REF!') return null;
      out.push({ k: 'err' });
      i += 5;
      continue;
    }
    if (/[A-Za-z$]/.test(ch)) {
      let j = i;
      while (j < src.length && /[A-Za-z0-9$]/.test(src[j])) j++;
      const word = src.slice(i, j);
      i = j;
      const upper = word.toUpperCase();
      if (upper === 'TRUE' || upper === 'FALSE') {
        out.push({ k: 'lit', s: upper });
        continue;
      }
      m = /^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/.exec(word);
      if (m) {
        out.push({
          k: 'ref',
          cabs: m[1] === '$', cs: m[2].toUpperCase(), cn: colIndex(m[2]),
          rabs: m[3] === '$', rs: m[4].replace(/^0+(?=\d)/, ''), rn: Number(m[4])
        });
        continue;
      }
      if (/^[A-Za-z0-9]+$/.test(word)) {
        out.push({ k: 'name', s: upper });
        continue;
      }
      return null;
    }
    if (OPS2.includes(rest.slice(0, 2))) {
      out.push({ k: 'op', s: rest.slice(0, 2) });
      i += 2;
      continue;
    }
    if (OPS1.includes(ch)) {
      out.push({ k: 'op', s: ch });
      i++;
      continue;
    }
    if (PUNCT.includes(ch)) {
      out.push({ k: 'pt', s: ch });
      i++;
      continue;
    }
    return null;
  }
  return out;
}

/* ---------- parser (02, section 2.6.2) ---------- */

function inside(t) {
  return t.cn >= 1 && t.cn <= COLS && t.rn >= 1 && t.rn <= ROWS;
}

function rectOf(a, b) {
  return {
    c0: Math.min(a.cn, b.cn), c1: Math.max(a.cn, b.cn),
    r0: Math.min(a.rn, b.rn), r1: Math.max(a.rn, b.rn),
    ins: inside(a) && inside(b)
  };
}

function parseTokens(toks) {
  let p = 0;
  const isOp = (set) => p < toks.length && toks[p].k === 'op' && set.includes(toks[p].s);
  const isPt = (s) => p < toks.length && toks[p].k === 'pt' && toks[p].s === s;
  const fail = () => { throw new Error('invalid formula'); };

  function comparison() {
    let l = concat();
    while (isOp(CMP_OPS)) {
      const op = toks[p++].s;
      l = { t: 'bin', op, l, r: concat() };
    }
    return l;
  }
  function concat() {
    let l = sum();
    while (isOp(['&'])) {
      p++;
      l = { t: 'bin', op: '&', l, r: sum() };
    }
    return l;
  }
  function sum() {
    let l = product();
    while (isOp(['+', '-'])) {
      const op = toks[p++].s;
      l = { t: 'bin', op, l, r: product() };
    }
    return l;
  }
  function product() {
    let l = signed();
    while (isOp(['*', '/'])) {
      const op = toks[p++].s;
      l = { t: 'bin', op, l, r: signed() };
    }
    return l;
  }
  function signed() {
    if (isOp(['-', '+'])) {
      const op = toks[p++].s;
      return { t: 'un', op, e: signed() };
    }
    return power();
  }
  function power() {
    const base = percent();
    if (isOp(['^'])) {
      p++;
      return { t: 'bin', op: '^', l: base, r: signed() };
    }
    return base;
  }
  function percent() {
    let e = primary();
    while (isOp(['%'])) {
      p++;
      e = { t: 'pct', e };
    }
    return e;
  }
  function primary() {
    if (p >= toks.length) fail();
    const t = toks[p];
    if (t.k === 'num') {
      p++;
      return { t: 'num', v: fin(Number(t.s)) };
    }
    if (t.k === 'str') {
      p++;
      return { t: 'str', v: t.s.slice(1, -1).replace(/""/g, '"') };
    }
    if (t.k === 'lit') {
      p++;
      return { t: 'bool', v: t.s === 'TRUE' };
    }
    if (t.k === 'err') {
      p++;
      return { t: 'err' };
    }
    if (t.k === 'ref') {
      p++;
      if (isPt(':')) {
        p++;
        if (p >= toks.length || toks[p].k !== 'ref') fail();
        return { t: 'range', ...rectOf(t, toks[p++]) };
      }
      return { t: 'ref', ...rectOf(t, t) };
    }
    if (t.k === 'name') {
      p++;
      if (!isPt('(')) return { t: 'name' };
      p++;
      const args = [];
      if (isPt(')')) {
        p++;
        return { t: 'call', n: t.s, args };
      }
      for (;;) {
        args.push(comparison());
        if (isPt(',')) { p++; continue; }
        if (isPt(')')) { p++; break; }
        fail();
      }
      return { t: 'call', n: t.s, args };
    }
    if (isPt('(')) {
      p++;
      const e = comparison();
      if (!isPt(')')) fail();
      p++;
      return { t: 'paren', e };
    }
    return fail();
  }

  try {
    const root = comparison();
    return p === toks.length ? root : null;
  } catch (e) {
    return null;
  }
}

/* ---------- canonical writing and rewriting (02, sections 2.6.4 and 2.10) ---------- */

function colPart(t) { return (t.cabs ? '$' : '') + t.cs; }
function rowPart(t) { return (t.rabs ? '$' : '') + t.rs; }

function rangeText(a, b) {
  const colFirst = a.cn <= b.cn ? a : b;
  const colSecond = a.cn <= b.cn ? b : a;
  const rowFirst = a.rn <= b.rn ? a : b;
  const rowSecond = a.rn <= b.rn ? b : a;
  return colPart(colFirst) + rowPart(rowFirst) + ':' + colPart(colSecond) + rowPart(rowSecond);
}

function tokenText(t) {
  switch (t.k) {
    case 'err': return '#REF!';
    case 'ref': return colPart(t) + rowPart(t);
    default: return t.s;
  }
}

function emitFormula(toks) {
  let out = '=';
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    const mid = toks[i + 1];
    const end = toks[i + 2];
    if (t.k === 'ref' && mid && mid.k === 'pt' && mid.s === ':' && end && end.k === 'ref') {
      out += rangeText(t, end);
      i += 2;
      continue;
    }
    out += tokenText(t);
  }
  return out;
}

// The string stored for a committed string (02, section 2.2, rule 2).
function storedRaw(s) {
  if (s[0] !== '=') return s;
  const toks = tokenize(s.slice(1));
  if (!toks || !parseTokens(toks)) return s;
  return emitFormula(toks);
}

// Applies a token rule to a valid formula. Each rule gives a token, or REF_TOKEN, or for a range a pair.
function mapFormula(toks, single, range) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t.k !== 'ref') {
      out.push(t);
      continue;
    }
    const mid = toks[i + 1];
    const end = toks[i + 2];
    if (mid && mid.k === 'pt' && mid.s === ':' && end && end.k === 'ref') {
      const pair = range(t, end);
      if (pair === REF_TOKEN) {
        out.push(REF_TOKEN);
      } else {
        out.push(pair[0], { k: 'pt', s: ':' }, pair[1]);
      }
      i += 2;
      continue;
    }
    out.push(single(t));
  }
  return out;
}

function rewriteRaw(raw, rule) {
  if (raw[0] !== '=') return raw;
  const toks = tokenize(raw.slice(1));
  if (!toks || !parseTokens(toks)) return raw;
  return emitFormula(mapFormula(toks, rule.single, rule.range));
}

function axisOps(axis) {
  const isRow = axis === 'row';
  return {
    limit: isRow ? ROWS : COLS,
    get: (t) => (isRow ? t.rn : t.cn),
    set: (t, n) => (isRow ? { ...t, rn: n, rs: String(n) } : { ...t, cn: n, cs: colLetters(n) })
  };
}

function insertRule(axis, p) {
  const { limit, get, set } = axisOps(axis);
  const moved = (n) => (n >= p ? n + 1 : n);
  return {
    single(t) {
      if (!inside(t)) return t;
      const n = moved(get(t));
      return n > limit ? REF_TOKEN : set(t, n);
    },
    range(a, b) {
      if (!inside(a) || !inside(b)) return [a, b];
      const lo = moved(Math.min(get(a), get(b)));
      const hi = Math.min(moved(Math.max(get(a), get(b))), limit);
      if (lo > limit) return REF_TOKEN;
      return get(a) <= get(b) ? [set(a, lo), set(b, hi)] : [set(a, hi), set(b, lo)];
    }
  };
}

function deleteRule(axis, p) {
  const { get, set } = axisOps(axis);
  return {
    single(t) {
      if (!inside(t)) return t;
      const n = get(t);
      if (n < p) return t;
      if (n === p) return REF_TOKEN;
      return set(t, n - 1);
    },
    range(a, b) {
      if (!inside(a) || !inside(b)) return [a, b];
      let lo = Math.min(get(a), get(b));
      let hi = Math.max(get(a), get(b));
      if (p > hi) return [a, b];
      if (p < lo) {
        lo -= 1;
        hi -= 1;
      } else if (lo === hi) {
        return REF_TOKEN;
      } else {
        hi -= 1;
      }
      return get(a) <= get(b) ? [set(a, lo), set(b, hi)] : [set(a, hi), set(b, lo)];
    }
  };
}

function pasteOne(t, dc, dr) {
  const cn = t.cabs ? t.cn : t.cn + dc;
  const rn = t.rabs ? t.rn : t.rn + dr;
  if (cn < 1 || cn > COLS || rn < 1 || rn > ROWS) return null;
  return { ...t, cn, cs: colLetters(cn), rn, rs: String(rn) };
}

function pasteRule(dc, dr) {
  return {
    single: (t) => pasteOne(t, dc, dr) || REF_TOKEN,
    range: (a, b) => {
      const x = pasteOne(a, dc, dr);
      const y = pasteOne(b, dc, dr);
      return x && y ? [x, y] : REF_TOKEN;
    }
  };
}

/* ---------- evaluation (02, sections 2.7 and 2.8) ---------- */

function fromRect(c0, c1, r0, r1) {
  const cells = [];
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) cells.push(idxOf(c, r));
  }
  return cells;
}

function collectDeps(node, out) {
  switch (node.t) {
    case 'ref':
    case 'range':
      if (node.ins) fromRect(node.c0, node.c1, node.r0, node.r1).forEach((i) => out.add(i));
      return;
    case 'bin':
      collectDeps(node.l, out);
      collectDeps(node.r, out);
      return;
    case 'un':
    case 'pct':
    case 'paren':
      collectDeps(node.e, out);
      return;
    case 'call':
      node.args.forEach((a) => collectDeps(a, out));
      return;
    default:
  }
}

function isRangeArg(node) {
  return node.t === 'ref' || node.t === 'range' || node.t === 'err';
}

function rangeOf(node) {
  if (node.t === 'err' || !node.ins) return { err: ERR.REF };
  return {
    cells: fromRect(node.c0, node.c1, node.r0, node.r1),
    rows: node.r1 - node.r0 + 1,
    cols: node.c1 - node.c0 + 1
  };
}

function rankOf(v) {
  if (typeof v === 'number') return 0;
  if (typeof v === 'string') return 1;
  return 2;
}

function compareValues(a, b) {
  const ra = rankOf(a);
  const rb = rankOf(b);
  if (ra !== rb) return ra < rb ? -1 : 1;
  if (ra === 0) return a < b ? -1 : a > b ? 1 : 0;
  if (ra === 1) {
    const x = a.toUpperCase();
    const y = b.toUpperCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }
  return (a ? 1 : 0) - (b ? 1 : 0);
}

function blankLike(v) {
  if (typeof v === 'number') return 0;
  if (typeof v === 'string') return '';
  return false;
}

function compareOp(op, a, b) {
  if (a === null && b === null) {
    a = 0;
    b = 0;
  } else if (a === null) {
    a = blankLike(b);
  } else if (b === null) {
    b = blankLike(a);
  }
  const c = compareValues(a, b);
  switch (op) {
    case '=': return c === 0;
    case '<>': return c !== 0;
    case '<': return c < 0;
    case '<=': return c <= 0;
    case '>': return c > 0;
    default: return c >= 0;
  }
}

function toNumber(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v === null) return 0;
  return ERR.VALUE;
}

function toLogical(v) {
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  if (v === null) return false;
  return ERR.VALUE;
}

function toText(v) {
  if (typeof v === 'number') return general(v);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (v === null) return '';
  return v;
}

function powerOf(a, b) {
  if (a === 0 && b === 0) return ERR.NUM;
  if (a === 0 && b < 0) return ERR.DIV0;
  if (a < 0 && !Number.isInteger(b)) return ERR.NUM;
  return fin(Math.pow(a, b));
}

function evalBinary(node) {
  const a = evalNode(node.l);
  const b = evalNode(node.r);
  if (a instanceof Err) return a;
  if (b instanceof Err) return b;
  const op = node.op;
  if (op === '&') return toText(a) + toText(b);
  if (CMP_OPS.includes(op)) return compareOp(op, a, b);
  const x = toNumber(a);
  if (x instanceof Err) return x;
  const y = toNumber(b);
  if (y instanceof Err) return y;
  switch (op) {
    case '+': return fin(x + y);
    case '-': return fin(x - y);
    case '*': return fin(x * y);
    case '/': return y === 0 ? ERR.DIV0 : fin(x / y);
    default: return powerOf(x, y);
  }
}

function evalNode(node) {
  switch (node.t) {
    case 'num':
    case 'str':
    case 'bool':
      return node.v;
    case 'err':
      return ERR.REF;
    case 'ref':
      return node.ins ? cellValue(idxOf(node.c0, node.r0)) : ERR.REF;
    case 'range':
      return ERR.VALUE;
    case 'name':
      return ERR.NAME;
    case 'paren':
      return evalNode(node.e);
    case 'un': {
      const a = evalNode(node.e);
      if (a instanceof Err) return a;
      const x = toNumber(a);
      if (x instanceof Err) return x;
      return fin(node.op === '-' ? -x : x);
    }
    case 'pct': {
      const a = evalNode(node.e);
      if (a instanceof Err) return a;
      const x = toNumber(a);
      if (x instanceof Err) return x;
      return fin(x / 100);
    }
    case 'bin':
      return evalBinary(node);
    case 'call':
      return callFunction(node);
    default:
      return ERR.NAME;
  }
}

function numArg(node) {
  const v = evalNode(node);
  if (v instanceof Err) return v;
  return toNumber(v);
}

function textArg(node) {
  const v = evalNode(node);
  if (v instanceof Err) return v;
  return toText(v);
}

function aggregate(name, args) {
  let sum = 0;
  let count = 0;
  let lo = null;
  let hi = null;
  let tally = 0;
  const add = (x) => {
    sum += x;
    count++;
    if (lo === null || x < lo) lo = x;
    if (hi === null || x > hi) hi = x;
  };
  for (const arg of args) {
    if (isRangeArg(arg)) {
      const rg = rangeOf(arg);
      if (rg.err) return rg.err;
      for (const i of rg.cells) {
        const v = cellValue(i);
        if (v instanceof Err) return v;
        if (name === 'COUNTA') {
          if (v !== null) tally++;
        } else if (name === 'COUNT') {
          if (typeof v === 'number') tally++;
        } else if (typeof v === 'number') {
          add(v);
        }
      }
    } else {
      const v = evalNode(arg);
      if (v instanceof Err) return v;
      if (name === 'COUNTA') {
        tally++;
      } else if (name === 'COUNT') {
        if (typeof v === 'number') tally++;
      } else {
        const x = toNumber(v);
        if (x instanceof Err) return x;
        add(x);
      }
    }
  }
  switch (name) {
    case 'SUM': return fin(sum);
    case 'AVERAGE': return count === 0 ? ERR.DIV0 : fin(sum / count);
    case 'MIN': return count === 0 ? 0 : fin(lo);
    case 'MAX': return count === 0 ? 0 : fin(hi);
    default: return tally;
  }
}

function parseCriterion(v) {
  if (typeof v === 'number' || typeof v === 'boolean') return { op: '=', x: v };
  if (v === null) return { op: '=', x: '' };
  for (const op of ['>=', '<=', '<>', '>', '<', '=']) {
    if (v.startsWith(op)) {
      const rest = v.slice(op.length);
      const num = entryNumber(rest);
      if (num !== null) return { op, x: num };
      const upper = rest.toUpperCase();
      if (upper === 'TRUE' || upper === 'FALSE') return { op, x: upper === 'TRUE' };
      return { op, x: rest };
    }
  }
  return { op: '=', x: v };
}

function criterionMatches(v, op, x) {
  const same = rankOf(v) === rankOf(x);
  if (op === '=') return same && compareValues(v, x) === 0;
  if (op === '<>') return !(same && compareValues(v, x) === 0);
  if (!same) return false;
  const c = compareValues(v, x);
  switch (op) {
    case '<': return c < 0;
    case '<=': return c <= 0;
    case '>': return c > 0;
    default: return c >= 0;
  }
}

function conditional(rangeNode, critNode, sumNode) {
  if (!isRangeArg(rangeNode)) return ERR.VALUE;
  if (sumNode && !isRangeArg(sumNode)) return ERR.VALUE;
  const rg = rangeOf(rangeNode);
  if (rg.err) return rg.err;
  let sg = null;
  if (sumNode) {
    sg = rangeOf(sumNode);
    if (sg.err) return sg.err;
    if (sg.rows !== rg.rows || sg.cols !== rg.cols) return ERR.VALUE;
  }
  const crit = evalNode(critNode);
  if (crit instanceof Err) return crit;
  const { op, x } = parseCriterion(crit);
  let count = 0;
  let sum = 0;
  for (let j = 0; j < rg.cells.length; j++) {
    const v = cellValue(rg.cells[j]);
    if (v instanceof Err) return v;
    if (v === null || !criterionMatches(v, op, x)) continue;
    if (!sg) {
      count++;
      continue;
    }
    const s = cellValue(sg.cells[j]);
    if (s instanceof Err) return s;
    if (typeof s === 'number') sum += s;
  }
  return sg ? fin(sum) : count;
}

function callFunction(node) {
  const ar = ARITY[node.n];
  if (!ar) return ERR.NAME;
  if (node.args.length < ar[0] || node.args.length > ar[1]) return ERR.ARGS;
  const a = node.args;
  switch (node.n) {
    case 'SUM':
    case 'AVERAGE':
    case 'MIN':
    case 'MAX':
    case 'COUNT':
    case 'COUNTA':
      return aggregate(node.n, a);
    case 'ROUND': {
      const x = numArg(a[0]);
      if (x instanceof Err) return x;
      const d = numArg(a[1]);
      if (d instanceof Err) return d;
      const k = Math.trunc(d);
      if (k < -9 || k > 9) return ERR.NUM;
      return fin(roundDec(x, k));
    }
    case 'ABS': {
      const x = numArg(a[0]);
      return x instanceof Err ? x : fin(Math.abs(x));
    }
    case 'INT': {
      const x = numArg(a[0]);
      return x instanceof Err ? x : fin(Math.floor(x));
    }
    case 'MOD': {
      const x = numArg(a[0]);
      if (x instanceof Err) return x;
      const y = numArg(a[1]);
      if (y instanceof Err) return y;
      if (y === 0) return ERR.DIV0;
      return fin(x - y * Math.floor(x / y));
    }
    case 'IF': {
      const c = evalNode(a[0]);
      if (c instanceof Err) return c;
      const l = toLogical(c);
      if (l instanceof Err) return l;
      return evalNode(l ? a[1] : a[2]);
    }
    case 'AND':
    case 'OR': {
      let firstErr = null;
      let anyTrue = false;
      let allTrue = true;
      for (const arg of a) {
        const v = evalNode(arg);
        const l = v instanceof Err ? v : toLogical(v);
        if (l instanceof Err) {
          if (firstErr === null) firstErr = l;
          continue;
        }
        if (l) anyTrue = true;
        else allTrue = false;
      }
      if (firstErr) return firstErr;
      return node.n === 'AND' ? allTrue : anyTrue;
    }
    case 'NOT': {
      const v = evalNode(a[0]);
      if (v instanceof Err) return v;
      const l = toLogical(v);
      return l instanceof Err ? l : !l;
    }
    case 'IFERROR': {
      const x = evalNode(a[0]);
      return x instanceof Err ? evalNode(a[1]) : x;
    }
    case 'ISERROR':
      return evalNode(a[0]) instanceof Err;
    case 'ISBLANK': {
      if (isRangeArg(a[0])) {
        const rg = rangeOf(a[0]);
        if (rg.err) return rg.err;
        if (a[0].t === 'range') return ERR.VALUE;
        return cellValue(rg.cells[0]) === null;
      }
      const v = evalNode(a[0]);
      return v instanceof Err ? v : false;
    }
    case 'LEN': {
      const t = textArg(a[0]);
      return t instanceof Err ? t : t.length;
    }
    case 'UPPER': {
      const t = textArg(a[0]);
      return t instanceof Err ? t : t.toUpperCase();
    }
    case 'LEFT': {
      const t = textArg(a[0]);
      if (t instanceof Err) return t;
      const n = numArg(a[1]);
      if (n instanceof Err) return n;
      const k = Math.trunc(n);
      if (k < 0) return ERR.VALUE;
      return t.slice(0, k);
    }
    case 'RIGHT': {
      const t = textArg(a[0]);
      if (t instanceof Err) return t;
      const n = numArg(a[1]);
      if (n instanceof Err) return n;
      const k = Math.trunc(n);
      if (k < 0) return ERR.VALUE;
      return t.slice(Math.max(0, t.length - k));
    }
    case 'MID': {
      const t = textArg(a[0]);
      if (t instanceof Err) return t;
      const s = numArg(a[1]);
      if (s instanceof Err) return s;
      const n = numArg(a[2]);
      if (n instanceof Err) return n;
      const start = Math.trunc(s);
      const len = Math.trunc(n);
      if (start < 1 || len < 0) return ERR.VALUE;
      return t.slice(start - 1, start - 1 + len);
    }
    case 'CONCAT': {
      let out = '';
      for (const arg of a) {
        if (isRangeArg(arg)) {
          const rg = rangeOf(arg);
          if (rg.err) return rg.err;
          for (const i of rg.cells) {
            const v = cellValue(i);
            if (v instanceof Err) return v;
            out += toText(v);
          }
        } else {
          const v = evalNode(arg);
          if (v instanceof Err) return v;
          out += toText(v);
        }
      }
      return out;
    }
    case 'COUNTIF':
      return conditional(a[0], a[1], null);
    case 'SUMIF':
      return conditional(a[0], a[1], a[2]);
    default:
      return ERR.NAME;
  }
}

/* ---------- sheet state and recalculation (02, section 2.9) ---------- */

function blankCell() { return { raw: '', fmt: 'general' }; }
function copyCell(c) { return { raw: c.raw, fmt: c.fmt }; }

function at(r, c) { return r * COLS + c; }
function rowOf(i) { return Math.floor(i / COLS); }
function colOf(i) { return i % COLS; }
// Cell index from a 1-based column and row.
function idxOf(c, r) { return (r - 1) * COLS + (c - 1); }
function addr(i) { return COL_NAMES[colOf(i)] + (rowOf(i) + 1); }

let cells = Array.from({ length: ROWS * COLS }, blankCell);
const sel = { anchor: 0, active: 0 };
let editing = false;
let clip = null;
const hist = { steps: [], hi: 0 };
let INFO = [];
let MEMO = [];
let VALUES = [];

function selRect() {
  const a = sel.anchor;
  const b = sel.active;
  return {
    r0: Math.min(rowOf(a), rowOf(b)),
    r1: Math.max(rowOf(a), rowOf(b)),
    c0: Math.min(colOf(a), colOf(b)),
    c1: Math.max(colOf(a), colOf(b))
  };
}

function forEachInRect(rect, fn) {
  for (let r = rect.r0; r <= rect.r1; r++) {
    for (let c = rect.c0; c <= rect.c1; c++) fn(at(r, c));
  }
}

function computeValue(i) {
  const cell = cells[i];
  const info = INFO[i];
  if (cell.raw === '') return null;
  if (cell.raw[0] === '=') {
    if (!info.ast) return ERR.SYNTAX;
    if (info.circ) return ERR.CYCLE;
    const v = evalNode(info.ast);
    return v === null ? 0 : v;
  }
  return constantValue(cell.raw);
}

function cellValue(i) {
  if (MEMO[i] === undefined) MEMO[i] = computeValue(i);
  return MEMO[i];
}

function recalc() {
  INFO = cells.map((cell) => {
    const info = { ast: null, deps: new Set(), circ: false };
    if (cell.raw[0] === '=') {
      const toks = tokenize(cell.raw.slice(1));
      info.ast = toks ? parseTokens(toks) : null;
      if (info.ast) collectDeps(info.ast, info.deps);
    }
    return info;
  });
  INFO.forEach((info, i) => {
    if (!info.ast) return;
    const seen = new Set();
    const stack = [...info.deps];
    while (stack.length) {
      const j = stack.pop();
      if (j === i) {
        info.circ = true;
        break;
      }
      if (seen.has(j)) continue;
      seen.add(j);
      stack.push(...INFO[j].deps);
    }
  });
  MEMO = new Array(cells.length);
  VALUES = cells.map((_, i) => cellValue(i));
}

/* ---------- history (07) ---------- */

function snapshot() {
  return {
    cells: cells.map(copyCell),
    anchor: sel.anchor,
    active: sel.active
  };
}

function pushHistory(before, after) {
  hist.steps.length = hist.hi;
  hist.steps.push({ before, after });
  if (hist.steps.length > HISTORY_LIMIT) hist.steps.shift();
  hist.hi = hist.steps.length;
}

function restore(state) {
  cells = state.cells.map(copyCell);
  sel.anchor = state.anchor;
  sel.active = state.active;
  recalc();
  render();
}

function undo() {
  if (hist.hi === 0) return;
  hist.hi--;
  restore(hist.steps[hist.hi].before);
}

function redo() {
  if (hist.hi >= hist.steps.length) return;
  restore(hist.steps[hist.hi].after);
  hist.hi++;
}

/* ---------- editing and selection ---------- */

function commitInput() {
  const raw = storedRaw(input.value);
  const cell = cells[sel.active];
  const changed = raw !== cell.raw;
  editing = false;
  if (changed) {
    cell.raw = raw;
    recalc();
  }
  return changed;
}

function commitAndMove(dr, dc) {
  const before = snapshot();
  const changed = editing ? commitInput() : false;
  const r = clamp(rowOf(sel.active) + dr, 0, ROWS - 1);
  const c = clamp(colOf(sel.active) + dc, 0, COLS - 1);
  sel.active = at(r, c);
  sel.anchor = sel.active;
  if (changed) pushHistory(before, snapshot());
  render();
}

function clickCell(i, shift) {
  const before = snapshot();
  const changed = editing ? commitInput() : false;
  if (shift) {
    sel.active = i;
  } else {
    sel.anchor = i;
    sel.active = i;
  }
  if (changed) pushHistory(before, snapshot());
  grid.focus();
  render();
}

function moveActive(dr, dc, extend) {
  const r = clamp(rowOf(sel.active) + dr, 0, ROWS - 1);
  const c = clamp(colOf(sel.active) + dc, 0, COLS - 1);
  sel.active = at(r, c);
  if (!extend) sel.anchor = sel.active;
}

function clamp(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));
}

/* ---------- actions ---------- */

function clearSelection() {
  const before = snapshot();
  let changed = false;
  forEachInRect(selRect(), (i) => {
    if (cells[i].raw !== '') {
      cells[i].raw = '';
      changed = true;
    }
  });
  if (changed) {
    recalc();
    pushHistory(before, snapshot());
  }
  render();
}

function setFormat(fmt) {
  const before = snapshot();
  let changed = false;
  forEachInRect(selRect(), (i) => {
    if (cells[i].fmt !== fmt) {
      cells[i].fmt = fmt;
      changed = true;
    }
  });
  if (changed) pushHistory(before, snapshot());
  render();
}

function copySelection(mode) {
  const rect = selRect();
  const block = [];
  for (let r = rect.r0; r <= rect.r1; r++) {
    const row = [];
    for (let c = rect.c0; c <= rect.c1; c++) row.push(copyCell(cells[at(r, c)]));
    block.push(row);
  }
  clip = { mode, r0: rect.r0, c0: rect.c0, cells: block };
  render();
}

function paste() {
  if (!clip) return;
  const before = snapshot();
  const rect = selRect();
  if (clip.mode === 'cut') {
    clip.cells.forEach((row, j) => row.forEach((_, i) => {
      cells[at(clip.r0 + j, clip.c0 + i)] = blankCell();
    }));
  }
  const dr = rect.r0 - clip.r0;
  const dc = rect.c0 - clip.c0;
  const rule = pasteRule(dc, dr);
  clip.cells.forEach((row, j) => row.forEach((src, i) => {
    const r = rect.r0 + j;
    const c = rect.c0 + i;
    if (r >= ROWS || c >= COLS) return;
    const raw = clip.mode === 'copy' ? rewriteRaw(src.raw, rule) : src.raw;
    cells[at(r, c)] = { raw, fmt: src.fmt };
  }));
  if (clip.mode === 'cut') clip = null;
  sel.anchor = at(rect.r0, rect.c0);
  sel.active = sel.anchor;
  recalc();
  pushHistory(before, snapshot());
  render();
}

function applyRule(rule) {
  cells.forEach((cell) => {
    cell.raw = rewriteRaw(cell.raw, rule);
  });
}

function shiftLines(axis, index, insert) {
  if (axis === 'row') {
    if (insert) {
      for (let r = ROWS - 2; r >= index; r--) {
        for (let c = 0; c < COLS; c++) cells[at(r + 1, c)] = copyCell(cells[at(r, c)]);
      }
      for (let c = 0; c < COLS; c++) cells[at(index, c)] = blankCell();
    } else {
      for (let r = index; r < ROWS - 1; r++) {
        for (let c = 0; c < COLS; c++) cells[at(r, c)] = copyCell(cells[at(r + 1, c)]);
      }
      for (let c = 0; c < COLS; c++) cells[at(ROWS - 1, c)] = blankCell();
    }
    return;
  }
  if (insert) {
    for (let c = COLS - 2; c >= index; c--) {
      for (let r = 0; r < ROWS; r++) cells[at(r, c + 1)] = copyCell(cells[at(r, c)]);
    }
    for (let r = 0; r < ROWS; r++) cells[at(r, index)] = blankCell();
  } else {
    for (let c = index; c < COLS - 1; c++) {
      for (let r = 0; r < ROWS; r++) cells[at(r, c)] = copyCell(cells[at(r, c + 1)]);
    }
    for (let r = 0; r < ROWS; r++) cells[at(r, COLS - 1)] = blankCell();
  }
}

function structuralChange(axis, insert) {
  const before = snapshot();
  const i = sel.active;
  const index = axis === 'row' ? rowOf(i) : colOf(i);
  const rule = insert ? insertRule(axis, index + 1) : deleteRule(axis, index + 1);
  applyRule(rule);
  shiftLines(axis, index, insert);
  recalc();
  pushHistory(before, snapshot());
  render();
}

/* ---------- rendering ---------- */

const $ = (id) => document.getElementById(id);
const grid = $('grid');
const input = $('formula-input');
const nameBox = $('name-box');
const summary = $('selection-summary');
const fmtSelect = $('format-select');
const undoBtn = $('undo-button');
const redoBtn = $('redo-button');
const copyBtn = $('copy-button');
const cutBtn = $('cut-button');
const pasteBtn = $('paste-button');
const clearBtn = $('clear-button');
const insRowBtn = $('insert-row');
const delRowBtn = $('delete-row');
const insColBtn = $('insert-col');
const delColBtn = $('delete-col');
const EDIT_LOCKED = [copyBtn, cutBtn, clearBtn, insRowBtn, delRowBtn, insColBtn, delColBtn, fmtSelect];
const cellEls = [];

function buildGrid() {
  const head = document.createElement('div');
  head.className = 'row';
  head.setAttribute('role', 'row');
  const corner = document.createElement('div');
  corner.className = 'corner';
  corner.setAttribute('role', 'presentation');
  head.appendChild(corner);
  COL_NAMES.forEach((name) => {
    const h = document.createElement('div');
    h.className = 'hdr';
    h.setAttribute('role', 'columnheader');
    h.dataset.testid = 'col-header-' + name;
    h.textContent = name;
    head.appendChild(h);
  });
  grid.appendChild(head);

  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('role', 'row');
    const rh = document.createElement('div');
    rh.className = 'hdr';
    rh.setAttribute('role', 'rowheader');
    rh.dataset.testid = 'row-header-' + (r + 1);
    rh.textContent = String(r + 1);
    row.appendChild(rh);
    for (let c = 0; c < COLS; c++) {
      const i = at(r, c);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.setAttribute('role', 'gridcell');
      cell.dataset.testid = 'cell-' + COL_NAMES[c] + (r + 1);
      cell.dataset.index = String(i);
      row.appendChild(cell);
      cellEls[i] = cell;
    }
    grid.appendChild(row);
  }
}

function summaryText(rect) {
  let sum = 0;
  let n = 0;
  forEachInRect(rect, (i) => {
    const v = VALUES[i];
    if (typeof v === 'number') {
      sum += v;
      n++;
    }
  });
  if (n === 0) return '';
  const s = fin(sum);
  const a = fin(sum / n);
  const sText = s instanceof Err ? '#NUM!' : general(s);
  const aText = a instanceof Err ? '#NUM!' : general(a);
  return `Sum: ${sText} | Average: ${aText} | Count: ${n}`;
}

function render() {
  const rect = selRect();
  cells.forEach((cell, i) => {
    const el = cellEls[i];
    const v = VALUES[i];
    const r = rowOf(i);
    const c = colOf(i);
    const inSel = r >= rect.r0 && r <= rect.r1 && c >= rect.c0 && c <= rect.c1;
    el.textContent = v === null ? '' : String(displayOf(v, cell.fmt));
    el.dataset.kind = kindOf(v);
    el.setAttribute('aria-selected', String(i === sel.active));
    el.setAttribute('data-in-selection', String(inSel));
  });

  const active = cells[sel.active];
  const single = rect.r0 === rect.r1 && rect.c0 === rect.c1;
  nameBox.textContent = single
    ? addr(sel.active)
    : addr(at(rect.r0, rect.c0)) + ':' + addr(at(rect.r1, rect.c1));

  if (!editing) {
    input.value = active.raw;
    fmtSelect.value = active.fmt;
  }
  input.dataset.editing = String(editing);

  const text = summaryText(rect);
  summary.textContent = text;
  summary.hidden = text === '';

  undoBtn.disabled = editing || hist.hi === 0;
  redoBtn.disabled = editing || hist.hi >= hist.steps.length;
  pasteBtn.disabled = editing || !clip;
  EDIT_LOCKED.forEach((el) => { el.disabled = editing; });
}

/* ---------- events ---------- */

grid.addEventListener('click', (e) => {
  const cell = e.target.closest('[role="gridcell"]');
  if (!cell) return;
  clickCell(Number(cell.dataset.index), e.shiftKey);
});

grid.addEventListener('keydown', (e) => {
  const key = e.key;
  const lower = key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (arrows[key]) {
    e.preventDefault();
    const [dr, dc] = arrows[key];
    moveActive(dr, dc, e.shiftKey);
    render();
  } else if (key === 'Delete' || key === 'Backspace') {
    e.preventDefault();
    clearSelection();
  } else if (key === 'Enter') {
    e.preventDefault();
    input.focus();
  } else if (ctrl && lower === 'z') {
    e.preventDefault();
    undo();
  } else if (ctrl && lower === 'y') {
    e.preventDefault();
    redo();
  }
});

input.addEventListener('input', () => {
  if (!editing) {
    editing = true;
    render();
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    commitAndMove(1, 0);
  } else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    commitAndMove(0, 1);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    editing = false;
    render();
    grid.focus();
  }
});

$('undo-button').addEventListener('click', undo);
$('redo-button').addEventListener('click', redo);
copyBtn.addEventListener('click', () => copySelection('copy'));
cutBtn.addEventListener('click', () => copySelection('cut'));
pasteBtn.addEventListener('click', paste);
clearBtn.addEventListener('click', clearSelection);
insRowBtn.addEventListener('click', () => structuralChange('row', true));
delRowBtn.addEventListener('click', () => structuralChange('row', false));
insColBtn.addEventListener('click', () => structuralChange('col', true));
delColBtn.addEventListener('click', () => structuralChange('col', false));
fmtSelect.addEventListener('change', () => setFormat(fmtSelect.value));

/* ---------- start ---------- */

buildGrid();
recalc();
render();

})();
</script>
</body>
</html>
