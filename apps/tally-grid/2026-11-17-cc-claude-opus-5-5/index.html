<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #16191d;
  --ink-soft: #3d434b;
  --line: #d5d9df;
  --head-bg: #e9ecf0;
  --head-sel: #cfdaf2;
  --sel-bg: #dbe6fd;
  --accent: #1d4ed8;
  --error: #a8001c;
  --disabled-ink: #858b93;
  --disabled-bg: #eceef1;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header {
  background: #1b2638;
  color: #ffffff;
  padding: 10px 16px;
}
header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px 16px 24px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 10px;
}
.toolbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
button, select {
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid #a5adb8;
  border-radius: 6px;
  padding: 5px 10px;
  min-height: 32px;
  cursor: pointer;
}
button:hover:not(:disabled), select:hover:not(:disabled) { background: #eef2fb; }
button:disabled, select:disabled {
  color: var(--disabled-ink);
  background: var(--disabled-bg);
  border-color: #cdd1d7;
  cursor: default;
}
button:focus-visible, select:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 1px;
}
.fbar {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  align-items: stretch;
}
.name-box {
  flex: 0 0 auto;
  min-width: 72px;
  padding: 5px 8px;
  background: var(--surface);
  border: 1px solid #a5adb8;
  border-radius: 6px;
  font-family: ui-monospace, Consolas, monospace;
  color: var(--ink);
  text-align: center;
  white-space: nowrap;
}
.fbar input {
  flex: 1 1 auto;
  min-width: 0;
  font: 14px ui-monospace, Consolas, monospace;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid #a5adb8;
  border-radius: 6px;
  padding: 5px 8px;
}
.fbar input:focus { outline: 3px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.fbar input[data-editing="true"] { background: #fffbe8; }
.grid-wrap {
  overflow-x: auto;
  max-width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}
table.grid {
  border-collapse: collapse;
  table-layout: fixed;
  width: 920px;
  user-select: none;
  -webkit-user-select: none;
  background: var(--surface);
}
table.grid:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
table.grid col.rh { width: 40px; }
table.grid th, table.grid td {
  border: 1px solid var(--line);
  height: 30px;
  padding: 0 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: pre;
}
table.grid th {
  background: var(--head-bg);
  color: var(--ink-soft);
  font-weight: 600;
  font-size: 12px;
  text-align: center;
}
table.grid th.hl { background: var(--head-sel); color: var(--ink); }
table.grid th[role="rowheader"], table.grid td.corner { position: sticky; left: 0; z-index: 1; }
table.grid td {
  background: var(--surface);
  color: var(--ink);
  cursor: cell;
}
table.grid td[data-kind="number"] { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td[data-kind="logical"] { text-align: center; }
table.grid td[data-kind="error"] { color: var(--error); text-align: center; font-weight: 600; }
table.grid td[data-in-selection="true"] { background: var(--sel-bg); }
table.grid td[aria-selected="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px #5b6b8c; }
table.grid:focus td[aria-selected="true"] { box-shadow: inset 0 0 0 3px var(--accent); }
.summary {
  margin-top: 10px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.summary[hidden] { display: none; }
@media (max-width: 600px) {
  main { padding: 10px 16px 20px; }
  table.grid { width: 808px; }
  button, select { padding: 5px 8px; }
  .toolbar .sep { display: none; }
}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar" role="toolbar" aria-label="Sheet actions">
    <button type="button" data-testid="undo-button">Undo</button>
    <button type="button" data-testid="redo-button">Redo</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-testid="copy-button">Copy</button>
    <button type="button" data-testid="cut-button">Cut</button>
    <button type="button" data-testid="paste-button">Paste</button>
    <button type="button" data-testid="clear-button">Clear</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-testid="insert-row">Insert row</button>
    <button type="button" data-testid="delete-row">Delete row</button>
    <button type="button" data-testid="insert-col">Insert column</button>
    <button type="button" data-testid="delete-col">Delete column</button>
    <span class="sep" aria-hidden="true"></span>
    <select data-testid="format-select" aria-label="Number format">
      <option value="general">General</option>
      <option value="fixed2">1,234.50</option>
      <option value="percent1">12.5%</option>
    </select>
  </div>
  <div class="fbar">
    <div class="name-box" data-testid="name-box">A1</div>
    <input type="text" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="grid-wrap" id="grid-wrap"></div>
  <div class="summary" data-testid="selection-summary" aria-live="polite" hidden></div>
</main>

<script>
/* ===================== Engine: values, formulas, rewriting ===================== */
var ROWS = 12, COLS = 8, NCELLS = 96, LETTERS = 'ABCDEFGH';
var BLANK = { t: 'blank' };
function E(code) { return { t: 'e', v: code }; }
function isErr(v) { return v.t === 'e'; }

/* ---- numbers ---- */
function N(x) { var y = Number(x.toPrecision(12)); return y === 0 ? 0 : y; }
function numV(x) {
  if (!isFinite(x)) return E('#NUM!');
  var y = N(x);
  if (Math.abs(y) >= 1e15) return E('#NUM!');

function decParts(x) {
  var s = x.toPrecision(12), neg = false, exp = 0;

  return { neg: neg, M: BigInt(ip + fp), scale: fp.length - exp };
}
function decRound(x, d) {
  var p = decParts(x), Q;
  if (p.scale <= d) Q = p.M * (10n ** BigInt(d - p.scale));
  else {
    var div = 10n ** BigInt(p.scale - d);
    Q = p.M / div;
    if ((p.M % div) * 2n >= div) Q += 1n;
  }
  return { neg: p.neg && Q !== 0n, Q: Q, d: d };
}
function qParts(q) {
  if (q.d <= 0) return [q.Q === 0n ? '0' : q.Q.toString() + '0'.repeat(-q.d), ''];
  var s = q.Q.toString().padStart(q.d + 1, '0');
  return [s.slice(0, s.length - q.d), s.slice(s.length - q.d)];
}
function roundNum(x, d) {
  var q = decRound(x, d), p = qParts(q);

function G(x) {
  var q = decRound(x, 6), p = qParts(q), f = p[1].replace(/0+$/, '');
  return (q.neg ? '-' : '') + p[0] + (f ? '.' + f : '');
}

  var q, p;
  if (fmt === 'fixed2') {
    q = decRound(x, 2); p = qParts(q);
    return (q.neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];

}

var ENTRY_RE = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
function entryNumber(s) {
  if (!ENTRY_RE.test(s)) return null;
  var pct = s[s.length - 1] === '%';
  var x = Number(pct ? s.slice(0, -1) : s);
  if (pct) x = x / 100;
  if (!isFinite(x)) return null;
  x = N(x);
  if (Math.abs(x) >= 1e15) return null;
  return x;
}
function literalValue(s) {
  if (s[0] === "'") return { t: 's', v: s.slice(1) };
  var t = s.replace(/^ +| +$/g, '');
  var x = entryNumber(t);
  if (x !== null) return { t: 'n', v: x };
  if (/^(true|false)$/i.test(t)) return { t: 'b', v: t.toUpperCase() === 'TRUE' };

/* ---- references ---- */
function colIdx(col) { return col.length === 1 ? LETTERS.indexOf(col) : -1; }
function rowIdx(row) { if (row.length > 2) return -1; var n = +row; return n >= 1 && n <= 12 ? n - 1 : -1; }
function refInside(r) { return colIdx(r.col) >= 0 && rowIdx(r.row) >= 0; }
function rangeInside(n) { return colIdx(n.c1.col) >= 0 && colIdx(n.c2.col) >= 0 && rowIdx(n.r1.row) >= 0 && rowIdx(n.r2.row) >= 0; }
function cmpLen(a, b) { return a.length !== b.length ? a.length - b.length : (a < b ? -1 : a > b ? 1 : 0); }
function makeRange(a, b) {
  var c1 = { col: a.col, abs: a.colAbs }, c2 = { col: b.col, abs: b.colAbs };
  var r1 = { row: a.row, abs: a.rowAbs }, r2 = { row: b.row, abs: b.rowAbs };
  return normRange({ k: 'range', c1: c1, c2: c2, r1: r1, r2: r2 });
}
function normRange(n) {
  var c1 = n.c1, c2 = n.c2, r1 = n.r1, r2 = n.r2, t;
  if (cmpLen(c1.col, c2.col) > 0) { t = c1; c1 = c2; c2 = t; }
  if (cmpLen(r1.row, r2.row) > 0) { t = r1; r1 = r2; r2 = t; }

}
function refStr(r) { return (r.colAbs ? '$' : '') + r.col + (r.rowAbs ? '$' : '') + r.row; }

/* ---- tokenizer & parser ---- */
var FUNCS = {
  SUM: [1, Infinity], AVERAGE: [1, Infinity], MIN: [1, Infinity], MAX: [1, Infinity],
  COUNT: [1, Infinity], COUNTA: [1, Infinity], ROUND: [2, 2], ABS: [1, 1], INT: [1, 1],
  MOD: [2, 2], IF: [3, 3], AND: [1, Infinity], OR: [1, Infinity], NOT: [1, 1],
  IFERROR: [2, 2], ISERROR: [1, 1], ISBLANK: [1, 1], LEN: [1, 1], UPPER: [1, 1],
  LEFT: [2, 2], RIGHT: [2, 2], MID: [3, 3], CONCAT: [1, Infinity], COUNTIF: [2, 2], SUMIF: [3, 3]
};
function SyntaxFail() {}
function tokenize(s) {
  var T = [], i = 0, n = s.length, m;
  var numRe = /\d+(\.\d+)?|\.\d+/y, wordRe = /[A-Za-z0-9$]+/y;

    var ch = s[i];
    if (ch === ' ') { i++; continue; }
    if ((ch >= '0' && ch <= '9') || ch === '.') {

      if (!m) throw new SyntaxFail();
      T.push({ t: 'num', s: m[0] }); i += m[0].length; continue;

    if (ch === '"') {
      var j = i + 1, v = '';

/* ---- precedents & cycles ---- */

    if (a.t === 'blank') a = b.t === 's' ? { t: 's', v: '' } : b.t === 'b' ? { t: 'b', v: false } : { t: 'n', v: 0 };
    if (b.t === 'blank') b = a.t === 's' ? { t: 's', v: '' } : a.t === 'b' ? { t: 'b', v: false } : { t: 'n', v: 0 };

  }
  function recalc() { vals = computeValues(raw); }

  /* ---- history ---- */
  function snap() { return { raw: raw.slice(), fmt: fmt.slice(), anchor: { r: anchor.r, c: anchor.c }, active: { r: active.r, c: active.c } }; }
  function restore(s) {
    raw = s.raw.slice(); fmt = s.fmt.slice();
    anchor = { r: s.anchor.r, c: s.anchor.c }; active = { r: s.active.r, c: s.active.c };
    recalc();
  }
  function pushStep(before) {
    undoStack.push({ before: before, after: snap() });
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
  }
  function undo() {
    if (editing || !undoStack.length) return;
    var st = undoStack.pop();
    restore(st.before);
    redoStack.push(st);
    render();
  }
  function redo() {
    if (editing || !redoStack.length) return;
    var st = redoStack.pop();
    restore(st.after);
    undoStack.push(st);
    render();
  }

  /* ---- editing ---- */
  /* Commits the field when editing; returns true when the sheet changed. */
  function commitEdit() {
    if (!editing) return false;
    editing = false;
    var i = activeIdx(), nr = storedRaw(input.value);
    if (nr === raw[i]) return false;
    raw[i] = nr;
    recalc();
    return true;
  }
  function moveActive(dr, dc) {
    active = { r: Math.max(0, Math.min(ROWS - 1, active.r + dr)), c: Math.max(0, Math.min(COLS - 1, active.c + dc)) };
  }
  function scrollActiveIntoView() {
    var el = cellEls[activeIdx()];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  input.addEventListener('input', function () {
    if (!editing) { editing = true; render(); }
  });
  input.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) {
      e.preventDefault();
      var before = snap();
      var changed = commitEdit();
      if (e.key === 'Enter') moveActive(1, 0); else moveActive(0, 1);
      anchor = { r: active.r, c: active.c };
      if (changed) pushStep(before);
      render();
      scrollActiveIntoView();
      input.focus();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      editing = false;
      render();
      table.focus();
    }
  });

  /* ---- pointer selection ---- */
  table.addEventListener('click', function (e) {
    var td = e.target.closest ? e.target.closest('td[role="gridcell"]') : null;
    if (!td) return;
    var r = +td.getAttribute('data-r'), c = +td.getAttribute('data-c');
    var before = snap();
    var changed = commitEdit();
    active = { r: r, c: c };
    if (!e.shiftKey) anchor = { r: r, c: c };
    if (changed) pushStep(before);
    render();
    table.focus();
  });
  table.addEventListener('mousedown', function (e) {
    if (e.shiftKey) e.preventDefault();
  });

  /* ---- grid keyboard ---- */
  var ARROWS = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  table.addEventListener('keydown', function (e) {
    var k = e.key, d = ARROWS[k];
    var ctrl = e.ctrlKey || e.metaKey;
    if (d && !ctrl && !e.altKey) {
      e.preventDefault();
      if (editing) return;
      moveActive(d[0], d[1]);
      if (!e.shiftKey) anchor = { r: active.r, c: active.c };
      render();
      scrollActiveIntoView();
      return;
    }
    if ((k === 'Delete' || k === 'Backspace') && !ctrl) {
      e.preventDefault();
      if (!editing) clearSelection();
      return;
    }
    if (k === 'Enter' && !ctrl) {
      e.preventDefault();
      input.focus();
      return;
    }
    if (ctrl && !e.altKey && (k === 'z' || k === 'Z')) { e.preventDefault(); undo(); return; }
    if (ctrl && !e.altKey && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  });

  /* ---- actions ---- */
  function clearSelection() {
    var cells = selCells();
    if (cells.every(function (i) { return raw[i] === ''; })) return;
    var before = snap();
    cells.forEach(function (i) { raw[i] = ''; });
    recalc();
    pushStep(before);
    render();
  }
  function setFormat(f) {
    if (editing) return;
    var cells = selCells();
    if (cells.every(function (i) { return fmt[i] === f; })) { render(); return; }
    var before = snap();
    cells.forEach(function (i) { fmt[i] = f; });
    pushStep(before);
    render();
  }
  function takeBlock(mode) {
    var s = selRect(), cells = [];
    for (var r = s.r1; r <= s.r2; r++) {
      var row = [];
      for (var c = s.c1; c <= s.c2; c++) row.push({ raw: raw[r * COLS + c], fmt: fmt[r * COLS + c] });
      cells.push(row);
    }
    clipboard = { mode: mode, r: s.r1, c: s.c1, rows: s.r2 - s.r1 + 1, cols: s.c2 - s.c1 + 1, cells: cells };
    render();
  }
  function paste() {
    if (editing || !clipboard) return;
    var before = snap(), cb = clipboard, s = selRect();
    var dr = s.r1 - cb.r, dc = s.c1 - cb.c;
    if (cb.mode === 'cut') {
      for (var r0 = cb.r; r0 < cb.r + cb.rows; r0++)
        for (var c0 = cb.c; c0 < cb.c + cb.cols; c0++) { raw[r0 * COLS + c0] = ''; fmt[r0 * COLS + c0] = 'general'; }
    }
    var fns = cb.mode === 'copy' ? pasteFns(dc, dr) : null;
    for (var i = 0; i < cb.rows; i++) {
      for (var j = 0; j < cb.cols; j++) {
        var r = s.r1 + i, c = s.c1 + j;
        if (r >= ROWS || c >= COLS) continue;
        var cell = cb.cells[i][j];
        raw[r * COLS + c] = fns ? rewriteRaw(cell.raw, fns[0], fns[1]) : cell.raw;
        fmt[r * COLS + c] = cell.fmt;
      }
    }
    if (cb.mode === 'cut') clipboard = null;
    anchor = { r: s.r1, c: s.c1 }; active = { r: s.r1, c: s.c1 };
    recalc();
    pushStep(before);
    render();
  }
  function structure(kind) {
    if (editing) return;
    var before = snap();
    var nr = new Array(NCELLS).fill(''), nf = new Array(NCELLS).fill('general');
    var k, fns;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var sr = r, sc = c;
        if (kind === 'insRow') { if (r === active.r) continue; if (r > active.r) sr = r - 1; }
        else if (kind === 'delRow') { if (r >= active.r) sr = r + 1; if (sr >= ROWS) continue; }
        else if (kind === 'insCol') { if (c === active.c) continue; if (c > active.c) sc = c - 1; }
        else if (kind === 'delCol') { if (c >= active.c) sc = c + 1; if (sc >= COLS) continue; }
        nr[r * COLS + c] = raw[sr * COLS + sc];
        nf[r * COLS + c] = fmt[sr * COLS + sc];
      }
    }
    if (kind === 'insRow') fns = insertFns('r', active.r + 1);
    else if (kind === 'delRow') fns = deleteFns('r', active.r + 1);
    else if (kind === 'insCol') fns = insertFns('c', active.c + 1);
    else fns = deleteFns('c', active.c + 1);
    for (k = 0; k < NCELLS; k++) nr[k] = rewriteRaw(nr[k], fns[0], fns[1]);
    raw = nr; fmt = nf;
    recalc();
    pushStep(before);
    render();
  }

  btn.undo.addEventListener('click', undo);
  btn.redo.addEventListener('click', redo);
  btn.copy.addEventListener('click', function () { if (!editing) takeBlock('copy'); });
  btn.cut.addEventListener('click', function () { if (!editing) takeBlock('cut'); });
  btn.paste.addEventListener('click', paste);
  btn.clear.addEventListener('click', function () { if (!editing) clearSelection(); });
  btn.insRow.addEventListener('click', function () { structure('insRow'); });
  btn.delRow.addEventListener('click', function () { structure('delRow'); });
  btn.insCol.addEventListener('click', function () { structure('insCol'); });
  btn.delCol.addEventListener('click', function () { structure('delCol'); });
  fmtSelect.addEventListener('change', function () { setFormat(fmtSelect.value); });

  render();
})();
</script>
</body>
</html>
