<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; background: #f3f5fa; color: #1b2333; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
body { min-height: 100vh; }
header { background: #1e2a4a; color: #ffffff; padding: 12px 16px; }
header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
main { max-width: 960px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select, input { font: inherit; color: #1b2333; }
button { background: #ffffff; border: 1px solid #aab3c8; border-radius: 6px; padding: 6px 10px; cursor: pointer; min-height: 34px; }
button:hover:not(:disabled) { background: #e6ecfa; }
button:disabled, select:disabled { background: #e9ecf3; color: #667085; border-color: #cfd5e3; cursor: not-allowed; }
select { background: #ffffff; border: 1px solid #aab3c8; border-radius: 6px; padding: 6px 8px; min-height: 34px; }
.fmt { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 1px; }
.fbar { display: flex; gap: 8px; align-items: center; }
#name-box { min-width: 84px; padding: 6px 10px; background: #ffffff; border: 1px solid #aab3c8; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; text-align: center; color: #1b2333; }
#formula-input { flex: 1; min-width: 0; padding: 6px 10px; background: #ffffff; border: 1px solid #aab3c8; border-radius: 6px; min-height: 34px; font-family: ui-monospace, Consolas, monospace; }
#formula-input[data-editing="true"] { border-color: #1d4ed8; box-shadow: 0 0 0 2px #bcd0ff; }
.scroller { overflow-x: auto; overflow-y: hidden; background: #ffffff; border: 1px solid #aab3c8; border-radius: 6px; }
#grid { width: max-content; background: #ffffff; user-select: none; -webkit-user-select: none; }
#grid:focus-visible { outline: 3px solid #1d4ed8; outline-offset: -3px; }
.row { display: grid; grid-template-columns: 44px repeat(8, 88px); }
.row > div { height: 32px; line-height: 30px; border-right: 1px solid #d3d9e6; border-bottom: 1px solid #d3d9e6; padding: 0 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.corner, .rh { position: sticky; left: 0; z-index: 2; background: #e6eaf3; }
.ch, .rh { background: #e6eaf3; color: #27304a; text-align: center; font-weight: 600; padding: 0 !important; }
.corner { padding: 0 !important; }
.cell { background: #ffffff; color: #1b2333; cursor: cell; }
.cell[data-kind="number"] { text-align: right; }
.cell[data-kind="error"] { color: #a01212; text-align: center; font-weight: 600; }
.cell[data-kind="logical"] { text-align: center; }
.cell[data-in-selection="true"] { background: #dbe7ff; }
.cell[aria-selected="true"] { background: #c4d7fc; outline: 2px solid #1d4ed8; outline-offset: -2px; }
#selection-summary { padding: 6px 10px; background: #ffffff; border: 1px solid #aab3c8; border-radius: 6px; color: #1b2333; align-self: flex-start; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Sonnet 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button" id="b-undo">Undo</button>
    <button type="button" data-testid="redo-button" id="b-redo">Redo</button>
    <button type="button" data-testid="copy-button" id="b-copy">Copy</button>
    <button type="button" data-testid="cut-button" id="b-cut">Cut</button>
    <button type="button" data-testid="paste-button" id="b-paste">Paste</button>
    <button type="button" data-testid="clear-button" id="b-clear">Clear</button>
    <button type="button" data-testid="insert-row" id="b-insrow">Insert row</button>
    <button type="button" data-testid="delete-row" id="b-delrow">Delete row</button>
    <button type="button" data-testid="insert-col" id="b-inscol">Insert column</button>
    <button type="button" data-testid="delete-col" id="b-delcol">Delete column</button>
    <label class="fmt">Number format
      <select data-testid="format-select" id="format-select">
        <option value="general">General</option>
        <option value="fixed2">1,234.50</option>
        <option value="percent1">12.5%</option>
      </select>
    </label>
  </div>
  <div class="fbar">
    <div id="name-box" data-testid="name-box">A1</div>
    <input type="text" id="formula-input" data-testid="formula-input" aria-label="Cell content" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="scroller"><div id="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></div></div>
  <div id="selection-summary" data-testid="selection-summary" hidden></div>
</main>
<script>
"use strict";
(function () {
  const NC = 8, NR = 12;
  const COLS = "ABCDEFGH";

  // ---------- numbers ----------
  const norm = x => { const v = Number(x.toPrecision(12)); return v === 0 ? 0 : v; };
  const E = code => ({ t: "e", v: code });
  const BLANK = { t: "z" };
  const numRes = x => {
    if (!isFinite(x)) return E("#NUM!");
    const v = norm(x);
    if (Math.abs(v) >= 1e15) return E("#NUM!");
    return { t: "n", v };
  };
  function dec(x) {
    let s = x.toPrecision(12), neg = false;
    if (s[0] === "-") { neg = true; s = s.slice(1); }
    const m = s.match(/^(\d)(?:\.(\d+))?e([+-]\d+)$/);
    let int, frac;
    if (m) {
      const digits = m[1] + (m[2] || ""), pt = 1 + Number(m[3]);
      if (pt <= 0) { int = "0"; frac = "0".repeat(-pt) + digits; }
      else if (pt >= digits.length) { int = digits + "0".repeat(pt - digits.length); frac = ""; }
      else { int = digits.slice(0, pt); frac = digits.slice(pt); }
    } else { const p = s.split("."); int = p[0]; frac = p[1] || ""; }
    return { neg, int, frac };
  }
  // |R(x,d)| = n / 10^d
  function rscaled(x, d) {
    const { neg, int, frac } = dec(x);
    const digits = int + frac, k = int.length + d;
    let n;
    if (k < 0) n = 0n;
    else if (k >= digits.length) n = BigInt(digits) * 10n ** BigInt(k - digits.length);
    else { n = BigInt(digits.slice(0, k) || "0"); if (digits[k] >= "5") n += 1n; }
    return { neg: neg && n !== 0n, n };
  }
  function scaledText(n, d) {
    let s = n.toString();
    if (d <= 0) return { int: s, frac: "" };
    if (s.length < d + 1) s = "0".repeat(d + 1 - s.length) + s;
    return { int: s.slice(0, s.length - d), frac: s.slice(s.length - d) };
  }
  function G(x) {
    const { neg, n } = rscaled(x, 6);
    const t = scaledText(n, 6);
    const f = t.frac.replace(/0+$/, "");
    return (neg ? "-" : "") + t.int + (f ? "." + f : "");
  }
  function fmtNumber(x, fmt) {
    if (fmt === "fixed2") {
      const { neg, n } = rscaled(x, 2), t = scaledText(n, 2);
      return (neg ? "-" : "") + t.int.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + t.frac;
    }
    if (fmt === "percent1") {
      const { neg, n } = rscaled(norm(x * 100), 1), t = scaledText(n, 1);
      return (neg ? "-" : "") + t.int + "." + t.frac + "%";
    }
    return G(x);
  }

  // ---------- entry ----------
  const ENTRY = /^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
  function entryNumber(s) {
    if (!ENTRY.test(s)) return null;
    let v;
    if (s.endsWith("%")) v = Number(s.slice(0, -1)) / 100; else v = Number(s);
    v = norm(v);
    if (!isFinite(v) || Math.abs(v) >= 1e15) return null;
    return v;
  }

  // ---------- parser ----------
  const colNum = s => { let n = 0; for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); return n; };
  const colStr = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const inGrid = r => r.c >= 1 && r.c <= NC && r.r >= 1 && r.r <= NR;
  function mkRef(w) {
    const m = w.match(/^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/);
    const cs = m[2].toUpperCase();
    const rs = m[4].replace(/^0+(?=\d)/, "");
    return { k: "ref", c: colNum(cs), cs, ca: !!m[1], r: Number(rs), rs, ra: !!m[3] };
  }
  function mkRange(x, y) {
    const cp = [{ c: x.c, cs: x.cs, ca: x.ca }, { c: y.c, cs: y.cs, ca: y.ca }];
    if (cp[1].c < cp[0].c) cp.reverse();
    const rp = [{ r: x.r, rs: x.rs, ra: x.ra }, { r: y.r, rs: y.rs, ra: y.ra }];
    if (rp[1].r < rp[0].r) rp.reverse();
    return { k: "range", a: Object.assign({ k: "ref" }, cp[0], rp[0]), b: Object.assign({ k: "ref" }, cp[1], rp[1]) };
  }
  const BAD = {};
  function tokenize(src) {
    const toks = []; let i = 0;
    while (i < src.length) {
      const ch = src[i];
      if (ch === " ") { i++; continue; }
      let m;
      if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(src[i + 1] || ""))) {
        m = /^(\d+(\.\d+)?|\.\d+)/.exec(src.slice(i));
        toks.push({ t: "num", text: m[0] }); i += m[0].length; continue;
      }
      if (ch === '"') {
        let j = i + 1, val = "";
        for (;;) {
          if (j >= src.length) throw BAD;
          if (src[j] === '"') { if (src[j + 1] === '"') { val += '"'; j += 2; continue; } break; }
          val += src[j]; j++;
        }
        toks.push({ t: "str", text: src.slice(i, j + 1), val }); i = j + 1; continue;
      }
      if (ch === "#") {
        if (src.slice(i, i + 5).toUpperCase() === "#REF!") { toks.push({ t: "errref" }); i += 5; continue; }
        throw BAD;
      }
      if (/[A-Za-z$]/.test(ch)) {
        m = /^[A-Za-z$][A-Za-z0-9$]*/.exec(src.slice(i));
        const w = m[0]; i += w.length;
        const u = w.toUpperCase();
        if (u === "TRUE" || u === "FALSE") toks.push({ t: "bool", val: u === "TRUE" });
        else if (/^\$?[A-Za-z]+\$?[0-9]+$/.test(w)) toks.push({ t: "ref", node: mkRef(w) });
        else if (/^[A-Za-z0-9]+$/.test(w)) toks.push({ t: "name", text: u });
        else throw BAD;
        continue;
      }
      const two = src.slice(i, i + 2);
      if (two === "<>" || two === "<=" || two === ">=") { toks.push({ t: "op", text: two }); i += 2; continue; }
      if ("+-*/^&%=<>".includes(ch)) { toks.push({ t: "op", text: ch }); i++; continue; }
      if ("(),:".includes(ch)) { toks.push({ t: "p", text: ch }); i++; continue; }
      throw BAD;
    }
    return toks;
  }
  function parseFormula(raw) {
    try {
      const toks = tokenize(raw.slice(1));
      let p = 0;
      const peek = () => toks[p];
      const isOp = (t, ...xs) => t && t.t === "op" && xs.includes(t.text);
      const isP = (t, x) => t && t.t === "p" && t.text === x;
      function expr() { return comparison(); }
      function comparison() {
        let l = concat();
        while (isOp(peek(), "=", "<>", "<", "<=", ">", ">=")) { const op = toks[p++].text; l = { k: "bin", op, l, r: concat() }; }
        return l;
      }
      function concat() {
        let l = sum();
        while (isOp(peek(), "&")) { p++; l = { k: "bin", op: "&", l, r: sum() }; }
        return l;
      }
      function sum() {
        let l = product();
        while (isOp(peek(), "+", "-")) { const op = toks[p++].text; l = { k: "bin", op, l, r: product() }; }
        return l;
      }
      function product() {
        let l = signed();
        while (isOp(peek(), "*", "/")) { const op = toks[p++].text; l = { k: "bin", op, l, r: signed() }; }
        return l;
      }
      function signed() {
        if (isOp(peek(), "-", "+")) { const op = toks[p++].text; return { k: "un", op, x: signed() }; }
        return power();
      }
      function power() {
        const b = percent();
        if (isOp(peek(), "^")) { p++; return { k: "bin", op: "^", l: b, r: signed() }; }
        return b;
      }
      function percent() {
        let x = primary();
        while (isOp(peek(), "%")) { p++; x = { k: "pct", x }; }
        return x;
      }
      function primary() {
        const t = toks[p];
        if (!t) throw BAD;
        if (t.t === "num") { p++; return { k: "num", text: t.text }; }
        if (t.t === "str") { p++; return { k: "str", text: t.text, val: t.val }; }
        if (t.t === "bool") { p++; if (isP(peek(), "(")) throw BAD; return { k: "bool", val: t.val }; }
        if (t.t === "errref") { p++; return { k: "errref" }; }
        if (t.t === "ref") {
          p++;
          if (isP(peek(), ":")) {
            p++;
            const u = toks[p];
            if (!u || u.t !== "ref") throw BAD;
            p++;
            return mkRange(t.node, u.node);
          }
          if (isP(peek(), "(")) throw BAD;
          return t.node;
        }
        if (t.t === "name") {
          p++;
          if (isP(peek(), "(")) {
            p++;
            const args = [];
            if (isP(peek(), ")")) { p++; return { k: "call", name: t.text, args }; }
            args.push(expr());
            while (isP(peek(), ",")) { p++; args.push(expr()); }
            if (!isP(peek(), ")")) throw BAD;
            p++;
            return { k: "call", name: t.text, args };
          }
          return { k: "name", name: t.text };
        }
        if (isP(t, "(")) {
          p++;
          const x = expr();
          if (!isP(peek(), ")")) throw BAD;
          p++;
          return { k: "paren", x };
        }
        throw BAD;
      }
      const ast = expr();
      if (p !== toks.length) throw BAD;
      return ast;
    } catch (e) { return null; }
  }
  const pcache = new Map();
  function parsed(raw) {
    if (pcache.has(raw)) return pcache.get(raw);
    const a = parseFormula(raw);
    if (pcache.size > 5000) pcache.clear();
    pcache.set(raw, a);
    return a;
  }
  const refStr = r => (r.ca ? "$" : "") + r.cs + (r.ra ? "$" : "") + r.rs;
  function print(n) {
    switch (n.k) {
      case "num": return n.text;
      case "str": return n.text;
      case "bool": return n.val ? "TRUE" : "FALSE";
      case "errref": return "#REF!";
      case "ref": return refStr(n);
      case "range": return refStr(n.a) + ":" + refStr(n.b);
      case "name": return n.name;
      case "call": return n.name + "(" + n.args.map(print).join(",") + ")";
      case "un": return n.op + print(n.x);
      case "bin": return print(n.l) + n.op + print(n.r);
      case "pct": return print(n.x) + "%";
      case "paren": return "(" + print(n.x) + ")";
    }
    return "";
  }
  function mapAst(n, fr, fg) {
    switch (n.k) {
      case "ref": { const r = fr(n); return r || { k: "errref" }; }
      case "range": { const r = fg(n); return r || { k: "errref" }; }
      case "call": return { k: "call", name: n.name, args: n.args.map(a => mapAst(a, fr, fg)) };
      case "un": return { k: "un", op: n.op, x: mapAst(n.x, fr, fg) };
      case "bin": return { k: "bin", op: n.op, l: mapAst(n.l, fr, fg), r: mapAst(n.r, fr, fg) };
      case "pct": return { k: "pct", x: mapAst(n.x, fr, fg) };
      case "paren": return { k: "paren", x: mapAst(n.x, fr, fg) };
    }
    return n;
  }
  function withAxis(ref, axis, v) {
    const o = Object.assign({}, ref);
    if (axis === "c") { o.c = v; o.cs = colStr(v); } else { o.r = v; o.rs = String(v); }
    return o;
  }
  function rewriteInsert(ast, axis, at) {
    const L = axis === "c" ? NC : NR;
    const fr = ref => {
      if (!inGrid(ref)) return ref;
      const n = ref[axis];
      if (n < at) return ref;
      if (n + 1 > L) return null;
      return withAxis(ref, axis, n + 1);
    };
    const fg = rg => {
      if (!inGrid(rg.a) || !inGrid(rg.b)) return rg;
      const t = rg.a[axis], b = rg.b[axis];
      const t2 = t < at ? t : t + 1;
      if (t2 > L) return null;
      const b2 = Math.min(b < at ? b : b + 1, L);
      return mkRange(withAxis(rg.a, axis, t2), withAxis(rg.b, axis, b2));
    };
    return mapAst(ast, fr, fg);
  }
  function rewriteDelete(ast, axis, at) {
    const fr = ref => {
      if (!inGrid(ref)) return ref;
      const n = ref[axis];
      if (n < at) return ref;
      if (n === at) return null;
      return withAxis(ref, axis, n - 1);
    };
    const fg = rg => {
      if (!inGrid(rg.a) || !inGrid(rg.b)) return rg;
      const t = rg.a[axis], b = rg.b[axis];
      if (at > b) return rg;
      if (at < t) return mkRange(withAxis(rg.a, axis, t - 1), withAxis(rg.b, axis, b - 1));
      if (t === b) return null;
      return mkRange(rg.a, withAxis(rg.b, axis, b - 1));
    };
    return mapAst(ast, fr, fg);
  }
  function rewritePaste(ast, dc, dr) {
    const mv = ref => {
      const c = ref.ca ? ref.c : ref.c + dc, r = ref.ra ? ref.r : ref.r + dr;
      if (c < 1 || c > NC || r < 1 || r > NR) return null;
      return Object.assign({}, ref, { c, cs: colStr(c), r, rs: String(r) });
    };
    const fr = ref => (inGrid(ref) ? mv(ref) : ref);
    const fg = rg => {
      if (!inGrid(rg.a) || !inGrid(rg.b)) return rg;
      const a = mv(rg.a), b = mv(rg.b);
      if (!a || !b) return null;
      return mkRange(a, b);
    };
    return mapAst(ast, fr, fg);
  }
  function collectPrec(n, set) {
    switch (n.k) {
      case "ref": if (inGrid(n)) set.add((n.r - 1) * NC + n.c - 1); break;
      case "range":
        if (inGrid(n.a) && inGrid(n.b))
          for (let r = n.a.r; r <= n.b.r; r++) for (let c = n.a.c; c <= n.b.c; c++) set.add((r - 1) * NC + c - 1);
        break;
      case "call": n.args.forEach(a => collectPrec(a, set)); break;
      case "un": case "pct": case "paren": collectPrec(n.x, set); break;
      case "bin": collectPrec(n.l, set); collectPrec(n.r, set); break;
    }
  }

  // ---------- evaluation ----------
  let cells = [];           // {raw, fmt}
  let memo = [];
  let circ = new Set();
  const idxOf = (c, r) => (r - 1) * NC + (c - 1);

  const toNum = v => (v.t === "n" ? v : v.t === "l" ? { t: "n", v: v.v ? 1 : 0 } : v.t === "z" ? { t: "n", v: 0 } : v.t === "e" ? v : E("#VALUE!"));
  const toText = v => (v.t === "n" ? G(v.v) : v.t === "s" ? v.v : v.t === "l" ? (v.v ? "TRUE" : "FALSE") : "");
  const toLog = v => (v.t === "n" ? { t: "l", v: v.v !== 0 } : v.t === "l" ? v : v.t === "z" ? { t: "l", v: false } : v.t === "e" ? v : E("#VALUE!"));

  function valueOfRaw(raw) {
    if (raw === "") return BLANK;
    if (raw[0] === "'") return { t: "s", v: raw.slice(1) };
    const tr = raw.replace(/^ +| +$/g, "");
    const n = entryNumber(tr);
    if (n !== null) return { t: "n", v: n };
    const u = tr.toUpperCase();
    if (u === "TRUE") return { t: "l", v: true };
    if (u === "FALSE") return { t: "l", v: false };
    return { t: "s", v: raw };
  }
  function cellValue(idx) {
    if (memo[idx]) return memo[idx];
    let v;
    if (circ.has(idx)) v = E("#CYCLE!");
    else {
      const raw = cells[idx].raw;
      if (raw[0] === "=") {
        const ast = parsed(raw);
        if (!ast) v = E("#SYNTAX!");
        else {
          try { v = ev(ast); } catch (e) { v = E("#VALUE!"); }
          if (v.t === "z") v = { t: "n", v: 0 };
        }
      } else {
        v = valueOfRaw(raw);
        if (v.t === "z") v = BLANK;
      }
    }
    memo[idx] = v;
    return v;
  }
  function recalc() {
    memo = new Array(NC * NR).fill(null);
    const prec = [];
    for (let i = 0; i < NC * NR; i++) {
      const s = new Set();
      const raw = cells[i].raw;
      if (raw[0] === "=") { const a = parsed(raw); if (a) collectPrec(a, s); }
      prec.push(s);
    }
    circ = new Set();
    for (let i = 0; i < NC * NR; i++) {
      const seen = new Set(), stack = [...prec[i]];
      let found = false;
      while (stack.length) {
        const x = stack.pop();
        if (x === i) { found = true; break; }
        if (seen.has(x)) continue;
        seen.add(x);
        for (const y of prec[x]) stack.push(y);
      }
      if (found) circ.add(i);
    }
    for (let i = 0; i < NC * NR; i++) cellValue(i);
    return memo;

    const el = e.target.closest && e.target.closest('[role="gridcell"]');
    if (!el) return;
    clickCell(Number(el.dataset.c), Number(el.dataset.r), e.shiftKey);
  });
  gridEl.addEventListener("keydown", e => {
    const k = e.key;
    const arrows = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
    if (arrows[k]) {
      e.preventDefault();
      if (editing) return;
      const [dc, dr] = arrows[k];
      const nc = active.c + dc, nr = active.r + dr;
      const inside = nc >= 1 && nc <= NC && nr >= 1 && nr <= NR;
      if (inside) active = { c: nc, r: nr };
      if (!e.shiftKey) anchor = { ...active };
      render();
    } else if (k === "Delete" || k === "Backspace") {
      e.preventDefault();
      if (!editing) doClear();
    } else if (k === "Enter") {
      e.preventDefault();
      input.focus();
    } else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && k.toLowerCase() === "z") {
      e.preventDefault(); undo();
    } else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && k.toLowerCase() === "y") {
      e.preventDefault(); redo();
    }
  });
  input.addEventListener("input", () => { if (!editing) { editing = true; render(); } });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); enterTab(0, 1); }
    else if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); enterTab(1, 0); }
    else if (e.key === "Escape") {
      e.preventDefault();
      editing = false;
      input.value = cells[idxOf(active.c, active.r)].raw;
      render();
      gridEl.focus();
    }
  });
  btn.undo.addEventListener("click", undo);
  btn.redo.addEventListener("click", redo);
  btn.copy.addEventListener("click", () => { if (!editing) takeBlock("copy"); });
  btn.cut.addEventListener("click", () => { if (!editing) takeBlock("cut"); });
  btn.paste.addEventListener("click", () => { if (!editing) doPaste(); });
  btn.clear.addEventListener("click", () => { if (!editing) doClear(); });
  btn.insrow.addEventListener("click", () => { if (!editing) structure("insrow"); });
  btn.delrow.addEventListener("click", () => { if (!editing) structure("delrow"); });
  btn.inscol.addEventListener("click", () => { if (!editing) structure("inscol"); });
  btn.delcol.addEventListener("click", () => { if (!editing) structure("delcol"); });
  fmtSel.addEventListener("change", () => { if (!editing) doFormat(fmtSel.value); });

  render();
})();
</script>
</body>
</html>
