function history(back){if(editing)return;let from=back?undo:redo,to=back?redo:undo;if(from.length){let s=from.pop();to.push(s);restore(back?s.before:s.after);render()}}
function clear(){change(()=>selected().forEach(i=>sheet[i].raw=''))}
input.addEventListener('input',()=>{editing=true;render()});input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus()}else if(e.key==='Enter'||e.key==='Tab'&&!e.shiftKey){e.preventDefault();finish(()=>{if(e.key==='Enter')active=Math.min(11,Math.floor(active/8)+1)*8+active%8;else active=Math.floor(active/8)*8+Math.min(7,active%8+1);anchor=active})}});
grid.addEventListener('keydown',e=>{let arrow=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key),hist=e.ctrlKey&&['z','y'].includes(e.key.toLowerCase());if(!arrow&&!hist&&!['Delete','Backspace','Enter'].includes(e.key))return;e.preventDefault();if(e.key==='Enter'){input.focus();return}if(editing)return;if(arrow){let r=Math.floor(active/8),c=active%8;if(e.key==='ArrowUp')r--;if(e.key==='ArrowDown')r++;if(e.key==='ArrowLeft')c--;if(e.key==='ArrowRight')c++;active=Math.max(0,Math.min(11,r))*8+Math.max(0,Math.min(7,c));if(!e.shiftKey)anchor=active;render();cells[active].scrollIntoView({block:'nearest',inline:'nearest'})}else if(hist)history(e.key.toLowerCase()==='z');else clear()});
$('undo-button').onclick=()=>history(true);$('redo-button').onclick=()=>history(false);$('clear-button').onclick=clear;format.onchange=()=>{let f=format.value;change(()=>selected().forEach(i=>sheet[i].fmt=f))};
for(let mode of ['copy','cut'])$(mode+'-button').onclick=()=>{if(editing)return;clipboard={mode,rect:rect(),cells:selected().map(i=>({i,...clone(sheet[i])}))};render()};
$('paste-button').onclick=()=>{if(!clipboard||editing)return;change(()=>{let dest=rect(),b=clipboard,dc=dest.l-b.rect.l,dr=dest.t-b.rect.t;if(b.mode==='cut')b.cells.forEach(({i})=>sheet[i]={raw:'',fmt:'general'});for(let c of b.cells){let r=Math.floor(c.i/8)+dr,col=c.i%8+dc;if(r<12&&col<8){sheet[r*8+col]={raw:b.mode==='copy'?rewrite(c.raw,'copy',null,0,dc,dr):c.raw,fmt:c.fmt}}}anchor=active=dest.t*8+dest.l;if(b.mode==='cut')clipboard=null},true)};
for(let mode of ['insert','delete'])for(let axis of ['row','col'])$(mode+'-'+axis).onclick=()=>change(()=>{let dim=axis==='row'?'r':'c',p=axis==='row'?Math.floor(active/8):active%8,old=clone(sheet);sheet=sheet.map((_,i)=>{let r=Math.floor(i/8),c=i%8,n=axis==='row'?r:c;if(mode==='insert'){if(n===p)return{raw:'',fmt:'general'};if(n>p)n--}else{if(n===(axis==='row'?11:7))return{raw:'',fmt:'general'};if(n>=p)n++}let src=axis==='row'?n*8+c:r*8+n;return old[src]});sheet.forEach(c=>c.raw=rewrite(c.raw,mode,dim,p+1))},true);
render();
</script></body></html>
