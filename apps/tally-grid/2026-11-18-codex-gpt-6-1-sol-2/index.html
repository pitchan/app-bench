function action(id){if(editing)return;if(id==='undo-button'){if(undo.length){let step=undo.pop();redo.push(step);restore(step.before)}return}if(id==='redo-button'){if(redo.length){let step=redo.pop();undo.push(step);restore(step.after)}return}if(id==='copy-button'||id==='cut-button'){let q=rect();clipboard={...q,mode:id==='copy-button'?'copy':'cut',data:selection().map(i=>({i,...sheet[i]}))};controls();return}let before=snap(),changed=false;if(id==='clear-button'){for(let i of selection()){if(sheet[i].raw!=='')changed=true;sheet[i].raw=''}}else if(id==='paste-button'){if(!clipboard)return;let q=rect(),clip=clipboard;if(clip.mode==='cut')for(let it of clip.data)sheet[it.i]={raw:'',fmt:'general'};for(let it of clip.data){let r=Math.floor(it.i/8)-clip.t+q.t,c=it.i%8-clip.l+q.l;if(r<12&&c<8){let dest=r*8+c;sheet[dest]={raw:clip.mode==='copy'?rewrite(it.raw,'copy',null,0,c-it.i%8,r-Math.floor(it.i/8)):it.raw,fmt:it.fmt}}}active=anchor=q.t*8+q.l;if(clip.mode==='cut')clipboard=null;changed=true}else if(id.startsWith('insert-')||id.startsWith('delete-')){let axis=id.endsWith('row')?'r':'c',k=axis==='r'?Math.floor(active/8):active%8,insert=id.startsWith('insert'),old=sheet;sheet=Array.from({length:96},(_,i)=>{let r=Math.floor(i/8),c=i%8,v=axis==='r'?r:c,src=v;if(insert){if(v===k)return {raw:'',fmt:'general'};if(v>k)src--}else {if(v===(axis==='r'?11:7))return {raw:'',fmt:'general'};if(v>=k)src++}return {...old[axis==='r'?src*8+c:r*8+src]}});for(let c of sheet)c.raw=rewrite(c.raw,insert?'insert':'delete',axis,k);changed=true}if(changed)record(before);render()}
format.onchange=()=>{if(editing)return;let before=snap(),changed=false;for(let i of selection()){if(sheet[i].fmt!==format.value)changed=true;sheet[i].fmt=format.value}if(changed)record(before);render()};input.oninput=()=>{editing=true;controls()};input.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();editing=false;render();grid.focus()}else if(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();commit(()=>move(e.key==='Enter'?1:0,e.key==='Tab'?1:0,false));input.focus()}};grid.onkeydown=e=>{let key=e.key,ctrl=e.ctrlKey&&['z','y'].includes(key.toLowerCase()),handled=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Backspace','Enter'].includes(key)||ctrl;if(!handled)return;e.preventDefault();if(key==='Enter'){input.focus();return}if(editing)return;if(ctrl){action(key.toLowerCase()==='z'?'undo-button':'redo-button');return}if(key==='Delete'||key==='Backspace'){action('clear-button');return}move(key==='ArrowUp'?-1:key==='ArrowDown'?1:0,key==='ArrowLeft'?-1:key==='ArrowRight'?1:0,e.shiftKey);render()};render();
</script></body></html>
