<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
:root{--ink:#1a1d24;--muted:#3d4452;--line:#c3c9d4;--bg:#f4f6fa;--panel:#ffffff;--head:#e6eaf2;--sel:#dbe7ff;--act:#bcd3ff;--accent:#1d4ed8;--err:#9b1c1c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
header{background:#14213d;color:#ffffff;padding:12px 16px}
header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
main{padding:12px 16px 24px;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-height:36px;cursor:pointer}
button:hover:not(:disabled){background:#e9eefb}
button:disabled{color:#767c88;background:#eceef2;cursor:not-allowed}
.fmt{display:inline-flex;align-items:center;gap:6px}
.fmt label,.fbar label{color:var(--muted);font-size:13px}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:36px;padding:4px 8px}
select:disabled{color:#767c88;background:#eceef2}
:focus{outline:3px solid var(--accent);outline-offset:1px}
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#name-box{min-width:84px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-weight:600;color:var(--ink)}
#formula-input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:36px}
#formula-input[data-editing="true"]{border-color:var(--accent);box-shadow:0 0 0 2px #cfdcff}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max(100%,700px)}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:34px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);background:var(--panel)}
th{background:var(--head);color:var(--muted);font-weight:600;text-align:center;user-select:none}
th.corner{width:48px}
th[role="rowheader"]{width:48px}
td{cursor:cell;text-align:left}
td[data-kind="number"]{text-align:right}
td[data-kind="logical"]{text-align:center}
td[data-kind="error"]{color:var(--err);text-align:center}
td[data-in-selection="true"]{background:var(--sel)}
td[aria-selected="true"]{background:var(--act);box-shadow:inset 0 0 0 2px var(--accent)}
#grid:focus{outline:3px solid var(--accent);outline-offset:-1px}
#grid:focus td[aria-selected="true"]{box-shadow:inset 0 0 0 3px #0b2a8f}
#selection-summary{margin-top:12px;display:inline-block;background:#e8f0ff;border:1px solid #9db8f2;border-radius:6px;padding:6px 12px;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s}}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Sonnet 5.5</h1></header>
<main>
  <div class="toolbar" data-testid="toolbar">
    <button type="button" data-testid="undo-button" id="undo">Undo</button>
    <button type="button" data-testid="redo-button" id="redo">Redo</button>
    <button type="button" data-testid="copy-button" id="copy">Copy</button>
    <button type="button" data-testid="cut-button" id="cut">Cut</button>
    <button type="button" data-testid="paste-button" id="paste">Paste</button>
    <button type="button" data-testid="clear-button" id="clear">Clear</button>
    <button type="button" data-testid="insert-row" id="insrow">Insert row</button>
    <button type="button" data-testid="delete-row" id="delrow">Delete row</button>
    <button type="button" data-testid="insert-col" id="inscol">Insert column</button>
    <button type="button" data-testid="delete-col" id="delcol">Delete column</button>
    <span class="fmt"><label for="fmt">Number format</label>
      <select id="fmt" data-testid="format-select">
        <option value="general">General</option>
        <option value="fixed2">1,234.50</option>
        <option value="percent1">12.5%</option>
      </select></span>
  </div>
  <div class="fbar">
    <div id="name-box" data-testid="name-box">A1</div>
    <label for="formula-input">Cell content</label>
    <input id="formula-input" data-testid="formula-input" type="text" data-editing="false" autocomplete="off" spellcheck="false">
  </div>
  <div class="gridwrap"><table id="grid" data-testid="grid" role="grid" aria-label="Sheet" tabindex="0"></table></div>
  <div id="selection-summary" data-testid="selection-summary" hidden></div>
</main>
<script>
'use strict';
var NC=8,NR=12,COLN=['A','B','C','D','E','F','G','H'];
var sheet=[];for(var _i=0;_i<96;_i++)sheet.push({raw:'',fmt:'general'});

/* ---------- numbers ---------- */
function norm(x){var y=Number(x.toPrecision(12));return y===0?0:y;}
function ERR(c){return {k:'error',v:c};}
function res(x){if(!isFinite(x))return ERR('#NUM!');var y=norm(x);if(Math.abs(y)>=1e15)return ERR('#NUM!');return {k:'number',v:y};}
function expo(x){var s=Math.abs(x).toExponential(11).split('e');return {digits:s[0].replace('.',''),e:parseInt(s[1],10)};}
function roundQ(x,d){
  if(x===0)return {neg:false,Q:0n};
  var o=expo(x),M=BigInt(o.digits),s=o.e-11+d,Q;
  if(s>=0)Q=M*(10n**BigInt(s));
  else{var k=-s;Q=(M+5n*(10n**BigInt(k-1)))/(10n**BigInt(k));}
  return {neg:x<0&&Q!==0n,Q:Q};
}
function roundNum(x,d){var r=roundQ(x,d);var v=Number(r.Q.toString()+'e'+(-d));return r.neg?-v:v;}
function qText(r,d,strip,group){
  var s=r.Q.toString();if(s.length<d+1)s=s.padStart(d+1,'0');
  var ip=s.slice(0,s.length-d),fp=d>0?s.slice(s.length-d):'';
  if(strip)fp=fp.replace(/0+$/,'');
  if(group)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (r.neg?'-':'')+ip+(fp?'.'+fp:'');
}
function G(x){return qText(roundQ(x,6),6,true,false);}
function fmtNum(x,f){
  if(f==='fixed2')return qText(roundQ(x,2),2,false,true);
  if(f==='percent1'){return qText(roundQ(norm(x*100),1),1,false,false)+'%';}
  return G(x);
}
var ENTRY=/^[+-]?(\d+(\.\d+)?|\.\d+)%?$/;
function entryNumber(s){
  if(!ENTRY.test(s))return null;
  var pct=s[s.length-1]==='%',x=Number(pct?s.slice(0,-1):s);
  if(pct)x=x/100;x=norm(x);
  if(!isFinite(x)||Math.abs(x)>=1e15)return null;return x;
}
function trimSp(s){return s.replace(/^ +| +$/g,'');}

/* ---------- tokens ---------- */
var REFRE=/^(\$?)([A-Za-z]+)(\$?)([0-9]+)$/;
function mkRef(m){var rs=m[4].replace(/^0+/,'');if(rs==='')rs='0';return {t:'ref',cl:m[2].toUpperCase(),ca:m[1]==='$',rs:rs,ra:m[3]==='$'};}
function inGrid(r){if(r.cl.length!==1||r.cl<'A'||r.cl>'H')return false;if(r.rs.length>2)return false;var n=Number(r.rs);return n>=1&&n<=12;}
function tokenize(src){
  var out=[],i=0,n=src.length,m;
  var numRe=/\d+(?:\.\d+)?|\.\d+/y,wordRe=/[A-Za-z$][A-Za-z0-9$]*/y;
  while(i<n){
    var ch=src[i];
    if(ch===' '){i++;continue;}
    if((ch>='0'&&ch<='9')||ch==='.'){numRe.lastIndex=i;m=numRe.exec(src);if(!m)return null;out.push({t:'num',s:m[0]});i+=m[0].length;continue;}
    if(ch==='"'){var j=i+1,val='';for(;;){if(j>=n)return null;if(src[j]==='"'){if(src[j+1]==='"'){val+='"';j+=2;continue;}break;}val+=src[j++];}
      out.push({t:'str',s:src.slice(i,j+1),v:val});i=j+1;continue;}
    if(ch==='#'){if(src.substr(i,5).toUpperCase()==='#REF!'){out.push({t:'referr'});i+=5;continue;}return null;}
    if((ch>='A'&&ch<='Z')||(ch>='a'&&ch<='z')||ch==='$'){
      wordRe.lastIndex=i;m=wordRe.exec(src);var w=m[0];i+=w.length;
      var u=w.toUpperCase();
      if(u==='TRUE'||u==='FALSE'){out.push({t:'log',s:u,v:u==='TRUE'});continue;}
      var rm=REFRE.exec(w);
      if(rm){out.push(mkRef(rm));continue;}
      if(/^[A-Za-z0-9]+$/.test(w)){out.push({t:'name',s:u});continue;}
      return null;
    }
    var two=src.substr(i,2);
    if(two==='<>'||two==='<='||two==='>='){out.push({t:'op',s:two});i+=2;continue;}
    if('+-*/^&%=<>'.indexOf(ch)>=0){out.push({t:'op',s:ch});i++;continue;}
    if('(),:'.indexOf(ch)>=0){out.push({t:'p',s:ch});i++;continue;}
    return null;
  }
  var merged=[];
  for(var k=0;k<out.length;k++){
    var t=out[k];
    if(t.t==='ref'&&out[k+1]&&out[k+1].t==='p'&&out[k+1].s===':'&&out[k+2]&&out[k+2].t==='ref'){
      merged.push(normRange({t:'range',a:t,b:out[k+2]}));k+=2;
    }else merged.push(t);
  }
  return merged;
}
function cmpStr(a,b){return a.length!==b.length?a.length-b.length:(a<b?-1:a>b?1:0);}
function normRange(rg){
  var a=rg.a,b=rg.b;
  var na={t:'ref',cl:a.cl,ca:a.ca,rs:a.rs,ra:a.ra},nb={t:'ref',cl:b.cl,ca:b.ca,rs:b.rs,ra:b.ra};
  if(cmpStr(a.cl,b.cl)>0){na.cl=b.cl;na.ca=b.ca;nb.cl=a.cl;nb.ca=a.ca;}
  if(cmpStr(a.rs,b.rs)>0){na.rs=b.rs;na.ra=b.ra;nb.rs=a.rs;nb.ra=a.ra;}
  return {t:'range',a:na,b:nb};
}
function refStr(r){return (r.ca?'$':'')+r.cl+(r.ra?'$':'')+r.rs;}
function tokStr(t){
  switch(t.t){case 'ref':return refStr(t);case 'range':return refStr(t.a)+':'+refStr(t.b);case 'referr':return '#REF!';default:return t.s;}
}
function canon(tokens){return '='+tokens.map(tokStr).join('');}

/* ---------- parser ---------- */
function parseTokens(tk){
  var p=0;
  function isOp(list){var t=tk[p];return t&&t.t==='op'&&list.indexOf(t.s)>=0;}
  function comparison(){var l=concat();while(isOp(['=','<>','<','<=','>','>='])){var op=tk[p++].s;var r=concat();l={t:'bin',op:op,l:l,r:r};}return l;}
  function concat(){var l=sum();while(isOp(['&'])){p++;l={t:'bin',op:'&',l:l,r:sum()};}return l;}
  function sum(){var l=product();while(isOp(['+','-'])){var op=tk[p++].s;l={t:'bin',op:op,l:l,r:product()};}return l;}
  function product(){var l=signed();while(isOp(['*','/'])){var op=tk[p++].s;l={t:'bin',op:op,l:l,r:signed()};}return l;}
  function signed(){if(isOp(['-','+'])){var op=tk[p++].s;return {t:'un',op:op,e:signed()};}return power();}
  function power(){var l=percent();if(isOp(['^'])){p++;l={t:'bin',op:'^',l:l,r:signed()};}return l;}
  function percent(){var l=primary();while(isOp(['%'])){p++;l={t:'pct',e:l};}return l;}
  function primary(){
    var t=tk[p];if(!t)throw 0;
    switch(t.t){
      case 'num':p++;return {t:'num',s:t.s};
      case 'str':p++;return {t:'str',v:t.v};
      case 'log':p++;return {t:'log',v:t.v};
      case 'referr':p++;return {t:'referr'};
      case 'ref':p++;return {t:'ref',r:t};
      case 'range':p++;return {t:'range',a:t.a,b:t.b};
      case 'name':
        p++;
        if(tk[p]&&tk[p].t==='p'&&tk[p].s==='('){
          p++;var args=[];
          if(tk[p]&&tk[p].t==='p'&&tk[p].s===')'){p++;return {t:'call',name:t.s,args:args};}
          for(;;){args.push(comparison());
            if(tk[p]&&tk[p].t==='p'&&tk[p].s===','){p++;continue;}
            if(tk[p]&&tk[p].t==='p'&&tk[p].s===')'){p++;break;}
            throw 0;}
          return {t:'call',name:t.s,args:args};
        }
        return {t:'name'};
      case 'p':
        if(t.s==='('){p++;var e=comparison();if(!(tk[p]&&tk[p].t==='p'&&tk[p].s===')'))throw 0;p++;return {t:'paren',e:e};}
        throw 0;
      default:throw 0;
    }
  }
  var ast=comparison();if(p!==tk.length)throw 0;return ast;
}
var parseCache=new Map();
function parseFormula(raw){
  var c=parseCache.get(raw);if(c)return c;
  var r={ok:false};
  try{var tk=tokenize(raw.slice(1));if(tk){var ast=parseTokens(tk);r={ok:true,tokens:tk,ast:ast};}}catch(e){}
  if(parseCache.size>2000)parseCache.clear();
  parseCache.set(raw,r);return r;
}

/* ---------- evaluation ---------- */
var BLANK={k:'blank'};
function classify(raw){
  if(raw==='')return BLANK;
  if(raw[0]==="'")return {k:'text',v:raw.slice(1)};
  var t=trimSp(raw),x=entryNumber(t);
  if(x!==null)return {k:'number',v:x};
  var u=t.toUpperCase();
  if(u==='TRUE')return {k:'logical',v:true};
  if(u==='FALSE')return {k:'logical',v:false};
  return {k:'text',v:raw};
}
function cn(v){switch(v.k){case 'number':return v.v;case 'logical':return v.v?1:0;case 'blank':return 0;case 'text':return ERR('#VALUE!');default:return v;}}
function ct(v){switch(v.k){case 'number':return G(v.v);case 'logical':return v.v?'TRUE':'FALSE';case 'blank':return '';case 'text':return v.v;default:return v;}}
function cl(v){switch(v.k){case 'number':return v.v!==0;case 'logical':return v.v;case 'blank':return false;case 'text':return ERR('#VALUE!');default:return v;}}
function isE(x){return typeof x==='object';}
function rank(v){return v.k==='number'?0:v.k==='text'?1:2;}
function repl(o){return o.k==='number'?{k:'number',v:0}:o.k==='text'?{k:'text',v:''}:{k:'logical',v:false};}
function cmpVals(a,b){
  if(a.k==='blank'||b.k==='blank'){
    if(a.k==='blank'&&b.k==='blank'){a=b={k:'number',v:0};}
    else if(a.k==='blank')a=repl(b);else b=repl(a);
  }
  var ra=rank(a),rb=rank(b);
  if(ra!==rb)return ra<rb?-1:1;
  if(a.k==='text'){var x=a.v.toUpperCase(),y=b.v.toUpperCase();return x<y?-1:x>y?1:0;}
  var p=Number(a.v),q=Number(b.v);return p<q?-1:p>q?1:0;
}
var FUNCS={SUM:[1,0],AVERAGE:[1,0],MIN:[1,0],MAX:[1,0],COUNT:[1,0],COUNTA:[1,0],ROUND:[2,2],ABS:[1,1],INT:[1,1],MOD:[2,2],IF:[3,3],AND:[1,0],OR:[1,0],NOT:[1,1],IFERROR:[2,2],ISERROR:[1,1],ISBLANK:[1,1],LEN:[1,1],UPPER:[1,1],LEFT:[2,2],RIGHT:[2,2],MID:[3,3],CONCAT:[1,0],COUNTIF:[2,2],SUMIF:[3,3]};
function refIdx(r){return (Number(r.rs)-1)*NC+(r.cl.charCodeAt(0)-65);}

var circ=[],memo=[];
function cellVal(i){
  if(memo[i])return memo[i];
  var c=sheet[i],v;
  if(circ[i])v=ERR('#CYCLE!');
  else if(c.raw!==''&&c.raw[0]==='='){
    var f=parseFormula(c.raw);
    if(!f.ok)v=ERR('#SYNTAX!');
    else{try{v=ev(f.ast);}catch(e){v=ERR('#VALUE!');}if(v.k==='blank')v={k:'number',v:0};}
  }else v=classify(c.raw);
  memo[i]=v;return v;
}
function rangeOf(n){
  if(n.t==='referr')return {err:ERR('#REF!')};
  if(n.t==='ref'){if(!inGrid(n.r))return {err:ERR('#REF!')};return {idx:[refIdx(n.r)],rows:1,cols:1};}
  if(!inGrid(n.a)||!inGrid(n.b))return {err:ERR('#REF!')};
  var c1=n.a.cl.charCodeAt(0)-65,c2=n.b.cl.charCodeAt(0)-65,r1=Number(n.a.rs)-1,r2=Number(n.b.rs)-1;
  var ca=Math.min(c1,c2),cb=Math.max(c1,c2),ra=Math.min(r1,r2),rb=Math.max(r1,r2),idx=[];
  for(var r=ra;r<=rb;r++)for(var c=ca;c<=cb;c++)idx.push(r*NC+c);
  return {idx:idx,rows:rb-ra+1,cols:cb-ca+1};
}
function isRangeArg(n){return n.t==='ref'||n.t==='range'||n.t==='referr';}
function ev(n){
  switch(n.t){
    case 'num':return res(Number(n.s));
    case 'str':return {k:'text',v:n.v};
    case 'log':return {k:'logical',v:n.v};
    case 'referr':return ERR('#REF!');
    case 'ref':return inGrid(n.r)?cellVal(refIdx(n.r)):ERR('#REF!');
    case 'range':return ERR('#VALUE!');
    case 'name':return ERR('#NAME?');
    case 'paren':return ev(n.e);
    case 'call':return callFn(n);
    case 'un':{var v=ev(n.e);if(v.k==='error')return v;var a=cn(v);if(isE(a))return a;return res(n.op==='-'?-a:a);}
    case 'pct':{var v2=ev(n.e);if(v2.k==='error')return v2;var a2=cn(v2);if(isE(a2))return a2;return res(a2/100);}
    case 'bin':return bin(n);
  }
  return ERR('#VALUE!');
}
function bin(n){
  var l=ev(n.l),r=ev(n.r),op=n.op;
  if(l.k==='error')return l;if(r.k==='error')return r;
  if(op==='&'){var x=ct(l);var y=ct(r);return {k:'text',v:x+y};}
  if(op==='='||op==='<>'||op==='<'||op==='<='||op==='>'||op==='>='){
    var c=cmpVals(l,r),b;
    switch(op){case '=':b=c===0;break;case '<>':b=c!==0;break;case '<':b=c<0;break;case '<=':b=c<=0;break;case '>':b=c>0;break;default:b=c>=0;}
    return {k:'logical',v:b};
  }
  var a=cn(l);if(isE(a))return a;var d=cn(r);if(isE(d))return d;
  switch(op){
    case '+':return res(a+d);
    case '-':return res(a-d);
    case '*':return res(a*d);
    case '/':return d===0?ERR('#DIV/0!'):res(a/d);
    case '^':
      if(a===0&&d===0)return ERR('#NUM!');
      if(a===0&&d<0)return ERR('#DIV/0!');
      if(a<0&&Math.floor(d)!==d)return ERR('#NUM!');
      return res(Math.pow(a,d));
  }
  return ERR('#VALUE!');
}
function argText(n){return ct(ev(n));}
function argNum(n){return cn(ev(n));}
function argInt(n){var x=argNum(n);if(isE(x))return x;return Math.trunc(x)+0;}
function T(s){return {k:'text',v:s};}
function callFn(n){
  var name=n.name,spec=FUNCS[name],args=n.args,cnt=args.length;
  if(!Object.prototype.hasOwnProperty.call(FUNCS,name))return ERR('#NAME?');
  if(cnt<spec[0]||(spec[1]&&cnt>spec[1]))return ERR('#ARGS!');
  var i,a,b,v,x;
  switch(name){
    case 'SUM':case 'AVERAGE':case 'MIN':case 'MAX':case 'COUNT':case 'COUNTA':{
      var nums=[],count=0,agg=(name!=='COUNT'&&name!=='COUNTA');
      for(i=0;i<cnt;i++){
        var arg=args[i];
        if(isRangeArg(arg)){
          var rg=rangeOf(arg);if(rg.err)return rg.err;
          for(var j=0;j<rg.idx.length;j++){
            v=cellVal(rg.idx[j]);if(v.k==='error')return v;
            if(agg){if(v.k==='number')nums.push(v.v);}
            else if(name==='COUNT'){if(v.k==='number')count++;}
            else if(v.k!=='blank')count++;
          }
        }else{
          v=ev(arg);if(v.k==='error')return v;
          if(agg){x=cn(v);if(isE(x))return x;nums.push(x);}
          else if(name==='COUNT'){if(v.k==='number')count++;}
          else count++;
        }
      }
      if(!agg)return res(count);
      if(name==='SUM'||name==='AVERAGE'){
        var s=0;for(i=0;i<nums.length;i++)s+=nums[i];
        if(name==='SUM')return res(s);
        return nums.length?res(s/nums.length):ERR('#DIV/0!');
      }
      if(!nums.length)return res(0);
      var m=nums[0];for(i=1;i<nums.length;i++)m=name==='MIN'?Math.min(m,nums[i]):Math.max(m,nums[i]);
      return res(m);
    }
    case 'ROUND':{
      a=argNum(args[0]);if(isE(a))return a;
      b=argInt(args[1]);if(isE(b))return b;
      if(b<-9||b>9)return ERR('#NUM!');
      return res(roundNum(a,b));
    }
    case 'ABS':a=argNum(args[0]);if(isE(a))return a;return res(Math.abs(a));
    case 'INT':a=argNum(args[0]);if(isE(a))return a;return res(Math.floor(a));
    case 'MOD':{
      a=argNum(args[0]);if(isE(a))return a;b=argNum(args[1]);if(isE(b))return b;
      if(b===0)return ERR('#DIV/0!');
      return res(a-b*Math.floor(a/b));
    }
    case 'IF':{
      a=cl(ev(args[0]));if(isE(a))return a;
      return ev(a?args[1]:args[2]);
    }
    case 'AND':case 'OR':{
      var acc=name==='AND';
      for(i=0;i<cnt;i++){a=cl(ev(args[i]));if(isE(a))return a;if(name==='AND')acc=acc&&a;else acc=acc||a;}
      return {k:'logical',v:acc};
    }
    case 'NOT':a=cl(ev(args[0]));if(isE(a))return a;return {k:'logical',v:!a};
    case 'IFERROR':v=ev(args[0]);if(v.k==='error')return ev(args[1]);return v;
    case 'ISERROR':return {k:'logical',v:ev(args[0]).k==='error'};
    case 'ISBLANK':{
      var ar=args[0];
      if(isRangeArg(ar)){
        var rr=rangeOf(ar);if(rr.err)return rr.err;
        if(ar.t==='range')return ERR('#VALUE!');
        return {k:'logical',v:sheet[rr.idx[0]].raw===''};
      }
      v=ev(ar);if(v.k==='error')return v;return {k:'logical',v:false};
    }
    case 'LEN':a=argText(args[0]);if(isE(a))return a;return res(a.length);
    case 'UPPER':a=argText(args[0]);if(isE(a))return a;return T(a.toUpperCase());
    case 'LEFT':case 'RIGHT':{
      a=argText(args[0]);if(isE(a))return a;b=argInt(args[1]);if(isE(b))return b;
      if(b<0)return ERR('#VALUE!');
      if(name==='LEFT')return T(a.slice(0,b));
      return T(b>=a.length?a:a.slice(a.length-b));
    }
    case 'MID':{
      a=argText(args[0]);if(isE(a))return a;b=argInt(args[1]);if(isE(b))return b;
      var c3=argInt(args[2]);if(isE(c3))return c3;
      if(b<1||c3<0)return ERR('#VALUE!');
      return T(a.slice(b-1,b-1+c3));
    }
    case 'CONCAT':{
      var out='';
      for(i=0;i<cnt;i++){
        if(isRangeArg(args[i])){
          var rc=rangeOf(args[i]);if(rc.err)return rc.err;
          for(var q=0;q<rc.idx.length;q++){x=ct(cellVal(rc.idx[q]));if(isE(x))return x;out+=x;}
        }else{x=argText(args[i]);if(isE(x))return x;out+=x;}
      }
      return T(out);
    }
    case 'COUNTIF':case 'SUMIF':{
      var isSum=name==='SUMIF',rA=args[0],sA=isSum?args[2]:null;
      if(!isRangeArg(rA)||(isSum&&!isRangeArg(sA)))return ERR('#VALUE!');
      var r1=rangeOf(rA);if(r1.err)return r1.err;
      var r2=null;if(isSum){r2=rangeOf(sA);if(r2.err)return r2.err;if(r1.rows!==r2.rows||r1.cols!==r2.cols)return ERR('#VALUE!');}
      var cr=ev(args[1]);if(cr.k==='error')return cr;
      var op='=',opd;
      if(cr.k==='number'||cr.k==='logical')opd=cr;
      else if(cr.k==='blank')opd={k:'text',v:''};
      else{
        var t=cr.v,mm=/^(>=|<=|<>|>|<|=)/.exec(t);
        if(mm){op=mm[1];var rest=t.slice(op.length),en=entryNumber(rest),ru=rest.toUpperCase();
          opd=en!==null?{k:'number',v:en}:(ru==='TRUE'||ru==='FALSE')?{k:'logical',v:ru==='TRUE'}:{k:'text',v:rest};}
        else opd=cr;
      }
      var cntm=0,total=0;
      for(i=0;i<r1.idx.length;i++){
        var cv=cellVal(r1.idx[i]);
        if(cv.k==='error')return cv;
        if(sheet[r1.idx[i]].raw==='')continue;
        var match;
        if(op==='<>')match=!(cv.k===opd.k&&cmpVals(cv,opd)===0);
        else{
          match=false;
          if(cv.k===opd.k){var cc=cmpVals(cv,opd);
            match=op==='='?cc===0:op==='<'?cc<0:op==='<='?cc<=0:op==='>'?cc>0:cc>=0;}
        }
        if(!match)continue;
        cntm++;
        if(isSum){var sv=cellVal(r2.idx[i]);if(sv.k==='error')return sv;if(sv.k==='number')total+=sv.v;}
      }
      return res(isSum?total:cntm);
    }
  }
  return ERR('#NAME?');
}
function precOf(ast){
  var out=[];
  (function walk(n){
    switch(n.t){
      case 'ref':if(inGrid(n.r))out.push(refIdx(n.r));break;
      case 'range':{var r=rangeOf(n);if(r.idx)for(var i=0;i<r.idx.length;i++)out.push(r.idx[i]);break;}
      case 'paren':case 'un':case 'pct':walk(n.e);break;
      case 'bin':walk(n.l);walk(n.r);break;
      case 'call':n.args.forEach(walk);break;
    }
  })(ast);
  return out;
}
function recalc(){
  var prec=[],i;
  for(i=0;i<96;i++){
    var raw=sheet[i].raw,f=raw!==''&&raw[0]==='='?parseFormula(raw):null;
    prec.push(f&&f.ok?precOf(f.ast):[]);
  }
  circ=new Array(96).fill(false);memo=new Array(96);
  for(i=0;i<96;i++){
    if(!prec[i].length)continue;
    var seen=new Array(96).fill(false),st=prec[i].slice(),hit=false;
    while(st.length){var x=st.pop();if(x===i){hit=true;break;}if(seen[x])continue;seen[x]=true;for(var k=0;k<prec[x].length;k++)st.push(prec[x][k]);}
    circ[i]=hit;
  }
}
function cellText(i){
  var v=cellVal(i);
  switch(v.k){case 'blank':return '';case 'text':return v.v;case 'logical':return v.v?'TRUE':'FALSE';case 'error':return v.v;default:return fmtNum(v.v,sheet[i].fmt);}
}
function cellKind(i){var v=cellVal(i);return v.k==='blank'?'empty':v.k==='error'?'error':v.k;}
function rawFromEntry(s){
  if(s!==''&&s[0]==='='){var f=parseFormula(s);return f.ok?canon(f.tokens):s;}
  return s;
}

/* ---------- reference rewriting ---------- */
function toNumRef(r){return {c:r.cl.charCodeAt(0)-64,r:Number(r.rs),ca:r.ca,ra:r.ra};}
function fromNumRef(n){return {t:'ref',cl:COLN[n.c-1],ca:n.ca,rs:String(n.r),ra:n.ra};}
function rewriteRaw(raw,refFn,rangeFn){
  var f=parseFormula(raw);if(!f.ok)return raw;
  var toks=f.tokens.map(function(tk){
    if(tk.t==='ref'){if(!inGrid(tk))return tk;var n=refFn(toNumRef(tk));return n?fromNumRef(n):{t:'referr'};}
    if(tk.t==='range'){
      if(!inGrid(tk.a)||!inGrid(tk.b))return tk;
      var r=rangeFn(toNumRef(tk.a),toNumRef(tk.b));
      return r?normRange({t:'range',a:fromNumRef(r[0]),b:fromNumRef(r[1])}):{t:'referr'};
    }
    return tk;
  });
  return canon(toks);
}
function cp(o){return {c:o.c,r:o.r,ca:o.ca,ra:o.ra};}
function structFns(kind,axis,k){
  var lim=axis==='c'?NC:NR;
  if(kind==='ins'){
    var mv=function(v){return v>=k?v+1:v;};
    return {
      ref:function(x){var y=cp(x);y[axis]=mv(x[axis]);return y[axis]>lim?null:y;},
      range:function(a,b){var p=cp(a),q=cp(b);p[axis]=mv(a[axis]);q[axis]=mv(b[axis]);if(p[axis]>lim)return null;if(q[axis]>lim)q[axis]=lim;return [p,q];}
    };
  }
  return {
    ref:function(x){var y=cp(x);if(x[axis]<k)return y;if(x[axis]===k)return null;y[axis]=x[axis]-1;return y;},
    range:function(a,b){var p=cp(a),q=cp(b),t=a[axis],e=b[axis];
      if(k>e)return [p,q];
      if(k<t){p[axis]=t-1;q[axis]=e-1;return [p,q];}
      if(t===e)return null;
      q[axis]=e-1;return [p,q];}
  };
}
function pasteFns(dr,dc){
  var mvr=function(x){var y=cp(x);if(!x.ca)y.c=x.c+dc;if(!x.ra)y.r=x.r+dr;return (y.c<1||y.c>NC||y.r<1||y.r>NR)?null:y;};
  return {ref:mvr,range:function(a,b){var p=mvr(a),q=mvr(b);return p&&q?[p,q]:null;}};
}
/*UI*/
var anchor={r:0,c:0},active={r:0,c:0},editing=false,clip=null,undoS=[],redoS=[];
var $=function(id){return document.getElementById(id);};
var gridEl=$('grid'),inputEl=$('formula-input'),fmtEl=$('fmt'),nameEl=$('name-box'),sumEl=$('selection-summary');
var cellEls=[];
(function build(){
  var h='<tr role="row"><th role="presentation" class="corner"></th>';
  for(var c=0;c<NC;c++)h+='<th role="columnheader" data-testid="col-header-'+COLN[c]+'">'+COLN[c]+'</th>';
  h+='</tr>';
  for(var r=0;r<NR;r++){
    h+='<tr role="row"><th role="rowheader" data-testid="row-header-'+(r+1)+'">'+(r+1)+'</th>';
    for(c=0;c<NC;c++)h+='<td role="gridcell" data-testid="cell-'+COLN[c]+(r+1)+'" data-r="'+r+'" data-c="'+c+'" data-kind="empty" aria-selected="false" data-in-selection="false"></td>';
    h+='</tr>';
  }
  gridEl.innerHTML=h;
  for(var i=0;i<96;i++)cellEls.push(gridEl.querySelector('[data-testid="cell-'+COLN[i%NC]+(Math.floor(i/NC)+1)+'"]'));
})();
function rect(){return {r0:Math.min(anchor.r,active.r),r1:Math.max(anchor.r,active.r),c0:Math.min(anchor.c,active.c),c1:Math.max(anchor.c,active.c)};}
function addr(r,c){return COLN[c]+(r+1);}
function snap(){return sheet.map(function(c){return [c.raw,c.fmt];});}
function restore(s){for(var i=0;i<96;i++)sheet[i]={raw:s[i][0],fmt:s[i][1]};}
function selCopy(){return {a:{r:anchor.r,c:anchor.c},v:{r:active.r,c:active.c}};}
function selSet(s){anchor={r:s.a.r,c:s.a.c};active={r:s.v.r,c:s.v.c};}
function same(a,b){for(var i=0;i<96;i++)if(a[i][0]!==b[i][0]||a[i][1]!==b[i][1])return false;return true;}
function record(before,selB,force){
  var after=snap();
  if(!force&&same(before,after))return;
  undoS.push({before:before,selB:selB,after:after,selA:selCopy()});
  if(undoS.length>20)undoS.shift();
  redoS.length=0;
}
function render(){
  recalc();
  var R=rect(),i,nn=0,sum=0;
  for(i=0;i<96;i++){
    var el=cellEls[i],r=Math.floor(i/NC),c=i%NC,t=cellText(i),k=cellKind(i);
    if(el.textContent!==t)el.textContent=t;
    el.setAttribute('data-kind',k);
    el.setAttribute('aria-selected',(r===active.r&&c===active.c)?'true':'false');
    var ins=r>=R.r0&&r<=R.r1&&c>=R.c0&&c<=R.c1;
    el.setAttribute('data-in-selection',ins?'true':'false');
    if(ins&&k==='number'){nn++;sum+=cellVal(i).v;}
  }
  var single=R.r0===R.r1&&R.c0===R.c1;
  nameEl.textContent=single?addr(active.r,active.c):addr(R.r0,R.c0)+':'+addr(R.r1,R.c1);
  if(nn>0){
    var s=res(sum),a=res(sum/nn);
    sumEl.textContent='Sum: '+(s.k==='error'?'#NUM!':G(s.v))+' | Average: '+(a.k==='error'?'#NUM!':G(a.v))+' | Count: '+nn;
    sumEl.hidden=false;
  }else{sumEl.hidden=true;sumEl.textContent='';}
  var ai=active.r*NC+active.c;
  if(!editing){inputEl.value=sheet[ai].raw;fmtEl.value=sheet[ai].fmt;}
  inputEl.setAttribute('data-editing',editing?'true':'false');
  var btns=document.querySelectorAll('.toolbar button');
  for(i=0;i<btns.length;i++)btns[i].disabled=editing;
  fmtEl.disabled=editing;
  if(!editing){$('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length;$('paste').disabled=!clip;}
}
function applyCommit(){
  var ai=active.r*NC+active.c,raw=rawFromEntry(inputEl.value);
  editing=false;
  if(sheet[ai].raw!==raw)sheet[ai]={raw:raw,fmt:sheet[ai].fmt};
}
function clickCell(r,c,shift){
  var before=snap(),selB=selCopy(),was=editing;
  if(editing)applyCommit();
  if(shift){active={r:r,c:c};}else{active={r:r,c:c};anchor={r:r,c:c};}
  if(was)record(before,selB,false);
  gridEl.focus();render();
}
function moveBy(dr,dc,shift){
  var nr=active.r+dr,nc=active.c+dc;
  if(nr>=0&&nr<NR&&nc>=0&&nc<NC)active={r:nr,c:nc};
  if(!shift)anchor={r:active.r,c:active.c};
}
function commitMove(dr,dc){
  var before=snap(),selB=selCopy();
  if(editing)applyCommit();
  moveBy(dr,dc,false);
  record(before,selB,false);
  render();inputEl.focus();
}
function act(fn,force){var before=snap(),selB=selCopy();fn();record(before,selB,force);render();}
function doClear(){act(function(){var R=rect();for(var r=R.r0;r<=R.r1;r++)for(var c=R.c0;c<=R.c1;c++)sheet[r*NC+c]={raw:'',fmt:sheet[r*NC+c].fmt};},false);}
function doUndo(){if(editing||!undoS.length)return;var s=undoS.pop();redoS.push(s);restore(s.before);selSet(s.selB);render();}
function doRedo(){if(editing||!redoS.length)return;var s=redoS.pop();undoS.push(s);restore(s.after);selSet(s.selA);render();}
function doCopy(mode){
  var R=rect(),cells=[];
  for(var r=R.r0;r<=R.r1;r++){var row=[];for(var c=R.c0;c<=R.c1;c++){var x=sheet[r*NC+c];row.push({raw:x.raw,fmt:x.fmt});}cells.push(row);}
  clip={cells:cells,r0:R.r0,c0:R.c0,mode:mode};render();
}
function doPaste(){
  if(!clip)return;
  act(function(){
    var R=rect(),r0=R.r0,c0=R.c0,cb=clip;
    if(cb.mode==='cut'){
      for(var i=0;i<cb.cells.length;i++)for(var j=0;j<cb.cells[i].length;j++)sheet[(cb.r0+i)*NC+cb.c0+j]={raw:'',fmt:'general'};
    }
    for(i=0;i<cb.cells.length;i++)for(j=0;j<cb.cells[i].length;j++){
      var dr=r0+i,dc=c0+j;if(dr>=NR||dc>=NC)continue;
      var src=cb.cells[i][j],raw=src.raw;
      if(cb.mode==='copy'&&raw!==''&&raw[0]==='='){var f=pasteFns(dr-(cb.r0+i),dc-(cb.c0+j));raw=rewriteRaw(raw,f.ref,f.range);}
      sheet[dr*NC+dc]={raw:raw,fmt:src.fmt};
    }
    if(cb.mode==='cut')clip=null;
    anchor={r:r0,c:c0};active={r:r0,c:c0};
  },true);
}
function doStruct(kind,axis){
  act(function(){
    var k=axis==='r'?active.r+1:active.c+1,f=structFns(kind,axis,k),i;
    for(i=0;i<96;i++){var raw=sheet[i].raw;if(raw!==''&&raw[0]==='=')sheet[i]={raw:rewriteRaw(raw,f.ref,f.range),fmt:sheet[i].fmt};}
    var old=sheet.slice(),blank=function(){return {raw:'',fmt:'general'};};
    for(var r=0;r<NR;r++)for(var c=0;c<NC;c++){
      var p=axis==='r'?r:c,lim=axis==='r'?NR:NC,src;
      if(kind==='ins')src=p<k-1?p:p===k-1?-1:p-1;
      else src=p<k-1?p:p+1>=lim?-1:p+1;
      var cell;
      if(src<0)cell=blank();else cell=axis==='r'?old[src*NC+c]:old[r*NC+src];
      sheet[r*NC+c]=cell;
    }
  },true);
}
function setFormat(v){
  act(function(){var R=rect();for(var r=R.r0;r<=R.r1;r++)for(var c=R.c0;c<=R.c1;c++)sheet[r*NC+c]={raw:sheet[r*NC+c].raw,fmt:v};},false);
}
gridEl.addEventListener('click',function(e){
  var td=e.target.closest&&e.target.closest('td[data-r]');if(!td)return;
  clickCell(Number(td.getAttribute('data-r')),Number(td.getAttribute('data-c')),e.shiftKey);
});
gridEl.addEventListener('keydown',function(e){
  var k=e.key,lk=k.length===1?k.toLowerCase():k,arrow={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
  var handled=arrow||k==='Delete'||k==='Backspace'||k==='Enter'||(e.ctrlKey&&(lk==='z'||lk==='y'));
  if(!handled)return;
  e.preventDefault();
  if(k==='Enter'){inputEl.focus();return;}
  if(editing)return;
  if(arrow){moveBy(arrow[0],arrow[1],e.shiftKey);render();}
  else if(k==='Delete'||k==='Backspace')doClear();
  else if(lk==='z')doUndo();
  else doRedo();
});
inputEl.addEventListener('input',function(){if(!editing){editing=true;render();}});
inputEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();commitMove(1,0);}
  else if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();commitMove(0,1);}
  else if(e.key==='Escape'){e.preventDefault();editing=false;render();gridEl.focus();}
});
$('undo').onclick=doUndo;$('redo').onclick=doRedo;
$('copy').onclick=function(){doCopy('copy');};
$('cut').onclick=function(){doCopy('cut');};
$('paste').onclick=doPaste;$('clear').onclick=doClear;
$('insrow').onclick=function(){doStruct('ins','r');};
$('delrow').onclick=function(){doStruct('del','r');};
$('inscol').onclick=function(){doStruct('ins','c');};
$('delcol').onclick=function(){doStruct('del','c');};
fmtEl.addEventListener('change',function(){setFormat(fmtEl.value);});
render();
</script>
</body>
