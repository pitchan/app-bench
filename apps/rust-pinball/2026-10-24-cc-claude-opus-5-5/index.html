<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Opus 5.5</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 0; height: 28px; line-height: 28px; font: 600 18px system-ui, sans-serif; color: #b8c6ff; }
  canvas {
    display: block;
    height: min(calc(100vh - 28px), calc(100vw * 780 / 400));
    height: min(calc(100dvh - 28px), calc(100vw * 780 / 400));
    width: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<h1>Opus 5.5</h1>
<canvas id="table" width="400" height="780"></canvas>
<script>
(async () => {
  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');
  const bytes = await (await fetch('./pinball.wasm')).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, {});
  const wasm = instance.exports;
  wasm.init();
  const w = wasm.width(), h = wasm.height();
  canvas.width = w;
  canvas.height = h;

  let image = null, view = null;
  let last = performance.now();
  function loop(now) {
    wasm.frame(now - last);
    last = now;
    const ptr = wasm.buffer_ptr();
    if (!image || view.buffer !== wasm.memory.buffer || view.byteOffset !== ptr) {
      view = new Uint8ClampedArray(wasm.memory.buffer, ptr, w * h * 4);
      image = new ImageData(view, w, h);
    }
    ctx.putImageData(image, 0, 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  const handled = new Set([32, 37, 39, 77, 90]);
  addEventListener('keydown', e => {
    if (handled.has(e.keyCode)) e.preventDefault();
    if (!e.repeat) wasm.key_down(e.keyCode);
  });
  addEventListener('keyup', e => {
    if (handled.has(e.keyCode)) e.preventDefault();
    wasm.key_up(e.keyCode);
  });
  addEventListener('blur', () => wasm.release_all());

  function toBuffer(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * w / r.width, (e.clientY - r.top) * h / r.height];
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const [x, y] = toBuffer(e);
    wasm.pointer_down(e.pointerId, x, y);
  });
  const up = e => wasm.pointer_up(e.pointerId);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
