<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opus 5.5</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d8f0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{display:block}
  #help{position:fixed;top:14px;left:14px;background:rgba(255,255,255,.9);color:#22355f;padding:12px 16px 12px;border-radius:16px;font-size:13px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:270px;user-select:none}
  #help h1{margin:0 0 6px;font-size:18px;letter-spacing:.3px}
  #help kbd{display:inline-block;min-width:16px;padding:0 5px;border-radius:6px;background:#e7f0ff;border:1px solid #b9cbee;font:600 11px/18px system-ui,sans-serif;text-align:center;color:#22355f}
  #help.hidden{display:none}
  #loc{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#22355f;color:#fff;padding:6px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.2);user-select:none;white-space:nowrap}
  #name{position:fixed;left:0;top:0;padding:4px 12px;border-radius:999px;background:#fff;color:#22355f;font-weight:800;font-size:14px;transform:translate(-50%,-100%);display:none;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.2);border:2px solid #f19447}
  #dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
  #dot.off{display:none}
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="help">
  <h1>Opus 5.5</h1>
  <div>Click the scene to look around</div>
  <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows: walk</div>
  <div><kbd>Shift</kbd> run &nbsp; Mouse: look</div>
  <div><kbd>O</kbd> orbit view (drag, wheel)</div>
  <div><kbd>H</kbd> hide this help</div>
</div>
<div id="loc">Garden</div>
<div id="name"></div>
<div id="dot"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const DEG = Math.PI / 180;
const F = 2.4;            // top of house floor
const WH = 2.7;           // wall height
const CEIL = F + WH;      // ceiling height
const STEP = 0.45;        // max step-up height
const PR = 0.25;          // visitor radius
const EYE = 1.0;          // eye height

function groundH(x, z) {
  return 0.35 * Math.sin(x * 0.07 + 0.4) * Math.cos(z * 0.06 - 0.3)
       + 0.15 * Math.sin(x * 0.15 + z * 0.11) - 0.012 * z;
}

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = 0xd8f0ff;
scene.background = new THREE.Color(HORIZON);
scene.fog = new THREE.Fog(HORIZON, 70, 380);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 2000);
camera.rotation.order = 'YXZ';

// ---------- helpers: textures, materials, batching, colliders ----------
let seed = 12345;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function makeTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const matCache = new Map();
function lam(color, opt = {}) {
  const key = color + JSON.stringify(opt);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial({ color, ...opt });
  matCache.set(key, m);
  return m;
}
function texMat(tex, tile, color = 0xffffff) {
  const m = new THREE.MeshLambertMaterial({ map: tex, color });
  if (tile) m.userData.tile = tile;
  return m;
}

const batches = new Map();
function addGeo(mat, geo) {
  if (geo.index) geo = geo.toNonIndexed();
  for (const k of Object.keys(geo.attributes)) if (!['position', 'normal', 'uv'].includes(k)) geo.deleteAttribute(k);
  let arr = batches.get(mat);
  if (!arr) { arr = []; batches.set(mat, arr); }
  arr.push(geo);
}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function put(mat, geo, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e);
  _m4.compose(_v.set(x, y, z), _q, _s.set(sx, sy, sz));
  geo.applyMatrix4(_m4); addGeo(mat, geo);
}
function boxUV(g, w, h, d, tile, yb) {
  const [tu, tv] = tile, uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) {
    let su, sv, ov = 0;
    if (f < 2) { su = d / tu; sv = h / tv; ov = yb / tv; }
    else if (f < 4) { su = w / tu; sv = d / tv; }
    else { su = w / tu; sv = h / tv; ov = yb / tv; }
    for (let i = f * 4; i < f * 4 + 4; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv + ov);
  }
}
function box(mat, w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (mat.userData.tile) boxUV(g, w, h, d, mat.userData.tile, y - h / 2);
  put(mat, g, x, y, z, rx, ry, rz);
}
function bx(mat, x0, x1, y0, y1, z0, z1) { box(mat, x1 - x0, y1 - y0, z1 - z0, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); }
function cyl(mat, rt, rb, h, x, y, z, seg = 16, rx = 0, ry = 0, rz = 0) { put(mat, new THREE.CylinderGeometry(rt, rb, h, seg), x, y, z, rx, ry, rz); }
function sph(mat, r, x, y, z, sx = 1, sy = 1, sz = 1, seg = 16) { put(mat, new THREE.SphereGeometry(r, seg, Math.max(8, (seg * 0.75) | 0)), x, y, z, 0, 0, 0, sx, sy, sz); }
function rod(mat, r, a, b, seg = 8, r2) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const g = new THREE.CylinderGeometry(r2 ?? r, r, len, seg);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  _m4.compose(a.clone().add(b).multiplyScalar(0.5), q, _s.set(1, 1, 1));
  g.applyMatrix4(_m4); addGeo(mat, g);
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function flush() {
  for (const [mat, geos] of batches) {
    const g = mergeGeometries(geos, false);
    const m = new THREE.Mesh(g, mat);
    m.castShadow = !mat.userData.noCast;
    m.receiveShadow = !mat.userData.noReceive;
    scene.add(m);
  }
  batches.clear();
}

const colBoxes = [], colCircles = [];
function solid(x0, x1, y0, y1, z0, z1) {
  colBoxes.push({ x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0, y1, z0: Math.min(z0, z1), z1: Math.max(z0, z1) });
}
function furn(mat, x0, x1, y0, y1, z0, z1) { bx(mat, x0, x1, y0, y1, z0, z1); solid(x0, x1, y0, y1, z0, z1); }
function solidC(x, z, r, y0 = -50, y1 = 50) { colCircles.push({ x, z, r, y0, y1 }); }

// walkable raised surfaces
const platforms = [];
let stairAt = () => null;
function surfaceAt(x, z, foot) {
  let best = groundH(x, z);
  for (const p of platforms)
    if (x >= p.x0 && x <= p.x1 && z >= p.z0 && z <= p.z1 && p.y <= foot + STEP && p.y > best) best = p.y;
  const s = stairAt(x, z);
  if (s !== null && s <= foot + STEP && s > best) best = s;
  return best;
}

const ROOMS = [];
const LANDMARKS = [];
const characters = [];
let locateExtra = () => null;
function locate(x, z, foot) {
  const r = locateExtra(x, z, foot);
  return r || 'Garden';
}

// ---------- sky ----------
{
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3d9be9) }, bot: { value: new THREE.Color(HORIZON) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y*1.5, 0.0, 1.0); gl_FragColor = vec4(mix(bot, top, pow(h, 0.65)), 1.0);\n#include <colorspace_fragment>\n}'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);
  sky.renderOrder = -1;
  scene.add(sky);
}

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x9ccf6a, 1.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dc, 2.0);
sun.position.set(22, 38, 26);
sun.target.position.set(0, 0, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 130 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// ---------- ground ----------
const grassTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#86cb5c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = rnd() < 0.5 ? '#7bbf52' : '#92d468';
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 2 + rnd() * 3);
  }
});
{
  const SIZE = 900, SEG = 225;
  const gg = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  gg.rotateX(-Math.PI / 2);
  const p = gg.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
  gg.computeVertexNormals();
  grassTex.repeat.set(SEG, SEG);
  const ground = new THREE.Mesh(gg, new THREE.MeshLambertMaterial({ map: grassTex }));
  ground.receiveShadow = true;
  scene.add(ground);
}

// ======================= HOUSE =======================
const weatherTex = makeTex(64, 256, (g, w, h) => {
  const n = 6, bh = h / n;
  for (let i = 0; i < n; i++) {
    const y = i * bh;
    g.fillStyle = '#f7eac6'; g.fillRect(0, y, w, bh);
    g.fillStyle = '#fffaea'; g.fillRect(0, y, w, 4);
    g.fillStyle = '#dccb9f'; g.fillRect(0, y + bh - 7, w, 7);
  }
});
function boardsTex(base, var1, joint) {
  return makeTex(256, 256, (g, w, h) => {
    const n = 8, bh = h / n;
    for (let i = 0; i < n; i++) {
      const t = rnd();
      g.fillStyle = t < 0.33 ? base : t < 0.66 ? var1 : base;
      g.fillRect(0, i * bh, w, bh);
      g.globalAlpha = 0.15; g.fillStyle = joint;
      for (let k = 0; k < 3; k++) g.fillRect(0, i * bh + 4 + rnd() * (bh - 8), w, 1);
      g.globalAlpha = 1;
      g.fillStyle = joint; g.fillRect(0, i * bh, w, 2);
      const jx = rnd() * w; g.fillRect(jx, i * bh, 2, bh);
    }
  });
}
const floorTex = boardsTex('#dba96a', '#d29e5e', '#9c6c3a');
const verTex = boardsTex('#c2a682', '#b89b77', '#86694a');
const roofTex = makeTex(64, 8, (g, w) => {
  for (let x = 0; x < w; x++) {
    const s = 0.8 + 0.2 * Math.sin(x / w * Math.PI * 2 * 4);
    g.fillStyle = `rgb(${(128 * s) | 0},${(160 * s) | 0},${(176 * s) | 0})`;
    g.fillRect(x, 0, 1, 8);
  }
});
const rugTex = makeTex(256, 160, (g, w, h) => {
  g.fillStyle = '#e76f51'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#f4d58d'; g.fillRect(12, 12, w - 24, h - 24);
  g.fillStyle = '#2a9d8f';
  for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) {
    const cx = 34 + i * 38, cy = 38 + j * 42;
    g.beginPath(); g.moveTo(cx, cy - 14); g.lineTo(cx + 14, cy); g.lineTo(cx, cy + 14); g.lineTo(cx - 14, cy); g.fill();
  }
  g.strokeStyle = '#e76f51'; g.lineWidth = 4; g.strokeRect(24, 24, w - 48, h - 48);
});
function picTex(kind) {
  return makeTex(128, 96, (g, w, h) => {
    g.fillStyle = '#fffdf6'; g.fillRect(0, 0, w, h);
    g.lineCap = 'round'; g.lineWidth = 4;
    if (kind === 0) { // house & sun
      g.fillStyle = '#ffd43b'; g.beginPath(); g.arc(100, 22, 12, 0, 7); g.fill();
      g.fillStyle = '#86cb5c'; g.fillRect(0, 74, w, 22);
      g.fillStyle = '#f7d9a6'; g.fillRect(30, 44, 50, 32);
      g.fillStyle = '#e76f51'; g.beginPath(); g.moveTo(24, 46); g.lineTo(55, 24); g.lineTo(86, 46); g.fill();
      g.fillStyle = '#5b95db'; g.fillRect(40, 52, 10, 10); g.fillRect(60, 52, 10, 10);
    } else if (kind === 1) { // family
      const cols = ['#3f5e9f', '#e2a062', '#5b95db', '#f19447'], hs = [52, 46, 36, 30];
      cols.forEach((c, i) => {
        const x = 20 + i * 29, top = 86 - hs[i];
        g.fillStyle = c; g.beginPath(); g.ellipse(x, 86 - hs[i] * 0.35, 8, hs[i] * 0.35, 0, 0, 7); g.fill();
        g.beginPath(); g.arc(x, top + 8, 9, 0, 7); g.fill();
        g.beginPath(); g.moveTo(x - 8, top + 4); g.lineTo(x - 5, top - 8); g.lineTo(x - 1, top + 2); g.fill();
        g.beginPath(); g.moveTo(x + 8, top + 4); g.lineTo(x + 5, top - 8); g.lineTo(x + 1, top + 2); g.fill();
      });
      g.fillStyle = '#86cb5c'; g.fillRect(0, 86, w, 10);
    } else if (kind === 2) { // rainbow
      ['#e63946', '#f4a261', '#ffd43b', '#86cb5c', '#5b95db', '#9b5de5'].forEach((c, i) => {
        g.strokeStyle = c; g.lineWidth = 6; g.beginPath(); g.arc(64, 90, 54 - i * 7, Math.PI, 0); g.stroke();
      });
    } else { // flower
      g.fillStyle = '#86cb5c'; g.fillRect(61, 46, 6, 46);
      g.fillStyle = '#ff8fab';
      for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(64 + Math.cos(i) * 14, 36 + Math.sin(i) * 14, 10, 0, 7); g.fill(); }
      g.fillStyle = '#ffd43b'; g.beginPath(); g.arc(64, 36, 9, 0, 7); g.fill();
    }
  });
}
const picMats = [0, 1, 2, 3].map(k => texMat(picTex(k)));

const M = {
  weather: texMat(weatherTex, [2, 1]),
  wallIn: lam(0xf8eed6),
  wallKid: lam(0xd9ecf7),
  trim: lam(0xffffff),
  floor: texMat(floorTex, [1.4, 1.4]),
  verFloor: texMat(verTex, [1.4, 1.4]),
  roof: texMat(roofTex, [0.6, 1]),
  timber: lam(0xb08a60),
  stilt: lam(0x9a7853),
  dark: lam(0x3a2f28),
  ceil: lam(0xfffcf2),
  concrete: lam(0xb8b4aa),
  rug: texMat(rugTex),
  wood: lam(0xc8935a),
  woodLight: lam(0xe6c89a),
  white: lam(0xfafafa),
  black: lam(0x23262d),
  screen: lam(0x34445e),
  couch: lam(0x5fa8a0),
  couchLight: lam(0x77bdb4),
  orange: lam(0xf19447),
  yellow: lam(0xffd43b),
  red: lam(0xe63946),
  blue: lam(0x5b95db),
  green: lam(0x6bbf59),
  pink: lam(0xff9fb5),
  purple: lam(0x9b7be0),
  cab: lam(0xa9d8c8),
  bench: lam(0xf3efe6),
  steel: lam(0xb9c2cc),
  pot: lam(0xd9714a),
  leaf: lam(0x4caf50),
  leaf2: lam(0x63c25a),
  soil: lam(0x6b4a33),
};
M.glass = new THREE.MeshLambertMaterial({ color: 0xc4ecff, transparent: true, opacity: 0.25, depthWrite: false });
M.glass.userData.noCast = true;
M.glass.userData.noReceive = true;

// house footprint
const HX0 = -7, HX1 = 7, HZ0 = -6, HZ1 = 3, VZ1 = 5.5;
platforms.push({ x0: -7.1, x1: 7.1, z0: -6.1, z1: VZ1 + 0.05, y: F });

ROOMS.push(
  { name: 'Living Room', x0: -2, x1: 7, z0: -1.5, z1: 3 },
  { name: 'Kitchen', x0: -7, x1: -2, z0: -1.5, z1: 3 },
  { name: "Mum and Dad's Room", x0: -7, x1: -2, z0: -6, z1: -1.5 },
  { name: 'Playroom', x0: -2, x1: 1.5, z0: -6, z1: -1.5 },
  { name: "Girls' Bedroom", x0: 1.5, x1: 7, z0: -6, z1: -1.5 }
);

// stairs
const SX0 = 2.55, SX1 = 3.95, SN = 11, ST = 0.3, SZ0 = VZ1, SZE = VZ1 + SN * ST;
const SGB = groundH((SX0 + SX1) / 2, SZE + 0.15);
const SRISE = (F - SGB) / (SN + 1);
const stairTop = i => F - (i + 1) * SRISE;
stairAt = (x, z) => {
  if (x < SX0 || x > SX1 || z < SZ0 || z > SZE) return null;
  return stairTop(Math.min(SN - 1, Math.floor((z - SZ0) / ST)));
};

locateExtra = (x, z, foot) => {
  if (stairAt(x, z) !== null && foot > SGB + 0.05) return 'Veranda';
  if (foot < F - 0.6) return null;
  if (x >= -7.1 && x <= 7.1 && z > HZ1 && z <= VZ1 + 0.1) return 'Veranda';
  for (const r of ROOMS) if (x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1) return r.name;
  return null;
};

// wall builder. opens: [a, b, bottom, top] relative to floor; bottom 0 = doorway
function wall(along, c, a, b, opens, layers) {
  opens = [...opens].sort((p, q) => p[0] - q[0]);
  const pieces = []; let cur = a;
  for (const [oa, ob, bot, top] of opens) {
    if (oa > cur) pieces.push([cur, oa, 0, WH]);
    if (bot > 0) pieces.push([oa, ob, 0, bot]);
    if (top < WH) pieces.push([oa, ob, top, WH]);
    cur = ob;
  }
  if (b > cur) pieces.push([cur, b, 0, WH]);
  const B = (mat, u0, u1, y0, y1, n0, n1) => along === 'x'
    ? bx(mat, u0, u1, y0, y1, c + n0, c + n1)
    : bx(mat, c + n0, c + n1, y0, y1, u0, u1);
  for (const L of layers) for (const [p0, p1, y0, y1] of pieces) B(L.mat, p0, p1, F + y0, F + y1, L.off - L.th / 2, L.off + L.th / 2);
  // colliders (gaps only at doorways)
  const T = 0.08; cur = a;
  const segs = [];
  for (const o of opens) if (o[2] === 0) { segs.push([cur, o[0]]); cur = o[1]; }
  segs.push([cur, b]);
  for (const [s0, s1] of segs) if (s1 > s0) {
    if (along === 'x') solid(s0, s1, F, CEIL, c - T, c + T); else solid(c - T, c + T, F, CEIL, s0, s1);
  }
  // frames
  for (const [oa, ob, bot, top] of opens) {
    B(M.trim, oa - 0.07, oa, F + Math.max(0, bot - 0.07), F + top + 0.07, -0.1, 0.1);
    B(M.trim, ob, ob + 0.07, F + Math.max(0, bot - 0.07), F + top + 0.07, -0.1, 0.1);
    B(M.trim, oa - 0.07, ob + 0.07, F + top, F + top + 0.09, -0.1, 0.1);
    if (bot > 0) {
      B(M.trim, oa - 0.1, ob + 0.1, F + bot - 0.06, F + bot, -0.14, 0.14);
      B(M.trim, (oa + ob) / 2 - 0.025, (oa + ob) / 2 + 0.025, F + bot, F + top, -0.025, 0.025);
      B(M.trim, oa, ob, F + (bot + top) / 2 - 0.025, F + (bot + top) / 2 + 0.025, -0.025, 0.025);
      B(M.glass, oa, ob, F + bot, F + top, -0.008, 0.008);
    }
  }
}
const extLayers = s => [{ mat: M.weather, off: s * 0.035, th: 0.07 }, { mat: M.wallIn, off: -s * 0.035, th: 0.07 }];
const inLayers = [{ mat: M.wallIn, off: 0, th: 0.12 }];
const WB = 0.95, WT = 2.15, DT = 2.15;

function railRun(along, c, a, b) {
  const B = (u0, u1, y0, y1, w) => along === 'x' ? bx(M.trim, u0, u1, y0, y1, c - w, c + w) : bx(M.trim, c - w, c + w, y0, y1, u0, u1);
  B(a, b, F + 0.86, F + 0.94, 0.05);
  B(a, b, F + 0.08, F + 0.14, 0.03);
  for (let u = a + 0.08; u < b - 0.04; u += 0.13) B(u - 0.018, u + 0.018, F + 0.14, F + 0.86, 0.018);
}

// --- timber paling fence ---
const FX = 24, FZ0 = -22, FZ1 = 26;
{
  const H = 1.7;
  function fenceRun(ax, az, bxp, bz, gate) {
    const len = Math.hypot(bxp - ax, bz - az), n = Math.round(len / 0.15);
    const ux = (bxp - ax) / len, uz = (bz - az) / len, ry = Math.atan2(ux, uz);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, x = ax + (bxp - ax) * t, z = az + (bz - az) * t, g = gh(x, z);
      const tall = H + (i % 2 ? 0 : 0.04);
      box(gate && gate(x, z) ? M.white : G.fence, 0.13, tall, 0.025, x, g - 0.1 + tall / 2, z, 0, ry + Math.PI / 2);
    }
    const np = Math.ceil(len / 2.4);
    for (let i = 0; i <= np; i++) {
      const t = i / np, x = ax + (bxp - ax) * t, z = az + (bz - az) * t, g = gh(x, z);
      bx(G.fenceDark, x - 0.06, x + 0.06, g - 0.2, g + H + 0.05, z - 0.06, z + 0.06);
      if (i < np) {
        const t2 = (i + 1) / np, x2 = ax + (bxp - ax) * t2, z2 = az + (bz - az) * t2, g2 = gh(x2, z2);
        for (const yy of [0.35, 1.3]) rod(G.fenceDark, 0.035, V(x, g + yy, z), V(x2, g2 + yy, z2), 4);
      }
    }
  }
  fenceRun(-FX, FZ1, FX, FZ1, (x) => x > 2.3 && x < 4.2);
  fenceRun(-FX, FZ0, FX, FZ0);
  fenceRun(-FX, FZ0, -FX, FZ1);
  fenceRun(FX, FZ0, FX, FZ1);
  solid(-FX - 1, FX + 1, -50, 50, FZ1 - 0.1, FZ1 + 1);
  solid(-FX - 1, FX + 1, -50, 50, FZ0 - 1, FZ0 + 0.1);
  solid(-FX - 1, -FX + 0.1, -50, 50, FZ0 - 1, FZ1 + 1);
  solid(FX - 0.1, FX + 1, -50, 50, FZ0 - 1, FZ1 + 1);
  // letterbox at the gate
  const lg = gh(5.0, 26.6);
  bx(G.fenceDark, 4.95, 5.05, lg - 0.1, lg + 1.0, 26.55, 26.65);
  bx(M.red, 4.8, 5.2, lg + 1.0, lg + 1.3, 26.45, 26.8);
  LANDMARKS.push('Timber Paling Fence');
}

// --- garden shrubs along the fence ---
{
  const spots = [];
  for (let x = -21; x <= 21; x += 3.5) { if (Math.abs(x - 3.25) > 2.5) spots.push([x, FZ1 - 1.2]); spots.push([x, FZ0 + 1.2]); }
  for (let z = -18; z <= 22; z += 4) { spots.push([-FX + 1.2, z]); spots.push([FX - 1.2, z]); }
  const lm = [G.leafA, G.leafB, G.leafC];
  for (const [x0, z0] of spots) {
    const x = x0 + (rnd() - 0.5) * 0.8, z = z0 + (rnd() - 0.5) * 0.4, g = gh(x, z), r = 0.6 + rnd() * 0.35;
    sph(lm[(rnd() * 3) | 0], r, x, g + r * 0.6, z, 1, 0.85, 1, 12);
    sph(lm[(rnd() * 3) | 0], r * 0.7, x + r * 0.5, g + r * 0.5, z + 0.1, 1, 0.85, 1, 10);
    if (rnd() < 0.5) for (let k = 0; k < 4; k++) sph(rnd() < 0.5 ? M.pink : M.yellow, 0.07, x + (rnd() - 0.5) * r, g + r * 1.0 + rnd() * 0.2, z + (rnd() - 0.5) * r, 1, 1, 1, 6);
    solidC(x, z, r * 0.9, -50, g + r * 1.4);
  }
  LANDMARKS.push('Garden Shrubs');
}

// --- distant surroundings: neighbour houses, trees, hills, clouds ---
{
  function farHouse(x, z, ry, i) {
    const g = gh(x, z), w = 9 + (i % 3), d = 8, h = 3.0, base = g + 1.8;
    const c = Math.cos(ry), s = Math.sin(ry);
    const P = (lx, lz) => [x + lx * c + lz * s, z - lx * s + lz * c];
    box(G.wallN[i % 4], w, h, d, x, base + h / 2, z, 0, ry);
    for (const lx of [-w / 2 + 0.4, 0, w / 2 - 0.4]) for (const lz of [-d / 2 + 0.4, d / 2 - 0.4]) {
      const [px, pz] = P(lx, lz); bx(M.stilt, px - 0.12, px + 0.12, gh(px, pz) - 0.3, base, pz - 0.12, pz + 0.12);
    }
    const k = 0.5, half = d / 2 + 0.5, L = Math.hypot(half, half * k);
    for (const sd of [-1, 1]) {
      const [px, pz] = P(0, sd * half / 2);
      box(G.roofN[i % 4], w + 0.8, 0.12, L, px, base + h + half * k / 2, pz, sd * Math.atan(k), ry);
    }
  }
  const houses = [[-36, -6, Math.PI / 2], [36, 2, -Math.PI / 2], [-12, -38, 0], [14, -40, 0.1], [-34, 30, Math.PI / 2], [34, 32, -Math.PI / 2], [-6, 44, Math.PI], [18, 46, Math.PI], [-40, -36, 0.6], [42, -30, -0.5]];
  houses.forEach(([x, z, r], i) => farHouse(x, z, r, i));
  const lm = [G.leafA, G.leafB, G.leafC];
  for (let i = 0; i < 70; i++) {
    const a = rnd() * Math.PI * 2, rr = 32 + rnd() * 70;
    const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
    if (Math.abs(x) < FX + 4 && z > FZ0 - 4 && z < FZ1 + 4) continue;
    if (houses.some(([hx, hz]) => Math.hypot(hx - x, hz - z) < 8)) continue;
    const g = gh(x, z), h = 3 + rnd() * 4;
    cyl(G.bark, 0.25, 0.4, h, x, g + h / 2, z, 8);
    const r = 2 + rnd() * 2;
    sph(lm[i % 3], r, x, g + h + r * 0.5, z, 1, 0.85, 1, 12);
    sph(lm[(i + 1) % 3], r * 0.7, x + r * 0.5, g + h + r * 0.2, z + 0.3, 1, 0.85, 1, 10);
  }
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2 + rnd() * 0.2, rr = 230 + rnd() * 80, r = 70 + rnd() * 40;
    sph(i % 2 ? G.hill : G.hill2, r, Math.cos(a) * rr, -r * 0.62, Math.sin(a) * rr, 1.4, 1, 1, 24);
  }
  const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
  cloudMat.userData.noCast = true; cloudMat.userData.noReceive = true;
  for (let i = 0; i < 14; i++) {
    const a = rnd() * Math.PI * 2, rr = 300 + rnd() * 200, y = 90 + rnd() * 70;
    const cx = Math.cos(a) * rr, cz = Math.sin(a) * rr, s = 14 + rnd() * 10;
    for (let k = 0; k < 5; k++) sph(cloudMat, s * (0.6 + rnd() * 0.5), cx + (k - 2) * s * 0.8, y + rnd() * s * 0.3, cz + (rnd() - 0.5) * s, 1, 0.6, 1, 12);
  }
}

flush();

// ======================= FAMILY =======================
const SPH = new THREE.SphereGeometry(1, 28, 20);
const CAP = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, 0, 1.05);
const KID = { legR: 0.058, hip: 0.075, legTop: 0.2, torso: [0.165, 0.2, 0.145], torsoY: 0.34, shY: 0.45, shX: 0.155, armR: 0.046, armLen: 0.155, R: 0.19, headY: 0.67, muz: 0.55, ear: 1.15 };
const ADULT = { legR: 0.052, hip: 0.07, legTop: 0.4, torso: [0.155, 0.25, 0.135], torsoY: 0.55, shY: 0.7, shX: 0.15, armR: 0.043, armLen: 0.27, R: 0.155, headY: 0.91, muz: 0.8, ear: 1.25 };

function makeHeeler(o) {
  const P = o.adult ? ADULT : KID, C = o.colors, R = P.R;
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const mk = (geo, col, parent, x, y, z, sx, sy = sx, sz = sx) => {
    const m = new THREE.Mesh(geo, lam(col));
    m.position.set(x, y, z); m.scale.set(sx, sy, sz);
    m.castShadow = true; m.receiveShadow = true;
    parent.add(m); return m;
  };
  // legs & feet
  for (const s of [-1, 1]) {
    mk(SPH, C.paw, body, s * P.hip, P.legR * 0.75, P.legR * 0.5, P.legR * 1.35, P.legR * 0.75, P.legR * 1.8);
    const total = P.legTop - P.legR * 0.2, len = Math.max(0.01, total - 2 * P.legR);
    mk(new THREE.CapsuleGeometry(P.legR, len, 6, 14), C.leg, body, s * P.hip, (P.legTop + P.legR * 0.2) / 2, 0, 1);
  }
  // torso, belly, back saddle
  const [tx, ty, tz] = P.torso;
  mk(SPH, C.main, body, 0, P.torsoY, 0, tx, ty, tz);
  mk(SPH, C.light, body, 0, P.torsoY - ty * 0.1, tz * 0.55, tx * 0.72, ty * 0.75, tz * 0.55);
  mk(SPH, C.dark, body, 0, P.torsoY + ty * 0.15, -tz * 0.5, tx * 0.82, ty * 0.62, tz * 0.55);
  // arms
  const armGeo = new THREE.CapsuleGeometry(P.armR, P.armLen, 6, 12);
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(s * P.shX, P.shY, 0);
    body.add(pivot);
    mk(armGeo, C.arm, pivot, 0, -P.armLen / 2, 0, 1);
    mk(SPH, C.paw, pivot, 0, -P.armLen / 2 - P.armR * 1.2, 0, P.armR * 1.3);
    const a = o.arms ? o.arms[s > 0 ? 1 : 0] : [0.18, 0];
    pivot.rotation.set(a[1], 0, s * a[0]);
  }
  // tail
  {
    const pivot = new THREE.Group();
    pivot.position.set(0, P.torsoY - ty * 0.35, -tz * 0.85);
    body.add(pivot);
    const tl = P.armLen * 0.85;
    mk(new THREE.CapsuleGeometry(P.armR * 0.85, tl, 6, 10), C.main, pivot, 0, tl / 2, 0, 1);
    mk(SPH, C.tailTip, pivot, 0, tl + P.armR * 0.4, 0, P.armR * 1.05, P.armR * 1.6, P.armR * 1.05);
    pivot.rotation.x = -0.95;
  }
  // head
  const head = new THREE.Group();
  head.position.set(0, P.headY, 0);
  head.rotation.set(o.nod || 0, o.turn || 0, o.tilt || 0);
  body.add(head);
  mk(SPH, C.main, head, 0, 0, 0, R * 1.05, R * 0.93, R);
  const cap = mk(CAP, C.dark, head, 0, 0, 0, R * 1.065, R * 0.945, R * 1.015);
  cap.rotation.x = -0.5;
  mk(SPH, C.light, head, 0, -R * 0.35, R * 0.45, R * 0.72, R * 0.5, R * 0.58);
  mk(SPH, C.light, head, 0, -R * 0.3, R * 0.85, R * 0.42, R * 0.33, R * P.muz);
  mk(SPH, '#1d1d24', head, 0, -R * 0.16, R * (0.85 + P.muz * 0.93), R * 0.15, R * 0.11, R * 0.1);
  for (const s of [-1, 1]) {
    mk(SPH, '#ffffff', head, s * R * 0.38, R * 0.1, R * 0.86, R * 0.16, R * 0.2, R * 0.1);
    mk(SPH, '#1d1d24', head, s * R * 0.37, R * 0.08, R * 0.94, R * 0.11, R * 0.13, R * 0.07);
    mk(SPH, '#ffffff', head, s * R * 0.37 + R * 0.03, R * 0.14, R * 1.0, R * 0.035);
    if (C.brow) mk(SPH, C.brow, head, s * R * 0.36, R * 0.4, R * 0.8, R * 0.12, R * 0.07, R * 0.06);
    if (C.cheek) mk(SPH, C.cheek, head, s * R * 0.62, -R * 0.12, R * 0.62, R * 0.16, R * 0.12, R * 0.08);
    // ears
    const ep = new THREE.Group();
    ep.position.set(s * R * 0.5, R * 0.68, -R * 0.12);
    ep.rotation.z = -s * 0.28;
    head.add(ep);
    mk(new THREE.ConeGeometry(R * 0.36, R * P.ear, 20), C.ear, ep, 0, R * P.ear / 2, 0, 1, 1, 0.5);
    mk(new THREE.ConeGeometry(R * 0.22, R * P.ear * 0.7, 16), C.earIn, ep, 0, R * P.ear * 0.4, R * 0.09, 1, 1, 0.35);
  }
  // scale to the requested standing height, feet on y = 0
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(body, true);
  body.position.y = -bb.min.y;
  root.scale.setScalar(o.height / (bb.max.y - bb.min.y));
  return root;
}

const FAMILY = [
  {
    name: 'Bandit', height: 1.8, adult: true, x: -5.0, z: 12.0, face: 0.59, where: 'Garden',
    arms: [[0.2, 0], [2.6, 0]], tilt: 0.06,
    colors: { main: '#3f5e9f', light: '#a3bce0', dark: '#22355f', leg: '#3f5e9f', arm: '#3f5e9f', paw: '#d9a96c', ear: '#22355f', earIn: '#d9a96c', tailTip: '#22355f', brow: '#d9a96c' }
  },
  {
    name: 'Chilli', height: 1.6, adult: true, x: -5.3, z: 0.6, face: Math.PI / 2, where: 'Kitchen', floor: F,
    arms: [[0.15, 0], [0.25, -0.9]], tilt: -0.08,
    colors: { main: '#e3a064', light: '#f8e4bd', dark: '#b8733d', leg: '#e3a064', arm: '#e3a064', paw: '#f8e4bd', ear: '#b8733d', earIn: '#f8e4bd', tailTip: '#b8733d' }
  },
  {
    name: 'Bluey', height: 1.05, adult: false, x: 1.3, z: 0.6, face: 0.6, where: 'Living Room', floor: F + 0.012,
    arms: [[0.75, 0], [0.75, 0]], tilt: 0.12,
    colors: { main: '#5b95db', light: '#b8daf7', dark: '#2d4f8f', leg: '#8bb9ec', arm: '#5b95db', paw: '#b8daf7', ear: '#2d4f8f', earIn: '#e8c48e', tailTip: '#2d4f8f', cheek: '#8bb9ec' }
  },
  {
    name: 'Bingo', height: 0.82, adult: false, x: 7.4, z: 12.6, face: -0.65, where: 'Garden',
    arms: [[0.3, -0.2], [0.3, -0.2]], tilt: -0.12,
    colors: { main: '#f19447', light: '#fde6b8', dark: '#c9652e', leg: '#f19447', arm: '#f19447', paw: '#fde6b8', ear: '#c9652e', earIn: '#fde6b8', tailTip: '#fde6b8' }
  }
];
for (const d of FAMILY) {
  const grp = makeHeeler(d);
  const y = d.floor ?? groundH(d.x, d.z);
  grp.position.set(d.x, y, d.z);
  grp.rotation.y = d.face;
  scene.add(grp);
  solidC(d.x, d.z, Math.max(0.2, d.height * 0.24), y, y + d.height);
  characters.push({ name: d.name, height: d.height, location: d.where, group: grp });
}

// ---------- visitor / controls ----------
const player = { x: 1.0, z: 21.0, foot: 0, yaw: 0, pitch: -4 * DEG, camY: 0 };
player.foot = surfaceAt(player.x, player.z, groundH(player.x, player.z));
player.camY = player.foot + EYE;
let mode = 'walk';
const keys = new Set();
const locEl = document.getElementById('loc');
const nameEl = document.getElementById('name');
const helpEl = document.getElementById('help');
const dotEl = document.getElementById('dot');

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enabled = false;
orbit.enableDamping = false;
orbit.minDistance = 5; orbit.maxDistance = 90;
orbit.maxPolarAngle = 1.48;
orbit.target.set(0, 3, 0);

function applyWalkCamera() {
  camera.position.set(player.x, player.camY, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

renderer.domElement.addEventListener('click', () => {
  if (mode === 'walk' && document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock?.();
});
document.addEventListener('mousemove', e => {
  if (mode !== 'walk' || document.pointerLockElement !== renderer.domElement) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-85 * DEG, Math.min(85 * DEG, player.pitch));
});
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys.add(e.code); return; }
  keys.add(e.code);
  if (e.code === 'KeyH') helpEl.classList.toggle('hidden');
  if (e.code === 'KeyO') toggleMode();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

function toggleMode() {
  if (mode === 'walk') {
    mode = 'orbit';
    if (document.pointerLockElement) document.exitPointerLock();
    camera.position.set(30, 24, 36);
    orbit.target.set(0, 3, 0);
    orbit.enabled = true;
    orbit.update();
    dotEl.classList.add('off');
  } else {
    mode = 'walk';
    orbit.enabled = false;
    applyWalkCamera();
    dotEl.classList.remove('off');
  }
}

function bodyOverlap(y0, y1) { return y1 > player.foot + 0.15 && y0 < player.foot + 1.15; }
function moveAxis(dx, dz) {
  let nx = player.x + dx, nz = player.z + dz;
  for (const b of colBoxes) {
    if (!bodyOverlap(b.y0, b.y1)) continue;
    if (nx > b.x0 - PR && nx < b.x1 + PR && nz > b.z0 - PR && nz < b.z1 + PR) {
      if (dx > 0) nx = b.x0 - PR - 1e-4;
      else if (dx < 0) nx = b.x1 + PR + 1e-4;
      if (dz > 0) nz = b.z0 - PR - 1e-4;
      else if (dz < 0) nz = b.z1 + PR + 1e-4;
    }
  }
  player.x = nx; player.z = nz;
}
function pushCircles() {
  for (const c of colCircles) {
    if (!bodyOverlap(c.y0, c.y1)) continue;
    const dx = player.x - c.x, dz = player.z - c.z, d = Math.hypot(dx, dz), min = c.r + PR;
    if (d < min) {
      const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0;
      player.x = c.x + nx * min; player.z = c.z + nz * min;
    }
  }
}

function updateWalk(dt) {
  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) s += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) s -= 1;
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 4 : 2;
  if (f || s) {
    const len = Math.hypot(f, s); f /= len; s /= len;
    const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    // forward = (-sin yaw, -cos yaw), right = (cos yaw, -sin yaw)
    const mx = (-sy * f + cy * s) * speed * dt;
    const mz = (-cy * f - sy * s) * speed * dt;
    const n = Math.max(1, Math.ceil(Math.hypot(mx, mz) / 0.06));
    for (let i = 0; i < n; i++) {
      const ox = player.x, oz = player.z, of = player.foot;
      moveAxis(mx / n, 0);
      moveAxis(0, mz / n);
      pushCircles();
      const sf = surfaceAt(player.x, player.z, player.foot);
      if (sf - player.foot > STEP) { player.x = ox; player.z = oz; player.foot = of; }
      else player.foot = sf;
    }
  } else {
    player.foot = surfaceAt(player.x, player.z, player.foot);
  }
  const target = player.foot + EYE;
  player.camY += (target - player.camY) * Math.min(1, dt * 14);
  if (Math.abs(target - player.camY) > 1.5) player.camY = target;
  applyWalkCamera();
}

const _fw = new THREE.Vector3(), _tc = new THREE.Vector3();
function updateLabels() {
  const loc = locate(player.x, player.z, player.foot);
  if (locEl.textContent !== loc) locEl.textContent = loc;
  let best = null, bestD = 1e9;
  if (mode === 'walk') {
    camera.getWorldDirection(_fw);
    for (const c of characters) {
      if (c.location !== loc) continue;
      const p = c.group.position;
      const hd = Math.hypot(p.x - camera.position.x, p.z - camera.position.z);
      if (hd > 1.5) continue;
      _tc.set(p.x, p.y + c.height * 0.55, p.z).sub(camera.position).normalize();
      if (_tc.dot(_fw) < 0.82) continue;
      if (hd < bestD) { bestD = hd; best = c; }
    }
  }
  if (best) {
    const p = best.group.position;
    _tc.set(p.x, p.y + best.height + 0.08, p.z).project(camera);
    nameEl.textContent = best.name;
    nameEl.style.display = 'block';
    nameEl.style.left = ((_tc.x * 0.5 + 0.5) * innerWidth) + 'px';
    nameEl.style.top = Math.max(30, (-_tc.y * 0.5 + 0.5) * innerHeight) + 'px';
  } else nameEl.style.display = 'none';
}

const r3 = v => Math.round(v * 1000) / 1000;
window.sceneState = () => {
  let yaw, pitch, pos;
  if (mode === 'walk') {
    yaw = player.yaw / DEG; pitch = player.pitch / DEG;
    pos = [player.x, player.camY, player.z];
  } else {
    camera.getWorldDirection(_fw);
    yaw = Math.atan2(-_fw.x, -_fw.z) / DEG; pitch = Math.asin(Math.max(-1, Math.min(1, _fw.y))) / DEG;
    pos = [camera.position.x, camera.position.y, camera.position.z];
  }
  yaw = ((yaw % 360) + 540) % 360 - 180;
  return {
    camera: { mode, position: pos.map(r3), yaw: r3(yaw), pitch: r3(pitch) },
    location: locEl.textContent,
    characters: characters.map(c => ({
      name: c.name,
      position: [c.group.position.x, c.group.position.y, c.group.position.z].map(r3),
      height: c.height,
      location: c.location
    })),
    rooms: ROOMS.map(r => r.name),
    landmarks: LANDMARKS.slice()
  };
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
applyWalkCamera();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta());
  if (mode === 'walk') updateWalk(dt); else orbit.update();
  updateLabels();
  renderer.render(scene, camera);
});
</script>
