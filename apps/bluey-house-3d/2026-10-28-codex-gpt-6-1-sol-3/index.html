if(objects.length<2)continue;
const pieces=objects.map(o=>{let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);return g;});
const merged=mergeGeometries(pieces,false);if(merged){const mesh=new THREE.Mesh(merged,objects[0].material);mesh.castShadow=objects[0].castShadow;mesh.receiveShadow=objects[0].receiveShadow;mesh.userData.characterName=objects[0].userData.characterName;all.push(mesh);for(const o of objects){o.removeFromParent();o.geometry.dispose();}}
for(const g of pieces)g.dispose();
}for(const mesh of all)scene.add(mesh);
}
batchStaticGeometry();
// NAVIGATION
let mode='walk',yaw=0,pitch=.025,walk=new THREE.Vector3(0,0,18),location='Garden',footY=groundHeight(0,18);
const keys=new Set(),clock=new THREE.Clock();
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enabled=false;orbit.target.set(0,2,0);orbit.minDistance=8;orbit.maxDistance=55;orbit.maxPolarAngle=Math.PI*.48;orbit.enableDamping=false;
function floorAt(x,z,previous=footY){
if(Math.abs(x)<=1.3&&z>=7.5&&z<=11.3)return Math.max(groundHeight(x,z),Math.min(F,(10-Math.floor((z-7.5)/.38))*.21));
if(Math.abs(x)<=(z>5?6.35:6)&&z>=-5&&z<=7.5&&previous>=F-.25)return F;
return groundHeight(x,z);
}
function locationAt(x,z,y){return y>F-.25&&y<F+2.95&&x>=-6.4&&x<=6.4&&z>=-5.1&&z<=7.6?(z>5?'Veranda':z<-.5?"Girls’ bedroom":x>.8?'Kitchen':'Living room'):'Garden';}
function updateLocation(){location=locationAt(walk.x,walk.z,footY);document.getElementById('location').textContent=location;}
let eyeY=footY+EYE;
function updateCamera(dt=1){const target=footY+EYE;eyeY+= (target-eyeY)*Math.min(1,dt*18);camera.position.set(walk.x,eyeY,walk.z);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);}
function toggleMode(){keys.clear();if(mode==='walk'){mode='orbit';document.exitPointerLock?.();orbit.enabled=true;camera.position.set(23,17,28);orbit.target.set(0,2,0);orbit.update();}else{mode='walk';orbit.enabled=false;eyeY=footY+EYE;updateCamera();}document.getElementById('mode').textContent=mode==='walk'?'WALK · 01':'ORBIT · 02';document.getElementById('dot').style.display=mode==='walk'?'block':'none';updateHint();}
function updateHint(){document.getElementById('hint').style.display=document.pointerLockElement===renderer.domElement?'none':'block';document.getElementById('hint').textContent=mode==='orbit'?'Drag to explore · O to step back inside':'Click the garden to explore';}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='KeyO')toggleMode();if(e.code==='KeyH'){const el=document.getElementById('help');el.hidden=!el.hidden;}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
renderer.domElement.addEventListener('click',()=>{if(mode==='walk')renderer.domElement.requestPointerLock?.();});
document.addEventListener('pointerlockchange',()=>{keys.clear();updateHint();});
document.addEventListener('mousemove',e=>{if(mode==='walk'&&document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0023;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.0023,-1.42,1.42);}});
// A swept-in-small-steps circular visitor capsule. Resolving the penetration normal
// retains tangential motion, so the camera slides naturally along walls and objects.
function resolve(x,z,y){
for(let pass=0;pass<4;pass++)for(const c of colliders){
if(y>=c.top-.035||y+1.15<=c.bottom+.025)continue;
if(c.type==='circle'){
let dx=x-c.x,dz=z-c.z,dist=Math.hypot(dx,dz),radius=R+c.r;
if(dist<radius){if(dist<.0001){dx=1;dz=0;dist=1;}const push=radius-dist;x+=dx/dist*push;z+=dz/dist*push;}
}else{
const lx=c.x-c.w/2,hx=c.x+c.w/2,lz=c.z-c.d/2,hz=c.z+c.d/2;
const px=THREE.MathUtils.clamp(x,lx,hx),pz=THREE.MathUtils.clamp(z,lz,hz);let dx=x-px,dz=z-pz,dist=Math.hypot(dx,dz);
if(dist>0&&dist<R){x+=dx/dist*(R-dist);z+=dz/dist*(R-dist);}else if(dist===0){const sides=[{v:x-lx+R,x:lx-R,z},{v:hx-x+R,x:hx+R,z},{v:z-lz+R,x,z:lz-R},{v:hz-z+R,x,z:hz+R}];sides.sort((a,b)=>a.v-b.v);x=sides[0].x;z=sides[0].z;}
}}
return {x,z};
}
function move(dt){
if(document.pointerLockElement!==renderer.domElement)return;
const forward=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0),side=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
const len=Math.hypot(forward,side);if(!len)return;
const speed=(keys.has('ShiftLeft')||keys.has('ShiftRight')?4:2)*dt/len;
const dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed,dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed,n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.045));
for(let i=0;i<n;i++){
let nx=walk.x+dx/n,nz=walk.z+dz/n,newY=floorAt(nx,nz);
// Riser height is bounded. Floors can only be reached via the staircase.
if(newY-footY>.235){
const xx=floorAt(nx,walk.z),zz=floorAt(walk.x,nz);
if(xx-footY<=.235){nz=walk.z;newY=xx;}else if(zz-footY<=.235){nx=walk.x;newY=zz;}else continue;
}
// No step off an unguarded high edge: descend by the same staircase.
if(footY-newY>.3){nx=walk.x;nz=walk.z;newY=footY;}
const hit=resolve(nx,nz,newY);const hy=floorAt(hit.x,hit.z);
if(Math.abs(hy-footY)>.3)continue;
walk.set(hit.x,0,hit.z);footY=hy;
}}
const nameEl=document.getElementById('name'),raycaster=new THREE.Raycaster(),look=new THREE.Vector3(),target=new THREE.Vector3(),projected=new THREE.Vector3();
// Walls, furnishings and foliage also occlude a character's label.
function updateName(){
nameEl.style.display='none';if(mode!=='walk')return;camera.getWorldDirection(look);let best=null,bestScore=0;
for(const c of characters){
target.set(c.position[0],c.position[1]+c.height*.66,c.position[2]);
const distance=target.distanceTo(camera.position),groundDistance=Math.hypot(walk.x-c.position[0],walk.z-c.position[2]);
const direction=target.clone().sub(camera.position).normalize(),score=look.dot(direction);
if(groundDistance<=1.5&&Math.abs(footY-c.position[1])<.5&&score>.86&&score>bestScore){best=c;bestScore=score;}
}
if(!best)return;
target.set(best.position[0],best.position[1]+best.height*.67,best.position[2]);
const distance=target.distanceTo(camera.position);raycaster.set(camera.position,target.clone().sub(camera.position).normalize());raycaster.far=distance;
if(raycaster.intersectObjects(scene.children,true).some(hit=>hit.object.userData.characterName!==best.name))return;
projected.set(best.position[0],best.position[1]+best.height+.13,best.position[2]).project(camera);
if(projected.z>1||Math.abs(projected.x)>1||Math.abs(projected.y)>1)return;
nameEl.textContent=best.name;nameEl.style.left=(projected.x*.5+.5)*innerWidth+'px';nameEl.style.top=(-projected.y*.5+.5)*innerHeight+'px';nameEl.style.display='block';
}
window.sceneState=()=>{camera.getWorldDirection(look);return {camera:{mode,position:camera.position.toArray(),yaw:THREE.MathUtils.radToDeg(Math.atan2(-look.x,-look.z)),pitch:THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(look.y,-1,1)))},location,characters:characters.map(c=>({name:c.name,position:[...c.position],height:c.height,location:c.location})),rooms:[...rooms],landmarks:[...landmarks]};};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
updateCamera();updateLocation();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.04);if(mode==='walk'){move(dt);updateCamera(dt);updateLocation();}else{camera.getWorldDirection(look);location=locationAt(camera.position.x,camera.position.z,camera.position.y-EYE);document.getElementById('location').textContent=location;}updateName();renderer.render(scene,camera);});
</script>
