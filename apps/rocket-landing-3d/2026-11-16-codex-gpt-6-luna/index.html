function addStars(){const points=[];for(let i=0;i<260;i++){const a=i*2.399963229728653,r=50000+(i%17)*7000;points.push(Math.cos(a)*r,18000+(i%13)*6000,Math.sin(a)*r)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(points,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:90,transparent:true,opacity:.75})))}
function syncVisuals(){if(!sim.boosterMesh)return;const b=sim.booster,u=sim.upper;const place=(mesh,body,len)=>{mesh.position.set(body.x,body.y,0);mesh.rotation.z=body.angle;mesh.visible=body.alive||sim.flightEnded;};place(sim.boosterMesh,b,45);place(sim.upperMesh,u,18);sim.bargeMesh.position.x=sim.bargeX;sim.bargeMesh.position.z=0;sim.bargeMesh.visible=true;
 const fired=b.enginesLit>0&&b.throttle>0;sim.plume.visible=fired&&b.alive;sim.plume.position.set(b.x-Math.sin(b.angle)*29,b.y-Math.cos(b.angle)*29,0);sim.plume.rotation.z=b.angle;const scale=clamp(b.throttle,0,1);sim.plume.scale.set(1.5+scale*2,18+scale*32,1.5+scale*2);
 for(const id of ['booster','upper']){const arr=trails[id],pts=[];const body=id==='booster'?b:u;for(let i=0;i<arr.length;i+=Math.max(1,Math.floor(arr.length/2500)))pts.push(arr[i][0],arr[i][1],0);if(body.alive&&sim.separated)pts.push(body.x,body.y,0);trailLines[id].geometry.setFromPoints(pts.length?Array.from({length:pts.length/3},(_,i)=>new THREE.Vector3(pts[i*3],pts[i*3+1],pts[i*3+2])):[])}
 sim.smokeGroup.clear();for(const p of sim.smoke){const m=new THREE.Mesh(new THREE.SphereGeometry(90*p.life,8,6),new THREE.MeshBasicMaterial({color:0xd7d4ca,transparent:true,opacity:.17*p.life,depthWrite:false}));m.position.set(p.x,p.y+35*(1-p.life),-8);sim.smokeGroup.add(m)}
}
function updateCamera(){const b=bodyTarget(),follow=camMode==='tracking'?sim.booster:b;let targetX=follow.x,targetY=follow.y+20;if(camMode==='tracking'){const distance=60000;camera.position.set(targetX-distance*.76,targetY+distance*.43,10000);camera.lookAt(targetX,targetY,0)}else if(camMode==='orbit'){camera.position.set(targetX+Math.sin(orbitYaw)*Math.cos(orbitPitch)*orbitDistance,targetY+Math.sin(orbitPitch)*orbitDistance,Math.cos(orbitYaw)*Math.cos(orbitPitch)*orbitDistance);camera.lookAt(targetX,targetY,0)}else{const d=camMode==='upper'?17000:21000;camera.position.set(targetX-10000,targetY+6500,d);camera.lookAt(targetX+1500,targetY+900,0)} }
function updateUI(){if(!sim)return;const b=sim.booster,u=sim.upper,shown=sim.separated&&camMode==='upper'?u:b,q=.5*density(shown.y)*hypot(shown.vx,shown.vy)**2;const accel=shown===b?(b.enginesLit?b.throttle*settings.boosterThrust*b.enginesLit/b.mass:0):u.enginesLit?STAGE2.thrust*u.throttle/u.mass:0;const g=WORLDS[settings.world].g;const vals=[['Mission time',sim.liftoff?`T+ ${sim.t-sim.events.liftoff.t|0} s`:`T− ${Math.max(0,1-sim.t).toFixed(1)} s`],['Altitude',`${(shown.y/1000).toFixed(2)} km`],['Speed',`${hypot(shown.vx,shown.vy).toFixed(0)} m/s`],['Vertical speed',`${shown.vy.toFixed(1)} m/s`],['Downrange',`${(shown.x/1000).toFixed(2)} km`],['Mass',`${(shown.mass/1000).toFixed(1)} t`],['Propellant',`${(shown.prop/1000).toFixed(1)} t`],['Engines / throttle',`${shown.enginesLit} / ${(shown.throttle*100).toFixed(0)}%`],['Dynamic pressure',`${(q/1000).toFixed(2)} kPa`],['Acceleration',`${(accel/g).toFixed(2)} g`]];$('telemetry').innerHTML=vals.map(([k,v])=>`<span class="label">${k}</span><span class="value">${v}</span>`).join('');$('phase').textContent=sim.phase.toUpperCase();$('dvIdeal').textContent=`${idealDV().toFixed(0)} m/s`;$('dvIntegrated').textContent=`${sim.dvIntegral.toFixed(0)} m/s`;if(sim.lastFlight){$('result').innerHTML=`<div class="outcome">${({landed:'LANDED',crashed:'CRASHED',noLiftoff:'NO LIFTOFF',vehicleLost:'VEHICLE LOST'})[sim.lastFlight.outcome]}</div><div>Touchdown V ${sim.lastFlight.touchdownVerticalSpeed.toFixed(1)} m/s · H ${sim.lastFlight.touchdownHorizontalSpeed.toFixed(1)} m/s</div><div>Deck offset ${sim.lastFlight.bargeOffset.toFixed(1)} m · propellant ${(sim.lastFlight.propellantAtTouchdown/1000).toFixed(1)} t</div>`}else if(sim.t===0)$('result').textContent='Awaiting ignition';$('worldBadge').textContent=`${settings.world.toUpperCase()} · ${sim.flightEnded?'FLIGHT COMPLETE':paused?'PAUSED':'LIVE SIMULATION'}`}
const EVENT_LABELS={liftoff:'Liftoff',maxQ:'Max Q',meco:'MECO',separation:'Stage separation',stage2Ignition:'Stage 2 ignition',boostbackStart:'Boostback start',boostbackEnd:'Boostback end',boosterApogee:'Booster apogee',entryBurnStart:'Entry burn start',entryBurnEnd:'Entry burn end',landingBurnStart:'Landing burn start',touchdown:'Touchdown / crash',seco:'SECO'};
function renderEvents(){const rows=Object.entries(sim.events).filter(([,v])=>v).map(([k,v])=>`<div class="event"><span>${EVENT_LABELS[k]}</span><span>T+${v.t.toFixed(1)} s</span></div>`);$('eventList').innerHTML=rows.length?rows.reverse().join(''):'No events yet';$('eventCount').textContent=rows.length}
function clearEventView(){$('eventList').textContent='No events yet';$('eventCount').textContent='0'}
function animate(now){requestAnimationFrame(animate);if(!lastFrame)lastFrame=now;const elapsed=Math.min(.1,(now-lastFrame)/1000);lastFrame=now;if(!paused&&sim&&!sim.flightEnded){accumulator+=elapsed*speedScale;let steps=0;while(accumulator>=DT&&steps<MAX_STEPS){physics(DT);accumulator-=DT;steps++}if(steps>=MAX_STEPS)accumulator=0}syncVisuals();updateCamera();renderer.render(scene,camera)}
window.rocketState=()=>{const body=x=>({x:x.x,altitude:x.y,vx:x.vx,vy:x.vy,mass:x.mass,propellant:x.prop,enginesLit:x.enginesLit,throttle:x.throttle});return{t:sim.t,phase:sim.phase,booster:body(sim.booster),upperStage:body(sim.upper),barge:{x:sim.bargeX},deltaV:{stage1Ideal:idealDV(),stage1Integrated:sim.dvIntegral},events:JSON.parse(JSON.stringify(sim.events)),lastFlight:sim.lastFlight?{...sim.lastFlight}:null,settings:{payload:settings.payload,boosterThrust:settings.boosterThrust,reserve:settings.reserve,pitchRate:settings.pitchRate,drag:settings.drag,world:settings.world}}};
function launchClick(){launch()}
function settingsChanged(){const vals=[['payload','payloadOut',v=>`${v} t`],['thrust','thrustOut',v=>`${v} kN`],['reserve','reserveOut',v=>`${v} t`],['pitch','pitchOut',v=>`${(+v).toFixed(1)} °/s`]];for(const [id,out,fmt]of vals)$(out).textContent=fmt($(id).value);$('worldBadge').textContent=$('world').value.toUpperCase()+' · READY';reset();if(renderer)syncVisuals()}
function setup(){buildWorld();reset();for(const id of ['payload','thrust','reserve','pitch','drag','world'])$(id).addEventListener('input',settingsChanged);$('world').addEventListener('change',settingsChanged);$('launch').addEventListener('click',launchClick);$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'Play · Space':'Pause · Space';updateUI()});document.querySelectorAll('[data-speed]').forEach(el=>el.addEventListener('click',()=>{speedScale=+el.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===el))}));$('camera').addEventListener('change',()=>{camMode=$('camera').value});addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.code==='Space'){e.preventDefault();$('pause').click()}if(e.key.toLowerCase()==='l')launch()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('pointerdown',e=>{dragPointer={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>dragPointer=null);addEventListener('pointermove',e=>{if(dragPointer&&camMode==='orbit'){orbitYaw+=(e.clientX-dragPointer.x)*.006;orbitPitch=clamp(orbitPitch+(e.clientY-dragPointer.y)*.006,-1.2,1.2);dragPointer={x:e.clientX,y:e.clientY}}});requestAnimationFrame(animate);}
setup();
</script>
