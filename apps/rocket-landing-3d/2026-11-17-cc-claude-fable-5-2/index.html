<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root { --panel: rgba(9, 13, 20, .74); --line: rgba(255, 255, 255, .09); --txt: #e8edf3; --dim: #8b97a8; --acc: #ffb454; --ok: #5fe0a0; --bad: #ff6b5e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05080d; color: var(--txt);
  font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
#left { position: fixed; top: 12px; left: 12px; width: 262px; max-height: calc(100% - 96px); display: flex; flex-direction: column; gap: 10px; }
#brand { font-weight: 650; font-size: 15px; letter-spacing: .04em; margin: 0; padding: 2px 4px; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
#right { position: fixed; top: 12px; right: 12px; bottom: 84px; width: 292px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
#right > * { pointer-events: auto; }
details.panel { padding: 0; overflow: hidden; display: flex; flex-direction: column; min-height: 34px; }
details > summary { cursor: pointer; list-style: none; padding: 8px 12px; font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); user-select: none; display: flex; justify-content: space-between; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; color: var(--dim); }
details[open] > summary::after { content: "–"; }
details[open] > summary { border-bottom: 1px solid var(--line); }
.body { padding: 10px 12px 12px; overflow-y: auto; }
#settings { min-height: 34px; }
.ctl { margin-bottom: 10px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); margin-bottom: 3px; }
.ctl output { color: var(--txt); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; margin: 0; accent-color: var(--acc); height: 18px; }
select { width: 100%; background: #121924; color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: inherit; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--acc); }
#worldInfo, .hint { color: var(--dim); font-size: 11.5px; margin-top: 4px; }
#tele .body { padding: 8px 12px 10px; }
#clock { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
#tClock { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
#tPhase { color: var(--acc); font-weight: 600; text-align: right; }
#tFollow { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 1.5px 0; font-variant-numeric: tabular-nums; }
td:first-child { color: var(--dim); }
td:last-child { text-align: right; white-space: nowrap; }
td small { color: var(--dim); margin-left: 3px; }
tr.sep td { padding-top: 6px; }
#log { flex: 1 1 auto; min-height: 34px; }
#log .body { padding: 6px 12px 10px; }
#logList { list-style: none; margin: 0; padding: 0; }
#logList li { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px dashed rgba(255, 255, 255, .05); }
#logList li span:first-child { color: var(--acc); font-variant-numeric: tabular-nums; flex: 0 0 62px; }
#logList li small { color: var(--dim); display: block; }
#result { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 10px 18px 12px; text-align: center; min-width: 250px; display: none; }
#result.show { display: block; }
#result h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: .03em; }
#result.landed h2 { color: var(--ok); } #result.bad h2 { color: var(--bad); }
#result table { width: auto; margin: 0 auto; } #result td { padding: 1px 8px; }
#bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px 14px;
  align-items: center; justify-content: center; padding: 8px 12px; max-width: calc(100% - 24px); }
.grp { display: flex; gap: 4px; align-items: center; }
.grp > span { color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
button { font: inherit; color: var(--txt); background: #18202c; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; min-height: 32px; }
button:hover { background: #222c3b; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
button.on { background: var(--acc); color: #1a1205; border-color: transparent; font-weight: 600; }
#launch { background: #d9482b; border-color: transparent; font-weight: 650; padding: 6px 16px; }
#launch:hover { background: #ef5a3b; }
#launch.wait { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(239, 90, 59, .28); } }
#notice { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); color: var(--dim); display: none; text-align: center; padding: 12px 16px; }
@media (max-width: 820px) {
  #left { width: 200px; } #right { width: 208px; } body { font-size: 12px; } #tClock { font-size: 19px; }
}
@media (max-width: 1000px) { #result { top: auto; bottom: 112px; } }
@media (max-width: 560px) {
  #left { width: 150px; } #left:has(details[open]) { width: 236px; z-index: 5; } #right { width: 188px; top: 8px; right: 8px; } #left { top: 8px; left: 8px; }
  .grp > span { display: none; } button { padding: 6px 8px; }
}
@media (prefers-reduced-motion: reduce) { #launch.wait { animation: none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="notice" class="panel"></div>
<div id="left">
  <h1 id="brand">Claude Fable 5.2</h1>
  <details id="settings" class="panel" open>
    <summary>Settings</summary>
    <div class="body">
      <div class="ctl"><label for="payload">Payload mass <output id="payloadOut"></output></label>
        <input type="range" id="payload" min="0" max="30" step="0.5" value="10"></div>
      <div class="ctl"><label for="thrust">Booster engine thrust <output id="thrustOut"></output></label>
        <input type="range" id="thrust" min="400" max="1000" step="10" value="900"></div>
      <div class="ctl"><label for="reserve">Landing reserve <output id="reserveOut"></output></label>
        <input type="range" id="reserve" min="20" max="80" step="1" value="50"></div>
      <div class="ctl"><label for="pitchRate">Pitch rate <output id="pitchRateOut"></output></label>
        <input type="range" id="pitchRate" min="0.2" max="1" step="0.05" value="0.6"></div>
      <div class="ctl row"><label for="drag" style="margin:0">Air drag</label><input type="checkbox" id="drag" checked></div>
      <div class="ctl" style="margin-bottom:0"><label for="world">World</label>
        <select id="world"><option value="earth" selected>Earth</option><option value="mars">Mars</option><option value="moon">Moon</option></select>
        <div id="worldInfo"></div></div>
      <div class="hint" id="bargeInfo"></div>
    </div>
  </details>
</div>
<div id="right">
  <details id="tele" class="panel" open>
    <summary>Telemetry</summary>
    <div class="body">
      <div id="clock"><span id="tClock">T−1.0</span><span id="tPhase"></span></div>
      <div id="tFollow"></div>
      <table><tbody id="teleRows"></tbody></table>
    </div>
  </details>
  <details id="log" class="panel" open>
    <summary>Event log</summary>
    <div class="body"><ul id="logList"></ul></div>
  </details>
</div>
<div id="result" class="panel" role="status" aria-live="polite"><h2 id="resTitle"></h2><table><tbody id="resRows"></tbody></table></div>
<div id="bar" class="panel">
  <div class="grp"><button id="launch" title="Launch (L)">Launch</button><button id="pause" title="Pause / Play (Space)">Pause</button></div>
  <div class="grp" id="speeds"><span>Speed</span>
    <button data-speed="0.25">0.25×</button><button data-speed="1" class="on">1×</button><button data-speed="4">4×</button><button data-speed="16">16×</button></div>
  <div class="grp" id="cams"><span>Camera</span>
    <button data-cam="booster" class="on">Booster</button><button data-cam="upper">Upper stage</button><button data-cam="tracking">Tracking</button><button data-cam="orbit">Orbit</button></div>
</div>
<script>
//<SIM>
'use strict';
const G0 = 9.80665, DT = 0.01, SPS = 100;
const WORLDS = {
  earth: { name: 'Earth', g: 9.81, rho0: 1.225, H: 8500 },
  mars:  { name: 'Mars',  g: 3.71, rho0: 0.020, H: 11100 },
  moon:  { name: 'Moon',  g: 1.62, rho0: 0,     H: 1 }
};
const VEH = { dry1: 25000, prop1: 300000, isp1: 300, dry2: 5000, prop2: 90000, thrust2: 1e6, isp2: 345, cd: 0.5, area: 10.75 };
const DEFAULTS = { payload: 10, thrust: 900, reserve: 50, pitchRate: 0.6, drag: true, world: 'earth' };
const EVENT_KEYS = ['liftoff', 'maxQ', 'meco', 'separation', 'stage2Ignition', 'boostbackStart', 'boostbackEnd',
  'boosterApogee', 'entryBurnStart', 'entryBurnEnd', 'landingBurnStart', 'touchdown', 'seco'];
const EVENT_LABELS = { liftoff: 'Liftoff', maxQ: 'Max Q', meco: 'MECO', separation: 'Stage separation',
  stage2Ignition: 'Stage 2 ignition', boostbackStart: 'Boostback burn start', boostbackEnd: 'Boostback burn end',
  boosterApogee: 'Booster apogee', entryBurnStart: 'Entry burn start', entryBurnEnd: 'Entry burn end',
  landingBurnStart: 'Landing burn start', touchdown: 'Touchdown', seco: 'SECO' };
const ENTRY_ALT = 60000, ENTRY_SPEED = 500, VTD = 0.9, IGN_THROTTLE = 0.8, DECK_HALF = 45;

// One deterministic flight. S: settings (t, kN, t, deg/s). bargeX: deck center (m), or null for a look-ahead run.
function makeSim(S, bargeX) {
  const W = WORLDS[S.world], g = W.g;
  const T1 = S.thrust * 1000, mdot1 = T1 / (VEH.isp1 * G0);
  const T2 = VEH.thrust2, mdot2 = T2 / (VEH.isp2 * G0);
  const reserve = S.reserve * 1000, payload = S.payload * 1000;
  const rate = S.pitchRate * Math.PI / 180, maxPitch = Math.PI / 3;
  const kD = S.drag ? 0.5 * VEH.cd * VEH.area : 0;
  const rho = y => W.rho0 > 0 ? W.rho0 * Math.exp(-Math.max(y, 0) / W.H) : 0;

  const B = { x: 0, y: 0, vx: 0, vy: 0, prop: VEH.prop1, engines: 0, throttle: 0, att: 0, q: 0, felt: g / G0,
    phase: 'ready', fins: false, legs: false, done: false };
  const U = { x: 0, y: 0, vx: 0, vy: 0, prop: VEH.prop2, engines: 0, throttle: 0, att: 0, q: 0, felt: g / G0,
    phase: 'attached', done: false };
  const events = {}; EVENT_KEYS.forEach(k => events[k] = null);
  const mB = () => VEH.dry1 + B.prop, mU = () => VEH.dry2 + payload + U.prop;
  const m0 = mB() + mU();
  const sim = { n: 0, t: -1, armed: false, ended: false, separated: false, B, U, events, log: [], logVer: 0,
    dvInt: 0, lnSep: 0, mBsep: 0, sepAtt: 0, tLift: null, twr: null, outcome: null, result: null,
    trailB: [], trailU: [], bargeX, world: W, m0, mB, mU, step, dvIdeal, rho };
  let qPeak = null, yPrev = 0;

  function dvIdeal() {
    if (!sim.separated) return VEH.isp1 * G0 * Math.log(m0 / (mB() + mU()));
    return VEH.isp1 * G0 * (sim.lnSep + Math.log(sim.mBsep / mB()));
  }
  function record(t, b, prop) {
    return { t: +t.toFixed(2), x: b.x, altitude: b.y, speed: Math.hypot(b.vx, b.vy), propellant: prop };
  }
  function ev(key, t, b, prop, label) {
    events[key] = record(t, b, prop);
    sim.log.push({ key, label: label || EVENT_LABELS[key], t: events[key].t }); sim.logVer++;
    return events[key];
  }
  function note(t, label) { sim.log.push({ key: null, label, t: +t.toFixed(2) }); sim.logVer++; }

  // Advance one body by DT: thrust (N) along (dx,dy) during fraction f of the step, drag, gravity.
  function advance(b, m, thrust, dx, dy, mdot, f) {
    const mm = m - mdot * f * DT * 0.5;
    const r = rho(b.y), v = Math.hypot(b.vx, b.vy), D = kD * r * v * v;
    let fx = thrust * f * dx, fy = thrust * f * dy;
    if (v > 1e-9) { fx -= D * b.vx / v; fy -= D * b.vy / v; }
    b.vx += fx / mm * DT; b.vy += (fy / mm - g) * DT;
    b.x += b.vx * DT; b.y += b.vy * DT;
    const v2 = b.vx * b.vx + b.vy * b.vy;
    b.q = 0.5 * rho(b.y) * v2; b.felt = Math.hypot(fx, fy) / mm / G0;
    return thrust * f / mm * DT;
  }
  // Visual attitude only (angle from vertical, positive downrange); never feeds back into forces.
  function turn(b, target, rateRad) {
    let d = target - b.att;
    while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    const lim = rateRad * DT;
    b.att += Math.max(-lim, Math.min(lim, d));
  }
  const pitchAt = t => Math.max(0, Math.min(maxPitch, (t - sim.tLift - 10) * rate));

  function finish(outcome, res) {
    sim.outcome = outcome;
    sim.result = Object.assign({ outcome, liftoffThrustToWeight: sim.twr, touchdownVerticalSpeed: null,
      touchdownHorizontalSpeed: null, bargeOffset: null, propellantAtTouchdown: null }, res || {});
  }

  function stepStack(t0, t1) {
    if (B.phase !== 'ignition' && B.phase !== 'ascent' && B.phase !== 'meco-coast') {
      B.phase = 'ignition'; B.engines = 9; B.throttle = 1; note(t0, 'Ignition');
    }
    const m = mB() + mU();
    const thrust = B.engines * T1 * B.throttle, mdot = B.engines * mdot1 * B.throttle;
    if (B.phase === 'ignition') {
      sim.twr = thrust / (m * g);
      if (thrust > m * g) {
        B.phase = 'ascent'; sim.tLift = t0; ev('liftoff', t0, B, B.prop);
        qPeak = Object.assign(record(t0, B, B.prop), { q: 0 });
      } else {
        // held down: engines burn, the pad carries the rest of the weight
        const dm = mdot * DT; sim.dvInt += thrust / (m - dm * 0.5) * DT; B.prop -= dm; B.felt = g / G0;
        sim.twr = thrust / ((mB() + mU()) * g);
        if (sim.n >= 6 * SPS) {
          B.engines = 0; B.throttle = 0; B.phase = 'no-liftoff'; B.done = U.done = true;
          note(t1, 'Engine shutdown — no liftoff'); finish('noLiftoff');
        }
        return;
      }
    }
    if (B.phase === 'ascent') {
      const p = pitchAt(t0); B.att = U.att = p;
      const dmFull = mdot * DT; let f = 1, meco = false;
      if (B.prop - dmFull <= reserve) { f = Math.max(0, (B.prop - reserve) / dmFull); meco = true; }
      sim.dvInt += advance(B, m, thrust, Math.sin(p), Math.cos(p), mdot, f);
      B.prop = meco ? reserve : B.prop - dmFull;
      if (B.q > qPeak.q) {
        qPeak = Object.assign(record(t1, B, B.prop), { q: B.q });
        if (events.maxQ) { events.maxQ = qPeak; const l = sim.log.find(e => e.key === 'maxQ'); if (l) l.t = qPeak.t; sim.logVer++; }
      } else if (!events.maxQ && qPeak.q > 0 && B.q < 0.9 * qPeak.q) declareMaxQ();
      if (meco) {
        B.engines = 0; B.throttle = 0; B.phase = 'meco-coast'; sim.nMeco = sim.n;
        if (!events.maxQ) declareMaxQ();
        ev('meco', t1, B, B.prop);
      }
    } else {
      advance(B, m, 0, 0, 1, 0, 0);
      if (sim.n - sim.nMeco >= 2 * SPS) {
        sim.separated = true; sim.nSep = sim.n; sim.sepAtt = B.att;
        sim.lnSep = Math.log(m0 / (mB() + mU())); sim.mBsep = mB();
        B.phase = 'flip'; U.phase = 'coast';
        ev('separation', t1, B, B.prop);
      }
    }
    U.x = B.x; U.y = B.y; U.vx = B.vx; U.vy = B.vy; U.q = B.q; U.felt = B.felt; U.att = B.att;
    if (B.y <= 0 && B.vy < 0) {
      B.y = U.y = 0; B.engines = 0; B.throttle = 0; B.phase = 'vehicle-lost'; U.phase = 'lost'; B.done = U.done = true;
      sim.impactSpeed = Math.hypot(B.vx, B.vy);
      note(t1, 'Vehicle lost — ground impact'); finish('vehicleLost');
    }
  }
  function declareMaxQ() {
    events.maxQ = qPeak; sim.log.push({ key: 'maxQ', label: EVENT_LABELS.maxQ, t: qPeak.t }); sim.logVer++;
  }

  // Altitude the booster would lose braking from its current state to VTD with one engine at throttle u.
  function stopDrop(u) {
    let y = B.y, vy = B.vy, vx = B.vx, prop = B.prop;
    const h = 0.02, T = T1 * u, md = mdot1 * u, y0 = y;
    for (let i = 0; i < 20000 && vy < -VTD && prop > 0; i++) {
      const dm = md * h, mm = VEH.dry1 + prop - dm * 0.5;
      const v = Math.hypot(vx, vy), D = kD * rho(y) * v * v;
      vy += ((T - D * vy / v) / mm - g) * h; vx += (-D * vx / v / mm) * h;
      y += vy * h; prop -= dm;
    }
    return y0 - y;
  }
  function landingGuidance(t1) {
    B.fins = true;
    if (B.prop <= 0 || B.vy >= -VTD) return;
    const m = mB(), aLo = IGN_THROTTLE * T1 / m - g;
    if (aLo > 0 && B.y > B.vy * B.vy / (2 * aLo) + 50) return;
    if (B.y + B.vy * DT <= stopDrop(IGN_THROTTLE)) {
      B.phase = 'landing-burn'; B.engines = 1; B.throttle = IGN_THROTTLE;
      if (!events.landingBurnStart) ev('landingBurnStart', t1, B, B.prop); else note(t1, 'Landing engine relight');
    }
  }

  function stepBooster(t0, t1) {
    const m = mB();
    yPrev = B.y;
    switch (B.phase) {
      case 'flip': {
        advance(B, m, 0, 0, 1, 0, 0); turn(B, -Math.PI / 2, 0.3);
        if (sim.n - sim.nSep >= 10 * SPS) {
          if (B.prop > 0) { B.phase = 'boostback'; B.engines = 3; B.throttle = 1; ev('boostbackStart', t1, B, B.prop); }
          else B.phase = 'coast';
        }
        break;
      }
      case 'boostback': {
        const thrust = 3 * T1, mdot = 3 * mdot1, dmFull = mdot * DT;
        let f = Math.min(1, B.prop / dmFull), end = false;
        // engine cut-off instant inside the step, where the horizontal velocity reaches zero
        const v = Math.hypot(B.vx, B.vy), Dx = kD * rho(B.y) * v * B.vx;
        const fz = (B.vx * m / DT - Dx) / (thrust + B.vx * mdot * 0.5);
        if (fz <= f) { f = Math.max(0, fz); end = true; }
        sim.dvInt += advance(B, m, thrust, -1, 0, mdot, f);
        B.prop -= dmFull * f; if (B.prop < 1e-6) { B.prop = 0; end = true; }
        turn(B, -Math.PI / 2, 0.3);
        if (end) { B.engines = 0; B.throttle = 0; B.phase = 'coast'; ev('boostbackEnd', t1, B, B.prop); }
        break;
      }
      case 'coast': {
        advance(B, m, 0, 0, 1, 0, 0);
        turn(B, B.vy >= 0 ? Math.atan2(B.vx, B.vy) : Math.atan2(-B.vx, -B.vy), 0.3);
        if (yPrev > ENTRY_ALT && B.y <= ENTRY_ALT) {
          B.fins = true;
          if (Math.hypot(B.vx, B.vy) > ENTRY_SPEED && B.prop > 0) {
            B.phase = 'entry-burn'; B.engines = 3; B.throttle = 1; ev('entryBurnStart', t1, B, B.prop);
          } else {
            ev('entryBurnStart', t1, B, B.prop, 'Entry burn skipped (already below 500 m/s)');
            events.entryBurnEnd = record(t1, B, B.prop); B.phase = 'descent';
          }
        } else if (B.vy < 0 && B.y < ENTRY_ALT) landingGuidance(t1);
        break;
      }
      case 'entry-burn': {
        const thrust = 3 * T1, mdot = 3 * mdot1, dmFull = mdot * DT, f = Math.min(1, B.prop / dmFull);
        sim.dvInt += advance(B, m, thrust, 0, 1, mdot, f);
        B.prop -= dmFull * f; if (B.prop < 1e-6) B.prop = 0;
        turn(B, 0, 0.3);
        if (Math.hypot(B.vx, B.vy) <= ENTRY_SPEED || B.prop === 0) {
          B.engines = 0; B.throttle = 0; B.phase = 'descent'; ev('entryBurnEnd', t1, B, B.prop);
        }
        break;
      }
      case 'descent': {
        advance(B, m, 0, 0, 1, 0, 0);
        turn(B, B.vy >= 0 ? Math.atan2(B.vx, B.vy) : Math.atan2(-B.vx, -B.vy), 0.3);
        if (B.vy < 0) landingGuidance(t1);
        break;
      }
      case 'landing-burn': {
        // closed-loop hoverslam: constant deceleration that reaches VTD exactly at the deck
        const v = Math.hypot(B.vx, B.vy), D = kD * rho(B.y) * v * v;
        const aReq = (B.vy * B.vy - VTD * VTD) / (2 * Math.max(B.y, 0.01));
        const dragUp = v > 1e-9 ? -D * B.vy / v : 0;
        B.throttle = Math.max(0.4, Math.min(1, (m * (aReq + g) - dragUp) / T1));
        const thrust = T1 * B.throttle, mdot = mdot1 * B.throttle, dmFull = mdot * DT, f = Math.min(1, B.prop / dmFull);
        sim.dvInt += advance(B, m, thrust, 0, 1, mdot, f);
        B.prop -= dmFull * f; if (B.prop < 1e-6) B.prop = 0;
        turn(B, 0, 0.3);
        if (B.y < 220) B.legs = true;

    if (o === 'vehicleLost') {
      explode(B.x, 0, 0, 1.5, false); fx.hideBooster = fx.hideUpper = true; scorch.position.set(B.x, 0.06, 0); scorch.visible = B.x < coastX(0) - 45;
    } else if (o === 'crashed') {
      const sp = sim.impactSpeed || 0;
      if (!sim.onDeck) { explode(B.x, -3, -3, Math.min(1.6, 0.7 + sp / 150), true); fx.hideBooster = true; }
      else if (sp > 14) { explode(B.x, 0, 0, Math.min(1.6, 0.8 + sp / 150), false); fx.hideBooster = true; scorch.position.set(B.x, 0.06, 0); scorch.visible = true; }
      else fx.tip = { t: 0, dir: (B.x - sim.bargeX) >= 0 ? 1 : -1, boom: false };
    }
  }
  if (fx.tip) {
    const tp = fx.tip; tp.t += dtSim; tp.ang = Math.min(Math.PI / 2, 0.05 * tp.t + 0.42 * tp.t * tp.t);
    if (tp.ang >= Math.PI / 2 && !tp.boom) {
      tp.boom = true; explode(B.x + tp.dir * 20, 1, 0, 0.8, false);
      boosterG.traverse(o => { if (o.isMesh) o.material = charMat; });
      scorch.position.set(B.x + tp.dir * 20, 0.06, 0); scorch.visible = true;
    }
  }

  // --- place the stages ---
  const attB = fx.tip ? fx.tip.dir * fx.tip.ang : B.att;
  boosterG.visible = !fx.hideBooster;
  boosterG.position.set(B.x, B.y + (fx.tip ? 1.85 * Math.sin(fx.tip.ang) : 0), 0); boosterG.rotation.z = -attB;
  const offA = sim.separated ? sim.sepAtt : B.att;
  const s2x = U.x + Math.sin(offA) * 45, s2y = U.y + Math.cos(offA) * 45;
  stage2G.visible = !fx.hideUpper && U.phase !== 'impact';
  stage2G.position.set(s2x, s2y, 0); stage2G.rotation.z = -U.att;

  legT += ((B.legs ? 1 : 0) - legT > 0 ? 1 : 0) * Math.min(1 - legT, dtSim / 2.6);
  finT += ((B.fins ? 1 : 0) - finT > 0 ? 1 : 0) * Math.min(1 - finT, dtSim / 1.5);
  if (B.phase === 'landed') legT = 1;
  const le = legT * legT * (3 - 2 * legT);
  for (const l of legs) l.rotation.z = -LEG_DEPLOY * le;
  for (const f of fins) f.rotation.z = Math.PI / 2 * finT;

  // --- plumes follow the thrust ---
  const nB = B.engines, airB = airAt(B.y);
  setPlume(plumeB, nB, B.throttle, airB, clock, nB >= 9 ? 1.9 : nB >= 3 ? 1.25 : 0.6, nB >= 9 ? 62 : nB >= 3 ? 42 : 30, 600);
  setPlume(plumeU, U.engines, U.throttle, airAt(U.y), clock, 1.15, 34, 600);

  // --- smoke ---
  if (dtSim > 0 && nB > 0 && !B.done) {
    const power = nB * B.throttle / 9;
    const overDeck = Math.abs(B.x - sim.bargeX) < 45, overLand = B.x < coastX(0) - 45, floor = overDeck || overLand ? 0 : -3;
    if (B.y < 320) {
      emitGround += dtSim * (12 + 30 * power) * (1 - B.y / 340);
      let k = 0;
      while (emitGround >= 1 && k++ < 8) { emitGround -= 1; const a = rnd() * 6.283, sp = (18 + rnd() * 42) * (0.35 + power) * (1 - B.y / 400);
        puff(B.x + Math.cos(a) * 3, floor + 1.5, Math.sin(a) * 3, Math.cos(a) * sp, 1 + rnd() * 7, Math.sin(a) * sp, 5 + rnd() * 5, 5, 26 + rnd() * 30 * (0.4 + power),
          floor < 0 ? 0xe9f0f3 : 0xd6d0c6, 0.5, false, 0.55, 1.2); }
      if (emitGround > 8) emitGround = 0;
    } else if (airB > 0.06 && !sim.separated) {
      emitTrail += dtSim * 14;
      let k = 0;
      while (emitTrail >= 1 && k++ < 4) { emitTrail -= 1; const sa = Math.sin(B.att), ca = Math.cos(B.att);
        puff(B.x - sa * 45 + (rnd() - 0.5) * 4, B.y - ca * 45, (rnd() - 0.5) * 4, -sa * 15, -ca * 15, 0, 5 + rnd() * 3, 8, 30 + rnd() * 18, 0xe4e0da, 0.34 * airB + 0.05, false, 0.8, 0); }
      if (emitTrail > 4) emitTrail = 0;
    }
  }
  updatePuffs(dtSim); updateDebris(dtSim, W.g);

  // --- trails ---
  updateTrail(trailB, sim.trailB, B.x, B.y, sim.tLift !== null && !B.done);
  updateTrail(trailU, sim.trailU, U.x, U.y, sim.separated && !U.done);

  // --- camera ---
  const upper = APP.follow === 'upper';
  if (upper) focus.set(s2x + Math.sin(U.att) * 12, s2y + Math.cos(U.att) * 12, 0);
  else if (B.done && sim.result && sim.result.outcome !== 'landed' && sim.result.outcome !== 'noLiftoff') focus.set(B.x, 8, 0);
  else { const h = sim.separated ? 22 : 36; focus.set(B.x + Math.sin(B.att) * h, B.y + Math.cos(B.att) * h, 0); }
  const wantBase = sim.separated ? 120 : 165;
  cam.base += (wantBase - cam.base) * Math.min(1, dtReal * 1.5);
  if (APP.camera === 'tracking') {
    camera.position.copy(TRACK_POS);
    const d = camera.position.distanceTo(focus);
    camera.fov = Math.max(0.22, Math.min(42, 2 * Math.atan(64 * cam.trackZoom / d) * 180 / Math.PI));
  } else {
    const orbit = APP.camera === 'orbit', az = orbit ? cam.az : -0.38, el = orbit ? cam.el : 0.15, d = cam.base * cam.zoom;
    camera.position.set(focus.x + d * Math.cos(el) * Math.sin(az), focus.y + d * Math.sin(el), focus.z + d * Math.cos(el) * Math.cos(az));
    const floor = (camera.position.x < coastX(camera.position.z) - 45 ? 0 : -3) + 1.5;
    if (camera.position.y < floor) camera.position.y = floor;
    camera.fov = 40;
  }
  camera.up.set(0, 1, 0); camera.lookAt(focus); camera.updateProjectionMatrix();

  // --- sky, light, sea follow the camera ---
  const space = W.rho0 > 0 ? 1 - Math.exp(-Math.max(camera.position.y, 0) / (W.H * 2.4)) : 1;
  skyMat.uniforms.uSpace.value = space;
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  starMat.opacity = space * space;
  hemi.intensity = SKIES[skyWorld].hemi * (1 - 0.8 * space);
  sea.position.x = Math.round(camera.position.x / TILE) * TILE; sea.position.z = Math.round(camera.position.z / TILE) * TILE;
  tmp.copy(focus); if (APP.camera === 'tracking' && !sim.separated) tmp.set(B.x, B.y + 36, 0);
  sun.target.position.copy(tmp); sun.position.copy(tmp).addScaledVector(SUN, 420);

  renderer.render(scene, camera);
};
</script>
