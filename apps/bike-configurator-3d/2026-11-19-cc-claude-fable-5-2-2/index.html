<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 24px;
}
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: var(--space-4);
  padding-right: var(--space-4);
}
header.wrap { padding-top: var(--space-5); padding-bottom: var(--space-4); }
header h1 { margin: 0; font-size: var(--text-xl); line-height: 36px; font-weight: 700; letter-spacing: -0.01em; }
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-6);
  align-items: start;
  padding-bottom: 96px;
}
.configurator { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.panel {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.panel h2 { margin: 0 0 var(--space-4); font-size: var(--text-lg); line-height: 28px; font-weight: 600; }
.summary { position: static; min-width: 0; }
@media (min-width: 1024px) {
  .wrap { padding-left: var(--space-5); padding-right: var(--space-5); }
  main { grid-template-columns: minmax(0, 1fr) 360px; }
  .summary { position: sticky; top: 24px; }
}

/* fields */
.field-label { display: block; font-size: var(--text-sm); line-height: 20px; font-weight: 600; margin-bottom: var(--space-1); }
.text-input {
  height: 40px;
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background-color: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  min-width: 0;
}
.text-input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.text-input.has-error { border-color: var(--color-danger); }
#height-input { width: 160px; max-width: 100%; display: block; }
.field-error { color: var(--color-danger); font-size: var(--text-sm); line-height: 20px; margin-top: var(--space-2); }
.recommendation { margin-top: var(--space-2); font-size: var(--text-sm); line-height: 20px; font-weight: 600; color: var(--color-accent); }
.frame-warning {
  margin-top: var(--space-4);
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-danger);
}

/* cards */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards-drivetrain { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) {
  .cards-frame, .cards-color { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cards-drivetrain { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 16px;
  cursor: pointer;
  min-width: 0;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.card input {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.card:not(.is-selected):not(.is-disabled):hover { border-color: var(--color-muted); }
.card.is-selected { border: 2px solid var(--color-accent); padding: 15px; }
.card.is-disabled { opacity: 0.45; cursor: not-allowed; }
.card:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.card [data-role="name"] { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--color-text); padding-right: 14px; overflow-wrap: break-word; }
.card [data-role="price"] { font-size: 14px; line-height: 20px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.card .card-note { font-size: 14px; line-height: 20px; color: var(--color-muted); }
.card [data-role="reason"] { font-size: 14px; line-height: 20px; color: var(--color-text); visibility: hidden; }
.card.is-disabled [data-role="reason"] { visibility: visible; }
.card [data-role="check"] {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card [data-role="check"] svg { width: 12px; height: 12px; display: block; }
.card [data-role="badge"] {
  position: absolute;
  top: -1px;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  border-radius: var(--radius-pill);
  font-size: 14px;
  line-height: 20px;
  font-weight: 600;
  padding: 2px 8px;
  white-space: nowrap;
}
.card.is-selected [data-role="badge"] { top: -2px; }
.card [data-role="swatch"] {
  display: block;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  margin-bottom: var(--space-1);
  flex: none;
}
@media (max-width: 1023.98px) {
  [data-testid="card-color-red"] [data-role="price"] { min-height: 40px; }
}

/* buttons */
button { font: inherit; transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast); }
button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.btn-secondary {
  background-color: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text);
  height: 40px;
  border-radius: var(--radius-control);
  padding: 0 var(--space-4);
  cursor: pointer;
  white-space: nowrap;
}
.btn-secondary:not(:disabled):hover { border-color: var(--color-muted); }
.btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-square { width: 40px; padding: 0; font-size: 20px; line-height: 1; }
.btn-primary {
  display: block;
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: var(--radius-control);
  font-size: 16px;
  font-weight: 600;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  cursor: pointer;
  padding: 0 var(--space-4);
}
.btn-primary:disabled { background-color: var(--color-disabled-bg); color: var(--color-muted); cursor: not-allowed; }

/* quantity */
.stepper { display: flex; align-items: center; gap: var(--space-3); }
.qty-value { min-width: 40px; text-align: center; font-size: var(--text-lg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* summary */
#bike-preview {
  display: block;
  width: 100%;
  height: 260px;
  border: 0;
  padding: 0;
  background-color: #EDEDF2;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
#bike-preview:active { cursor: grabbing; }
#bike-preview:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.lines { margin-top: var(--space-4); }
.line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  font-size: var(--text-sm);
  line-height: 20px;
  padding: var(--space-1) 0;
}
.line [data-role="label"] { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--color-muted); }
.line [data-role="value"] { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.line.sep { margin-top: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
.line.discount [data-role="value"] { color: var(--color-accent); }
.line.total {
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
  line-height: 36px;
}
.line.total [data-role="label"], .line.total [data-role="value"] { font-size: 28px; font-weight: 700; color: var(--color-text); }
.promo { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-border); }
.promo-row { display: flex; gap: var(--space-2); }
.promo-row .text-input { flex: 1 1 auto; width: 0; }
.promo-status { margin-top: var(--space-2); font-size: var(--text-sm); line-height: 20px; color: var(--color-muted); }
.promo-status.is-active { color: var(--color-accent); }
#promo-remove { margin-top: var(--space-2); }
.order { margin-top: var(--space-5); }
.order-hint { margin-top: var(--space-2); font-size: var(--text-sm); line-height: 20px; color: var(--color-muted); text-align: center; }

/* notice */
.notice-region {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  display: flex;
  justify-content: center;
  padding: 0 var(--space-4);
  pointer-events: none;
  z-index: 10;
}
.notice {
  max-width: 480px;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-accent);
  padding: 12px 16px;
  border-radius: var(--radius-control);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
  pointer-events: auto;
}

/* confirmation */
.confirmation-wrap { padding-bottom: 96px; }
.confirmation h2 { outline: none; }
.confirmation dl { margin: 0 0 var(--space-5); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-2) var(--space-5); }
.confirmation dt { color: var(--color-muted); }
.confirmation dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }
}
</style>
</head>
<body>
<header class="wrap" data-testid="app-header"><h1>Claude Fable 5.2</h1></header>

<main class="wrap" id="main">
  <div class="configurator" data-testid="configurator" id="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <label class="field-label" for="height-input">Your height (cm)</label>
      <input class="text-input" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off">
      <div class="field-error" id="height-error" data-testid="height-error" hidden></div>
      <div class="recommendation" data-testid="height-recommendation" hidden></div>
    </section>
    <section class="panel" data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="cards cards-frame" id="cards-frame"></div>
      <div class="frame-warning" data-testid="frame-warning" hidden></div>
    </section>
    <section class="panel" data-testid="section-wheels">
      <h2>3. Wheels</h2>
      <div class="cards cards-wheels" id="cards-wheels"></div>
    </section>
    <section class="panel" data-testid="section-drivetrain">
      <h2>4. Drivetrain</h2>
      <div class="cards cards-drivetrain" id="cards-drivetrain"></div>
    </section>
    <section class="panel" data-testid="section-color">
      <h2>5. Color</h2>
      <div class="cards cards-color" id="cards-color"></div>
    </section>
    <section class="panel" data-testid="section-accessories">
      <h2>6. Accessories</h2>
      <div class="cards cards-accessory" id="cards-accessory"></div>
    </section>
    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="stepper">
        <button type="button" class="btn-secondary btn-square" data-testid="qty-decrease" id="qty-decrease" aria-label="Decrease quantity">−</button>
        <span class="qty-value" data-testid="qty-value" id="qty-value">1</span>
        <button type="button" class="btn-secondary btn-square" data-testid="qty-increase" id="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>

  <aside class="panel summary" data-testid="summary" id="summary">
    <canvas id="bike-preview" data-testid="bike-preview" tabindex="0" role="img" aria-label="Bike preview" width="310" height="260"></canvas>
    <div class="lines" id="lines"></div>
    <div class="promo">
      <label class="field-label" for="promo-input">Promo code</label>
      <div class="promo-row">
        <input class="text-input" id="promo-input" data-testid="promo-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn-secondary" data-testid="promo-apply" id="promo-apply" disabled>Apply</button>
      </div>
      <div class="field-error" id="promo-error" data-testid="promo-error" hidden></div>
      <div class="promo-status" data-testid="promo-status" id="promo-status" hidden></div>
      <button type="button" class="btn-secondary" data-testid="promo-remove" id="promo-remove" hidden>Remove code</button>
    </div>
    <div class="order">
      <button type="button" class="btn-primary" data-testid="order-button" id="order-button" disabled>Order 1 bike</button>
      <div class="order-hint" data-testid="order-hint" id="order-hint"></div>
    </div>
  </aside>
</main>

<div class="wrap confirmation-wrap" id="confirmation-wrap" hidden>
  <section class="panel confirmation" data-testid="confirmation" id="confirmation" hidden>
    <h2 data-testid="confirmation-title" id="confirmation-title" tabindex="-1">Order confirmed</h2>
    <dl>
      <dt>Reference</dt><dd data-testid="confirmation-reference" id="confirmation-reference"></dd>
      <dt>Total</dt><dd data-testid="confirmation-total" id="confirmation-total"></dd>
      <dt>Estimated delivery</dt><dd data-testid="confirmation-delivery" id="confirmation-delivery"></dd>
    </dl>
    <button type="button" class="btn-secondary" data-testid="confirmation-new" id="confirmation-new">Configure another bike</button>
  </section>
</div>

<div class="notice-region" role="status"><div class="notice" data-testid="notice" id="notice" hidden></div></div>

<script>
(function () {
  'use strict';

  /* ---------- catalog ---------- */
  var FRAMES = [
    { id: 'S', name: 'Frame S', price: 119000, min: 150, max: 164, L: 430 },
    { id: 'M', name: 'Frame M', price: 119000, min: 165, max: 174, L: 470 },
    { id: 'L', name: 'Frame L', price: 124000, min: 175, max: 184, L: 510 },
    { id: 'XL', name: 'Frame XL', price: 129000, min: 185, max: 200, L: 550 }
  ];
  var WHEELS = [
    { id: '275', name: '27.5" wheels', price: 0, R: 350 },
    { id: '29', name: '29" wheels', price: 12000, R: 375 }
  ];
  var DRIVES = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  var COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0 }
  ];
  var ACCS = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  var PROMOS = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = { '2026-12-24': 1, '2026-12-25': 1, '2026-12-31': 1, '2027-01-01': 1 };
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DASH = '—', MINUS = '−';

  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  /* ---------- formats ---------- */
  function fmt(c) {
    var e = Math.floor(c / 100), ct = c % 100;
    return '€' + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (ct < 10 ? '0' : '') + ct;
  }
  function signed(c) { return c === 0 ? 'Included' : '+' + fmt(c); }
  function discount(c) { return MINUS + fmt(c); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(d) { return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

  /* ---------- state ---------- */
  var orderSeq = 0;
  var st;
  function freshState() {
    return { heightRaw: '', heightValid: false, height: 0, auto: true, frame: null, wheels: '275',
      drivetrain: 'essential', color: 'graphite', acc: {}, qty: 1, promo: null, promoError: false, notice: null };
  }
  st = freshState();
  var view = { yaw: 0, pitch: 10 };

  /* ---------- build cards ---------- */
  var CHECK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg>';
  function buildCards(group, list, type) {
    var html = '';
    list.forEach(function (o) {
      html += '<label class="card" data-testid="card-' + group + '-' + o.id + '">' +
        '<input type="' + type + '" name="' + group + '" value="' + o.id + '" aria-label="' + esc(o.name) + '">' +
        (group === 'color' ? '<span data-role="swatch" style="background-color:' + o.hex + '"></span>' : '') +
        '<span data-role="name">' + esc(o.name) + '</span>' +
        (group === 'frame' ? '<span class="card-note">' + o.min + '–' + o.max + ' cm</span>' : '') +
        '<span data-role="price"></span>' +
        (group === 'wheels' && o.id === '29' ? '<span data-role="reason">Not available with frame S</span>' : '') +
        (group === 'color' && o.id === 'glacier' ? '<span data-role="reason">Out of stock</span>' : '') +
        '<span data-role="check" hidden>' + CHECK_SVG + '</span>' +
        (group === 'frame' ? '<span data-role="badge" hidden>Recommended</span>' : '') +
        '</label>';
    });
    $('cards-' + group).innerHTML = html;
  }
  buildCards('frame', FRAMES, 'radio');
  buildCards('wheels', WHEELS, 'radio');
  buildCards('drivetrain', DRIVES, 'radio');
  buildCards('color', COLORS, 'radio');
  buildCards('accessory', ACCS, 'checkbox');

  function card(group, id) { return document.querySelector('[data-testid="card-' + group + '-' + id + '"]'); }

  /* ---------- summary lines ---------- */
  var LINE_KEYS = ['frame', 'wheels', 'drivetrain', 'color'].concat(ACCS.map(function (a) { return 'accessory-' + a.id; }),
    ['unit', 'quantity', 'subtotal', 'qty-discount', 'promo', 'shipping', 'total', 'vat', 'delivery']);
  var lineEls = {};
  (function () {
    var box = $('lines');
    LINE_KEYS.forEach(function (k) {
      var row = document.createElement('div');
      row.className = 'line' + (k === 'total' ? ' total' : '') + (k === 'unit' ? ' sep' : '') +
        (k === 'qty-discount' || k === 'promo' ? ' discount' : '');
      row.setAttribute('data-testid', 'summary-line-' + k);
      var l = document.createElement('span'); l.setAttribute('data-role', 'label');
      var v = document.createElement('span'); v.setAttribute('data-role', 'value');
      row.appendChild(l); row.appendChild(v);
      box.appendChild(row);
      lineEls[k] = { row: row, label: l, value: v };
    });
  })();
  function setLine(key, label, value, show) {
    var e = lineEls[key];
    if (e.label.textContent !== label) e.label.textContent = label;
    if (e.value.textContent !== value) e.value.textContent = value;
    e.row.hidden = !show;
  }

  /* ---------- rules ---------- */
  function recommended() {
    if (!st.heightValid) return null;
    for (var i = 0; i < FRAMES.length; i++) if (st.height >= FRAMES[i].min && st.height <= FRAMES[i].max) return FRAMES[i].id;
    return null;
  }
  function frameIndex(id) { for (var i = 0; i < FRAMES.length; i++) if (FRAMES[i].id === id) return i; return -1; }
  function colorSurcharge() { return (st.color === 'red' && st.drivetrain === 'pro') ? 0 : byId(COLORS, st.color).price; }

  function setFrame(id) {
    st.frame = id;
    if (id === 'S' && st.wheels === '29') {
      st.wheels = '275';

      var dx = x - ex, dy = y - ey, dz = z - ez;
      var zz = dx * c.fx + dy * c.fy + dz * c.fz;
      if (zz - r < 1) { bb[0] = -1e9; bb[1] = -1e9; bb[2] = 1e9; bb[3] = 1e9; return; }
      var px = PW / 2 + F * (dx * c.rx + dy * c.ry + dz * c.rz) / zz;
      var py = PH / 2 - F * (dx * c.ux + dy * c.uy + dz * c.uz) / zz;
      var rad = r > 0 ? F * r / (zz - r) * 1.3 + 2 : 2;
      if (px - rad < bb[0]) bb[0] = px - rad;
      if (py - rad < bb[1]) bb[1] = py - rad;
      if (px + rad > bb[2]) bb[2] = px + rad;
      if (py + rad > bb[3]) bb[3] = py + rad;
    }

    for (var n = 0; n < prims.length; n++) {
      var p = prims[n], bb = [1e9, 1e9, -1e9, -1e9];
      if (p.t === 0) {
        proj(p.ax, p.ay, p.az, p.r, bb); proj(p.qx, p.qy, p.qz, p.r, bb);
      } else {
        for (var q = 0; q < 8; q++) proj(q & 1 ? p.mx[0] : p.mn[0], q & 2 ? p.mx[1] : p.mn[1], q & 4 ? p.mx[2] : p.mn[2], 0, bb);
      }
      var i0 = Math.max(0, Math.floor(bb[0] * sx)), i1 = Math.min(cw - 1, Math.ceil(bb[2] * sx));
      var j0 = Math.max(0, Math.floor(bb[1] * sy)), j1 = Math.min(ch - 1, Math.ceil(bb[3] * sy));
      for (var j = j0; j <= j1; j++) {
        var b = ((j + 0.5) / sy - PH / 2) / F;
        var bx = c.fx - b * c.ux, by = c.fy - b * c.uy, bz = c.fz - b * c.uz;
        for (var i = i0; i <= i1; i++) {
          var a = ((i + 0.5) / sx - PW / 2) / F;
          var dx = bx + a * c.rx, dy = by + a * c.ry, dz = bz + a * c.rz;
          var l = Math.sqrt(dx * dx + dy * dy + dz * dz); dx /= l; dy /= l; dz /= l;
          var t = hit(p, ex, ey, ez, dx, dy, dz);
          var k = j * cw + i;
          if (t > 0 && t < zbuf[k]) { zbuf[k] = t; ibuf[k] = n; }
        }
      }
    }

    /* light fixed to the camera: from the upper right, towards the model */
    var lx = -0.72 * c.fx + 0.55 * c.ux + 0.42 * c.rx, ly = -0.72 * c.fy + 0.55 * c.uy + 0.42 * c.ry, lz = -0.72 * c.fz + 0.55 * c.uz + 0.42 * c.rz;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz); lx /= ll; ly /= ll; lz /= ll;
    var data = img.data;
    for (var jj = 0; jj < ch; jj++) {
      var b2 = ((jj + 0.5) / sy - PH / 2) / F;
      for (var ii = 0; ii < cw; ii++) {
        var kk = jj * cw + ii, o = kk * 4, pi = ibuf[kk];
        if (pi < 0) {
          data[o] = BG[0]; data[o + 1] = BG[1]; data[o + 2] = BG[2]; data[o + 3] = 255;
          continue;
        }
        var pr = prims[pi], tt = zbuf[kk];
        var a2 = ((ii + 0.5) / sx - PW / 2) / F;
        var rdx = c.fx + a2 * c.rx - b2 * c.ux, rdy = c.fy + a2 * c.ry - b2 * c.uy, rdz = c.fz + a2 * c.rz - b2 * c.uz;
        var rl = Math.sqrt(rdx * rdx + rdy * rdy + rdz * rdz);
        var hx = ex + tt * rdx / rl, hy = ey + tt * rdy / rl, hz = ez + tt * rdz / rl;
        var nx, ny, nz;
        if (pr.t === 0) {
          var h = ((hx - pr.ax) * pr.bx + (hy - pr.ay) * pr.by + (hz - pr.az) * pr.bz) / pr.baba;
          if (h < 0) h = 0; else if (h > 1) h = 1;
          nx = (hx - pr.ax - h * pr.bx) / pr.r; ny = (hy - pr.ay - h * pr.by) / pr.r; nz = (hz - pr.az - h * pr.bz) / pr.r;
        } else {
          nx = 0; ny = 0; nz = 0;
          var e = 1e-3;
          if (Math.abs(hx - pr.mn[0]) < e) nx = -1; else if (Math.abs(hx - pr.mx[0]) < e) nx = 1;
          else if (Math.abs(hy - pr.mn[1]) < e) ny = -1; else if (Math.abs(hy - pr.mx[1]) < e) ny = 1;
          else if (Math.abs(hz - pr.mn[2]) < e) nz = -1; else nz = 1;
        }
        var dot = nx * lx + ny * ly + nz * lz;
        if (dot < 0) dot = 0; else if (dot > 1) dot = 1;
        var s = 0.5 + 0.5 * dot;
        data[o] = Math.round(pr.col[0] * s); data[o + 1] = Math.round(pr.col[1] * s); data[o + 2] = Math.round(pr.col[2] * s); data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function syncCanvasSize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return false;
    var dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    var cw = Math.max(1, Math.round(w * dpr)), ch = Math.max(1, Math.round(h * dpr));
    if (w === PW && h === PH && canvas.width === cw && canvas.height === ch) return false;
    PW = w; PH = h;
    canvas.width = cw; canvas.height = ch;
    return true;
  }

  function setView(yaw, pitch) {
    yaw = yaw % 360; if (yaw < 0) yaw += 360; if (yaw >= 360) yaw = 0;
    if (pitch < -20) pitch = -20; if (pitch > 60) pitch = 60;
    view.yaw = yaw; view.pitch = pitch;
    drawPreview();
  }

  var dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    if (!(e.buttons & 1)) { dragging = false; return; }
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (dx || dy) setView(view.yaw + 0.9 * dx, view.pitch + 0.5 * dy);
    e.preventDefault();
  });
  function endDrag(e) {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', function () { dragging = false; });
  canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('selectstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('keydown', function (e) {
    switch (e.key) {
      case 'ArrowRight': e.preventDefault(); setView(view.yaw + 15, view.pitch); break;
      case 'ArrowLeft': e.preventDefault(); setView(view.yaw - 15, view.pitch); break;
      case 'ArrowUp': e.preventDefault(); setView(view.yaw, view.pitch + 5); break;
      case 'ArrowDown': e.preventDefault(); setView(view.yaw, view.pitch - 5); break;
      case 'Home': e.preventDefault(); setView(0, 10); break;
    }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (syncCanvasSize()) drawPreview(); }).observe(canvas);
  }
  window.addEventListener('resize', function () { if (syncCanvasSize()) drawPreview(); });

  /* ---------- start ---------- */
  heightInput.value = '';
  promoInput.value = '';
  syncCanvasSize();
  render();
})();
</script>
</body>
</html>
