<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--text-md);
  line-height: 24px;
}
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: var(--space-4);
  padding-right: var(--space-4);
}
header.wrap { padding-top: var(--space-5); padding-bottom: var(--space-5); }
header h1 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-6);
  padding-bottom: 48px;
}
.configurator { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.panel {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.panel h2 {
  margin: 0 0 var(--space-4);
  font-size: var(--text-lg);
  line-height: 28px;
  font-weight: 600;
}
.summary { position: static; min-width: 0; }
@media (min-width: 1024px) {
  .wrap { padding-left: var(--space-5); padding-right: var(--space-5); }
  main { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  .summary { position: sticky; top: 24px; }
}

/* fields */
.field-label { display: block; font-weight: 600; margin-bottom: var(--space-2); }
.text-input {
  height: 40px;
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background-color: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  min-width: 0;
}
.text-input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
#height-input { width: 160px; max-width: 100%; }
#height-input.invalid { border-color: var(--color-danger); }
.field-error { color: var(--color-danger); font-size: var(--text-sm); line-height: 20px; margin: var(--space-2) 0 0; }
.field-info { color: var(--color-muted); font-size: var(--text-sm); line-height: 20px; margin: var(--space-2) 0 0; }
#height-recommendation { color: var(--color-accent); font-weight: 600; }
#frame-warning { color: var(--color-danger); margin-top: var(--space-3); }

/* card grids */
.grid { display: grid; gap: var(--space-3); }
.grid-frame { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-wheels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-drivetrain { grid-template-columns: repeat(1, minmax(0, 1fr)); }
.grid-color { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-accessory { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1024px) {
  .grid-frame { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-drivetrain { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-color { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* option cards */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 16px;
  cursor: pointer;
  color: var(--color-text);
  min-width: 0;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.card:hover:not(.selected):not(.disabled) { border-color: var(--color-muted); }
.card.selected { border: 2px solid var(--color-accent); padding: 15px; }
.card.disabled { opacity: 0.45; cursor: not-allowed; }
.card:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.card input {
  position: absolute;
  left: 8px;
  top: 8px;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.card [data-role="name"] { font-size: var(--text-md); font-weight: 600; color: var(--color-text); padding-right: 28px; overflow-wrap: anywhere; }
.card [data-role="price"] { font-size: var(--text-sm); line-height: 20px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.card .hint { font-size: var(--text-sm); line-height: 20px; color: var(--color-muted); }
.card [data-role="reason"] { font-size: var(--text-sm); line-height: 20px; font-weight: 600; visibility: hidden; }
.card.disabled [data-role="reason"] { visibility: visible; }
.card [data-role="check"] {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
  font-weight: 700;
}
.card.selected [data-role="check"] { top: 11px; right: 11px; }
.card [data-role="badge"] {
  position: absolute;
  top: -1px;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  line-height: 20px;
  font-weight: 600;
  padding: 2px 8px;
  white-space: nowrap;
}
.card.selected [data-role="badge"] { top: -2px; }
.card [data-role="swatch"] {
  display: block;
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  margin-bottom: var(--space-1);
}

/* buttons */
button {
  font: inherit;
  cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.btn-secondary {
  background-color: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text);
  height: 40px;
  padding: 0 var(--space-4);
  border-radius: var(--radius-control);
  white-space: nowrap;
}
.btn-secondary:hover:not(:disabled) { border-color: var(--color-muted); }
.btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-qty { width: 40px; padding: 0; font-size: var(--text-lg); line-height: 1; }
.btn-primary {
  display: block;
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: var(--radius-control);
  font-size: var(--text-md);
  font-weight: 600;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  margin-top: var(--space-4);
}
.btn-primary:disabled { background-color: var(--color-disabled-bg); color: var(--color-muted); cursor: not-allowed; }

.stepper { display: flex; align-items: center; gap: var(--space-3); }
#qty-value { min-width: 32px; text-align: center; font-size: var(--text-lg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* summary */
#bike-preview {
  display: block;
  width: 100%;
  height: 260px;
  border: 0;
  padding: 0;
  margin: 0 0 var(--space-4);
  background-color: #EDEDF2;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
#bike-preview:active { cursor: grabbing; }
#bike-preview:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.line { display: flex; align-items: baseline; gap: var(--space-3); padding: 2px 0; font-size: var(--text-sm); line-height: 22px; }
.line [data-role="label"] { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line [data-role="value"] { flex: none; margin-left: auto; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.line.muted [data-role="label"] { color: var(--color-muted); }
.line.sep { border-top: 1px solid var(--color-border); margin-top: var(--space-2); padding-top: var(--space-2); }
.line.discount [data-role="value"] { color: var(--color-accent); }
.line.total { border-top: 1px solid var(--color-border); margin-top: var(--space-2); padding-top: var(--space-2); }
.line.total [data-role="label"], .line.total [data-role="value"] { font-size: var(--text-xl); line-height: 36px; font-weight: 700; }
.promo { border-top: 1px solid var(--color-border); margin-top: var(--space-3); padding-top: var(--space-3); }
.promo .field-label { font-size: var(--text-sm); margin-bottom: var(--space-1); }
.promo-row { display: flex; gap: var(--space-2); }
.promo-row .text-input { flex: 1 1 auto; width: 0; }
.promo-applied { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); margin-top: var(--space-2); }
#promo-status { font-size: var(--text-sm); line-height: 20px; margin: 0; color: var(--color-muted); }
#promo-status.active { color: var(--color-accent); }
#order-hint { text-align: center; }

/* notice */
#notice {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: min(480px, calc(100vw - 32px));
  background-color: var(--color-surface);
  color: var(--color-text);
  border: 0 solid var(--color-accent);
  border-left: 4px solid var(--color-accent);
  padding: 12px 16px;
  border-radius: var(--radius-control);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
  z-index: 10;
}

/* confirmation */
.confirm-wrap { padding-bottom: 48px; }
#confirmation h2:focus { outline: none; }
#confirmation h2:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.confirm-list { margin: 0 0 var(--space-5); display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-2) var(--space-5); }
.confirm-list dt { color: var(--color-muted); }
.confirm-list dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}
</style>
</head>
<body>
<header class="wrap" data-testid="app-header"><h1>Claude Fable 5.2</h1></header>

<main class="wrap" id="main">
  <div class="configurator" data-testid="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <label class="field-label" for="height-input">Your height (cm)</label>
      <input class="text-input" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off">
      <p class="field-error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
      <p class="field-info" id="height-recommendation" data-testid="height-recommendation" hidden></p>
    </section>
    <section class="panel" data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="grid grid-frame" id="grid-frame"></div>
      <p class="field-error" id="frame-warning" data-testid="frame-warning" hidden></p>
    </section>
    <section class="panel" data-testid="section-wheels">
      <h2>3. Wheels</h2>
      <div class="grid grid-wheels" id="grid-wheels"></div>
    </section>
    <section class="panel" data-testid="section-drivetrain">
      <h2>4. Drivetrain</h2>
      <div class="grid grid-drivetrain" id="grid-drivetrain"></div>
    </section>
    <section class="panel" data-testid="section-color">
      <h2>5. Color</h2>
      <div class="grid grid-color" id="grid-color"></div>
    </section>
    <section class="panel" data-testid="section-accessories">
      <h2>6. Accessories</h2>
      <div class="grid grid-accessory" id="grid-accessory"></div>
    </section>
    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="stepper">
        <button type="button" class="btn-secondary btn-qty" id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">&#x2212;</button>
        <span id="qty-value" data-testid="qty-value">1</span>
        <button type="button" class="btn-secondary btn-qty" id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>

  <aside class="panel summary" data-testid="summary" aria-label="Summary">
    <canvas id="bike-preview" data-testid="bike-preview" tabindex="0" role="img" aria-label="Bike preview" width="310" height="260"></canvas>
    <div id="lines"></div>
    <div class="promo">
      <label class="field-label" for="promo-input">Promo code</label>
      <div class="promo-row">
        <input class="text-input" id="promo-input" data-testid="promo-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn-secondary" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <p class="field-error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
      <div class="promo-applied" id="promo-applied" hidden>
        <p id="promo-status" data-testid="promo-status"></p>
        <button type="button" class="btn-secondary" id="promo-remove" data-testid="promo-remove">Remove code</button>
      </div>
    </div>
    <button type="button" class="btn-primary" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
    <p class="field-info" id="order-hint" data-testid="order-hint">Enter your height to continue.</p>
  </aside>
</main>

<div class="wrap confirm-wrap" id="confirm-wrap" hidden>
  <section class="panel" id="confirmation" data-testid="confirmation" hidden>
    <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
    <dl class="confirm-list">
      <dt>Reference</dt><dd data-testid="confirmation-reference" id="confirmation-reference"></dd>
      <dt>Total</dt><dd data-testid="confirmation-total" id="confirmation-total"></dd>
      <dt>Estimated delivery</dt><dd data-testid="confirmation-delivery" id="confirmation-delivery"></dd>
    </dl>
    <button type="button" class="btn-secondary" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
  </section>
</div>

<div role="status" id="status-region"><div id="notice" data-testid="notice" hidden></div></div>

<script>
(function () {
  'use strict';

  /* ---------- catalog ---------- */
  var FRAMES = [
    { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000 },
    { id: 'M', name: 'Frame M', min: 165, max: 174, price: 119000 },
    { id: 'L', name: 'Frame L', min: 175, max: 184, price: 124000 },
    { id: 'XL', name: 'Frame XL', min: 185, max: 200, price: 129000 }
  ];
  var WHEELS = [
    { id: '275', name: '27.5" wheels', price: 0 },
    { id: '29', name: '29" wheels', price: 12000, reason: 'Not available with frame S' }
  ];
  var DRIVETRAINS = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  var COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0, reason: 'Out of stock' }
  ];
  var ACCESSORIES = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  var GROUPS = { frame: FRAMES, wheels: WHEELS, drivetrain: DRIVETRAINS, color: COLORS, accessory: ACCESSORIES };
  var CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = { '2026-12-24': 1, '2026-12-25': 1, '2026-12-31': 1, '2027-01-01': 1 };
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MINUS = '−', DASH = '—';
  var MSG7 = '29" wheels were replaced by 27.5" wheels: not available with frame S.';
  var MSG8 = 'Mudguards were added: required by the rear rack.';
  var MSG9 = 'Rear rack was removed: it requires mudguards.';

  function find(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function $(id) { return document.getElementById(id); }

  /* ---------- state ---------- */
  var st;
  var orderSeq = 0;
  function freshState() {
    return {
      heightRaw: '', frame: null, auto: true, wheels: '275', drivetrain: 'essential', color: 'graphite',
      acc: { mudguards: false, rack: false, lights: false, kickstand: false },
      qty: 1, code: null, promoError: false, notice: null
    };
  }
  st = freshState();

  /* ---------- formats ---------- */
  function money(c) {
    var e = Math.floor(c / 100), ct = c % 100;
    return '€' + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (ct < 10 ? '0' : '') + ct;
  }
  function signed(c) { return c === 0 ? 'Included' : '+' + money(c); }
  function discount(c) { return MINUS + money(c); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(d) {
    return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- rules ---------- */
  function validHeight() {
    var t = st.heightRaw.trim();
    if (!/^[0-9]+$/.test(t)) return null;
    var n = Number(t);
    return n >= 150 && n <= 200 ? n : null;
  }
  function recommended(h) {
    for (var i = 0; i < FRAMES.length; i++) if (h >= FRAMES[i].min && h <= FRAMES[i].max) return FRAMES[i].id;
    return null;
  }
  function colorSurcharge() {
    if (st.color === 'red' && st.drivetrain === 'pro') return 0;
    return find(COLORS, st.color).price;
  }
  function compute() {
    var p = { hasFrame: !!st.frame };
    var unit = (st.frame ? find(FRAMES, st.frame).price : 0) + find(WHEELS, st.wheels).price +
      find(DRIVETRAINS, st.drivetrain).price + colorSurcharge();
    ACCESSORIES.forEach(function (a) { if (st.acc[a.id]) unit += a.price; });
    p.unit = unit;
    p.subtotal = unit * st.qty;
    p.qtyDiscount = st.qty >= 3 ? Math.floor((p.subtotal * 5 + 50) / 100) : 0;
    p.after = p.subtotal - p.qtyDiscount;
    p.active = false;
    if (st.code === 'FREESHIP') p.active = true;
    else if (st.code === 'SPRING10') p.active = p.hasFrame && p.after >= 150000;
    else if (st.code === 'WELCOME50') p.active = st.qty < 3;
    p.promo = 0;
    if (p.active && st.code === 'SPRING10') p.promo = Math.floor((p.after * 10 + 50) / 100);
    if (p.active && st.code === 'WELCOME50') p.promo = 5000;
    p.merch = p.after - p.promo;
    p.shipping = (st.code === 'FREESHIP' || p.merch >= 200000) ? 0 : 4900;
    p.total = p.merch + p.shipping;
    p.vat = Math.floor((p.total * 20 + 60) / 120);
    return p;
  }
  function deliveryDate() {
    var lead = find(DRIVETRAINS, st.drivetrain).lead + (st.color === 'red' ? 3 : 0) + (st.qty >= 3 ? 2 : 0);
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var n = 0;
    while (n < lead) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      var wd = d.getDay();
      var key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      if (wd !== 0 && wd !== 6 && !CLOSED[key]) n++;
    }
    return d;
  }

  /* ---------- build cards ---------- */
  var cards = {};
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function buildCards() {
    Object.keys(GROUPS).forEach(function (group) {
      var grid = $('grid-' + group);
      GROUPS[group].forEach(function (o) {
        var card = el('label', { 'class': 'card', 'data-testid': 'card-' + group + '-' + o.id });

        for (i = 0; i < 8; i++) ext(bb, (i & 1) ? p.mx[0] : p.mn[0], (i & 2) ? p.mx[1] : p.mn[1], (i & 4) ? p.mx[2] : p.mn[2], 0);
      }
      var x0 = Math.max(0, Math.floor(bb[0])), y0 = Math.max(0, Math.floor(bb[1]));
      var x1 = Math.min(W - 1, Math.ceil(bb[2])), y1 = Math.min(H - 1, Math.ceil(bb[3]));
      for (j = y0; j <= y1; j++) {
        var b = (j + 0.5 - H / 2) / F;
        for (i = x0; i <= x1; i++) {
          var a = (i + 0.5 - W / 2) / F;
          var dx = c.fx + a * c.rx - b * c.ux, dy = c.fy + a * c.ry - b * c.uy, dz = c.fz + a * c.rz - b * c.uz;
          var l = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var t = hit(p, c.ex, c.ey, c.ez, dx / l, dy / l, dz / l);
          var idx = j * W + i;
          if (t < zb[idx]) { zb[idx] = t; ids[idx] = k; }
        }
      }
    }
    // light fixed to the camera: towards the viewer, from the upper right
    var lx = -0.75 * c.fx + 0.55 * c.ux + 0.35 * c.rx, ly = -0.75 * c.fy + 0.55 * c.uy + 0.35 * c.ry, lz = -0.75 * c.fz + 0.55 * c.uz + 0.35 * c.rz;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    lx /= ll; ly /= ll; lz /= ll;
    var img = ctx.createImageData(W, H), data = img.data;
    for (j = 0; j < H; j++) {
      var b2 = (j + 0.5 - H / 2) / F;
      for (i = 0; i < W; i++) {
        var id = j * W + i, o = id * 4, pk = ids[id];
        if (pk < 0) {
          data[o] = 0xED; data[o + 1] = 0xED; data[o + 2] = 0xF2; data[o + 3] = 255;
          continue;
        }
        var a2 = (i + 0.5 - W / 2) / F;
        var ex = c.fx + a2 * c.rx - b2 * c.ux, ey = c.fy + a2 * c.ry - b2 * c.uy, ez = c.fz + a2 * c.rz - b2 * c.uz;
        var el2 = Math.sqrt(ex * ex + ey * ey + ez * ez), tt = zb[id] / el2;
        var pr2 = prims[pk];
        var n = normalAt(pr2, c.ex + ex * tt, c.ey + ey * tt, c.ez + ez * tt);
        var dot = n[0] * lx + n[1] * ly + n[2] * lz;
        var s = 0.5 + 0.5 * (dot > 0 ? (dot > 1 ? 1 : dot) : 0);
        data[o] = Math.round(pr2.col[0] * s);
        data[o + 1] = Math.round(pr2.col[1] * s);
        data[o + 2] = Math.round(pr2.col[2] * s);
        data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    lastRenderKey = key;
  }

  function turn(dyaw, dpitch) {
    yaw = ((yaw + dyaw) % 360 + 360) % 360;
    if (yaw >= 360) yaw = 0;
    pitch = Math.max(-20, Math.min(60, pitch + dpitch));
    scheduleRender();
  }
  var drag = null;
  cv.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.isPrimary === false) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    e.preventDefault();
    try { cv.focus({ preventScroll: true }); } catch (err2) { /* ignore */ }
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.pointerType === 'mouse' && !(e.buttons & 1)) { drag = null; return; }
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (dx || dy) turn(0.9 * dx, 0.5 * dy);
    e.preventDefault();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  cv.addEventListener('selectstart', function (e) { e.preventDefault(); });
  cv.addEventListener('dragstart', function (e) { e.preventDefault(); });
  cv.addEventListener('keydown', function (e) {
    switch (e.key) {
      case 'ArrowRight': turn(15, 0); break;
      case 'ArrowLeft': turn(-15, 0); break;
      case 'ArrowUp': turn(0, 5); break;
      case 'ArrowDown': turn(0, -5); break;
      case 'Home': yaw = 0; pitch = 10; scheduleRender(); break;
      default: return;
    }
    e.preventDefault();
  });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function () { scheduleRender(); }).observe(cv);
  window.addEventListener('resize', scheduleRender);

  /* ---------- start ---------- */
  buildCards();
  buildLines();
  heightInput.value = '';
  promoInput.value = '';
  update();
  render();
}());
</script>
</body>
