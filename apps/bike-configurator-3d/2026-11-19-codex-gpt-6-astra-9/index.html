function ray(c,x,y){return norm(add(add(c.f,mul(c.r,(x-c.W/2)/c.F)),mul(c.u,-(y-c.H/2)/c.F)))}
function hit(p,o,d){if(p.box){let lo=-Infinity,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(o[i]<p.min[i]||o[i]>p.max[i])return Infinity}else{let a=(p.min[i]-o[i])/d[i],b=(p.max[i]-o[i])/d[i];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}}return hi>=0?Math.max(0,lo):Infinity}
const oa=sub(o,p.a),bard=dot(p.ba,d),baoa=dot(p.ba,oa),rdoa=dot(d,oa),oaoa=dot(oa,oa),A=p.baba-bard*bard,B=p.baba*rdoa-baoa*bard,C=p.baba*oaoa-baoa*baoa-p.r*p.r*p.baba;let best=Infinity,disc=B*B-A*C;if(disc>=0&&Math.abs(A)>1e-9){const t=(-B-Math.sqrt(disc))/A,y=baoa+t*bard;if(t>=0&&y>=0&&y<=p.baba)best=t}for(const center of [p.a,p.b]){const oc=sub(o,center),b=dot(d,oc),h=b*b-dot(oc,oc)+p.r*p.r;if(h>=0){const t=-b-Math.sqrt(h);if(t>=0&&t<best)best=t}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:[...parts]});window.bikePickAt=(x,y)=>{const c=camera(),d=ray(c,x,y);let nearest=Infinity,name=null;for(const p of primitives){const t=hit(p,c.E,d);if(t<nearest){nearest=t;name=p.part}}return name};
function scheduleDraw(){if(!drawPending){drawPending=true;requestAnimationFrame(()=>{drawPending=false;draw()})}}
function draw(){if($('main').hidden)return;const c=camera(),w=Math.round(c.W),h=260;if(!w)return;canvas.width=w;canvas.height=h;const image=ctx.createImageData(w,h),data=image.data,depth=new Float64Array(w*h);depth.fill(Infinity);for(let i=0;i<w*h;i++){data[4*i]=237;data[4*i+1]=237;data[4*i+2]=242;data[4*i+3]=255}const rays=new Array(w*h);for(const p of primitives){let x0=w,x1=0,y0=h,y1=0;for(let k=0;k<8;k++){const q=[k&1?p.max[0]:p.min[0],k&2?p.max[1]:p.min[1],k&4?p.max[2]:p.min[2]],d=sub(q,c.E),z=dot(d,c.f),x=c.W/2+c.F*dot(d,c.r)/z,y=c.H/2-c.F*dot(d,c.u)/z;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}x0=Math.max(0,Math.floor(x0));x1=Math.min(w-1,Math.ceil(x1));y0=Math.max(0,Math.floor(y0));y1=Math.min(h-1,Math.ceil(y1));for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*w+x,d=rays[i]||(rays[i]=ray(c,x+.5,y+.5)),t=hit(p,c.E,d);if(t<depth[i]){depth[i]=t;for(let j=0;j<3;j++)data[4*i+j]=p.color[j]}}}ctx.putImageData(image,0,0)}
function turn(){yaw=((yaw%360)+360)%360;pitch=Math.max(-20,Math.min(60,pitch));scheduleDraw()}let pointer=null;canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!pointer||e.pointerId!==pointer.id)return;yaw+=(e.clientX-pointer.x)*.9;pitch+=(e.clientY-pointer.y)*.5;pointer.x=e.clientX;pointer.y=e.clientY;turn()};canvas.onpointerup=canvas.onpointercancel=()=>{pointer=null};canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();if(e.key==='Home'){yaw=0;pitch=10}else if(e.key==='ArrowLeft')yaw-=15;else if(e.key==='ArrowRight')yaw+=15;else if(e.key==='ArrowUp')pitch+=5;else pitch-=5;turn()};new ResizeObserver(scheduleDraw).observe(canvas);render();
</script></body></html>
