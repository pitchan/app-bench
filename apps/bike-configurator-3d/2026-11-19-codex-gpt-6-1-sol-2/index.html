function buildModel(){primitives=[];parts=[];const R=s.wheels==='29'?375:350,L={S:430,M:470,L:510,XL:550}[s.frame]||470,RA=[0,R,0],FA=[1080,R,0],BB=[420,300,0],ST=[420-.25*L,300+L,0],HT=[1000,340+L,0],HB=[1020,220+L,0],SP=add(ST,[-15,60,0]),HS=add(HT,[-60,60,0]);let part,color;function start(n,c){part=n;color=c;parts.push(n)}function cap(a,b,r){let v=sub(b,a);primitives.push({a,b,r,v,vv:dot(v,v),part,color,lo:a.map((n,i)=>Math.min(n,b[i])-r),hi:a.map((n,i)=>Math.max(n,b[i])+r)})}function box(lo,hi){primitives.push({lo,hi,part,color,box:true})}start('frame',item('color',s.color)[3]);[[BB,ST,18],[ST,HT,18],[BB,HB,20],[HB,HT,20],[ST,RA,16],[BB,RA,16],[HB,FA,16],[ST,SP,13],[HT,HS,15],[add(HS,[0,0,-260]),add(HS,[0,0,260]),16]].forEach(x=>cap(...x));start('saddle','#1C1C1E');cap(add(SP,[-90,0,0]),add(SP,[80,0,0]),24);function arc(center,r,begin,count,tube){const point=k=>add(center,[r*Math.cos(k*Math.PI/180),r*Math.sin(k*Math.PI/180),0]);for(let k=0;k<count;k++)cap(point(begin+10*k),point(begin+10*(k+1)),tube)}for(let [name,center] of [['wheel-rear',RA],['wheel-front',FA]]){start(name,'#1C1C1E');arc(center,R,0,36,22);cap(add(center,[0,0,-50]),add(center,[0,0,50]),15)}if(s.accessory.has('mudguards'))for(let [name,center] of [['mudguard-rear',RA],['mudguard-front',FA]]){start(name,'#2C2C2E');arc(center,R+45,30,12,25)}if(s.accessory.has('rack')){start('rack','#48484A');box([-120,2*R+80,-90],[260,2*R+92,90]);cap([-100,2*R+86,0],RA,14)}if(s.accessory.has('lights')){start('light','#FFD60A');box(add(HT,[20,-60,-25]),add(HT,[70,-20,25]))}if(s.accessory.has('kickstand')){start('kickstand','#8E8E93');cap([380,300,60],[300,0,160],20)}}
function camera(){let t=yaw*Math.PI/180,p=pitch*Math.PI/180,E=add([540,450,0],mul([Math.sin(t)*Math.cos(p),Math.sin(p),Math.cos(t)*Math.cos(p)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f),w=$('preview').clientWidth,h=260;cam={E,f,r,u,w,h,F:h/2/Math.tan(Math.PI/12)};return cam}function ray(x,y){let c=cam;return add(c.f,add(mul(c.r,(x-c.w/2)/c.F),mul(c.u,-(y-c.h/2)/c.F)))}
function hit(p,o,d){let near=0,far=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(o[i]<p.lo[i]||o[i]>p.hi[i])return Infinity}else{let a=(p.lo[i]-o[i])/d[i],b=(p.hi[i]-o[i])/d[i];near=Math.max(near,Math.min(a,b));far=Math.min(far,Math.max(a,b));if(near>far)return Infinity}}if(p.box)return near;let oa=sub(o,p.a),dd=dot(d,d),vd=dot(p.v,d),vo=dot(p.v,oa),od=dot(oa,d),oo=dot(oa,oa),A=p.vv*dd-vd*vd,B=p.vv*od-vo*vd,C=p.vv*oo-vo*vo-p.r*p.r*p.vv,disc=B*B-A*C,best=Infinity;if(disc>=0&&Math.abs(A)>1e-12){let t=(-B-Math.sqrt(disc))/A,y=vo+t*vd;if(t>=0&&y>=0&&y<=p.vv)best=t}for(let q of [p.a,p.b]){let dx=o[0]-q[0],dy=o[1]-q[1],dz=o[2]-q[2],b=dx*d[0]+dy*d[1]+dz*d[2],c=dx*dx+dy*dy+dz*dz-p.r*p.r,h=b*b-dd*c;if(h>=0){let t=(-b-Math.sqrt(h))/dd;if(t>=0&&t<best)best=t}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:[...parts]});window.bikePickAt=(x,y)=>{camera();let d=ray(x,y),best=Infinity,name=null;for(let p of primitives){let t=hit(p,cam.E,d);if(t<best){best=t;name=p.part}}return name};
function scheduleDraw(){if(!drawQueued){drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;draw()})}}function draw(){let c=camera(),canvas=$('preview'),w=Math.round(c.w),h=260;if(!w)return;canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d'),im=ctx.createImageData(w,h),data=im.data,zbuf=new Float64Array(w*h);zbuf.fill(Infinity);for(let i=0;i<w*h;i++){data[i*4]=237;data[i*4+1]=237;data[i*4+2]=242;data[i*4+3]=255}function project(q){let d=sub(q,c.E),z=dot(d,c.f);return[c.w/2+c.F*dot(d,c.r)/z,c.h/2-c.F*dot(d,c.u)/z]}for(let p of primitives){let pts=[];for(let x of [p.lo[0],p.hi[0]])for(let y of [p.lo[1],p.hi[1]])for(let z of [p.lo[2],p.hi[2]])pts.push(project([x,y,z]));let xmin=Math.max(0,Math.floor(Math.min(...pts.map(v=>v[0])))-1),xmax=Math.min(w-1,Math.ceil(Math.max(...pts.map(v=>v[0])))+1),ymin=Math.max(0,Math.floor(Math.min(...pts.map(v=>v[1])))-1),ymax=Math.min(h-1,Math.ceil(Math.max(...pts.map(v=>v[1])))+1),rgb=[1,3,5].map(i=>parseInt(p.color.slice(i,i+2),16));for(let y=ymin;y<=ymax;y++)for(let x=xmin;x<=xmax;x++){let i=y*w+x,t=hit(p,c.E,ray(x+.5,y+.5));if(t<zbuf[i]){zbuf[i]=t;for(let j=0;j<3;j++)data[i*4+j]=rgb[j]}}}ctx.putImageData(im,0,0)}
let drag=null;const canvas=$('preview');function turn(){yaw=(yaw%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch));scheduleDraw()}canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();canvas.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY]};canvas.onpointermove=e=>{if(!drag)return;yaw+=.9*(e.clientX-drag[0]);pitch+=.5*(e.clientY-drag[1]);drag=[e.clientX,e.clientY];turn()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();if(e.key==='Home'){yaw=0;pitch=10}else if(e.key==='ArrowLeft')yaw-=15;else if(e.key==='ArrowRight')yaw+=15;else if(e.key==='ArrowUp')pitch+=5;else pitch-=5;turn()};new ResizeObserver(scheduleDraw).observe(canvas);reset();
</script></body></html>
