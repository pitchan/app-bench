<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 24px;
}
header {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-5) var(--space-4);
}
header h1 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
main, .confirm-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--space-4) 96px;
}
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-6);
  align-items: start;
}
.configurator {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}
section, .summary {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
section > h2 {
  margin: 0 0 var(--space-4);
  font-size: var(--text-lg);
  line-height: 28px;
  font-weight: 600;
}
.summary { position: static; min-width: 0; }

@media (min-width: 1024px) {
  header { padding-left: var(--space-5); padding-right: var(--space-5); }
  main, .confirm-wrap { padding-left: var(--space-5); padding-right: var(--space-5); }
  main { grid-template-columns: minmax(0, 1fr) 360px; }
  .summary { position: sticky; top: 24px; }
}

/* Fields */
.field label, .promo label {
  display: block;
  font-size: var(--text-sm);
  line-height: 20px;
  font-weight: 600;
  margin-bottom: var(--space-1);
}
input[type="text"] {
  height: 40px;
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background-color: var(--color-surface);
  color: var(--color-text);
  font: inherit;
  transition: border-color var(--duration-fast);
}
input[type="text"]:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
#height { width: 160px; max-width: 100%; display: block; }
#height[aria-invalid="true"] { border-color: var(--color-danger); }
.error {
  color: var(--color-danger);
  font-size: var(--text-sm);
  line-height: 20px;
  margin-top: var(--space-2);
}
.reco {
  margin-top: var(--space-2);
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-accent);
  font-weight: 600;
}
.warning {
  margin-top: var(--space-3);
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
}

/* Cards */
.grid { display: grid; gap: var(--space-3); }
.grid-frame { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-wheels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-drivetrain { grid-template-columns: repeat(1, minmax(0, 1fr)); }
.grid-color { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-accessory { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 1024px) {
  .grid-frame { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-drivetrain { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-color { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.card {
  --bw: 1px;
  position: relative;
  display: block;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 16px;
  cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.card input {
  position: absolute;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.card:hover { border-color: var(--color-muted); }
.card:has(input:checked) {
  --bw: 2px;
  border: 2px solid var(--color-accent);
  padding: 15px;
}
.card:has(input:disabled) {
  opacity: 0.45;
  cursor: not-allowed;
}
.card:has(input:disabled):not(:has(input:checked)) { border-color: var(--color-border); }
.card:has(input:focus-visible) {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.card [data-role="name"] {
  display: block;
  padding-right: 24px;
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
  color: var(--color-text);
}
.card [data-role="price"] {
  display: block;
  font-size: 14px;
  line-height: 20px;
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.card [data-role="check"] {
  display: none;
  position: absolute;
  top: 12px;
  right: 12px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  align-items: center;
  justify-content: center;
}
.card:has(input:checked) [data-role="check"] { display: flex; top: 11px; right: 11px; }
.card [data-role="check"] svg { display: block; }
.card .slot {
  display: block;
  min-height: 20px;
  font-size: 14px;
  line-height: 20px;
  color: var(--color-text);
}
.grid-wheels .slot { min-height: 40px; }
@media (min-width: 1024px) { .grid-wheels .slot { min-height: 20px; } }
.card [data-role="reason"] { display: block; }
.card [data-role="badge"] {
  position: absolute;
  top: calc(-1 * var(--bw));
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  border-radius: var(--radius-pill);
  font-size: 14px;
  line-height: 20px;
  font-weight: 600;
  padding: 2px 8px;
  white-space: nowrap;
}
.card [data-role="swatch"] {
  display: block;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  margin-bottom: var(--space-2);
}

/* Buttons */
button {
  font: inherit;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
button:focus-visible, canvas:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.btn {
  height: 40px;
  padding: 0 var(--space-4);
  background-color: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  color: var(--color-text);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--color-muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-square { width: 40px; padding: 0; font-size: 20px; line-height: 1; }
.btn-primary {
  display: block;
  width: 100%;
  height: 48px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-control);
  font-size: 16px;
  font-weight: 600;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  cursor: pointer;
}
.btn-primary:disabled {
  background-color: var(--color-disabled-bg);
  color: var(--color-muted);
  cursor: not-allowed;
}

/* Quantity */
.qty { display: flex; align-items: center; gap: var(--space-3); }
.qty [data-testid="qty-value"] {
  min-width: 32px;
  text-align: center;
  font-size: var(--text-lg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Summary */
canvas {
  display: block;
  width: 100%;
  height: 260px;
  border: 0;
  padding: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
canvas.dragging { cursor: grabbing; }
.lines { margin-top: var(--space-4); }
.line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-3);
  padding: 2px 0;
  font-size: var(--text-sm);
}
.line [data-role="label"] {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.line [data-role="value"] {
  flex: none;
  margin-left: auto;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.line.sep, .line.total {
  border-top: 1px solid var(--color-border);
  margin-top: var(--space-2);
  padding-top: var(--space-2);
}
.line.total [data-role="label"], .line.total [data-role="value"] {
  font-size: 28px;
  line-height: 36px;
  font-weight: 700;
}
.line.discount [data-role="value"] { color: var(--color-accent); }
.line.minor { color: var(--color-muted); }
.promo {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}
.promo-row { display: flex; gap: var(--space-2); }
.promo-row input { flex: 1 1 auto; min-width: 0; width: 100%; }
.promo-status {
  margin-top: var(--space-2);
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
}
.promo-status.active { color: var(--color-accent); }
.promo .btn-remove { margin-top: var(--space-2); }
.order { margin-top: var(--space-5); }
.hint {
  margin-top: var(--space-2);
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
  text-align: center;
}

/* Notice */
.status-region {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  display: flex;
  justify-content: center;
  padding: 0 var(--space-4);
  pointer-events: none;
  z-index: 10;
}
.notice {
  max-width: 480px;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-accent);
  border-radius: var(--radius-control);
  padding: 12px 16px;
  font-size: var(--text-sm);
  line-height: 20px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
}

/* Confirmation */
.confirmation { max-width: 560px; margin: 0 auto; }
.confirmation h2 {
  margin: 0 0 var(--space-4);
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
}
.confirmation h2:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 4px; }
.confirmation dl { margin: 0 0 var(--space-5); }
.confirmation .row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-top: 1px solid var(--color-border);
}
.confirmation dt { color: var(--color-muted); }
.confirmation dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }
}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Fable 5.2</h1></header>

<main id="main">
  <div class="configurator" data-testid="configurator" id="configurator">
    <section data-testid="section-rider">
      <h2>1. Rider</h2>
      <div class="field">
        <label for="height">Your height (cm)</label>
        <input type="text" inputmode="numeric" id="height" data-testid="height-input" autocomplete="off">
      </div>
      <div class="error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</div>
      <div class="reco" id="height-reco" data-testid="height-recommendation" hidden></div>
    </section>
    <section data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="grid grid-frame" id="grid-frame"></div>
      <div class="warning" id="frame-warning" data-testid="frame-warning" hidden></div>
    </section>
    <section data-testid="section-wheels">
      <h2>3. Wheels</h2>
      <div class="grid grid-wheels" id="grid-wheels"></div>
    </section>
    <section data-testid="section-drivetrain">
      <h2>4. Drivetrain</h2>
      <div class="grid grid-drivetrain" id="grid-drivetrain"></div>
    </section>
    <section data-testid="section-color">
      <h2>5. Color</h2>
      <div class="grid grid-color" id="grid-color"></div>
    </section>
    <section data-testid="section-accessories">
      <h2>6. Accessories</h2>
      <div class="grid grid-accessory" id="grid-accessory"></div>
    </section>
    <section data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="qty">
        <button type="button" class="btn btn-square" id="qty-dec" data-testid="qty-decrease" aria-label="Decrease quantity">−</button>
        <span id="qty-value" data-testid="qty-value">1</span>
        <button type="button" class="btn btn-square" id="qty-inc" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>

  <aside class="summary" data-testid="summary" id="summary">
    <canvas id="preview" data-testid="bike-preview" tabindex="0" role="img" aria-label="Bike preview" width="310" height="260"></canvas>
    <div class="lines" id="lines"></div>
    <div class="promo">
      <label for="promo">Promo code</label>
      <div class="promo-row">
        <input type="text" id="promo" data-testid="promo-input" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <div class="error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</div>
      <div class="promo-status" id="promo-status" data-testid="promo-status" hidden></div>
      <button type="button" class="btn btn-remove" id="promo-remove" data-testid="promo-remove" hidden>Remove code</button>
    </div>
    <div class="order">
      <button type="button" class="btn-primary" id="order" data-testid="order-button" disabled>Order 1 bike</button>
      <div class="hint" id="order-hint" data-testid="order-hint">Enter your height to continue.</div>
    </div>
  </aside>
</main>

<div class="confirm-wrap" id="confirm-wrap" hidden>
  <section class="confirmation" data-testid="confirmation">
    <h2 data-testid="confirmation-title" id="conf-title" tabindex="-1">Order confirmed</h2>
    <dl>
      <div class="row"><dt>Reference</dt><dd data-testid="confirmation-reference" id="conf-ref"></dd></div>
      <div class="row"><dt>Total</dt><dd data-testid="confirmation-total" id="conf-total"></dd></div>
      <div class="row"><dt>Estimated delivery</dt><dd data-testid="confirmation-delivery" id="conf-delivery"></dd></div>
    </dl>
    <button type="button" class="btn" id="conf-new" data-testid="confirmation-new">Configure another bike</button>
  </section>
</div>

<div class="status-region" role="status"><div class="notice" id="notice" data-testid="notice" hidden></div></div>

<script>
(function () {
  'use strict';

  /* ---------- Catalog ---------- */
  var FRAMES = [
    { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000, len: 430 },
    { id: 'M', name: 'Frame M', min: 165, max: 174, price: 119000, len: 470 },
    { id: 'L', name: 'Frame L', min: 175, max: 184, price: 124000, len: 510 },
    { id: 'XL', name: 'Frame XL', min: 185, max: 200, price: 129000, len: 550 }
  ];
  var WHEELS = [
    { id: '275', name: '27.5" wheels', price: 0, radius: 350 },
    { id: '29', name: '29" wheels', price: 12000, radius: 375 }
  ];
  var DRIVETRAINS = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  var COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0, outOfStock: true }
  ];
  var ACCESSORIES = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  var CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = { '2026-12-24': 1, '2026-12-25': 1, '2026-12-31': 1, '2027-01-01': 1 };
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DASH = '—', MINUS = '−';
  var MSG07 = '29" wheels were replaced by 27.5" wheels: not available with frame S.';
  var MSG08 = 'Mudguards were added: required by the rear rack.';
  var MSG09 = 'Rear rack was removed: it requires mudguards.';

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- Formats ---------- */
  function money(cents) {
    var euros = Math.floor(cents / 100), c = cents % 100;
    var s = String(euros).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return '€' + s + '.' + (c < 10 ? '0' : '') + c;
  }
  function signed(cents) { return cents === 0 ? 'Included' : '+' + money(cents); }
  function discount(cents) { return MINUS + money(cents); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function formatDate(d) {
    return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- State ---------- */
  var orderSeq = 0;
  var view = { yaw: 0, pitch: 10 };
  var state;
  function freshState() {
    return {
      heightRaw: '', frame: null, wheels: '275', drivetrain: 'essential', color: 'graphite',
      acc: { mudguards: false, rack: false, lights: false, kickstand: false },
      qty: 1, code: null, auto: true, notice: null, promoError: false
    };
  }
  state = freshState();

  function validHeight() {
    var t = state.heightRaw.trim();
    if (!/^[0-9]+$/.test(t)) return null;
    var n = Number(t);
    return (n >= 150 && n <= 200) ? n : null;
  }
  function recommend(h) {
    for (var i = 0; i < FRAMES.length; i++) if (h >= FRAMES[i].min && h <= FRAMES[i].max) return FRAMES[i].id;
    return null;
  }
  function frameIndex(id) {
    for (var i = 0; i < FRAMES.length; i++) if (FRAMES[i].id === id) return i;
    return -1;
  }

  /* ---------- Pricing and delivery ---------- */
  function colorSurcharge() {
    if (state.color === 'red' && state.drivetrain === 'pro') return 0;
    return byId(COLORS, state.color).price;
  }
  function compute() {
    var r = { hasFrame: !!state.frame, code: state.code, codeActive: false };
    var unit = 0;
    if (r.hasFrame) {
      unit = byId(FRAMES, state.frame).price + byId(WHEELS, state.wheels).price +
        byId(DRIVETRAINS, state.drivetrain).price + colorSurcharge();
      ACCESSORIES.forEach(function (a) { if (state.acc[a.id]) unit += a.price; });
    }
    r.unit = unit;
    r.subtotal = unit * state.qty;
    r.qtyDiscount = state.qty >= 3 ? Math.floor((r.subtotal * 5 + 50) / 100) : 0;
    r.after = r.subtotal - r.qtyDiscount;
    r.promo = 0;
    if (state.code === 'SPRING10') {
      r.codeActive = r.hasFrame && r.after >= 150000;
      if (r.codeActive) r.promo = Math.floor((r.after * 10 + 50) / 100);
    } else if (state.code === 'WELCOME50') {
      r.codeActive = state.qty < 3;
      if (r.codeActive) r.promo = 5000;
    } else if (state.code === 'FREESHIP') {
      r.codeActive = true;
    }

      }
      t1 = (c.mn[i] - E[i]) / d; t2 = (c.mx[i] - E[i]) / d;
      if (t1 > t2) { tmp = t1; t1 = t2; t2 = tmp; }
      if (t1 > tmin) { tmin = t1; axis = i; }
      if (t2 < tmax) tmax = t2;
    }
    if (tmax < tmin || tmin <= 0) return Infinity;
    boxAxis = axis;
    return tmin;
  }

  var scene = null; // { key, model, cam, prims }
  function currentScene() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) { sizeW = rect.width; sizeH = rect.height; }
    var model = buildModel();
    var key = model.key + '|' + view.yaw + '|' + view.pitch + '|' + sizeW + '|' + sizeH;
    if (scene && scene.key === key) return scene;
    var cam = camera(sizeW, sizeH);
    scene = { key: key, model: model, cam: cam, prims: prepare(model, cam.E), drawn: false };
    return scene;
  }

  function pick(sc, px, py) {
    var cam = sc.cam, a = (px - cam.W / 2) / cam.F, b = (py - cam.H / 2) / cam.F;
    var dx = cam.f[0] + a * cam.r[0] - b * cam.u[0];
    var dy = cam.f[1] + a * cam.r[1] - b * cam.u[1];
    var dz = cam.f[2] + a * cam.r[2] - b * cam.u[2];
    var best = Infinity, part = -1, i, t, c;
    for (i = 0; i < sc.prims.length; i++) {
      c = sc.prims[i];
      t = c.box ? hitBox(c, cam.E, dx, dy, dz) : hitCap(c, dx, dy, dz);
      if (t < best) { best = t; part = c.part; }
    }
    return part;
  }

  function renderPreview() {
    var sc = currentScene();
    if (sc.drawn) return;
    var cw = Math.max(1, Math.round(sizeW)), ch = Math.max(1, Math.round(sizeH));
    if (canvas.width !== cw) canvas.width = cw;
    if (canvas.height !== ch) canvas.height = ch;
    var cam = sc.cam, E = cam.E, f = cam.f, r = cam.r, u = cam.u, F = cam.F, W = cam.W, H = cam.H;
    var sx = W / cw, sy = H / ch;
    var n = cw * ch;
    var depth = new Float64Array(n), owner = new Int16Array(n);
    var i, j, k, c, idx, t;
    for (i = 0; i < n; i++) { depth[i] = Infinity; owner[i] = -1; }

    for (k = 0; k < sc.prims.length; k++) {
      c = sc.prims[k];
      // Screen bounds of the primitive: projection of the corners of its bounding box.
      var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, m;
      for (m = 0; m < 8; m++) {
        var qx = ((m & 1) ? c.hi[0] : c.lo[0]) - E[0];
        var qy = ((m & 2) ? c.hi[1] : c.lo[1]) - E[1];
        var qz = ((m & 4) ? c.hi[2] : c.lo[2]) - E[2];
        var df = qx * f[0] + qy * f[1] + qz * f[2];
        var px = W / 2 + F * (qx * r[0] + qy * r[1] + qz * r[2]) / df;
        var py = H / 2 - F * (qx * u[0] + qy * u[1] + qz * u[2]) / df;
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
      }
      var i0 = Math.max(0, Math.floor(x0 / sx) - 1), i1 = Math.min(cw - 1, Math.ceil(x1 / sx) + 1);
      var j0 = Math.max(0, Math.floor(y0 / sy) - 1), j1 = Math.min(ch - 1, Math.ceil(y1 / sy) + 1);
      for (j = j0; j <= j1; j++) {
        var b = ((j + 0.5) * sy - H / 2) / F;
        var bx = f[0] - b * u[0], by = f[1] - b * u[1], bz = f[2] - b * u[2];
        for (i = i0; i <= i1; i++) {
          var a = ((i + 0.5) * sx - W / 2) / F;
          var dx = bx + a * r[0], dy = by + a * r[1], dz = bz + a * r[2];
          t = c.box ? hitBox(c, E, dx, dy, dz) : hitCap(c, dx, dy, dz);
          idx = j * cw + i;
          if (t < depth[idx]) { depth[idx] = t; owner[idx] = k; }
        }
      }
    }

    // Light fixed to the camera: from above, slightly left, towards the viewer.
    var lx = -0.55 * f[0] + 0.7 * u[0] - 0.35 * r[0];
    var ly = -0.55 * f[1] + 0.7 * u[1] - 0.35 * r[1];
    var lz = -0.55 * f[2] + 0.7 * u[2] - 0.35 * r[2];
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    lx /= ll; ly /= ll; lz /= ll;

    var img = ctx.createImageData(cw, ch), data = img.data, o = 0;
    for (j = 0; j < ch; j++) {
      var b2 = ((j + 0.5) * sy - H / 2) / F;
      for (i = 0; i < cw; i++, o += 4) {
        idx = j * cw + i;
        k = owner[idx];
        if (k < 0) {
          data[o] = BG[0]; data[o + 1] = BG[1]; data[o + 2] = BG[2]; data[o + 3] = 255;
          continue;
        }
        c = sc.prims[k];
        var a2 = ((i + 0.5) * sx - W / 2) / F;
        var ddx = f[0] + a2 * r[0] - b2 * u[0], ddy = f[1] + a2 * r[1] - b2 * u[1], ddz = f[2] + a2 * r[2] - b2 * u[2];
        t = depth[idx];
        var hx = E[0] + t * ddx, hy = E[1] + t * ddy, hz = E[2] + t * ddz;
        var nx = 0, ny = 0, nz = 0;
        if (c.box) {
          hitBox(c, E, ddx, ddy, ddz);
          if (boxAxis === 0) nx = ddx > 0 ? -1 : 1;
          else if (boxAxis === 1) ny = ddy > 0 ? -1 : 1;
          else nz = ddz > 0 ? -1 : 1;
        } else {
          var vx = hx - c.p[0], vy = hy - c.p[1], vz = hz - c.p[2];
          var hh = (vx * c.bax + vy * c.bay + vz * c.baz) / c.baba;
          if (hh < 0) hh = 0; else if (hh > 1) hh = 1;
          nx = (vx - hh * c.bax) / c.r; ny = (vy - hh * c.bay) / c.r; nz = (vz - hh * c.baz) / c.r;
        }
        var dot = nx * lx + ny * ly + nz * lz;
        if (!(dot > 0)) dot = 0; else if (dot > 1) dot = 1;
        var s = 0.5 + 0.5 * dot;
        var colr = sc.model.parts[c.part].color;
        data[o] = Math.round(s * colr[0]);
        data[o + 1] = Math.round(s * colr[1]);
        data[o + 2] = Math.round(s * colr[2]);
        data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    sc.drawn = true;
  }

  window.bikePreviewState = function () {
    var yaw = ((view.yaw % 360) + 360) % 360;
    if (yaw >= 360) yaw = 0;
    return { yaw: yaw, pitch: view.pitch, parts: buildModel().parts.map(function (p) { return p.name; }) };
  };
  window.bikePickAt = function (px, py) {
    var sc = currentScene();
    var part = pick(sc, Number(px), Number(py));
    return part < 0 ? null : sc.model.parts[part].name;
  };

  function turn(dyaw, dpitch) {
    var yaw = view.yaw + dyaw;
    yaw = ((yaw % 360) + 360) % 360;
    if (yaw >= 360) yaw = 0;
    var pitch = view.pitch + dpitch;
    if (pitch < -20) pitch = -20;
    if (pitch > 60) pitch = 60;
    view.yaw = yaw; view.pitch = pitch;
    renderPreview();
  }

  var drag = null;
  function endDrag() { drag = null; canvas.classList.remove('dragging'); }
  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    canvas.classList.add('dragging');
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!(e.buttons & 1)) { endDrag(); return; }
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (dx !== 0 || dy !== 0) turn(0.9 * dx, 0.5 * dy);
  });
  window.addEventListener('pointerup', function (e) { if (drag && e.pointerId === drag.id) endDrag(); });
  window.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.id) endDrag(); });
  canvas.addEventListener('mousedown', function (e) {
    // No text selection during the drag; keep the canvas focusable by click.
    e.preventDefault();
    canvas.focus({ preventScroll: true });
  });
  canvas.addEventListener('keydown', function (e) {
    switch (e.key) {
      case 'ArrowRight': e.preventDefault(); turn(15, 0); break;
      case 'ArrowLeft': e.preventDefault(); turn(-15, 0); break;
      case 'ArrowUp': e.preventDefault(); turn(0, 5); break;
      case 'ArrowDown': e.preventDefault(); turn(0, -5); break;
      case 'Home': e.preventDefault(); view.yaw = 0; view.pitch = 10; renderPreview(); break;
    }
  });

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(function () { renderPreview(); }).observe(canvas);
  }
  window.addEventListener('resize', function () { renderPreview(); });

  update();
})();
</script>
</body>
</html>
