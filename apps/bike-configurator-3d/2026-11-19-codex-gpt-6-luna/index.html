<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-6 Luna</title>
<style>
:root{--color-bg:#F6F4F0;--color-surface:#FFFFFF;--color-text:#1B1A18;--color-muted:#67625B;--color-border:#DCD6CC;--color-accent:#0E6B58;--color-accent-contrast:#FFFFFF;--color-danger:#B42318;--color-disabled-bg:#ECE8E1;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--radius-control:8px;--radius-card:12px;--radius-pill:999px;--text-sm:14px;--text-md:16px;--text-lg:20px;--text-xl:28px;--duration-fast:150ms;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--color-bg:#121110;--color-surface:#1D1B19;--color-text:#F3F0EA;--color-muted:#A59F96;--color-border:#38342F;--color-accent:#3BC4A5;--color-accent-contrast:#0B0A09;--color-danger:#F97066;--color-disabled-bg:#2A2724}}
*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font:16px/24px system-ui,-apple-system,"Segoe UI",sans-serif}header{height:72px;border-bottom:1px solid var(--color-border);display:flex;align-items:center}header h1{font-size:28px;line-height:34px;font-weight:700;margin:0 auto;width:min(1200px,100%);padding:0 24px}main{max-width:1200px;padding:24px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}.configurator{display:flex;flex-direction:column;gap:16px}.panel,aside,.confirmation{background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:24px}section h2{font-size:20px;font-weight:600;line-height:28px;margin:0 0 16px}.field-label{display:block;font-weight:600;margin-bottom:8px}.text-input{height:44px;width:100%;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface);color:var(--color-text);padding:0 12px;font:inherit}.text-input:focus-visible,button:focus-visible,canvas:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}.help{color:var(--color-muted);font-size:14px;margin:8px 0 0}.error{color:var(--color-danger);font-size:14px;margin:8px 0 0}.invalid{border-color:var(--color-danger)}.recommend{color:var(--color-accent);font-size:14px;margin:8px 0 0}.warning{color:var(--color-danger);font-size:14px;margin:8px 0 0}.grid{display:grid;gap:12px}.grid.frames,.grid.colors{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.wheels,.grid.accessories{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.drivetrains{grid-template-columns:repeat(3,minmax(0,1fr))}.option{position:relative;min-width:0;min-height:108px;padding:16px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:all var(--duration-fast)}.option.selected{border:2px solid var(--color-accent);padding:15px}.option:not(.selected):not(.disabled):hover{border-color:var(--color-muted)}.option.disabled{opacity:.45;cursor:not-allowed}.option input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.option:has(input:focus-visible){outline:2px solid var(--color-accent);outline-offset:2px}.name{font-size:16px;font-weight:600;color:var(--color-text);line-height:22px}.price{font-size:14px;color:var(--color-muted);font-variant-numeric:tabular-nums;margin-top:8px}.check{display:none;position:absolute;right:12px;top:9px;color:var(--color-accent);font-weight:700}.selected .check{display:block}.reason{font-size:14px;color:var(--color-danger);margin-top:4px}.badge{position:absolute;z-index:1;left:50%;top:0;transform:translate(-50%,-50%);background:var(--color-accent);color:var(--color-accent-contrast);border-radius:999px;font-size:14px;font-weight:600;padding:2px 8px;white-space:nowrap}.swatch{width:32px;height:32px;border-radius:50%;border:1px solid var(--color-border);display:block;margin-bottom:8px}.quantity{display:flex;align-items:center;gap:16px}.quantity button{width:40px}.quantity-value{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}button{font:600 16px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--color-text);background:transparent;border:1px solid var(--color-border);border-radius:8px;height:40px;padding:0 16px;cursor:pointer;transition:all var(--duration-fast)}button:disabled{opacity:.45;cursor:not-allowed}aside{position:sticky;top:24px;min-width:0}canvas{display:block;width:100%;height:260px;border:0;padding:0;background:#EDEDF2;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.summary-lines{margin-top:16px}.summary-line{height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;font-size:14px;line-height:20px}.summary-line [data-role=label]{min-width:0;overflow:hidden;text-overflow:ellipsis}.summary-line [data-role=value]{font-variant-numeric:tabular-nums;flex:none}.summary-line.discount [data-role=value]{color:var(--color-accent)}.summary-line.total{border-top:1px solid var(--color-border);height:54px;margin-top:4px;padding-top:4px;font-size:28px;line-height:34px;font-weight:700}.summary-line.delivery{font-size:14px}.promo{margin-top:16px;padding-top:16px;border-top:1px solid var(--color-border)}.promo-row{display:flex;gap:8px}.promo-row .text-input{flex:1;min-width:0}.promo-status{font-size:14px;color:var(--color-accent);margin:8px 0 0}.promo-status.inactive{color:var(--color-muted)}.promo-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.promo-actions button{height:36px;padding:0 10px;font-size:14px}.order-button{width:100%;height:48px;margin-top:16px;border:0;border-radius:8px;background:var(--color-accent);color:var(--color-accent-contrast);font-size:16px;font-weight:600}.order-button:disabled{background:var(--color-disabled-bg);color:var(--color-muted);cursor:not-allowed;opacity:1}.order-hint{margin:8px 0 0;text-align:center;color:var(--color-muted);font-size:14px}.notice-host{position:fixed;inset:auto 0 0;z-index:5;pointer-events:none}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(480px,calc(100vw - 32px));background:var(--color-surface);border-left:4px solid var(--color-accent);border-radius:8px;padding:12px 16px;box-shadow:0 8px 28px #0002;pointer-events:auto}.confirmation{max-width:760px;margin:40px auto}.confirmation h2{font-size:28px;line-height:36px;margin:0 0 20px}.confirmation p{margin:10px 0}.confirmation button{margin-top:16px}
@media(max-width:1023px){header h1{padding:0 16px}main{padding:24px 16px;grid-template-columns:minmax(0,1fr);gap:32px}aside{position:static}.grid.frames,.grid.colors{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.drivetrains{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header data-testid="app-header"><h1>GPT-6 Luna</h1></header>
<div id="app">
<main>
<div class="configurator" data-testid="configurator">
<section class="panel" data-testid="section-rider"><h2>1. Rider</h2><label class="field-label" for="height-input">Your height (cm)</label><input class="text-input" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off"><p class="error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p><p class="recommend" data-testid="height-recommendation" hidden></p></section>
<section class="panel" data-testid="section-frame"><h2>2. Frame</h2><div class="grid frames" id="frames"></div><p class="warning" data-testid="frame-warning" hidden></p></section>
<section class="panel" data-testid="section-wheels"><h2>3. Wheels</h2><div class="grid wheels" id="wheels"></div></section>
<section class="panel" data-testid="section-drivetrain"><h2>4. Drivetrain</h2><div class="grid drivetrains" id="drivetrain"></div></section>
<section class="panel" data-testid="section-color"><h2>5. Color</h2><div class="grid colors" id="color"></div></section>
<section class="panel" data-testid="section-accessories"><h2>6. Accessories</h2><div class="grid accessories" id="accessories"></div></section>
<section class="panel" data-testid="section-quantity"><h2>7. Quantity</h2><div class="quantity"><button type="button" data-testid="qty-decrease" aria-label="Decrease quantity">−</button><span data-testid="qty-value" class="quantity-value">1</span><button type="button" data-testid="qty-increase" aria-label="Increase quantity">+</button></div></section>
</div>
<aside data-testid="summary">
<canvas data-testid="bike-preview" id="bike-preview" role="img" aria-label="Bike preview" tabindex="0" width="310" height="260"></canvas>
<div class="summary-lines" id="summary-lines"></div>
<div class="promo"><label class="field-label" for="promo-input">Promo code</label><div class="promo-row"><input class="text-input" id="promo-input" data-testid="promo-input" type="text" autocomplete="off"><button type="button" data-testid="promo-apply" disabled>Apply</button></div><p class="error" data-testid="promo-error" hidden>This code is not valid.</p><div class="promo-actions"><p class="promo-status" data-testid="promo-status" hidden></p><button type="button" data-testid="promo-remove" hidden>Remove code</button></div></div>
<button type="button" class="order-button" data-testid="order-button" disabled>Order 1 bike</button><p class="order-hint" data-testid="order-hint">Enter your height to continue.</p>
</aside>
</main>
<section class="confirmation" data-testid="confirmation" hidden><h2 data-testid="confirmation-title" tabindex="-1">Order confirmed</h2><p data-testid="confirmation-reference"></p><p><span>Order total</span>: <strong data-testid="confirmation-total"></strong></p><p><span>Estimated delivery</span>: <strong data-testid="confirmation-delivery"></strong></p><button type="button" data-testid="confirmation-new">Configure another bike</button></section>
</div>
<div class="notice-host" role="status" aria-live="polite" aria-atomic="true"><div data-testid="notice" class="notice" hidden></div></div>
<script>
(()=>{'use strict';
const frames=[{id:'S',name:'Frame S',price:119000},{id:'M',name:'Frame M',price:119000},{id:'L',name:'Frame L',price:124000},{id:'XL',name:'Frame XL',price:129000}];
const wheels=[{id:'275',name:'27.5" wheels',price:0,R:350},{id:'29',name:'29" wheels',price:12000,R:375}];
const drivetrains=[{id:'essential',name:'Essential 1×10',price:0,days:5},{id:'sport',name:'Sport 1×12',price:24000,days:7},{id:'pro',name:'Pro Electronic 2×12',price:69000,days:12}];
const colors=[{id:'graphite',name:'Graphite',hex:'#3A3A3C',price:0},{id:'sand',name:'Sand',hex:'#D8C7A6',price:0},{id:'red',name:'Racing Red',hex:'#C8102E',price:6000},{id:'glacier',name:'Glacier',hex:'#A9D6E5',price:0,disabled:true}];
const accessories=[{id:'mudguards',name:'Mudguards',price:4500},{id:'rack',name:'Rear rack',price:6900},{id:'lights',name:'Lights',price:3990},{id:'kickstand',name:'Kickstand',price:2450}];
const state={height:'',frame:null,wheels:'275',drivetrain:'essential',color:'graphite',accessories:new Set(),qty:1,promo:null,auto:true,yaw:0,pitch:10,orderCount:0,notice:''};
const $=s=>document.querySelector(s), byTest=(id)=>document.querySelector(`[data-testid="${id}"]`);
const amount=c=>'€'+Math.floor(c/100).toLocaleString('en-US')+'.'+String(c%100).padStart(2,'0');
const signed=c=>c===0?'Included':(c<0?'−':' +').trim()+amount(Math.abs(c));
const roundHalfUp=(n,d)=>Math.floor((n*2+d)/(2*d));
function rec(){let h=state.height.trim();if(!/^\d+$/.test(h))return null;let v=Number(h);if(v<150||v>200)return null;return v<=164?'S':v<=174?'M':v<=184?'L':'XL'}
function price(){if(!state.frame)return null;let f=frames.find(x=>x.id===state.frame),w=wheels.find(x=>x.id===state.wheels),d=drivetrains.find(x=>x.id===state.drivetrain),c=colors.find(x=>x.id===state.color);let cp=c.id==='red'&&d.id==='pro'?0:c.price;let ap=accessories.filter(a=>state.accessories.has(a.id)).reduce((s,a)=>s+a.price,0);let unit=f.price+w.price+d.price+cp+ap,sub=unit*state.qty,qd=state.qty>=3?roundHalfUp(sub*5,100):0,after=sub-qd;let active=state.promo==='SPRING10'?after>=150000:state.promo==='WELCOME50'?state.qty<3:state.promo==='FREESHIP';let pd=active?(state.promo==='SPRING10'?roundHalfUp(after*10,100):state.promo==='WELCOME50'?5000:0):0;let merchandise=after-pd,ship=state.promo==='FREESHIP'||merchandise>=200000?0:4900,total=merchandise+ship;return{f,w,d,c,cp,ap,unit,sub,qd,after,active,pd,merchandise,ship,total,vat:roundHalfUp(total*20,120)}}
function lead(){let d=drivetrains.find(x=>x.id===state.drivetrain).days+(state.color==='red'?3:0)+(state.qty>=3?2:0);let dt=new Date();dt.setHours(12,0,0,0);for(let n=0;n<d;){dt.setDate(dt.getDate()+1);let key=dt.toISOString().slice(0,10);if(dt.getDay()!==0&&dt.getDay()!==6&&!['2026-12-24','2026-12-25','2026-12-31','2027-01-01'].includes(key))n++}return new Intl.DateTimeFormat('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(dt)}
function setNotice(msg){state.notice=msg;renderNotice()}function renderNotice(){let n=byTest('notice');n.textContent=state.notice;n.hidden=!state.notice}
function makeCard(group,item,sel,reason='',badge=false,swatch=''){let el=document.createElement('label');el.className='option';el.dataset.testid=`card-${group}-${item.id}`;let type=group==='accessory'?'checkbox':'radio',name=group==='accessory'?'accessories':group;let checked=group==='accessory'?state.accessories.has(item.id):state[group]===item.id;let disabled=!!reason;el.innerHTML=`<input type="${type}" name="${name}" aria-label="${item.name}" ${checked?'checked':''} ${disabled?'disabled':''}><span class="check" data-role="check" aria-hidden="true">✓</span>${badge?'<span class="badge" data-role="badge">Recommended</span>':''}${swatch?`<span class="swatch" data-role="swatch" style="background-color:${swatch}"></span>`:''}<span class="name" data-role="name">${item.name}</span><span class="price" data-role="price"></span>${reason?`<span class="reason" data-role="reason">${reason}</span>`:''}`;if(checked)el.classList.add('selected');if(disabled)el.classList.add('disabled');return el}
function cardPrice(group,item){let p=item.price;if(group==='color'&&item.id==='red'&&state.drivetrain==='pro')return'Included with Pro';if(p===0)return'Included';return'+'+amount(p)}
function drawCards(){let rr=rec();let mappings=[['frames','frame',frames],['wheels','wheels',wheels],['drivetrain','drivetrain',drivetrains],['color','color',colors],['accessories','accessory',accessories]];for(let [host,group,items] of mappings){let root=byTest(host);root.replaceChildren();for(let item of items){let reason=group==='wheels'&&item.id==='29'&&state.frame==='S'?'Not available with frame S':group==='color'&&item.id==='glacier'?'Out of stock':'';let el=makeCard(group,item,null,reason,group==='frame'&&rr===item.id,group==='color'?item.hex:'');el.querySelector('[data-role=price]').textContent=group==='frame'?amount(item.price):cardPrice(group,item);if(group==='frame')el.dataset.frame=item.id;root.append(el);let input=el.querySelector('input');input.addEventListener('change',()=>{if(group==='accessory')toggleAccessory(item.id,input.checked);else select(group,item.id)});el.addEventListener('click',ev=>{if(group==='frame'&&ev.target!==input&&!input.disabled){if(state.frame===item.id){state.auto=false;userChange();render()} }});}}
}
function select(group,id){if(group==='frame'){let changed=state.frame!==id;state.auto=false;if(!changed)return;userChange();state.frame=id;if(id==='S'&&state.wheels==='29'){state.wheels='275';setNotice('29" wheels were replaced by 27.5" wheels: not available with frame S.')}}else{if(state[group]===id)return;userChange();state[group]=id}render()}
function toggleAccessory(id,checked){let was=state.accessories.has(id);if(was===checked)return;userChange();if(id==='rack'&&checked&&!state.accessories.has('mudguards')){state.accessories.add('mudguards');state.accessories.add('rack');setNotice('Mudguards were added: required by the rear rack.')}else if(id==='mudguards'&&!checked&&state.accessories.has('rack')){state.accessories.delete('mudguards');state.accessories.delete('rack');setNotice('Rear rack was removed: it requires mudguards.')}else{checked?state.accessories.add(id):state.accessories.delete(id)}render()}
function userChange(){state.notice='';stateNoticeClear();}function stateNoticeClear(){renderNotice()}
function line(key,label,value,cls=''){let row=document.createElement('div');row.className='summary-line '+cls;row.dataset.testid='summary-line-'+key;row.innerHTML=`<span data-role="label"></span><span data-role="value"></span>`;row.querySelector('[data-role=label]').textContent=label;row.querySelector('[data-role=value]').textContent=value;return row}
function renderSummary(){let root=byTest('summary-lines');root.replaceChildren();let p=price(),all=[];if(!state.frame){all.push(line('frame','Frame','—'));for(let [k,l] of [['wheels',wheels.find(x=>x.id===state.wheels).name],['drivetrain',drivetrains.find(x=>x.id===state.drivetrain).name],['color',colors.find(x=>x.id===state.color).name]]){let cp=k==='color'&&state.color==='red'&&state.drivetrain==='pro'?0:null;let v=k==='wheels'?wheels.find(x=>x.id===state.wheels).price:k==='drivetrain'?drivetrains.find(x=>x.id===state.drivetrain).price:cp===0?0:colors.find(x=>x.id===state.color).price;all.push(line(k,l,k==='color'&&cp===0?'Included':signed(v)))}for(let a of accessories)if(state.accessories.has(a.id))all.push(line('accessory-'+a.id,a.name,'+'+amount(a.price)));all.push(line('unit','Unit price','—'),line('quantity','Quantity','× '+state.qty),line('subtotal','Subtotal','—'),line('shipping','Shipping','—'),line('total','Total','—','total'),line('vat','Including VAT (20%)','—'),line('delivery','Estimated delivery',lead(),'delivery'))}else{all.push(line('frame','Frame '+state.frame,amount(p.f.price)),line('wheels',p.w.name,signed(p.w.price)),line('drivetrain',p.d.name,signed(p.d.price)),line('color',p.c.name,signed(p.cp)));for(let a of accessories)if(state.accessories.has(a.id))all.push(line('accessory-'+a.id,a.name,'+'+amount(a.price)));all.push(line('unit','Unit price',amount(p.unit)),line('quantity','Quantity','× '+state.qty),line('subtotal','Subtotal',amount(p.sub)));if(state.qty>=3)all.push(line('qty-discount','Quantity discount (5%)','−'+amount(p.qd),'discount'));if(state.promo&&p.active&&p.pd>0)all.push(line('promo','Code '+state.promo,'−'+amount(p.pd),'discount'));all.push(line('shipping','Shipping',p.ship===0?'Free':amount(p.ship)),line('total','Total',amount(p.total),'total'),line('vat','Including VAT (20%)',amount(p.vat)),line('delivery','Estimated delivery',lead(),'delivery'))}all.forEach(x=>root.append(x));
let status=byTest('promo-status'),remove=byTest('promo-remove');if(!state.promo){status.hidden=true;remove.hidden=true}else{status.hidden=false;remove.hidden=false;status.classList.toggle('inactive',!p?.active);status.textContent=state.promo==='SPRING10'&&!p?.active?'SPRING10 requires €1,500.00 or more after the quantity discount.':state.promo==='WELCOME50'&&!p?.active?'WELCOME50 cannot be combined with the quantity discount.':`Code ${state.promo} applied.`}byTest('order-button').disabled=!(rec()&&state.frame);byTest('order-button').textContent=`Order ${state.qty} ${state.qty===1?'bike':'bikes'}`;byTest('order-hint').hidden=!!rec();byTest('qty-value').textContent=state.qty;byTest('qty-decrease').disabled=state.qty<=1;byTest('qty-increase').disabled=state.qty>=5}
function updateHeight(){let field=byTest('height-input'),v=state.height.trim(),valid=!!rec(),err=byTest('height-error'),r=rec();err.hidden=!v||valid;field.classList.toggle('invalid',!err.hidden);if(err.hidden){field.removeAttribute('aria-invalid');field.removeAttribute('aria-describedby')}else{field.setAttribute('aria-invalid','true');field.setAttribute('aria-describedby','height-error')}let recEl=byTest('height-recommendation');recEl.hidden=!valid;recEl.textContent=valid?`Recommended frame: ${r}`:'';if(state.auto&&valid&&state.frame!==r){let old=state.frame;state.frame=r;if(r==='S'&&state.wheels==='29'){state.wheels='275';setNotice('29" wheels were replaced by 27.5" wheels: not available with frame S.')}else if(old!==null){} }let warn=byTest('frame-warning'),idx=x=>frames.findIndex(f=>f.id===x),gap=state.frame&&valid?idx(state.frame)-idx(r):0;if(Math.abs(gap)>=2){warn.hidden=false;warn.textContent=`Frame ${state.frame} is ${Math.abs(gap)} sizes ${gap>0?'larger':'smaller'} than recommended.`}else warn.hidden=true}
function render(){updateHeight();drawCards();renderSummary();renderNotice();drawBike()}
const canvas=byTest('bike-preview'),ctx=canvas.getContext('2d');
function bikeParts(){let p=['frame','saddle','wheel-rear','wheel-front'];if(state.accessories.has('mudguards'))p.push('mudguard-rear','mudguard-front');if(state.accessories.has('rack'))p.push('rack');if(state.accessories.has('lights'))p.push('light');if(state.accessories.has('kickstand'))p.push('kickstand');return p}
window.bikePreviewState=()=>({yaw:state.yaw,pitch:state.pitch,parts:bikeParts()});
// World geometry and perspective helpers are shared by the picker and the renderer.
function vec(a,b,c){return[a,b,c]}function add(a,b){return a.map((x,i)=>x+b[i])}function sub(a,b){return a.map((x,i)=>x-b[i])}function mul(a,s){return a.map(x=>x*s)}function dot(a,b){return a.reduce((v,x,i)=>v+x*b[i],0)}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm(a){return Math.sqrt(dot(a,a))}function unit(a){return mul(a,1/norm(a))}const rad=d=>d*Math.PI/180;
function model(){let R=state.wheels==='29'?375:350,L=state.frame?({S:430,M:470,L:510,XL:550}[state.frame]):470,RA=[0,R,0],FA=[1080,R,0],BB=[420,300,0],ST=[420-.25*L,300+L,0],HT=[1000,340+L,0],HB=[1020,220+L,0],SP=add(ST,[-15,60,0]),HS=add(HT,[-60,60,0]),pr=[];let cap=(part,a,b,r,color)=>pr.push({part,type:'cap',a,b,r,color}),box=(part,a,b,color)=>pr.push({part,type:'box',a,b,color});let C=colors.find(c=>c.id===state.color).hex;cap('frame',BB,ST,18,C);cap('frame',ST,HT,18,C);cap('frame',BB,HB,20,C);cap('frame',HB,HT,20,C);cap('frame',ST,RA,16,C);cap('frame',BB,RA,16,C);cap('frame',HB,FA,16,C);cap('frame',ST,SP,13,C);cap('frame',HT,HS,15,C);cap('frame',add(HS,[0,0,-260]),add(HS,[0,0,260]),16,C);cap('saddle',add(SP,[-90,0,0]),add(SP,[80,0,0]),24,'#1C1C1E');for(let [part,A] of [['wheel-rear',RA],['wheel-front',FA]]){for(let k=0;k<36;k++){let pt=i=>add(A,[R*Math.cos(rad(10*i)),R*Math.sin(rad(10*i)),0]);cap(part,pt(k),pt((k+1)%36),22,'#1C1C1E')}cap(part,add(A,[0,0,-50]),add(A,[0,0,50]),15,'#1C1C1E')}if(state.accessories.has('mudguards'))for(let [part,A] of [['mudguard-rear',RA],['mudguard-front',FA]])for(let k=0;k<12;k++){let pt=i=>add(A,[(R+45)*Math.cos(rad(30+10*i)),(R+45)*Math.sin(rad(30+10*i)),0]);cap(part,pt(k),pt(k+1),25,'#2C2C2E')}if(state.accessories.has('rack')){box('rack',[-120,2*R+80,-90],[260,2*R+92,90],'#48484A');cap('rack',[-100,2*R+86,0],RA,14,'#48484A')}if(state.accessories.has('lights'))box('light',add(HT,[20,-60,-25]),add(HT,[70,-20,25]),'#FFD60A');if(state.accessories.has('kickstand'))cap('kickstand',[380,300,60],[300,0,160],20,'#8E8E93');return{R,L,pr}}
function camera(){let T=[540,450,0],D=3600,y=rad(state.yaw),p=rad(state.pitch),E=add(T,[D*Math.sin(y)*Math.cos(p),D*Math.sin(p),D*Math.cos(y)*Math.cos(p)]),f=unit(sub(T,E)),r=unit(cross(f,[0,1,0])),u=cross(r,f),W=canvas.clientWidth,H=canvas.clientHeight,F=(H/2)/Math.tan(rad(15));return{T,E,f,r,u,W,H,F}}

function hitBox(O,V,a,b){let lo=0,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(V[i])<1e-10){if(O[i]<a[i]||O[i]>b[i])return null}else{let t1=(a[i]-O[i])/V[i],t2=(b[i]-O[i])/V[i];lo=Math.max(lo,Math.min(t1,t2));hi=Math.min(hi,Math.max(t1,t2));if(hi<lo)return null}}return hi>=0?Math.max(0,lo):null}

window.bikePickAt=(px,py)=>{let c=camera(),V=rayAt(px,py,c),O=c.E,m=model(),best=Infinity,name=null;for(let p of m.pr){let t=p.type==='box'?hitBox(O,V,p.a,p.b):hitCap(O,V,p.a,p.b,p.r);if(t!==null&&t<best){best=t;name=p.part}}return name};
function drawBike(){let W=canvas.clientWidth,H=canvas.clientHeight;if(!W||!H)return;let dpr=window.devicePixelRatio||1;if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#EDEDF2';ctx.fillRect(0,0,W,H);let c=camera(),m=model();for(let p of m.pr){ctx.strokeStyle=p.color;ctx.fillStyle=p.color;let lighten=1;ctx.lineWidth=Math.max(1,p.type==='cap'?p.r*2*c.F/3600:2);ctx.lineCap='round';if(p.type==='box'){let corners=[];for(let x of [p.a[0],p.b[0]])for(let y of [p.a[1],p.b[1]])for(let z of [p.a[2],p.b[2]])corners.push(project([x,y,z],c));let xs=corners.map(x=>x[0]),ys=corners.map(x=>x[1]);ctx.fillRect(Math.min(...xs),Math.min(...ys),Math.max(1,Math.max(...xs)-Math.min(...xs)),Math.max(1,Math.max(...ys)-Math.min(...ys)))}else{let A=project(p.a,c),B=project(p.b,c);ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}}}
let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;state.yaw=((state.yaw+.9*dx)%360+360)%360;state.pitch=Math.max(-20,Math.min(60,state.pitch+.5*dy));drawBike()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('keydown',e=>{let handled=true;switch(e.key){case'ArrowLeft':state.yaw=(state.yaw+345)%360;break;case'ArrowRight':state.yaw=(state.yaw+15)%360;break;case'ArrowUp':state.pitch=Math.min(60,state.pitch+5);break;case'ArrowDown':state.pitch=Math.max(-20,state.pitch-5);break;case'Home':state.yaw=0;state.pitch=10;break;default:handled=false}if(handled){e.preventDefault();drawBike()}});new ResizeObserver(drawBike).observe(canvas);
