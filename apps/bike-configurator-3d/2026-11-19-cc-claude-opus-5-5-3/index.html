<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
:root{
  --color-bg:#F6F4F0;--color-surface:#FFFFFF;--color-text:#1B1A18;--color-muted:#67625B;--color-border:#DCD6CC;
  --color-accent:#0E6B58;--color-accent-contrast:#FFFFFF;--color-danger:#B42318;--color-disabled-bg:#ECE8E1;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --radius-control:8px;--radius-card:12px;--radius-pill:999px;
  --text-sm:14px;--text-md:16px;--text-lg:20px;--text-xl:28px;
  --duration-fast:150ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --color-bg:#121110;--color-surface:#1D1B19;--color-text:#F3F0EA;--color-muted:#A59F96;--color-border:#38342F;
    --color-accent:#3BC4A5;--color-accent-contrast:#0B0A09;--color-danger:#F97066;--color-disabled-bg:#2A2724;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--color-bg);color:var(--color-text);font-size:16px;line-height:24px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{max-width:1200px;margin:0 auto;padding:var(--space-5) 24px 0}
header h1{margin:0 0 var(--space-5);font-size:var(--text-xl);line-height:36px}
main{max-width:1200px;margin:0 auto;padding:0 24px 96px;display:grid;grid-template-columns:minmax(0,1fr) 360px;column-gap:32px;align-items:start}
main[hidden]{display:none}
#configurator{display:flex;flex-direction:column;gap:16px;min-width:0}
section.panel,#summary{background-color:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:24px}
section.panel h2,#summary h2{margin:0 0 var(--space-4);font-size:20px;font-weight:600;line-height:28px}
#summary{position:sticky;top:24px;min-width:0}
.grid{display:grid;gap:12px}
.c1{grid-template-columns:repeat(1,minmax(0,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1023.98px){
  header{padding:var(--space-4) 16px 0}
  main{grid-template-columns:minmax(0,1fr);padding:0 16px 96px;row-gap:32px}
  #summary{position:static}
  .n1{grid-template-columns:repeat(1,minmax(0,1fr))}.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.card{position:relative;display:flex;flex-direction:column;gap:var(--space-1);background-color:var(--color-surface);
  border:1px solid var(--color-border);border-radius:var(--radius-card);padding:16px;cursor:pointer;color:var(--color-text);
  transition:border-color var(--duration-fast),background-color var(--duration-fast),color var(--duration-fast)}
.card:hover:not(:has(input:checked)):not(:has(input:disabled)){border-color:var(--color-muted)}
.card:has(input:checked){border:2px solid var(--color-accent);padding:15px}
.card:has(input:disabled){opacity:.45;cursor:not-allowed}
.card:has(input:focus-visible){outline:2px solid var(--color-accent);outline-offset:2px}
.card input{position:absolute;opacity:0;width:1px;height:1px;margin:0;top:0;left:0;pointer-events:none}
.card [data-role="name"]{font-size:16px;font-weight:600;color:var(--color-text)}
.card [data-role="price"]{font-size:14px;color:var(--color-muted);font-variant-numeric:tabular-nums}
.card [data-role="check"]{display:none;position:absolute;top:8px;right:10px;color:var(--color-accent);font-weight:700}
.card:has(input:checked) [data-role="check"]{display:block}
.card [data-role="reason"]{display:none;font-size:14px;color:var(--color-muted)}
.card:has(input:disabled) [data-role="reason"]{display:block}
.card [data-role="badge"]{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background-color:var(--color-accent);
  color:var(--color-accent-contrast);border-radius:var(--radius-pill);font-size:14px;font-weight:600;padding:2px 8px;white-space:nowrap;line-height:20px}
.card [data-role="badge"][hidden]{display:none}
.card [data-role="swatch"]{width:32px;height:32px;border-radius:50%;border:1px solid var(--color-border);display:block}
.field label{display:block;font-weight:600;margin-bottom:var(--space-2)}
input[type="text"]{font:inherit;color:var(--color-text);background-color:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-control);height:40px;padding:0 var(--space-3);width:100%;max-width:320px}
input[type="text"]:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
#height-input.err{border-color:var(--color-danger)}
.error{color:var(--color-danger);font-size:14px;margin-top:var(--space-2)}
.info{margin-top:var(--space-2);font-size:14px}
.warn{margin-top:var(--space-2);font-size:14px;color:var(--color-danger)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;transition:border-color var(--duration-fast),background-color var(--duration-fast),color var(--duration-fast)}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.btn2{background-color:transparent;border:1px solid var(--color-border);color:var(--color-text);height:40px;border-radius:var(--radius-control);padding:0 var(--space-4)}
.btn2:disabled{opacity:.45;cursor:not-allowed}
#qty-decrease,#qty-increase{width:40px;padding:0}
.qty{display:flex;align-items:center;gap:var(--space-4)}
#qty-value{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
#bike-preview{display:block;width:100%;height:260px;border:0;padding:0;background:#EDEDF2;touch-action:none;user-select:none;cursor:grab}
#bike-preview:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.lines{margin:var(--space-4) 0}
.line{display:flex;align-items:baseline;gap:var(--space-3);padding:2px 0}
.line [data-role="label"]{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line [data-role="value"]{flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.line.disc [data-role="value"]{color:var(--color-accent)}
.line.total{border-top:1px solid var(--color-border);margin-top:var(--space-2);padding-top:var(--space-2)}
.line.total [data-role="label"],.line.total [data-role="value"]{font-size:28px;font-weight:700;line-height:36px}
.line.small{font-size:14px;color:var(--color-muted)}
.promo{margin-bottom:var(--space-4)}
.promo label{display:block;font-weight:600;margin-bottom:var(--space-2)}
.promo-row{display:flex;gap:var(--space-2)}
.promo-row input{flex:1 1 auto;min-width:0}
#promo-status{font-size:14px;margin-top:var(--space-2);color:var(--color-muted)}
#promo-status.active{color:var(--color-accent)}
#promo-remove{margin-top:var(--space-2)}
#order-button{display:block;width:100%;height:48px;border:none;border-radius:var(--radius-control);font-size:16px;font-weight:600;
  background-color:var(--color-accent);color:var(--color-accent-contrast)}
#order-button:disabled{background-color:var(--color-disabled-bg);color:var(--color-muted);cursor:not-allowed}
#order-hint{font-size:14px;color:var(--color-muted);margin-top:var(--space-2)}
#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(480px,calc(100vw - 32px));
  background-color:var(--color-surface);border-left:4px solid var(--color-accent);padding:12px 16px;border-radius:var(--radius-control);
  box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:10}
#confirmation{max-width:640px;margin:0 auto 48px;background-color:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:24px}
#confirmation h2{margin-top:0;font-size:20px;font-weight:600}
#confirmation dl{display:grid;grid-template-columns:auto 1fr;gap:var(--space-2) var(--space-4)}
#confirmation dd{margin:0;font-weight:600}
@media (max-width:1023.98px){#confirmation{margin:0 16px 48px}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}
}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main id="main">
  <div id="configurator" data-testid="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <div class="field">
        <label for="height-input">Your height (cm)</label>
        <input id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off" aria-describedby="height-error">
        <div id="height-error" class="error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</div>
        <div id="height-recommendation" class="info" data-testid="height-recommendation" hidden></div>
        <div id="frame-warning" class="warn" data-testid="frame-warning" hidden></div>
      </div>
    </section>
    <section class="panel" data-testid="section-frame"><h2>2. Frame</h2><div class="grid c4 n2" id="g-frame"></div></section>
    <section class="panel" data-testid="section-wheels"><h2>3. Wheels</h2><div class="grid c2 n2" id="g-wheels"></div></section>
    <section class="panel" data-testid="section-drivetrain"><h2>4. Drivetrain</h2><div class="grid c3 n1" id="g-drivetrain"></div></section>
    <section class="panel" data-testid="section-color"><h2>5. Color</h2><div class="grid c4 n2" id="g-color"></div></section>
    <section class="panel" data-testid="section-accessories"><h2>6. Accessories</h2><div class="grid c2 n2" id="g-accessory"></div></section>
    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="qty">
        <button type="button" class="btn2" id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">−</button>
        <span id="qty-value" data-testid="qty-value">1</span>
        <button type="button" class="btn2" id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>
  <aside id="summary" data-testid="summary">
    <canvas id="bike-preview" data-testid="bike-preview" tabindex="0" role="img" aria-label="Bike preview"></canvas>
    <div class="lines" id="lines"></div>
    <div class="promo">
      <label for="promo-input">Promo code</label>
      <div class="promo-row">
        <input id="promo-input" data-testid="promo-input" type="text" autocomplete="off" aria-describedby="promo-error">
        <button type="button" class="btn2" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <div id="promo-error" class="error" data-testid="promo-error" hidden>This code is not valid.</div>
      <div id="promo-status" data-testid="promo-status" hidden></div>
      <button type="button" class="btn2" id="promo-remove" data-testid="promo-remove" hidden>Remove code</button>
    </div>
    <button type="button" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
    <div id="order-hint" data-testid="order-hint">Enter your height to continue.</div>
  </aside>
</main>
<section id="confirmation" data-testid="confirmation" hidden>
  <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
  <dl>
    <dt>Reference</dt><dd data-testid="confirmation-reference" id="confirmation-reference"></dd>
    <dt>Total</dt><dd data-testid="confirmation-total" id="confirmation-total"></dd>
    <dt>Estimated delivery</dt><dd data-testid="confirmation-delivery" id="confirmation-delivery"></dd>
  </dl>
  <button type="button" class="btn2" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
</section>
<div role="status" id="status"><div id="notice" data-testid="notice" hidden></div></div>
<script>
(function(){
"use strict";
var FRAMES=[{id:"S",name:"Frame S",min:150,max:164,price:119000,L:430},{id:"M",name:"Frame M",min:165,max:174,price:119000,L:470},
  {id:"L",name:"Frame L",min:175,max:184,price:124000,L:510},{id:"XL",name:"Frame XL",min:185,max:200,price:129000,L:550}];
var WHEELS=[{id:"275",name:'27.5" wheels',price:0,R:350},{id:"29",name:'29" wheels',price:12000,R:375}];
var DRIVES=[{id:"essential",name:"Essential 1×10",price:0,lead:5},{id:"sport",name:"Sport 1×12",price:24000,lead:7},{id:"pro",name:"Pro Electronic 2×12",price:69000,lead:12}];
var COLORS=[{id:"graphite",name:"Graphite",hex:"#3A3A3C",price:0},{id:"sand",name:"Sand",hex:"#D8C7A6",price:0},
  {id:"red",name:"Racing Red",hex:"#C8102E",price:6000},{id:"glacier",name:"Glacier",hex:"#A9D6E5",price:0}];
var ACCS=[{id:"mudguards",name:"Mudguards",price:4500},{id:"rack",name:"Rear rack",price:6900},{id:"lights",name:"Lights",price:3990},{id:"kickstand",name:"Kickstand",price:2450}];
var CLOSED={"2026-12-24":1,"2026-12-25":1,"2026-12-31":1,"2027-01-01":1};
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function byId(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function $(id){return document.getElementById(id)}

function fmt(c){var e=Math.floor(c/100),ct=c%100;var s=String(e).replace(/\B(?=(\d{3})+(?!\d))/g,",");return "€"+s+"."+(ct<10?"0":"")+ct}
function signed(c){return c===0?"Included":"+"+fmt(c)}
function disc(c){return "−"+fmt(c)}
function rhu(a,b){return Math.floor((2*a+b)/(2*b))}
function fmtDate(d){return DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}
function pad(n,w){n=String(n);while(n.length<w)n="0"+n;return n}

var st,orderSeq=0,heightValid=false,heightVal=null,heightErr=false;
function fresh(){return {frame:null,auto:true,wheels:"275",drive:"essential",color:"graphite",acc:{},qty:1,code:null}}
st=fresh();

function card(group,o,type,name,extra){
  var l=document.createElement("label");l.className="card";l.setAttribute("data-testid","card-"+group+"-"+o.id);
  var inp=document.createElement("input");inp.type=type;inp.name=group;inp.value=o.id;inp.setAttribute("aria-label",o.name);
  l.appendChild(inp);
  if(extra==="swatch"){var sw=document.createElement("span");sw.setAttribute("data-role","swatch");sw.style.backgroundColor=o.hex;l.appendChild(sw)}
  var n=document.createElement("span");n.setAttribute("data-role","name");n.textContent=o.name;l.appendChild(n);
  var p=document.createElement("span");p.setAttribute("data-role","price");l.appendChild(p);
  var ck=document.createElement("span");ck.setAttribute("data-role","check");ck.setAttribute("aria-hidden","true");ck.textContent="✓";l.appendChild(ck);
  var r=document.createElement("span");r.setAttribute("data-role","reason");l.appendChild(r);
  if(extra==="badge"){var b=document.createElement("span");b.setAttribute("data-role","badge");b.textContent="Recommended";b.hidden=true;l.appendChild(b)}
  $("g-"+group).appendChild(l);
  return {label:l,input:inp,price:p,reason:r,badge:l.querySelector('[data-role="badge"]')};
}
var C={frame:{},wheels:{},drivetrain:{},color:{},accessory:{}};
FRAMES.forEach(function(o){C.frame[o.id]=card("frame",o,"radio",o.name,"badge");C.frame[o.id].price.textContent=fmt(o.price)});
WHEELS.forEach(function(o){C.wheels[o.id]=card("wheels",o,"radio");C.wheels[o.id].price.textContent=signed(o.price)});
DRIVES.forEach(function(o){C.drivetrain[o.id]=card("drivetrain",o,"radio");C.drivetrain[o.id].price.textContent=signed(o.price)});
COLORS.forEach(function(o){C.color[o.id]=card("color",o,"radio",o.name,"swatch");C.color[o.id].price.textContent=signed(o.price)});
ACCS.forEach(function(o){C.accessory[o.id]=card("accessory",o,"checkbox");C.accessory[o.id].price.textContent=signed(o.price)});
C.wheels["29"].reason.textContent="Not available with frame S";
C.color.glacier.reason.textContent="Out of stock";C.color.glacier.input.disabled=true;

var notice=$("notice");
function showNotice(m){notice.textContent=m;notice.hidden=false}
function hideNotice(){notice.hidden=true;notice.textContent=""}

function setFrame(id){
  st.frame=id;
  if(id==="S"&&st.wheels==="29"){st.wheels="275";showNotice('29" wheels were replaced by 27.5" wheels: not available with frame S.')}
}
function recommended(){if(!heightValid)return null;for(var i=0;i<FRAMES.length;i++)if(heightVal>=FRAMES[i].min&&heightVal<=FRAMES[i].max)return FRAMES[i].id;return null}

$("height-input").addEventListener("input",function(){
  hideNotice();
  var v=this.value.trim();
  heightValid=false;heightVal=null;heightErr=false;
  if(v!==""){
    if(/^\d+$/.test(v)){var n=parseInt(v,10);if(n>=150&&n<=200){heightValid=true;heightVal=n}}
    if(!heightValid)heightErr=true;
  }
  if(heightValid&&st.auto){var r=recommended();if(r!==st.frame)setFrame(r)}
  update();
});
FRAMES.forEach(function(o){
  var inp=C.frame[o.id].input;
  inp.addEventListener("click",function(){st.auto=false});
  inp.addEventListener("change",function(){if(inp.checked){hideNotice();st.auto=false;setFrame(o.id);update()}});
});
WHEELS.forEach(function(o){C.wheels[o.id].input.addEventListener("change",function(){if(this.checked){hideNotice();st.wheels=o.id;update()}})});
DRIVES.forEach(function(o){C.drivetrain[o.id].input.addEventListener("change",function(){if(this.checked){hideNotice();st.drive=o.id;update()}})});
COLORS.forEach(function(o){C.color[o.id].input.addEventListener("change",function(){if(this.checked&&o.id!=="glacier"){hideNotice();st.color=o.id}update()})});
ACCS.forEach(function(o){C.accessory[o.id].input.addEventListener("change",function(){
  hideNotice();var on=this.checked;st.acc[o.id]=on;
  if(o.id==="rack"&&on&&!st.acc.mudguards){st.acc.mudguards=true;showNotice("Mudguards were added: required by the rear rack.")}
  if(o.id==="mudguards"&&!on&&st.acc.rack){st.acc.rack=false;showNotice("Rear rack was removed: it requires mudguards.")}
  update();
})});
$("qty-decrease").addEventListener("click",function(){if(st.qty>1){hideNotice();st.qty--;update()}});
$("qty-increase").addEventListener("click",function(){if(st.qty<5){hideNotice();st.qty++;update()}});

var promoInput=$("promo-input"),promoErr=false;
promoInput.addEventListener("input",function(){if(promoErr){promoErr=false}update()});
promoInput.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(!$("promo-apply").disabled)applyCode()}});
$("promo-apply").addEventListener("click",applyCode);
function applyCode(){
  var v=promoInput.value.trim().toUpperCase();if(!v)return;
  if(v==="SPRING10"||v==="WELCOME50"||v==="FREESHIP"){st.code=v;promoInput.value="";promoErr=false}
  else promoErr=true;
  update();
}
$("promo-remove").addEventListener("click",function(){st.code=null;update()});

function compute(){
  var r={};
  var fr=byId(FRAMES,st.frame),wh=byId(WHEELS,st.wheels),dr=byId(DRIVES,st.drive),co=byId(COLORS,st.color);
  r.colorPrice=(st.color==="red"&&st.drive==="pro")?0:co.price;
  r.accs=ACCS.filter(function(a){return st.acc[a.id]});
  var lead=dr.lead+(st.color==="red"?3:0)+(st.qty>=3?2:0);
  var now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),cnt=0;
  r.today=d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2);
  while(cnt<lead){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    var k=d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);
    if(d.getDay()!==0&&d.getDay()!==6&&!CLOSED[k])cnt++}
  r.delivery=fmtDate(d);
  r.active=false;
  if(fr){
    r.unit=fr.price+wh.price+dr.price+r.colorPrice+r.accs.reduce(function(s,a){return s+a.price},0);
    r.sub=r.unit*st.qty;r.qd=st.qty>=3?rhu(r.sub*5,100):0;r.aq=r.sub-r.qd;
  }
  if(st.code==="FREESHIP")r.active=true;
  else if(st.code==="WELCOME50")r.active=st.qty<3;
  else if(st.code==="SPRING10")r.active=!!fr&&r.aq>=150000;
  if(fr){
    r.promo=0;if(r.active&&st.code==="SPRING10")r.promo=rhu(r.aq*10,100);if(r.active&&st.code==="WELCOME50")r.promo=5000;
    r.merch=r.aq-r.promo;r.ship=(st.code==="FREESHIP"||r.merch>=200000)?0:4900;r.total=r.merch+r.ship;r.vat=rhu(r.total*20,120);
  }
  r.fr=fr;r.wh=wh;r.dr=dr;r.co=co;
  return r;
}
var last;
function update(){
  var r=compute();last=r;
  // inputs
  FRAMES.forEach(function(o){C.frame[o.id].input.checked=st.frame===o.id});
  WHEELS.forEach(function(o){C.wheels[o.id].input.checked=st.wheels===o.id});
  DRIVES.forEach(function(o){C.drivetrain[o.id].input.checked=st.drive===o.id});
  COLORS.forEach(function(o){C.color[o.id].input.checked=st.color===o.id});
  ACCS.forEach(function(o){C.accessory[o.id].input.checked=!!st.acc[o.id]});
  C.wheels["29"].input.disabled=st.frame==="S";
  C.color.red.price.textContent=st.drive==="pro"?"Included with Pro":signed(6000);
  // height
  var hi=$("height-input");
  $("height-error").hidden=!heightErr;hi.classList.toggle("err",heightErr);
  if(heightErr)hi.setAttribute("aria-invalid","true");else hi.removeAttribute("aria-invalid");
  var rec=recommended();
  $("height-recommendation").hidden=!rec;$("height-recommendation").textContent=rec?"Recommended frame: "+rec:"";
  FRAMES.forEach(function(o){C.frame[o.id].badge.hidden=rec!==o.id});
  var fw=$("frame-warning"),showW=false;
  if(rec&&st.frame){var order=["S","M","L","XL"],gap=order.indexOf(st.frame)-order.indexOf(rec);
    if(Math.abs(gap)>=2){showW=true;fw.textContent="Frame "+st.frame+" is "+Math.abs(gap)+" sizes "+(gap>0?"larger":"smaller")+" than recommended."}}
  fw.hidden=!showW;

  var ps=$("promo-status");
  if(st.code){ps.hidden=false;$("promo-remove").hidden=false;ps.classList.toggle("active",r.active);
    ps.textContent=r.active?"Code "+st.code+" applied.":(st.code==="SPRING10"?"SPRING10 requires €1,500.00 or more after the quantity discount.":"WELCOME50 cannot be combined with the quantity discount.")}
  else{ps.hidden=true;$("promo-remove").hidden=true;ps.textContent=""}
  // lines
  var L=[],D="—";
  function line(k,l,v,cls){L.push('<div class="line'+(cls?" "+cls:"")+'" data-testid="summary-line-'+k+'"><span data-role="label">'+esc(l)+'</span><span data-role="value">'+esc(v)+'</span></div>')}
  line("frame",r.fr?r.fr.name:"Frame",r.fr?fmt(r.fr.price):D);
  line("wheels",r.wh.name,signed(r.wh.price));
  line("drivetrain",r.dr.name,signed(r.dr.price));
  line("color",r.co.name,signed(r.colorPrice));
  r.accs.forEach(function(a){line("accessory-"+a.id,a.name,signed(a.price))});
  line("unit","Unit price",r.fr?fmt(r.unit):D);
  line("quantity","Quantity","× "+st.qty);
  line("subtotal","Subtotal",r.fr?fmt(r.sub):D);
  if(r.fr&&st.qty>=3)line("qty-discount","Quantity discount (5%)",disc(r.qd),"disc");
  if(r.fr&&r.active&&r.promo>0)line("promo","Code "+st.code,disc(r.promo),"disc");
  line("shipping","Shipping",r.fr?(r.ship===0?"Free":fmt(r.ship)):D);
  line("total","Total",r.fr?fmt(r.total):D,"total");
  line("vat","Including VAT (20%)",r.fr?fmt(r.vat):D,"small");
  line("delivery","Estimated delivery",r.delivery);
  $("lines").innerHTML=L.join("");
  // order
  var ob=$("order-button");ob.textContent=st.qty===1?"Order 1 bike":"Order "+st.qty+" bikes";
  ob.disabled=!(heightValid&&st.frame);$("order-hint").hidden=heightValid;
  schedule();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

$("order-button").addEventListener("click",function(){
  if(!(heightValid&&st.frame))return;
  var r=last;orderSeq++;
  $("confirmation-reference").textContent="BK-"+r.today+"-"+pad(orderSeq,3);
  $("confirmation-total").textContent=fmt(r.total);
  $("confirmation-delivery").textContent=r.delivery;
  hideNotice();$("main").hidden=true;$("confirmation").hidden=false;$("confirmation-title").focus();

$("confirmation-new").addEventListener("click",function(){
  st=fresh();heightValid=false;heightVal=null;heightErr=false;promoErr=false;
  $("height-input").value="";promoInput.value="";hideNotice();
  $("confirmation").hidden=true;$("main").hidden=false;update();$("height-input").focus();
});

/* ---------- 3D preview ---------- */
var cv=$("bike-preview"),ctx=cv.getContext("2d");
var yaw=0,pitch=10;
function norm(y){y=y%360;if(y<0)y+=360;if(y>=360)y-=360;return y}
function clampP(p){return Math.max(-20,Math.min(60,p))}
function V(x,y,z){return [x,y,z]}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function mul(a,s){return [a[0]*s,a[1]*s,a[2]*s]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function nrm(a){var l=Math.sqrt(dot(a,a));return [a[0]/l,a[1]/l,a[2]/l]}
var RAD=Math.PI/180;
function hex(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function cap(P,Q,r){return {t:0,a:P,b:Q,r:r}}
function box(mn,mx){return {t:1,mn:mn,mx:mx}}
function buildModel(){
  var R=byId(WHEELS,st.wheels).R,fr=byId(FRAMES,st.frame),Lh=fr?fr.L:470,col=byId(COLORS,st.color).hex;
  var RA=V(0,R,0),FA=V(1080,R,0),BB=V(420,300,0),ST=V(420-0.25*Lh,300+Lh,0),HT=V(1000,340+Lh,0),HB=V(1020,220+Lh,0);
  var SP=add(ST,V(-15,60,0)),HS=add(HT,V(-60,60,0));
  var parts=[];
  parts.push({name:"frame",color:col,prims:[cap(BB,ST,18),cap(ST,HT,18),cap(BB,HB,20),cap(HB,HT,20),cap(ST,RA,16),cap(BB,RA,16),cap(HB,FA,16),cap(ST,SP,13),cap(HT,HS,15),cap(add(HS,V(0,0,-260)),add(HS,V(0,0,260)),16)]});
  parts.push({name:"saddle",color:"#1C1C1E",prims:[cap(add(SP,V(-90,0,0)),add(SP,V(80,0,0)),24)]});
  function wheel(A){var p=[],T=[];for(var k=0;k<36;k++)T.push(add(A,V(R*Math.cos(10*k*RAD),R*Math.sin(10*k*RAD),0)));
    for(k=0;k<36;k++)p.push(cap(T[k],T[(k+1)%36],22));p.push(cap(add(A,V(0,0,-50)),add(A,V(0,0,50)),15));return p}
  parts.push({name:"wheel-rear",color:"#1C1C1E",prims:wheel(RA)});
  parts.push({name:"wheel-front",color:"#1C1C1E",prims:wheel(FA)});
  function guard(A){var p=[],G=[];for(var k=0;k<=12;k++)G.push(add(A,V((R+45)*Math.cos((30+10*k)*RAD),(R+45)*Math.sin((30+10*k)*RAD),0)));
    for(k=0;k<12;k++)p.push(cap(G[k],G[k+1],25));return p}
  if(st.acc.mudguards){parts.push({name:"mudguard-rear",color:"#2C2C2E",prims:guard(RA)});parts.push({name:"mudguard-front",color:"#2C2C2E",prims:guard(FA)})}
  if(st.acc.rack)parts.push({name:"rack",color:"#48484A",prims:[box(V(-120,2*R+80,-90),V(260,2*R+92,90)),cap(V(-100,2*R+86,0),RA,14)]});
  if(st.acc.lights)parts.push({name:"light",color:"#FFD60A",prims:[box(add(HT,V(20,-60,-25)),add(HT,V(70,-20,25)))]});
  if(st.acc.kickstand)parts.push({name:"kickstand",color:"#8E8E93",prims:[cap(V(380,300,60),V(300,0,160),20)]});
  parts.forEach(function(pt){
    pt.rgb=hex(pt.color);
    var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
    pt.prims.forEach(function(q){
      var lo,hi;
      if(q.t===0){q.ba=sub(q.b,q.a);q.baba=dot(q.ba,q.ba);lo=[Math.min(q.a[0],q.b[0])-q.r,Math.min(q.a[1],q.b[1])-q.r,Math.min(q.a[2],q.b[2])-q.r];hi=[Math.max(q.a[0],q.b[0])+q.r,Math.max(q.a[1],q.b[1])+q.r,Math.max(q.a[2],q.b[2])+q.r];
        q.c=mul(add(q.a,q.b),0.5);q.br=Math.sqrt(q.baba)/2+q.r}
      else{lo=q.mn;hi=q.mx;q.c=mul(add(q.mn,q.mx),0.5);q.br=Math.sqrt(dot(sub(q.mx,q.mn),sub(q.mx,q.mn)))/2}
      for(var i=0;i<3;i++){mn[i]=Math.min(mn[i],lo[i]);mx[i]=Math.max(mx[i],hi[i])}
    });
    pt.c=mul(add(mn,mx),0.5);pt.br=Math.sqrt(dot(sub(mx,mn),sub(mx,mn)))/2+1;
  });
  return parts;
}
function sphereHit(ro,rd,c,r){var oc=sub(ro,c),b=dot(oc,rd),cc=dot(oc,oc)-r*r;return b*b-cc>=0}
function capHit(ro,rd,q){
  var ba=q.ba,oa=sub(ro,q.a),baba=q.baba,bard=dot(ba,rd),baoa=dot(ba,oa),rdoa=dot(rd,oa),oaoa=dot(oa,oa),r=q.r;
  var a=baba-bard*bard,best=-1;
  if(a>1e-9){
    var b=baba*rdoa-baoa*bard,c=baba*oaoa-baoa*baoa-r*r*baba,h=b*b-a*c;
    if(h<0)return -1;
    var t=(-b-Math.sqrt(h))/a,y=baoa+t*bard;
    if(y>0&&y<baba&&t>0)return t;
  }
  // end spheres
  for(var e=0;e<2;e++){var cen=e?q.b:q.a,oc=sub(ro,cen),bb=dot(rd,oc),cc=dot(oc,oc)-r*r,hh=bb*bb-cc;
    if(hh>=0){var tt=-bb-Math.sqrt(hh);if(tt>0&&(best<0||tt<best))best=tt}}
  return best;
}
function boxHit(ro,rd,q){
  var t0=-1e18,t1=1e18,ax=-1;
  for(var i=0;i<3;i++){
    if(Math.abs(rd[i])<1e-12){if(ro[i]<q.mn[i]||ro[i]>q.mx[i])return null;continue}
    var a=(q.mn[i]-ro[i])/rd[i],b=(q.mx[i]-ro[i])/rd[i];if(a>b){var s=a;a=b;b=s}
    if(a>t0){t0=a;ax=i}if(b<t1)t1=b;if(t0>t1)return null;
  }
  if(t0<=0)return null;
  var n=[0,0,0];n[ax]=rd[ax]>0?-1:1;return {t:t0,n:n};
}
var model=null,cam=null;
function camera(W,H){
  var th=yaw*RAD,ph=pitch*RAD,T=V(540,450,0);
  var off=V(Math.sin(th)*Math.cos(ph),Math.sin(ph),Math.cos(th)*Math.cos(ph));
  var E=add(T,mul(off,3600)),f=nrm(sub(T,E)),r=nrm(cross(f,V(0,1,0))),u=cross(r,f);
  return {E:E,f:f,r:r,u:u,W:W,H:H,F:(H/2)/Math.tan(15*RAD)};
}
function trace(c,px,py){
  var a=(px-c.W/2)/c.F,b=(py-c.H/2)/c.F;
  var rd=nrm([c.f[0]+a*c.r[0]-b*c.u[0],c.f[1]+a*c.r[1]-b*c.u[1],c.f[2]+a*c.r[2]-b*c.u[2]]),ro=c.E;
  var best=Infinity,bp=null,bq=null,bn=null;
  for(var i=0;i<model.length;i++){var pt=model[i];if(!sphereHit(ro,rd,pt.c,pt.br))continue;
    for(var j=0;j<pt.prims.length;j++){var q=pt.prims[j];if(!sphereHit(ro,rd,q.c,q.br))continue;
      if(q.t===0){var t=capHit(ro,rd,q);if(t>0&&t<best){best=t;bp=pt;bq=q;bn=null}}
      else{var h=boxHit(ro,rd,q);if(h&&h.t<best){best=h.t;bp=pt;bq=q;bn=h.n}}}}
  if(!bp)return null;
  if(!bn){var p=add(ro,mul(rd,best)),pa=sub(p,bq.a),k=Math.max(0,Math.min(1,dot(pa,bq.ba)/bq.baba));bn=nrm(sub(pa,mul(bq.ba,k)))}
  return {part:bp,s:0.4+0.6*Math.abs(dot(bn,rd))};
}
function size(){return {W:cv.clientWidth,H:cv.clientHeight}}
var pending=false;
function schedule(){model=buildModel();if(!pending){pending=true;requestAnimationFrame(draw)}}
function draw(){
  pending=false;var s=size();if(!s.W||!s.H)return;
  var dpr=window.devicePixelRatio||1,w=Math.round(s.W*dpr),h=Math.round(s.H*dpr);
  if(cv.width!==w)cv.width=w;if(cv.height!==h)cv.height=h;
  var c=camera(s.W,s.H),img=ctx.createImageData(w,h),d=img.data,o=0;
  for(var j=0;j<h;j++)for(var i=0;i<w;i++){
    var hit=trace(c,(i+0.5)/dpr,(j+0.5)/dpr);
    if(hit){var rgb=hit.part.rgb;d[o]=Math.round(rgb[0]*hit.s);d[o+1]=Math.round(rgb[1]*hit.s);d[o+2]=Math.round(rgb[2]*hit.s)}
    else{d[o]=0xED;d[o+1]=0xED;d[o+2]=0xF2}
    d[o+3]=255;o+=4;
  }
  ctx.putImageData(img,0,0);
}
window.bikePreviewState=function(){return {yaw:yaw,pitch:pitch,parts:buildModel().map(function(p){return p.name})}};
window.bikePickAt=function(px,py){model=buildModel();var s=size();var h=trace(camera(s.W,s.H),px,py);return h?h.part.name:null};
var drag=null;
cv.addEventListener("pointerdown",function(e){if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();cv.focus()});
cv.addEventListener("pointermove",function(e){
  if(!drag||e.pointerId!==drag.id)return;
  if(!(e.buttons&1)){drag=null;return}
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(dx||dy){yaw=norm(yaw+0.9*dx);pitch=clampP(pitch+0.5*dy);schedule()}
  e.preventDefault();
});
function endDrag(){drag=null}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("selectstart",function(e){e.preventDefault()});
cv.addEventListener("keydown",function(e){
  var k=e.key,ch=true;
  if(k==="ArrowRight")yaw=norm(yaw+15);else if(k==="ArrowLeft")yaw=norm(yaw-15);
  else if(k==="ArrowUp")pitch=clampP(pitch+5);else if(k==="ArrowDown")pitch=clampP(pitch-5);
  else if(k==="Home"){yaw=0;pitch=10}else ch=false;
  if(ch){e.preventDefault();schedule()}
});
if(window.ResizeObserver)new ResizeObserver(function(){schedule()}).observe(cv);
window.addEventListener("resize",schedule);
update();
})();
</script>
