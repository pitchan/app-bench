function camera(){const E=add([540,450,0],mul([Math.sin(yaw*rad)*Math.cos(pitch*rad),Math.sin(pitch*rad),Math.cos(yaw*rad)*Math.cos(pitch*rad)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return {E,f,r,u,F:130/Math.tan(15*rad),W:canvas.getBoundingClientRect().width,H:260}}
function ray(c,x,y){return add(c.f,sub(mul(c.r,(x-c.W/2)/c.F),mul(c.u,(y-c.H/2)/c.F)))}
function hit(p,o,d){if(p.box){let lo=0,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(o[i]<p.min[i]||o[i]>p.max[i])return Infinity;continue}let a=(p.min[i]-o[i])/d[i],b=(p.max[i]-o[i])/d[i];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}return lo}const ox=o[0]-p.a[0],oy=o[1]-p.a[1],oz=o[2]-p.a[2],v=p.v,dd=dot(d,d),vd=dot(v,d),vo=v[0]*ox+v[1]*oy+v[2]*oz,od=ox*d[0]+oy*d[1]+oz*d[2],oo=ox*ox+oy*oy+oz*oz,A=p.vv*dd-vd*vd,B=p.vv*od-vo*vd,C=p.vv*(oo-p.r*p.r)-vo*vo;let best=Infinity,h=B*B-A*C;if(h>=0&&Math.abs(A)>1e-10){const t=(-B-Math.sqrt(h))/A,y=vo+t*vd;if(t>=0&&y>=0&&y<=p.vv)best=t}for(const center of [p.a,p.b]){const x=o[0]-center[0],y=o[1]-center[1],z=o[2]-center[2],b=x*d[0]+y*d[1]+z*d[2],c=x*x+y*y+z*z-p.r*p.r,h=b*b-dd*c;if(h>=0){const t=(-b-Math.sqrt(h))/dd;if(t>=0&&t<best)best=t}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:parts.map(p=>p.name)});window.bikePickAt=(x,y)=>{const c=camera(),d=ray(c,x,y);let best=Infinity,name=null;for(const p of primitives){const t=hit(p,c.E,d);if(t<best){best=t;name=p.part.name}}return name};
function draw(){pending=false;const c=camera();if(!c.W)return;canvas.width=Math.round(c.W);canvas.height=260;const W=canvas.width,H=260,img=ctx.createImageData(W,H),depth=new Float64Array(W*H);depth.fill(Infinity);for(let i=0;i<img.data.length;i+=4){img.data[i]=237;img.data[i+1]=237;img.data[i+2]=242;img.data[i+3]=255}const rays=new Float64Array(W*H*3);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=ray(c,x+.5,y+.5),i=(y*W+x)*3;rays[i]=d[0];rays[i+1]=d[1];rays[i+2]=d[2]}for(const p of primitives){let xmin=W,xmax=0,ymin=H,ymax=0;for(let k=0;k<8;k++){const q=[k&1?p.max[0]:p.min[0],k&2?p.max[1]:p.min[1],k&4?p.max[2]:p.min[2]],v=sub(q,c.E),z=dot(v,c.f),x=c.W/2+c.F*dot(v,c.r)/z,y=130-c.F*dot(v,c.u)/z;xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}for(let y=Math.max(0,Math.floor(ymin));y<=Math.min(H-1,Math.ceil(ymax));y++)for(let x=Math.max(0,Math.floor(xmin));x<=Math.min(W-1,Math.ceil(xmax));x++){const i=y*W+x,d=[rays[i*3],rays[i*3+1],rays[i*3+2]],t=hit(p,c.E,d);if(t<depth[i]){depth[i]=t;for(let j=0;j<3;j++)img.data[i*4+j]=Math.round(p.part.rgb[j]*.86)}}}ctx.putImageData(img,0,0)}function scheduleDraw(){if(!pending){pending=true;requestAnimationFrame(draw)}}function turn(dy,dp){yaw=((yaw+dy)%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch+dp));scheduleDraw()}let drag=null;canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;turn(.9*(e.clientX-drag[0]),.5*(e.clientY-drag[1]));drag=[e.clientX,e.clientY]};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null};canvas.onkeydown=e=>{const keys={ArrowRight:[15,0],ArrowLeft:[-15,0],ArrowUp:[0,5],ArrowDown:[0,-5]};if(keys[e.key]){e.preventDefault();turn(...keys[e.key])}if(e.key==='Home'){e.preventDefault();yaw=0;pitch=10;scheduleDraw()}};new ResizeObserver(scheduleDraw).observe(canvas);render();
</script></body></html>
