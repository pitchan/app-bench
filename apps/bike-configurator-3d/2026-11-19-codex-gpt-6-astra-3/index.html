function buildModel(){parts=[];primitives=[];const R=state.wheels==='29'?375:350,L={S:430,M:470,L:510,XL:550}[state.frame]||470,RA=[0,R,0],FA=[1080,R,0],BB=[420,300,0],ST=[420-.25*L,300+L,0],HT=[1000,340+L,0],HB=[1020,220+L,0],SP=addV(ST,[-15,60,0]),HS=addV(HT,[-60,60,0]);let part;function start(name,color){part={name,color:color.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16))};parts.push(part)}function cap(a,b,r){const ba=sub(b,a);primitives.push({part,a,b,r,ba,baba:dot(ba,ba),min:a.map((v,i)=>Math.min(v,b[i])-r),max:a.map((v,i)=>Math.max(v,b[i])+r)})}function box(min,max){primitives.push({part,min,max,box:true})}function arc(center,r,start,end,tube){for(let k=start;k<end;k+=10)cap(addV(center,[r*Math.cos(k*rad),r*Math.sin(k*rad),0]),addV(center,[r*Math.cos((k+10)*rad),r*Math.sin((k+10)*rad),0]),tube)}start('frame',option('color')[3]);[[BB,ST,18],[ST,HT,18],[BB,HB,20],[HB,HT,20],[ST,RA,16],[BB,RA,16],[HB,FA,16],[ST,SP,13],[HT,HS,15],[addV(HS,[0,0,-260]),addV(HS,[0,0,260]),16]].forEach(v=>cap(...v));start('saddle','#1C1C1E');cap(addV(SP,[-90,0,0]),addV(SP,[80,0,0]),24);for(const [name,c] of [['wheel-rear',RA],['wheel-front',FA]]){start(name,'#1C1C1E');arc(c,R,0,360,22);cap(addV(c,[0,0,-50]),addV(c,[0,0,50]),15)}if(state.accessory.has('mudguards'))for(const [name,c] of [['mudguard-rear',RA],['mudguard-front',FA]]){start(name,'#2C2C2E');arc(c,R+45,30,150,25)}if(state.accessory.has('rack')){start('rack','#48484A');box([-120,2*R+80,-90],[260,2*R+92,90]);cap([-100,2*R+86,0],RA,14)}if(state.accessory.has('lights')){start('light','#FFD60A');box(addV(HT,[20,-60,-25]),addV(HT,[70,-20,25]))}if(state.accessory.has('kickstand')){start('kickstand','#8E8E93');cap([380,300,60],[300,0,160],20)}updateCamera()}
function updateCamera(){const t=yaw*rad,p=pitch*rad,E=addV([540,450,0],mul([Math.sin(t)*Math.cos(p),Math.sin(p),Math.cos(t)*Math.cos(p)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f);camera={E,f,r,u,W:canvas.clientWidth,H:260,F:130/Math.tan(15*rad)};for(const o of primitives){let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;for(const x of [o.min[0],o.max[0]])for(const y of [o.min[1],o.max[1]])for(const z of [o.min[2],o.max[2]]){const d=sub([x,y,z],E),depth=dot(d,f),sx=camera.W/2+camera.F*dot(d,r)/depth,sy=130-camera.F*dot(d,u)/depth;left=Math.min(left,sx);right=Math.max(right,sx);top=Math.min(top,sy);bottom=Math.max(bottom,sy)}o.screen=[left,top,right,bottom];o.oa=sub(E,o.a||o.min);if(!o.box){o.baoa=dot(o.ba,o.oa);o.oaoa=dot(o.oa,o.oa)}}}
function pick(px,py,candidates=primitives){const {E,f,r,u,W,H,F}=camera,dx=(px-W/2)/F,dy=-(py-H/2)/F,rd=norm([f[0]+dx*r[0]+dy*u[0],f[1]+dx*r[1]+dy*u[1],f[2]+dx*r[2]+dy*u[2]]);let closest=Infinity,hit=null;for(const o of candidates){if(o.screen&&(px<o.screen[0]||px>o.screen[2]||py<o.screen[1]||py>o.screen[3]))continue;let near=0,far=closest;for(let k=0;k<3;k++){if(Math.abs(rd[k])<1e-12){if(E[k]<o.min[k]||E[k]>o.max[k]){far=-1;break}}else{let a=(o.min[k]-E[k])/rd[k],b=(o.max[k]-E[k])/rd[k];if(a>b)[a,b]=[b,a];near=Math.max(near,a);far=Math.min(far,b)}}if(far<near)continue;let dist=Infinity;if(o.box)dist=near;else{const bard=dot(o.ba,rd),rdoa=dot(rd,o.oa),a=o.baba-bard*bard,b=o.baba*rdoa-o.baoa*bard,c=o.baba*o.oaoa-o.baoa*o.baoa-o.r*o.r*o.baba,h=b*b-a*c;if(h>=0&&Math.abs(a)>1e-10){const t=(-b-Math.sqrt(h))/a,y=o.baoa+t*bard;if(t>=0&&y>=0&&y<=o.baba)dist=t}for(const center of [o.a,o.b]){const ox=E[0]-center[0],oy=E[1]-center[1],oz=E[2]-center[2],b=rd[0]*ox+rd[1]*oy+rd[2]*oz,h=b*b-(ox*ox+oy*oy+oz*oz-o.r*o.r);if(h>=0){let t=-b-Math.sqrt(h);if(t>=0)dist=Math.min(dist,t)}}}if(dist<closest){closest=dist;hit=o.part}}return hit}
window.bikePreviewState=()=>({yaw,pitch,parts:parts.map(p=>p.name)});window.bikePickAt=(x,y)=>{updateCamera();return pick(x,y)?.name||null};
function scheduleDraw(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;updateCamera();if(!canvas.clientWidth)return;canvas.width=canvas.clientWidth;canvas.height=260;const im=ctx.createImageData(canvas.width,260),data=im.data;for(let y=0;y<260;y++){const candidates=primitives.filter(o=>y+.5>=o.screen[1]&&y+.5<=o.screen[3]);for(let x=0;x<canvas.width;x++){const p=pick(x+.5,y+.5,candidates),i=(y*canvas.width+x)*4,c=p?p.color:[237,237,242];data[i]=c[0];data[i+1]=c[1];data[i+2]=c[2];data[i+3]=255}}ctx.putImageData(im,0,0)})}
function turn(dx,dy){yaw=((yaw+dx)%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch+dy));updateCamera();scheduleDraw()}let drag=null;canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;turn(.9*(e.clientX-drag[0]),.5*(e.clientY-drag[1]));drag=[e.clientX,e.clientY]};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onkeydown=e=>{const keys={ArrowLeft:[-15,0],ArrowRight:[15,0],ArrowUp:[0,5],ArrowDown:[0,-5]};if(keys[e.key]){e.preventDefault();turn(...keys[e.key])}else if(e.key==='Home'){e.preventDefault();yaw=0;pitch=10;turn(0,0)}};new ResizeObserver(()=>{updateCamera();scheduleDraw()}).observe(canvas);render();
</script></body></html>
