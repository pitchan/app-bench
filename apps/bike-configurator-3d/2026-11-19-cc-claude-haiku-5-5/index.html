<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
:root[data-theme="dark"] {
  --color-bg: #121110;
  --color-surface: #1D1B19;
  --color-text: #F3F0EA;
  --color-muted: #A59F96;
  --color-border: #38342F;
  --color-accent: #3BC4A5;
  --color-accent-contrast: #0B0A09;
  --color-danger: #F97066;
  --color-disabled-bg: #2A2724;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 24px;
}

button {
  font-family: inherit;
  font-size: 16px;
  line-height: 24px;
  color: var(--color-text);
  cursor: pointer;
  transition-property: border-color, background-color, color;
  transition-duration: var(--duration-fast);
}
button:focus-visible,
canvas:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Header */
.app-header {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-5) var(--space-4) 0;
}
.app-header h1 {
  margin: 0;
  font-size: var(--text-xl);
  font-weight: 700;
}

/* Layout */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-5) var(--space-4);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-6);
  align-items: start;
}
.configurator {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}

/* Panels */
.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-5);
  min-width: 0;
}
.panel h2 {
  margin: 0 0 var(--space-4);
  font-size: var(--text-lg);
  font-weight: 600;
}

/* Field elements */
.field-label {
  display: block;
  margin-bottom: var(--space-2);
}
input[type="text"] {
  display: block;
  width: 100%;
  height: 40px;
  padding: 0 var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background: var(--color-surface);
  color: var(--color-text);
  font-family: inherit;
  font-size: 16px;
}
input[type="text"][aria-invalid="true"] {
  border-color: var(--color-danger);
}
.field-error {
  margin: var(--space-2) 0 0;
  font-size: var(--text-sm);
  color: var(--color-danger);
}
.field-hint {
  margin: var(--space-2) 0 0;
  font-size: var(--text-sm);
  color: var(--color-muted);
}
.field-warning {
  margin: var(--space-3) 0 0;
  font-size: var(--text-sm);
  color: var(--color-danger);
}

/* Option grids */
.grid {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid-drivetrain {
  grid-template-columns: minmax(0, 1fr);
}

/* Option cards */
.card {
  --card-border: 1px;
  position: relative;
  display: block;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-4);
  cursor: pointer;
  transition-property: border-color, background-color, color;
  transition-duration: var(--duration-fast);
}
.card:not(.is-selected):not(.is-disabled):hover {
  border-color: var(--color-muted);
}
.card.is-selected {
  --card-border: 2px;
  border: 2px solid var(--color-accent);
  padding: 15px;
}
.card.is-disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.card:has(input:focus-visible) {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.card input {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}
.card [data-role="name"] {
  display: block;
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--color-text);
}
.card [data-role="price"] {
  display: block;
  font-size: var(--text-sm);
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
}
.card [data-role="reason"] {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--text-sm);
  color: var(--color-muted);
}
.card [data-role="check"] {
  position: absolute;
  top: var(--space-2);
  right: var(--space-3);
  color: var(--color-accent);
  font-size: var(--text-md);
  font-weight: 700;
}
.card [data-role="badge"] {
  position: absolute;
  left: 50%;
  top: calc(-1 * var(--card-border));
  transform: translate(-50%, -50%);
  padding: 2px 8px;
  background: var(--color-accent);
  color: var(--color-accent-contrast);
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  font-weight: 600;
  white-space: nowrap;
}
.card [data-role="swatch"] {
  display: block;
  width: 32px;
  height: 32px;
  margin-bottom: var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: 50%;
}

/* Quantity */
.qty {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.qty-value {
  min-width: 40px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.btn {
  height: 40px;
  padding: 0 var(--space-4);
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn-qty {
  width: 40px;
  padding: 0;
}

/* Summary */
.summary {
  min-width: 0;
}
.summary canvas {
  display: block;
  width: 100%;
  height: 260px;
  margin: 0 0 var(--space-4);
  border: 0;
  padding: 0;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.lines {
  display: block;
}
.line {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-1) 0;
  white-space: nowrap;
}
.line > [data-role="label"] {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.line > [data-role="value"] {
  flex: 0 0 auto;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.line-discount > [data-role="value"] {
  color: var(--color-accent);
}
.line-total {
  margin-top: var(--space-2);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
  font-size: var(--text-xl);
  font-weight: 700;
}
.line-total > [data-role] {
  font-size: var(--text-xl);
  font-weight: 700;
}

/* Promo */
.promo {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}
.promo .field-label {
  display: block;
}
.promo-row {
  display: flex;
  gap: var(--space-2);
}
.promo-row input[type="text"] {
  flex: 1 1 auto;
  min-width: 0;
}
.promo-row .btn {
  flex: 0 0 auto;
}
.promo-status {
  margin: var(--space-2) 0 0;
  font-size: var(--text-sm);
  color: var(--color-muted);
}
.promo-status.is-active {
  color: var(--color-accent);
}
#promo-remove {
  margin-top: var(--space-2);
}

/* Order */
.btn-primary {
  display: block;
  width: 100%;
  height: 48px;
  margin-top: var(--space-5);
  border: 0;
  border-radius: var(--radius-control);
  background: var(--color-accent);
  color: var(--color-accent-contrast);
  font-size: var(--text-md);
  font-weight: 600;
}
.btn-primary:disabled {
  background: var(--color-disabled-bg);
  color: var(--color-muted);
  cursor: not-allowed;
}

/* Notice */
.notice {
  position: fixed;
  left: 50%;
  bottom: var(--space-5);
  transform: translateX(-50%);
  z-index: 10;
  width: min(480px, calc(100vw - 32px));
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface);
  color: var(--color-text);
  border-left: 4px solid var(--color-accent);
  border-radius: var(--radius-control);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

/* Confirmation */
.confirmation {
  max-width: min(560px, calc(100% - 32px));
  margin: var(--space-6) auto;
}
.confirmation h2 {
  font-size: var(--text-xl);
}
.conf-row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  margin: 0 0 var(--space-2);
}
.conf-row > span:last-child {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
#confirmation-new {
  margin-top: var(--space-4);
}

/* Wide layout */
@media (min-width: 1024px) {
  main {
    grid-template-columns: minmax(0, 1fr) 360px;
    padding: var(--space-5);
  }
  .summary {
    position: sticky;
    top: var(--space-5);
  }
  .app-header {
    padding: var(--space-5) var(--space-5) 0;
  }
  .grid-frame,
  .grid-color {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .grid-drivetrain {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }
}
</style>
</head>
<body>
<header class="app-header" data-testid="app-header">
  <h1>Claude Haiku 5.5</h1>
</header>

<main>
  <div class="configurator" data-testid="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <label class="field-label" for="height-input">Your height (cm)</label>
      <input type="text" id="height-input" data-testid="height-input" inputmode="numeric" autocomplete="off" aria-describedby="height-error">
      <p class="field-error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
      <p class="field-hint" data-testid="height-recommendation" hidden></p>
    </section>

    <section class="panel" data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="grid grid-frame" id="grid-frame"></div>
      <p class="field-warning" data-testid="frame-warning" hidden></p>
    </section>

    <section class="panel" data-testid="section-wheels">
      <h2>3. Wheels</h2>
      <div class="grid grid-wheels" id="grid-wheels"></div>
    </section>

    <section class="panel" data-testid="section-drivetrain">
      <h2>4. Drivetrain</h2>
      <div class="grid grid-drivetrain" id="grid-drivetrain"></div>
    </section>

    <section class="panel" data-testid="section-color">
      <h2>5. Color</h2>
      <div class="grid grid-color" id="grid-color"></div>
    </section>

    <section class="panel" data-testid="section-accessories">
      <h2>6. Accessories</h2>
      <div class="grid grid-accessories" id="grid-accessories"></div>
    </section>

    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="qty">
        <button type="button" class="btn btn-qty" data-testid="qty-decrease" id="qty-decrease" aria-label="Decrease quantity">−</button>
        <span class="qty-value" data-testid="qty-value" id="qty-value">1</span>
        <button type="button" class="btn btn-qty" data-testid="qty-increase" id="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>

  <aside class="panel summary" data-testid="summary">
    <canvas id="bike-preview" data-testid="bike-preview" role="img" aria-label="Bike preview" tabindex="0" width="310" height="260"></canvas>

    <div class="lines" id="lines"></div>

    <div class="promo">
      <label class="field-label" for="promo-input">Promo code</label>
      <div class="promo-row">
        <input type="text" id="promo-input" data-testid="promo-input" autocomplete="off" aria-describedby="promo-error">
        <button type="button" class="btn" data-testid="promo-apply" id="promo-apply" disabled>Apply</button>
      </div>
      <p class="field-error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
      <p class="promo-status" id="promo-status" data-testid="promo-status" hidden></p>
      <button type="button" class="btn" id="promo-remove" data-testid="promo-remove" hidden>Remove code</button>
    </div>

    <button type="button" class="btn-primary" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
    <p class="field-hint" id="order-hint" data-testid="order-hint">Enter your height to continue.</p>
  </aside>
</main>

<div role="status">
  <p class="notice" id="notice" data-testid="notice" hidden></p>
</div>

<section class="panel confirmation" id="confirmation" data-testid="confirmation" hidden>
  <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
  <p class="conf-row"><span>Reference</span><span id="confirmation-reference" data-testid="confirmation-reference"></span></p>
  <p class="conf-row"><span>Total</span><span id="confirmation-total" data-testid="confirmation-total"></span></p>
  <p class="conf-row"><span>Estimated delivery</span><span id="confirmation-delivery" data-testid="confirmation-delivery"></span></p>
  <button type="button" class="btn" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
</section>

<script>
(function () {
  'use strict';

  /* ---------- Catalog ---------- */

  const FRAMES = [
    { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000, seat: 430 },
    { id: 'M', name: 'Frame M', min: 165, max: 174, price: 119000, seat: 470 },
    { id: 'L', name: 'Frame L', min: 175, max: 184, price: 124000, seat: 510 },
    { id: 'XL', name: 'Frame XL', min: 185, max: 200, price: 129000, seat: 550 }
  ];
  const WHEELS = [
    { id: '275', name: '27.5" wheels', price: 0 },
    { id: '29', name: '29" wheels', price: 12000 }
  ];
  const DRIVETRAINS = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  const COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0, outOfStock: true }
  ];
  const ACCESSORIES = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  const PROMO_CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  const CLOSED_DAYS = ['2026-12-24', '2026-12-25', '2026-12-31', '2027-01-01'];
  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  const QTY_MIN = 1;
  const QTY_MAX = 5;

  const MSG = {
    m01: 'Enter a height between 150 and 200 cm.',
    m03: 'Frame {selected} is {n} sizes {direction} than recommended.',
    m04: 'Not available with frame S',
    m05: 'Out of stock',
    m06: 'Included with Pro',
    m07: '29" wheels were replaced by 27.5" wheels: not available with frame S.',
    m08: 'Mudguards were added: required by the rear rack.',
    m09: 'Rear rack was removed: it requires mudguards.',
    m10: 'This code is not valid.',
    m11: 'Code {code} applied.',
    m12: 'SPRING10 requires €1,500.00 or more after the quantity discount.',
    m13: 'WELCOME50 cannot be combined with the quantity discount.',
    m15: 'Enter your height to continue.',
    m16: 'Order confirmed'
  };

  const DASH = '—';
  const MINUS = '−';

  /* ---------- Elements ---------- */

  const $ = (id) => document.getElementById(id);
  const mainEl = document.querySelector('main');
  const heightInput = $('height-input');
  const heightError = $('height-error');
  const heightRec = $('height-recommendation');
  const frameWarning = $('frame-warning');
  const qtyDec = $('qty-decrease');
  const qtyInc = $('qty-increase');
  const qtyValue = $('qty-value');
  const promoInput = $('promo-input');
  const promoApply = $('promo-apply');
  const promoError = $('promo-error');
  const promoStatus = $('promo-status');
  const promoRemove = $('promo-remove');
  const orderBtn = $('order-button');
  const orderHint = $('order-hint');
  const notice = $('notice');
  const confirmation = $('confirmation');
  const confirmTitle = $('confirmation-title');
  const confirmRef = $('confirmation-reference');
  const confirmTotal = $('confirmation-total');
  const confirmDelivery = $('confirmation-delivery');
  const confirmNew = $('confirmation-new');
  const canvas = $('bike-preview');
  const ctx = canvas.getContext('2d');

  /* ---------- State ---------- */

  const state = {
    hValid: false,
    hError: false,
    hVal: 0,
    auto: true,
    frame: null,
    wheels: '275',
    drivetrain: 'essential',
    color: 'graphite',
    acc: { mudguards: false, rack: false, lights: false, kickstand: false },
    qty: 1,
    promo: null,
    promoErr: false,
    notice: null,
    orders: 0,
    yaw: 0,
    pitch: 10
  };

  function resetConfiguration() {
    state.hValid = false;
    state.hError = false;
    state.hVal = 0;
    state.auto = true;
    state.frame = null;
    state.wheels = '275';
    state.drivetrain = 'essential';
    state.color = 'graphite';
    state.acc = { mudguards: false, rack: false, lights: false, kickstand: false };
    state.qty = 1;
    state.promo = null;
    state.promoErr = false;
    state.notice = null;
    heightInput.value = '';
    promoInput.value = '';
  }

  /* ---------- Formatting and helpers ---------- */

  const pad2 = (n) => String(n).padStart(2, '0');
  const byId = (list, id) => list.find((o) => o.id === id);
  const sizeIndex = (id) => FRAMES.findIndex((f) => f.id === id);
  const recommendedFrame = (h) => FRAMES.find((f) => h >= f.min && h <= f.max);

  function amount(cents) {
    const euros = Math.floor(cents / 100);
    const rest = cents % 100;
    return '€' + String(euros).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(rest);
  }
  function signed(cents) {
    return cents === 0 ? 'Included' : '+' + amount(cents);
  }
  function discount(cents) {
    return MINUS + amount(cents);
  }
  function dateText(d) {
    return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  function ymd(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function ymdCompact(d) {
    return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  }
  function fill(template, values) {
    return template.replace(/\{(\w+)\}/g, (_, key) => values[key]);
  }

  function colorSurcharge() {
    if (state.color === 'red' && state.drivetrain === 'pro') return 0;
    return byId(COLORS, state.color).price;
  }

  /* ---------- Price ---------- */

  function calc() {
    const frame = byId(FRAMES, state.frame);
    if (!frame) return null;
    const wheels = byId(WHEELS, state.wheels);
    const drive = byId(DRIVETRAINS, state.drivetrain);
    let accessories = 0;
    for (const a of ACCESSORIES) {
      if (state.acc[a.id]) accessories += a.price;
    }
    const unit = frame.price + wheels.price + drive.price + colorSurcharge() + accessories;
    const subtotal = unit * state.qty;
    const qtyDiscount = state.qty >= 3 ? Math.floor((subtotal * 5 + 50) / 100) : 0;
    const afterQty = subtotal - qtyDiscount;
    let promo = 0;
    if (state.promo === 'SPRING10' && afterQty >= 150000) {
      promo = Math.floor((afterQty * 10 + 50) / 100);
    } else if (state.promo === 'WELCOME50' && state.qty < 3) {
      promo = 5000;
    }
    const merch = afterQty - promo;
    const shipping = state.promo === 'FREESHIP' || merch >= 200000 ? 0 : 4900;
    const total = merch + shipping;
    const vat = Math.floor((total * 20 + 60) / 120);
    return { frame, unit, subtotal, qtyDiscount, afterQty, promo, shipping, total, vat };
  }

  function promoActive(code) {
    if (code === 'FREESHIP') return true;
    if (code === 'WELCOME50') return state.qty < 3;
    const c = calc();
    return c !== null && c.afterQty >= 150000;
  }

  function deliveryDate() {
    const drive = byId(DRIVETRAINS, state.drivetrain);
    const lead = drive.lead + (state.color === 'red' ? 3 : 0) + (state.qty >= 3 ? 2 : 0);
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    let counted = 0;
    while (counted < lead) {
      d.setDate(d.getDate() + 1);
      const weekday = d.getDay();
      if (weekday !== 0 && weekday !== 6 && !CLOSED_DAYS.includes(ymd(d))) counted += 1;
    }
    return d;
  }

  /* ---------- Frame logic ---------- */

  function setFrame(id) {
    state.frame = id;
    if (id === 'S' && state.wheels === '29') {
      state.wheels = '275';
      state.notice = MSG.m07;
    }
  }

  /* ---------- Option cards ---------- */

  function addEl(parent, tag, role, text) {
    const e = document.createElement(tag);
    e.dataset.role = role;
    if (text) e.textContent = text;
    parent.appendChild(e);
    return e;
  }

  const cards = [];

  function makeCard(group, opt) {
    const el = document.createElement('label');
    el.className = 'card';
    el.dataset.testid = 'card-' + group + '-' + opt.id;

    const input = document.createElement('input');
    input.type = group === 'accessory' ? 'checkbox' : 'radio';
    if (group !== 'accessory') input.name = group;
    input.value = opt.id;
    input.setAttribute('aria-label', opt.name);
    el.appendChild(input);

    const card = { group, opt, el, input, badge: null, check: null, reason: null, price: null };
    if (group === 'frame') {
      card.badge = addEl(el, 'div', 'badge', 'Recommended');
      card.badge.hidden = true;
    }
    if (group === 'color') {
      const swatch = addEl(el, 'span', 'swatch');
      swatch.style.backgroundColor = opt.hex;
    }
    addEl(el, 'span', 'name', opt.name);
    card.price = addEl(el, 'span', 'price');
    card.check = addEl(el, 'span', 'check', '✓');
    card.check.hidden = true;
    card.reason = addEl(el, 'span', 'reason');
    card.reason.hidden = true;

    const onInput = () => onOption(card);
    input.addEventListener('click', onInput);
    input.addEventListener('change', onInput);
    return card;
  }

  function onOption(c) {
    const id = c.opt.id;
    if (c.group === 'accessory') {
      const checked = c.input.checked;
      if (checked === state.acc[id]) return;
      state.acc[id] = checked;
      state.notice = null;
      if (id === 'rack' && checked && !state.acc.mudguards) {
        state.acc.mudguards = true;
        state.notice = MSG.m08;
      }
      if (id === 'mudguards' && !checked && state.acc.rack) {
        state.acc.rack = false;
        state.notice = MSG.m09;
      }
    } else if (c.group === 'frame') {
      state.auto = false;
      if (id !== state.frame) {
        state.notice = null;
        setFrame(id);
      }
    } else if (c.group === 'wheels') {
      if (id !== state.wheels) {
        state.wheels = id;
        state.notice = null;
      }
    } else if (c.group === 'drivetrain') {
      if (id !== state.drivetrain) {
        state.drivetrain = id;
        state.notice = null;
      }
    } else if (c.group === 'color') {
      if (id !== state.color) {
        state.color = id;
        state.notice = null;
      }
    }
    update();
  }

  function refreshCard(c, rec) {
    const opt = c.opt;
    let selected = false;
    let disabled = false;
    let reason = '';
    let price = '';
    switch (c.group) {
      case 'frame':
        selected = state.frame === opt.id;
        price = amount(opt.price);
        c.badge.hidden = !(rec && rec.id === opt.id);
        break;
      case 'wheels':
        selected = state.wheels === opt.id;
        disabled = opt.id === '29' && state.frame === 'S';
        reason = MSG.m04;
        price = signed(opt.price);
        break;
      case 'drivetrain':
        selected = state.drivetrain === opt.id;
        price = signed(opt.price);
        break;
      case 'color':
        selected = state.color === opt.id;
        disabled = !!opt.outOfStock;
        reason = MSG.m05;
        price = opt.id === 'red' && state.drivetrain === 'pro' ? MSG.m06 : signed(opt.price);
        break;
      case 'accessory':
        selected = !!state.acc[opt.id];
        price = signed(opt.price);
        break;
    }
    c.input.checked = selected;
    c.input.disabled = disabled;
    c.el.classList.toggle('is-selected', selected);
    c.el.classList.toggle('is-disabled', disabled);
    c.check.hidden = !selected;
    c.reason.hidden = !disabled;
    c.reason.textContent = reason;
    c.price.textContent = price;
  }

  /* ---------- Summary lines ---------- */

  const lines = {};
  const LINE_KEYS = [
    ['frame'], ['wheels'], ['drivetrain'], ['color'],
    ...ACCESSORIES.map((a) => ['accessory-' + a.id]),
    ['unit'], ['quantity'], ['subtotal'],
    ['qty-discount', 'line-discount'], ['promo', 'line-discount'],
    ['shipping'], ['total', 'line-total'], ['vat'], ['delivery']
  ];

  function buildLines() {
    const container = $('lines');
    for (const [key, cls] of LINE_KEYS) {
      const el = document.createElement('div');
      el.className = 'line' + (cls ? ' ' + cls : '');
      el.dataset.testid = 'summary-line-' + key;
      addEl(el, 'span', 'label');
      addEl(el, 'span', 'value');
      container.appendChild(el);
      lines[key] = el;
    }
  }

  function setLine(key, label, value, visible) {
    const el = lines[key];
    el.hidden = !visible;
    el.querySelector('[data-role="label"]').textContent = label;
    el.querySelector('[data-role="value"]').textContent = value;
  }

  function refreshSummary(c, delivery) {
    const frame = byId(FRAMES, state.frame);
    const wheels = byId(WHEELS, state.wheels);
    const drive = byId(DRIVETRAINS, state.drivetrain);
    const color = byId(COLORS, state.color);

    setLine('frame', frame ? 'Frame ' + frame.id : 'Frame', frame ? amount(frame.price) : DASH, true);
    setLine('wheels', wheels.name, signed(wheels.price), true);
    setLine('drivetrain', drive.name, signed(drive.price), true);
    setLine('color', color.name, signed(colorSurcharge()), true);
    for (const a of ACCESSORIES) {
      setLine('accessory-' + a.id, a.name, signed(a.price), !!state.acc[a.id]);
    }
    setLine('unit', 'Unit price', c ? amount(c.unit) : DASH, true);
    setLine('quantity', 'Quantity', '× ' + state.qty, true);
    setLine('subtotal', 'Subtotal', c ? amount(c.subtotal) : DASH, true);
    setLine('qty-discount', 'Quantity discount (5%)', c ? discount(c.qtyDiscount) : '',
      !!c && state.qty >= 3);
    setLine('promo', state.promo ? 'Code ' + state.promo : 'Code', c ? discount(c.promo) : '',
      !!c && c.promo > 0);
    setLine('shipping', 'Shipping', c ? (c.shipping === 0 ? 'Free' : amount(c.shipping)) : DASH, true);
    setLine('total', 'Total', c ? amount(c.total) : DASH, true);
    setLine('vat', 'Including VAT (20%)', c ? amount(c.vat) : DASH, true);
    setLine('delivery', 'Estimated delivery', dateText(delivery), true);
  }

  /* ---------- Promo ---------- */

  function applyPromo() {
    const code = promoInput.value.trim().toUpperCase();
    if (PROMO_CODES.includes(code)) {
      state.promo = code;
      state.promoErr = false;
      promoInput.value = '';
    } else {
      state.promoErr = true;
    }
    update();
  }

  function refreshPromo() {
    promoApply.disabled = promoInput.value.trim() === '';
    promoInput.setAttribute('aria-invalid', state.promoErr ? 'true' : 'false');
    promoError.hidden = !state.promoErr;
    if (state.promo) {
      const active = promoActive(state.promo);
      promoStatus.hidden = false;
      promoStatus.textContent = active
        ? fill(MSG.m11, { code: state.promo })
        : (state.promo === 'SPRING10' ? MSG.m12 : MSG.m13);
      promoStatus.classList.toggle('is-active', active);
      promoRemove.hidden = false;
    } else {
      promoStatus.hidden = true;
      promoStatus.textContent = '';
      promoStatus.classList.remove('is-active');
      promoRemove.hidden = true;
    }
  }

  /* ---------- Order ---------- */

  function placeOrder() {
    if (orderBtn.disabled) return;
    const c = calc();
    const delivery = deliveryDate();
    const today = new Date();
    state.orders += 1;
    state.notice = null;
    confirmRef.textContent = 'BK-' + ymdCompact(today) + '-' + String(state.orders).padStart(3, '0');
    confirmTotal.textContent = amount(c.total);
    confirmDelivery.textContent = dateText(delivery);
    mainEl.hidden = true;
    confirmation.hidden = false;
    update();
    confirmTitle.focus();
  }

  function newConfiguration() {
    resetConfiguration();
    mainEl.hidden = false;
    confirmation.hidden = true;
    update();
    heightInput.focus();
  }

  /* ---------- 3D preview: geometry ---------- */

  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => Math.sqrt(dot(a, a));
  const normalize = (a) => {
    const n = norm(a);
    return [a[0] / n, a[1] / n, a[2] / n];
  };
  const cap = (P, Q, r) => ({ box: false, P, Q, r });
  const box = (mn, mx) => ({ box: true, mn, mx });
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const hexRgb = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];

  function wheelPrims(c, R) {
    const prims = [];
    const ring = (k) => add(c, [R * Math.cos(10 * k * Math.PI / 180), R * Math.sin(10 * k * Math.PI / 180), 0]);
    for (let k = 0; k < 36; k++) {
      prims.push(cap(ring(k), ring((k + 1) % 36), 22));
    }
    prims.push(cap(add(c, [0, 0, -50]), add(c, [0, 0, 50]), 15));
    return prims;
  }

  function mudguardPrims(c, R) {
    const prims = [];
    const g = (k) => add(c, [
      (R + 45) * Math.cos((30 + 10 * k) * Math.PI / 180),
      (R + 45) * Math.sin((30 + 10 * k) * Math.PI / 180),
      0
    ]);
    for (let k = 0; k < 12; k++) {
      prims.push(cap(g(k), g(k + 1), 25));
    }
    return prims;
  }

  function buildParts() {
    const frame = byId(FRAMES, state.frame);
    const R = state.wheels === '29' ? 375 : 350;
    const L = frame ? frame.seat : 470;
    const C = byId(COLORS, state.color).hex;
    const RA = [0, R, 0];
    const FA = [1080, R, 0];
    const BB = [420, 300, 0];
    const ST = [420 - 0.25 * L, 300 + L, 0];
    const HT = [1000, 340 + L, 0];
    const HB = [1020, 220 + L, 0];
    const SP = add(ST, [-15, 60, 0]);
    const HS = add(HT, [-60, 60, 0]);

    const parts = [
      {
        name: 'frame', color: C, prims: [
          cap(BB, ST, 18), cap(ST, HT, 18), cap(BB, HB, 20), cap(HB, HT, 20),
          cap(ST, RA, 16), cap(BB, RA, 16), cap(HB, FA, 16), cap(ST, SP, 13),
          cap(HT, HS, 15), cap(add(HS, [0, 0, -260]), add(HS, [0, 0, 260]), 16)
        ]
      },
      { name: 'saddle', color: '#1C1C1E', prims: [cap(add(SP, [-90, 0, 0]), add(SP, [80, 0, 0]), 24)] },
      { name: 'wheel-rear', color: '#1C1C1E', prims: wheelPrims(RA, R) },
      { name: 'wheel-front', color: '#1C1C1E', prims: wheelPrims(FA, R) }
    ];
    if (state.acc.mudguards) {
      parts.push({ name: 'mudguard-rear', color: '#2C2C2E', prims: mudguardPrims(RA, R) });
      parts.push({ name: 'mudguard-front', color: '#2C2C2E', prims: mudguardPrims(FA, R) });
    }
    if (state.acc.rack) {
      parts.push({
        name: 'rack', color: '#48484A', prims: [
          box([-120, 2 * R + 80, -90], [260, 2 * R + 92, 90]),
          cap([-100, 2 * R + 86, 0], RA, 14)
        ]
      });
    }
    if (state.acc.lights) {
      parts.push({ name: 'light', color: '#FFD60A', prims: [box(add(HT, [20, -60, -25]), add(HT, [70, -20, 25]))] });
    }
    if (state.acc.kickstand) {
      parts.push({ name: 'kickstand', color: '#8E8E93', prims: [cap([380, 300, 60], [300, 0, 160], 20)] });
    }
    return parts;
  }

  /* ---------- 3D preview: camera, projection, picking ---------- */

  function buildScene(parts) {
    const W = canvas.clientWidth || 310;
    const H = canvas.clientHeight || 260;
    const th = state.yaw * Math.PI / 180;
    const ph = state.pitch * Math.PI / 180;
    const T = [540, 450, 0];
    const D = 3600;
    const E = [
      T[0] + D * Math.sin(th) * Math.cos(ph),
      T[1] + D * Math.sin(ph),
      T[2] + D * Math.cos(th) * Math.cos(ph)
    ];
    const f = normalize(sub(T, E));
    const r = normalize(cross(f, [0, 1, 0]));
    const u = cross(r, f);
    const F = (H / 2) / Math.tan(15 * Math.PI / 180);
    const sc = { W, H, E, f, r, u, F, parts: [], prims: [] };

    parts.forEach((part, pi) => {
      sc.parts.push({ name: part.name, rgb: hexRgb(part.color) });
      for (const p of part.prims) {
        sc.prims.push(prepare(p, pi, sc));
      }
    });
    return sc;
  }

  function project(sc, p) {
    const d = sub(p, sc.E);
    const z = dot(d, sc.f);
    return [
      sc.W / 2 + sc.F * dot(d, sc.r) / z,
      sc.H / 2 - sc.F * dot(d, sc.u) / z
    ];
  }

  function prepare(p, part, sc) {
    const q = { part, box: p.box };
    let mn;
    let mx;
    if (p.box) {
      q.mn = p.mn;
      q.mx = p.mx;
      mn = p.mn;
      mx = p.mx;
    } else {
      q.P = p.P;
      q.Q = p.Q;
      q.r = p.r;
      const d = sub(p.Q, p.P);
      q.len = norm(d);
      q.A = [d[0] / q.len, d[1] / q.len, d[2] / q.len];
      mn = [Math.min(p.P[0], p.Q[0]) - p.r, Math.min(p.P[1], p.Q[1]) - p.r, Math.min(p.P[2], p.Q[2]) - p.r];
      mx = [Math.max(p.P[0], p.Q[0]) + p.r, Math.max(p.P[1], p.Q[1]) + p.r, Math.max(p.P[2], p.Q[2]) + p.r];
    }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let k = 0; k < 8; k++) {
      const corner = [
        k & 1 ? mx[0] : mn[0],
        k & 2 ? mx[1] : mn[1],
        k & 4 ? mx[2] : mn[2]
      ];
      const s = project(sc, corner);
      if (s[0] < x0) x0 = s[0];
      if (s[0] > x1) x1 = s[0];
      if (s[1] < y0) y0 = s[1];
      if (s[1] > y1) y1 = s[1];
    }
    q.x0 = x0 - 1;
    q.x1 = x1 + 1;
    q.y0 = y0 - 1;
    q.y1 = y1 + 1;
    return q;
  }

  function hitCapsule(c, o, d) {
    let best = Infinity;
    const sphere = (C) => {
      const w = sub(o, C);
      const b = dot(w, d);
      const disc = b * b - (dot(w, w) - c.r * c.r);
      if (disc < 0) return;
      const t = -b - Math.sqrt(disc);
      if (t >= 0 && t < best) best = t;
    };
    sphere(c.P);
    sphere(c.Q);

    const w = sub(o, c.P);
    const wa = dot(w, c.A);
    const da = dot(d, c.A);
    const wp = [w[0] - wa * c.A[0], w[1] - wa * c.A[1], w[2] - wa * c.A[2]];
    const dp = [d[0] - da * c.A[0], d[1] - da * c.A[1], d[2] - da * c.A[2]];
    const a = dot(dp, dp);
    const b = 2 * dot(wp, dp);
    const cc = dot(wp, wp) - c.r * c.r;
    if (a > 1e-12) {
      const disc = b * b - 4 * a * cc;
      if (disc >= 0) {
        const sq = Math.sqrt(disc);
        const roots = [(-b - sq) / (2 * a), (-b + sq) / (2 * a)];
        for (const t of roots) {
          if (t >= 0 && t < best) {
            const s = wa + t * da;
            if (s >= 0 && s <= c.len) best = t;
          }
        }
      }
    }
    return best;
  }

  function hitBox(bx, o, d) {
    let t0 = -Infinity;
    let t1 = Infinity;
    for (let k = 0; k < 3; k++) {
      if (Math.abs(d[k]) < 1e-12) {
        if (o[k] < bx.mn[k] || o[k] > bx.mx[k]) return Infinity;
        continue;
      }
      let a = (bx.mn[k] - o[k]) / d[k];
      let b = (bx.mx[k] - o[k]) / d[k];
      if (a > b) {
        const tmp = a;
        a = b;
        b = tmp;
      }
      if (a > t0) t0 = a;
      if (b < t1) t1 = b;
    }
    if (t0 > t1 || t1 < 0) return Infinity;
    return t0 < 0 ? 0 : t0;
  }

  function pickAt(sc, px, py) {
    const ax = (px - sc.W / 2) / sc.F;
    const ay = (py - sc.H / 2) / sc.F;
    const d = normalize([
      sc.f[0] + ax * sc.r[0] - ay * sc.u[0],
      sc.f[1] + ax * sc.r[1] - ay * sc.u[1],
      sc.f[2] + ax * sc.r[2] - ay * sc.u[2]
    ]);
    let best = Infinity;
    let part = -1;
    for (const p of sc.prims) {
      if (px < p.x0 || px > p.x1 || py < p.y0 || py > p.y1) continue;
      const t = p.box ? hitBox(p, sc.E, d) : hitCapsule(p, sc.E, d);
      if (t < best) {
        best = t;
        part = p.part;
      }
    }
    return { part, t: best };
  }

  /* ---------- 3D preview: drawing and view ---------- */

  let lastCanvasKey = '';

  function draw() {
    const sc = buildScene(buildParts());
    canvas.width = sc.W;
    canvas.height = sc.H;
    const img = ctx.createImageData(sc.W, sc.H);
    const data = img.data;
    for (let j = 0; j < sc.H; j++) {
      for (let i = 0; i < sc.W; i++) {
        const hit = pickAt(sc, i + 0.5, j + 0.5);
        let red = 237;
        let green = 237;
        let blue = 242;
        if (hit.part >= 0) {
          const s = 1 - 0.6 * clamp((hit.t - 2800) / 1600, 0, 1);
          const c = sc.parts[hit.part].rgb;
          red = Math.round(s * c[0]);
          green = Math.round(s * c[1]);
          blue = Math.round(s * c[2]);
        }
        const o = (j * sc.W + i) * 4;
        data[o] = red;
        data[o + 1] = green;
        data[o + 2] = blue;
        data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function refreshCanvas() {
    const key = [
      state.wheels, state.frame, state.color,
      state.acc.mudguards, state.acc.rack, state.acc.lights, state.acc.kickstand,
      state.yaw, state.pitch, canvas.clientWidth, canvas.clientHeight
    ].join('|');
    if (key === lastCanvasKey) return;
    lastCanvasKey = key;
    draw();
  }

  function setView(yaw, pitch) {
    state.yaw = ((yaw % 360) + 360) % 360;
    state.pitch = clamp(pitch, -20, 60);
    refreshCanvas();
  }

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY };
    canvas.focus();
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;
    setView(state.yaw + 0.9 * dx, state.pitch + 0.5 * dy);
  });
  const endDrag = () => {
    drag = null;
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('keydown', (e) => {
    const actions = {
      ArrowRight: () => setView(state.yaw + 15, state.pitch),
      ArrowLeft: () => setView(state.yaw - 15, state.pitch),
      ArrowUp: () => setView(state.yaw, state.pitch + 5),
      ArrowDown: () => setView(state.yaw, state.pitch - 5),
      Home: () => setView(0, 10)
    };
    const action = actions[e.key];
    if (!action) return;
    e.preventDefault();
    action();
  });

  if ('ResizeObserver' in window) {
    new ResizeObserver(() => refreshCanvas()).observe(canvas);
  }

  window.bikePreviewState = function () {
    return { yaw: state.yaw, pitch: state.pitch, parts: buildParts().map((p) => p.name) };
  };
  window.bikePickAt = function (px, py) {
    const parts = buildParts();
    const sc = buildScene(parts);
    const hit = pickAt(sc, px, py);
    return hit.part < 0 ? null : parts[hit.part].name;
  };

  /* ---------- Rendering ---------- */

  function update() {
    const rec = state.hValid ? recommendedFrame(state.hVal) : null;
    const c = calc();
    const delivery = deliveryDate();

    // Rider and frame
    heightInput.setAttribute('aria-invalid', state.hError ? 'true' : 'false');
    heightError.hidden = !state.hError;
    heightRec.hidden = !rec;
    if (rec) heightRec.textContent = 'Recommended frame: ' + rec.id;

    let warning = '';
    if (rec && state.frame) {
      const selected = sizeIndex(state.frame);
      const recommended = sizeIndex(rec.id);
      const gap = Math.abs(selected - recommended);
      if (gap >= 2) {
        warning = fill(MSG.m03, {
          selected: state.frame,
          n: gap,
          direction: selected > recommended ? 'larger' : 'smaller'
        });
      }
    }
    frameWarning.hidden = !warning;
    frameWarning.textContent = warning;

    for (const card of cards) refreshCard(card, rec);

    // Quantity
    qtyValue.textContent = String(state.qty);
    qtyDec.disabled = state.qty <= QTY_MIN;
    qtyInc.disabled = state.qty >= QTY_MAX;

    refreshSummary(c, delivery);
    refreshPromo();

    // Order
    orderBtn.textContent = state.qty === 1 ? 'Order 1 bike' : 'Order ' + state.qty + ' bikes';
    orderBtn.disabled = !(state.hValid && state.frame);
    orderHint.hidden = state.hValid;

    // Notice
    notice.hidden = !state.notice;
    notice.textContent = state.notice || '';

    refreshCanvas();
  }

  /* ---------- Events ---------- */

  function onHeight() {
    const t = heightInput.value.trim();
    state.hValid = /^\d+$/.test(t) && Number(t) >= 150 && Number(t) <= 200;
    state.hError = t !== '' && !state.hValid;
    state.hVal = state.hValid ? Number(t) : 0;
    state.notice = null;
    if (state.hValid && state.auto) {
      setFrame(recommendedFrame(state.hVal).id);
    }
    update();
  }

  function changeQty(delta) {
    const next = clamp(state.qty + delta, QTY_MIN, QTY_MAX);
    if (next === state.qty) return;
    state.qty = next;
    state.notice = null;
    update();
  }

  heightInput.addEventListener('input', onHeight);
  qtyDec.addEventListener('click', () => changeQty(-1));
  qtyInc.addEventListener('click', () => changeQty(1));
  promoInput.addEventListener('input', () => {
    state.promoErr = false;
    update();
  });
  promoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !promoApply.disabled) {
      e.preventDefault();
      applyPromo();
    }
  });
  promoApply.addEventListener('click', applyPromo);
  promoRemove.addEventListener('click', () => {
    state.promo = null;
    update();
  });
  orderBtn.addEventListener('click', placeOrder);
  confirmNew.addEventListener('click', newConfiguration);

  /* ---------- Build the page ---------- */

  const GRIDS = [
    ['grid-frame', 'frame', FRAMES],
    ['grid-wheels', 'wheels', WHEELS],
    ['grid-drivetrain', 'drivetrain', DRIVETRAINS],
    ['grid-color', 'color', COLORS],
    ['grid-accessories', 'accessory', ACCESSORIES]
  ];
  for (const [gridId, group, options] of GRIDS) {
    const grid = $(gridId);
    for (const opt of options) {
      const card = makeCard(group, opt);
      cards.push(card);
      grid.appendChild(card.el);
    }
  }
  buildLines();
  update();
})();
</script>
</body>
</html>
