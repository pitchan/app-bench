if(s.accessory.has('rack')){begin('rack','#48484A');box([-120,2*R+80,-90],[260,2*R+92,90]);cap([-100,2*R+86,0],RA,14)}if(s.accessory.has('lights')){begin('light','#FFD60A');box(add(HT,[20,-60,-25]),add(HT,[70,-20,25]))}if(s.accessory.has('kickstand')){begin('kickstand','#8E8E93');cap([380,300,60],[300,0,160],20)}}
function getCamera(){const E=add([540,450,0],mul([Math.sin(yaw*rad)*Math.cos(pitch*rad),Math.sin(pitch*rad),Math.cos(yaw*rad)*Math.cos(pitch*rad)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return{E,f,r,u,W:canvas.getBoundingClientRect().width,H:260,F:130/Math.tan(15*rad)}}
function ray(x,y,c){return norm(add(add(c.f,mul(c.r,(x-c.W/2)/c.F)),mul(c.u,-(y-c.H/2)/c.F)))}
function hit(p,O,d){if(p.box){let lo=-Infinity,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(O[i]<p.min[i]||O[i]>p.max[i])return Infinity}else{let a=(p.min[i]-O[i])/d[i],b=(p.max[i]-O[i])/d[i];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}}return hi<0?Infinity:Math.max(0,lo)}
const ba=p.ba,oa=sub(O,p.a),baba=dot(ba,ba),bard=dot(ba,d),baoa=dot(ba,oa),rdoa=dot(d,oa),oaoa=dot(oa,oa),A=baba-bard*bard,B=baba*rdoa-baoa*bard,C=baba*oaoa-baoa*baoa-p.r*p.r*baba;let best=Infinity,h=B*B-A*C;if(h>=0&&Math.abs(A)>1e-9){const t=(-B-Math.sqrt(h))/A,y=baoa+t*bard;if(t>=0&&y>=0&&y<=baba)best=t}for(const center of [p.a,p.b]){const oc=sub(O,center),b=dot(oc,d),c=dot(oc,oc)-p.r*p.r,disc=b*b-c;if(disc>=0){const t=-b-Math.sqrt(disc);if(t>=0&&t<best)best=t}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:[...parts]});window.bikePickAt=(x,y)=>{const c=getCamera(),d=ray(x,y,c);let distance=Infinity,name=null;for(const p of primitives){const t=hit(p,c.E,d);if(t<distance){distance=t;name=p.part}}return name};
function project(q,c){const d=sub(q,c.E),z=dot(d,c.f);return[c.W/2+c.F*dot(d,c.r)/z,c.H/2-c.F*dot(d,c.u)/z]}
function draw(){scheduled=false;if($('main').hidden)return;const c=getCamera(),W=Math.round(c.W),H=260;if(!W)return;canvas.width=W;canvas.height=H;const img=ctx.createImageData(W,H),z=new Float64Array(W*H);z.fill(Infinity);for(let i=0;i<W*H;i++){img.data[i*4]=237;img.data[i*4+1]=237;img.data[i*4+2]=242;img.data[i*4+3]=255}const rays=new Float64Array(W*H*3);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=ray(x+.5,y+.5,c),i=(y*W+x)*3;rays[i]=d[0];rays[i+1]=d[1];rays[i+2]=d[2]}
for(const p of primitives){let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(let k=0;k<8;k++){const q=project([k&1?p.max[0]:p.min[0],k&2?p.max[1]:p.min[1],k&4?p.max[2]:p.min[2]],c);xmin=Math.min(xmin,q[0]);xmax=Math.max(xmax,q[0]);ymin=Math.min(ymin,q[1]);ymax=Math.max(ymax,q[1])}const xa=Math.max(0,Math.floor(xmin)),xb=Math.min(W-1,Math.ceil(xmax)),ya=Math.max(0,Math.floor(ymin)),yb=Math.min(H-1,Math.ceil(ymax));for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){const i=y*W+x,j=i*3,d=[rays[j],rays[j+1],rays[j+2]],t=hit(p,c.E,d);if(t<z[i]){z[i]=t;let shade=.85;if(!p.box){const q=add(c.E,mul(d,t)),along=Math.max(0,Math.min(1,dot(sub(q,p.a),p.ba)/dot(p.ba,p.ba))),normal=norm(sub(q,add(p.a,mul(p.ba,along))));shade=.65+.35*Math.max(0,dot(normal,norm([-.3,.7,1])))}for(let k=0;k<3;k++)img.data[i*4+k]=Math.round(p.color[k]*shade)}}}ctx.putImageData(img,0,0)}
function scheduleDraw(){if(!scheduled){scheduled=true;requestAnimationFrame(draw)}}function turn(dy,dp){yaw=((yaw+dy)%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch+dp));scheduleDraw()}
let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();turn(.9*(e.clientX-drag.x),.5*(e.clientY-drag.y));drag.x=e.clientX;drag.y=e.clientY});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>drag=null);canvas.addEventListener('keydown',e=>{const keys={ArrowRight:[15,0],ArrowLeft:[-15,0],ArrowUp:[0,5],ArrowDown:[0,-5]};if(keys[e.key]){e.preventDefault();turn(...keys[e.key])}if(e.key==='Home'){e.preventDefault();yaw=0;pitch=10;scheduleDraw()}});new ResizeObserver(scheduleDraw).observe(canvas);render();
</script>
