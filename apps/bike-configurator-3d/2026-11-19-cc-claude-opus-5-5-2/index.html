<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 24px;
}
header { max-width: 1200px; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-4); }
header h1 { margin: 0; font-size: var(--text-xl); line-height: 36px; font-weight: 700; }
main {
  max-width: 1200px; margin: 0 auto; padding: 0 24px var(--space-6);
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; column-gap: 32px; align-items: start;
}
.configurator { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
section.panel, aside.summary {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 24px;
}
aside.summary { position: sticky; top: 24px; min-width: 0; }
section.panel h2 { font-size: 20px; font-weight: 600; margin: 0 0 var(--space-4); line-height: 28px; }
@media (max-width: 1023.98px) {
  header { padding: var(--space-4); }
  main { padding: 0 16px var(--space-6); grid-template-columns: minmax(0, 1fr); row-gap: 32px; }
  aside.summary { position: static; }
}
.field label { display: block; font-weight: 600; margin-bottom: var(--space-1); }
input[type="text"] {
  font: inherit; color: var(--color-text); background-color: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-control);
  height: 40px; padding: 0 var(--space-3); width: 100%; max-width: 240px;
}
input[type="text"][aria-invalid="true"] { border-color: var(--color-danger); }
input[type="text"]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.error { color: var(--color-danger); font-size: 14px; margin: var(--space-1) 0 0; }
.info { margin: var(--space-2) 0 0; font-size: var(--text-sm); }
.warn { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--color-danger); }
.grid { display: grid; gap: 12px; padding-top: 10px; }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1023.98px) {
  .n-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .n-1 { grid-template-columns: minmax(0, 1fr); }
}
.card {
  position: relative; display: flex; flex-direction: column; gap: 2px;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 16px; cursor: pointer; min-width: 0;
  transition: border-color 150ms, background-color 150ms, color 150ms;
}
.card input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; top: 50%; left: 50%; }
.card [data-role="name"] { font-size: 16px; font-weight: 600; color: var(--color-text); }
.card [data-role="price"] { font-size: 14px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.card [data-role="reason"] { font-size: 14px; color: var(--color-muted); visibility: hidden; }
.card [data-role="check"] {
  position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%;
  background-color: var(--color-accent); color: var(--color-accent-contrast);
  font-size: 12px; line-height: 20px; text-align: center; visibility: hidden;
}
.card [data-role="swatch"] {
  display: block; width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--color-border); margin-bottom: var(--space-1);
}
.card [data-role="badge"] {
  position: absolute; top: -1px; left: 50%; transform: translate(-50%, -50%);
  background-color: var(--color-accent); color: var(--color-accent-contrast);
  border-radius: var(--radius-pill); font-size: 14px; font-weight: 600; line-height: 20px;
  padding: 2px 8px; white-space: nowrap;
}
.card:not(:has(input:checked)):not(:has(input:disabled)):hover { border-color: var(--color-muted); }
.card:has(input:checked) { border: 2px solid var(--color-accent); padding: 15px; }
.card:has(input:checked) [data-role="check"] { visibility: visible; }
.card:has(input:checked) [data-role="check"] { top: 9px; right: 9px; }
.card:has(input:checked) [data-role="badge"] { top: -2px; }
.card:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
.card:has(input:disabled) [data-role="reason"] { visibility: visible; }
.card:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: 2px; }
button {
  font: inherit; cursor: pointer;
  transition: border-color 150ms, background-color 150ms, color 150ms;
}
button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.btn2 {
  background-color: transparent; border: 1px solid var(--color-border); color: var(--color-text);
  height: 40px; border-radius: var(--radius-control); padding: 0 var(--space-4);
}
.btn2:disabled { opacity: 0.45; cursor: not-allowed; }
.qty { display: flex; align-items: center; gap: var(--space-3); }
.qty .btn2 { width: 40px; padding: 0; font-size: 20px; }
#qty-value { min-width: 24px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
canvas#bike-preview {
  display: block; width: 100%; height: 260px; border: 0; padding: 0;
  touch-action: none; user-select: none; cursor: grab;
}
canvas#bike-preview:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.lines { margin: var(--space-4) 0; }
.line { display: flex; align-items: baseline; gap: var(--space-3); padding: 2px 0; font-size: var(--text-sm); }
.line [data-role="label"] { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line [data-role="value"] { flex: 0 0 auto; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.line.discount [data-role="value"] { color: var(--color-accent); }
.line.total { border-top: 1px solid var(--color-border); margin-top: var(--space-2); padding-top: var(--space-2); }
.line.total [data-role="label"], .line.total [data-role="value"] { font-size: 28px; font-weight: 700; line-height: 40px; }
.line.muted { color: var(--color-muted); }
.promo { margin-bottom: var(--space-4); }
.promo-row { display: flex; gap: var(--space-2); }
.promo-row input { max-width: none; flex: 1 1 auto; min-width: 0; }
#promo-status { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--color-muted); }
#promo-status.active { color: var(--color-accent); }
#promo-remove { margin-top: var(--space-2); }
#order-button {
  display: block; width: 100%; height: 48px; border: none; border-radius: var(--radius-control);
  font-size: 16px; font-weight: 600;
  background-color: var(--color-accent); color: var(--color-accent-contrast);
}
#order-button:disabled { background-color: var(--color-disabled-bg); color: var(--color-muted); cursor: not-allowed; }
#order-hint { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--color-muted); }
#notice {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(480px, calc(100vw - 32px));
  background-color: var(--color-surface); color: var(--color-text);
  border: 1px solid var(--color-border); border-left: 4px solid var(--color-accent);
  padding: 12px 16px; border-radius: var(--radius-control);
  box-shadow: 0 6px 24px rgba(0,0,0,0.15); z-index: 10;
}
.confirmation {
  max-width: 560px; margin: var(--space-6) auto; padding: var(--space-6);
  background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card);
}
.confirmation h2 { margin: 0 0 var(--space-4); font-size: var(--text-xl); line-height: 36px; }
.confirmation h2:focus { outline: none; }
.confirmation dl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); margin: 0 0 var(--space-5); }
.confirmation dt { color: var(--color-muted); }
.confirmation dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}
</style>
</head>
<body>
<header data-testid="app-header"><h1>Claude Opus 5.5</h1></header>
<main id="main">
  <div class="configurator" data-testid="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <div class="field">
        <label for="height-input">Your height (cm)</label>
        <input id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off" aria-describedby="height-error">
        <p class="error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
        <p class="info" id="height-recommendation" data-testid="height-recommendation" hidden></p>
        <p class="warn" id="frame-warning" data-testid="frame-warning" hidden></p>
      </div>
    </section>
    <section class="panel" data-testid="section-frame"><h2>2. Frame</h2><div class="grid cols-4 n-2" id="grid-frame"></div></section>
    <section class="panel" data-testid="section-wheels"><h2>3. Wheels</h2><div class="grid cols-2 n-2" id="grid-wheels"></div></section>
    <section class="panel" data-testid="section-drivetrain"><h2>4. Drivetrain</h2><div class="grid cols-3 n-1" id="grid-drivetrain"></div></section>
    <section class="panel" data-testid="section-color"><h2>5. Color</h2><div class="grid cols-4 n-2" id="grid-color"></div></section>
    <section class="panel" data-testid="section-accessories"><h2>6. Accessories</h2><div class="grid cols-2 n-2" id="grid-accessory"></div></section>
    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="qty">
        <button type="button" class="btn2" id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">−</button>
        <span id="qty-value" data-testid="qty-value">1</span>
        <button type="button" class="btn2" id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>
  <aside class="summary" data-testid="summary">
    <canvas id="bike-preview" data-testid="bike-preview" tabindex="0" role="img" aria-label="Bike preview"></canvas>
    <div class="lines" id="lines"></div>
    <div class="promo">
      <label for="promo-input" style="display:block;font-weight:600;margin-bottom:4px">Promo code</label>
      <div class="promo-row">
        <input id="promo-input" data-testid="promo-input" type="text" autocomplete="off" aria-describedby="promo-error">
        <button type="button" class="btn2" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <p class="error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
      <p id="promo-status" data-testid="promo-status" hidden></p>
      <button type="button" class="btn2" id="promo-remove" data-testid="promo-remove" hidden>Remove code</button>
    </div>
    <button type="button" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
    <p id="order-hint" data-testid="order-hint">Enter your height to continue.</p>
  </aside>
</main>
<div role="status" id="status-region"><div id="notice" data-testid="notice" hidden></div></div>
<section class="confirmation" id="confirmation" data-testid="confirmation" hidden>
  <h2 tabindex="-1" id="confirmation-title" data-testid="confirmation-title">Order confirmed</h2>
  <dl>
    <dt>Reference</dt><dd id="confirmation-reference" data-testid="confirmation-reference"></dd>
    <dt>Total</dt><dd id="confirmation-total" data-testid="confirmation-total"></dd>
    <dt>Estimated delivery</dt><dd id="confirmation-delivery" data-testid="confirmation-delivery"></dd>
  </dl>
  <button type="button" class="btn2" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
</section>
<script>
(function () {
  'use strict';
  var FRAMES = [
    { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000, L: 430 },
    { id: 'M', name: 'Frame M', min: 165, max: 174, price: 119000, L: 470 },
    { id: 'L', name: 'Frame L', min: 175, max: 184, price: 124000, L: 510 },
    { id: 'XL', name: 'Frame XL', min: 185, max: 200, price: 129000, L: 550 }
  ];
  var WHEELS = [{ id: '275', name: '27.5" wheels', price: 0, R: 350 }, { id: '29', name: '29" wheels', price: 12000, R: 375 }];
  var DRIVES = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  var COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0 }
  ];
  var ACCS = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  var CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = { '2026-12-24': 1, '2026-12-25': 1, '2026-12-31': 1, '2027-01-01': 1 };
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MSG07 = '29" wheels were replaced by 27.5" wheels: not available with frame S.';
  var MSG08 = 'Mudguards were added: required by the rear rack.';
  var MSG09 = 'Rear rack was removed: it requires mudguards.';

  function $(id) { return document.getElementById(id); }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function fmt(c) {
    var e = String(Math.floor(c / 100)), ct = String(c % 100);
    if (ct.length < 2) ct = '0' + ct;
    return '€' + e.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + ct;
  }
  function signed(c) { return c === 0 ? 'Included' : '+' + fmt(c); }
  function disc(c) { return '−' + fmt(c); }
  function pad(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
  function fmtDate(d) { return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

  var st;
  function initState() {
    st = { heightText: '', auto: true, frame: null, wheels: '275', drive: 'essential', color: 'graphite',
      acc: { mudguards: false, rack: false, lights: false, kickstand: false }, qty: 1, code: null };
  }
  initState();
  var orderSeq = 0;

  function heightValue() {
    var t = st.heightText.trim();
    if (!/^\d+$/.test(t)) return null;
    var v = parseInt(t, 10);
    return v >= 150 && v <= 200 ? v : null;
  }
  function recommended(h) {
    for (var i = 0; i < FRAMES.length; i++) if (h >= FRAMES[i].min && h <= FRAMES[i].max) return FRAMES[i].id;
    return null;
  }
  function colorSurcharge() { var c = byId(COLORS, st.color); return (st.color === 'red' && st.drive === 'pro') ? 0 : c.price; }

  function compute() {
    var r = { hasFrame: !!st.frame };
    var spring = false, welcome = st.code === 'WELCOME50' && st.qty < 3, active = false;
    if (st.frame) {
      var unit = byId(FRAMES, st.frame).price + byId(WHEELS, st.wheels).price + byId(DRIVES, st.drive).price + colorSurcharge();
      ACCS.forEach(function (a) { if (st.acc[a.id]) unit += a.price; });
      var sub = unit * st.qty;
      var qd = st.qty >= 3 ? Math.floor((sub * 5 + 50) / 100) : 0;
      var after = sub - qd;
      spring = st.code === 'SPRING10' && after >= 150000;
      var pd = spring ? Math.floor((after * 10 + 50) / 100) : (welcome ? 5000 : 0);
      var merch = after - pd;
      var ship = (st.code === 'FREESHIP' || merch >= 200000) ? 0 : 4900;
      var total = merch + ship;
      r.unit = unit; r.sub = sub; r.qd = qd; r.pd = pd; r.ship = ship; r.total = total;
      r.vat = Math.floor((total * 20 + 60) / 120);
    }
    if (st.code === 'SPRING10') active = spring;
    else if (st.code === 'WELCOME50') active = welcome;
    else if (st.code === 'FREESHIP') active = true;
    r.active = active;
    var lead = byId(DRIVES, st.drive).lead + (st.color === 'red' ? 3 : 0) + (st.qty >= 3 ? 2 : 0);
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var n = 0;
    while (n < lead) {
      d.setDate(d.getDate() + 1);
      var key = d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6 && !CLOSED[key]) n++;
    }
    r.delivery = fmtDate(d);
    return r;
  }

  // ---- build cards
  var inputs = {};
  function buildCards(group, list, type, gridId) {
    var grid = $(gridId);
    list.forEach(function (o) {
      var lab = document.createElement('label');
      lab.className = 'card';
      lab.setAttribute('data-testid', 'card-' + group + '-' + o.id);
      var inp = document.createElement('input');
      inp.type = type; inp.name = group; inp.value = o.id;
      inp.setAttribute('aria-label', o.name);
      lab.appendChild(inp);
      if (group === 'color') {
        var sw = document.createElement('span'); sw.setAttribute('data-role', 'swatch');
        sw.style.backgroundColor = o.hex; lab.appendChild(sw);
      }
      var nm = document.createElement('span'); nm.setAttribute('data-role', 'name'); nm.textContent = o.name; lab.appendChild(nm);
      var pr = document.createElement('span'); pr.setAttribute('data-role', 'price'); lab.appendChild(pr);
      var rs = document.createElement('span'); rs.setAttribute('data-role', 'reason'); rs.setAttribute('aria-hidden', 'true');
      rs.textContent = group === 'color' ? 'Out of stock' : (group === 'wheels' && o.id === '29' ? 'Not available with frame S' : ' ');
      lab.appendChild(rs);
      var ck = document.createElement('span'); ck.setAttribute('data-role', 'check'); ck.setAttribute('aria-hidden', 'true'); ck.textContent = '✓'; lab.appendChild(ck);
      if (group === 'frame') {
        var bd = document.createElement('span'); bd.setAttribute('data-role', 'badge'); bd.textContent = 'Recommended'; bd.hidden = true; lab.appendChild(bd);
      }
      grid.appendChild(lab);
      inputs[group + ':' + o.id] = { input: inp, card: lab, price: pr, opt: o };
    });
  }
  buildCards('frame', FRAMES, 'radio', 'grid-frame');
  buildCards('wheels', WHEELS, 'radio', 'grid-wheels');
  buildCards('drivetrain', DRIVES, 'radio', 'grid-drivetrain');
  buildCards('color', COLORS, 'radio', 'grid-color');
  buildCards('accessory', ACCS, 'checkbox', 'grid-accessory');
  inputs['color:glacier'].input.disabled = true;

  // ---- summary lines
  var lineEls = {};
  var keys = ['frame', 'wheels', 'drivetrain', 'color'].concat(ACCS.map(function (a) { return 'accessory-' + a.id; }))
    .concat(['unit', 'quantity', 'subtotal', 'qty-discount', 'promo', 'shipping', 'total', 'vat', 'delivery']);
  keys.forEach(function (k) {
    var row = document.createElement('div');
    row.className = 'line' + (k === 'qty-discount' || k === 'promo' ? ' discount' : '') + (k === 'total' ? ' total' : '');
    row.setAttribute('data-testid', 'summary-line-' + k);
    var l = document.createElement('span'); l.setAttribute('data-role', 'label');
    var v = document.createElement('span'); v.setAttribute('data-role', 'value');
    row.appendChild(l); row.appendChild(v);
    $('lines').appendChild(row);
    lineEls[k] = { row: row, label: l, value: v };
  });
  function setLine(k, label, value, show) {
    var e = lineEls[k];
    e.row.hidden = show === false;
    if (label != null) e.label.textContent = label;
    if (value != null) e.value.textContent = value;
  }

  // ---- notice
  var notice = $('notice');
  function setNotice(msg) {
    if (msg) { notice.textContent = msg; notice.hidden = false; }
    else { notice.hidden = true; notice.textContent = ''; }
  }

  // ---- render
  function render() {
    var h = heightValue();
    var rec = h != null ? recommended(h) : null;
    var t = st.heightText.trim();
    var err = t !== '' && h == null;
    $('height-error').hidden = !err;
    var hi = $('height-input');
    if (err) hi.setAttribute('aria-invalid', 'true'); else hi.removeAttribute('aria-invalid');
    $('height-recommendation').hidden = !rec;
    if (rec) $('height-recommendation').textContent = 'Recommended frame: ' + rec;
    var fw = $('frame-warning');
    var order = ['S', 'M', 'L', 'XL'];
    if (rec && st.frame) {
      var gap = order.indexOf(st.frame) - order.indexOf(rec);
      if (Math.abs(gap) >= 2) {
        fw.textContent = 'Frame ' + st.frame + ' is ' + Math.abs(gap) + ' sizes ' + (gap > 0 ? 'larger' : 'smaller') + ' than recommended.';
        fw.hidden = false;
      } else fw.hidden = true;
    } else fw.hidden = true;

    FRAMES.forEach(function (f) {
      var e = inputs['frame:' + f.id];
      e.input.checked = st.frame === f.id;
      e.price.textContent = fmt(f.price);
      e.card.querySelector('[data-role="badge"]').hidden = rec !== f.id;
    });
    WHEELS.forEach(function (w) {
      var e = inputs['wheels:' + w.id];
      e.input.checked = st.wheels === w.id;
      e.price.textContent = signed(w.price);
    });
    inputs['wheels:29'].input.disabled = st.frame === 'S';
    DRIVES.forEach(function (d) {
      var e = inputs['drivetrain:' + d.id];
      e.input.checked = st.drive === d.id;
      e.price.textContent = signed(d.price);
    });
    COLORS.forEach(function (c) {
      var e = inputs['color:' + c.id];
      e.input.checked = st.color === c.id;
      e.price.textContent = (c.id === 'red' && st.drive === 'pro') ? 'Included with Pro' : signed(c.price);
    });
    ACCS.forEach(function (a) {
      var e = inputs['accessory:' + a.id];
      e.input.checked = st.acc[a.id];
      e.price.textContent = signed(a.price);
    });

    $('qty-value').textContent = String(st.qty);
    $('qty-decrease').disabled = st.qty <= 1;
    $('qty-increase').disabled = st.qty >= 5;

    var r = compute();
    var DASH = '—';
    if (r.hasFrame) setLine('frame', 'Frame ' + st.frame, fmt(byId(FRAMES, st.frame).price));
    else setLine('frame', 'Frame', DASH);
    var w = byId(WHEELS, st.wheels), d = byId(DRIVES, st.drive), c = byId(COLORS, st.color);
    setLine('wheels', w.name, signed(w.price));
    setLine('drivetrain', d.name, signed(d.price));
    setLine('color', c.name, signed(colorSurcharge()));
    ACCS.forEach(function (a) { setLine('accessory-' + a.id, a.name, signed(a.price), st.acc[a.id]); });
    setLine('unit', 'Unit price', r.hasFrame ? fmt(r.unit) : DASH);
    setLine('quantity', 'Quantity', '× ' + st.qty);
    setLine('subtotal', 'Subtotal', r.hasFrame ? fmt(r.sub) : DASH);
    setLine('qty-discount', 'Quantity discount (5%)', r.hasFrame ? disc(r.qd) : '', r.hasFrame && st.qty >= 3);
    var showPromo = r.hasFrame && r.active && r.pd > 0;
    setLine('promo', 'Code ' + (st.code || ''), showPromo ? disc(r.pd) : '', showPromo);
    setLine('shipping', 'Shipping', r.hasFrame ? (r.ship === 0 ? 'Free' : fmt(r.ship)) : DASH);
    setLine('total', 'Total', r.hasFrame ? fmt(r.total) : DASH);
    setLine('vat', 'Including VAT (20%)', r.hasFrame ? fmt(r.vat) : DASH);
    setLine('delivery', 'Estimated delivery', r.delivery);

    var ps = $('promo-status');
    if (st.code) {
      ps.hidden = false;
      $('promo-remove').hidden = false;
      ps.className = r.active ? 'active' : '';
      if (r.active) ps.textContent = 'Code ' + st.code + ' applied.';
      else if (st.code === 'SPRING10') ps.textContent = 'SPRING10 requires €1,500.00 or more after the quantity discount.';
      else ps.textContent = 'WELCOME50 cannot be combined with the quantity discount.';
    } else { ps.hidden = true; $('promo-remove').hidden = true; }
    $('promo-apply').disabled = $('promo-input').value.trim() === '';

    $('order-button').textContent = st.qty === 1 ? 'Order 1 bike' : 'Order ' + st.qty + ' bikes';
    $('order-button').disabled = h == null || !st.frame;
    $('order-hint').hidden = h != null;

    preview.update();
    return r;
  }

  function selectFrame(id) {
    var msg = null;
    st.frame = id;
    if (id === 'S' && st.wheels === '29') { st.wheels = '275'; msg = MSG07; }
    return msg;
  }

  // ---- events
  $('height-input').addEventListener('input', function (e) {
    st.heightText = e.target.value;
    var msg = null;
    var h = heightValue();
    if (h != null && st.auto) {
      var rec = recommended(h);
      if (rec !== st.frame) msg = selectFrame(rec);
    }
    setNotice(msg);
    render();
  });
  FRAMES.forEach(function (f) {
    var inp = inputs['frame:' + f.id].input;
    inp.addEventListener('click', function () { st.auto = false; });
    inp.addEventListener('change', function () {
      st.auto = false;
      setNotice(selectFrame(f.id));
      render();
    });
  });
  WHEELS.forEach(function (w) {
    inputs['wheels:' + w.id].input.addEventListener('change', function () { st.wheels = w.id; setNotice(null); render(); });
  });
  DRIVES.forEach(function (d) {
    inputs['drivetrain:' + d.id].input.addEventListener('change', function () { st.drive = d.id; setNotice(null); render(); });
  });
  COLORS.forEach(function (c) {
    inputs['color:' + c.id].input.addEventListener('change', function () {
      if (c.id === 'glacier') { render(); return; }
      st.color = c.id; setNotice(null); render();
    });
  });
  ACCS.forEach(function (a) {
    inputs['accessory:' + a.id].input.addEventListener('change', function (e) {
      var on = e.target.checked, msg = null;
      st.acc[a.id] = on;
      if (a.id === 'rack' && on && !st.acc.mudguards) { st.acc.mudguards = true; msg = MSG08; }
      if (a.id === 'mudguards' && !on && st.acc.rack) { st.acc.rack = false; msg = MSG09; }
      setNotice(msg);
      render();
    });
  });
  $('qty-decrease').addEventListener('click', function () { if (st.qty > 1) { st.qty--; setNotice(null); render(); } });
  $('qty-increase').addEventListener('click', function () { if (st.qty < 5) { st.qty++; setNotice(null); render(); } });

  var promoInput = $('promo-input');
  function hidePromoError() { $('promo-error').hidden = true; promoInput.removeAttribute('aria-invalid'); }
  promoInput.addEventListener('input', function () { hidePromoError(); render(); });
  function applyCode() {
    var v = promoInput.value.trim().toUpperCase();
    if (v === '') return;
    if (CODES.indexOf(v) >= 0) {
      st.code = v; promoInput.value = ''; hidePromoError();
    } else {
      $('promo-error').hidden = false; promoInput.setAttribute('aria-invalid', 'true');
    }
    render();
  }
  $('promo-apply').addEventListener('click', applyCode);
  promoInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); if (!$('promo-apply').disabled) applyCode(); }
  });
  $('promo-remove').addEventListener('click', function () { st.code = null; render(); });

  $('order-button').addEventListener('click', function () {
    if ($('order-button').disabled) return;
    var r = compute();
    orderSeq++;
    var now = new Date();
    $('confirmation-reference').textContent = 'BK-' + now.getFullYear() + pad(now.getMonth() + 1, 2) + pad(now.getDate(), 2) + '-' + pad(orderSeq, 3);
    $('confirmation-total').textContent = fmt(r.total);
    $('confirmation-delivery').textContent = r.delivery;
    setNotice(null);
    $('main').hidden = true;
    $('confirmation').hidden = false;
    $('confirmation-title').focus();
  });
  $('confirmation-new').addEventListener('click', function () {
    initState();
    $('height-input').value = '';
    promoInput.value = '';
    hidePromoError();
    setNotice(null);
    $('confirmation').hidden = true;
    $('main').hidden = false;
    render();
    $('height-input').focus();
  });

  // ---- 3D preview
  var preview = (function () {
    var canvas = $('bike-preview');
    var ctx = canvas.getContext('2d');
    var yaw = 0, pitch = 10;
    var parts = [];
    var pending = false;
    var T = [540, 450, 0], D = 3600;
    function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
    function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
    function norm(a) { var l = Math.sqrt(dot(a, a)); return [a[0] / l, a[1] / l, a[2] / l]; }
    function cosd(a) { return Math.cos(a * Math.PI / 180); }
    function sind(a) { return Math.sin(a * Math.PI / 180); }
    function hexRgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
    function cap(P, Q, r) { return { t: 'c', P: P, Q: Q, r: r }; }
    function box(a, b) { return { t: 'b', mn: a, mx: b }; }

    function buildParts() {
      var R = byId(WHEELS, st.wheels).R;
      var L = st.frame ? byId(FRAMES, st.frame).L : 470;
      var C = byId(COLORS, st.color).hex;
      var RA = [0, R, 0], FA = [1080, R, 0], BB = [420, 300, 0];
      var ST = [420 - 0.25 * L, 300 + L, 0], HT = [1000, 340 + L, 0], HB = [1020, 220 + L, 0];
      var SP = add(ST, [-15, 60, 0]), HS = add(HT, [-60, 60, 0]);
      var list = [];
      list.push({ name: 'frame', color: C, prims: [cap(BB, ST, 18), cap(ST, HT, 18), cap(BB, HB, 20), cap(HB, HT, 20), cap(ST, RA, 16),
        cap(BB, RA, 16), cap(HB, FA, 16), cap(ST, SP, 13), cap(HT, HS, 15), cap(add(HS, [0, 0, -260]), add(HS, [0, 0, 260]), 16)] });
      list.push({ name: 'saddle', color: '#1C1C1E', prims: [cap(add(SP, [-90, 0, 0]), add(SP, [80, 0, 0]), 24)] });
      function wheel(A) {
        var pr = [], k;
        for (k = 0; k < 36; k++) {
          pr.push(cap(add(A, [R * cosd(10 * k), R * sind(10 * k), 0]), add(A, [R * cosd(10 * (k + 1)), R * sind(10 * (k + 1)), 0]), 22));
        }
        pr.push(cap(add(A, [0, 0, -50]), add(A, [0, 0, 50]), 15));
        return pr;
      }
      function guard(A) {
        var pr = [], k, g = R + 45;
        for (k = 0; k < 12; k++) {
          pr.push(cap(add(A, [g * cosd(30 + 10 * k), g * sind(30 + 10 * k), 0]), add(A, [g * cosd(30 + 10 * (k + 1)), g * sind(30 + 10 * (k + 1)), 0]), 25));
        }
        return pr;
      }
      list.push({ name: 'wheel-rear', color: '#1C1C1E', prims: wheel(RA) });
      list.push({ name: 'wheel-front', color: '#1C1C1E', prims: wheel(FA) });
      if (st.acc.mudguards) {
        list.push({ name: 'mudguard-rear', color: '#2C2C2E', prims: guard(RA) });
        list.push({ name: 'mudguard-front', color: '#2C2C2E', prims: guard(FA) });
      }
      if (st.acc.rack) list.push({ name: 'rack', color: '#48484A', prims: [box([-120, 2 * R + 80, -90], [260, 2 * R + 92, 90]), cap([-100, 2 * R + 86, 0], RA, 14)] });
      if (st.acc.lights) list.push({ name: 'light', color: '#FFD60A', prims: [box(add(HT, [20, -60, -25]), add(HT, [70, -20, 25]))] });
      if (st.acc.kickstand) list.push({ name: 'kickstand', color: '#8E8E93', prims: [cap([380, 300, 60], [300, 0, 160], 20)] });
      list.forEach(function (p) {
        p.rgb = hexRgb(p.color);
        p.prims.forEach(function (q) {
          if (q.t === 'c') { q.ba = sub(q.Q, q.P); q.baba = dot(q.ba, q.ba); }
        });
      });
      parts = list;
    }

    function camera(W, H) {
      var E = add(T, mul([sind(yaw) * cosd(pitch), sind(pitch), cosd(yaw) * cosd(pitch)], D));
      var f = norm(sub(T, E));
      var r = norm(cross(f, [0, 1, 0]));
      var u = cross(r, f);
      return { E: E, f: f, r: r, u: u, F: (H / 2) / Math.tan(15 * Math.PI / 180), W: W, H: H };
    }

    function hitCap(ro, rd, q) {
      var ba = q.ba, baba = q.baba;
      var oa = [ro[0] - q.P[0], ro[1] - q.P[1], ro[2] - q.P[2]];
      var bard = dot(ba, rd), baoa = dot(ba, oa), rdoa = dot(rd, oa), oaoa = dot(oa, oa), rr = q.r * q.r;
      var a = baba - bard * bard;
      if (a > 1e-9) {
        var b = baba * rdoa - baoa * bard, c = baba * oaoa - baoa * baoa - rr * baba;
        var h = b * b - a * c;
        if (h < 0) return -1;
        var t = (-b - Math.sqrt(h)) / a;
        var y = baoa + t * bard;
        if (y > 0 && y < baba) return t;
        var oc = y <= 0 ? oa : [ro[0] - q.Q[0], ro[1] - q.Q[1], ro[2] - q.Q[2]];
        var b2 = dot(rd, oc), c2 = dot(oc, oc) - rr, h2 = b2 * b2 - c2;
        return h2 > 0 ? -b2 - Math.sqrt(h2) : -1;
      }
      // ray parallel to axis: test both end spheres
      var best = -1;
      [q.P, q.Q].forEach(function (S) {
        var o = sub(ro, S), bb = dot(rd, o), cc = dot(o, o) - rr, hh = bb * bb - cc;
        if (hh > 0) { var tt = -bb - Math.sqrt(hh); if (tt > 0 && (best < 0 || tt < best)) best = tt; }
      });
      return best;
    }
    function hitBox(ro, rd, q) {
      var tmin = -Infinity, tmax = Infinity;
      for (var i = 0; i < 3; i++) {
        if (Math.abs(rd[i]) < 1e-12) {
          if (ro[i] < q.mn[i] || ro[i] > q.mx[i]) return -1;
        } else {
          var t1 = (q.mn[i] - ro[i]) / rd[i], t2 = (q.mx[i] - ro[i]) / rd[i];
          if (t1 > t2) { var s = t1; t1 = t2; t2 = s; }
          if (t1 > tmin) tmin = t1;
          if (t2 < tmax) tmax = t2;
          if (tmin > tmax) return -1;
        }
      }
      return tmin > 0 ? tmin : -1;
    }
    function trace(ro, rd) {
      var best = Infinity, bp = null, bq = null;
      for (var i = 0; i < parts.length; i++) {
        var pr = parts[i].prims;
        for (var j = 0; j < pr.length; j++) {
          var q = pr[j];
          var t = q.t === 'c' ? hitCap(ro, rd, q) : hitBox(ro, rd, q);
          if (t > 0 && t < best) { best = t; bp = parts[i]; bq = q; }
        }
      }
      return bp ? { part: bp, prim: bq, t: best } : null;
    }
    function rayDir(cam, px, py) {
      var a = (px - cam.W / 2) / cam.F, b = (py - cam.H / 2) / cam.F;
      return norm([cam.f[0] + a * cam.r[0] - b * cam.u[0], cam.f[1] + a * cam.r[1] - b * cam.u[1], cam.f[2] + a * cam.r[2] - b * cam.u[2]]);
    }
    function normalAt(hit, p) {
      var q = hit.prim;
      if (q.t === 'c') {
        var h = dot(sub(p, q.P), q.ba) / q.baba;
        h = Math.max(0, Math.min(1, h));
        return norm(sub(p, add(q.P, mul(q.ba, h))));
      }
      var n = [0, 0, 0], bestd = Infinity;
      for (var i = 0; i < 3; i++) {
        var d1 = Math.abs(p[i] - q.mn[i]), d2 = Math.abs(p[i] - q.mx[i]);
        if (d1 < bestd) { bestd = d1; n = [0, 0, 0]; n[i] = -1; }
        if (d2 < bestd) { bestd = d2; n = [0, 0, 0]; n[i] = 1; }
      }
      return n;
    }
    function size() { return { W: canvas.clientWidth, H: canvas.clientHeight }; }

    function draw() {
      pending = false;
      var s = size();
      if (!s.W || !s.H) return;
      var dpr = window.devicePixelRatio || 1;
      var cw = Math.round(s.W * dpr), ch = Math.round(s.H * dpr);
      if (canvas.width !== cw) canvas.width = cw;
      if (canvas.height !== ch) canvas.height = ch;
      var img = ctx.createImageData(cw, ch), data = img.data;
      var cam = camera(s.W, s.H);
      var light = norm([0.4, 0.7, 0.6]);
      for (var j = 0; j < ch; j++) {
        for (var i = 0; i < cw; i++) {
          var o = (j * cw + i) * 4;
          var rd = rayDir(cam, (i + 0.5) / dpr, (j + 0.5) / dpr);
          var hit = trace(cam.E, rd);
          if (!hit) { data[o] = 0xED; data[o + 1] = 0xED; data[o + 2] = 0xF2; data[o + 3] = 255; continue; }
          var p = add(cam.E, mul(rd, hit.t));
          var n = normalAt(hit, p);
          var view = Math.abs(dot(n, rd));
          var lam = Math.max(0, dot(n, light));
          var sh = 0.45 + 0.35 * view + 0.2 * lam;
          if (sh > 1) sh = 1;
          var c = hit.part.rgb;
          data[o] = Math.round(c[0] * sh); data[o + 1] = Math.round(c[1] * sh); data[o + 2] = Math.round(c[2] * sh); data[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    function schedule() { if (!pending) { pending = true; requestAnimationFrame(draw); } }
    function update() { buildParts(); schedule(); }
    function setView(y, p) {
      y = y % 360; if (y < 0) y += 360; if (y >= 360) y -= 360;
      yaw = y; pitch = Math.max(-20, Math.min(60, p));
      schedule();
    }

    var dragging = false, lx = 0, ly = 0;
    canvas.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      dragging = true; lx = e.clientX; ly = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      canvas.focus();
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      if (!(e.buttons & 1)) { dragging = false; return; }
      var dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      setView(yaw + 0.9 * dx, pitch + 0.5 * dy);
      e.preventDefault();
    });
    function end() { dragging = false; }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('lostpointercapture', end);
    canvas.addEventListener('keydown', function (e) {
      var k = e.key;
      if (k === 'ArrowRight') setView(yaw + 15, pitch);
      else if (k === 'ArrowLeft') setView(yaw - 15, pitch);
      else if (k === 'ArrowUp') setView(yaw, pitch + 5);
      else if (k === 'ArrowDown') setView(yaw, pitch - 5);
      else if (k === 'Home') setView(0, 10);
      else return;
      e.preventDefault();
    });
    if (window.ResizeObserver) new ResizeObserver(schedule).observe(canvas);
    window.addEventListener('resize', schedule);

    window.bikePreviewState = function () {
      return { yaw: yaw, pitch: pitch, parts: parts.map(function (p) { return p.name; }) };
    };
    window.bikePickAt = function (px, py) {
      var s = size();
      var cam = camera(s.W, s.H);
      var hit = trace(cam.E, rayDir(cam, px, py));
      return hit ? hit.part.name : null;
    };
    return { update: update };
  })();

  render();
})();
</script>
</body>
