function totals(){const unit=BigInt(price('frame')+price('wheels')+price('drivetrain')+price('color')+[...state.accessory].reduce((a,id)=>a+price('accessory',id),0));const sub=unit*BigInt(state.qty),qd=state.qty>=3?(sub*5n+50n)/100n:0n,after=sub-qd;const active=state.code==='FREESHIP'||state.code==='WELCOME50'&&state.qty<3||state.code==='SPRING10'&&!!state.frame&&after>=150000n;const pd=active?(state.code==='WELCOME50'?5000n:state.code==='SPRING10'?(after*10n+50n)/100n:0n):0n;const shipping=state.code==='FREESHIP'||after-pd>=200000n?0n:4900n,total=after-pd+shipping;return {unit,sub,qd,pd,shipping,total,vat:(total*20n+60n)/120n,active}}

for(const [g,rows] of Object.entries(catalog))for(const [id] of rows){const card=document.querySelector('[data-testid="card-'+g+'-'+id+'"]'),input=card.querySelector('input'),selected=g==='accessory'?state.accessory.has(id):state[g]===id,disabled=g==='color'&&id==='glacier'||g==='wheels'&&id==='29'&&state.frame==='S';input.checked=selected;input.disabled=disabled;card.classList.toggle('selected',selected);card.classList.toggle('disabled',disabled);card.querySelector('[data-role=check]').hidden=!selected;card.querySelector('[data-role=reason]').hidden=!disabled;card.querySelector('[data-role=reason]').textContent=id==='glacier'?'Out of stock':'Not available with frame S';card.querySelector('[data-role=price]').textContent=g==='frame'?amount(price(g,id)):g==='color'&&id==='red'&&state.drivetrain==='pro'?'Included with Pro':signed(price(g,id));if(g==='frame')card.querySelector('[data-role=badge]').hidden=rec!==id}
$('qty-value').textContent=state.qty;$('qty-decrease').disabled=state.qty===1;$('qty-increase').disabled=state.qty===5;const t=totals(),rows=[];const line=(key,label,value)=>rows.push([key,label,value]);line('frame',state.frame?'Frame '+state.frame:'Frame',state.frame?amount(price('frame')):'—');for(const g of ['wheels','drivetrain','color'])line(g,item(g)[1],signed(price(g)));for(const [id,name] of catalog.accessory)if(state.accessory.has(id))line('accessory-'+id,name,signed(price('accessory',id)));const money=n=>state.frame?amount(n):'—';line('unit','Unit price',money(t.unit));line('quantity','Quantity','× '+state.qty);line('subtotal','Subtotal',money(t.sub));if(state.frame&&state.qty>=3)line('qty-discount','Quantity discount (5%)','−'+amount(t.qd));if(state.frame&&t.pd>0n)line('promo','Code '+state.code,'−'+amount(t.pd));line('shipping','Shipping',!state.frame?'—':t.shipping===0n?'Free':amount(t.shipping));line('total','Total',money(t.total));line('vat','Including VAT (20%)',money(t.vat));line('delivery','Estimated delivery',delivery());$('lines').replaceChildren(...rows.map(([key,label,value])=>{const el=document.createElement('div');el.dataset.testid='summary-line-'+key;el.className='line '+key+(['qty-discount','promo'].includes(key)?' discount':'');const a=document.createElement('span'),b=document.createElement('span');a.dataset.role='label';b.dataset.role='value';a.textContent=label;b.textContent=value;el.append(a,b);return el}));$('promo-apply').disabled=!$('promo-input').value.trim();$('promo-error').hidden=!promoError;$('promo-input').setAttribute('aria-invalid',String(promoError));show('promo-status',state.code?t.active?`Code ${state.code} applied.`:state.code==='SPRING10'?'SPRING10 requires €1,500.00 or more after the quantity discount.':'WELCOME50 cannot be combined with the quantity discount.':'');$('promo-status').style.color=t.active?'var(--color-accent)':'var(--color-muted)';$('promo-remove').hidden=!state.code;$('order-button').textContent=`Order ${state.qty} bike${state.qty===1?'':'s'}`;$('order-button').disabled=!v||!state.frame;$('order-hint').hidden=v;buildModel();scheduleDraw()}
$('height-input').addEventListener('input',e=>{if(state.height!==e.target.value)notice();state.height=e.target.value;if(state.auto&&valid())state.frame=recommended();cascade();render()});

function applyPromo(){if(!$('promo-input').value.trim())return;const code=$('promo-input').value.trim().toUpperCase();promoError=!['SPRING10','WELCOME50','FREESHIP'].includes(code);if(!promoError){state.code=code;$('promo-input').value=''}render()}
$('promo-apply').onclick=applyPromo;$('promo-input').addEventListener('input',()=>{promoError=false;render()});$('promo-input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();applyPromo()}};$('promo-remove').onclick=()=>{state.code=null;render()};

function buildModel(){parts=[];primitives=[];const R=state.wheels==='29'?375:350,L=({S:430,M:470,L:510,XL:550})[state.frame]||470,RA=[0,R,0],FA=[1080,R,0],BB=[420,300,0],ST=[420-.25*L,300+L,0],HT=[1000,340+L,0],HB=[1020,220+L,0],SP=add(ST,[-15,60,0]),HS=add(HT,[-60,60,0]);let current;
const part=(name,color)=>{current={name,rgb:color.match(/\w\w/g).map(v=>parseInt(v,16))};parts.push(name)},cap=(a,b,r)=>primitives.push({...current,a,b,r,ba:sub(b,a),type:'cap'}),box=(a,b)=>primitives.push({...current,a,b,type:'box'});
part('frame',item('color')[3].slice(1));for(const [a,b,r] of [[BB,ST,18],[ST,HT,18],[BB,HB,20],[HB,HT,20],[ST,RA,16],[BB,RA,16],[HB,FA,16],[ST,SP,13],[HT,HS,15],[add(HS,[0,0,-260]),add(HS,[0,0,260]),16]])cap(a,b,r);
part('saddle','1C1C1E');cap(add(SP,[-90,0,0]),add(SP,[80,0,0]),24);

for(const [name,center] of [['wheel-rear',RA],['wheel-front',FA]]){part(name,'1C1C1E');arc(center,R,0,36,22);cap(add(center,[0,0,-50]),add(center,[0,0,50]),15)}

}
function camera(){const y=rad(yaw),p=rad(pitch),E=add([540,450,0],mul([Math.sin(y)*Math.cos(p),Math.sin(p),Math.cos(y)*Math.cos(p)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return {E,f,r,u,W:canvas.clientWidth,H:260,F:130/Math.tan(rad(15))}}
function ray(c,x,y){return norm(add(add(c.f,mul(c.r,(x-c.W/2)/c.F)),mul(c.u,-(y-c.H/2)/c.F)))}
function hit(p,E,d){if(p.type==='box'){let lo=0,hi=Infinity;for(let k=0;k<3;k++){if(Math.abs(d[k])<1e-12){if(E[k]<p.a[k]||E[k]>p.b[k])return Infinity}else{let a=(p.a[k]-E[k])/d[k],b=(p.b[k]-E[k])/d[k];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}}return lo}
const ba=p.ba,ox=E[0]-p.a[0],oy=E[1]-p.a[1],oz=E[2]-p.a[2],baba=dot(ba,ba),bard=dot(ba,d),baoa=ba[0]*ox+ba[1]*oy+ba[2]*oz,rdoa=d[0]*ox+d[1]*oy+d[2]*oz,oaoa=ox*ox+oy*oy+oz*oz,A=baba-bard*bard,B=baba*rdoa-baoa*bard,C=baba*oaoa-baoa*baoa-p.r*p.r*baba,h=B*B-A*C;let best=Infinity;if(h>=0&&Math.abs(A)>1e-9){const t=(-B-Math.sqrt(h))/A,y=baoa+t*bard;if(t>=0&&y>=0&&y<=baba)best=t}for(const v of [p.a,p.b]){const x=E[0]-v[0],y=E[1]-v[1],z=E[2]-v[2],b=x*d[0]+y*d[1]+z*d[2],h=b*b-(x*x+y*y+z*z-p.r*p.r);if(h>=0){const t=-b-Math.sqrt(h);if(t>=0&&t<best)best=t}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:[...parts]});window.bikePickAt=(x,y)=>{const c=camera(),d=ray(c,x,y);let best=Infinity,name=null;for(const p of primitives){const t=hit(p,c.E,d);if(t<best){best=t;name=p.name}}return name};
function scheduleDraw(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;draw()})}}
function draw(){if(!canvas.clientWidth)return;const c=camera(),W=Math.round(c.W),H=260;canvas.width=W;canvas.height=H;const image=ctx.createImageData(W,H),data=image.data,depth=new Float64Array(W*H).fill(Infinity),rays=new Float64Array(W*H*3);for(let j=0;j<H;j++)for(let i=0;i<W;i++){const n=j*W+i,d=ray(c,i+.5,j+.5);rays.set(d,n*3);data.set([237,237,242,255],n*4)}
for(const p of primitives){const min=p.a.map((v,k)=>Math.min(v,p.b[k])-(p.r||0)),max=p.a.map((v,k)=>Math.max(v,p.b[k])+(p.r||0));let x0=W,x1=0,y0=H,y1=0;for(let a=0;a<8;a++){const q=[a&1?max[0]:min[0],a&2?max[1]:min[1],a&4?max[2]:min[2]],d=sub(q,c.E),z=dot(d,c.f),x=W/2+c.F*dot(d,c.r)/z,y=H/2-c.F*dot(d,c.u)/z;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}for(let j=Math.max(0,Math.floor(y0));j<Math.min(H,Math.ceil(y1));j++)for(let i=Math.max(0,Math.floor(x0));i<Math.min(W,Math.ceil(x1));i++){const n=j*W+i,d=[rays[n*3],rays[n*3+1],rays[n*3+2]],t=hit(p,c.E,d);if(t<depth[n]){depth[n]=t;data[n*4]=p.rgb[0];data[n*4+1]=p.rgb[1];data[n*4+2]=p.rgb[2]}}}ctx.putImageData(image,0,0)}
function turn(dy,dp){yaw=((yaw+dy)%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch+dp));scheduleDraw()}let pointer=null;canvas.onpointerdown=e=>{if(e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);e.preventDefault();canvas.focus()};canvas.onpointermove=e=>{if(!pointer||e.pointerId!==pointer.id)return;turn(.9*(e.clientX-pointer.x),.5*(e.clientY-pointer.y));pointer.x=e.clientX;pointer.y=e.clientY;e.preventDefault()};canvas.onpointerup=canvas.onpointercancel=()=>{pointer=null};canvas.onkeydown=e=>{const moves={ArrowRight:[15,0],ArrowLeft:[-15,0],ArrowUp:[0,5],ArrowDown:[0,-5]};if(moves[e.key]){e.preventDefault();turn(...moves[e.key])}else if(e.key==='Home'){e.preventDefault();yaw=0;pitch=10;scheduleDraw()}};new ResizeObserver(scheduleDraw).observe(canvas);render();
</script>
