let s,seq=0;function defaults(){s={frame:null,wheels:'275',drivetrain:'essential',color:'graphite',accessory:new Set(),qty:1,code:null,auto:true,height:''}}defaults();

const entry=g=>catalog[g].find(x=>x[0]===s[g]),cost=g=>g==='color'&&s.color==='red'&&s.drivetrain==='pro'?0:entry(g)?.[2]||0;
const roundRatio=(n,a,b)=>Number((BigInt(n)*BigInt(a)*2n+BigInt(b))/(2n*BigInt(b)));

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

$('order-button').onclick=()=>{seq++;$('main').hidden=true;notice();$('confirmation').hidden=false;$('confirmation-reference').textContent='BK-'+dateKey(new Date()).replaceAll('-','')+'-'+String(seq).padStart(3,'0');$('confirmation-total').textContent=money(prices().total);$('confirmation-delivery').textContent=delivery();$('confirmation-title').focus()};$('confirmation-new').onclick=()=>{defaults();$('height-input').value='';$('promo-input').value='';fieldError('promo',false);notice();$('confirmation').hidden=true;$('main').hidden=false;render();$('height-input').focus()};

<script>
const canvas=$('bike-preview'),ctx=canvas.getContext('2d');let yaw=0,pitch=10,parts=[],primitives=[],pending=false;
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,k)=>a.map(v=>v*k),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/Math.hypot(...a)),rad=a=>a*Math.PI/180;

start('frame',entry('color')[3]);for(let [a,b,r] of [[BB,ST,18],[ST,HT,18],[BB,HB,20],[HB,HT,20],[ST,RA,16],[BB,RA,16],[HB,FA,16],[ST,SP,13],[HT,HS,15],[add(HS,[0,0,-260]),add(HS,[0,0,260]),16]])cap(a,b,r);start('saddle','#1C1C1E');cap(add(SP,[-90,0,0]),add(SP,[80,0,0]),24);

for(let [name,a] of [['wheel-rear',RA],['wheel-front',FA]]){start(name,'#1C1C1E');arc(a,R,0,36,22);cap(add(a,[0,0,-50]),add(a,[0,0,50]),15)}if(s.accessory.has('mudguards'))for(let [name,a] of [['mudguard-rear',RA],['mudguard-front',FA]]){start(name,'#2C2C2E');arc(a,R+45,30,12,25)}if(s.accessory.has('rack')){start('rack','#48484A');box([-120,2*R+80,-90],[260,2*R+92,90]);cap([-100,2*R+86,0],RA,14)}if(s.accessory.has('lights')){start('light','#FFD60A');box(add(HT,[20,-60,-25]),add(HT,[70,-20,25]))}if(s.accessory.has('kickstand')){start('kickstand','#8E8E93');cap([380,300,60],[300,0,160],20)}}
function camera(){let t=rad(yaw),p=rad(pitch),E=add([540,450,0],mul([Math.sin(t)*Math.cos(p),Math.sin(p),Math.cos(t)*Math.cos(p)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return{E,f,r,u,F:130/Math.tan(rad(15)),W:canvas.getBoundingClientRect().width,H:260}}
function ray(c,x,y){return norm(add(add(c.f,mul(c.r,(x-c.W/2)/c.F)),mul(c.u,-(y-c.H/2)/c.F)))}
function hit(p,E,d){if(p.box){let lo=-Infinity,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(E[i]<p.min[i]||E[i]>p.max[i])return Infinity}else{let a=(p.min[i]-E[i])/d[i],b=(p.max[i]-E[i])/d[i];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}}return hi>=0?Math.max(0,lo):Infinity}
let oa=sub(E,p.a),bard=dot(p.ba,d),baoa=dot(p.ba,oa),rdoa=dot(d,oa),oaoa=dot(oa,oa),a=p.baba-bard*bard,b=p.baba*rdoa-baoa*bard,c=p.baba*oaoa-baoa*baoa-p.r*p.r*p.baba,h=b*b-a*c,best=Infinity;if(h>=0&&Math.abs(a)>1e-10){let t=(-b-Math.sqrt(h))/a,y=baoa+t*bard;if(t>=0&&y>=0&&y<=p.baba)best=t}for(let center of [p.a,p.b]){let oc=sub(E,center),b=dot(d,oc),h=b*b-dot(oc,oc)+p.r*p.r;if(h>=0){let t=-b-Math.sqrt(h);if(t>=0&&t<best)best=t}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:[...parts]});window.bikePickAt=(x,y)=>{let c=camera(),d=ray(c,x,y),best=Infinity,name=null;for(let p of primitives){let t=hit(p,c.E,d);if(t<best){best=t;name=p.part}}return name};
function draw(){pending=false;let c=camera();if(!c.W)return;let W=Math.round(c.W),H=260;canvas.width=W;canvas.height=H;let img=ctx.createImageData(W,H),depth=new Float64Array(W*H);depth.fill(Infinity);for(let i=0;i<W*H;i++){img.data[i*4]=237;img.data[i*4+1]=237;img.data[i*4+2]=242;img.data[i*4+3]=255}for(let p of primitives){let xs=[],ys=[];for(let i=0;i<8;i++){let q=[i&1?p.max[0]:p.min[0],i&2?p.max[1]:p.min[1],i&4?p.max[2]:p.min[2]],d=sub(q,c.E),z=dot(d,c.f);xs.push(c.W/2+c.F*dot(d,c.r)/z);ys.push(130-c.F*dot(d,c.u)/z)}let x0=Math.max(0,Math.floor(Math.min(...xs))-1),x1=Math.min(W-1,Math.ceil(Math.max(...xs))+1),y0=Math.max(0,Math.floor(Math.min(...ys))-1),y1=Math.min(H-1,Math.ceil(Math.max(...ys))+1);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){let d=ray(c,(x+.5)*c.W/W,y+.5),t=hit(p,c.E,d),i=y*W+x;if(t<depth[i]){depth[i]=t;for(let k=0;k<3;k++)img.data[i*4+k]=Math.round(p.color[k]*.85)}}}ctx.putImageData(img,0,0)}
function scheduleDraw(){if(!pending){pending=true;requestAnimationFrame(draw)}}function turn(dx,dy){yaw=((yaw+dx)%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch+dy));scheduleDraw()}let drag=null;canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();canvas.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY]};canvas.onpointermove=e=>{if(!drag)return;turn(.9*(e.clientX-drag[0]),.5*(e.clientY-drag[1]));drag=[e.clientX,e.clientY]};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onlostpointercapture=()=>drag=null;canvas.onkeydown=e=>{let m={ArrowRight:[15,0],ArrowLeft:[-15,0],ArrowUp:[0,5],ArrowDown:[0,-5]};if(m[e.key]){e.preventDefault();turn(...m[e.key])}else if(e.key==='Home'){e.preventDefault();yaw=0;pitch=10;scheduleDraw()}};new ResizeObserver(scheduleDraw).observe(canvas);render();
</script></body>
