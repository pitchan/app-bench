<script>
(()=>{'use strict';

const s={height:'',frame:null,wheels:'275',drive:'essential',color:'graphite',accessories:new Set(),qty:1,code:null,auto:true,notice:'',yaw:0,pitch:10,orders:0};
const $=(id)=>document.querySelector(`[data-testid="${id}"]`), id=(x)=>document.querySelector('#'+x); const money=n=>'€'+Math.floor(n/100).toLocaleString('en-US')+'.'+String(n%100).padStart(2,'0'), signed=n=>n===0?'Included':'+ '+money(n).replace('+ ',''); const discount=n=>'−'+money(n);const round=(n,d)=>Math.floor((n+d/2)/d);

function change(msg){s.notice=msg||''}function accessoryChange(key,on){if((on&&s.accessories.has(key))||(!on&&!s.accessories.has(key)))return;change('');if(key==='rack'&&on&&!s.accessories.has('mudguards')){s.accessories.add('mudguards');s.notice='Mudguards were added: required by the rear rack.'}if(key==='mudguards'&&!on&&s.accessories.has('rack')){s.accessories.delete('rack');s.notice='Rear rack was removed: it requires mudguards.'}if(on)s.accessories.add(key);else s.accessories.delete(key);render()}

function delivery(){let days=drives.find(x=>x[0]===s.drive)[3]+(s.color==='red'?3:0)+(s.qty>=3?2:0), date=new Date();date.setHours(12,0,0,0);for(let n=0;n<days;){date.setDate(date.getDate()+1);let key=date.toISOString().slice(0,10);if(date.getDay()!==0&&date.getDay()!==6&&!['2026-12-24','2026-12-25','2026-12-31','2027-01-01'].includes(key))n++}return date.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}

const he=$('height-error'),hr=$('height-recommendation'),hw=$('frame-warning'),hi=$('height-input');he.hidden=!(s.height.trim()&&!valid());he.textContent='Enter a height between 150 and 200 cm.';hr.hidden=!valid();hr.textContent=valid()?'Recommended frame: '+recommended():'';if(he.hidden){hi.removeAttribute('aria-invalid');hi.removeAttribute('aria-describedby')}else{hi.setAttribute('aria-invalid','true');hi.setAttribute('aria-describedby','height-error')}let gap=s.frame&&valid()?Math.abs(frames.findIndex(x=>x[0]===s.frame)-frames.findIndex(x=>x[0]===recommended())):0;hw.hidden=!(gap>=2);hw.textContent=hw.hidden?'':`Frame ${s.frame} is ${gap} sizes ${frames.findIndex(x=>x[0]===s.frame)>frames.findIndex(x=>x[0]===recommended())?'larger':'smaller'} than recommended.`;
id('qty-value').textContent=s.qty;id('qty-decrease').disabled=s.qty===1;id('qty-increase').disabled=s.qty===5;

let status=$('promo-status'),remove=$('promo-remove');status.hidden=!s.code;remove.hidden=!s.code;if(s.code){status.className='promo-status '+(pd&&pd.active?'active':'inactive');status.textContent=pd&&pd.active?`Code ${s.code} applied.`:s.code==='SPRING10'?'SPRING10 requires €1,500.00 or more after the quantity discount.':'WELCOME50 cannot be combined with the quantity discount.'}id('promo-apply').disabled=!id('promo').value.trim();let enabled=valid()&&!!s.frame;id('order').disabled=!enabled;id('order').textContent=`Order ${s.qty} ${s.qty===1?'bike':'bikes'}`;id('order-hint').hidden=valid();id('order-hint').textContent='Enter your height to continue.';let no=$('notice');no.textContent=s.notice;no.hidden=!s.notice;draw();}

id('order').addEventListener('click',()=>{if(id('order').disabled)return;s.orders++;let now=new Date(),date=String(now.getFullYear())+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0'),p=priceData();id('confirmation-reference').textContent=`BK-${date}-${String(s.orders).padStart(3,'0')}`;id('confirmation-total').textContent=money(p.total);id('confirmation-delivery').textContent=delivery();id('configurator').hidden=true;$('summary').hidden=true;$('notice').hidden=true;document.querySelector('[role=status]').hidden=true;id('page').hidden=true;$('confirmation').hidden=false;id('confirmation-title').focus()});id('new-config').addEventListener('click',()=>{s.height='';s.frame=null;s.wheels='275';s.drive='essential';s.color='graphite';s.accessories.clear();s.qty=1;s.code=null;s.auto=true;s.notice='';id('height').value='';id('promo').value='';$('promo-error').hidden=true;$('confirmation').hidden=true;document.querySelector('[role=status]').hidden=false;id('page').hidden=false;render();id('height').focus()});
// Perspective preview model
const canvas=id('preview'),ctx=canvas.getContext('2d');const rad=d=>d*Math.PI/180;function sizeCanvas(){let r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width);canvas.height=Math.round(r.height);draw()}new ResizeObserver(sizeCanvas).observe(canvas);function project(p){let W=canvas.width,H=canvas.height,F=(H/2)/Math.tan(rad(15)),th=rad(s.yaw),ph=rad(s.pitch),T=[540,450,0],E=[T[0]+3600*Math.sin(th)*Math.cos(ph),T[1]+3600*Math.sin(ph),3600*Math.cos(th)*Math.cos(ph)],f=T.map((x,i)=>(x-E[i])/3600),cross=[-f[2],0,f[0]],cl=Math.hypot(...cross)||1,r=cross.map(x=>x/cl),u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]],d=p.map((x,i)=>x-E[i]),df=d.reduce((a,x,i)=>a+x*f[i],0);return [W/2+F*d.reduce((a,x,i)=>a+x*r[i],0)/df,H/2-F*d.reduce((a,x,i)=>a+x*u[i],0)/df,df]}
function model(){let R=s.wheels==='29'?375:350,L=({S:430,M:470,L:510,XL:550})[s.frame]||470,RA=[0,R,0],FA=[1080,R,0],BB=[420,300,0],ST=[420-.25*L,300+L,0],HT=[1000,340+L,0],HB=[1020,220+L,0],SP=[ST[0]-15,ST[1]+60,0],HS=[HT[0]-60,HT[1]+60,0],parts=[];function add(name,color,lines){parts.push({name,color,lines})}let frame=[[BB,ST,18],[ST,HT,18],[BB,HB,20],[HB,HT,20],[ST,RA,16],[BB,RA,16],[HB,FA,16],[ST,SP,13],[HT,HS,15],[[HS[0],HS[1],-260],[HS[0],HS[1],260],16]];add('frame',colors.find(c=>c[0]===s.color)[2],frame);add('saddle','#1C1C1E',[[[SP[0]-90,SP[1],0],[SP[0]+80,SP[1],0],24]]);for(let [name,A] of [['wheel-rear',RA],['wheel-front',FA]]){let ln=[];for(let k=0;k<36;k++){let pt=q=>[A[0]+R*Math.cos(rad(10*q)),A[1]+R*Math.sin(rad(10*q)),0];ln.push([pt(k),pt((k+1)%36),22])}ln.push([[A[0],A[1],-50],[A[0],A[1],50],15]);add(name,'#1C1C1E',ln)}if(s.accessories.has('mudguards'))for(let [name,A] of [['mudguard-rear',RA],['mudguard-front',FA]]){let ln=[];for(let k=0;k<12;k++){let pt=q=>[A[0]+(R+45)*Math.cos(rad(30+10*q)),A[1]+(R+45)*Math.sin(rad(30+10*q)),0];ln.push([pt(k),pt(k+1),25])}add(name,'#2C2C2E',ln)}if(s.accessories.has('rack'))add('rack','#48484A',[[[-120,2*R+80,-90],[260,2*R+92,90],12],[[-100,2*R+86,0],RA,14]]);if(s.accessories.has('lights'))add('light','#FFD60A',[[[HT[0]+20,HT[1]-60,-25],[HT[0]+70,HT[1]-20,25],0]]);if(s.accessories.has('kickstand'))add('kickstand','#8E8E93',[[[380,300,60],[300,0,160],20]]);return parts}
function draw(){if(!ctx||!canvas.width)return;ctx.fillStyle='#EDEDF2';ctx.fillRect(0,0,canvas.width,canvas.height);let parts=model();let shapes=[];for(let part of parts)for(let line of part.lines){let a=project(line[0]),b=project(line[1]);shapes.push({part,a,b,r:line[2],depth:(a[2]+b[2])/2})}shapes.sort((a,b)=>b.depth-a.depth);for(let sh of shapes){let scale=(canvas.height/2)/Math.tan(rad(15))/sh.depth;ctx.beginPath();ctx.moveTo(sh.a[0],sh.a[1]);ctx.lineTo(sh.b[0],sh.b[1]);ctx.lineWidth=Math.max(1,sh.r*2*scale);ctx.lineCap='round';ctx.strokeStyle=sh.part.color;ctx.stroke()} }
window.bikePreviewState=()=>({yaw:s.yaw,pitch:s.pitch,parts:model().map(p=>p.name)});window.bikePickAt=(px,py)=>{if(px<0||py<0||px>canvas.width||py>canvas.height)return null;let best=Infinity,found=null;for(let sh of model().flatMap(p=>p.lines.map(line=>({p,line})))){let a=project(sh.line[0]),b=project(sh.line[1]),dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy||1))),dist=Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy),depth=a[2]+t*(b[2]-a[2]);let rr=sh.line[2]*(canvas.height/2/Math.tan(rad(15)))/depth;if(dist<=rr&&depth<best){best=depth;found=sh.p.name}}return found};
let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag[0],dy=e.clientY-drag[1];s.yaw=((s.yaw+.9*dx)%360+360)%360;s.pitch=Math.max(-20,Math.min(60,s.pitch+.5*dy));drag=[e.clientX,e.clientY];draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();if(e.key==='ArrowRight')s.yaw=(s.yaw+15)%360;if(e.key==='ArrowLeft')s.yaw=(s.yaw+345)%360;if(e.key==='ArrowUp')s.pitch=Math.min(60,s.pitch+5);if(e.key==='ArrowDown')s.pitch=Math.max(-20,s.pitch-5);draw()}if(e.key==='Home'){s.yaw=0;s.pitch=10;draw()}});
render();sizeCanvas();})();
