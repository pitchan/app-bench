function hit(p,o,d){if(p.box){let near=0,far=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(o[i]<p.min[i]||o[i]>p.max[i])return Infinity}else{let a=(p.min[i]-o[i])/d[i],b=(p.max[i]-o[i])/d[i];near=Math.max(near,Math.min(a,b));far=Math.min(far,Math.max(a,b));if(near>far)return Infinity}}return near}let oa=sub(o,p.a),bard=dot(p.ba,d),baoa=dot(p.ba,oa),rdoa=dot(d,oa),oaoa=dot(oa,oa),A=p.baba-bard*bard,B=p.baba*rdoa-baoa*bard,C=p.baba*oaoa-baoa*baoa-p.r*p.r*p.baba,h=B*B-A*C,best=Infinity;if(h>=0&&Math.abs(A)>1e-12){let t=(-B-Math.sqrt(h))/A,y=baoa+t*bard;if(t>=0&&y>=0&&y<=p.baba)best=t}for(let center of [p.a,p.b]){let oc=sub(o,center),b=dot(d,oc),h=b*b-dot(oc,oc)+p.r*p.r;if(h>=0){let t=-b-Math.sqrt(h);if(t>=0)best=Math.min(best,t)}}return best}
window.bikePreviewState=()=>({yaw,pitch,parts:[...parts]});window.bikePickAt=(x,y)=>{let c=camera(),d=ray(c,x,y),best=Infinity,name=null;for(let p of primitives){let t=hit(p,c.E,d);if(t<best){best=t;name=p.part.name}}return name};
function draw(){pending=false;let c=camera(),W=Math.round(c.W),H=260;if(!W)return;canvas.width=W;canvas.height=H;let img=ctx.createImageData(W,H),z=new Float64Array(W*H);z.fill(Infinity);for(let i=0;i<W*H;i++){img.data.set([237,237,242,255],i*4)}let rays=new Float64Array(W*H*3);for(let y=0;y<H;y++)for(let x=0;x<W;x++)rays.set(ray(c,x+.5,y+.5),(y*W+x)*3);for(let p of primitives){let xs=[],ys=[];for(let i=0;i<8;i++){let q=[i&1?p.max[0]:p.min[0],i&2?p.max[1]:p.min[1],i&4?p.max[2]:p.min[2]],v=sub(q,c.E),depth=dot(v,c.f);xs.push(c.W/2+c.F*dot(v,c.r)/depth);ys.push(H/2-c.F*dot(v,c.u)/depth)}let x0=Math.max(0,Math.floor(Math.min(...xs))),x1=Math.min(W-1,Math.ceil(Math.max(...xs))),y0=Math.max(0,Math.floor(Math.min(...ys))),y1=Math.min(H-1,Math.ceil(Math.max(...ys)));for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){let i=y*W+x,d=[rays[i*3],rays[i*3+1],rays[i*3+2]],t=hit(p,c.E,d);if(t<z[i]){z[i]=t;img.data[i*4]=p.part.color[0];img.data[i*4+1]=p.part.color[1];img.data[i*4+2]=p.part.color[2]}}}ctx.putImageData(img,0,0)}function scheduleDraw(){if(!pending){pending=true;requestAnimationFrame(draw)}}function turn(dx,dy){yaw=((yaw+dx)%360+360)%360;pitch=Math.max(-20,Math.min(60,pitch+dy));scheduleDraw()}let drag=null;canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;turn(.9*(e.clientX-drag[0]),.5*(e.clientY-drag[1]));drag=[e.clientX,e.clientY]};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onlostpointercapture=()=>drag=null;canvas.onkeydown=e=>{let keys={ArrowRight:[15,0],ArrowLeft:[-15,0],ArrowUp:[0,5],ArrowDown:[0,-5]};if(keys[e.key]){e.preventDefault();turn(...keys[e.key])}else if(e.key==='Home'){e.preventDefault();yaw=0;pitch=10;scheduleDraw()}};new ResizeObserver(scheduleDraw).observe(canvas);render();
</script></body></html>
