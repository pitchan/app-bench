<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5.2</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--text-md);
  line-height: 24px;
}
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--space-4);
}
header.wrap { padding-top: var(--space-5); padding-bottom: var(--space-5); }
header h1 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
main.wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-6);
  align-items: start;
  padding-bottom: 96px;
}
#confirm-wrap { padding-bottom: 96px; }
.configurator {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-4);
}
.panel {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.panel h2 {
  margin: 0 0 var(--space-4);
  font-size: var(--text-lg);
  line-height: 28px;
  font-weight: 600;
}
.summary { position: static; }
@media (min-width: 1024px) {
  .wrap { padding: 0 var(--space-5); }
  main.wrap { grid-template-columns: minmax(0, 1fr) 360px; }
  .summary { position: sticky; top: 24px; }
}

/* fields */
.field-label { display: block; margin-bottom: var(--space-2); font-weight: 600; }
.field {
  height: 40px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background-color: var(--color-surface);
  color: var(--color-text);
  padding: 0 var(--space-3);
  font: inherit;
  min-width: 0;
}
.field.invalid { border-color: var(--color-danger); }
.field:focus-visible, canvas:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
#height-input { width: 160px; max-width: 100%; display: block; }
.error { color: var(--color-danger); font-size: var(--text-sm); margin: var(--space-2) 0 0; }
.reco { margin: var(--space-2) 0 0; font-weight: 600; color: var(--color-accent); }
.warning {
  margin: var(--space-4) 0 0;
  font-size: var(--text-sm);
  color: var(--color-text);
  border-left: 4px solid var(--color-danger);
  padding: var(--space-2) var(--space-3);
  background-color: var(--color-bg);
  border-radius: var(--radius-control);
}

/* cards */
.grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.n1 { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) {
  .grid.w4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.w3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.w2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.card {
  --bw: 1px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-4);
  cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.card input {
  position: absolute;
  left: 8px;
  bottom: 8px;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.card:not(.is-selected):not(.is-disabled):hover { border-color: var(--color-muted); }
.card.is-selected {
  --bw: 2px;
  border: 2px solid var(--color-accent);
  padding: 15px;
}
.card.is-disabled { opacity: 0.45; cursor: not-allowed; }
.card:has(input:focus-visible) {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.card [data-role="name"] {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--color-text);
  padding-right: 24px;
  overflow-wrap: anywhere;
}
.card [data-role="price"] {
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
}
.card .meta { font-size: var(--text-sm); line-height: 20px; color: var(--color-muted); }
.card [data-role="reason"] { font-size: var(--text-sm); line-height: 20px; color: var(--color-text); }
.card [data-role="reason"].ghost { visibility: hidden; }
.card [data-role="check"] {
  position: absolute;
  top: calc(12px - var(--bw));
  right: calc(12px - var(--bw));
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card [data-role="check"] svg { display: block; }
.card [data-role="badge"] {
  position: absolute;
  top: calc(-1 * var(--bw));
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  line-height: 20px;
  font-weight: 600;
  padding: 2px 8px;
  white-space: nowrap;
}
.card [data-role="swatch"] {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  margin-bottom: var(--space-1);
  flex: none;
}

/* buttons */
button {
  font: inherit;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.btn {
  background-color: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text);
  height: 40px;
  border-radius: var(--radius-control);
  padding: 0 var(--space-4);
  cursor: pointer;
  white-space: nowrap;
}
.btn:not(:disabled):hover { border-color: var(--color-muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.square { width: 40px; padding: 0; font-size: var(--text-lg); line-height: 1; }
.primary {
  display: block;
  width: 100%;
  height: 48px;
  border: 0;
  border-radius: var(--radius-control);
  font-size: var(--text-md);
  font-weight: 600;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  cursor: pointer;
}
.primary:disabled {
  background-color: var(--color-disabled-bg);
  color: var(--color-muted);
  cursor: not-allowed;
}
.stepper { display: flex; align-items: center; gap: var(--space-3); }
.stepper [data-testid="qty-value"] {
  min-width: 32px;
  text-align: center;
  font-size: var(--text-lg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* summary */
#bike-preview {
  display: block;
  width: 100%;
  height: 260px;
  border: 0;
  padding: 0;
  background-color: #EDEDF2;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
#bike-preview.dragging { cursor: grabbing; }
.lines { margin-top: var(--space-4); }
.line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-3);
  padding: 2px 0;
}
.line [data-role="label"] {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.line [data-role="value"] {
  flex: none;
  margin-left: auto;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.line.sub [data-role="label"] { color: var(--color-muted); }
.line.sep { margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--color-border); }
.line.discount [data-role="value"] { color: var(--color-accent); }
.line.total {
  border-top: 1px solid var(--color-border);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
}
.line.total [data-role="label"], .line.total [data-role="value"] {
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
}
.line.small { font-size: var(--text-sm); color: var(--color-muted); }
.line.delivery { margin-top: var(--space-2); font-size: var(--text-sm); }
.promo { margin: var(--space-5) 0; }
.promo-row { display: flex; gap: var(--space-2); }
.promo-row .field { flex: 1 1 auto; width: 100%; }
.promo-state { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); }
.promo-state p { margin: 0; flex: 1 1 auto; min-width: 0; font-size: var(--text-sm); line-height: 20px; }
.promo-state .on { color: var(--color-accent); }
.promo-state .off { color: var(--color-muted); }
.hint { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--color-muted); text-align: center; }

/* notice */
.status {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  display: flex;
  justify-content: center;
  padding: 0 var(--space-4);
  pointer-events: none;
  z-index: 10;
}
.notice {
  max-width: 480px;
  background-color: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-accent);
  padding: 12px 16px;
  border-radius: var(--radius-control);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
}

/* confirmation */
.confirmation { max-width: 560px; margin: 0 auto; }
.confirmation h2 { font-size: var(--text-xl); line-height: 36px; font-weight: 700; outline: none; }
.confirmation dl { margin: 0 0 var(--space-5); }
.confirmation .row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-top: 1px solid var(--color-border);
}
.confirmation dt { color: var(--color-muted); }
.confirmation dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }
}
</style>
</head>
<body>
<header class="wrap" data-testid="app-header"><h1>Claude Fable 5.2</h1></header>

<main class="wrap" id="main">
  <div class="configurator" data-testid="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <label class="field-label" for="height-input">Your height (cm)</label>
      <input class="field" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off">
      <p class="error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
      <p class="reco" id="height-recommendation" data-testid="height-recommendation" hidden></p>
    </section>
    <section class="panel" data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="grid w4" id="grid-frame"></div>
      <p class="warning" id="frame-warning" data-testid="frame-warning" hidden></p>
    </section>
    <section class="panel" data-testid="section-wheels">
      <h2>3. Wheels</h2>
      <div class="grid w2" id="grid-wheels"></div>
    </section>
    <section class="panel" data-testid="section-drivetrain">
      <h2>4. Drivetrain</h2>
      <div class="grid w3 n1" id="grid-drivetrain"></div>
    </section>
    <section class="panel" data-testid="section-color">
      <h2>5. Color</h2>
      <div class="grid w4" id="grid-color"></div>
    </section>
    <section class="panel" data-testid="section-accessories">
      <h2>6. Accessories</h2>
      <div class="grid w2" id="grid-accessory"></div>
    </section>
    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="stepper">
        <button type="button" class="btn square" id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">&#x2212;</button>
        <span id="qty-value" data-testid="qty-value">1</span>
        <button type="button" class="btn square" id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>

  <aside class="panel summary" data-testid="summary">
    <canvas id="bike-preview" data-testid="bike-preview" tabindex="0" role="img" aria-label="Bike preview" width="310" height="260"></canvas>
    <div class="lines" id="lines"></div>
    <div class="promo">
      <label class="field-label" for="promo-input">Promo code</label>
      <div class="promo-row">
        <input class="field" id="promo-input" data-testid="promo-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <p class="error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
      <div class="promo-state" id="promo-state" hidden>
        <p id="promo-status" data-testid="promo-status"></p>
        <button type="button" class="btn" id="promo-remove" data-testid="promo-remove">Remove code</button>
      </div>
    </div>
    <button type="button" class="primary" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
    <p class="hint" id="order-hint" data-testid="order-hint">Enter your height to continue.</p>
  </aside>
</main>

<div class="wrap" id="confirm-wrap" hidden>
  <section class="panel confirmation" id="confirmation" data-testid="confirmation">
    <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
    <dl>
      <div class="row"><dt>Reference</dt><dd id="confirmation-reference" data-testid="confirmation-reference"></dd></div>
      <div class="row"><dt>Total</dt><dd id="confirmation-total" data-testid="confirmation-total"></dd></div>
      <div class="row"><dt>Estimated delivery</dt><dd id="confirmation-delivery" data-testid="confirmation-delivery"></dd></div>
    </dl>
    <button type="button" class="btn" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
  </section>
</div>

<div class="status" role="status"><div class="notice" id="notice" data-testid="notice" hidden></div></div>

<script>
/* ---------- Core: catalog, prices, delivery, 3D model (no DOM) ---------- */
var Core = (function () {
  'use strict';
  var CAT = {
    frame: [
      { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000, L: 430 },
      { id: 'M', name: 'Frame M', min: 165, max: 174, price: 119000, L: 470 },
      { id: 'L', name: 'Frame L', min: 175, max: 184, price: 124000, L: 510 },
      { id: 'XL', name: 'Frame XL', min: 185, max: 200, price: 129000, L: 550 }
    ],
    wheels: [
      { id: '275', name: '27.5" wheels', price: 0, R: 350 },
      { id: '29', name: '29" wheels', price: 12000, R: 375 }
    ],
    drivetrain: [
      { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
      { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
      { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
    ],
    color: [
      { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
      { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
      { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
      { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0 }
    ],
    accessory: [
      { id: 'mudguards', name: 'Mudguards', price: 4500 },
      { id: 'rack', name: 'Rear rack', price: 6900 },
      { id: 'lights', name: 'Lights', price: 3990 },
      { id: 'kickstand', name: 'Kickstand', price: 2450 }
    ]
  };
  var CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = { '2026-12-24': 1, '2026-12-25': 1, '2026-12-31': 1, '2027-01-01': 1 };
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function find(group, id) {
    var list = CAT[group];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function pad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }
  function amount(cents) {
    var euros = String(Math.floor(cents / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return '€' + euros + '.' + pad(cents % 100, 2);
  }
  function signed(cents) { return cents === 0 ? 'Included' : '+' + amount(cents); }
  function discount(cents) { return '−' + amount(cents); }
  function recommend(h) {
    for (var i = 0; i < CAT.frame.length; i++) if (h >= CAT.frame[i].min && h <= CAT.frame[i].max) return CAT.frame[i].id;
    return null;
  }
  function frameIndex(id) {
    for (var i = 0; i < CAT.frame.length; i++) if (CAT.frame[i].id === id) return i;
    return -1;
  }
  function colorPrice(s) { return (s.color === 'red' && s.drivetrain === 'pro') ? 0 : find('color', s.color).price; }

  /* s: {frame, wheels, drivetrain, color, acc:{id:bool}, qty, promo} */
  function price(s) {
    var r = { hasFrame: !!s.frame, promoActive: false, qtyDiscount: 0, promoDiscount: 0 };
    r.promoActive = s.promo === 'FREESHIP' || (s.promo === 'WELCOME50' && s.qty < 3);
    if (!s.frame) return r;
    var unit = find('frame', s.frame).price + find('wheels', s.wheels).price + find('drivetrain', s.drivetrain).price + colorPrice(s);
    CAT.accessory.forEach(function (a) { if (s.acc[a.id]) unit += a.price; });
    r.unit = unit;
    r.subtotal = unit * s.qty;
    r.qtyDiscount = s.qty >= 3 ? Math.floor((r.subtotal * 5 + 50) / 100) : 0;
    r.after = r.subtotal - r.qtyDiscount;
    if (s.promo === 'SPRING10' && r.after >= 150000) {
      r.promoActive = true;
      r.promoDiscount = Math.floor((r.after * 10 + 50) / 100);
    } else if (s.promo === 'WELCOME50' && s.qty < 3) {
      r.promoDiscount = 5000;
    }
    r.merchandise = r.after - r.promoDiscount;
    r.shipping = (s.promo === 'FREESHIP' || r.merchandise >= 200000) ? 0 : 4900;
    r.total = r.merchandise + r.shipping;
    r.vat = Math.floor((r.total * 20 + 60) / 120);
    return r;
  }
  function leadTime(s) {
    return find('drivetrain', s.drivetrain).lead + (s.color === 'red' ? 3 : 0) + (s.qty >= 3 ? 2 : 0);
  }
  function isBusiness(d) {
    var wd = d.getDay();
    if (wd === 0 || wd === 6) return false;
    return !CLOSED[d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2)];
  }
  function deliveryDate(today, lead) {
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
    var n = 0;
    while (n < lead) {
      d.setDate(d.getDate() + 1);
      if (isBusiness(d)) n++;
    }
    return d;
  }
  function formatDate(d) {
    return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- 3D model ---------- */
  var RAD = Math.PI / 180;
  var PART_NAMES = ['frame', 'saddle', 'wheel-rear', 'wheel-front', 'mudguard-rear', 'mudguard-front', 'rack', 'light', 'kickstand'];

  function hexRgb(hex) {
    return [parseInt(hex.substr(1, 2), 16), parseInt(hex.substr(3, 2), 16), parseInt(hex.substr(5, 2), 16)];
  }
  function modelParams(s) {
    return {
      R: find('wheels', s.wheels).R,
      L: s.frame ? find('frame', s.frame).L : 470,
      C: find('color', s.color).hex,
      mudguards: !!s.acc.mudguards, rack: !!s.acc.rack, lights: !!s.acc.lights, kickstand: !!s.acc.kickstand
    };
  }
  function presentParts(m) {
    var p = ['frame', 'saddle', 'wheel-rear', 'wheel-front'];
    if (m.mudguards) p.push('mudguard-rear', 'mudguard-front');

    $('qty-value').textContent = String(s.qty);
    $('qty-decrease').disabled = s.qty <= 1;
    $('qty-increase').disabled = s.qty >= 5;

    /* summary lines */
    var rows = [];
    var f = s.frame ? Core.find('frame', s.frame) : null;
    rows.push(f ? line('frame', 'Frame ' + f.id, Core.amount(f.price)) : line('frame', 'Frame', DASH));
    var w = Core.find('wheels', s.wheels), d = Core.find('drivetrain', s.drivetrain), col = Core.find('color', s.color);
    rows.push(line('wheels', w.name, Core.signed(w.price), 'sub'));
    rows.push(line('drivetrain', d.name, Core.signed(d.price), 'sub'));
    rows.push(line('color', col.name, Core.signed(Core.colorPrice(s)), 'sub'));
    CAT.accessory.forEach(function (a) {
      if (s.acc[a.id]) rows.push(line('accessory-' + a.id, a.name, Core.signed(a.price), 'sub'));
    });
    rows.push(line('unit', 'Unit price', f ? Core.amount(p.unit) : DASH, 'sep'));
    rows.push(line('quantity', 'Quantity', '× ' + s.qty));
    rows.push(line('subtotal', 'Subtotal', f ? Core.amount(p.subtotal) : DASH));
    if (f && s.qty >= 3) rows.push(line('qty-discount', 'Quantity discount (5%)', Core.discount(p.qtyDiscount), 'discount'));
    if (f && s.promo && p.promoActive && p.promoDiscount > 0) rows.push(line('promo', 'Code ' + s.promo, Core.discount(p.promoDiscount), 'discount'));
    rows.push(line('shipping', 'Shipping', f ? (p.shipping === 0 ? 'Free' : Core.amount(p.shipping)) : DASH));
    rows.push(line('total', 'Total', f ? Core.amount(p.total) : DASH, 'total'));
    rows.push(line('vat', 'Including VAT (20%)', f ? Core.amount(p.vat) : DASH, 'small'));
    rows.push(line('delivery', 'Estimated delivery', Core.formatDate(Core.deliveryDate(new Date(), Core.leadTime(s))), 'delivery'));
    var lines = $('lines');
    lines.textContent = '';
    rows.forEach(function (r) { lines.appendChild(r); });

    /* promo */
    $('promo-apply').disabled = promoInput.value.trim() === '';
    $('promo-error').hidden = !s.promoError;
    if (s.promoError) {
      promoInput.setAttribute('aria-invalid', 'true');
      promoInput.setAttribute('aria-describedby', 'promo-error');
    } else {
      promoInput.removeAttribute('aria-invalid');
      promoInput.removeAttribute('aria-describedby');
    }
    promoInput.classList.toggle('invalid', s.promoError);
    var st = $('promo-status');
    $('promo-state').hidden = !s.promo;
    if (s.promo) {
      st.textContent = p.promoActive ? 'Code ' + s.promo + ' applied.'
        : s.promo === 'SPRING10' ? 'SPRING10 requires €1,500.00 or more after the quantity discount.'
        : 'WELCOME50 cannot be combined with the quantity discount.';
      st.className = p.promoActive ? 'on' : 'off';
    } else {
      st.textContent = '';
    }

    /* order */
    $('order-button').textContent = s.qty === 1 ? 'Order 1 bike' : 'Order ' + s.qty + ' bikes';
    $('order-button').disabled = !(s.heightValid && s.frame);
    $('order-hint').hidden = s.heightValid;

    /* notice */
    var notice = $('notice');
    if (s.notice) {
      if (notice.textContent !== s.notice) notice.textContent = s.notice;
      notice.hidden = false;
    } else {
      notice.hidden = true;
      notice.textContent = '';
    }

    draw();
  }

  /* ----- 3D preview ----- */
  var canvas = $('bike-preview'), ctx = canvas.getContext('2d');
  var size = { W: 310, H: 260 };
  var modelKey = '', prims = [], drawnKey = '';
  function measure() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (w > 0 && h > 0) { size.W = w; size.H = h; }
  }
  function model() {
    var m = Core.modelParams(state);
    var key = JSON.stringify(m);
    if (key !== modelKey) { modelKey = key; prims = Core.buildModel(m); }
    return prims;
  }
  function draw() {
    measure();
    var pr = model();
    var key = modelKey + '|' + view.yaw + '|' + view.pitch + '|' + size.W + '|' + size.H;
    if (key === drawnKey) return;
    drawnKey = key;
    if (canvas.width !== size.W) canvas.width = size.W;
    if (canvas.height !== size.H) canvas.height = size.H;
    var img = ctx.createImageData(size.W, size.H);
    Core.render(pr, Core.makeCam(view.yaw, view.pitch, size.W, size.H), img.data);
    ctx.putImageData(img, 0, 0);
  }
  window.bikePreviewState = function () {
    return { yaw: view.yaw, pitch: view.pitch, parts: Core.presentParts(Core.modelParams(state)) };
  };
  window.bikePickAt = function (px, py) {
    measure();
    return Core.pick(model(), Core.makeCam(view.yaw, view.pitch, size.W, size.H), Number(px), Number(py));
  };
  function turn(dyaw, dpitch) {
    var y = (view.yaw + dyaw) % 360;
    if (y < 0) y += 360;
    if (y >= 360) y -= 360;
    view.yaw = y;
    view.pitch = Math.min(60, Math.max(-20, view.pitch + dpitch));
    draw();
  }
  var drag = null;
  function endDrag(e) {
    if (!drag) return;
    try { canvas.releasePointerCapture(drag.id); } catch (err) {}
    drag = null;
    canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || !e.isPrimary) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvas.classList.add('dragging');
    e.preventDefault();
    canvas.focus({ preventScroll: true });
  });
  canvas.addEventListener('mousedown', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.pointerType === 'mouse' && !(e.buttons & 1)) { endDrag(e); return; }
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (dx || dy) turn(0.9 * dx, 0.5 * dy);
    e.preventDefault();
  });
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);
  canvas.addEventListener('selectstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });
  canvas.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    switch (e.key) {
      case 'ArrowRight': turn(15, 0); break;
      case 'ArrowLeft': turn(-15, 0); break;
      case 'ArrowUp': turn(0, 5); break;
      case 'ArrowDown': turn(0, -5); break;
      case 'Home': view.yaw = 0; view.pitch = 10; draw(); break;
      default: return;
    }
    e.preventDefault();
  });
  if (typeof ResizeObserver === 'function') new ResizeObserver(function () { draw(); }).observe(canvas);
  window.addEventListener('resize', draw);

  update();
})();
</script>
</body>
</html>
