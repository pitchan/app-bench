groups.forEach((g,i)=>{const section=document.createElement('section');section.dataset.testid='section-'+g;section.innerHTML='<h2>'+ (i+1)+'. '+g[0].toUpperCase()+g.slice(1)+'</h2>';if(g==='rider')section.innerHTML+='<label for="height-input">Your height (cm)</label><input id="height-input" data-testid="height-input" type="text" inputmode="numeric" aria-describedby="height-error"><div id="height-error" data-testid="height-error" class="error message" hidden>Enter a height between 150 and 200 cm.</div><div id="height-recommendation" data-testid="height-recommendation" class="message" hidden></div>';else if(g==='quantity')section.innerHTML+='<div class="stepper"><button id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">−</button><span id="qty-value" data-testid="qty-value"></span><button id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button></div>';else{const group=g==='accessories'?'accessory':g;const grid=document.createElement('div');grid.className='grid '+group;catalog[group].forEach(([id,name,price,color])=>{const card=document.createElement('label');card.className='card';card.dataset.testid='card-'+group+'-'+id;const input=document.createElement('input');input.type=group==='accessory'?'checkbox':'radio';input.name=group;input.value=id;input.setAttribute('aria-label',name);card.append(input);if(color){const sw=document.createElement('span');sw.dataset.role='swatch';sw.style.backgroundColor=color;card.append(sw)}for(const [role,text] of [['name',name],['price',''],['check','✓'],['reason',id==='glacier'?'Out of stock':'Not available with frame S'],...(group==='frame'?[['badge','Recommended']]:[])]){const el=document.createElement('span');el.dataset.role=role;el.textContent=text;if(['check','reason','badge'].includes(role))el.hidden=true;card.append(el)}input.addEventListener('click',()=>{if(group==='frame')s.auto=false});input.addEventListener('keydown',e=>{if(group==='frame'&&e.key===' ')s.auto=false});inpu function notice(text=''){$('notice').textContent=text;$('notice').hidden=!text}

function choose(group,id,checked){notice();if(group==='accessory'){checked?s.accessory.add(id):s.accessory.delete(id);if(id==='rack'&&checked&&!s.accessory.has('mudguards')){s.accessory.add('mudguards');notice('Mudguards were added: required by the rear rack.')}if(id==='mudguards'&&!checked&&s.accessory.has('rack')){s.accessory.delete('rack');notice('Rear rack was removed: it requires mudguards.')}}else{s[group]=id;if(group==='frame'){s.auto=false;cascadeFrame()}}render()}

$('promo-input').oninput=()=>{$('promo-error').hidden=true;$('promo-input').setAttribute('aria-invalid','false');$('promo-apply').disabled=!$('promo-input').value.trim()};
function apply(){const code=$('promo-input').value.trim().toUpperCase();if(!code)return;const good=['SPRING10','WELCOME50','FREESHIP'].includes(code);$('promo-error').hidden=good;$('promo-input').setAttribute('aria-invalid',String(!good));if(good){s.code=code;$('promo-input').value=''}render()}
$('promo-apply').onclick=apply;$('promo-input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();apply()}};$('promo-remove').onclick=()=>{s.code=null;render()};
function item(g){return catalog[g].find(x=>x[0]===s[g])}function cost(g){return g==='color'&&s.color==='red'&&s.drivetrain==='pro'?0:item(g)?.[2]||0}

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

$('order-button').onclick=()=>{if(!s.valid||!s.frame)return;sequence++;$('main').hidden=true;notice();$('confirmation').hidden=false;$('confirmation-reference').textContent='BK-'+dateKey(new Date()).replaceAll('-','')+'-'+String(sequence).padStart(3,'0');$('confirmation-total').textContent=orderValues.total;$('confirmation-delivery').textContent=orderValues.delivery;$('confirmation-title').focus()};
$('confirmation-new').onclick=()=>{defaults();$('height-input').value='';$('promo-input').value='';for(const id of ['height-error','promo-error'])$(id).hidden=true;for(const id of ['height-input','promo-input'])$(id).setAttribute('aria-invalid','false');notice();$('confirmation').hidden=true;$('main').hidden=false;render();$('height-input').focus()};

function camera(){const E=add([540,450,0],mul([Math.sin(yaw*rad)*Math.cos(pitch*rad),Math.sin(pitch*rad),Math.cos(yaw*rad)*Math.cos(pitch*rad)],3600)),f=norm(sub([540,450,0],E)),r=norm(cross(f,[0,1,0])),u=cross(r,f);const c={E,f,r,u,F:130/Math.tan(15*rad),W:canvas.getBoundingClientRect().width,H:260};c.bounds=[];for(const part of parts)for(const primitive of part.primitives){const low=primitive.min||primitive.a.map((v,i)=>Math.min(v,primitive.b[i])-primitive.r),high=primitive.max||primitive.a.map((v,i)=>Math.max(v,primitive.b[i])+primitive.r);let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(let k=0;k<8;k++){const d=sub([k&1?high[0]:low[0],k&2?high[1]:low[1],k&4?high[2]:low[2]],E),depth=dot(d,f),x=c.W/2+c.F*dot(d,r)/depth,y=130-c.F*dot(d,u)/depth;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}c.bounds.push({part,primitive,x0,x1,y0,y1})}return c}
function sphere(o,d,c,r){let x=o[0]-c[0],y=o[1]-c[1],z=o[2]-c[2],b=x*d[0]+y*d[1]+z*d[2],h=b*b-(x*x+y*y+z*z-r*r);if(h<0)return Infinity;const t=-b-Math.sqrt(h);return t>=0?t:Infinity}
function intersect(o,d,p){if(p.min){let lo=0,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-12){if(o[i]<p.min[i]||o[i]>p.max[i])return Infinity}else{let a=(p.min[i]-o[i])/d[i],b=(p.max[i]-o[i])/d[i];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return Infinity}}return lo}if(sphere(o,d,p.center,p.bound)===Infinity)return Infinity;const ox=o[0]-p.a[0],oy=o[1]-p.a[1],oz=o[2]-p.a[2],ba=p.ba,bard=dot(ba,d),baoa=ba[0]*ox+ba[1]*oy+ba[2]*oz,rdoa=d[0]*ox+d[1]*oy+d[2]*oz,oaoa=ox*ox+oy*oy+oz*oz,A=p.baba-bard*bard,B=p.baba*rdoa-baoa*bard,C=p.baba*oaoa-baoa*baoa-p.r*p.r*p.baba,h=B*B-A*C;let t=Infinity;if(h>=0&&Math.abs(A)>1e-10){let v=(-B-Math.sqrt(h))/A,y=baoa+v*bard;if(v>=0&&y>0&&y<p.baba)t=v}return Math.min(t,sphere(o,d,p.a,p.r),sphere(o,d,p.b,p.r))}
function pick(px,py,c){const d=norm(add(c.f,add(mul(c.r,(px-c.W/2)/c.F),mul(c.u,-(py-c.H/2)/c.F))));let best=Infinity,found=null;for(const b of c.bounds){if(px<b.x0||px>b.x1||py<b.y0||py>b.y1)continue;const t=intersect(c.E,d,b.primitive);if(t<best){best=t;found=b.part}}return found}
window.bikePreviewState=()=>({yaw,pitch,parts:parts.map(p=>p.name)});window.bikePickAt=(px,py)=>pick(px,py,camera())?.name||null;
let pending=false;function scheduleDraw(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;draw()})}}
function draw(){if($('main').hidden)return;const c=camera(),w=Math.round(c.W),h=260;if(!w)return;canvas.width=w;canvas.height=h;const im=ctx.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=pick(x+.5,y+.5,c),i=(y*w+x)*4,col=p?p.color:[237,237,242];im.data[i]=col[0];im.data[i+1]=col[1];im.data[i+2]=col[2];im.data[i+3]=255}ctx.putImageData(im,0,0)}
function bound(){yaw=((yaw%360)+360)%360;pitch=Math.max(-20,Math.min(60,pitch));scheduleDraw()}let drag=null;canvas.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();canvas.focus();drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=.9*(e.clientX-drag[0]);pitch+=.5*(e.clientY-drag[1]);drag=[e.clientX,e.clientY];bound()};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null};canvas.onlostpointercapture=()=>{drag=null};canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();if(e.key==='Home'){yaw=0;pitch=10}else if(e.key==='ArrowLeft')yaw-=15;else if(e.key==='ArrowRight')yaw+=15;else if(e.key==='ArrowUp')pitch+=5;else pitch-=5;bound()};new ResizeObserver(scheduleDraw).observe(canvas);render();
