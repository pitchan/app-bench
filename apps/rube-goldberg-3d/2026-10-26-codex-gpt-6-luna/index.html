let settings={...defaults}, world, scene,camera,renderer,pmrem, clockSim=0, paused=false, speed=1, camMode='follow', activeStage=0, finished=false,failed=false, bodies=[],visuals=[],colliders=[],events=[], lastFrame=0,simAccumulator=0,orbital={az:1.0,el:.64,r:7.8},orbitDrag=null, basketSamples=[],basketAcceleration=null,pendulumSwingTime=null, lastBasketV=0; let rampEntry,steelBall,gate,basket,counter,pendulum,pendLatch,pivotP,pLen,cradle,weight,striker,bellMount,flywheel,wheelRotor,pulleyRope,dominoes,heavy,lever,lightBall,eventQueue,pendulumStart=null,bellSound=false,gateOpened=false;

}

world=new RAPIER.World({x:0,y:-settings.gravity,z:0});world.timestep=1/120;world.integrationParameters.numSolverIterations=8;world.integrationParameters.numAdditionalFrictionIterations=4;

lever=beam([2.22,.10,-.22],1,.14,.035,0,mats.woodLight,.75);lever.rb.setTranslation({x:2.22,y:.10,z:-.22},true);const pivot=world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(2.22+settings.leverPivot-.5,.10,-.22));world.createImpulseJoint(RAPIER.JointData.revolute({x:settings.leverPivot-.5,y:0,z:0},{x:0,y:0,z:0},{x:0,z:1}),pivot,lever.rb,true);

function registerHit(a,b,fn){events.push({kind:'pair',a:a.co,b:b.co,fn})}
registerHit(steelBall,dominoes[0],()=>setStage(2));for(let i=0;i<23;i++)registerHit(dominoes[i],dominoes[i+1],()=>{});registerHit(dominoes[23],heavy,()=>setStage(3));registerHit(heavy,lever,()=>{setStage(3);});registerHit(lightBall,basket,()=>setStage(4));registerHit(basket,pendLatch,()=>{if(stageData[5].status==='waiting'){setStage(5);pendulum.rb.setBodyType(RAPIER.RigidBodyType.dynamic,true);pendulum.rb.setLinvel({x:0,y:0,z:0},true);const anchor=world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(...pivotP));world.createImpulseJoint(RAPIER.JointData.revolute({x:0,y:pLen,z:0},{x:0,y:0,z:0},{x:0,z:1}),anchor,pendulum.rb,true);pendulumStart=clockSim}});
registerHit(pendulum,cradle[0],()=>{if(stageData[6].status==='waiting'){setStage(6);if(pendulumStart!==null){pendulumSwingTime=clockSim-pendulumStart;$('#swing').textContent=pendulumSwingTime.toFixed(2)+' s'}}});registerHit(cradle[4],weight,()=>setStage(7));events.push({kind:'sensor',sensor:strikerSensor,body:striker.co,stage:8,action:()=>playBell()});
pendulumStart=null;bellSound=false;gateOpened=false;
}
window.machineState=()=>({stages:stageData.map(s=>({...s})),basketAcceleration,pendulumSwingTime,settings:{...settings}});
window.addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function playBell(){if(bellSound)return;bellSound=true;setStage(8);finished=true;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(AudioCtx){const ac=new AudioCtx(),osc=ac.createOscillator(),gain=ac.createGain();osc.type='sine';osc.frequency.setValueAtTime(987,ac.currentTime);osc.frequency.exponentialRampToValueAtTime(493,ac.currentTime+1.2);gain.gain.setValueAtTime(.001,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.25,ac.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2.2);osc.connect(gain).connect(ac.destination);osc.start();osc.stop(ac.currentTime+2.2)}}
function step(dt){if(finished||failed)return;clockSim+=dt;$('#clock').textContent=clockSim.toFixed(2)+' s';if(!gateOpened&&clockSim>=1){gateOpened=true;gateRelease()}
if(stageData[0].status==='waiting'&&clockSim>=1)setStage(0);
world.step(eventQueue);eventQueue.drainCollisionEvents((h1,h2,started)=>{if(!started)return;for(const e of events){if(e.kind==='sensor'&&((h1===e.sensor.handle&&h2===e.body.handle)||(h2===e.sensor.handle&&h1===e.body.handle)))e.action?.();if(e.kind==='pair'&&((h1===e.a.handle&&h2===e.b.handle)||(h2===e.a.handle&&h1===e.b.handle)))e.fn()}});
// Catch physical collisions by overlap checks as a backup for contact pair event ordering.
for(let i=0;i<24;i++){if(dominoes[i].rb.translation().y<.07&&stageData[2].status==='waiting'&&i<2)setStage(2)}
const bv=basket.rb.linvel().y;if(stageData[4].status==='triggered'){basketSamples.push({t:clockSim,v:bv});if(basketSamples.length>3){const a=basketSamples[basketSamples.length-1],b=basketSamples[basketSamples.length-3];basketAcceleration=(a.v-b.v)/(a.t-b.t);$('#accel').textContent=basketAcceleration.toFixed(2)+' m/s²'}}lastBasketV=bv;
// 8 s no-progress timeout applies to the next waiting stage.
const last=Math.max(...stageData.map(s=>s.triggeredAt===null?-1:s.triggeredAt));if(clockSim-last>8){const waiting=stageData.findIndex(s=>s.status==='waiting');if(waiting>=0)failStage(waiting,'no contact within 8 simulation seconds')}
}
function syncVisuals(){for(const b of bodies){if(!b.visual)continue;const p=b.rb.translation(),q=b.rb.rotation();b.visual.position.set(p.x,p.y,p.z);b.visual.quaternion.set(q.x,q.y,q.z,q.w)}
if(pendulum){const p=pendulum.rb.translation();pendulumRod.position.set((p.x+pivotP[0])/2,(p.y+pivotP[1])/2,(p.z+pivotP[2])/2);pendulumRod.scale.y=Math.hypot(p.x-pivotP[0],p.y-pivotP[1],p.z-pivotP[2])/pLen;pendulumRod.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(p.x-pivotP[0],p.y-pivotP[1],p.z-pivotP[2]).normalize())}
if(pulleyRope){pulleyRope.position.set((basket.rb.translation().x+counter.rb.translation().x)/2,.43,-.22)}if(wheelRotor)flywheel.rotation.y=wheelRotor.rb.rotation().y;
}
function cameraUpdate(){if(camMode==='overview'){camera.position.set(0,3.8,7.7);camera.lookAt(.25,.1,.1)}else if(camMode==='follow'){const idx=Math.min(activeStage,8),targets=[[-1.2,.2,0],[-.1,-.2,0],[1.15,.2,0],[2.25,.3,0],[3,.35,0],[3,.55,.2],[3.1,.45,.8],[3.3,.55,1],[3.7,.4,1]];const t=targets[idx];const dest=new THREE.Vector3(t[0]-1.4,t[1]+1.35,t[2]+3.7);camera.position.lerp(dest,.035);camera.lookAt(t[0],t[1],t[2])}else{const x=orbital.r*Math.sin(orbital.az)*Math.cos(orbital.el),z=orbital.r*Math.cos(orbital.az)*Math.cos(orbital.el),y=orbital.r*Math.sin(orbital.el);camera.position.set(x,y,z);camera.lookAt(.25,.1,0)}}
function animate(now){requestAnimationFrame(animate);const real=Math.min(.1,(now-lastFrame)/1000||0);lastFrame=now;if(!paused&&!finished&&!failed){simAccumulator+=real*speed;const fixed=1/120;let count=0;while(simAccumulator>=fixed&&count<12){step(fixed);simAccumulator-=fixed;count++}}syncVisuals();cameraUpdate();renderer.render(scene,camera)}
$('#replay').addEventListener('click',()=>{settings=Object.fromEntries(specs.map(([k])=>[k,Number($('#'+k).value)]));reset()});$('#pause').addEventListener('click',()=>togglePause());$('#play').addEventListener('click',()=>togglePause());function togglePause(){paused=!paused;$('#pause').textContent=paused?'PLAY':'PAUSE';$('#play').textContent=paused?'PLAY':'PAUSE'}$('#camera').addEventListener('change',e=>{camMode=e.target.value});$('#speed').addEventListener('change',e=>speed=Number(e.target.value));window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();togglePause()}});renderer?.domElement.addEventListener('pointerdown',e=>{if(camMode==='orbit')orbitDrag={x:e.clientX,y:e.clientY}});window.addEventListener('pointerup',()=>orbitDrag=null);window.addEventListener('pointermove',e=>{if(orbitDrag&&camMode==='orbit'){orbital.az-=(e.clientX-orbitDrag.x)*.006;orbital.el=Math.max(.08,Math.min(1.35,orbital.el+(e.clientY-orbitDrag.y)*.005));orbitDrag={x:e.clientX,y:e.clientY}}});
await RAPIER.init();buildPanel();reset();setTimeout(()=>requestAnimationFrame(animate),1000);
</script>
</body>
</html>
