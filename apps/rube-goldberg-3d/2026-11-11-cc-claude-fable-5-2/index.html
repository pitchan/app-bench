<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5</title>
<style>
  :root { --bg: rgba(20, 17, 14, .74); --line: rgba(255, 222, 165, .17); --ink: #f4ebda; --dim: #a79a84; --brass: #e6b85c; --bad: #ff7d68; --ok: #9bd8a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b09; color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; background: var(--bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
  #brand { position: fixed; left: 16px; top: 10px; font-size: 15px; font-weight: 650; letter-spacing: .05em; color: var(--brass); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); pointer-events: none; }
  #checklist { left: 12px; top: 40px; width: 236px; padding: 8px 11px 9px; }
  #stages { list-style: none; margin: 0; padding: 0; }
  #stages li { display: grid; grid-template-columns: 20px 1fr auto; gap: 7px; align-items: center; padding: 2.5px 0; color: var(--dim); transition: color .25s; }
  #stages .n { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10.5px; font-weight: 600; transition: background .25s, box-shadow .25s; }
  #stages .t { font-variant-numeric: tabular-nums; font-size: 11.5px; }
  #stages li.triggered { color: var(--ink); }
  #stages li.triggered .n { background: var(--brass); border-color: var(--brass); color: #1c1407; box-shadow: 0 0 9px rgba(230, 184, 92, .65); }
  #stages li.next .n { border-color: var(--brass); color: var(--brass); animation: pulse 1.1s ease-in-out infinite; }
  #stages li.failed { color: var(--bad); }
  #stages li.failed .n { background: var(--bad); border-color: var(--bad); color: #2a0c06; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(230, 184, 92, .22); } }
  #measures { margin: 7px 0 0; padding-top: 7px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; }
  #measures dt { color: var(--dim); } #measures dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  #msg { margin-top: 7px; padding: 6px 8px; border-radius: 8px; font-size: 12px; display: none; }
  #msg.fail { display: block; background: rgba(255, 125, 104, .14); color: #ffb3a6; border: 1px solid rgba(255, 125, 104, .35); }
  #msg.done { display: block; background: rgba(230, 184, 92, .14); color: #ffe2a8; border: 1px solid rgba(230, 184, 92, .4); }
  #settings { right: 12px; top: 12px; width: 256px; padding: 10px 12px 12px; max-height: calc(100% - 84px); overflow: auto; }
  #settings h2 { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .ctl { margin: 8px 0 0; }
  .ctl label { display: flex; justify-content: space-between; gap: 8px; }
  .ctl output { font-variant-numeric: tabular-nums; color: var(--brass); }
  .ctl small { display: block; color: var(--dim); font-size: 11px; min-height: 14px; }
  .ctl small.warn { color: #ffb38a; }
  input[type=range] { width: 100%; margin: 3px 0 1px; accent-color: var(--brass); }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .row button { flex: 1; }
  #pending { margin-top: 6px; font-size: 11px; color: #ffcf8a; min-height: 14px; }
  button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(255, 255, 255, .14); }
  button.on, button.primary { background: var(--brass); border-color: var(--brass); color: #1c1407; font-weight: 600; }
  #bar { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 6px 8px; max-width: calc(100% - 16px); }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  #clock { font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; color: var(--dim); }
  #banner { left: 50%; top: 14px; transform: translateX(-50%); padding: 9px 18px; font-size: 15px; display: none; text-align: center; max-width: calc(100% - 560px); min-width: 240px; }
  #banner b { color: var(--brass); font-variant-numeric: tabular-nums; }
  #banner.fail b { color: var(--bad); }
  #sound { cursor: pointer; }
  #fatal { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: #ffb3a6; background: #0d0b09; }
  @media (max-width: 900px) {
    #settings { display: none; top: auto; bottom: 64px; max-height: 55%; }
    #settings.open { display: block; }
    #checklist { width: 200px; font-size: 12px; }
    #banner { top: auto; bottom: 64px; max-width: calc(100% - 24px); }
  }
  @media (min-width: 901px) { #settings.closed { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<canvas id="scene"></canvas>
<div id="brand">Claude Fable 5</div>

<aside id="checklist" class="panel" aria-label="Stage checklist">
  <ol id="stages"></ol>
  <dl id="measures">
    <dt>Basket acceleration</dt><dd id="mAcc">—</dd>
    <dt>Pendulum swing time</dt><dd id="mSwing">—</dd>
    <dt>Total chain time</dt><dd id="mTotal">—</dd>
  </dl>
  <div id="msg" role="status"></div>
</aside>

<aside id="settings" class="panel" aria-label="Settings">
  <h2>Settings</h2>
  <div id="controls"></div>
  <div class="row">
    <button id="apply" class="primary" title="Rebuild the machine with these values">Apply &amp; replay</button>
    <button id="defaults" title="Restore the baseline values">Defaults</button>
  </div>
  <div id="pending"></div>
</aside>

<div id="banner" class="panel" role="status"></div>

<nav id="bar" class="panel" aria-label="Playback and camera">
  <button id="pause" title="Space">Pause</button>
  <button id="replay">Replay</button>
  <div class="seg" id="speeds" role="group" aria-label="Simulation speed">
    <button data-speed="0.25">0.25×</button><button data-speed="0.5">0.5×</button><button data-speed="1">1×</button>
  </div>
  <div class="seg" id="cams" role="group" aria-label="Camera">
    <button data-cam="overview">Overview</button><button data-cam="follow">Follow</button><button data-cam="orbit">Orbit</button>
  </div>
  <span id="clock">t = 0.00 s</span>
  <button id="sound" title="Browsers keep audio locked until the first click or key press">Sound: locked</button>
  <button id="toggleSettings">Settings</button>
</nav>
<div id="fatal"></div>

<script type="module">
//<PHYS>
function createMachine(R, S) {
  const DT = 1 / 240;
  const rad = d => d * Math.PI / 180;
  const qAxis = (x, y, z, a) => { const s = Math.sin(a / 2); return { x: x * s, y: y * s, z: z * s, w: Math.cos(a / 2) }; };
  const qMul = (a, b) => ({
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z
  });
  const QI = { x: 0, y: 0, z: 0, w: 1 };

  const world = new R.World({ x: 0, y: -S.gravity, z: 0 });
  world.timestep = DT;
  world.numSolverIterations = 8;
  world.integrationParameters.normalizedPredictionDistance = 0.0005;   // lets the cradle balls sit 1 mm apart and still collide one pair at a time
  const eq = new R.EventQueue(true);

  const ents = [];
  const tagOf = new Map();

  function ent(kind, name, p, q, o = {}) {
    const d = kind === 'dyn' ? R.RigidBodyDesc.dynamic()
      : kind === 'kin' ? R.RigidBodyDesc.kinematicPositionBased() : R.RigidBodyDesc.fixed();
    d.setTranslation(p[0], p[1], p[2]);
    if (q) d.setRotation(q);
    if (o.noSleep) d.setCanSleep(false);
    if (o.ccd) d.setCcdEnabled(true);
    if (o.yOnly) { d.enabledTranslations(false, true, false); d.lockRotations(); }
    if (o.angDamp) d.setAngularDamping(o.angDamp);
    if (o.massProps) d.setAdditionalMassProperties(o.massProps.m, o.massProps.c, o.massProps.i, QI);
    const e = { name, kind, body: world.createRigidBody(d), parts: [], mat: o.mat || 'wood' };
    ents.push(e);
    return e;
  }
  function col(e, shape, dims, o = {}) {
    const cd = shape === 'box' ? R.ColliderDesc.cuboid(dims[0], dims[1], dims[2])
      : shape === 'ball' ? R.ColliderDesc.ball(dims[0]) : R.ColliderDesc.cylinder(dims[1], dims[0]);
    const p = o.p || [0, 0, 0];
    cd.setTranslation(p[0], p[1], p[2]);
    if (o.q) cd.setRotation(o.q);
    if (o.mass !== undefined) cd.setMass(o.mass);
    else if (o.density !== undefined) cd.setDensity(o.density);
    else cd.setDensity(0);
    cd.setFriction(o.f === undefined ? 0.5 : o.f);
    cd.setRestitution(o.e === undefined ? 0 : o.e);
    if (o.fMin) cd.setFrictionCombineRule(R.CoefficientCombineRule.Min);
    if (o.eMin) cd.setRestitutionCombineRule(R.CoefficientCombineRule.Min);
    cd.setActiveEvents(R.ActiveEvents.COLLISION_EVENTS);
    const c = world.createCollider(cd, e.body);
    tagOf.set(c.handle, o.tag || e.name);
    if (o.vis !== false) e.parts.push({ shape, dims, p, q: o.q || QI, mat: o.mat || e.mat });
    return c;
  }
  function vis(e, shape, dims, o = {}) {
    e.parts.push({ shape, dims, p: o.p || [0, 0, 0], q: o.q || QI, mat: o.mat || e.mat });
  }
  // Hinge to the world: a fixed base body carries the hinge frame.
  function hinge(e, anchor, local, axis, baseQ) {
    const base = ent('fix', e.name + '-base', anchor, baseQ || QI);
    const jd = R.JointData.revolute({ x: 0, y: 0, z: 0 }, { x: local[0], y: local[1], z: local[2] }, { x: axis[0], y: axis[1], z: axis[2] });
    world.createImpulseJoint(jd, base.body, e.body, true);
    return base;
  }

  // ---------------------------------------------------------------- layout
  const A = rad(20);                       // ramp slope
  const sinA = Math.sin(A), cosA = Math.cos(A);
  const DECK = 0.42, XB = 0.5, ZE = 0.15;
  const DOM = { t: 0.03, h: 0.20, w: 0.10 };
  const s = S.dominoSpacing;
  const NA = 9, NARC = 6, NB = 8;
  const Rarc = s / (2 * Math.sin(rad(90 / NARC / 2)));
  const zBlock = ZE - 0.012;
  const z23 = zBlock - 0.02 - (s - DOM.t) - DOM.t / 2;
  const zArcEnd = z23 - NB * s;
  const zA = zArcEnd - Rarc;
  const xArc0 = XB - Rarc;
  const d0x = xArc0 - NA * s;
  const span = 0.555, W = 0.64;
  const xT = d0x - DOM.t / 2 - 0.07 - span;

  const ground = ent('fix', 'ground', [0, 0, 0], null, { mat: 'table' });
  col(ground, 'box', [30, 0.5, 30], { p: [0, -0.5, 0], f: 0.6, vis: false, tag: 'table' });

  // ---------------------------------------------------------------- deck (raised shelf for stages 1-3)
  const deck = ent('fix', 'deck', [0, 0, 0], null, { mat: 'deck' });
  const slab = (x0, x1, z0, z1) => col(deck, 'box', [(x1 - x0) / 2, 0.02, (z1 - z0) / 2],
    { p: [(x0 + x1) / 2, DECK - 0.02, (z0 + z1) / 2], f: 0.8 });
  const xSeam = xArc0 - s / 2, zSeam = zArcEnd + s / 2;
  slab(xT - 0.08, xSeam, zA - 0.17, zA + 0.17);
  slab(xSeam, XB + 0.17, zA - 0.17, zSeam);
  slab(XB - 0.17, XB + 0.17, zSeam, ZE);
  const legAt = (x, z) => vis(deck, 'box', [0.02, (DECK - 0.04) / 2, 0.02], { p: [x, (DECK - 0.04) / 2, z], mat: 'darkwood' });
  for (const z of [zA - 0.13, zA + 0.13]) {
    const n = Math.max(2, Math.round((xSeam - xT) / 0.7) + 1);
    for (let i = 0; i < n; i++) legAt(xT - 0.04 + (xSeam - xT) * i / (n - 1), z);
  }
  legAt(XB + 0.13, zA - 0.13); legAt(XB + 0.13, zA + 0.13);
  {
    const n = Math.max(2, Math.round((ZE - zSeam) / 0.7) + 1);
    for (let i = 0; i < n; i++) for (const x of [XB - 0.13, XB + 0.13]) legAt(x, zSeam + (ZE - 0.14 - zSeam) * i / (n - 1));
  }

  // ---------------------------------------------------------------- stage 1-2: gate and switchback tower
  const tower = ent('fix', 'tower', [0, 0, 0], null, { mat: 'ramp' });
  const TW = (u, y, z) => [xT + u, DECK + y, zA + (z || 0)];
  const drop = span * Math.tan(A), pitch = drop + 0.07, yLow4 = 0.13;
  const ramps = [];
  for (let k = 1; k <= 4; k++) {
    const yTop = yLow4 + drop + (4 - k) * pitch, yLow = yTop - drop;
    const right = k % 2 === 0;
    const uTop = right ? 0 : W, uLow = right ? span : W - span;
    const n = right ? [sinA, cosA] : [-sinA, cosA];
    const mid = [(uTop + uLow) / 2, (yTop + yLow) / 2];
    const q = qAxis(0, 0, 1, right ? -A : A);
    const hl = span / (2 * cosA);
    col(tower, 'box', [hl, 0.008, 0.045], { p: TW(mid[0] - n[0] * 0.008, mid[1] - n[1] * 0.008), q, f: 0.3, e: 0.1, tag: 'ramp' + k });
    for (const z of [-0.04, 0.04])
      col(tower, 'box', [hl, 0.023, 0.005], { p: TW(mid[0] + n[0] * 0.015, mid[1] + n[1] * 0.015, z), q, f: 0.3, e: 0.1, mat: 'brass', tag: 'rail' });
    ramps.push({ yTop, yLow, right, uTop, uLow, n });
  }
  const wallBox = (u, y0, y1) => col(tower, 'box', [0.006, (y1 - y0) / 2, 0.045], { p: TW(u, (y0 + y1) / 2), f: 0.3, e: 0.2, mat: 'darkwood', tag: 'wall' });
  wallBox(-0.006, ramps[3].yTop - 0.06, ramps[0].yLow + 0.13);
  wallBox(W + 0.006, ramps[2].yTop - 0.06, ramps[0].yTop + 0.13);
  for (let k = 0; k < 3; k++) {            // cheeks that close the drop zone between two ramps
    const left = k % 2 === 0;
    const u0 = left ? 0 : W - 0.12, u1 = left ? 0.12 : W;
    const y0 = ramps[k + 1].yTop - 0.05, y1 = ramps[k].yLow + 0.06;
    for (const z of [-0.04, 0.04])
      col(tower, 'box', [(u1 - u0) / 2, (y1 - y0) / 2, 0.005], { p: TW((u0 + u1) / 2, (y0 + y1) / 2, z), f: 0.3, e: 0.1, mat: 'brass', tag: 'rail' });
  }
  const towerTop = ramps[0].yTop + 0.16;
  vis(tower, 'box', [(W + 0.024) / 2, towerTop / 2, 0.006], { p: TW(W / 2, towerTop / 2, -0.057), mat: 'board' });
  const r1 = ramps[0];
  const onR1 = (sd, h) => TW(W - sd * cosA + r1.n[0] * h, r1.yTop - sd * sinA + r1.n[1] * h);
  const RB = 0.03;
  const steel = ent('dyn', 'steel', onR1(0.05, RB + 0.0002), null, { noSleep: true, ccd: true, mat: 'steel' });
  col(steel, 'ball', [RB], { mass: 0.11, f: 0.3, e: 0.2 });
  const gate = ent('kin', 'gate', onR1(0.05 + RB + 0.0045, 0.085), qAxis(0, 0, 1, A), { mat: 'brass' });
  col(gate, 'box', [0.004, 0.0395, 0.032], { p: [0, -0.0395, 0], f: 0.1 });
  vis(gate, 'cyl', [0.005, 0.05], { q: qAxis(1, 0, 0, Math.PI / 2), mat: 'steel' });

  // ---------------------------------------------------------------- stage 3: dominoes
  const doms = [];
  for (let i = 0; i < 24; i++) {
    let x, z, psi = 0;
    if (i <= NA) { x = xArc0 - (NA - i) * s; z = zA; }
    else if (i <= NA + NARC) { psi = rad(90 / NARC * (i - NA)); x = xArc0 + Rarc * Math.sin(psi); z = zA + Rarc - Rarc * Math.cos(psi); }
    else { psi = Math.PI / 2; x = XB; z = zArcEnd + (i - NA - NARC) * s; }
    const e = ent('dyn', 'dom' + i, [x, DECK + DOM.h / 2, z], qAxis(0, 1, 0, -psi), { mat: i % 2 ? 'domA' : 'domB' });
    col(e, 'box', [DOM.t / 2, DOM.h / 2, DOM.w / 2], { mass: S.dominoMass, f: 0.3, e: 0.02 });
    doms.push(e);
  }

  // ---------------------------------------------------------------- stage 4: block and lever
  const block = ent('dyn', 'block', [XB, DECK + 0.10, zBlock], null, { noSleep: true, mat: 'iron' });
  col(block, 'box', [0.045, 0.10, 0.02], { mass: 1.0, f: 0.5, e: 0 });

  const p = S.leverPivot;
  const xSE = XB + 0.07, xPV = xSE - p, HP = 0.14, zL = ZE + 0.10;
  const padTop = 0.012, longArm = 1 - p;
  const beta = Math.asin((HP - 0.0125 - padTop) / (longArm - 0.03));
  const lever = ent('dyn', 'lever', [xPV, HP, zL], qAxis(0, 0, 1, beta), { noSleep: true, mat: 'beam' });
  col(lever, 'box', [0.5, 0.012, 0.035], { p: [p - 0.5, 0, 0], mass: 0.3, f: 0.5 });
  col(lever, 'box', [0.07, 0.005, 0.12], { p: [p - 0.07, 0.017, 0], mass: 0.15, f: 0.6, mat: 'brass' });
  for (const sx of [-1, 1]) col(lever, 'box', [0.005, 0.015, 0.12], { p: [p - 0.07 + sx * 0.065, 0.037, 0], f: 0.6, mat: 'brass' });
  for (const sz of [-1, 1]) col(lever, 'box', [0.07, 0.015, 0.005], { p: [p - 0.07, 0.037, sz * 0.115], f: 0.6, mat: 'brass' });
  const xCup = p - 1 + 0.045;
  for (const sx of [-1, 1]) col(lever, 'box', [0.005, 0.012, 0.044], { p: [xCup + sx * 0.039, 0.024, 0], f: 0.4, mat: 'brass' });
  for (const sz of [-1, 1]) col(lever, 'box', [0.044, 0.012, 0.005], { p: [xCup, 0.024, sz * 0.039], f: 0.4, mat: 'brass' });
  hinge(lever, [xPV, HP, zL], [0, 0, 0], [0, 0, 1]);
  const leverFix = ent('fix', 'leverfix', [0, 0, 0], null, { mat: 'darkwood' });
  col(leverFix, 'box', [0.03, padTop / 2, 0.035], { p: [xPV - (longArm - 0.03), padTop / 2, zL], f: 0.6, mat: 'felt' });
  const aS = p - 0.04, alpha = rad(12);
  const yStop = Math.max(0.004, HP - aS * Math.sin(alpha) - 0.012 * Math.cos(alpha));
  col(leverFix, 'box', [0.03, yStop / 2, 0.035], { p: [xPV + aS, yStop / 2, zL], f: 0.6, mat: 'felt' });
  for (const sz of [-1, 1]) vis(leverFix, 'box', [0.03, (HP + 0.03) / 2, 0.008], { p: [xPV, (HP + 0.03) / 2, zL + sz * 0.05] });
  vis(leverFix, 'cyl', [0.008, 0.062], { p: [xPV, HP, zL], q: qAxis(1, 0, 0, Math.PI / 2), mat: 'steel' });
  const lbL = [xCup, 0.012 + 0.03 + 0.0005];
  const light = ent('dyn', 'light', [xPV + lbL[0] * Math.cos(beta) - lbL[1] * Math.sin(beta), HP + lbL[0] * Math.sin(beta) + lbL[1] * Math.cos(beta), zL], null, { noSleep: true, ccd: true, mat: 'cork' });
  col(light, 'ball', [0.03], { mass: 0.05, f: 0.5, e: 0.05 });

  // ---------------------------------------------------------------- stage 5: basket, pulley, counterweight
  const xBK = xPV - 0.34, yB0 = 0.53, YW = 1.12, RW = 0.14;
  const basket = ent('dyn', 'basket', [xBK, yB0, zL], null, { noSleep: true, yOnly: true, mat: 'basket' });
  col(basket, 'box', [0.10, 0.01, 0.10], { p: [0, -0.01, 0], mass: 0.20, f: 0.7, e: 0, eMin: true });
  for (const sx of [-1, 1]) col(basket, 'box', [0.005, 0.05, 0.10], { p: [sx * 0.095, 0.05, 0], f: 0.5, e: 0, eMin: true });
  for (const sz of [-1, 1]) col(basket, 'box', [0.10, 0.05, 0.005], { p: [0, 0.05, sz * 0.095], f: 0.5, e: 0, eMin: true });
  const zCW = zL - 2 * RW, yC0 = 0.04;
  const cw = ent('dyn', 'cw', [xBK, yC0, zCW], null, { noSleep: true, yOnly: true, mat: 'iron' });
  col(cw, 'box', [0.035, 0.04, 0.035], { mass: S.counterweight, f: 0.5, e: 0 });
  let tension = 0;
  const mB = basket.body.mass(), mC = cw.body.mass();

  // ---------------------------------------------------------------- stage 6: latch and pendulum
  const zP = zL + 0.35, yC = 0.30, rBob = 0.04, YA = 0.06;

  g.gain.setValueAtTime(0.5 * level, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  src.connect(hp); hp.connect(g); g.connect(master); src.start(t); src.stop(t + 0.08);
}
function blip(kind) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime + 0.005;
  const P = { clack: [1900, 0.035, 0.16, 2.2], tick: [3600, 0.03, 0.12, 6], tock: [620, 0.05, 0.14, 2], thud: [140, 0.12, 0.3, 1] }[kind];
  if (!P) return;
  const src = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = P[0]; bp.Q.value = P[3];
  g.gain.setValueAtTime(P[2], t); g.gain.exponentialRampToValueAtTime(0.0001, t + P[1]);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t, (lastSmall++ % 7) * 0.02); src.stop(t + P[1] + 0.02);
}
function processFx(sim) {
  let small = 0;
  for (const f of sim.fx) {
    if (f.k === 'bell') {
      if (f.first) {
        bellGlow = 1;
        if (actx && actx.state === 'running') ringBell(f.v); else { pendingBell = f.v; soundChip(); }
      } else if (f.v > 1.5 && actx && actx.state === 'running') { ringBell(f.v * 0.4); bellGlow = Math.max(bellGlow, 0.5); }
    } else if (f.k !== 'stage' && f.k !== 'fail' && small < 3) { blip(f.k); small++; }
  }
  sim.fx.length = 0;
}

// ====================================================================== HUD
const stageEls = [];
{
  const ol = $('#stages');
  for (let i = 0; i < 9; i++) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="name"></span><span class="t"></span>`;
    ol.appendChild(li); stageEls.push(li);
  }
}
let hudSig = '';
function updateHud() {
  const sim = state.sim; if (!sim) return;
  $('#clock').textContent = 't = ' + sim.time.toFixed(2) + ' s';
  const sig = sim.stages.map(s => s.status[0] + (s.triggeredAt || '')).join('|') + sim.basketAcceleration + '/' + sim.pendulumSwingTime + '/' + sim.totalTime;
  if (sig === hudSig) return;
  hudSig = sig;
  const next = sim.complete || sim.failed ? -1 : sim.stages.findIndex(s => s.status === 'waiting');
  sim.stages.forEach((s, i) => {
    const li = stageEls[i];
    li.className = s.status + (i === next ? ' next' : '');
    li.children[1].textContent = s.name;
    li.children[2].textContent = s.status === 'triggered' ? s.triggeredAt.toFixed(2) + ' s' : s.status === 'failed' ? 'failed' : '';
  });
  $('#mAcc').textContent = sim.basketAcceleration === null ? '—' : sim.basketAcceleration.toFixed(3) + ' m/s²';
  $('#mSwing').textContent = sim.pendulumSwingTime === null ? '—' : sim.pendulumSwingTime.toFixed(3) + ' s';
  $('#mTotal').textContent = sim.totalTime === null ? '—' : sim.totalTime.toFixed(2) + ' s';
  const msg = $('#msg'), ban = $('#banner');
  if (sim.failed) {
    const prev = sim.stages[sim.failed.id - 2];
    const txt = `Stage ${sim.failed.id} (${sim.failed.name}) failed: nothing touched it within 8 s after ${prev ? prev.name : 'the start'}.`;
    msg.className = 'fail'; msg.textContent = txt;
    ban.className = 'panel fail'; ban.style.display = 'block';
    ban.innerHTML = `Chain stopped at <b>stage ${sim.failed.id} · ${sim.failed.name}</b>`;
  } else if (sim.complete) {
    msg.className = 'done'; msg.textContent = `The bell rang. Total chain time ${sim.totalTime.toFixed(2)} s of simulation.`;
    ban.className = 'panel'; ban.style.display = 'block';
    ban.innerHTML = `The bell rang · total chain time <b>${sim.totalTime.toFixed(2)} s</b>`;
  } else { msg.className = ''; msg.textContent = ''; ban.style.display = 'none'; }
}

// ====================================================================== cameras
const camTgt = new THREE.Vector3(), wantPos = new THREE.Vector3(), wantTgt = new THREE.Vector3(), dirNow = new THREE.Vector3(0.5, 0.4, 1).normalize();
let camSnap = true;
// view direction (from target to camera) for each number of triggered stages
const DIRS = [[0.5, 0.55, 1], [0.5, 0.55, 1], [0.5, 0.55, 1], [-0.35, 0.62, 1], [-0.25, 0.42, 1], [-0.4, 0.3, 1], [0.1, 0.24, 1], [0.32, 0.36, 1], [0.3, 0.8, 1], [0.8, 0.5, 0.7]];
function updateCamera(dt) {
  const sim = state.sim; if (!sim || !rig) return;
  const aspect = camera.aspect;
  if (state.cam === 'orbit') { controls.update(); camTgt.copy(controls.target); return; }
  if (state.cam === 'overview') {
    const t = Math.tan(camera.fov * Math.PI / 360);
    const distH = (rig.w / 2 + 0.25) / (t * aspect), distV = (rig.d * 0.315 + 0.7) / t;
    const dist = Math.max(distH, distV) * 1.04, el = 0.68, az = 0.14;
    wantTgt.set(rig.cx, 0.35, rig.cz + 0.1);
    wantPos.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(dist).add(wantTgt);
  } else {
    const f = sim.focus(), dv = DIRS[f.n];
    const want = V(dv[0], dv[1], dv[2]).normalize();
    dirNow.lerp(want, camSnap ? 1 : 1 - Math.exp(-2.2 * dt)).normalize();
    wantTgt.set(f.p[0], Math.max(0.15, f.p[1]), f.p[2]);
    const dist = f.d * (aspect < 1.2 ? Math.min(1.9, 1.2 / aspect) : 1);
    wantPos.copy(dirNow).multiplyScalar(dist).add(wantTgt);
  }
  if (camSnap) { camTgt.copy(wantTgt); camera.position.copy(wantPos); camSnap = false; }
  else {
    camTgt.lerp(wantTgt, 1 - Math.exp(-4.5 * dt));
    camera.position.lerp(wantPos, 1 - Math.exp(-2.6 * dt));
  }
  camera.lookAt(camTgt);
}
function setCam(mode) {
  state.cam = mode;
  controls.enabled = mode === 'orbit';
  if (mode === 'orbit') { controls.target.copy(camTgt); controls.update(); }
  document.querySelectorAll('#cams button').forEach(b => b.classList.toggle('on', b.dataset.cam === mode));
}
function setSpeed(v) {
  state.speed = v;
  document.querySelectorAll('#speeds button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.speed) === v));
}
function setPaused(p) {
  state.paused = p;
  const b = $('#pause'); b.textContent = p ? 'Play' : 'Pause'; b.classList.toggle('on', p);
}

// ====================================================================== run management
function rebuild(settings) {
  if (state.sim) { scene.remove(runRoot); disposeTree(runRoot); state.sim.free(); state.sim = null; }
  state.applied = { ...settings };
  state.sim = createMachine(RAPIER, { ...settings });
  buildScene(state.sim);
  state.done = false; state.failAt = null; stepDebt = 0; hudSig = ''; bellGlow = 0; pendingBell = null;
  camSnap = state.cam !== 'orbit';
  soundChip();
  for (const c of CONTROLS) inputs[c.key]._show();
  setPaused(false);
}
const replay = () => rebuild(readControls());

$('#pause').addEventListener('click', () => setPaused(!state.paused));
$('#replay').addEventListener('click', replay);
$('#apply').addEventListener('click', replay);
$('#defaults').addEventListener('click', () => { for (const c of CONTROLS) { inputs[c.key].value = c.def; } for (const c of CONTROLS) inputs[c.key]._show(); });
$('#speeds').addEventListener('click', e => { const s = e.target.dataset.speed; if (s) setSpeed(parseFloat(s)); });
$('#cams').addEventListener('click', e => { const c = e.target.dataset.cam; if (c) setCam(c); });
$('#toggleSettings').addEventListener('click', () => { const s = $('#settings'); if (window.innerWidth <= 900) s.classList.toggle('open'); else s.classList.toggle('closed'); });
$('#sound').addEventListener('click', audioUnlock);
document.addEventListener('click', e => { if (e.target instanceof HTMLButtonElement) e.target.blur(); });
window.addEventListener('pointerdown', audioUnlock);
window.addEventListener('keydown', e => {
  audioUnlock();
  if (e.code !== 'Space') return;
  const el = document.activeElement, tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;
  e.preventDefault();
  setPaused(!state.paused);
});
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
});

// ====================================================================== main loop: fixed physics step, capped steps per frame
const MAX_STEPS_PER_FRAME = 10;
let stepDebt = 0, lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  const sim = state.sim;
  if (sim && !state.paused && !state.done) {
    stepDebt += dt * state.speed;
    let n = Math.floor(stepDebt / sim.DT);
    if (n > MAX_STEPS_PER_FRAME) { n = MAX_STEPS_PER_FRAME; stepDebt = 0; } else stepDebt -= n * sim.DT;
    for (let i = 0; i < n; i++) sim.step();
    processFx(sim);
    if (sim.failed && state.failAt === null) state.failAt = sim.time;
    // hold on the finished machine once it has settled
    if ((sim.complete && sim.time > sim.totalTime + 6) || (sim.failed && sim.time > state.failAt + 3)) state.done = true;
  }
  if (bellGlow > 0) bellGlow = Math.max(0, bellGlow - dt * (state.paused ? 0 : 0.7));
  syncVisuals();
  updateCamera(dt);
  updateHud();
  renderer.render(scene, camera);
}

audioInit(); soundChip();
setSpeed(1); setCam('follow');
rebuild({ ...DEFAULTS });          // first run: mandatory defaults; the gate opens at t = 1 s on its own
requestAnimationFrame(t => { lastNow = t; frame(t); });
</script>
