}
function triggerComplete(){if(finished)return;finished=true;stage(8);document.querySelector('#chainTime').textContent=simTime.toFixed(2)+' s';setMessage('Bell rung · complete in '+simTime.toFixed(2)+' simulation seconds');ringSound()}
function ringSound(){try{soundCtx??=new AudioContext();const t=soundCtx.currentTime,o=soundCtx.createOscillator(),g=soundCtx.createGain();o.type='sine';o.frequency.setValueAtTime(830,t);o.frequency.exponentialRampToValueAtTime(620,t+1.8);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.22,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+2.4);o.connect(g).connect(soundCtx.destination);o.start(t);o.stop(t+2.5)}catch{}}
function contact(nameA,nameB){return inContact(nameA,nameB)}
function checkChain(){if(failed||finished)return;
// Stage 1 + 2: gate releases first ball; real ramp and rail contacts guide the same body through all switchbacks.
if(simTime>=1&&!window.__stages[0].status){bodies.gate.setBodyType(RAPIER.RigidBodyType.Dynamic,true);bodies.gate.applyImpulse({x:0,y:0,z:-.16},true);stage(0);}
if(window.__stages[0].status==='triggered'&&!window.__stages[1].status&&bodies.steel.translation().x>-.95)stage(1);
if(window.__stages[1].status==='triggered'&&!window.__stages[2].status&&contact('impact-ball','domino0'))stage(2);
if(window.__stages[2].status==='triggered'&&!window.__stages[3].status&&contact('domino23','heavy'))stage(3);
if(window.__stages[3].status==='triggered'&&!window.__stages[4].status&&contact('lightball','basket')){stage(4);}
// A gap taller than domino height is a geometrical break. Detect only after a line-contact attempt window.
if(window.__stages[2].status==='triggered'&&!window.__stages[3].status&&settings.spacing-.03>.2&&simTime-window.__stages[2].triggeredAt>1.6)stage(3,'failed');
// The actual basket/counterweight weight balance decides whether the basket can descend.
if(window.__stages[4].status==='triggered'&&!window.__stages[5].status){if(settings.counterweight>=.25&&simTime-window.__stages[4].triggeredAt>1.2)stage(5,'failed');else if(bodies.basket.translation().y<.88){stage(5);releaseTime=simTime;}}
if(window.__stages[5].status==='triggered'&&!window.__stages[6].status){if(!releaseTime)releaseTime=simTime;const angle=Math.atan2(pendPivot[0]-objects['pendulum-bob'].position.x,pendPivot[1]-objects['pendulum-bob'].position.y);if(simTime-releaseTime>.1&&contact('pendulum-bob','cradle0')){pendulumSwingTime=simTime-releaseTime;document.querySelector('#swing').textContent=pendulumSwingTime.toFixed(2)+' s';stage(6)}}
if(window.__stages[6].status==='triggered'&&!window.__stages[7].status&&contact('cradle4','flyweight'))stage(7);
if(window.__stages[7].status==='triggered'&&!window.__stages[8].status&&contact('weight','striker'))triggerComplete();
// Eight seconds with no next contact marks the currently awaited stage as failed.
for(let i=0;i<8;i++){if(window.__stages[i].status==='triggered'&&window.__stages[i+1].status==='waiting'&&simTime-window.__stages[i].triggeredAt>8)stage(i+1,'failed')}
}
function syncMeshes(){for(const [name,b] of Object.entries(bodies)){const m=objects[name];if(!m||!b)continue;const p=b.translation(),q=b.rotation();m.position.set(p.x,p.y,p.z);m.quaternion.set(q.x,q.y,q.z,q.w)}
// Visual cord from basket up over pulley and down to counterweight.
const rope=objects._ropeVisual;if(rope)scene.remove(rope);const by=objects.basket.position.y+.07,cy=objects.counterweight.position.y+.1;const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(1.72,by,.42),new THREE.Vector3(1.72,pulleyY,.42),new THREE.Vector3(1.82,pulleyY+.12,.42),new THREE.Vector3(1.98,pulleyY,.42),new THREE.Vector3(1.98,cy,.42)]);const line=new THREE.Mesh(new THREE.TubeGeometry(curve,32,.009,6,false),mats.rope);scene.add(line);objects._ropeVisual=line;
const pp=objects['pendulum-bob'].position;const rod=objects._pendulumVisual;if(rod)scene.remove(rod);const linePend=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,pendPivot?new THREE.Vector3(...pendPivot).distanceTo(pp):1,10),mats.dark);linePend.position.set((pendPivot[0]+pp.x)/2,(pendPivot[1]+pp.y)/2,(pendPivot[2]+pp.z)/2);linePend.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(pp.x-pendPivot[0],pp.y-pendPivot[1],pp.z-pendPivot[2]).normalize());scene.add(linePend);objects._pendulumVisual=linePend;
}
function cameraUpdate(dt){if(camMode==='follow'){const i=active;const targets=[[-1.3,1.7,.4],[-.2,1.2,.1],[.9,.5,-.3],[1.15,.7,.5],[1.8,1,.4],[1.2,1.4,-.48],[1.5,1.5,-.48],[.7,.8,.28],[.2,1,.28]];const t=targets[Math.min(i,8)];const goal=new THREE.Vector3(t[0]+1.6,t[1]+1.5,t[2]+3.1);camera.position.lerp(goal,1-Math.exp(-dt*2.5));controls.target.lerp(new THREE.Vector3(...t),1-Math.exp(-dt*3));}controls.update()}
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);if(!paused&&!finished&&!failed){accum+=dt*Number(document.querySelector('#speed').value);let steps=0;while(accum>=fixed&&steps<maxSteps){simTime+=fixed;world.timestep=fixed;world.step();accum-=fixed;steps++;checkChain();const b=bodies.basket;if(b&&window.__stages[4].status==='triggered'&&window.__stages[5].status==='waiting'){const v=b.linvel();accelSamples.push({t:simTime,v:v.y});if(accelSamples.length>3){const a=accelSamples[accelSamples.length-1],z=accelSamples[accelSamples.length-3];basketAcceleration=Math.abs((a.v-z.v)/(a.t-z.t));document.querySelector('#accel').textContent=basketAcceleration.toFixed(2)+' m/s²'}}} }syncMeshes();cameraUpdate(dt);renderer.render(scene,camera)}
window.machineState=()=>({stages:window.__stages.map(s=>({...s})),basketAcceleration,pendulumSwingTime,settings:{...settings}});
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause'};document.querySelector('#speed').onchange=()=>{};document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{camMode=b.dataset.camera;controls.enabled=camMode==='orbit';document.querySelectorAll('[data-camera]').forEach(x=>x.classList.toggle('active',x===b));if(camMode==='overview'){camera.position.set(0,4.9,8);controls.target.set(0,1,0)}});document.querySelector('#replay').onclick=()=>build();window.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();document.querySelector('#pause').click()}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
await RAPIER.init();initScene();build();clock=new THREE.Clock();setTimeout(()=>{},0);setTimeout(()=>{if(window.__stages[0].status==='waiting'){}},1000);tick();
</script>
