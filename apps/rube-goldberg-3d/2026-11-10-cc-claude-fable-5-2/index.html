<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5</title>
<style>
:root{--bg:rgba(22,18,14,.78);--line:rgba(255,220,160,.16);--ink:#f3e9d6;--dim:#b3a58c;--brass:#e0b354;--ok:#8fd694;--bad:#ff7b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#15110d;color:var(--ink);font:13px/1.35 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;background:var(--bg);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#brand{top:12px;left:12px;padding:8px 12px;display:flex;gap:12px;align-items:baseline}
#brand b{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--brass)}
#clock{font-variant-numeric:tabular-nums;font-size:15px}
#list{top:12px;right:12px;width:238px;padding:10px 12px}
#list ol{list-style:none;margin:0 0 8px;padding:0}
#list li{display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--dim)}
#list li i{width:9px;height:9px;border-radius:50%;background:#4a4136;flex:none;transition:.2s}
#list li span{flex:1}
#list li em{font-style:normal;font-variant-numeric:tabular-nums;font-size:12px}
#list li.triggered{color:var(--ink)}
#list li.triggered i{background:var(--brass);box-shadow:0 0 8px var(--brass)}
#list li.failed{color:var(--bad)}
#list li.failed i{background:var(--bad)}
#list li.active i{outline:1px solid var(--ink);outline-offset:2px}
.meas{border-top:1px solid var(--line);padding-top:7px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;color:var(--dim)}
.meas b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
#msg{margin-top:8px;padding:6px 8px;border-radius:6px;display:none;font-weight:600}
#msg.ok{display:block;background:rgba(143,214,148,.14);color:var(--ok)}
#msg.bad{display:block;background:rgba(255,123,107,.14);color:var(--bad)}
#bar{left:50%;bottom:12px;transform:translateX(-50%);padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.grp{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
button{font:inherit;color:var(--ink);background:transparent;border:0;padding:6px 10px;cursor:pointer}
button:hover{background:rgba(255,220,160,.1)}
button.on{background:var(--brass);color:#22190c;font-weight:600}
#set{left:12px;top:58px;width:250px;padding:10px 12px;max-height:calc(100vh - 130px);overflow:auto}
#set.hide{display:none}
#set label{display:block;margin:0 0 7px;color:var(--dim)}
#set label div{display:flex;justify-content:space-between}
#set label b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
#set input{width:100%;accent-color:var(--brass);margin:2px 0 0}
#set .row{display:flex;gap:6px;margin-top:4px}
#set .row button{flex:1;border:1px solid var(--line);border-radius:7px}
#set small{display:block;color:var(--dim);margin-top:6px}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);pointer-events:none}
@media(max-width:760px){#set{width:210px}#list{width:200px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">loading physics…</div>
<div id="brand" class="panel"><b>Claude Fable 5</b><span id="clock">t = 0.00 s</span></div>
<div id="list" class="panel">
  <ol id="stages"></ol>
  <div class="meas">
    <span>Basket acceleration</span><b id="mAcc">—</b>
    <span>Pendulum swing time</span><b id="mSw">—</b>
  </div>
  <div id="msg"></div>
</div>
<div id="set" class="panel">
  <div id="ctrls"></div>
  <div class="row"><button id="apply">Apply</button><button id="defaults">Defaults</button></div>
  <small>Changes take effect on Apply or Replay.</small>
</div>
<div id="bar" class="panel">
  <div class="grp"><button id="pause">Pause</button><button id="replay">Replay</button></div>
  <div class="grp" id="speeds"><button data-s="0.25">0.25×</button><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button></div>
  <div class="grp" id="cams"><button data-c="overview">Overview</button><button data-c="follow" class="on">Follow</button><button data-c="orbit">Orbit</button></div>
  <div class="grp"><button id="tset" class="on">Settings</button><button id="snd">Sound</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

let R;
{
  let mod;
  try{mod=await import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/+esm');}
  catch(e){mod=await import('https://esm.sh/@dimforge/rapier3d-compat@0.12.0');}
  R=(mod.default&&mod.default.init)?mod.default:mod;
  await R.init();
}
document.getElementById('load').remove();

/* ---------- renderer / scene ---------- */
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17130f);
scene.fog=new THREE.Fog(0x17130f,14,30);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(42,1,0.05,60);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enabled=false;controls.maxPolarAngle=1.52;
const sun=new THREE.DirectionalLight(0xffe2b8,2.6);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.bias=-0.0002;sun.shadow.normalBias=0.012;
scene.add(sun,sun.target,new THREE.HemisphereLight(0xbfd4e6,0x3a2a1c,0.55));
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ---------- procedural textures & materials (no Math.random) ---------- */
function lcg(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
function woodTex(base,dark,seed,rep){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),r=lcg(seed);
  g.fillStyle=base;g.fillRect(0,0,256,256);
  for(let i=0;i<90;i++){g.strokeStyle=dark;g.globalAlpha=0.08+r()*0.2;g.lineWidth=0.5+r()*2;const y=r()*256,w=r()*6;
    g.beginPath();g.moveTo(0,y);g.bezierCurveTo(80,y+w,170,y-w,256,y);g.stroke();}
  g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep||1,rep||1);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const std=o=>new THREE.MeshStandardMaterial(o);
const M={
  steel:std({color:0xdfe3e8,metalness:1,roughness:0.12}),
  chrome:std({color:0xf4f4f4,metalness:1,roughness:0.05}),
  brass:std({color:0xd9a441,metalness:1,roughness:0.22}),
  brassD:std({color:0x9c7430,metalness:1,roughness:0.35}),
  iron:std({color:0x30333a,metalness:0.85,roughness:0.5}),
  walnut:std({map:woodTex('#5a3a22','#2b170b',7,2),roughness:0.6}),
  oak:std({map:woodTex('#b98d56','#6f4a22',21,1),roughness:0.55}),
  maple:std({map:woodTex('#e3c592','#a67c44',33,1),roughness:0.5}),
  cherry:std({map:woodTex('#9c4f33','#4f2010',45,1),roughness:0.5}),
  floor:std({map:woodTex('#7b5a3c','#3c2614',99,10),roughness:0.75}),
  rope:std({color:0xcdb88a,roughness:0.95}),
  rubber:std({color:0x1c1c1e,roughness:0.9}),
  felt:std({color:0x2f6b57,roughness:1}),
  red:std({color:0xb5352b,roughness:0.45}),
  cream:std({color:0xece0c4,roughness:0.6}),
  wall:std({color:0x24403f,roughness:0.95}),
  glass:new THREE.MeshPhysicalMaterial({color:0xbfe6ff,transparent:true,opacity:0.22,roughness:0.05,metalness:0,side:THREE.DoubleSide,depthWrite:false}),
  glow:new THREE.MeshBasicMaterial({color:0xffd9a0})
};
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const qZ=a=>new THREE.Quaternion().setFromAxisAngle(V3(0,0,1),a);
const qY=a=>new THREE.Quaternion().setFromAxisAngle(V3(0,1,0),a);
const qX=a=>new THREE.Quaternion().setFromAxisAngle(V3(1,0,0),a);
const DEG=Math.PI/180;

/* ---------- room (decor only, far from the chain) ---------- */
{
  const d=new THREE.Group();scene.add(d);
  const add=(geo,mat,x,y,z,sh)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=!!sh;d.add(m);return m;};
  add(new THREE.BoxGeometry(18,0.1,14),M.floor,0.5,-0.05,2,false);
  add(new THREE.BoxGeometry(18,5,0.2),M.wall,0.5,2.5,-2.6);
  add(new THREE.BoxGeometry(0.2,5,14),M.wall,-5.2,2.5,2);
  add(new THREE.BoxGeometry(0.2,5,14),M.wall,6.4,2.5,2);
  add(new THREE.BoxGeometry(18,0.25,0.3),M.walnut,0.5,0.12,-2.45);
  // round attic window with brass frame
  add(new THREE.CircleGeometry(0.85,48),M.glow,2.6,3.0,-2.49);
  add(new THREE.TorusGeometry(0.87,0.06,12,48),M.brassD,2.6,3.0,-2.47);
  add(new THREE.BoxGeometry(1.74,0.05,0.05),M.brassD,2.6,3.0,-2.47);
  add(new THREE.BoxGeometry(0.05,1.74,0.05),M.brassD,2.6,3.0,-2.47);
  // shelf with books and gears
  add(new THREE.BoxGeometry(2.6,0.06,0.34),M.walnut,-0.6,3.2,-2.3,true);
  const cols=[M.red,M.felt,M.cream,M.cherry,M.brassD,M.oak];
  for(let i=0;i<11;i++)add(new THREE.BoxGeometry(0.07+0.01*(i%3),0.3+0.04*(i%4),0.22),cols[i%6],-1.7+i*0.11,3.4+0.02*(i%4),-2.3,true);
  for(let i=0;i<3;i++){const g=add(new THREE.TorusGeometry(0.13+0.05*i,0.03,8,20+6*i),i%2?M.brass:M.iron,0.0+i*0.36,3.38+0.05*i,-2.3,true);g.rotation.y=0.3*i;}
  // wall clock faces
  for(let i=0;i<3;i++){const x=4.3+i*0.75,y=2.2+0.5*(i%2);add(new THREE.CylinderGeometry(0.26,0.26,0.05,36),M.cream,x,y,-2.46).rotation.x=Math.PI/2;
    add(new THREE.TorusGeometry(0.27,0.03,10,36),M.brass,x,y,-2.44);
    const h=add(new THREE.BoxGeometry(0.02,0.2,0.01),M.iron,x+0.04*(i-1),y+0.07,-2.42);h.rotation.z=-0.5*(i-1);}
  // hanging lamps
  for(const lx of[-2.2,1.2,4.4]){add(new THREE.CylinderGeometry(0.005,0.005,1.2,6),M.iron,lx,4.4,4.6);
    add(new THREE.ConeGeometry(0.28,0.22,24,1,true),M.brassD,lx,3.75,4.6);add(new THREE.SphereGeometry(0.07,16,12),M.glow,lx,3.68,4.6);
    const p=new THREE.PointLight(0xffc98a,6,9,2);p.position.set(lx,3.6,4.6);d.add(p);}
  // rug and crates off to the side
  add(new THREE.BoxGeometry(2.2,0.012,1.4),M.red,-3.6,0.006,4.6);
  add(new THREE.BoxGeometry(0.6,0.6,0.6),M.oak,-4.4,0.3,-1.6,true);add(new THREE.BoxGeometry(0.45,0.45,0.45),M.cherry,-4.35,0.83,-1.65,true);
  add(new THREE.BoxGeometry(0.7,0.5,0.6),M.oak,5.6,0.25,-1.7,true);
}
/* ---------- settings ---------- */
const CTRL=[
  ['gravity','Gravity','m/s²',1,25,0.01,9.81],
  ['dominoSpacing','Domino spacing','m',0.07,0.28,0.005,0.12],
  ['dominoMass','Domino mass','kg',0.03,1,0.01,0.15],
  ['counterweightMass','Counterweight mass','kg',0.1,0.4,0.005,0.22],
  ['pendulumLength','Pendulum length','m',0.5,1.2,0.05,1.0],
  ['pendulumAngle','Pendulum release angle','°',20,75,1,60],
  ['leverPivot','Lever pivot from short end','m',0.2,0.45,0.01,0.25],
  ['cradleRestitution','Cradle restitution','',0,1,0.01,0.95]
];
const ui={};for(const c of CTRL)ui[c[0]]=c[6];   // values shown on the controls
let S={...ui};                                    // values used by the current run
// fixed (mandatory) parameters
const FIX={steelR:0.03,steelM:0.11,slope:20*DEG,domH:0.20,domW:0.10,domT:0.03,blockM:1.0,leverLen:1.0,lightM:0.05,
  basketM:0.20,bobM:0.5,cradleN:5,cradleR:0.025,rampFriction:0.3};
const DT=1/960, MAX_STEPS=40, P=1.05 /* upper bench height */;
const NAMES=['Release gate','Switchback ramps','Dominoes','Lever','Pulley','Pendulum',"Newton's cradle",'Carousel','Bell'];
const RULES=[null,['steel','rampB'],['steel','dom0'],['dom23','block'],['light','basket'],['basket','latchPad'],['bob','cr0'],['cr4','rotor'],['hammer','bell']];

/* ---------- run state ---------- */
let world=null,eq=null,root=null,tags,dyn,G,t,st,next,failed,finished,lastTrig,chainTime,finishedReal;
let basketAcc,swingTime,relT,accS,accDone;

function body(kind,p,q,o={}){
  const d=kind==='dyn'?R.RigidBodyDesc.dynamic():kind==='kin'?R.RigidBodyDesc.kinematicPositionBased():R.RigidBodyDesc.fixed();
  d.setTranslation(p[0],p[1],p[2]);if(q)d.setRotation({x:q.x,y:q.y,z:q.z,w:q.w});
  if(kind==='dyn'){d.setCanSleep(false);if(o.ccd)d.setCcdEnabled(true);if(o.ad)d.setAngularDamping(o.ad);if(o.ld)d.setLinearDamping(o.ld);
    if(o.yOnly){d.enabledTranslations(false,true,false);d.lockRotations();}}
  const rb=world.createRigidBody(d),g=new THREE.Group();g.position.set(p[0],p[1],p[2]);if(q)g.quaternion.copy(q);root.add(g);
  const B={rb,g};if(kind!=='fix')dyn.push(B);return B;
}
function col(B,desc,o){
  if(o.p)desc.setTranslation(o.p[0],o.p[1],o.p[2]);
  if(o.q)desc.setRotation({x:o.q.x,y:o.q.y,z:o.q.z,w:o.q.w});
  desc.setFriction(o.fr??0.5).setRestitution(o.re??0.05);
  if(o.m!=null)desc.setMass(o.m);
  if(o.frMin)desc.setFrictionCombineRule(R.CoefficientCombineRule.Min);
  if(o.reMax)desc.setRestitutionCombineRule(R.CoefficientCombineRule.Max);
  desc.setActiveEvents(R.ActiveEvents.COLLISION_EVENTS);
  const c=world.createCollider(desc,B.rb);if(o.tag)tags.set(c.handle,o.tag);return c;
}
function vis(B,geo,mat,o={}){
  const m=new THREE.Mesh(geo,mat);if(o.p)m.position.set(o.p[0],o.p[1],o.p[2]);if(o.q)m.quaternion.copy(o.q);
  const tr=mat===M.glass;m.castShadow=!tr;m.receiveShadow=!tr;B.g.add(m);return m;
}
function box(B,h,mat,o={}){if(!o.noCol)col(B,R.ColliderDesc.cuboid(h[0],h[1],h[2]),o);return mat?vis(B,new THREE.BoxGeometry(2*h[0],2*h[1],2*h[2]),mat,o):null;}
function sph(B,r,mat,o={}){if(!o.noCol)col(B,R.ColliderDesc.ball(r),o);return mat?vis(B,new THREE.SphereGeometry(r,32,20),mat,o):null;}
function cyl(B,hh,r,mat,o={}){if(!o.noCol)col(B,R.ColliderDesc.cylinder(hh,r),o);return mat?vis(B,new THREE.CylinderGeometry(r,r,2*hh,24),mat,o):null;}
function hinge(B,anchorW,anchorL,axis,base){
  const jd=R.JointData.revolute({x:anchorW[0],y:anchorW[1],z:anchorW[2]},{x:anchorL[0],y:anchorL[1],z:anchorL[2]},{x:axis[0],y:axis[1],z:axis[2]});
  return world.createImpulseJoint(jd,(base||G.ground).rb,B.rb,true);
}
const rot2=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
// decorative post (no collider)
function post(x,z,y0,y1,r,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r||0.012,r||0.012,Math.abs(y1-y0),10),mat||M.iron);
  m.position.set(x,(y0+y1)/2,z);m.castShadow=true;m.receiveShadow=true;root.add(m);return m;}

/* ---------- machine, part A: floor, bench, ramps, dominoes, block, lever, catch chute ---------- */
function buildA(){
  G.ground=body('fix',[0,0,0]);
  box(G.ground,[9,0.05,7],null,{p:[0.5,-0.05,2],fr:0.6});

  // --- domino path: 6 straight, 4 on a 90° arc, 14 straight ---
  const s=S.dominoSpacing,al=22.5*DEG,Rc=s/(2*Math.sin(al/2)),x0=-1.32;
  const dp=[];
  for(let i=0;i<24;i++){
    if(i<6)dp.push([x0+i*s,0,0]);
    else if(i<10){const k=i-5;dp.push([x0+5*s+Rc*Math.sin(k*al),Rc*(1-Math.cos(k*al)),k*al]);}
    else dp.push([x0+5*s+Rc,Rc+(i-9)*s,Math.PI/2]);
  }
  const xE=dp[23][0],zE=dp[23][1];
  const zEdge=zE+0.172,zb=zEdge+0.17,zS=zb-0.22;
  Object.assign(G,{xE,zE,zEdge,zb,zS});

  // --- upper bench + shelf plank ---
  const px0=-2.3,px1=xE+0.19,pz0=-0.4,pz1=zEdge-0.10;
  const bench=body('fix',[0,0,0]);
  box(bench,[(px1-px0)/2,P/2-0.02,(pz1-pz0)/2-0.03],M.walnut,{p:[(px0+px1)/2,P/2-0.02,(pz0+pz1)/2],noCol:true});
  box(bench,[(px1-px0)/2,P/2,(pz1-pz0)/2],null,{p:[(px0+px1)/2,P/2,(pz0+pz1)/2],fr:0.6});
  vis(bench,new THREE.BoxGeometry(px1-px0+0.06,0.04,pz1-pz0+0.03),M.oak,{p:[(px0+px1)/2,P-0.02,(pz0+pz1)/2-0.015]});
  box(bench,[0.15,0.015,0.05],M.cherry,{p:[xE,P-0.015,zEdge-0.05],fr:0.6});

  // --- switchback ramps ---
  const TH=FIX.slope,RL=0.62,cs=Math.cos(TH),sn=Math.sin(TH);
  let H=[-1.267,1.39],dir=-1;
  const back=new THREE.Mesh(new THREE.BoxGeometry(0.95,1.72,0.014),M.cream);back.position.set(-1.64,P+0.86,-0.078);back.receiveShadow=true;back.castShadow=true;root.add(back);
  for(let k=0;k<4;k++){
    const rho=-dir*TH,B=body('fix',[H[0],H[1]+P,0],qZ(rho)),tag='ramp'+'ABCD'[k],o={fr:FIX.rampFriction,re:0.1,tag};
    box(B,[RL/2,0.01,0.06],M.maple,{...o,p:[dir*RL/2,-0.01,0]});
    for(const sg of[-1,1]){
      box(B,[RL/2,0.035,0.006],M.brass,{...o,p:[dir*RL/2,0.035,sg*0.052]});
      if(k>0)box(B,[0.14,0.08,0.004],M.glass,{...o,p:[dir*0.14,0.15,sg*0.052]});
    }
    box(B,[0.006,0.11,0.058],M.cherry,{...o,p:[-dir*0.006,0.10,0]});
    if(k===0){
      // gate: kinematic flap hinged above the track; the only timed part of the machine
      const hp=rot2(dir*0.10,0.10,rho),gp=[H[0]+hp[0],H[1]+P+hp[1],0];
      G.gate=body('kin',gp,qZ(rho));G.gateRho=rho;G.gateDir=dir;G.gateProg=0;
      box(G.gate,[0.004,0.045,0.044],M.red,{p:[0,-0.045,0],fr:0.2,re:0});
      cyl(G.gate,0.06,0.006,M.iron,{q:qX(Math.PI/2),noCol:true});
      const bp=rot2(dir*0.06,0.0303,rho);
      G.steel=body('dyn',[H[0]+bp[0],H[1]+P+bp[1],0],null,{ccd:true});
      sph(G.steel,FIX.steelR,M.chrome,{m:FIX.steelM,fr:FIX.rampFriction,re:0.3,tag:'steel'});
    }
    const low=[H[0]+dir*RL*cs,H[1]-RL*sn];
    H=[low[0]+dir*0.16,low[1]-0.13];dir=-dir;
  }

  // --- dominoes ---
  G.doms=[];
  const dm=[M.maple,M.cherry,M.oak];
  for(let i=0;i<24;i++){

/* ---------- stage logic ---------- */
function trig(i){

  st[i].status='triggered';st[i].triggeredAt=+t.toFixed(4);lastTrig=t;next=i+1;hudDirty=true;
  if(i===6)swingTime=+(t-(relT??st[5].triggeredAt)).toFixed(4);
  if(i===8){finished=true;chainTime=t;finishedReal=performance.now();ring();setMsg('ok','Bell rung — chain time '+t.toFixed(2)+' s');}

  if(!soundOn)return;const c=actx,t0=c.currentTime+0.01,out=c.createGain();out.gain.value=0.45;out.connect(c.destination);
  for(const[m,a,d]of[[1,1,3.2],[2.0,0.55,2.2],[2.76,0.42,1.6],[4.07,0.24,1.1],[5.43,0.16,0.8],[6.79,0.09,0.5]]){
    const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=1046.5*m;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(a*0.4,t0+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(out);o.start(t0);o.stop(t0+d+0.05);
  }
}
function ring(){const c=ac();if(!c)return;if(c.state==='running')ringNow();else{pendingRing=true;c.resume().catch(()=>{});}}
function tick(f){
  if(!soundOn||!actx||actx.state!=='running'||t-lastTick<0.02)return;lastTick=t;
  const c=actx,t0=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.06,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.04);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+0.05);
}
function unlock(){const c=ac();if(!c)return;const go=()=>{if(pendingRing){pendingRing=false;ringNow();}};if(c.state==='running')go();else c.resume().then(go).catch(()=>{});}
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);

/* ---------- HUD ---------- */
let hudDirty=true;
const li=NAMES.map((n,i)=>{const e=document.createElement('li');e.innerHTML='<i></i><span>'+(i+1)+'. '+n+'</span><em></em>';$('stages').appendChild(e);return e;});
function setMsg(k,s){const m=$('msg');m.className=k;m.textContent=s;}
function hud(){
  $('clock').textContent='t = '+(finished?chainTime:t).toFixed(2)+' s';
  $('mAcc').textContent=basketAcc==null?'—':basketAcc.toFixed(2)+' m/s²';
  $('mSw').textContent=swingTime==null?'—':swingTime.toFixed(3)+' s';
  if(!hudDirty)return;hudDirty=false;
  st.forEach((s,i)=>{li[i].className=s.status+((i===Math.max(0,next-1)&&!finished&&!failed)?' active':'');
    li[i].lastChild.textContent=s.triggeredAt!=null?s.triggeredAt.toFixed(2)+' s':s.status==='failed'?'failed':'';});
}

/* ---------- cameras ---------- */
let camMode='follow',camSnap=true;
const cPos=V3(),cTgt=V3(),wPos=V3(),wTgt=V3();
const bp=B=>{const v=B.rb.translation();return V3(v.x,v.y,v.z);};
function overview(){
  const b=G.bounds,cx=(b.x0+b.x1)/2,cz=(b.z0+b.z1)/2,vf=camera.fov*DEG/2,hf=Math.atan(Math.tan(vf)*camera.aspect);
  const k=Math.max(((b.x1-b.x0)/2+0.4)/Math.tan(hf)+(b.z1-b.z0)/2,2.4/Math.tan(vf));
  wTgt.set(cx,0.8,cz);wPos.set(cx+0.12*k,0.8+0.5*k,cz+0.86*k);
}
function follow(){
  if(finished&&performance.now()-finishedReal>3000)return overview();
  const i=Math.max(0,next-1);let f,o;
  switch(i){
    case 0:case 1:f=bp(G.steel);o=[0.5,0.45,2.3];break;
    case 2:{let k=0;for(let j=0;j<24;j++){const q=G.doms[j].rb.rotation();if(1-2*(q.x*q.x+q.z*q.z)<0.94)k=j;}
      f=bp(G.doms[Math.min(23,k+1)]);o=[1.5,1.25,1.1];break;}
    case 3:f=bp(G.light).lerp(V3(G.pivX,G.HP+0.3,G.zb),0.5);o=[0.1,0.7,3.3];break;
    case 4:f=bp(G.basket).add(V3(0.05,0.35,0));o=[0.5,0.5,2.4];break;
    case 5:f=bp(G.bob).lerp(V3(G.B0x,YC,G.zS),0.5);o=[0.2,0.5,2.8];break;
    case 6:f=V3(G.B0x+0.25,YC+0.15,G.zS);o=[0.3,0.45,1.7];break;
    case 7:f=V3(G.xr,G.yr,G.zr);o=[0.5,0.9,1.5];break;
    default:f=V3(G.bellPos[0],G.bellPos[1],G.bellPos[2]).lerp(V3(G.xr,G.yr,G.zr),0.3);o=[0.6,0.8,1.3];
  }
  wTgt.copy(f);wPos.set(f.x+o[0],f.y+o[1],f.z+o[2]);
}
function cam(d){
  if(camMode==='orbit'){controls.update();return;}
  if(camMode==='overview')overview();else follow();
  if(camSnap){cPos.copy(wPos);cTgt.copy(wTgt);camSnap=false;}
  else{cPos.lerp(wPos,1-Math.exp(-2.6*d));cTgt.lerp(wTgt,1-Math.exp(-4.5*d));}
  camera.position.copy(cPos);camera.lookAt(cTgt);
}
function setCam(m){
  if(m===camMode)return;
  if(m==='orbit'){controls.target.copy(cTgt);controls.enabled=true;controls.update();}
  else{if(camMode==='orbit'){cPos.copy(camera.position);cTgt.copy(controls.target);}controls.enabled=false;}
  camMode=m;document.querySelectorAll('#cams button').forEach(b=>b.classList.toggle('on',b.dataset.c===m));
}

/* ---------- body → mesh sync ---------- */
function seg(m,x,y0,y1,z){m.position.set(x,(y0+y1)/2,z);m.scale.y=Math.max(0.001,y1-y0);}
function sync(){
  for(const B of dyn){const p=B.rb.translation(),q=B.rb.rotation();B.g.position.set(p.x,p.y,p.z);B.g.quaternion.set(q.x,q.y,q.z,q.w);}
  const yb=G.basket.rb.translation().y,yw=G.cw.rb.translation().y;
  seg(G.ropeL,G.xbk,yb+0.13,PUL_Y,G.zb+0.17);seg(G.ropeR,G.xbk+2*PUL_R,yw+0.05,PUL_Y,G.zb+0.17);
  G.wheel.rotation.z=(YB0-yb)/PUL_R;
}

/* ---------- controls ---------- */
let paused=false,speed=1;
const inputs={};
for(const c of CTRL){
  const l=document.createElement('label'),dec=c[5]<0.01?3:c[5]<1?2:0;
  l.innerHTML='<div><span>'+c[1]+'</span><b></b></div><input type="range" min="'+c[3]+'" max="'+c[4]+'" step="'+c[5]+'" value="'+c[6]+'">';
  const inp=l.querySelector('input'),out=l.querySelector('b'),show=()=>{out.textContent=(+inp.value).toFixed(dec)+(c[2]?' '+c[2]:'');};
  inp.addEventListener('input',()=>{ui[c[0]]=+inp.value;show();});
  inputs[c[0]]={inp,show};show();$('ctrls').appendChild(l);
}
function replay(){S={...ui};build();acc=0;}
function togglePause(){paused=!paused;$('pause').textContent=paused?'Play':'Pause';$('pause').classList.toggle('on',paused);}
$('apply').onclick=replay;$('replay').onclick=replay;
$('defaults').onclick=()=>{for(const c of CTRL){ui[c[0]]=c[6];inputs[c[0]].inp.value=c[6];inputs[c[0]].show();}replay();};
$('pause').onclick=togglePause;
$('speeds').onclick=e=>{const s=e.target.dataset.s;if(!s)return;speed=+s;document.querySelectorAll('#speeds button').forEach(b=>b.classList.toggle('on',b===e.target));};
$('cams').onclick=e=>{if(e.target.dataset.c)setCam(e.target.dataset.c);};
$('tset').onclick=()=>{$('tset').classList.toggle('on',!$('set').classList.toggle('hide'));};
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'Sound':'Muted';unlock();};
if(innerWidth<760){$('set').classList.add('hide');$('tset').classList.remove('on');}
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')e.target.blur();});
addEventListener('keydown',e=>{
  if(e.code!=='Space')return;const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  e.preventDefault();togglePause();
});

window.machineState=()=>({
  stages:st.map(s=>({id:s.id,name:s.name,status:s.status,triggeredAt:s.triggeredAt})),
  basketAcceleration:basketAcc,pendulumSwingTime:swingTime,
  settings:{...ui,speed,camera:camMode,paused},
  applied:{...S},time:+t.toFixed(4),chainTime:chainTime==null?null:+chainTime.toFixed(4)
});

/* ---------- main loop: fixed timestep, capped steps per frame ---------- */
let acc=0,last=performance.now();
build();
function frame(now){
  requestAnimationFrame(frame);
  const d=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(!paused){
    acc+=d*speed;let n=0;
    while(acc>=DT&&n<MAX_STEPS){step();acc-=DT;n++;}
    if(acc>DT*MAX_STEPS)acc=0;
  }
  sync();cam(d);hud();renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
