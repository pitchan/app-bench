<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurum</title>
<style>
:root{--bg:#101719;--panel:#182326;--line:#334548;--ink:#edf2e8;--muted:#9eaeaa;--gold:#d9aa58;--green:#96d6a4;--red:#ff927e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif}#scene{position:absolute;inset:0}canvas{display:block}header{position:absolute;inset:16px 18px auto;display:flex;align-items:center;gap:18px;pointer-events:none}.brand{font:600 18px/1 Georgia,serif;letter-spacing:.14em;color:#f4d69b}.bar{display:flex;gap:8px;align-items:center;background:#101719d9;border:1px solid var(--line);border-radius:12px;padding:7px;pointer-events:auto;backdrop-filter:blur(10px)}button,select{background:#253437;border:1px solid #3b5051;color:var(--ink);padding:7px 11px;border-radius:8px;font:inherit;cursor:pointer}button:hover,select:hover{border-color:var(--gold)}button.primary{background:#b88135;color:#171714;border-color:#d6ac68;font-weight:700}.readout{color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums}.panel{position:absolute;right:18px;top:76px;width:286px;max-height:calc(100vh - 94px);overflow:auto;background:#101719e8;border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(12px);box-shadow:0 18px 50px #0005}.section-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}.stages{display:grid;gap:5px;margin-bottom:16px}.stage{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;color:#9eaeaa;padding:5px 6px;border-radius:7px;font-size:11px}.stage .dot{width:8px;height:8px;border-radius:50%;background:#526466;box-shadow:0 0 0 3px #293738}.stage.active{color:#fff;background:#263735}.stage.active .dot{background:var(--green);box-shadow:0 0 0 3px #375b45,0 0 12px #8cdfa5}.stage.failed{color:#ffd2c7;background:#3c2926}.stage.failed .dot{background:var(--red);box-shadow:0 0 0 3px #714039}.stage time{font-variant-numeric:tabular-nums;color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 105px;gap:8px 10px;align-items:center}.grid label{font-size:11px;color:#bdc9c4}.grid input{width:100%;accent-color:var(--gold)}.grid .value{color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;font-size:11px}.metrics{border-top:1px solid var(--line);padding-top:11px;margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:5px;color:var(--muted);font-size:11px}.metrics b{color:#eee;font-weight:500;font-variant-numeric:tabular-nums}.message{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#111a1bdc;border:1px solid #45595a;border-radius:10px;padding:8px 14px;color:#d6dfd9;white-space:nowrap;pointer-events:none}.message.fail{color:#ffb6a7;border-color:#875045}.hint{color:#798a86;font-size:10px;margin-top:10px}
</style>
</head>
<body><div id="scene"></div><header><div class="brand">AURUM</div><div class="bar"><button id="pause">Pause</button><button id="replay" class="primary">Replay</button><span class="readout" id="clock">0.00 s</span><select id="speed" aria-label="Simulation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select><select id="camera" aria-label="Camera"><option value="follow" selected>Follow</option><option value="overview">Overview</option><option value="orbit">Orbit</option></select></div></header>
<aside class="panel"><h2 class="section-title">Sequence</h2><div class="stages" id="stages"></div><h2 class="section-title">Experiment settings</h2><div class="grid" id="controls"></div><div class="metrics"><span>Basket acceleration</span><b id="accel">—</b><span>Pendulum swing time</span><b id="swing">—</b></div><div class="hint">Space toggles pause · drag in Orbit view</div></aside><div id="message" class="message">The mechanism will begin automatically</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/+esm';
const defs={gravity:9.81,spacing:.12,dominoMass:.15,counterweight:.22,pendulumLength:1,pendulumAngle:60,pivot:.25,restitution:.95};let settings={...defs};
const defsUI=[['gravity','Gravity',4,15,.01,' m/s²'],['spacing','Domino spacing',.12,.5,.01,' m'],['dominoMass','Domino mass',.05,.6,.01,' kg'],['counterweight','Counterweight',.1,.7,.01,' kg'],['pendulumLength','Pendulum length',.6,1.5,.05,' m'],['pendulumAngle','Release angle',25,80,1,'°'],['pivot','Lever pivot from short end',.12,.45,.01,' m'],['restitution','Cradle restitution',.2,.99,.01,'']];
const ids=['gate','switchbacks','dominoes','lever','pulley','pendulum','cradle','chute','bell'],names=['Release gate','Switchback ramps','Dominoes','Lever','Pulley','Pendulum','Newton’s cradle','Curved chute','Bell'];const stageList=document.querySelector('#stages'), controls=document.querySelector('#controls');
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='stage';d.id='stage-'+i;d.innerHTML=`<span class="dot"></span><span>${names[i]}</span><time>—</time>`;stageList.append(d)}
for(const [key,label,min,max,step,unit] of defsUI){const l=document.createElement('label');l.textContent=label;const box=document.createElement('div');box.innerHTML=`<input type="range" min="${min}" max="${max}" step="${step}" value="${defs[key]}" aria-label="${label}"><div class="value"></div>`;const input=box.querySelector('input'),v=box.querySelector('.value');input.oninput=()=>{settings[key]=Number(input.value);v.textContent=Number(input.value).toFixed(key==='gravity'?2:2)+unit};input.oninput();controls.append(l,box)}
let world,renderer,scene,camera,clock=0,paused=false,speed=1,done=false,lastStage=-1,waitSince=0,accelSamples=[],pendulumReleased=null,pendulumImpact=null,acceleration=null,swingTime=null,bodies=[],meshes=[],colliderToMesh=new Map(),machine,orbital=false,dragging=false,lastPointer=[0,0],orbitYaw=.75,orbitPitch=.42,orbitRadius=7;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function uiState(){document.querySelectorAll('.stage').forEach((e,i)=>{e.className='stage';e.querySelector('time').textContent='—'});document.querySelector('#clock').textContent='0.00 s';document.querySelector('#accel').textContent='—';document.querySelector('#swing').textContent='—'}
function setStage(i,status,time){const e=document.querySelector('#stage-'+i);if(!e)return;e.className='stage '+(status==='triggered'?'active':status==='failed'?'failed':'');e.querySelector('time').textContent=time==null?'—':time.toFixed(2)+' s'}
function addBody(desc){const {shape,pos,rot,mass=0,friction=.55,restitution=.05,mat,color=0x999999,visual=true}=desc;let rbDesc=mass?RAPIER.RigidBodyDesc.dynamic():RAPIER.RigidBodyDesc.fixed();rbDesc=rbDesc.setTranslation(...pos);if(rot)rbDesc=rbDesc.setRotation(rot);const rb=world.createRigidBody(rbDesc);let cd;if(shape.type==='ball')cd=RAPIER.ColliderDesc.ball(shape.r);else if(shape.type==='cylinder')cd=RAPIER.ColliderDesc.cylinder(shape.h/2,shape.r);else cd=RAPIER.ColliderDesc.cuboid(shape.x/2,shape.y/2,shape.z/2);cd.setFriction(friction).setRestitution(restitution).setMass(mass||1);const col=world.createCollider(cd,rb);let mesh=null;if(visual){let geo=shape.type==='ball'?new THREE.SphereGeometry(shape.r,24,18):shape.type==='cylinder'?new THREE.CylinderGeometry(shape.r,shape.r,shape.h,24):new THREE.BoxGeometry(shape.x,shape.y,shape.z);mesh=new THREE.Mesh(geo,mat||new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.15}));mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);mesh.position.set(...pos);if(rot)mesh.quaternion.set(rot.x,rot.y,rot.z,rot.w);colliderToMesh.set(rb.handle,mesh);meshes.push(mesh)}bodies.push(rb);return rb}
function box(pos,size,mat,opts={}){return addBody({shape:{type:'box',x:size[0],y:size[1],z:size[2]},pos,mat,...opts})}
function makeMachine(){world.free();world=new RAPIER.World({x:0,y:-settings.gravity,z:0});world.timestep=1/120;world.integrationParameters.numSolverIterations=8;for(const m of meshes)scene.remove(m);meshes=[];bodies=[];colliderToMesh.clear();clock=0;done=false;lastStage=-1;waitSince=0;accelSamples=[];pendulumReleased=pendulumImpact=null;acceleration=swingTime=null;uiState();
const wood=new THREE.MeshStandardMaterial({color:0x72513a,roughness:.7}),darkWood=new THREE.MeshStandardMaterial({color:0x3f342c,roughness:.68}),steel=new THREE.MeshStandardMaterial({color:0x9aa9aa,metalness:.88,roughness:.2}),brass=new THREE.MeshStandardMaterial({color:0xc89b4e,metalness:.8,roughness:.23}),ballmat=new THREE.MeshStandardMaterial({color:0xc4d0d1,metalness:.95,roughness:.12}),felt=new THREE.MeshStandardMaterial({color:0x234743,roughness:.92});
box([0,-.11,0],[4.5,.2,2.4],wood);box([0,-.25,0],[4.7,.08,2.6],darkWood);for(const x of [-1.9,1.9])for(const z of [-.9,.9])box([x,-.53,z],[.12,.55,.12],darkWood);
// Ramp set spans the 4 m bench; rails are contact walls.
const ramps=[{x:-1.65,z:-.62,y:1.62,dir:1,len:.78},{x:-.78,z:.02,y:1.31,dir:-1,len:.78},{x:.08,z:-.62,y:1.0,dir:1,len:.78},{x:.92,z:.02,y:.69,dir:-1,len:.75}];const slope=THREE.MathUtils.degToRad(20);
ramps.forEach((r,k)=>{const angle=r.dir===1?-slope:slope,rot=new THREE.Quaternion().setFromAxisAngle(V(0,0,1),angle);box([r.x,r.y,r.z],[r.len,.07,.4],wood,{rot:{x:rot.x,y:rot.y,z:rot.z,w:rot.w}});for(const s of [-1,1])box([r.x,r.y+.11,r.z+s*.22],[r.len,.16,.035],darkWood,{rot:{x:rot.x,y:rot.y,z:rot.z,w:rot.w}})});
// The sole timed event is gate release at simulation second one.
const gate=box([-2.03,1.88,-.62],[.08,.24,.42],brass,{mass:.25});gate.setBodyType(RAPIER.RigidBodyType.kinematicPositionBased);const startBall=addBody({shape:{type:'ball',r:.03},pos:[-2.18,1.98,-.62],mass:.11,friction:.3,mat:ballmat});
// Dominoes turn once, at the corner. Upright boards are static until physically hit.
const doms=[];const dominoMat=new THREE.MeshStandardMaterial({color:0x936b46,roughness:.6});for(let i=0;i<24;i++){let x,z,rotY=0;if(i<13){x=-.02+i*settings.spacing;z=-.52}else{const j=i-13;x=1.42;z=-.52+(j+1)*settings.spacing;rotY=Math.PI/2}let rb=box([x,.16,z],[.03,.2,.1],dominoMat,{mass:settings.dominoMass,friction:.65});doms.push(rb)}
// Shelf, heavy falling block, physical seesaw and launch ball.
box([1.66,.42,.55],[.55,.08,.34],wood);const heavy=box([1.45,.84,.55],[.2,.2,.2],steel,{mass:1});box([.75,.12,.55],[1,.06,.16],wood);const pivotBody=addBody({shape:{type:'cylinder',r:.035,h:.24},pos:[.5,.18,.55],mat:brass});const lever=addBody({shape:{type:'box',x:1,y:.055,z:.12},pos:[.75,.25,.55],mass:1,mat:wood});const leverJoint=world.createImpulseJoint(RAPIER.JointData.revolute({x:-.25,y:0,z:0},{x:0,y:0,z:0},{x:0,y:0,z:1}),lever,pivotBody,true);const light=addBody({shape:{type:'ball',r:.045},pos:[.12,.36,.55],mass:.05,mat:ballmat});box([.12,.15,.55],[.24,.04,.18],darkWood);
// Rope and pulley visualization; basket and counterweight are linked by a length constraint.
box([1.48,1.28,.55],[.08,.08,.08],brass);let basket=box([1.47,.58,.55],[.28,.12,.28],brass,{mass:.2});let counter=box([1.48,.48,.86],[.16,.2,.16],steel,{mass:settings.counterweight});const ropeMat=new THREE.LineBasicMaterial({color:0xc39a60});const ropeGeo=new THREE.BufferGeometry().setFromPoints([V(1.47,.64,.55),V(1.48,1.28,.55),V(1.48,.58,.86)]);const rope=new THREE.Line(ropeGeo,ropeMat);scene.add(rope);meshes.push(rope);const ropeJoint=world.createImpulseJoint(RAPIER.JointData.rope(.72,{x:0,y:.06,z:0},{x:0,y:.1,z:0}),basket,counter,true);
// Pendulum: free rigid bob constrained to fixed pivot; release is physical latch contact by basket.
const pendPivot=addBody({shape:{type:'ball',r:.035},pos:[.65,1.5,-.5],mat:brass});const bob=addBody({shape:{type:'ball',r:.08},pos:[.65-Math.sin(THREE.MathUtils.degToRad(settings.pendulumAngle))*settings.pendulumLength,1.5-Math.cos(THREE.MathUtils.degToRad(settings.pendulumAngle))*settings.pendulumLength,-.5],mass:.5,mat:brass});bob.setBodyType(RAPIER.RigidBodyType.kinematicPositionBased);const pendRod=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,1,10),steel);scene.add(pendRod);meshes.push(pendRod);
// Cradle spheres are individual bodies, with neighboring contact transfer.
const cradle=[];for(let i=0;i<5;i++){let b=addBody({shape:{type:'ball',r:.025},pos:[.45+i*.051,.22,-.5],mass:.12,friction:.01,restitution:settings.restitution,mat:ballmat});cradle.push(b)}
// Stage eight: the outbound sphere rolls through a curved wooden chute to touch striker.
box([1.16,.35,-.5],[.6,.06,.2],wood);for(let s of [-1,1])box([1.16,.43,-.5+s*.12],[.6,.12,.025],darkWood);const chuteBall=addBody({shape:{type:'ball',r:.025},pos:[1.12,.65,-.5],mass:.08,mat:ballmat});const striker=box([1.77,.48,-.5],[.06,.22,.06],brass,{mass:.15});
const bellGeo=new THREE.SphereGeometry(.19,24,16,0,Math.PI*2,0,Math.PI*.52);const bell=new THREE.Mesh(bellGeo,brass);bell.position.set(1.86,.72,-.5);bell.castShadow=true;scene.add(bell);meshes.push(bell);box([1.86,.51,-.5],[.34,.035,.34],darkWood);
// Decorative supports and workbench dressing remain outside all moving paths.
for(let i=0;i<3;i++)box([-1.65+i*.86,1.4,.48],[.04,.04,.04],brass);
machine={gate,startBall,ramps,doms,heavy,lever,light,basket,counter,ropeJoint,pendPivot,bob,pendRod,cradle,chuteBall,striker,bell};}
async function init(){await RAPIER.init();scene=new THREE.Scene();scene.background=new THREE.Color(0x11191a);scene.fog=new THREE.Fog(0x11191a,9,18);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,60);camera.position.set(5,4.2,5.5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.querySelector('#scene').append(renderer.domElement);const hemi=new THREE.HemisphereLight(0xb8c9c4,0x392a20,1.2);scene.add(hemi);const key=new THREE.DirectionalLight(0xffe5bd,3);key.position.set(-3,6,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=5;key.shadow.camera.bottom=-5;scene.add(key);const fill=new THREE.PointLight(0x72aa9e,26,9);fill.position.set(1,3,-2);scene.add(fill);const room=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x263536,roughness:.92}));room.rotation.x=-Math.PI/2;room.position.y=-.59;room.receiveShadow=true;scene.add(room);scene.add(new THREE.GridHelper(16,32,0x445655,0x283838));makeMachine();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('pointerdown',e=>{if(document.querySelector('#camera').value==='orbit'){dragging=true;lastPointer=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){orbitYaw-=(e.clientX-lastPointer[0])*.006;orbitPitch=THREE.MathUtils.clamp(orbitPitch+(e.clientY-lastPointer[1])*.004,.08,1.25);lastPointer=[e.clientX,e.clientY]}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);requestAnimationFrame(frame);setTimeout(()=>{document.querySelector('#message').textContent='Release gate';},1000)}
function trigger(i){if(i<=lastStage)return;for(let k=lastStage+1;k<=i;k++)setStage(k,'triggered',clock);lastStage=i;waitSince=clock;if(i===5)pendulumReleased=clock;if(i===6&&pendulumReleased!==null){pendulumImpact=clock;swingTime=pendulumImpact-pendulumReleased;document.querySelector('#swing').textContent=swingTime.toFixed(3)+' s'}if(i===4){accelSamples=[]}document.querySelector('#message').className='message';document.querySelector('#message').textContent=names[i]}
function fail(i,msg){if(done)return;done=true;setStage(i,'failed',null);document.querySelector('#message').className='message fail';document.querySelector('#message').textContent=msg}
function audioBell(){try{const ctx=new AudioContext(),t=ctx.currentTime;for(const [f,g,d] of [[880,.14,1.2],[1320,.08,.9],[1760,.045,.7]]){const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=f;gain.gain.setValueAtTime(g,t);gain.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gain).connect(ctx.destination);o.start(t);o.stop(t+d)}}catch{}}
function checkContacts(){const m=machine,near=(a,b,d)=>a.translation().x-b.translation().x;const p=(b)=>b.translation();if(clock>=1&&m.gate){m.gate.setBodyType(RAPIER.RigidBodyType.dynamic);m.gate.applyImpulse({x:0,y:0,z:.25},true);m.gate=null}
const ball=p(m.startBall);if(lastStage<1&&ball.x>rampsEndX())trigger(1);
// Recognize handoff by measured rigid body proximity and motion.
if(lastStage<2&&p(m.startBall).x>.15&&p(m.startBall).y<.32)trigger(2);
if(lastStage<3&&m.doms[23].translation().y<.08)trigger(3);
if(lastStage<4&&m.heavy.translation().y<.45)trigger(4);
if(lastStage<5&&m.light.translation().x>1.2&&m.light.translation().y<.75)trigger(5);
if(lastStage<6&&m.basket.translation().y<.28&&pendulumReleased===null){trigger(5);m.bob.setBodyType(RAPIER.RigidBodyType.dynamic);m.bob.setLinvel({x:0,y:0,z:0},true);}
if(lastStage<7&&m.cradle[4].translation().x>.68)trigger(6);
if(lastStage<8&&m.chuteBall.translation().x>1.45)trigger(7);
if(!done&&m.striker.translation().x>1.79&&lastStage>=7){trigger(8);done=true;audioBell();document.querySelector('#message').textContent=`Bell rings · ${clock.toFixed(2)} simulation seconds`;}
if(accelSamples.length<30&&lastStage>=4){const v=m.basket.linvel();accelSamples.push(v.y);if(accelSamples.length===30){let sum=0;for(let i=1;i<30;i++)sum+=Math.abs(accelSamples[i]-accelSamples[i-1])/(1/120);acceleration=sum/29;document.querySelector('#accel').textContent=acceleration.toFixed(2)+' m/s²'}}
if(!done&&clock-waitSince>8){const waiting=Math.min(lastStage+1,8);fail(waiting,`${names[waiting]} failed to trigger`)} }
function rampsEndX(){return .75}
function frame(){requestAnimationFrame(frame);if(world&&!paused&&!done){const dt=1/120;let n=Math.min(8,Math.floor((Math.min(clockDelta(),.066)*speed)/dt));for(let i=0;i<n;i++){clock+=dt;world.step();checkContacts();sync()}document.querySelector('#clock').textContent=clock.toFixed(2)+' s'}updateCamera();renderer.render(scene,camera)}let prev=performance.now();function clockDelta(){const n=performance.now(),d=(n-prev)/1000;prev=n;return d}function sync(){for(const b of bodies){const mesh=colliderToMesh.get(b.handle);if(mesh){const p=b.translation(),q=b.rotation();mesh.position.set(p.x,p.y,p.z);mesh.quaternion.set(q.x,q.y,q.z,q.w)}}if(machine){const p=machine.bob.translation(),pivot=machine.pendPivot.translation();machine.pendRod.position.set((p.x+pivot.x)/2,(p.y+pivot.y)/2,(p.z+pivot.z)/2);machine.pendRod.quaternion.setFromUnitVectors(V(0,1,0),V(p.x-pivot.x,p.y-pivot.y,p.z-pivot.z).normalize());}}
function updateCamera(){const mode=document.querySelector('#camera').value;if(mode==='overview'){camera.position.set(4.1,3.2,4.7);camera.lookAt(0,.65,0)}else if(mode==='orbit'){camera.position.set(orbitRadius*Math.sin(orbitYaw)*Math.cos(orbitPitch),1+orbitRadius*Math.sin(orbitPitch),orbitRadius*Math.cos(orbitYaw)*Math.cos(orbitPitch));camera.lookAt(0,.7,0)}else{let target=V(-.45,.8,0);if(lastStage>=0){const index=Math.min(lastStage,8);const pts=[V(-1.6,1.4,-.5),V(-.3,1,-.3),V(.8,.4,-.5),V(.7,.5,.4),V(1.45,.8,.55),V(.6,1,-.5),V(.55,.35,-.5),V(1.2,.5,-.5),V(1.8,.65,-.5)];target.lerp(pts[index],.75)}camera.position.lerp(V(target.x+2.6,target.y+1.8,target.z+3.2),.035);camera.lookAt(target)}}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause'};document.querySelector('#replay').onclick=()=>{for(const d of defsUI)settings[d[0]]=Number(controls.querySelectorAll('input')[defsUI.indexOf(d)].value);makeMachine();paused=false;document.querySelector('#pause').textContent='Pause';document.querySelector('#message').textContent='Release gate';setTimeout(()=>{if(clock<.2)document.querySelector('#message').textContent='Release gate'},20)};document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);document.querySelector('#camera').onchange=()=>{};window.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();document.querySelector('#pause').click()}});window.machineState=()=>({stages:ids.map((id,i)=>({id,name:names[i],status:document.querySelector('#stage-'+i).classList.contains('active')?'triggered':document.querySelector('#stage-'+i).classList.contains('failed')?'failed':'waiting',triggeredAt:document.querySelector('#stage-'+i).classList.contains('active')?Number(document.querySelector('#stage-'+i).querySelector('time').textContent.replace(' s','')):null})),basketAcceleration:acceleration,pendulumSwingTime:swingTime,settings:{...settings}});
init();
</script></body></html>
