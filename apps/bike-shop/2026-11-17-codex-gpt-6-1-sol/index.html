<style>
:root{color-scheme:light;--ink:#193b32;--muted:#52645a;--paper:#f6f5ef;--green:#215743;--line:#d2d9cc;--soft:#eaf0e3;--error:#9b3025}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--green);border-radius:6px;background:white;color:var(--ink);padding:10px 16px;font-weight:600}button:hover:enabled{background:var(--soft)}button:disabled{cursor:default;background:#e6e8e1;border-color:#cbd1c6;color:#586057}button.primary{background:var(--green);color:white}button.primary:hover:enabled{background:#163f30}button.primary:disabled{background:#dce2d6;color:#586057;border-color:#cbd1c6}button:focus-visible,input:focus-visible{outline:3px solid #ac5b22;outline-offset:3px}header{max-width:1240px;margin:auto;padding:28px 32px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}h1{font-size:25px;letter-spacing:-1px;margin:0;font-weight:700}header svg{width:40px;height:40px;flex:none}main{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:40px;padding:32px}section{min-width:0}.panel-title{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin:0 0 22px;font-size:19px;letter-spacing:-.4px}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:700;text-transform:uppercase;color:var(--muted)}.step{font-size:11px;border:1px solid #a3b4a3;border-radius:50%;width:23px;height:23px;display:inline-grid;place-items:center;flex:none;color:var(--muted)}.config-section{margin:0 0 24px}h3{font-size:14px;margin:0 0 10px;display:flex;gap:9px;align-items:center}input[type=text]{width:100%;border:1px solid #9cae9e;border-radius:6px;background:#fff;color:var(--ink);padding:11px 12px;min-width:0}#height-input{max-width:210px}.field-label{display:block;font-weight:600;margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cards.frame,.cards.color{grid-template-columns:repeat(4,minmax(0,1fr))}.card{position:relative;display:flex;flex-direction:column;gap:3px;border:1px solid #bcc9b8;border-radius:7px;background:#fff;padding:14px 12px;cursor:pointer;min-height:85px;justify-content:center}.card.selected{background:var(--soft);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.card.unavailable{background:#eeeee7;border-style:dashed;color:#52645a;cursor:default}.card:has(input:focus-visible){outline:3px solid #ac5b22;outline-offset:3px}.card input{position:absolute;right:10px;top:12px;width:14px;height:14px;margin:0;accent-color:var(--green)}.card [data-role=name]{font-weight:600;padding-right:18px;font-size:13px}.card [data-role=price]{font-size:12px;color:#465b4d}.card [data-role=reason]{font-size:11px;line-height:1.4;color:#664633;margin-top:4px}.card [data-role=badge]{font-size:10px;line-height:1.4;color:#24533a;font-weight:700;margin-top:3px}.swatch{width:21px;height:21px;border-radius:50%;border:1px solid #777;margin-bottom:6px}.card.color-card{justify-content:flex-start}.quantity-bar{display:flex;align-items:center;justify-content:space-between;gap:20px}.stepper{display:flex;align-items:center;gap:18px}.stepper button{width:36px;height:36px;padding:0;font-size:20px}.stepper output{font-size:17px;font-weight:600}.actions{border-top:1px solid var(--line);padding-top:20px}.price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.bike-price{font-size:28px;font-weight:700;letter-spacing:-1px}.action-buttons{display:flex;flex-wrap:wrap;gap:9px}.action-buttons .primary{flex:1}.hint,.error,.recommendation{font-size:12px;margin:9px 0 0}.hint{color:var(--muted)}.recommendation{color:#275a3f}.error{color:var(--error)}.order-panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;align-self:start;min-width:0}.empty{padding:28px 12px 35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;font-size:13px;margin-bottom:24px}.empty svg{display:block;margin:0 auto 10px;width:55px;height:40px;color:#53725d}.order-line{padding:17px 0;border-bottom:1px solid var(--line)}.order-line:first-child{padding-top:0}.order-line [data-role=description]{font-weight:600;font-size:13px}.order-line [data-role=accessories]{font-size:12px;color:var(--muted);margin-top:5px}.line-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.line-bottom button{font-size:11px;padding:5px 9px}.line-amount{font-weight:700}.line-qty{font-size:12px;color:var(--muted)}.promo{margin:23px 0}.promo label{font-size:12px}.promo-entry{display:flex;gap:8px}.promo-entry button{padding:9px 13px}.remove-code{margin-top:8px;font-size:11px;padding:5px 8px}.summary-row{display:flex;justify-content:space-between;gap:18px;padding:7px 0;font-size:13px}.summary-row [data-role=value]{text-align:right;font-weight:600}.summary-row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:14px;font-size:20px;font-weight:700}.summary-row.vat{font-size:11px;color:var(--muted)}.summary-row.delivery{border-top:1px solid var(--line);margin-top:12px;padding:15px 0}.summary-row.delivery [data-role=value]{max-width:180px}.checkout{width:100%;margin-top:15px}.notice-wrap{max-width:1176px;margin:0 auto}.notice{background:#e5edda;border:1px solid #a3b493;border-radius:6px;padding:14px 18px;margin:0 0 30px;font-size:13px}.confirmation{max-width:620px;margin:65px auto;padding:38px;background:white;border:1px solid var(--line);border-radius:12px;text-align:center}.confirmation h2{font-size:26px;margin:12px 0}.confirmation p{margin:12px 0}.confirmation .checkmark{display:inline-grid;place-items:center;width:56px;height:56px;background:var(--soft);border-radius:50%;font-size:28px}.confirmation-total{font-size:32px;font-weight:700}.confirmation button{margin-top:16px}[hidden]{display:none!important}@media(min-width:1000px){.cards.drivetrain{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){header{padding:20px}main{grid-template-columns:1fr;padding:24px 20px;gap:28px}.notice-wrap{margin:0 20px}.confirmation{margin:30px 20px;padding:25px}.cards.frame,.cards.color{grid-template-columns:repeat(2,minmax(0,1fr))}.order-panel{padding:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<body>
<header data-testid="app-header"><svg viewBox="0 0 44 44" fill="none" aria-hidden="true"><rect x="1" y="1" width="42" height="42" rx="11" fill="#215743"/><path d="M9 30 20 12h5L14 30m7 0 9-15 6 15M17 24h15" stroke="#f4f2e7" stroke-width="2.4" stroke-linejoin="round"/></svg><h1>GPT-6.1 Sol</h1></header>
<main id="main">
<div data-testid="configurator">

<div class="promo"><label class="field-label" for="promo-input">Promo code</label><div class="promo-entry"><input type="text" id="promo-input" data-testid="promo-input" autocomplete="off" aria-describedby="promo-error"><button data-testid="promo-apply">Apply</button></div><p class="error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p><p class="hint" data-testid="promo-status" hidden></p><button class="remove-code" data-testid="promo-remove" hidden>Remove code</button></div>

<script>
'use strict';
const $=id=>document.querySelector('[data-testid="'+id+'"]');
const catalog={frame:[['S','Frame S',119000],['M','Frame M',119000],['L','Frame L',124000],['XL','Frame XL',129000]],wheels:[['275','27.5" wheels',0],['29','29" wheels',12000]],drivetrain:[['essential','Essential 1×10',0],['sport','Sport 1×12',24000],['pro','Pro Electronic 2×12',69000]],color:[['graphite','Graphite',0],['sand','Sand',0],['red','Racing Red',6000],['glacier','Glacier',0]],accessory:[['mudguards','Mudguards',4500],['rack','Rear rack',6900],['lights','Lights',3990],['kickstand','Kickstand',2450]]};
const groupTitles={frame:'Frame',wheels:'Wheels',drivetrain:'Drivetrain',color:'Color',accessory:'Accessories'};
const clone=x=>JSON.parse(JSON.stringify(x));
const amount=n=>'€'+(BigInt(n)/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+String(n%100).padStart(2,'0');
// Every monetary operation uses integer cents; integer division rounds half up.
const percent=(n,p,d=100)=>Number((BigInt(n)*BigInt(p)+BigInt(d)/2n)/BigInt(d));
let bike,history=[],lines=[],editing=-1,code='',seq=0,notice='',lineError='',confirmed=false;
const height=()=>{let v=$('height-input').value.trim();return /^[0-9]+$/.test(v)&&Number(v)>=150&&Number(v)<=200?Number(v):null};
const recommended=()=>{let h=height();return h===null?null:h<165?'S':h<175?'M':h<185?'L':'XL'};
function reset(){bike={frame:recommended(),wheels:'275',drivetrain:'essential',color:'graphite',accessory:[],qty:1,auto:true};history=[];notice='';lineError=''}
function name(g,id){return catalog[g].find(o=>o[0]===id)[1]}
function price(g,id,b){if(g==='color'&&id==='red'&&b.drivetrain==='pro')return 0;return catalog[g].find(o=>o[0]===id)[2]}
function unit(b){return ['frame','wheels','drivetrain','color'].reduce((s,g)=>s+price(g,b[g],b),0)+b.accessory.reduce((s,id)=>s+price('accessory',id,b),0)}
function disabled(g,id){return (bike.frame==='S'&&((g==='wheels'&&id==='29')||(g==='drivetrain'&&id==='pro')))||(g==='color'&&id==='glacier'&&['S','XL'].includes(bike.frame))}
const messages={6:'29" wheels were replaced by 27.5" wheels: not available with frame S.',7:'Pro Electronic 2×12 was replaced by Sport 1×12: not available with frame S.',8:'Glacier was replaced by Graphite: available with frames M and L only.',9:'29" wheels were selected: required by Pro Electronic 2×12.',10:'Pro Electronic 2×12 was replaced by Sport 1×12: it requires 29" wheels.',11:'Mudguards were added: required by the rear rack.',12:'Kickstand was removed: not compatible with the rear rack.',13:'Rear rack was removed: it requires mudguards.',14:'Rear rack was removed: not compatible with the kickstand.'};
function cascades(g,id,checked=true){let m=[];const apply=(n,fn)=>{fn();m.push(messages[n])},has=id=>bike.accessory.includes(id),remove=id=>{bike.accessory=bike.accessory.filter(a=>a!==id)};
 if(g==='frame'&&id==='S'&&bike.wheels==='29')apply(6,()=>bike.wheels='275');
 if(g==='frame'&&id==='S'&&bike.drivetrain==='pro')apply(7,()=>bike.drivetrain='sport');
 if(g==='frame'&&['S','XL'].includes(id)&&bike.color==='glacier')apply(8,()=>bike.color='graphite');
 if(g==='drivetrain'&&id==='pro'&&bike.wheels==='275')apply(9,()=>bike.wheels='29');
 if(g==='wheels'&&id==='275'&&bike.drivetrain==='pro')apply(10,()=>bike.drivetrain='sport');
 if(g==='accessory'&&id==='rack'&&checked&&!has('mudguards'))apply(11,()=>bike.accessory.push('mudguards'));
 if(g==='accessory'&&id==='rack'&&checked&&has('kickstand'))apply(12,()=>remove('kickstand'));
 if(g==='accessory'&&id==='mudguards'&&!checked&&has('rack'))apply(13,()=>remove('rack'));
 if(g==='accessory'&&id==='kickstand'&&checked&&has('rack'))apply(14,()=>remove('rack'));
 notice=m.join(' ');
}
Object.entries(catalog).forEach(([g,options],i)=>{let section=document.createElement('section');section.className='config-section';section.dataset.testid='section-'+(g==='accessory'?'accessories':g);let title=document.createElement('h3');title.innerHTML='<span class="step">'+(i+2)+'</span>'+groupTitles[g];section.append(title);let grid=document.createElement('div');grid.className='cards '+g;options.forEach(([id,n])=>{let card=document.createElement('label');card.className='card'+(g==='color'?' color-card':'');card.dataset.testid='card-'+g+'-'+id;let input=document.createElement('input');input.type=g==='accessory'?'checkbox':'radio';input.name=g;input.value=id;input.setAttribute('aria-label',n);card.append(input);if(g==='color'){let sw=document.createElement('span');sw.className='swatch';sw.style.backgroundColor={graphite:'#3c4642',sand:'#d7c5a3',red:'#b53e31',glacier:'#bed7dc'}[id];sw.setAttribute('aria-hidden','true');card.append(sw)}for(let role of ['name','price','reason',...(g==='frame'?['badge']:[])]){let el=document.createElement('span');el.dataset.role=role;if(role==='name')el.textContent=n;else if(role==='badge')el.textContent='Recommended';card.append(el)}
input.addEventListener('change',()=>{if(input.disabled)return;let changed=g==='accessory'||bike[g]!==id;if(!changed)return;history.push(clone(bike));lineError='';if(g==='accessory'){if(input.checked)bike.accessory.push(id);else bike.accessory=bike.accessory.filter(a=>a!==id)}else{bike[g]=id;if(g==='frame')bike.auto=false}cascades(g,id,input.checked);render()});
// Clicking an already selected radio still constitutes an action for the notice.
input.addEventListener('click',()=>{if(input.type==='radio'&&bike[g]===id&&!input.disabled){notice='';lineError='';render()}});
grid.append(card)});section.append(grid);document.getElementById('option-sections').append(section)});
function show(id,text,visible=true){const el=$(id);if(text!==undefined)el.textContent=text;el.hidden=!visible}
function renderConfig(){let h=height(),rec=recommended();show('height-error',undefined,$('height-input').value.trim()!==''&&h===null);$('height-input').setAttribute('aria-invalid',String(!$('height-error').hidden));show('height-recommendation',rec?'Recommended frame: '+rec:'',!!rec);
Object.entries(catalog).forEach(([g,opts])=>opts.forEach(([id])=>{let c=$('card-'+g+'-'+id),inp=c.querySelector('input'),off=disabled(g,id),selected=g==='accessory'?bike.accessory.includes(id):bike[g]===id;inp.setAttribute('aria-label',name(g,id));inp.checked=selected;inp.disabled=off;c.classList.toggle('selected',selected);c.classList.toggle('unavailable',off);let p=price(g,id,bike);c.querySelector('[data-role=price]').textContent=g==='frame'?amount(p):p?'+'+amount(p):'Included';let reason=c.querySelector('[data-role=reason]');reason.hidden=!off;reason.textContent=g==='color'?'Available with frames M and L only':'Not available with frame S';if(g==='frame')c.querySelector('[data-role=badge]').hidden=rec!==id}));
show('qty-value',String(bike.qty));$('qty-decrease').disabled=bike.qty===1;$('qty-increase').disabled=bike.qty===5;show('bike-price',bike.frame?amount(unit(bike)*bike.qty):'—');$('undo-button').disabled=!history.length;show('add-to-order',editing<0?'Add to order':'Update line '+(editing+1));$('add-to-order').disabled=editing<0&&(h===null||!bike.frame);show('add-hint',undefined,editing<0&&h===null);show('cancel-edit',undefined,editing>=0);show('line-error',lineError,!!lineError);show('notice',notice,!!notice&&!confirmed)}
const key=b=>JSON.stringify([b.frame,b.wheels,b.drivetrain,b.color,catalog.accessory.map(o=>o[0]).filter(id=>b.accessory.includes(id))]);
const pack=b=>['mudguards','rack','lights'].every(id=>b.accessory.includes(id))?3000*b.qty:0;
function delivery(){if(!lines.length)return '';let now=new Date(),lead=Math.max(...lines.map(b=>({essential:5,sport:7,pro:12}[b.drivetrain])+(b.color==='red'?3:0)+(b.qty>=3?2:0)))+lines.length-1+(now.getHours()>=14?1:0),d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);let closed=['2026-12-24','2026-12-25','2026-12-31','2027-01-01','2027-03-29'];while(lead){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6&&!closed.includes(localDate(d)))lead--}return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear()}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function totals(){let B=lines.reduce((s,b)=>s+b.qty,0),packs=lines.reduce((s,b)=>s+pack(b),0),bikes=lines.reduce((s,b)=>s+unit(b)*b.qty,0)-packs,volume=percent(bikes,B>=6?8:B>=3?5:0),team=code==='TEAM15'&&B>=4?percent(lines.reduce((s,b)=>s+(['sport','pro'].includes(b.drivetrain)?unit(b)*b.qty-pack(b):0),0),15):0,useTeam=team>volume;if(useTeam)volume=0;let after=bikes-volume,active=code==='SPRING10'?after>=300000:code==='WELCOME50'?B===1:code==='FREESHIP'?B>=1:code==='TEAM15'?B>=4:false,promo=active?(code==='SPRING10'?percent(after,10):code==='WELCOME50'?5000:code==='TEAM15'&&useTeam?team:0):0,merchandise=after-promo,shipping=B?(code==='FREESHIP'||merchandise>=500000?0:4900+1500*(B-1)):0,total=merchandise+shipping;return {B,packs,bikes,volume,promo,shipping,total,vat:percent(total,20,120),active,useTeam,date:delivery()}}
function renderOrder(){let target=document.getElementById('order-lines');target.replaceChildren();show('order-empty',undefined,!lines.length);lines.forEach((b,i)=>{let row=document.createElement('div');row.className='order-line';row.dataset.testid='order-line-'+(i+1);let desc=document.createElement('div');desc.dataset.role='description';desc.textContent=['frame','wheels','drivetrain','color'].map(g=>name(g,b[g])).join(' · ');let acc=document.createElement('div');acc.dataset.role='accessories';acc.textContent=catalog.accessory.filter(o=>b.accessory.includes(o[0])).map(o=>o[1]).join(', ')||'No accessories';let bottom=document.createElement('div');bottom.className='line-bottom';let info=document.createElement('div');info.innerHTML='<span class="line-qty">Qty <span data-role="qty">'+b.qty+'</span></span> &nbsp; <span class="line-amount" data-role="amount">'+amount(unit(b)*b.qty)+'</span>';let buttons=document.createElement('div');['edit','remove'].forEach(action=>{let btn=document.createElement('button');btn.dataset.role=action;btn.textContent=action==='edit'?'Edit':'Remove';btn.addEventListener('click',()=>{if(action==='edit'){editing=i;bike=clone(lines[i]);bike.auto=false;history=[];notice='';lineError=''}else{lines.splice(i,1);lineError='';if(editing===i){editing=-1;reset()}else if(editing>i)editing--}render()});buttons.append(btn)});bottom.append(info,buttons);row.append(desc,acc,bottom);target.append(row)});
let t=totals();show('promo-remove',undefined,!!code);let status='';if(code){status=!t.active?{SPRING10:'SPRING10 requires €3,000.00 or more after the volume discount.',WELCOME50:'WELCOME50 applies to an order of one bike only.',FREESHIP:'FREESHIP applies once the order holds a bike.',TEAM15:'TEAM15 requires 4 bikes or more.'}[code]:code==='TEAM15'&&!t.useTeam?'The volume discount applies instead of TEAM15.':'Code '+code+' applied.'}show('promo-status',status,!!code);$('promo-apply').disabled=!$('promo-input').value.trim();
let summary=document.getElementById('summary');summary.replaceChildren();if(lines.length){let rows=[['bikes','Bikes',amount(t.bikes),true],['pack','Commuter pack','−'+amount(t.packs),t.packs>0],['volume','Volume discount','−'+amount(t.volume),t.volume>0],['promo','Promo '+code,'−'+amount(t.promo),t.promo>0],['shipping','Shipping',t.shipping?amount(t.shipping):'Free',true],['total','Total',amount(t.total),true],['vat','VAT included',amount(t.vat),true],['delivery','Delivery',t.date,true]];rows.forEach(([k,l,v,visible])=>{if(!visible)return;let row=document.createElement('div');row.className='summary-row '+k;row.dataset.testid='summary-line-'+k;let label=document.createElement('span');label.dataset.role='label';label.textContent=l;let value=document.createElement('span');value.dataset.role='value';value.textContent=v;row.append(label,value);summary.append(row)})}show('place-order',t.B?'Place order ('+t.B+(t.B===1?' bike)':' bikes)'):'Place order');$('place-order').disabled=!t.B||editing>=0;show('place-hint',undefined,editing>=0)}
function render(){renderConfig();renderOrder()}
$('height-input').addEventListener('input',()=>{let rec=recommended();if(bike.auto&&rec&&rec!==bike.frame){bike.frame=rec;cascades('frame',rec)}render()});
for(let [id,delta] of [['qty-decrease',-1],['qty-increase',1]])$(id).addEventListener('click',()=>{if($(id).disabled)return;history.push(clone(bike));bike.qty+=delta;notice='';lineError='';render()});
$('undo-button').addEventListener('click',()=>{if(!history.length)return;bike=history.pop();notice='';render()});
$('add-to-order').addEventListener('click',()=>{if($('add-to-order').disabled)return;let proposed=clone(lines);if(editing<0){let same=proposed.findIndex(b=>key(b)===key(bike));if(same>=0)proposed[same].qty+=bike.qty;else proposed.push(clone(bike))}else{proposed[editing]=clone(bike);let other=proposed.findIndex((b,i)=>i!==editing&&key(b)===key(bike));if(other>=0){let first=Math.min(other,editing),last=Math.max(other,editing);proposed[first].qty+=proposed[last].qty;proposed.splice(last,1)}}lineError=proposed.some(b=>b.qty>5)?'A line cannot hold more than 5 bikes.':proposed.length>4?'An order cannot hold more than 4 lines.':proposed.reduce((s,b)=>s+b.qty,0)>10?'An order cannot hold more than 10 bikes.':'';if(!lineError){lines=proposed;editing=-1;reset()}render()});
$('cancel-edit').addEventListener('click',()=>{editing=-1;reset();render()});
function applyPromo(){if($('promo-apply').disabled)return;let candidate=$('promo-input').value.trim().toUpperCase();if(['SPRING10','WELCOME50','FREESHIP','TEAM15'].includes(candidate)){code=candidate;$('promo-input').value='';show('promo-error',undefined,false);$('promo-input').setAttribute('aria-invalid','false')}else{show('promo-error',undefined,true);$('promo-input').setAttribute('aria-invalid','true')}renderOrder()}
$('promo-input').addEventListener('input',()=>{show('promo-error',undefined,false);$('promo-input').setAttribute('aria-invalid','false');$('promo-apply').disabled=!$('promo-input').value.trim()});$('promo-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyPromo()}});$('promo-apply').addEventListener('click',applyPromo);$('promo-remove').addEventListener('click',()=>{code='';renderOrder()});
$('place-order').addEventListener('click',()=>{if($('place-order').disabled)return;let t=totals();seq++;confirmed=true;document.getElementById('main').hidden=true;show('notice',undefined,false);show('confirmation',undefined,true);show('confirmation-reference','AT-'+localDate(new Date()).replaceAll('-','')+'-'+String(seq).padStart(3,'0'));show('confirmation-bikes',t.B+(t.B===1?' bike':' bikes'));show('confirmation-total',amount(t.total));show('confirmation-delivery',t.date);window.scrollTo(0,0)});
$('confirmation-new').addEventListener('click',()=>{confirmed=false;lines=[];editing=-1;code='';$('height-input').value='';$('promo-input').value='';show('promo-error',undefined,false);$('promo-input').setAttribute('aria-invalid','false');reset();show('confirmation',undefined,false);document.getElementById('main').hidden=false;render();window.scrollTo(0,0)});
reset();render();
</script>
