<body><header data-testid="app-header">GPT-6 Luna</header>
<main>
<div class="panel" data-testid="configurator">

</div>
<aside class="panel" data-testid="order"><h2>Order</h2><p data-testid="order-empty">Your order is empty.</p><div id="lines"></div><h3>Promo code</h3><div class="promo"><label class="sr-only" for="promo-input">Promo code</label><input id="promo-input" data-testid="promo-input" type="text"><button type="button" data-testid="promo-apply">Apply</button></div><p class="msg error" data-testid="promo-error" hidden>This code is not valid.</p><div class="actions"><p class="msg" data-testid="promo-status" hidden></p><button type="button" class="secondary" data-testid="promo-remove" hidden>Remove code</button></div><div class="summary" id="summary"></div><p class="msg" data-testid="place-hint" hidden>Save or cancel the line being edited.</p><button type="button" data-testid="place-order">Place order</button></aside>
</main>

<script>
(()=>{'use strict';
const catalog={frame:[['S','Frame S',119000],['M','Frame M',119000],['L','Frame L',124000],['XL','Frame XL',129000]],wheels:[['275','27.5" wheels',0],['29','29" wheels',12000]],drivetrain:[['essential','Essential 1×10',0,5],['sport','Sport 1×12',24000,7],['pro','Pro Electronic 2×12',69000,12]],color:[['graphite','Graphite',0],['sand','Sand',0],['red','Racing Red',6000],['glacier','Glacier',0]],accessory:[['mudguards','Mudguards',4500],['rack','Rear rack',6900],['lights','Lights',3990],['kickstand','Kickstand',2450]]};
const $=s=>document.querySelector(s), test=id=>document.querySelector(`[data-testid="${id}"]`), state={frame:null,wheels:'275',drivetrain:'essential',color:'graphite',accessory:[],qty:1}, history=[],lines=[];let auto=true,editing=null,code=null,seq=0,noticeText='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(c){let n=Math.floor(c/100),d=c%100;return '€'+n.toLocaleString('en-US')+'.'+String(d).padStart(2,'0')}function signed(c){return c===0?'Included':'+'+money(c)}function discount(c){return '−'+money(c)}function recommend(h){return h<=164?'S':h<=174?'M':h<=184?'L':'XL'}function validHeight(){let v=$('#height-input').value.trim();return /^\d+$/.test(v)&&+v>=150&&+v<=200?+v:null}function frameCost(f){return catalog.frame.find(x=>x[0]===f)?.[2]||0}function item(group,id){return catalog[group].find(x=>x[0]===id)}function accessoryCost(ids){return ids.reduce((a,id)=>a+item('accessory',id)[2],0)}function unit(s=state){return frameCost(s.frame)+(s.wheels==='29'?12000:0)+(s.drivetrain==='sport'?24000:s.drivetrain==='pro'?69000:0)+(s.color==='red'&&s.drivetrain!=='pro'?6000:0)+accessoryCost(s.accessory)}function clone(){return {...state,accessory:[...state.accessory]}}function key(s){return [s.frame,s.wheels,s.drivetrain,s.color,[...s.accessory].sort().join(',')].join('|')}function snapshot(){history.push({...clone(),auto});test('undo-button').disabled=false}function resetConfig(){Object.assign(state,{frame:null,wheels:'275',drivetrain:'essential',color:'graphite',accessory:[],qty:1});auto=true;let h=validHeight();if(h)state.frame=recommend(h);history.length=0;notice('');sync()}function notice(t){noticeText=t;let e=test('notice');e.textContent=t;e.hidden=!t}
function buildCards(){for(const g of Object.keys(catalog)){const host=$(`#${g}-cards`);catalog[g].forEach(([id,name,cost])=>{let label=document.createElement('label');label.className='card';label.dataset.testid=`card-${g}-${id}`;label.innerHTML=`<input type="${g==='accessory'?'checkbox':'radio'}" name="${g}" aria-label="${esc(name)}" value="${id}"><span class="card-copy"><span data-role="name">${esc(name)}</span><span data-role="price"></span><span data-role="reason" hidden></span>${g==='frame'?'<span data-role="badge" hidden>Recommended</span>':''}</span>`;host.append(label);label.querySelector('input').addEventListener('change',()=>{if(label.querySelector('input').disabled)return;let prev=clone(),prevAuto=auto,changed=false;if(g==='accessory'){let has=state.accessory.includes(id);if(has===label.querySelector('input').checked)return;snapshot();if(label.querySelector('input').checked)state.accessory.push(id);else state.accessory=state.accessory.filter(x=>x!==id);changed=true}else{if(state[g]===id)return;snapshot();state[g]=id;changed=true;if(g==='frame')auto=false}
if(changed){let msgs=[];if(g==='frame')cascadeFrame(msgs);if(g==='drivetrain'&&id==='pro'&&state.wheels==='275'){state.wheels='29';msgs.push('29" wheels were selected: required by Pro Electronic 2×12.')}if(g==='wheels'&&id==='275'&&state.drivetrain==='pro'){state.drivetrain='sport';msgs.push('Pro Electronic 2×12 was replaced by Sport 1×12: it requires 29" wheels.')}if(g==='accessory'&&id==='rack'&&state.accessory.includes('rack')){if(!state.accessory.includes('mudguards')){state.accessory.push('mudguards');msgs.push('Mudguards were added: required by the rear rack.')}if(state.accessory.includes('kickstand')){state.accessory=state.accessory.filter(x=>x!=='kickstand');msgs.push('Kickstand was removed: not compatible with the rear rack.')}}if(g==='accessory'&&id==='mudguards'&&!state.accessory.includes('mudguards')&&prev.accessory.includes('mudguards')&&state.accessory.includes('rack')){state.accessory=state.accessory.filter(x=>x!=='rack');msgs.push('Rear rack was removed: it requires mudguards.')}if(g==='accessory'&&id==='kickstand'&&state.accessory.includes('kickstand')&&state.accessory.includes('rack')){state.accessory=state.accessory.filter(x=>x!=='rack');msgs.push('Rear rack was removed: not compatible with the kickstand.')}notice(msgs.join(' '));hideLineErr();sync()}});});}}
function cascadeFrame(msgs){if(state.frame==='S'&&state.wheels==='29'){state.wheels='275';msgs.push('29" wheels were replaced by 27.5" wheels: not available with frame S.')}if(state.frame==='S'&&state.drivetrain==='pro'){state.drivetrain='sport';msgs.push('Pro Electronic 2×12 was replaced by Sport 1×12: not available with frame S.')}if(['S','XL'].includes(state.frame)&&state.color==='glacier'){state.color='graphite';msgs.push('Glacier was replaced by Graphite: available with frames M and L only.')}}
function renderCards(){for(const g of Object.keys(catalog))for(const [id,name,cost] of catalog[g]){let card=test(`card-${g}-${id}`),input=card.querySelector('input'),selected=g==='accessory'?state.accessory.includes(id):state[g]===id;let unavailable=false,reason='';if(g==='wheels'&&id==='29'&&state.frame==='S'){unavailable=true;reason='Not available with frame S'}if(g==='drivetrain'&&id==='pro'&&state.frame==='S'){unavailable=true;reason='Not available with frame S'}if(g==='color'&&id==='glacier'&&['S','XL'].includes(state.frame)){unavailable=true;reason='Available with frames M and L only'}input.checked=selected;input.disabled=unavailable;card.classList.toggle('selected',selected);card.classList.toggle('unavailable',unavailable);let price=g==='frame'?money(cost):g==='color'&&id==='red'&&state.drivetrain==='pro'?'Included':signed(cost);card.querySelector('[data-role=price]').textContent=price;let r=card.querySelector('[data-role=reason]');r.textContent=reason;r.hidden=!unavailable;if(g==='frame'){let b=card.querySelector('[data-role=badge]'),h=validHeight();b.hidden=!h||recommend(h)!==id}}}
function getAmounts(){let B=lines.reduce((a,l)=>a+l.qty,0),lineAmounts=lines.map(l=>unit(l)*l.qty),packs=lines.map(l=>l.accessory.includes('mudguards')&&l.accessory.includes('rack')&&l.accessory.includes('lights')?3000*l.qty:0),pack=packs.reduce((a,b)=>a+b,0),bikes=lineAmounts.reduce((a,b)=>a+b,0)-pack,volume=B>=6?Math.floor((bikes*8+50)/100):B>=3?Math.floor((bikes*5+50)/100):0,perf=lines.reduce((a,l,i)=>a+(['sport','pro'].includes(l.drivetrain)?lineAmounts[i]-packs[i]:0),0),team=code==='TEAM15'&&B>=4?Math.floor((perf*15+50)/100):0,volumeUsed=team>volume?0:volume,teamUsed=team>volume?team:0,after=bikes-volumeUsed;let active=code==='SPRING10'?after>=300000:code==='WELCOME50'?B===1:code==='FREESHIP'?B>=1:code==='TEAM15'?B>=4:false;let promo=code==='SPRING10'&&active?Math.floor((after*10+50)/100):code==='WELCOME50'&&active?5000:code==='TEAM15'&&active?teamUsed:0,merch=after-promo,shipping=code==='FREESHIP'||merch>=500000?0:4900+1500*Math.max(0,B-1),total=merch+shipping,vat=Math.floor((total*20+60)/120);let lead=lines.length?Math.max(...lines.map(l=>(item('drivetrain',l.drivetrain)[3])+(l.color==='red'?3:0)+(l.qty>=3?2:0)))+lines.length-1+(new Date().getHours()>=14?1:0):0;let delivery=deliveryDate(lead);return {B,lineAmounts,packs,pack,bikes,volume,perf,team,volumeUsed,teamUsed,after,promo,merch,shipping,total,vat,active,lead,delivery}}
function deliveryDate(n){let d=new Date();d.setHours(12,0,0,0);let closed=new Set(['2026-12-24','2026-12-25','2026-12-31','2027-01-01','2027-03-29']);while(n){d.setDate(d.getDate()+1);let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(d.getDay()!==0&&d.getDay()!==6&&!closed.has(k))n--}let weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=['January','February','March','April','May','June','July','August','September','October','November','December'];return `${weekdays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`}
function promoStatus(a){if(!code)return '';if(code==='SPRING10'&&!a.active)return 'SPRING10 requires €3,000.00 or more after the volume discount.';if(code==='WELCOME50'&&!a.active)return 'WELCOME50 applies to an order of one bike only.';if(code==='FREESHIP'&&!a.active)return 'FREESHIP applies once the order holds a bike.';if(code==='TEAM15'&&!a.active)return 'TEAM15 requires 4 bikes or more.';if(code==='TEAM15'&&a.active&&a.volumeUsed>0)return 'The volume discount applies instead of TEAM15.';return `Code ${code} applied.`}
function render(){let h=validHeight(),empty=$('#height-input').value.trim()==='';test('height-error').hidden=empty||!!h;test('height-input').setAttribute('aria-invalid',empty||h?'false':'true');if(!empty&&!h)test('height-input').setAttribute('aria-describedby','height-error');else test('height-input').removeAttribute('aria-describedby');let rec=test('height-recommendation');rec.hidden=!h;rec.textContent=h?`Recommended frame: ${recommend(h)}`:'';test('qty-value').textContent=state.qty;test('qty-decrease').disabled=state.qty===1;test('qty-increase').disabled=state.qty===5;test('bike-price').textContent=state.frame?money(unit()*state.qty):'—';test('undo-button').disabled=!history.length;test('add-to-order').textContent=editing===null?'Add to order':`Update line ${editing+1}`;let valid=!!h;test('add-to-order').disabled=editing===null&&(!valid||!state.frame);test('add-hint').hidden=editing!==null||valid;test('cancel-edit').hidden=editing===null;test('place-order').disabled=!lines.length||editing!==null;test('place-hint').hidden=editing===null;let a=getAmounts();test('place-order').textContent=a.B===0?'Place order':`Place order (${a.B} ${a.B===1?'bike':'bikes'})`;test('order-empty').hidden=!!lines.length;test('promo-apply').disabled=!$('#promo-input').value.trim();test('promo-remove').hidden=!code;let ps=test('promo-status');ps.textContent=promoStatus(a);ps.hidden=!code;test('promo-error').hidden=!promoInvalid;if(promoInvalid){$('#promo-input').setAttribute('aria-invalid','true');$('#promo-input').setAttribute('aria-describedby','promo-error')}else{$('#promo-input').removeAttribute('aria-invalid');$('#promo-input').removeAttribute('aria-describedby')}renderLines(a);renderSummary(a);renderCards()}
let promoInvalid=false;function renderLines(a){let host=$('#lines');host.innerHTML='';lines.forEach((l,i)=>{let div=document.createElement('article');div.className='orderline';div.dataset.testid=`order-line-${i+1}`;let desc=[item('frame',l.frame)[1],item('wheels',l.wheels)[1],item('drivetrain',l.drivetrain)[1],item('color',l.color)[1]].join(' · '),acc=l.accessory.map(x=>item('accessory',x)[1]).join(', ')||'No accessories';div.innerHTML=`<div class="line-top"><span data-role="description">${esc(desc)}</span><span data-role="amount">${money(a.lineAmounts[i])}</span></div><p data-role="accessories">${esc(acc)}</p><div class="line-top"><span>Quantity <span data-role="qty">${l.qty}</span></span><div class="line-actions"><button type="button" class="secondary" data-role="edit">Edit</button><button type="button" class="secondary" data-role="remove">Remove</button></div></div>`;div.querySelector('[data-role=edit]').onclick=()=>startEdit(i);div.querySelector('[data-role=remove]').onclick=()=>removeLine(i);host.append(div)})}
const labels={bikes:'Bikes',pack:'Commuter pack',volume:'Volume discount',promo:'',shipping:'Shipping',total:'Total',vat:'VAT included',delivery:'Delivery'};function renderSummary(a){let host=$('#summary');host.innerHTML='';if(!lines.length)return;let rows=[['bikes',labels.bikes,money(a.bikes),true],['pack',labels.pack,discount(a.pack),a.pack>0],['volume',labels.volume,discount(a.volumeUsed),a.volumeUsed>0],['promo',`Promo ${code||''}`,discount(a.promo),a.promo>0],['shipping',labels.shipping,a.shipping===0?'Free':money(a.shipping),true],['total',labels.total,money(a.total),true],['vat',labels.vat,money(a.vat),true],['delivery',labels.delivery,a.delivery,true]];for(let [key,label,value,show] of rows){if(!show)continue;let row=document.createElement('div');row.className='summary-row'+(key==='total'?' total':'');row.dataset.testid=`summary-line-${key}`;row.innerHTML=`<span data-role="label">${esc(label)}</span><span data-role="value">${esc(value)}</span>`;host.append(row)}}
function sync(){render()}function hideLineErr(){test('line-error').hidden=true}function clickAction(){hideLineErr();notice('')}function doUserEdit(mutate){clickAction();let before=clone(),a0=auto;mutate();if(JSON.stringify(before)!==JSON.stringify(state)||a0!==auto){history.push({...before,auto:a0})}render()}
function addOrSave(){hideLineErr();if(editing===null&&!validHeight())return;let current=clone(),target=editing,existing=lines.findIndex((l,i)=>i!==target&&key(l)===key(current));let next=lines.map(x=>({...x,accessory:[...x.accessory]}));if(target===null){if(existing>=0)next[existing].qty+=current.qty;else next.push(current)}else{next[target]=current;if(existing>=0){let keep=Math.min(existing,target),drop=Math.max(existing,target);next[keep].qty=next[keep].qty+next[drop].qty;next.splice(drop,1)}}let B=next.reduce((a,l)=>a+l.qty,0),err='';let affected=target===null?existing:existing;if(next.some(l=>l.qty>5))err='A line cannot hold more than 5 bikes.';else if(target===null&&existing<0&&next.length>4)err='An order cannot hold more than 4 lines.';else if(next.length>4)err='An order cannot hold more than 4 lines.';else if(B>10)err='An order cannot hold more than 10 bikes.';if(err){test('line-error').textContent=err;test('line-error').hidden=false;return}lines=next;editing=null;resetConfig();sync()}
function startEdit(i){clickAction();editing=i;let l=lines[i];Object.assign(state,{...l,accessory:[...l.accessory]});auto=false;history.length=0;notice('');sync()}function removeLine(i){clickAction();lines.splice(i,1);if(editing===i){editing=null;resetConfig()}else if(editing!==null&&editing>i)editing--;sync()}
function applyPromo(){if(!$('#promo-input').value.trim())return;let v=$('#promo-input').value.trim().toUpperCase();if(!['SPRING10','WELCOME50','FREESHIP','TEAM15'].includes(v)){promoInvalid=true;render();return}code=v;promoInvalid=false;$('#promo-input').value='';render()}function place(){if(!lines.length||editing!==null)return;let a=getAmounts();seq++;let d=new Date(),date=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;test('confirmation-reference').textContent=`AT-${date}-${String(seq).padStart(3,'0')}`;test('confirmation-bikes').textContent=`${a.B} ${a.B===1?'bike':'bikes'}`;test('confirmation-total').textContent=money(a.total);test('confirmation-delivery').textContent=a.delivery;document.querySelector('main').hidden=true;document.querySelector('.notice-wrap').hidden=true;test('confirmation').hidden=false}
function newOrder(){test('confirmation').hidden=true;document.querySelector('main').hidden=false;document.querySelector('.notice-wrap').hidden=false;lines=[];code=null;$('#promo-input').value='';$('#height-input').value='';promoInvalid=false;editing=null;test('line-error').hidden=true;test('promo-error').hidden=true;resetConfig();sync()}
buildCards();$('#height-input').addEventListener('input',()=>{clickAction();promoInvalid=false;let h=validHeight();if(auto&&h&&state.frame!==recommend(h)){state.frame=recommend(h);let m=[];cascadeFrame(m);notice(m.join(' '))}sync()});$('#promo-input').addEventListener('input',()=>{promoInvalid=false;render()});$('#promo-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!test('promo-apply').disabled)applyPromo()});test('promo-apply').onclick=applyPromo;test('promo-remove').onclick=()=>{code=null;render()};test('qty-increase').onclick=()=>doUserEdit(()=>{if(state.qty<5)state.qty++});test('qty-decrease').onclick=()=>doUserEdit(()=>{if(state.qty>1)state.qty--});test('undo-button').onclick=()=>{if(history.length){let s=history.pop();Object.assign(state,s,{accessory:[...s.accessory]});auto=s.auto;notice('');hideLineErr();sync()}};test('add-to-order').onclick=addOrSave;test('cancel-edit').onclick=()=>{editing=null;hideLineErr();resetConfig();sync()};test('place-order').onclick=place;test('confirmation-new').onclick=newOrder;sync();
})();
</script></body></html>
