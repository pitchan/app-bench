<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT-6 Luna</title>
  <style>
    :root {
      --color-bg: #F6F4F0;
      --color-surface: #FFFFFF;
      --color-text: #1B1A18;
      --color-muted: #67625B;
      --color-border: #DCD6CC;
      --color-accent: #0E6B58;
      --color-accent-contrast: #FFFFFF;
      --color-danger: #B42318;
      --color-disabled-bg: #ECE8E1;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --radius-control: 8px;
      --radius-card: 12px;
      --radius-pill: 999px;
      --text-sm: 14px;
      --text-md: 16px;
      --text-lg: 20px;
      --text-xl: 28px;
      --duration-fast: 150ms;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121110;
        --color-surface: #1D1B19;
        --color-text: #F3F0EA;
        --color-muted: #A59F96;
        --color-border: #38342F;
        --color-accent: #3BC4A5;
        --color-accent-contrast: #0B0A09;
        --color-danger: #F97066;
        --color-disabled-bg: #2A2724;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html {
      color-scheme: light dark;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 24px;
    }

    button,
    input {
      font: inherit;
    }

    .app-header {
      border-bottom: 1px solid var(--color-border);
      background-color: var(--color-surface);
    }

    .header-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      color: var(--color-text);
      font-size: var(--text-xl);
      font-weight: 700;
      line-height: 36px;
      letter-spacing: -0.045em;
    }

    .brand-title::before {
      width: 4px;
      height: 28px;
      border-radius: var(--radius-pill);
      background-color: var(--color-accent);
      content: "";
    }

    .page-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      align-items: start;
      gap: 32px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }

    .configurator {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 16px;
    }

    .config-section,
    .summary,
    .confirmation-panel {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      background-color: var(--color-surface);
    }

    .config-section {
      min-width: 0;
      padding: 24px;
    }

    .config-section h2 {
      margin: 0 0 16px;
      color: var(--color-text);
      font-size: var(--text-lg);
      font-weight: 600;
      line-height: 28px;
    }

    .field-stack {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .field-label {
      color: var(--color-text);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .text-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
      outline: none;
      background-color: var(--color-surface);
      color: var(--color-text);
      transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .text-input:focus-visible {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 22%, transparent);
    }

    .text-input.is-invalid {
      border-color: var(--color-danger);
    }

    .text-input.is-invalid:focus-visible {
      border-color: var(--color-danger);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-danger) 22%, transparent);
    }

    .field-message {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
    }

    .field-error,
    .promo-error {
      color: var(--color-danger);
    }

    .field-recommendation {
      color: var(--color-muted);
    }

    .frame-warning {
      margin: 0 0 12px;
      padding-left: 12px;
      border-left: 2px solid var(--color-danger);
      color: var(--color-danger);
      font-size: 14px;
      line-height: 20px;
    }

    .card-grid {
      display: grid;
      grid-auto-rows: 116px;
      gap: 12px;
      min-width: 0;
    }

    .card-grid[data-layout="frame"],
    .card-grid[data-layout="color"] {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card-grid[data-layout="wheels"],
    .card-grid[data-layout="accessories"] {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card-grid[data-layout="drivetrain"] {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .option-card {
      position: relative;
      display: flex;
      min-width: 0;
      height: 116px;
      align-items: stretch;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      background-color: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      text-align: left;
      transition: all var(--duration-fast);
    }

    .option-card[data-selected="true"] {
      padding: 15px;
      border-width: 2px;
      border-color: var(--color-accent);
    }

    .option-card:hover:not([data-selected="true"]):not([data-disabled="true"]) {
      border-color: var(--color-muted);
    }

    .option-card[data-disabled="true"] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .option-card:has(.visually-hidden-control:focus-visible),
    button:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .visually-hidden-control {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .card-content {
      display: flex;
      width: 100%;
      min-width: 0;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .card-head {
      display: flex;
      min-width: 0;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }

    [data-role="name"] {
      min-width: 0;
      overflow: hidden;
      color: var(--color-text);
      font-size: 16px;
      font-weight: 600;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-check {
      display: inline-flex;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: var(--color-accent);
      color: var(--color-accent-contrast);
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
    }

    [data-role="price"] {
      color: var(--color-muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      line-height: 18px;
      white-space: nowrap;
    }

    .card-foot {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    [data-role="reason"] {
      overflow: hidden;
      color: var(--color-muted);
      font-size: 12px;
      line-height: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    [data-role="swatch"] {
      display: block;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border: 1px solid var(--color-border);
      border-radius: 50%;
    }

    [data-role="badge"] {
      position: absolute;
      z-index: 1;
      top: -1px;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background-color: var(--color-accent);
      color: var(--color-accent-contrast);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      white-space: nowrap;
    }

    .option-card[data-selected="true"] [data-role="badge"] {
      top: -2px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
      background-color: transparent;
      color: var(--color-text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      opacity: 1;
      transition: all var(--duration-fast);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .quantity-button {
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 20px;
      font-weight: 500;
    }

    .quantity-value {
      min-width: 20px;
      color: var(--color-text);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      text-align: center;
    }

    .summary {
      position: sticky;
      top: 24px;
      width: 360px;
      min-width: 0;
      padding: 24px;
    }

    .bike-preview {
      display: block;
      width: 100%;
      height: 200px;
      margin: 0 0 16px;
      overflow: visible;
      border-radius: var(--radius-control);
      background-color: var(--color-bg);
    }

    .preview-ground {
      stroke: var(--color-border);
      stroke-width: 1.5;
    }

    .preview-wheel {
      fill: none;
      stroke: var(--color-muted);
      stroke-width: 4;
    }

    .preview-detail {
      fill: none;
      stroke: var(--color-muted);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .summary-lines {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    .summary-line {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 12px;
      padding: 5px 0;
      font-size: 14px;
      line-height: 20px;
    }

    .summary-line [data-role="label"] {
      min-width: 0;
      overflow: hidden;
      color: var(--color-muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-line [data-role="value"] {
      color: var(--color-text);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .summary-line.discount [data-role="value"] {
      color: var(--color-accent);
    }

    .summary-line-total {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
      font-size: 28px;
      font-weight: 700;
      line-height: 34px;
    }

    .summary-line-total [data-role="label"],
    .summary-line-total [data-role="value"] {
      color: var(--color-text);
      font-size: 28px;
      font-weight: 700;
      line-height: 34px;
    }

    .promo-block {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }

    .promo-label {
      color: var(--color-text);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .promo-controls {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .promo-input {
      width: 100%;
      height: 40px;
      min-width: 0;
      padding: 0 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
      outline: none;
      background-color: var(--color-surface);
      color: var(--color-text);
      font-size: 14px;
    }

    .promo-input:focus-visible {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-accent) 22%, transparent);
    }

    .promo-input[aria-invalid="true"] {
      border-color: var(--color-danger);
    }

    .promo-apply,
    .promo-remove,
    .confirmation-new {
      min-height: 40px;
      height: 40px;
    }

    .promo-status {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
    }

    .promo-status[data-active="true"] {
      color: var(--color-accent);
    }

    .promo-status[data-active="false"] {
      color: var(--color-muted);
    }

    .promo-error {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
    }

    .promo-remove {
      align-self: flex-start;
    }

    .order-button {
      display: flex;
      width: 100%;
      height: 48px;
      margin-top: 20px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius-control);
      background-color: var(--color-accent);
      color: var(--color-accent-contrast);
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
    }

    .order-button:disabled {
      background-color: var(--color-disabled-bg);
      color: var(--color-muted);
      cursor: not-allowed;
      opacity: 1;
    }

    .order-hint {
      margin: 8px 0 0;
      color: var(--color-muted);
      font-size: 14px;
      line-height: 20px;
    }

    .live-region {
      position: static;
    }

    .notice {
      position: fixed;
      z-index: 5;
      bottom: 24px;
      left: 50%;
      width: calc(100% - 32px);
      max-width: 480px;
      transform: translateX(-50%);
      padding: 12px 16px;
      border-left: 4px solid var(--color-accent);
      border-radius: var(--radius-control);
      background-color: var(--color-surface);
      color: var(--color-text);
      box-shadow: 0 12px 32px rgba(20, 18, 14, 0.14);
      font-size: 14px;
      line-height: 20px;
    }

    .confirmation-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .confirmation-panel {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 40px;
      text-align: center;
    }

    .confirmation-mark {
      display: inline-flex;
      width: 56px;
      height: 56px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border-radius: 50%;
      background-color: color-mix(in srgb, var(--color-accent) 14%, transparent);
      color: var(--color-accent);
      font-size: 26px;
      font-weight: 700;
    }

    .confirmation-title {
      margin: 0 0 24px;
      font-size: 28px;
      font-weight: 700;
      line-height: 36px;
    }

    .confirmation-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 0 0 28px;
      text-align: left;
    }

    .confirmation-detail {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-control);
    }

    .confirmation-detail-label {
      display: block;
      margin-bottom: 4px;
      color: var(--color-muted);
      font-size: 14px;
    }

    .confirmation-detail-value {
      display: block;
      overflow-wrap: anywhere;
      color: var(--color-text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .confirmation-new {
      padding: 0 18px;
    }

    @media (max-width: 1023px) {
      .header-inner {
        padding: 20px 16px;
      }

      .page-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 32px;
        padding: 24px 16px 40px;
      }

      .summary {
        position: static;
        width: 100%;
      }

      .card-grid[data-layout="frame"],
      .card-grid[data-layout="color"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card-grid[data-layout="drivetrain"] {
        grid-template-columns: minmax(0, 1fr);
      }

      .confirmation-wrap {
        padding: 32px 16px;
      }
    }

    @media (max-width: 480px) {
      .confirmation-panel {
        padding: 28px 20px;
      }

      .confirmation-details {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0s !important;
        animation-duration: 0s !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header" data-testid="app-header">
    <div class="header-inner">
      <h1 class="brand-title">GPT-6 Luna</h1>
    </div>
  </header>

  <main class="page-layout" id="main-content">
      <div class="configurator" data-testid="configurator">
        <section class="config-section" data-testid="section-rider">
          <h2>1. Rider</h2>
          <div class="field-stack">
            <label class="field-label" for="height-input">Your height (cm)</label>
            <input class="text-input" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off">
            <p class="field-message field-error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
            <p class="field-message field-recommendation" data-testid="height-recommendation" hidden></p>
          </div>
        </section>

        <section class="config-section" data-testid="section-frame">
          <h2>2. Frame</h2>
          <p class="frame-warning" data-testid="frame-warning" hidden></p>
          <div class="card-grid" data-layout="frame" id="frame-cards"></div>
        </section>

        <section class="config-section" data-testid="section-wheels">
          <h2>3. Wheels</h2>
          <div class="card-grid" data-layout="wheels" id="wheels-cards"></div>
        </section>

        <section class="config-section" data-testid="section-drivetrain">
          <h2>4. Drivetrain</h2>
          <div class="card-grid" data-layout="drivetrain" id="drivetrain-cards"></div>
        </section>

        <section class="config-section" data-testid="section-color">
          <h2>5. Color</h2>
          <div class="card-grid" data-layout="color" id="color-cards"></div>
        </section>

        <section class="config-section" data-testid="section-accessories">
          <h2>6. Accessories</h2>
          <div class="card-grid" data-layout="accessories" id="accessory-cards"></div>
        </section>

        <section class="config-section" data-testid="section-quantity">
          <h2>7. Quantity</h2>
          <div class="quantity-control">
            <button class="quantity-button" type="button" data-testid="qty-decrease" aria-label="Decrease quantity">−</button>
            <span class="quantity-value" data-testid="qty-value">1</span>
            <button class="quantity-button" type="button" data-testid="qty-increase" aria-label="Increase quantity">+</button>
          </div>
        </section>
      </div>

      <aside class="summary" data-testid="summary">
        <svg class="bike-preview" data-testid="bike-preview" viewBox="0 0 310 200" role="img" aria-label="Bicycle preview" xmlns="http://www.w3.org/2000/svg">
          <path class="preview-ground" d="M10 194H300"></path>
          <circle class="preview-wheel" data-part="wheel" cx="78" cy="122" r="70"></circle>
          <circle class="preview-wheel" data-part="wheel" cx="232" cy="122" r="70"></circle>
          <g id="frame-parts">
            <line data-part="frame" x1="78" y1="122" x2="145" y2="122"></line>
            <line data-part="frame" x1="145" y1="122" x2="127" y2="72"></line>
            <line data-part="frame" x1="127" y1="72" x2="180" y2="72"></line>
            <line data-part="frame" x1="180" y1="72" x2="145" y2="122"></line>
            <line data-part="frame" x1="127" y1="72" x2="78" y2="122"></line>
            <line data-part="frame" x1="180" y1="72" x2="232" y2="122"></line>
          </g>
          <g id="preview-details">
            <path class="preview-detail" d="M115 66L135 66M181 65L198 65L190 72"></path>
            <path class="preview-detail" d="M142 122L151 132M151 132L160 126"></path>
            <path class="preview-detail" d="M78 122L78 122M232 122L232 122"></path>
          </g>
          <g id="preview-accessories"></g>
        </svg>

        <div class="summary-lines" id="summary-lines"></div>

        <div class="promo-block">
          <label class="promo-label" for="promo-input">Promo code</label>
          <div class="promo-controls">
            <input class="promo-input" id="promo-input" data-testid="promo-input" type="text" autocomplete="off">
            <button class="promo-apply" type="button" data-testid="promo-apply" disabled>Apply</button>
          </div>
          <p class="promo-error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
          <p class="promo-status" data-testid="promo-status" hidden></p>
          <button class="promo-remove" type="button" data-testid="promo-remove" hidden>Remove code</button>
        </div>

        <button class="order-button" type="button" data-testid="order-button" disabled>Order 1 bike</button>
        <p class="order-hint" data-testid="order-hint">Enter your height to continue.</p>
      </aside>
  </main>

  <section class="confirmation-wrap" data-testid="confirmation" hidden>
    <div class="confirmation-panel">
      <div class="confirmation-mark" aria-hidden="true">✓</div>
      <h2 class="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
      <div class="confirmation-details">
        <div class="confirmation-detail">
          <span class="confirmation-detail-label">Reference</span>
          <span class="confirmation-detail-value" data-testid="confirmation-reference"></span>
        </div>
        <div class="confirmation-detail">
          <span class="confirmation-detail-label">Total</span>
          <span class="confirmation-detail-value" data-testid="confirmation-total"></span>
        </div>
        <div class="confirmation-detail">
          <span class="confirmation-detail-label">Estimated delivery</span>
          <span class="confirmation-detail-value" data-testid="confirmation-delivery"></span>
        </div>
      </div>
      <button class="confirmation-new" type="button" data-testid="confirmation-new">Configure another bike</button>
    </div>
  </section>

  <div class="live-region" role="status" aria-live="polite" aria-atomic="true">
    <div class="notice" data-testid="notice" hidden></div>
  </div>

  <script>
    (function () {
      "use strict";

      const FRAMES = [
        { id: "S", name: "Frame S", price: 119000, min: 150, max: 164 },
        { id: "M", name: "Frame M", price: 119000, min: 165, max: 174 },
        { id: "L", name: "Frame L", price: 124000, min: 175, max: 184 },
        { id: "XL", name: "Frame XL", price: 129000, min: 185, max: 200 }
      ];
      const WHEELS = [
        { id: "275", name: '27.5" wheels', surcharge: 0, radius: 70 },
        { id: "29", name: '29" wheels', surcharge: 12000, radius: 76 }
      ];
      const DRIVETRAINS = [
        { id: "essential", name: "Essential 1×10", surcharge: 0, lead: 5 },
        { id: "sport", name: "Sport 1×12", surcharge: 24000, lead: 7 },
        { id: "pro", name: "Pro Electronic 2×12", surcharge: 69000, lead: 12 }
      ];
      const COLORS = [
        { id: "graphite", name: "Graphite", hex: "#3A3A3C", surcharge: 0 },
        { id: "sand", name: "Sand", hex: "#D8C7A6", surcharge: 0 },
        { id: "red", name: "Racing Red", hex: "#C8102E", surcharge: 6000, lead: 3 },
        { id: "glacier", name: "Glacier", hex: "#A9D6E5", surcharge: 0, outOfStock: true }
      ];
      const ACCESSORIES = [
        { id: "mudguards", name: "Mudguards", price: 4500 },
        { id: "rack", name: "Rear rack", price: 6900 },
        { id: "lights", name: "Lights", price: 3990 },
        { id: "kickstand", name: "Kickstand", price: 2450 }
      ];
      const SIZE_ORDER = ["S", "M", "L", "XL"];
      const CLOSED_DAYS = new Set(["2026-12-24", "2026-12-25", "2026-12-31", "2027-01-01"]);
      const state = {
        heightRaw: "",
        heightValid: false,
        heightNumber: null,
        recommended: null,
        frame: null,
        wheels: "275",
        drivetrain: "essential",
        color: "graphite",
        accessories: new Set(),
        quantity: 1,
        appliedCode: null,
        promoError: false,
        autoFrame: true,
        notice: "",
        orderSequence: 0
      };

      const mainContent = document.getElementById("main-content");
      const heightInput = document.querySelector('[data-testid="height-input"]');
      const promoInput = document.querySelector('[data-testid="promo-input"]');
      const promoApply = document.querySelector('[data-testid="promo-apply"]');
      const summaryLines = document.getElementById("summary-lines");
      const summaryRows = Object.create(null);
      const summaryKeys = [
        ["frame", "Frame"],
        ["wheels", '27.5" wheels'],
        ["drivetrain", "Essential 1×10"],
        ["color", "Graphite"],
        ["accessory-mudguards", "Mudguards"],
        ["accessory-rack", "Rear rack"],
        ["accessory-lights", "Lights"],
        ["accessory-kickstand", "Kickstand"],
        ["unit", "Unit price"],
        ["quantity", "Quantity"],
        ["subtotal", "Subtotal"],
        ["qty-discount", "Quantity discount (5%)"],
        ["promo", "Code"],
        ["shipping", "Shipping"],
        ["total", "Total"],
        ["vat", "Including VAT (20%)"],
        ["delivery", "Estimated delivery"]
      ];

      function makeSummaryRows() {
        summaryKeys.forEach(function (entry) {
          const key = entry[0];
          const row = document.createElement("div");
          row.className = "summary-line" + (key === "total" ? " summary-line-total" : "");
          if (key === "qty-discount" || key === "promo") row.classList.add("discount");
          row.dataset.testid = "summary-line-" + key;
          row.setAttribute("data-testid", "summary-line-" + key);
          const label = document.createElement("span");
          label.setAttribute("data-role", "label");
          label.textContent = entry[1];
          const value = document.createElement("span");
          value.setAttribute("data-role", "value");
          row.append(label, value);
          summaryLines.appendChild(row);
          summaryRows[key] = row;
        });
      }

      function svgElement(name, attributes) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.keys(attributes).forEach(function (key) {
          element.setAttribute(key, attributes[key]);
        });
        return element;
      }

      function appendOptionCard(group, option, host) {
        const card = document.createElement("label");
        card.className = "option-card";
        card.dataset.group = group;
        card.dataset.option = option.id;
        card.setAttribute("data-testid", "card-" + group + "-" + option.id);

        const control = document.createElement("input");
        control.className = "visually-hidden-control";
        control.type = group === "accessory" ? "checkbox" : "radio";
        control.name = group === "accessory" ? "accessories" : group;
        control.value = option.id;
        control.setAttribute("aria-label", option.name);
        card.appendChild(control);

        const content = document.createElement("span");
        content.className = "card-content";
        const head = document.createElement("span");
        head.className = "card-head";
        const name = document.createElement("span");
        name.setAttribute("data-role", "name");
        name.textContent = option.name;
        const check = document.createElement("span");
        check.className = "card-check";
        check.setAttribute("data-role", "check");
        check.setAttribute("aria-hidden", "true");
        check.textContent = "✓";
        check.hidden = true;
        head.append(name, check);
        content.appendChild(head);

        if (group === "color") {
          const swatch = document.createElement("span");
          swatch.setAttribute("data-role", "swatch");
          swatch.setAttribute("aria-hidden", "true");
          swatch.style.backgroundColor = option.hex;
          content.appendChild(swatch);
        }

        const foot = document.createElement("span");
        foot.className = "card-foot";
        const price = document.createElement("span");
        price.setAttribute("data-role", "price");
        foot.appendChild(price);
        const reason = document.createElement("span");
        reason.setAttribute("data-role", "reason");
        reason.hidden = true;
        foot.appendChild(reason);
        content.appendChild(foot);
        card.appendChild(content);

        if (group === "frame") {
          const badge = document.createElement("span");
          badge.setAttribute("data-role", "badge");
          badge.textContent = "Recommended";
          badge.hidden = true;
          card.appendChild(badge);
        }

        card.addEventListener("click", function () {
          if (group === "frame") state.autoFrame = false;
        });
        host.appendChild(card);
      }

      makeSummaryRows();
      FRAMES.forEach(function (item) { appendOptionCard("frame", item, document.getElementById("frame-cards")); });
      WHEELS.forEach(function (item) { appendOptionCard("wheels", item, document.getElementById("wheels-cards")); });
      DRIVETRAINS.forEach(function (item) { appendOptionCard("drivetrain", item, document.getElementById("drivetrain-cards")); });
      COLORS.forEach(function (item) { appendOptionCard("color", item, document.getElementById("color-cards")); });
      ACCESSORIES.forEach(function (item) { appendOptionCard("accessory", item, document.getElementById("accessory-cards")); });

      function formatAmount(cents) {
        const euros = Math.floor(cents / 100);
        const euroText = String(euros).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        const centText = String(cents % 100).padStart(2, "0");
        return "€" + euroText + "." + centText;
      }

      function formatSurcharge(cents) {
        return cents === 0 ? "Included" : "+" + formatAmount(cents);
      }

      function roundHalfUp(numerator, denominator) {
        return Math.floor((numerator + denominator / 2) / denominator);
      }

      function findItem(items, id) {
        return items.find(function (item) { return item.id === id; });
      }

      function calculatePrice() {
        if (!state.frame) {
          return {
            hasFrame: false,
            unit: null,
            subtotal: null,
            quantityDiscount: 0,
            afterQuantity: null,
            promoDiscount: 0,
            promoActive: state.appliedCode === "FREESHIP" || (state.appliedCode === "WELCOME50" && state.quantity < 3),
            merchandise: null,
            shipping: null,
            total: null,
            vat: null
          };
        }

        const frame = findItem(FRAMES, state.frame);
        const wheels = findItem(WHEELS, state.wheels);
        const drivetrain = findItem(DRIVETRAINS, state.drivetrain);
        const color = findItem(COLORS, state.color);
        const colorCharge = state.color === "red" && state.drivetrain === "pro" ? 0 : color.surcharge;
        let accessoryTotal = 0;
        ACCESSORIES.forEach(function (item) {
          if (state.accessories.has(item.id)) accessoryTotal += item.price;
        });
        const unit = frame.price + wheels.surcharge + drivetrain.surcharge + colorCharge + accessoryTotal;
        const subtotal = unit * state.quantity;
        const quantityDiscount = state.quantity >= 3 ? roundHalfUp(subtotal * 5, 100) : 0;
        const afterQuantity = subtotal - quantityDiscount;
        let promoActive = false;
        let promoDiscount = 0;
        if (state.appliedCode === "SPRING10") {
          promoActive = afterQuantity >= 150000;
          if (promoActive) promoDiscount = roundHalfUp(afterQuantity * 10, 100);
        } else if (state.appliedCode === "WELCOME50") {
          promoActive = state.quantity < 3;
          if (promoActive) promoDiscount = 5000;
        } else if (state.appliedCode === "FREESHIP") {
          promoActive = true;
        }
        const merchandise = afterQuantity - promoDiscount;
        const shipping = state.appliedCode === "FREESHIP" || merchandise >= 200000 ? 0 : 4900;
        const total = merchandise + shipping;
        const vat = roundHalfUp(total * 20, 120);
        return {
          hasFrame: true,
          unit: unit,
          subtotal: subtotal,
          quantityDiscount: quantityDiscount,
          afterQuantity: afterQuantity,
          promoDiscount: promoDiscount,
          promoActive: promoActive,
          merchandise: merchandise,
          shipping: shipping,
          total: total,
          vat: vat
        };
      }

      function isHeightValid(value) {
        const trimmed = value.trim();
        if (!trimmed || !/^\d+$/.test(trimmed)) return { valid: false, number: null };
        const number = Number(trimmed);
        return { valid: number >= 150 && number <= 200, number: number };
      }

      function recommendedFrame(height) {
        return FRAMES.find(function (item) { return height >= item.min && height <= item.max; }) || null;
      }

      function getColorCharge() {
        const selected = findItem(COLORS, state.color);
        return state.color === "red" && state.drivetrain === "pro" ? 0 : selected.surcharge;
      }

      function clearNotice() {
        state.notice = "";
        const notice = document.querySelector('[data-testid="notice"]');
        notice.textContent = "";
        notice.hidden = true;
      }

      function showNotice(message) {
        state.notice = message;
        const notice = document.querySelector('[data-testid="notice"]');
        notice.textContent = message;
        notice.hidden = false;
      }

      function updateCards() {
        document.querySelectorAll(".option-card").forEach(function (card) {
          const group = card.dataset.group;
          const id = card.dataset.option;
          const input = card.querySelector("input");
          const isAccessory = group === "accessory";
          const selected = isAccessory ? state.accessories.has(id) : state[group] === id;
          let disabled = false;
          let reasonText = "";

          if (group === "wheels" && id === "29" && state.frame === "S") {
            disabled = true;
            reasonText = "Not available with frame S";
          }
          if (group === "color" && id === "glacier") {
            disabled = true;
            reasonText = "Out of stock";
          }

          card.dataset.selected = selected ? "true" : "false";
          card.dataset.disabled = disabled ? "true" : "false";
          input.checked = selected;
          input.disabled = disabled;
          card.querySelector('[data-role="check"]').hidden = !selected;
          const reason = card.querySelector('[data-role="reason"]');
          reason.textContent = reasonText;
          reason.hidden = !reasonText;

          if (group === "frame") {
            card.querySelector('[data-role="price"]').textContent = formatAmount(findItem(FRAMES, id).price);
            const badge = card.querySelector('[data-role="badge"]');
            const recommended = state.heightValid && state.recommended === id;
            badge.hidden = !recommended;
          } else if (group === "wheels") {
            card.querySelector('[data-role="price"]').textContent = formatSurcharge(findItem(WHEELS, id).surcharge);
          } else if (group === "drivetrain") {
            card.querySelector('[data-role="price"]').textContent = formatSurcharge(findItem(DRIVETRAINS, id).surcharge);
          } else if (group === "color") {
            const price = id === "red" && state.drivetrain === "pro" ? "Included with Pro" : formatSurcharge(findItem(COLORS, id).surcharge);
            card.querySelector('[data-role="price"]').textContent = price;
          } else if (isAccessory) {
            card.querySelector('[data-role="price"]').textContent = "+" + formatAmount(findItem(ACCESSORIES, id).price);
          }
        });
      }

      function updateFitMessages() {
        const heightCheck = isHeightValid(heightInput.value);
        state.heightRaw = heightInput.value;
        state.heightValid = heightCheck.valid;
        state.heightNumber = heightCheck.valid ? heightCheck.number : null;
        state.recommended = state.heightValid ? recommendedFrame(state.heightNumber).id : null;

        const error = document.querySelector('[data-testid="height-error"]');
        const recommendation = document.querySelector('[data-testid="height-recommendation"]');
        const warning = document.querySelector('[data-testid="frame-warning"]');
        const trimmed = heightInput.value.trim();
        const showError = trimmed.length > 0 && !state.heightValid;
        error.hidden = !showError;
        heightInput.classList.toggle("is-invalid", showError);
        if (showError) {
          heightInput.setAttribute("aria-invalid", "true");
          heightInput.setAttribute("aria-describedby", "height-error");
        } else {
          heightInput.removeAttribute("aria-invalid");
          heightInput.removeAttribute("aria-describedby");
        }

        recommendation.textContent = state.heightValid ? "Recommended frame: " + state.recommended : "";
        recommendation.hidden = !state.heightValid;

        let warningText = "";
        if (state.heightValid && state.frame) {
          const selectedIndex = SIZE_ORDER.indexOf(state.frame);
          const recommendedIndex = SIZE_ORDER.indexOf(state.recommended);
          const gap = Math.abs(selectedIndex - recommendedIndex);
          if (gap >= 2) {
            warningText = "Frame " + state.frame + " is " + gap + " sizes " +
              (selectedIndex > recommendedIndex ? "larger" : "smaller") + " than recommended.";
          }
        }
        warning.textContent = warningText;
        warning.hidden = !warningText;
      }

      function isPromoActive(code, price) {
        if (code === "SPRING10") return price.hasFrame && price.afterQuantity >= 150000;
        if (code === "WELCOME50") return state.quantity < 3;
        if (code === "FREESHIP") return true;
        return false;
      }

      function calculateLeadTime() {
        const drivetrain = findItem(DRIVETRAINS, state.drivetrain);
        const color = findItem(COLORS, state.color);
        return drivetrain.lead + (state.color === "red" ? color.lead : 0) + (state.quantity >= 3 ? 2 : 0);
      }

      function localDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      }

      function calculateDeliveryDate() {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        let remaining = calculateLeadTime();
        while (remaining > 0) {
          date.setDate(date.getDate() + 1);
          const weekday = date.getDay();
          if (weekday === 0 || weekday === 6 || CLOSED_DAYS.has(localDateKey(date))) continue;
          remaining -= 1;
        }
        const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        return weekdays[date.getDay()] + ", " + date.getDate() + " " + months[date.getMonth()] + " " + date.getFullYear();
      }

      function setSummaryLine(key, label, value, visible) {
        const row = summaryRows[key];
        row.hidden = !visible;
        row.querySelector('[data-role="label"]').textContent = label;
        row.querySelector('[data-role="value"]').textContent = value;
      }

      function updateSummary() {
        const price = calculatePrice();
        const wheels = findItem(WHEELS, state.wheels);
        const drivetrain = findItem(DRIVETRAINS, state.drivetrain);
        const color = findItem(COLORS, state.color);

        setSummaryLine("frame", state.frame ? "Frame " + state.frame : "Frame", state.frame ? formatAmount(findItem(FRAMES, state.frame).price) : "—", true);
        setSummaryLine("wheels", wheels.name, formatSurcharge(wheels.surcharge), true);
        setSummaryLine("drivetrain", drivetrain.name, formatSurcharge(drivetrain.surcharge), true);
        setSummaryLine("color", color.name, formatSurcharge(getColorCharge()), true);

        ACCESSORIES.forEach(function (item) {
          const key = "accessory-" + item.id;
          setSummaryLine(key, item.name, "+" + formatAmount(item.price), state.accessories.has(item.id));
        });

        setSummaryLine("unit", "Unit price", price.hasFrame ? formatAmount(price.unit) : "—", true);
        setSummaryLine("quantity", "Quantity", "× " + state.quantity, true);
        setSummaryLine("subtotal", "Subtotal", price.hasFrame ? formatAmount(price.subtotal) : "—", true);
        setSummaryLine("qty-discount", "Quantity discount (5%)", price.hasFrame ? "−" + formatAmount(price.quantityDiscount) : "—", price.hasFrame && state.quantity >= 3);

        const promoVisible = price.hasFrame && state.appliedCode && price.promoActive && price.promoDiscount > 0;
        setSummaryLine("promo", state.appliedCode ? "Code " + state.appliedCode : "Code", promoVisible ? "−" + formatAmount(price.promoDiscount) : "—", Boolean(promoVisible));
        setSummaryLine("shipping", "Shipping", price.hasFrame ? (price.shipping === 0 ? "Free" : formatAmount(price.shipping)) : "—", true);
        setSummaryLine("total", "Total", price.hasFrame ? formatAmount(price.total) : "—", true);
        setSummaryLine("vat", "Including VAT (20%)", price.hasFrame ? formatAmount(price.vat) : "—", true);
        setSummaryLine("delivery", "Estimated delivery", calculateDeliveryDate(), true);

        const status = document.querySelector('[data-testid="promo-status"]');
        const remove = document.querySelector('[data-testid="promo-remove"]');
        if (state.appliedCode) {
          const active = isPromoActive(state.appliedCode, price);
          let text = "Code " + state.appliedCode + " applied.";
          if (state.appliedCode === "SPRING10" && !active) {
            text = "SPRING10 requires €1,500.00 or more after the quantity discount.";
          } else if (state.appliedCode === "WELCOME50" && !active) {
            text = "WELCOME50 cannot be combined with the quantity discount.";
          }
          status.textContent = text;
          status.dataset.active = active ? "true" : "false";
          status.hidden = false;
          remove.hidden = false;
        } else {
          status.textContent = "";
          status.hidden = true;
          remove.hidden = true;
        }

        const error = document.querySelector('[data-testid="promo-error"]');
        error.hidden = !state.promoError;
        if (state.promoError) {
          promoInput.setAttribute("aria-invalid", "true");
          promoInput.setAttribute("aria-describedby", "promo-error");
        } else {
          promoInput.removeAttribute("aria-invalid");
          promoInput.removeAttribute("aria-describedby");
        }

        promoApply.disabled = promoInput.value.trim().length === 0;
        document.querySelector('[data-testid="qty-decrease"]').disabled = state.quantity <= 1;
        document.querySelector('[data-testid="qty-increase"]').disabled = state.quantity >= 5;
        const orderButton = document.querySelector('[data-testid="order-button"]');
        const orderHint = document.querySelector('[data-testid="order-hint"]');
        orderButton.textContent = state.quantity === 1 ? "Order 1 bike" : "Order " + state.quantity + " bikes";
        const canOrder = state.heightValid && Boolean(state.frame);
        orderButton.disabled = !canOrder;
        orderHint.hidden = state.heightValid;
      }

      function updatePreview() {
        const color = findItem(COLORS, state.color);
        document.querySelectorAll('#frame-parts [data-part="frame"]').forEach(function (part) {
          part.setAttribute("stroke", color.hex);
          part.setAttribute("stroke-width", "6");
          part.setAttribute("stroke-linecap", "round");
          part.setAttribute("stroke-linejoin", "round");
        });
        const radius = String(findItem(WHEELS, state.wheels).radius);
        document.querySelectorAll('[data-part="wheel"]').forEach(function (wheel) {
          wheel.setAttribute("r", radius);
        });

        const optional = document.getElementById("preview-accessories");
        optional.replaceChildren();
        if (state.accessories.has("mudguards")) {
          optional.append(
            svgElement("path", {
              "data-part": "mudguard",
              d: "M24 122 A54 54 0 0 1 132 122",
              fill: "none",
              stroke: color.hex,
              "stroke-width": "5",
              "stroke-linecap": "round"
            }),
            svgElement("path", {
              "data-part": "mudguard",
              d: "M178 122 A54 54 0 0 1 286 122",
              fill: "none",
              stroke: color.hex,
              "stroke-width": "5",
              "stroke-linecap": "round"
            })
          );
        }
        if (state.accessories.has("rack")) {
          optional.appendChild(svgElement("path", {
            "data-part": "rack",
            d: "M53 58H101V78M53 58L61 77M101 58L96 77",
            fill: "none",
            stroke: "var(--color-muted)",
            "stroke-width": "4",
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          }));
        }
        if (state.accessories.has("lights")) {
          optional.appendChild(svgElement("path", {
            "data-part": "light",
            d: "M197 62L207 58L211 67L201 71Z",
            fill: "var(--color-accent)",
            stroke: "var(--color-accent)",
            "stroke-width": "2"
          }));
        }
        if (state.accessories.has("kickstand")) {
          optional.appendChild(svgElement("line", {
            "data-part": "kickstand",
            x1: "150",
            y1: "126",
            x2: "164",
            y2: "175",
            stroke: "var(--color-muted)",
            "stroke-width": "4",
            "stroke-linecap": "round"
          }));
        }
      }

      function render() {
        updateCards();
        updateFitMessages();
        updateSummary();
        updatePreview();
        document.querySelector('[data-testid="qty-value"]').textContent = String(state.quantity);
      }

      function selectAutomaticFrame() {
        if (!state.autoFrame || !state.heightValid || !state.recommended || state.frame === state.recommended) return;
        state.frame = state.recommended;
        if (state.frame === "S" && state.wheels === "29") {
          state.wheels = "275";
          showNotice('29" wheels were replaced by 27.5" wheels: not available with frame S.');
        }
      }

      heightInput.addEventListener("input", function () {
        clearNotice();
        const result = isHeightValid(heightInput.value);
        state.heightValid = result.valid;
        state.heightNumber = result.valid ? result.number : null;
        state.recommended = result.valid ? recommendedFrame(result.number).id : null;
        selectAutomaticFrame();
        render();
      });

      document.querySelectorAll(".option-card").forEach(function (card) {
        const input = card.querySelector("input");
        input.addEventListener("change", function () {
          const group = card.dataset.group;
          const id = card.dataset.option;

          if (group === "frame") {
            if (!input.checked) return;
            state.autoFrame = false;
            if (state.frame === id) return;
            clearNotice();
            state.frame = id;
            if (state.frame === "S" && state.wheels === "29") {
              state.wheels = "275";
              showNotice('29" wheels were replaced by 27.5" wheels: not available with frame S.');
            }
            render();
            return;
          }

          if (group === "accessory") {
            const wasSelected = state.accessories.has(id);
            if (wasSelected === input.checked) return;
            clearNotice();
            if (input.checked) {
              state.accessories.add(id);
              if (id === "rack" && !state.accessories.has("mudguards")) {
                state.accessories.add("mudguards");
                showNotice("Mudguards were added: required by the rear rack.");
              }
            } else {
              state.accessories.delete(id);
              if (id === "mudguards" && state.accessories.has("rack")) {
                state.accessories.delete("rack");
                showNotice("Rear rack was removed: it requires mudguards.");
              }
            }
            render();
            return;
          }

          if (!input.checked || state[group] === id) return;
          clearNotice();
          state[group] = id;
          render();
        });
      });

      document.querySelector('[data-testid="qty-decrease"]').addEventListener("click", function () {
        if (state.quantity <= 1) return;
        clearNotice();
        state.quantity -= 1;
        render();
      });
      document.querySelector('[data-testid="qty-increase"]').addEventListener("click", function () {
        if (state.quantity >= 5) return;
        clearNotice();
        state.quantity += 1;
        render();
      });

      promoInput.addEventListener("input", function () {
        if (state.promoError) state.promoError = false;
        promoApply.disabled = promoInput.value.trim().length === 0;
        const promoError = document.querySelector('[data-testid="promo-error"]');
        promoError.hidden = !state.promoError;
        promoInput.removeAttribute("aria-invalid");
        promoInput.removeAttribute("aria-describedby");
      });

      function applyPromo() {
        const code = promoInput.value.trim().toUpperCase();
        if (!code) return;
        if (code !== "SPRING10" && code !== "WELCOME50" && code !== "FREESHIP") {
          state.promoError = true;
          render();
          return;
        }
        state.appliedCode = code;
        state.promoError = false;
        promoInput.value = "";
        render();
      }

      promoApply.addEventListener("click", applyPromo);
      promoInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !promoApply.disabled) {
          event.preventDefault();
          applyPromo();
        }
      });
      document.querySelector('[data-testid="promo-remove"]').addEventListener("click", function () {
        state.appliedCode = null;
        render();
      });

      function resetConfiguration() {
        state.heightRaw = "";
        state.heightValid = false;
        state.heightNumber = null;
        state.recommended = null;
        state.frame = null;
        state.wheels = "275";
        state.drivetrain = "essential";
        state.color = "graphite";
        state.accessories = new Set();
        state.quantity = 1;
        state.appliedCode = null;
        state.promoError = false;
        state.autoFrame = true;
        state.notice = "";
        heightInput.value = "";
        promoInput.value = "";
        clearNotice();
        render();
      }

      document.querySelector('[data-testid="order-button"]').addEventListener("click", function () {
        if (!state.heightValid || !state.frame) return;
        const price = calculatePrice();
        const now = new Date();
        const datePart = String(now.getFullYear()) + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0");
        state.orderSequence += 1;
        document.querySelector('[data-testid="confirmation-reference"]').textContent =
          "BK-" + datePart + "-" + String(state.orderSequence).padStart(3, "0");
        document.querySelector('[data-testid="confirmation-total"]').textContent = formatAmount(price.total);
        document.querySelector('[data-testid="confirmation-delivery"]').textContent = calculateDeliveryDate();
        clearNotice();
        mainContent.hidden = true;
        const confirmation = document.querySelector('[data-testid="confirmation"]');
        confirmation.hidden = false;
        document.querySelector('[data-testid="confirmation-title"]').focus();
      });

      document.querySelector('[data-testid="confirmation-new"]').addEventListener("click", function () {
        document.querySelector('[data-testid="confirmation"]').hidden = true;
        mainContent.hidden = false;
        resetConfiguration();
        heightInput.focus();
      });

      render();
    })();
  </script>
</body>
</html>
