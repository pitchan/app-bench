<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: var(--text-md);
  line-height: 24px;
}

h1, h2, p, dl, dd, dt { margin: 0; }

button, input { font: inherit; color: inherit; }

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Layout */

.shell {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: 16px;
  padding-right: 16px;
}

@media (min-width: 1024px) {
  .shell { padding-left: 24px; padding-right: 24px; }
}

.app-header .shell { padding-top: 24px; }

.app-header h1 {
  font-size: var(--text-xl);
  line-height: 32px;
  font-weight: 700;
}

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: 32px;
  align-items: start;
  padding-top: 24px;
  padding-bottom: 48px;
}

.configurator {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

@media (min-width: 1024px) {
  .main {
    grid-template-columns: minmax(0, 1fr) 360px;
    column-gap: 32px;
    row-gap: 0;
  }
  .summary { position: sticky; top: 24px; }
}

/* Panels and headings */

.panel {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 24px;
}

.step { margin: 0; }

.step > h2 {
  margin: 0 0 16px;
  font-size: var(--text-lg);
  font-weight: 600;
  line-height: 28px;
}

/* Rider */

.field-label {
  display: block;
  margin-bottom: 8px;
  font-size: var(--text-sm);
  font-weight: 600;
}

.text-input {
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background-color: var(--color-surface);
  color: var(--color-text);
  font-size: var(--text-md);
}

#height-input {
  display: block;
  width: 200px;
  max-width: 100%;
}

#height-input[aria-invalid="true"] { border-color: var(--color-danger); }

.field-error {
  margin-top: 8px;
  font-size: var(--text-sm);
  color: var(--color-danger);
}

.recommendation {
  margin-top: 8px;
  font-size: var(--text-sm);
  color: var(--color-muted);
}

.warning {
  margin-top: 12px;
  font-size: var(--text-sm);
}

/* Option cards */

.cards {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.cards-drivetrain { grid-template-columns: minmax(0, 1fr); }

@media (min-width: 1024px) {
  .cards-frame { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cards-drivetrain { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards-color { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.card {
  --bw: 1px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-width: 0;
  padding: 16px;
  border: var(--bw) solid var(--color-border);
  border-radius: var(--radius-card);
  background-color: var(--color-surface);
  cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}

.card:not(:has(input:checked)):not(:has(input:disabled)):hover {
  border-color: var(--color-muted);
}

.card:has(input:checked) {
  --bw: 2px;
  border-color: var(--color-accent);
}

.card:has(input:disabled) {
  opacity: 0.45;
  cursor: not-allowed;
}

.card:has(input:focus-visible) {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

.card input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.card-name {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--color-text);
}

.card-price {
  font-size: var(--text-sm);
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
}

.card-reason {
  min-height: 32px;
  font-size: 12px;
  line-height: 16px;
  color: var(--color-muted);
  visibility: hidden;
}

.card:has(input:disabled) .card-reason { visibility: visible; }

.check {
  position: absolute;
  top: 8px;
  right: 8px;
  font-weight: 700;
  color: var(--color-accent);
  visibility: hidden;
}

.card:has(input:checked) .check { visibility: visible; }

.badge {
  position: absolute;
  top: calc(var(--bw) * -1);
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: 20px;
  white-space: nowrap;
}

.swatch {
  display: block;
  width: 32px;
  height: 32px;
  border: 1px solid var(--color-border);
  border-radius: 50%;
}

/* Buttons */

button {
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}

.btn {
  height: 40px;
  padding: 0 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  background-color: transparent;
  color: var(--color-text);
  cursor: pointer;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-qty {
  width: 40px;
  padding: 0;
  font-size: var(--text-lg);
}

.btn-order {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: var(--radius-control);
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  font-size: var(--text-md);
  font-weight: 600;
  cursor: pointer;
}

.btn-order:disabled {
  background-color: var(--color-disabled-bg);
  color: var(--color-muted);
  cursor: not-allowed;
}

/* Quantity */

.qty {
  display: flex;
  align-items: center;
  gap: 12px;
}

.qty-value {
  min-width: 40px;
  text-align: center;
  font-size: var(--text-lg);
  font-variant-numeric: tabular-nums;
}

/* Summary */

.summary {
  display: flex;
  flex-direction: column;
}

.bike {
  display: block;
  width: 100%;
  height: 200px;
  margin-bottom: 16px;
  color: var(--color-text);
}

.wheel {
  fill: none;
  stroke: var(--color-text);
  stroke-width: 6;
}

.line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0;
}

.line [data-role="label"] {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.line [data-role="value"] {
  flex: 0 0 auto;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.line-discount [data-role="value"] { color: var(--color-accent); }

.line-total {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--color-border);
}

.line-total [data-role="label"],
.line-total [data-role="value"] {
  font-size: var(--text-xl);
  font-weight: 700;
}

.promo {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--color-border);
}

.promo-row {
  display: flex;
  gap: 8px;
}

.promo-row .text-input {
  flex: 1 1 auto;
  min-width: 0;
}

.promo-status {
  font-size: var(--text-sm);
  color: var(--color-muted);
}

.promo-status.is-active { color: var(--color-accent); }

.promo-error {
  font-size: var(--text-sm);
  color: var(--color-danger);
}

.promo-remove { align-self: flex-start; }

.order {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
}

.order-hint {
  font-size: var(--text-sm);
  color: var(--color-muted);
}

/* Notice */

.notice {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 10;
  transform: translateX(-50%);
  width: max-content;
  max-width: min(480px, calc(100vw - 32px));
  padding: 12px 16px;
  border: none;
  border-left: 4px solid var(--color-accent);
  border-radius: var(--radius-control);
  background-color: var(--color-surface);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
}

/* Confirmation */

.confirmation {
  width: min(560px, calc(100% - 32px));
  margin: 32px auto;
}

.confirmation h2 {
  margin-bottom: 16px;
  font-size: var(--text-xl);
  font-weight: 700;
  line-height: 32px;
}

.confirmation h2:focus { outline: none; }

.confirmation dl {
  display: grid;
  gap: 12px;
  margin-bottom: 24px;
}

.confirmation dt {
  font-size: var(--text-sm);
  color: var(--color-muted);
}

.confirmation dd {
  font-size: var(--text-lg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }
}
</style>
</head>
<body>

<header class="app-header" data-testid="app-header">
  <div class="shell">
    <h1>Claude Haiku 5.5</h1>
  </div>
</header>

<main class="shell main">
  <div class="configurator" data-testid="configurator">

    <section class="panel step" data-testid="section-rider" aria-labelledby="title-rider">
      <h2 id="title-rider">1. Rider</h2>
      <label class="field-label" for="height-input">Your height (cm)</label>
      <input class="text-input" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off">
      <p class="field-error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
      <p class="recommendation" data-testid="height-recommendation" hidden></p>
    </section>

    <section class="panel step" data-testid="section-frame" aria-labelledby="title-frame">
      <h2 id="title-frame">2. Frame</h2>
      <div class="cards cards-frame" id="cards-frame"></div>
      <p class="warning" data-testid="frame-warning" hidden></p>
    </section>

    <section class="panel step" data-testid="section-wheels" aria-labelledby="title-wheels">
      <h2 id="title-wheels">3. Wheels</h2>
      <div class="cards" id="cards-wheels"></div>
    </section>

    <section class="panel step" data-testid="section-drivetrain" aria-labelledby="title-drivetrain">
      <h2 id="title-drivetrain">4. Drivetrain</h2>
      <div class="cards cards-drivetrain" id="cards-drivetrain"></div>
    </section>

    <section class="panel step" data-testid="section-color" aria-labelledby="title-color">
      <h2 id="title-color">5. Color</h2>
      <div class="cards cards-color" id="cards-color"></div>
    </section>

    <section class="panel step" data-testid="section-accessories" aria-labelledby="title-accessories">
      <h2 id="title-accessories">6. Accessories</h2>
      <div class="cards" id="cards-accessories"></div>
    </section>

    <section class="panel step" data-testid="section-quantity" aria-labelledby="title-quantity">
      <h2 id="title-quantity">7. Quantity</h2>
      <div class="qty">
        <button class="btn btn-qty" type="button" data-testid="qty-decrease" aria-label="Decrease quantity">&minus;</button>
        <span class="qty-value" data-testid="qty-value">1</span>
        <button class="btn btn-qty" type="button" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>

  </div>

  <aside class="panel summary" data-testid="summary">
    <svg class="bike" data-testid="bike-preview" viewBox="0 0 400 240" role="img" aria-label="Bicycle preview">
      <circle class="wheel" data-part="wheel" cx="100" cy="150" r="70"></circle>
      <circle class="wheel" data-part="wheel" cx="300" cy="150" r="70"></circle>
      <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path data-part="frame" d="M100 150 L190 150"></path>
        <path data-part="frame" d="M190 150 L165 80"></path>
        <path data-part="frame" d="M165 80 L265 80"></path>
        <path data-part="frame" d="M190 150 L265 80"></path>
        <path data-part="frame" d="M265 80 L300 150"></path>
        <path data-part="frame" d="M165 80 L100 150"></path>
      </g>
      <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
        <path d="M265 80 L275 56"></path>
        <path d="M150 62 L178 62"></path>
      </g>
      <g id="extras"></g>
    </svg>

    <div class="lines">
      <div class="line" data-testid="summary-line-frame"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-wheels"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-drivetrain"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-color"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-accessory-mudguards" hidden><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-accessory-rack" hidden><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-accessory-lights" hidden><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-accessory-kickstand" hidden><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-unit"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-quantity"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-subtotal"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line line-discount" data-testid="summary-line-qty-discount" hidden><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line line-discount" data-testid="summary-line-promo" hidden><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-shipping"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line line-total" data-testid="summary-line-total"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-vat"><span data-role="label"></span><span data-role="value"></span></div>
      <div class="line" data-testid="summary-line-delivery"><span data-role="label"></span><span data-role="value"></span></div>
    </div>

    <div class="promo">
      <label class="field-label" for="promo-input">Promo code</label>
      <div class="promo-row">
        <input class="text-input" id="promo-input" data-testid="promo-input" type="text" autocomplete="off">
        <button class="btn" type="button" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <p class="field-error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
      <p class="promo-status" data-testid="promo-status" hidden></p>
      <button class="btn promo-remove" type="button" data-testid="promo-remove" hidden>Remove code</button>
    </div>

    <div class="order">
      <button class="btn-order" type="button" data-testid="order-button" disabled>Order 1 bike</button>
      <p class="order-hint" data-testid="order-hint">Enter your height to continue.</p>
    </div>
  </aside>
</main>

<div role="status">
  <div class="notice" data-testid="notice" hidden></div>
</div>

<section class="panel confirmation" data-testid="confirmation" aria-labelledby="confirmation-title" hidden>
  <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
  <dl>
    <div><dt>Reference</dt><dd data-testid="confirmation-reference"></dd></div>
    <div><dt>Total</dt><dd data-testid="confirmation-total"></dd></div>
    <div><dt>Estimated delivery</dt><dd data-testid="confirmation-delivery"></dd></div>
  </dl>
  <button class="btn" type="button" data-testid="confirmation-new">Configure another bike</button>
</section>

<script>
(function () {
  'use strict';

  // Catalog (02-catalog-and-rules, 2.2). Amounts are integer euro cents.

  const FRAMES = [
    { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000 },

  ];

  const PROMO_CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  const CLOSED_DATES = ['2026-12-24', '2026-12-25', '2026-12-31', '2027-01-01'];
  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAY_MS = 24 * 60 * 60 * 1000;

    { id: 'kickstand', part: 'kickstand', shapes: [{ d: 'M120 150 L92 204' }] }
  ];

  // Elements

  const $ = (testid) => document.querySelector('[data-testid="' + testid + '"]');

  const main = document.querySelector('main');
  const configurator = $('configurator');
  const summary = $('summary');
  const heightInput = $('height-input');
  const heightError = $('height-error');
  const heightRecommendation = $('height-recommendation');
  const frameWarning = $('frame-warning');
  const bike = $('bike-preview');
  const extras = document.getElementById('extras');
  const promoInput = $('promo-input');
  const promoApply = $('promo-apply');
  const promoError = $('promo-error');
  const promoStatus = $('promo-status');
  const promoRemove = $('promo-remove');
  const orderButton = $('order-button');
  const orderHint = $('order-hint');
  const qtyDecrease = $('qty-decrease');
  const qtyIncrease = $('qty-increase');
  const qtyValue = $('qty-value');
  const notice = $('notice');
  const confirmation = $('confirmation');
  const confirmationTitle = $('confirmation-title');
  const confirmationReference = $('confirmation-reference');
  const confirmationTotal = $('confirmation-total');
  const confirmationDelivery = $('confirmation-delivery');
  const confirmationNew = $('confirmation-new');

  // State

  let orderCount = 0;
  let state = createState();

  function createState() {
    return {
      autoFrame: true,
      frame: null,
      wheels: '275',
      drivetrain: 'essential',
      color: 'graphite',
      accessories: new Set(),
      qty: 1,
      promo: null,
      promoError: false,
      notice: null
    };
  }

  // Formats

  function amount(cents) {
    const euros = String(Math.floor(cents / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return '€' + euros + '.' + String(cents % 100).padStart(2, '0');
  }

  function signed(cents) {
    return cents === 0 ? 'Included' : '+' + amount(cents);
  }

  function discount(cents) {
    return MINUS + amount(cents);
  }

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  // Round half up of base × percent / 100, integer arithmetic only.
  function percent(base, p) {
    return Math.floor((base * p + 50) / 100);
  }

  // Height and frame recommendation (FR-FIT-02, FR-FIT-03)

  function parseHeight() {
    const text = heightInput.value.trim();
    if (!/^\d+$/.test(text)) return null;
    const value = Number(text);
    return value >= 150 && value <= 200 ? value : null;
  }

  function recommendedFrame(height) {
    return FRAMES.find((f) => height >= f.min && height <= f.max);
  }

  // Price (02-catalog-and-rules, 2.4)

  function calculate() {
    const frame = FRAMES.find((f) => f.id === state.frame) || null;
    const wheels = WHEELS.find((w) => w.id === state.wheels);
    const drivetrain = DRIVETRAINS.find((d) => d.id === state.drivetrain);
    const color = COLORS.find((c) => c.id === state.color);
    const colorSurcharge = state.drivetrain === 'pro' ? 0 : color.price;
    const accessoryTotal = ACCESSORIES
      .filter((a) => state.accessories.has(a.id))
      .reduce((sum, a) => sum + a.price, 0);

    const result = {
      frame,
      wheels,
      drivetrain,
      color,
      colorSurcharge,
      unit: null,
      subtotal: null,
      qtyDiscount: 0,
      promoDiscount: 0,
      springActive: false,
      welcomeActive: state.qty < 3,
      shipping: null,
      total: null,
      vat: null
    };

    if (frame) {
      const unit = frame.price + wheels.price + drivetrain.price + colorSurcharge + accessoryTotal;
      const subtotal = unit * state.qty;
      const qtyDiscount = state.qty >= 3 ? percent(subtotal, 5) : 0;
      const afterQty = subtotal - qtyDiscount;
      const springActive = afterQty >= 150000;
      let promoDiscount = 0;
      if (state.promo === 'SPRING10' && springActive) promoDiscount = percent(afterQty, 10);
      if (state.promo === 'WELCOME50' && result.welcomeActive) promoDiscount = 5000;
      const merchandise = afterQty - promoDiscount;
      const shipping = state.promo === 'FREESHIP' || merchandise >= 200000 ? 0 : 4900;
      const total = merchandise + shipping;
      Object.assign(result, {
        unit,
        subtotal,
        qtyDiscount,
        promoDiscount,
        springActive,
        shipping,
        total,
        vat: Math.floor((total * 20 + 60) / 120)
      });
    }

    return result;
  }

  // Delivery (02-catalog-and-rules, 2.5)

  function isBusinessDay(date) {
    const day = date.getUTCDay();
    if (day === 0 || day === 6) return false;
    return !CLOSED_DATES.includes(date.toISOString().slice(0, 10));
  }

  function deliveryDate() {
    const now = new Date();
    let time = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const drivetrain = DRIVETRAINS.find((d) => d.id === state.drivetrain);
    const lead = drivetrain.lead + (state.color === 'red' ? 3 : 0) + (state.qty >= 3 ? 2 : 0);
    let count = 0;
    while (count < lead) {
      time += DAY_MS;
      if (isBusinessDay(new Date(time))) count += 1;
    }
    return new Date(time);
  }

  function formatDate(date) {
    return WEEKDAYS[date.getUTCDay()] + ', ' + date.getUTCDate() + ' ' +
      MONTHS[date.getUTCMonth()] + ' ' + date.getUTCFullYear();
  }

  function todayStamp() {
    const now = new Date();
    return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate());
  }

  // Selection changes (FR-FIT-04, FR-FIT-05, FR-OPT-04, FR-OPT-07, FR-OPT-08)

  function selectFrame(id) {
    if (state.frame === id) return;
    state.frame = id;
    if (id === 'S' && state.wheels === '29') {
      state.wheels = '275';
      state.notice = MSG.wheelsReplaced;
    }
  }

  function chooseFrame(id) {
    state.autoFrame = false;
    if (state.frame !== id) {
      state.notice = null;
      selectFrame(id);
    }
    render();
  }

  function chooseOption(key, id) {
    if (state[key] === id) return;
    state.notice = null;
    state[key] = id;
    render();
  }

  function toggleAccessory(id, on) {
    const accessories = state.accessories;
    if (accessories.has(id) === on) return;
    state.notice = null;
    if (on) {
      accessories.add(id);
      if (id === 'rack' && !accessories.has('mudguards')) {
        accessories.add('mudguards');
        state.notice = MSG.mudguardsAdded;
      }
    } else if (id === 'mudguards' && accessories.has('rack')) {
      accessories.delete('rack');
      accessories.delete('mudguards');
      state.notice = MSG.rackRemoved;
    } else {
      accessories.delete(id);
    }
    render();
  }

  function changeQuantity(delta) {
    const next = Math.min(5, Math.max(1, state.qty + delta));
    if (next === state.qty) return;
    state.qty = next;
    state.notice = null;
    render();
  }

  // Promo code (FR-PRM-02, FR-PRM-03, FR-PRM-04)

  function applyPromo() {
    const code = promoInput.value.trim().toUpperCase();
    if (code === '') return;
    if (!PROMO_CODES.includes(code)) {
      state.promoError = true;
      render();
      return;
    }
    state.promo = code;
    state.promoError = false;
    promoInput.value = '';
    render();
  }

  // Order (FR-ORD-03, FR-ORD-04, FR-ORD-05)

  function placeOrder() {
    const c = calculate();
    if (parseHeight() === null || !c.frame) return;
    orderCount += 1;
    confirmationReference.textContent = 'BK-' + todayStamp() + '-' + String(orderCount).padStart(3, '0');
    confirmationTotal.textContent = amount(c.total);
    confirmationDelivery.textContent = formatDate(deliveryDate());
    state.notice = null;
    render();
    main.hidden = true;
    confirmation.hidden = false;
    confirmationTitle.focus();
  }

  function startNewConfiguration() {
    state = createState();
    heightInput.value = '';
    promoInput.value = '';
    confirmation.hidden = true;
    main.hidden = false;
    render();
    heightInput.focus();
  }

  // Rendering

  const cardRefs = {};

  function buildCard(container, group, option, type, groupName) {
    const label = document.createElement('label');
    label.className = 'card';
    label.dataset.testid = 'card-' + group + '-' + option.id;

    const input = document.createElement('input');
    input.type = type;
    input.name = groupName;
    input.value = option.id;
    input.setAttribute('aria-label', option.name);
    input.disabled = Boolean(option.outOfStock);
    label.append(input);

    const refs = { input, price: null, badge: null };

    if (group === 'frame') {
      refs.badge = make('span', 'badge', 'Recommended', 'badge');
      label.append(refs.badge);
    }
    if (option.hex) {
      const swatch = make('span', 'swatch', '', 'swatch');
      swatch.style.backgroundColor = option.hex;
      label.append(swatch);
    }
    label.append(make('span', 'card-name', option.name, 'name'));
    refs.price = make('span', 'card-price', '', 'price');
    label.append(refs.price);
    if (option.reason) {
      label.append(make('span', 'card-reason', option.reason, 'reason'));
    }
    const check = make('span', 'check', CHECK, 'check');
    check.setAttribute('aria-hidden', 'true');
    label.append(check);

    container.append(label);
    cardRefs[group + '-' + option.id] = refs;
    return refs;
  }

  function make(tag, className, text, role) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    if (role) node.dataset.role = role;
    return node;
  }

  function buildCards() {
    FRAMES.forEach((f) => {
      const refs = buildCard(document.getElementById('cards-frame'), 'frame', f, 'radio', 'frame');
      refs.input.addEventListener('click', () => chooseFrame(f.id));
      refs.input.addEventListener('change', () => chooseFrame(f.id));
    });

    WHEELS.forEach((w) => {
      const refs = buildCard(document.getElementById('cards-wheels'), 'wheels', w, 'radio', 'wheels');
      refs.input.addEventListener('change', () => chooseOption('wheels', w.id));
    });

    DRIVETRAINS.forEach((d) => {
      const refs = buildCard(document.getElementById('cards-drivetrain'), 'drivetrain', d, 'radio', 'drivetrain');
      refs.input.addEventListener('change', () => chooseOption('drivetrain', d.id));
    });

    COLORS.forEach((c) => {
      const refs = buildCard(document.getElementById('cards-color'), 'color', c, 'radio', 'color');
      refs.input.addEventListener('change', () => chooseOption('color', c.id));
    });

    ACCESSORIES.forEach((a) => {
      const refs = buildCard(document.getElementById('cards-accessories'), 'accessory', a, 'checkbox', 'accessories');
      refs.input.addEventListener('change', () => toggleAccessory(a.id, refs.input.checked));
    });
  }

  function svgNode(tag, attributes) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, String(value)));
    return node;
  }

  function drawBike(c) {
    bike.querySelectorAll('[data-part="frame"]').forEach((node) => {
      node.setAttribute('stroke', c.color.hex);
    });
    bike.querySelectorAll('[data-part="wheel"]').forEach((node) => {
      node.setAttribute('r', String(c.wheels.radius));
    });

    const nodes = [];
    ACCESSORY_SHAPES.forEach((item) => {
      if (!state.accessories.has(item.id)) return;
      item.shapes.forEach((shape) => {
        if (shape.d) {
          nodes.push(svgNode('path', {
            'data-part': item.part,
            d: shape.d,
            fill: 'none',
            stroke: 'currentColor',
            'stroke-width': 4,
            'stroke-linecap': 'round'
          }));
        } else {
          nodes.push(svgNode('circle', {
            'data-part': item.part,
            cx: shape.cx,
            cy: shape.cy,
            r: shape.r,
            fill: '#F5C400'
          }));
        }
      });
    });
    extras.replaceChildren(...nodes);
  }

  function setLine(key, label, value, visible) {
    const line = $('summary-line-' + key);
    line.hidden = !visible;
    line.querySelector('[data-role="label"]').textContent = label;
    line.querySelector('[data-role="value"]').textContent = value;
  }

  function renderSummary(c) {
    const priced = c.frame !== null;
    const promoVisible = priced && state.promo !== null && c.promoDiscount > 0;

    setLine('frame', priced ? c.frame.name : 'Frame', priced ? amount(c.frame.price) : DASH, true);
    setLine('wheels', c.wheels.name, signed(c.wheels.price), true);
    setLine('drivetrain', c.drivetrain.name, signed(c.drivetrain.price), true);
    setLine('color', c.color.name, signed(c.colorSurcharge), true);
    ACCESSORIES.forEach((a) => {
      setLine('accessory-' + a.id, a.name, signed(a.price), state.accessories.has(a.id));
    });
    setLine('unit', 'Unit price', priced ? amount(c.unit) : DASH, true);
    setLine('quantity', 'Quantity', TIMES + ' ' + state.qty, true);
    setLine('subtotal', 'Subtotal', priced ? amount(c.subtotal) : DASH, true);
    setLine('qty-discount', 'Quantity discount (5%)', discount(c.qtyDiscount), priced && state.qty >= 3);
    setLine('promo', 'Code ' + (state.promo || ''), discount(c.promoDiscount), promoVisible);
    setLine('shipping', 'Shipping', priced ? (c.shipping === 0 ? 'Free' : amount(c.shipping)) : DASH, true);
    setLine('total', 'Total', priced ? amount(c.total) : DASH, true);
    setLine('vat', 'Including VAT (20%)', priced ? amount(c.vat) : DASH, true);
    setLine('delivery', 'Estimated delivery', formatDate(deliveryDate()), true);
  }

  function renderPromo(c) {
    const applied = state.promo;
    promoError.hidden = !state.promoError;
    promoInput.setAttribute('aria-invalid', String(state.promoError));
    if (state.promoError) {
      promoInput.setAttribute('aria-describedby', 'promo-error');
    } else {
      promoInput.removeAttribute('aria-describedby');
    }
    promoApply.disabled = promoInput.value.trim() === '';

    promoStatus.hidden = applied === null;
    promoRemove.hidden = applied === null;
    if (applied !== null) {
      const active = applied === 'SPRING10' ? c.springActive
        : applied === 'WELCOME50' ? c.welcomeActive
          : true;
      let text = 'Code ' + applied + ' applied.';
      if (!active) text = applied === 'SPRING10' ? MSG.spring : MSG.welcome;
      promoStatus.textContent = text;
      promoStatus.classList.toggle('is-active', active);
    }
  }

  function render() {
    const height = parseHeight();
    const valid = height !== null;
    const recommended = valid ? recommendedFrame(height) : null;
    const typed = heightInput.value.trim() !== '';
    const heightInvalid = typed && !valid;
    const c = calculate();

    // Rider and frame
    heightError.hidden = !heightInvalid;
    heightInput.setAttribute('aria-invalid', String(heightInvalid));
    if (heightInvalid) {
      heightInput.setAttribute('aria-describedby', 'height-error');
    } else {
      heightInput.removeAttribute('aria-describedby');
    }
    heightRecommendation.hidden = !valid;
    if (valid) heightRecommendation.textContent = 'Recommended frame: ' + recommended.id;

    const gap = c.frame && recommended ? FRAMES.indexOf(c.frame) - FRAMES.indexOf(recommended) : 0;
    frameWarning.hidden = !(valid && Math.abs(gap) >= 2);
    if (!frameWarning.hidden) {
      frameWarning.textContent = 'Frame ' + c.frame.id + ' is ' + Math.abs(gap) + ' sizes ' +
        (gap > 0 ? 'larger' : 'smaller') + ' than recommended.';
    }

    // Option cards
    FRAMES.forEach((f) => {
      const refs = cardRefs['frame-' + f.id];
      refs.input.checked = state.frame === f.id;
      refs.badge.hidden = !(recommended && recommended.id === f.id);
      refs.price.textContent = amount(f.price);
    });

    WHEELS.forEach((w) => {
      const refs = cardRefs['wheels-' + w.id];
      refs.input.checked = state.wheels === w.id;
      refs.input.disabled = w.id === '29' && state.frame === 'S';
      refs.price.textContent = signed(w.price);
    });

    DRIVETRAINS.forEach((d) => {
      const refs = cardRefs['drivetrain-' + d.id];
      refs.input.checked = state.drivetrain === d.id;
      refs.price.textContent = signed(d.price);
    });

    COLORS.forEach((col) => {
      const refs = cardRefs['color-' + col.id];
      refs.input.checked = state.color === col.id;
      refs.price.textContent = col.id === 'red' && state.drivetrain === 'pro'
        ? 'Included with Pro'
        : signed(col.price);
    });

    ACCESSORIES.forEach((a) => {
      const refs = cardRefs['accessory-' + a.id];
      refs.input.checked = state.accessories.has(a.id);
      refs.price.textContent = signed(a.price);
    });

    // Quantity
    qtyValue.textContent = String(state.qty);
    qtyDecrease.disabled = state.qty === 1;
    qtyIncrease.disabled = state.qty === 5;

    // Summary, preview, promo, order
    renderSummary(c);
    drawBike(c);
    renderPromo(c);

    orderButton.textContent = state.qty === 1 ? 'Order 1 bike' : 'Order ' + state.qty + ' bikes';
    orderButton.disabled = !(valid && c.frame !== null);
    orderHint.hidden = valid;

    // Notice (NFR-A11Y-02: the status wrapper is never hidden)
    notice.hidden = !state.notice;
    notice.textContent = state.notice || '';
  }

  // Events

  heightInput.addEventListener('input', () => {
    state.notice = null;
    const height = parseHeight();
    if (height !== null && state.autoFrame) selectFrame(recommendedFrame(height).id);
    render();
  });

  promoInput.addEventListener('input', () => {
    state.promoError = false;
    render();
  });

  promoInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !promoApply.disabled) {
      event.preventDefault();
      applyPromo();
    }
  });

  promoApply.addEventListener('click', applyPromo);

  promoRemove.addEventListener('click', () => {
    state.promo = null;
    render();
  });

  qtyDecrease.addEventListener('click', () => changeQuantity(-1));
  qtyIncrease.addEventListener('click', () => changeQuantity(1));

  orderButton.addEventListener('click', placeOrder);
  confirmationNew.addEventListener('click', startNewConfiguration);

  // Start

  buildCards();
  render();
})();
</script>
</body>
</html>
