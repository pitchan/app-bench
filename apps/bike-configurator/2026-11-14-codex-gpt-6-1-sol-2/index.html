<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-6</title>
<style>
:root{--color-bg:#F6F4F0;--color-surface:#FFFFFF;--color-text:#1B1A18;--color-muted:#67625B;--color-border:#DCD6CC;--color-accent:#0E6B58;--color-accent-contrast:#FFFFFF;--color-danger:#B42318;--color-disabled-bg:#ECE8E1;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--radius-control:8px;--radius-card:12px;--radius-pill:999px;--text-sm:14px;--text-md:16px;--text-lg:20px;--text-xl:28px;--duration-fast:150ms}
@media(prefers-color-scheme:dark){:root{--color-bg:#121110;--color-surface:#1D1B19;--color-text:#F3F0EA;--color-muted:#A59F96;--color-border:#38342F;--color-accent:#3BC4A5;--color-accent-contrast:#0B0A09;--color-danger:#F97066;--color-disabled-bg:#2A2724}}
*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font:16px/24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} [hidden]{display:none!important}header{max-width:1200px;margin:auto;padding:32px 24px 24px}h1{margin:0;font-size:28px;line-height:36px;font-weight:700;letter-spacing:-1px}main{max-width:1200px;margin:auto;padding:0 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}#configurator{display:grid;gap:16px;min-width:0}section,aside{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:24px}h2{font-size:20px;font-weight:600;margin:0 0 20px;line-height:28px}aside{position:sticky;top:24px;min-width:0}.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.grid.frame,.grid.color{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.drivetrain{grid-template-columns:repeat(3,minmax(0,1fr))}.card{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;height:130px;padding:16px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);cursor:pointer;transition:border-color var(--duration-fast),background-color var(--duration-fast),color var(--duration-fast)}.card.selected{border:2px solid var(--color-accent);padding:15px}.card.disabled{opacity:.45;cursor:not-allowed}.card:not(.selected):not(.disabled):hover{border-color:var(--color-muted)}.card input{position:absolute;width:1px;height:1px;opacity:0;margin:0;pointer-events:none}.card:has(input:focus-visible),button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}[data-role=name]{font-size:16px;font-weight:600;color:var(--color-text);line-height:22px}[data-role=price]{font-size:14px;color:var(--color-muted);font-variant-numeric:tabular-nums;line-height:20px;margin-top:4px}[data-role=check]{position:absolute;right:7px;top:4px;font-size:14px;color:var(--color-accent)}[data-role=reason]{font-size:12px;line-height:15px;color:var(--color-muted);margin-top:4px}[data-role=badge]{position:absolute;left:50%;top:-1px;transform:translate(-50%,-50%);background:var(--color-accent);color:var(--color-accent-contrast);border-radius:var(--radius-pill);font-size:14px;font-weight:600;padding:2px 8px;white-space:nowrap;line-height:20px}.selected [data-role=badge]{top:-2px}[data-role=swatch]{width:32px;height:32px;border-radius:50%;border:1px solid var(--color-border);margin-bottom:8px;flex-shrink:0}.color .card{height:154px}label.field-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input[type=text]{height:40px;max-width:100%;min-width:0;border:1px solid var(--color-border);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-text);font:inherit;padding:8px 12px}input[type=text]:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}#height-input{width:200px}#height-input[aria-invalid=true]{border-color:var(--color-danger)}p{margin:8px 0 0}.error{color:var(--color-danger);font-size:14px}.muted{color:var(--color-muted);font-size:14px}.recommendation{color:var(--color-accent);font-size:14px}.stepper{display:flex;gap:20px;align-items:center}#qty-value{font-variant-numeric:tabular-nums;font-weight:600}button{font:inherit;cursor:pointer;height:40px;padding:0 14px;background:transparent;border:1px solid var(--color-border);color:var(--color-text);border-radius:var(--radius-control);transition:border-color var(--duration-fast),background-color var(--duration-fast),color var(--duration-fast)}button:disabled{opacity:.45;cursor:not-allowed}#qty-decrease,#qty-increase{width:40px;padding:0;font-size:20px}#bike-preview{display:block;width:100%;height:200px;margin-bottom:16px}.summary-line{display:flex;align-items:baseline;gap:10px;white-space:nowrap;font-size:14px;line-height:24px;margin:3px 0}.summary-line [data-role=label]{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.summary-line [data-role=value]{flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums}.summary-line[data-testid=summary-line-unit]{border-top:1px solid var(--color-border);padding-top:12px;margin-top:12px}.summary-line[data-testid=summary-line-total]{border-top:1px solid var(--color-border);padding-top:16px;margin-top:12px;font-size:28px;font-weight:700;line-height:34px}.summary-line[data-testid=summary-line-qty-discount] [data-role=value],.summary-line[data-testid=summary-line-promo] [data-role=value]{color:var(--color-accent)}.summary-line[data-testid=summary-line-delivery]{margin-top:16px;font-size:12px;gap:8px}#promo-block{margin-top:24px;padding-top:20px;border-top:1px solid var(--color-border)}.promo-entry{display:flex;gap:8px}.promo-entry input{flex:1;width:0}#promo-status{font-size:14px}#promo-remove{margin-top:8px}#order-button{margin-top:24px;width:100%;height:48px;border:0;font-size:16px;font-weight:600;background:var(--color-accent);color:var(--color-accent-contrast)}#order-button:disabled{opacity:1;background:var(--color-disabled-bg);color:var(--color-muted);cursor:not-allowed}#order-hint{text-align:center}#notice{position:fixed;z-index:10;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(480px,calc(100% - 32px));background:var(--color-surface);border-left:4px solid var(--color-accent);padding:12px 16px;border-radius:var(--radius-control);box-shadow:0 6px 30px #00000018}#confirmation{max-width:650px;margin:0 auto 48px}#confirmation-title{outline:none}#confirmation-new{margin-top:24px}#confirmation-total{font-size:28px;font-weight:700;margin-top:24px}
@media(max-width:1023px){header{padding-left:16px;padding-right:16px}main{padding-left:16px;padding-right:16px;grid-template-columns:minmax(0,1fr)}aside{position:static}.grid.frame,.grid.color{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.drivetrain{grid-template-columns:minmax(0,1fr)}.drivetrain .card{height:100px}#confirmation{margin-left:16px;margin-right:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}}
</style>
</head>
<body>
<header data-testid="app-header"><h1>GPT-6</h1></header>
<main id="main">
<div id="configurator" data-testid="configurator">
<section data-testid="section-rider"><h2>1. Rider</h2><label class="field-label" for="height-input">Your height (cm)</label><input id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off"><p id="height-error" data-testid="height-error" class="error" hidden>Enter a height between 150 and 200 cm.</p><p id="height-recommendation" data-testid="height-recommendation" class="recommendation" hidden></p></section>
<section data-testid="section-frame"><h2>2. Frame</h2><div class="grid frame" id="frame-grid"></div><p data-testid="frame-warning" id="frame-warning" class="muted" hidden></p></section>
<section data-testid="section-wheels"><h2>3. Wheels</h2><div class="grid" id="wheels-grid"></div></section>
<section data-testid="section-drivetrain"><h2>4. Drivetrain</h2><div class="grid drivetrain" id="drivetrain-grid"></div></section>
<section data-testid="section-color"><h2>5. Color</h2><div class="grid color" id="color-grid"></div></section>
<section data-testid="section-accessories"><h2>6. Accessories</h2><div class="grid" id="accessory-grid"></div></section>
<section data-testid="section-quantity"><h2>7. Quantity</h2><div class="stepper"><button id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">−</button><span id="qty-value" data-testid="qty-value">1</span><button id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button></div></section>
</div>
<aside data-testid="summary" id="summary"><svg id="bike-preview" data-testid="bike-preview" viewBox="0 0 440 270" role="img" aria-label="Your configured bicycle"></svg><div id="summary-lines"></div><div id="promo-block"><label class="field-label" for="promo-input">Promo code</label><div class="promo-entry"><input id="promo-input" data-testid="promo-input" type="text" autocomplete="off"><button id="promo-apply" data-testid="promo-apply">Apply</button></div><p id="promo-error" data-testid="promo-error" class="error" hidden>This code is not valid.</p><p id="promo-status" data-testid="promo-status" hidden></p><button id="promo-remove" data-testid="promo-remove" hidden>Remove code</button></div><button id="order-button" data-testid="order-button" disabled>Order 1 bike</button><p id="order-hint" data-testid="order-hint" class="muted">Enter your height to continue.</p></aside>
</main>
<div role="status"><div id="notice" data-testid="notice" hidden></div></div>
<section id="confirmation" data-testid="confirmation" hidden><h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2><p id="confirmation-reference" data-testid="confirmation-reference"></p><p id="confirmation-total" data-testid="confirmation-total"></p><p id="confirmation-delivery" data-testid="confirmation-delivery"></p><button id="confirmation-new" data-testid="confirmation-new">Configure another bike</button></section>
<script>
'use strict';
const $=id=>document.getElementById(id);
const catalog={frame:[['S','Frame S',119000],['M','Frame M',119000],['L','Frame L',124000],['XL','Frame XL',129000]],wheels:[['275','27.5" wheels',0],['29','29" wheels',12000]],drivetrain:[['essential','Essential 1×10',0],['sport','Sport 1×12',24000],['pro','Pro Electronic 2×12',69000]],color:[['graphite','Graphite',0,'#3A3A3C'],['sand','Sand',0,'#D8C7A6'],['red','Racing Red',6000,'#C8102E'],['glacier','Glacier',0,'#A9D6E5']],accessory:[['mudguards','Mudguards',4500],['rack','Rear rack',6900],['lights','Lights',3990],['kickstand','Kickstand',2450]]};
const amount=n=>{const x=BigInt(n);return '€'+(x/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+(x%100n).toString().padStart(2,'0')};
const signed=n=>n?'+'+amount(n):'Included';
const roundRatio=(n,m,d)=>(n*m+d/2n)/d;
let state,orders=0,latest;
const initial=()=>({frame:null,wheels:'275',drivetrain:'essential',color:'graphite',accessory:new Set(),quantity:1,code:null,auto:true});
const option=(g,id)=>catalog[g].find(x=>x[0]===id);
const cost=(g,id)=>g==='color'&&id==='red'&&state.drivetrain==='pro'?0:option(g,id)[2];
function fit(){const v=$('height-input').value.trim();const valid=/^\d+$/.test(v)&&Number(v)>=150&&Number(v)<=200;return {valid,error:v!==''&&!valid,recommended:valid?(Number(v)<165?'S':Number(v)<175?'M':Number(v)<185?'L':'XL'):null}}
function notice(message){$('notice').textContent=message||'';$('notice').hidden=!message}
function cascadeFrame(){if(state.frame==='S'&&state.wheels==='29'){state.wheels='275';notice('29" wheels were replaced by 27.5" wheels: not available with frame S.')}}
for(const [group,options] of Object.entries(catalog))for(const [id,name,price,hex] of options){const card=document.createElement('label');card.className='card';card.dataset.testid=`card-${group}-${id}`;card.innerHTML=`<input type="${group==='accessory'?'checkbox':'radio'}" name="${group}" aria-label=""><span data-role="check" hidden aria-hidden="true">✓</span>${group==='frame'?'<span data-role="badge" hidden>Recommended</span>':''}${hex?'<span data-role="swatch" aria-hidden="true"></span>':''}<span data-role="name"></span><span data-role="price"></span><span data-role="reason" hidden></span>`;const input=card.querySelector('input');input.setAttribute('aria-label',name);input.value=id;card.querySelector('[data-role=name]').textContent=name;if(hex)card.querySelector('[data-role=swatch]').style.backgroundColor=hex;
input.addEventListener('click',()=>{if(group==='frame')state.auto=false});input.addEventListener('keydown',e=>{if(group==='frame'&&e.key===' ')state.auto=false});card.addEventListener('click',()=>{if(group==='frame')state.auto=false});
input.addEventListener('change',()=>{if(input.disabled)return;notice('');if(group==='frame')state.auto=false;if(group==='accessory'){if(input.checked)state.accessory.add(id);else state.accessory.delete(id);if(id==='rack'&&input.checked&&!state.accessory.has('mudguards')){state.accessory.add('mudguards');notice('Mudguards were added: required by the rear rack.')}if(id==='mudguards'&&!input.checked&&state.accessory.has('rack')){state.accessory.delete('rack');notice('Rear rack was removed: it requires mudguards.')}}else{state[group]=id;if(group==='frame')cascadeFrame()}render()});$(''+group+'-grid').append(card)}
function calculate(){let unit=state.frame?BigInt(cost('frame',state.frame)+cost('wheels',state.wheels)+cost('drivetrain',state.drivetrain)+cost('color',state.color)+[...state.accessory].reduce((s,id)=>s+cost('accessory',id),0)):0n;const subtotal=unit*BigInt(state.quantity),qd=state.quantity>=3?roundRatio(subtotal,5n,100n):0n,after=subtotal-qd;const active=state.code==='SPRING10'?!!state.frame&&after>=150000n:state.code==='WELCOME50'?state.quantity<3:state.code==='FREESHIP';const promo=active?(state.code==='SPRING10'?roundRatio(after,10n,100n):state.code==='WELCOME50'?5000n:0n):0n;const merch=after-promo,shipping=state.code==='FREESHIP'||merch>=200000n?0n:4900n,total=merch+shipping;return {unit,subtotal,qd,promo,shipping,total,vat:roundRatio(total,20n,120n),active}}
const localKey=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
function delivery(){let count={essential:5,sport:7,pro:12}[state.drivetrain]+(state.color==='red'?3:0)+(state.quantity>=3?2:0);const d=new Date();d.setHours(12,0,0,0);const closed=['20261224','20261225','20261231','20270101'];while(count){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6&&!closed.includes(localKey(d)))count--}return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear()}
function errorField(id,error){$(id).setAttribute('aria-invalid',String(error));if(error)$(id).setAttribute('aria-describedby',id==='height-input'?'height-error':'promo-error');else $(id).removeAttribute('aria-describedby')}
function render(){const f=fit(),p=calculate();latest={...p,delivery:delivery()};$('height-error').hidden=!f.error;errorField('height-input',f.error);$('height-recommendation').hidden=!f.valid;$('height-recommendation').textContent=f.valid?'Recommended frame: '+f.recommended:'';const gap=state.frame&&f.valid?catalog.frame.findIndex(x=>x[0]===state.frame)-catalog.frame.findIndex(x=>x[0]===f.recommended):0;$('frame-warning').hidden=Math.abs(gap)<2;$('frame-warning').textContent=Math.abs(gap)>=2?`Frame ${state.frame} is ${Math.abs(gap)} sizes ${gap>0?'larger':'smaller'} than recommended.`:'';
for(const [g,opts] of Object.entries(catalog))for(const [id] of opts){const card=document.querySelector(`[data-testid="card-${g}-${id}"]`),selected=g==='accessory'?state.accessory.has(id):state[g]===id,disabled=(g==='color'&&id==='glacier')||(g==='wheels'&&id==='29'&&state.frame==='S');card.classList.toggle('selected',selected);card.classList.toggle('disabled',disabled);card.querySelector('input').checked=selected;card.querySelector('input').disabled=disabled;card.querySelector('[data-role=check]').hidden=!selected;card.querySelector('[data-role=reason]').hidden=!disabled;card.querySelector('[data-role=reason]').textContent=disabled?(g==='color'?'Out of stock':'Not available with frame S'):'';card.querySelector('[data-role=price]').textContent=g==='frame'?amount(cost(g,id)):g==='color'&&id==='red'&&state.drivetrain==='pro'?'Included with Pro':signed(cost(g,id));if(g==='frame')card.querySelector('[data-role=badge]').hidden=!(f.valid&&f.recommended===id)}
$('qty-value').textContent=state.quantity;$('qty-decrease').disabled=state.quantity===1;$('qty-increase').disabled=state.quantity===5;
const rows=[];const row=(key,label,value,show=true)=>rows.push({key,label,value,show});row('frame',state.frame?'Frame '+state.frame:'Frame',state.frame?amount(cost('frame',state.frame)):'—');for(const g of ['wheels','drivetrain','color'])row(g,option(g,state[g])[1],signed(cost(g,state[g])));for(const [id,name,price] of catalog.accessory)row('accessory-'+id,name,signed(price),state.accessory.has(id));row('unit','Unit price',state.frame?amount(p.unit):'—');row('quantity','Quantity','× '+state.quantity);row('subtotal','Subtotal',state.frame?amount(p.subtotal):'—');row('qty-discount','Quantity discount (5%)','−'+amount(p.qd),!!state.frame&&state.quantity>=3);row('promo','Code '+state.code,'−'+amount(p.promo),!!state.frame&&p.promo>0n);row('shipping','Shipping',state.frame?(p.shipping===0n?'Free':amount(p.shipping)):'—');row('total','Total',state.frame?amount(p.total):'—');row('vat','Including VAT (20%)',state.frame?amount(p.vat):'—');row('delivery','Estimated delivery',latest.delivery);$('summary-lines').replaceChildren(...rows.map(r=>{const div=document.createElement('div');div.className='summary-line';div.dataset.testid='summary-line-'+r.key;div.hidden=!r.show;const a=document.createElement('span'),b=document.createElement('span');a.dataset.role='label';a.textContent=r.label;b.dataset.role='value';b.textContent=r.value;div.append(a,b);return div}));
$('promo-apply').disabled=!$('promo-input').value.trim();$('promo-status').hidden=!state.code;$('promo-remove').hidden=!state.code;$('promo-status').textContent=state.code?(p.active?`Code ${state.code} applied.`:state.code==='SPRING10'?'SPRING10 requires €1,500.00 or more after the quantity discount.':'WELCOME50 cannot be combined with the quantity discount.'):'';$('promo-status').style.color=p.active?'var(--color-accent)':'var(--color-muted)';$('order-button').textContent=`Order ${state.quantity} ${state.quantity===1?'bike':'bikes'}`;$('order-button').disabled=!f.valid||!state.frame;$('order-hint').hidden=f.valid;preview()}
function preview(){const r=state.wheels==='29'?76:70,paint=option('color',state.color)[3];$('bike-preview').innerHTML=`<g fill="none" stroke="var(--color-text)" stroke-width="6"><circle data-part="wheel" cx="105" cy="176" r="${r}"/><circle data-part="wheel" cx="335" cy="176" r="${r}"/></g><g fill="none" stroke="var(--color-border)" stroke-width="1.5"><path d="M35 176h140m-70-70v140m160-70h140m-70-70v140"/></g><g fill="none" stroke="${paint}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path data-part="frame" d="M105 176L167 83L218 176Z M167 83L300 83L218 176 M284 55L335 176"/></g><g fill="none" stroke="var(--color-text)" stroke-width="6" stroke-linecap="round"><path d="M167 83l-9-27m-22 0h42M284 55l-7-23h34l9 10M218 176l19 21h16"/><circle cx="218" cy="176" r="15" stroke-width="3"/></g>${state.accessory.has('mudguards')?'<g fill="none" stroke="var(--color-muted)" stroke-width="5"><path data-part="mudguard" d="M27 161a80 80 0 0 1 156-7"/><path data-part="mudguard" d="M257 157a80 80 0 0 1 155 4"/></g>':''}${state.accessory.has('rack')?'<path data-part="rack" d="M45 82h99m-88 0l-8 61m80-61l-23 94" fill="none" stroke="var(--color-text)" stroke-width="4"/>':''}${state.accessory.has('lights')?'<rect data-part="light" x="303" y="56" width="16" height="11" rx="3" fill="#E9BD54"/>':''}${state.accessory.has('kickstand')?'<path data-part="kickstand" d="M212 181l-19 67" stroke="var(--color-text)" stroke-width="5"/>':''}`}
$('height-input').addEventListener('input',()=>{notice('');const f=fit();if(f.valid&&state.auto){state.frame=f.recommended;cascadeFrame()}render()});
for(const [id,delta] of [['qty-decrease',-1],['qty-increase',1]])$(id).addEventListener('click',()=>{const q=state.quantity+delta;if(q<1||q>5)return;notice('');state.quantity=q;render()});
$('promo-input').addEventListener('input',()=>{$('promo-error').hidden=true;errorField('promo-input',false);$('promo-apply').disabled=!$('promo-input').value.trim()});
function apply(){if(!$('promo-input').value.trim())return;const code=$('promo-input').value.trim().toUpperCase();const valid=['SPRING10','WELCOME50','FREESHIP'].includes(code);$('promo-error').hidden=valid;errorField('promo-input',!valid);if(valid){state.code=code;$('promo-input').value=''}render()}
$('promo-apply').addEventListener('click',apply);$('promo-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();apply()}});$('promo-remove').addEventListener('click',()=>{state.code=null;render()});
$('order-button').addEventListener('click',()=>{if($('order-button').disabled)return;orders++;$('confirmation-reference').textContent='BK-'+localKey(new Date())+'-'+String(orders).padStart(3,'0');$('confirmation-total').textContent=amount(latest.total);$('confirmation-delivery').textContent=latest.delivery;$('main').hidden=true;notice('');$('confirmation').hidden=false;$('confirmation-title').focus()});
function reset(){state=initial();$('height-input').value='';$('promo-input').value='';$('promo-error').hidden=true;errorField('promo-input',false);notice('');$('confirmation').hidden=true;$('main').hidden=false;render()}
$('confirmation-new').addEventListener('click',()=>{reset();$('height-input').focus()});reset();
</script>
</body>
</html>
