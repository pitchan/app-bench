<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GPT-6</title>
<style>
:root{--color-bg:#F6F4F0;--color-surface:#FFFFFF;--color-text:#1B1A18;--color-muted:#67625B;--color-border:#DCD6CC;--color-accent:#0E6B58;--color-accent-contrast:#FFFFFF;--color-danger:#B42318;--color-disabled-bg:#ECE8E1;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--radius-control:8px;--radius-card:12px;--radius-pill:999px;--text-sm:14px;--text-md:16px;--text-lg:20px;--text-xl:28px;--duration-fast:150ms}
@media(prefers-color-scheme:dark){:root{--color-bg:#121110;--color-surface:#1D1B19;--color-text:#F3F0EA;--color-muted:#A59F96;--color-border:#38342F;--color-accent:#3BC4A5;--color-accent-contrast:#0B0A09;--color-danger:#F97066;--color-disabled-bg:#2A2724;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font:16px/24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}[hidden]{display:none!important}header{max-width:1200px;margin:auto;padding:32px 24px 24px}h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-1px}main{max-width:1200px;margin:auto;padding:0 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}#configurator{display:grid;gap:16px}section,aside{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:24px;min-width:0}h2{font-size:20px;font-weight:600;margin:0 0 24px}aside{position:sticky;top:24px}.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.grid.frame,.grid.color{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.drivetrain{grid-template-columns:repeat(3,minmax(0,1fr))}.card{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;height:128px;padding:16px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);cursor:pointer;transition:border-color var(--duration-fast),background-color var(--duration-fast),color var(--duration-fast)}.color .card{height:172px}.wheels .card{height:156px}.card input{position:absolute;width:1px;height:1px;opacity:0;margin:0}.card [data-role=name]{font-size:16px;font-weight:600;color:var(--color-text)}.card [data-role=price]{font-size:14px;color:var(--color-muted);font-variant-numeric:tabular-nums}.card [data-role=check]{position:absolute;right:7px;top:3px;color:var(--color-accent);font-weight:700}.card [data-role=reason]{font-size:14px;line-height:19px;color:var(--color-muted);margin-top:4px}.card [data-role=badge]{position:absolute;left:50%;top:-1px;transform:translate(-50%,-50%);background:var(--color-accent);color:var(--color-accent-contrast);border-radius:var(--radius-pill);font-size:14px;font-weight:600;padding:2px 8px;white-space:nowrap}.card [data-role=swatch]{width:32px;height:32px;flex-shrink:0;border:1px solid var(--color-border);border-radius:50%;margin-bottom:8px}.card:not(.selected):not(.disabled):hover{border-color:var(--color-muted)}.card.selected{border:2px solid var(--color-accent);padding:15px}.card.disabled{opacity:.45;cursor:not-allowed}.card:has(input:focus-visible),button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}button{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--color-border);color:var(--color-text);height:40px;border-radius:var(--radius-control);padding:0 14px;transition:border-color var(--duration-fast),background-color var(--duration-fast),color var(--duration-fast)}button:disabled{opacity:.45;cursor:not-allowed}input[type=text]{font:inherit;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;height:44px;padding:8px 12px;min-width:0;width:100%}input[type=text]:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}input[aria-invalid=true]{border-color:var(--color-danger)}.field-label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}#height-input{max-width:240px}.message{margin:8px 0 0;font-size:14px}.error{color:var(--color-danger)}#height-recommendation{color:var(--color-accent)}#frame-warning{color:var(--color-muted)}.stepper{display:flex;align-items:center;gap:24px}.stepper button{width:40px;padding:0}.stepper output{font-weight:600;font-variant-numeric:tabular-nums}#bike-preview{display:block;width:100%;height:200px;margin-bottom:16px}.line{display:flex;align-items:baseline;gap:8px;min-width:0;line-height:24px;margin:6px 0}.line [data-role=label]{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.line [data-role=value]{margin-left:auto;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}.line.total{border-top:1px solid var(--color-border);padding-top:16px;margin-top:16px;line-height:36px}.total [data-role]{font-size:28px;font-weight:700}.discount [data-role=value]{color:var(--color-accent)}.line.vat{font-size:14px;color:var(--color-muted)}.line.delivery{font-size:14px;margin-top:16px}.line.unit{border-top:1px solid var(--color-border);margin-top:16px;padding-top:12px}.promo{border-top:1px solid var(--color-border);margin-top:20px;padding-top:16px}.promo-entry{display:flex;align-items:center;gap:8px}.promo-entry input{flex:1;width:0}#promo-remove{margin-top:8px;font-size:14px}#order-button{margin-top:24px;width:100%;height:48px;border:0;border-radius:var(--radius-control);font-size:16px;font-weight:600;background:var(--color-accent);color:var(--color-accent-contrast)}#order-button:disabled{opacity:1;background:var(--color-disabled-bg);color:var(--color-muted);cursor:not-allowed}#order-hint{text-align:center;color:var(--color-muted)}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(480px,calc(100% - 32px));background:var(--color-surface);border-left:4px solid var(--color-accent);padding:12px 16px;border-radius:var(--radius-control);box-shadow:0 8px 32px #0002;z-index:10}#confirmation{max-width:600px;margin:24px auto;padding:32px}#confirmation-total{font-size:28px;font-weight:700}#confirmation-reference{color:var(--color-muted)}@media(max-width:1023px){header{padding:24px 16px}main{padding:0 16px 32px;grid-template-columns:minmax(0,1fr)}aside{position:static}.grid.frame,.grid.color{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.drivetrain{grid-template-columns:minmax(0,1fr)}#confirmation{margin:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}}
</style>
</head>
<body>
<header data-testid="app-header"><h1>GPT-6</h1></header>
<main id="main"><div id="configurator" data-testid="configurator">
<section data-testid="section-rider"><h2>1. Rider</h2><label class="field-label" for="height-input">Your height (cm)</label><input id="height-input" data-testid="height-input" type="text" inputmode="numeric" aria-describedby="height-error"><p id="height-error" data-testid="height-error" class="message error" hidden>Enter a height between 150 and 200 cm.</p><p id="height-recommendation" data-testid="height-recommendation" class="message" hidden></p></section>
</div><aside id="summary" data-testid="summary"><svg id="bike-preview" data-testid="bike-preview" viewBox="0 0 480 280" role="img" aria-label="Your configured bicycle"></svg><div id="lines"></div><div class="promo"><label class="field-label" for="promo-input">Promo code</label><div class="promo-entry"><input type="text" id="promo-input" data-testid="promo-input" aria-describedby="promo-error"><button id="promo-apply" data-testid="promo-apply">Apply</button></div><p id="promo-error" data-testid="promo-error" class="message error" hidden>This code is not valid.</p><p id="promo-status" data-testid="promo-status" class="message" hidden></p><button id="promo-remove" data-testid="promo-remove" hidden>Remove code</button></div><button id="order-button" data-testid="order-button"></button><p id="order-hint" data-testid="order-hint" class="message">Enter your height to continue.</p></aside></main>
<div role="status"><div id="notice" data-testid="notice" hidden></div></div>
<section id="confirmation" data-testid="confirmation" hidden><h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2><p id="confirmation-reference" data-testid="confirmation-reference"></p><p id="confirmation-total" data-testid="confirmation-total"></p><p id="confirmation-delivery" data-testid="confirmation-delivery"></p><button id="confirmation-new" data-testid="confirmation-new">Configure another bike</button></section>
<script>
'use strict';
const $=id=>document.getElementById(id);
const catalog={frame:[['S','Frame S',119000],['M','Frame M',119000],['L','Frame L',124000],['XL','Frame XL',129000]],wheels:[['275','27.5" wheels',0],['29','29" wheels',12000]],drivetrain:[['essential','Essential 1×10',0],['sport','Sport 1×12',24000],['pro','Pro Electronic 2×12',69000]],color:[['graphite','Graphite',0,'#3A3A3C'],['sand','Sand',0,'#D8C7A6'],['red','Racing Red',6000,'#C8102E'],['glacier','Glacier',0,'#A9D6E5']],accessory:[['mudguards','Mudguards',4500],['rack','Rear rack',6900],['lights','Lights',3990],['kickstand','Kickstand',2450]]};
const initial=()=>({height:'',auto:true,frame:null,wheels:'275',drivetrain:'essential',color:'graphite',accessory:new Set(),qty:1,code:null,notice:''});let s=initial(),sequence=0;
const money=n=>{n=BigInt(n);return '€'+(n/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+(n%100n).toString().padStart(2,'0')};const signed=n=>n?'+'+money(n):'Included';const round=(n,d)=>(n+d/2n)/d;
const find=(g,id)=>catalog[g].find(o=>o[0]===id);const cost=(g,id)=>g==='color'&&id==='red'&&s.drivetrain==='pro'?0:find(g,id)[2];
function rec(){let h=s.height.trim();if(!/^\d+$/.test(h)||Number(h)<150||Number(h)>200)return null;return Number(h)<165?'S':Number(h)<175?'M':Number(h)<185?'L':'XL'}
function cascade(){if(s.frame==='S'&&s.wheels==='29'){s.wheels='275';s.notice='29" wheels were replaced by 27.5" wheels: not available with frame S.'}}
function choose(g,id,checked){if(g==='frame')s.auto=false;let changed=g==='accessory'?s.accessory.has(id)!==checked:s[g]!==id;if(!changed)return;s.notice='';if(g==='accessory'){checked?s.accessory.add(id):s.accessory.delete(id);if(id==='rack'&&checked&&!s.accessory.has('mudguards')){s.accessory.add('mudguards');s.notice='Mudguards were added: required by the rear rack.'}if(id==='mudguards'&&!checked&&s.accessory.has('rack')){s.accessory.delete('rack');s.notice='Rear rack was removed: it requires mudguards.'}}else s[g]=id;cascade();render()}
for(const [i,g] of ['frame','wheels','drivetrain','color','accessory'].entries()){const section=document.createElement('section');section.dataset.testid='section-'+(g==='accessory'?'accessories':g);const h=document.createElement('h2');h.textContent=(i+2)+'. '+({frame:'Frame',wheels:'Wheels',drivetrain:'Drivetrain',color:'Color',accessory:'Accessories'}[g]);section.append(h);const grid=document.createElement('div');grid.className='grid '+g;for(const o of catalog[g]){const card=document.createElement('label');card.className='card';card.dataset.testid='card-'+g+'-'+o[0];const input=document.createElement('input');input.type=g==='accessory'?'checkbox':'radio';input.name=g;input.value=o[0];input.setAttribute('aria-label',o[1]);card.append(input);if(g==='color'){const sw=document.createElement('span');sw.dataset.role='swatch';sw.style.backgroundColor=o[3];card.append(sw)}for(const role of ['name','price','check','reason',...(g==='frame'?['badge']:[])]){const span=document.createElement('span');span.dataset.role=role;span.textContent=role==='name'?o[1]:role==='check'?'✓':role==='badge'?'Recommended':'';if(role==='check')span.setAttribute('aria-hidden','true');card.append(span)}input.addEventListener('change',()=>choose(g,o[0],input.checked));input.addEventListener('click',()=>{if(g==='frame')s.auto=false});input.addEventListener('keydown',e=>{if(g==='frame'&&e.code==='Space')s.auto=false});grid.append(card)}section.append(grid);if(g==='frame'){const p=document.createElement('p');p.id='frame-warning';p.dataset.testid=p.id;p.className='message';p.hidden=true;section.append(p)}$('configurator').append(section)}
const quantity=document.createElement('section');quantity.dataset.testid='section-quantity';quantity.innerHTML='<h2>7. Quantity</h2><div class="stepper"><button id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">−</button><output id="qty-value" data-testid="qty-value">1</output><button id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button></div>';$('configurator').append(quantity);
function calculate(){let unit=s.frame?BigInt(cost('frame',s.frame)+cost('wheels',s.wheels)+cost('drivetrain',s.drivetrain)+cost('color',s.color)+[...s.accessory].reduce((a,id)=>a+cost('accessory',id),0)):0n;let subtotal=unit*BigInt(s.qty),qtyDiscount=s.qty>=3?round(subtotal*5n,100n):0n,after=subtotal-qtyDiscount;let active=s.code==='FREESHIP'||s.code==='WELCOME50'&&s.qty<3||s.code==='SPRING10'&&!!s.frame&&after>=150000n;let promo=active?(s.code==='SPRING10'?round(after*10n,100n):s.code==='WELCOME50'?5000n:0n):0n;let shipping=s.code==='FREESHIP'||after-promo>=200000n?0n:4900n;let total=after-promo+shipping;return {unit,subtotal,qtyDiscount,promo,shipping,total,vat:round(total*20n,120n),active}}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function delivery(){let days={essential:5,sport:7,pro:12}[s.drivetrain]+(s.color==='red'?3:0)+(s.qty>=3?2:0);let d=new Date();d.setHours(12,0,0,0);while(days){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6&&!['2026-12-24','2026-12-25','2026-12-31','2027-01-01'].includes(localDate(d)))days--}return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear()}
function show(id,text,visible=true){$(id).textContent=text;$(id).hidden=!visible}
function render(){const recommended=rec(),bad=!!s.height.trim()&&!recommended,p=calculate();$('height-error').hidden=!bad;$('height-input').setAttribute('aria-invalid',String(bad));show('height-recommendation','Recommended frame: '+recommended,!!recommended);let gap=recommended&&s.frame?['S','M','L','XL'].indexOf(s.frame)-['S','M','L','XL'].indexOf(recommended):0;show('frame-warning',`Frame ${s.frame} is ${Math.abs(gap)} sizes ${gap>0?'larger':'smaller'} than recommended.`,Math.abs(gap)>=2);
for(const [g,options]of Object.entries(catalog))for(const o of options){const card=document.querySelector(`[data-testid="card-${g}-${o[0]}"]`),input=card.querySelector('input');const selected=g==='accessory'?s.accessory.has(o[0]):s[g]===o[0],disabled=g==='color'&&o[0]==='glacier'||g==='wheels'&&o[0]==='29'&&s.frame==='S';input.checked=selected;input.disabled=disabled;card.classList.toggle('selected',selected);card.classList.toggle('disabled',disabled);card.querySelector('[data-role=check]').hidden=!selected;let reason=card.querySelector('[data-role=reason]');reason.hidden=!disabled;reason.textContent=g==='color'?'Out of stock':'Not available with frame S';card.querySelector('[data-role=price]').textContent=g==='frame'?money(o[2]):g==='color'&&o[0]==='red'&&s.drivetrain==='pro'?'Included with Pro':signed(cost(g,o[0]));if(g==='frame')card.querySelector('[data-role=badge]').hidden=recommended!==o[0]}
$('qty-value').textContent=s.qty;$('qty-decrease').disabled=s.qty===1;$('qty-increase').disabled=s.qty===5;
const rows=[];const row=(key,label,value,visible=true)=>{if(visible)rows.push([key,label,value])};row('frame',s.frame?'Frame '+s.frame:'Frame',s.frame?money(cost('frame',s.frame)):'—');for(const g of ['wheels','drivetrain','color'])row(g,find(g,s[g])[1],signed(cost(g,s[g])));for(const o of catalog.accessory)row('accessory-'+o[0],o[1],signed(o[2]),s.accessory.has(o[0]));row('unit','Unit price',s.frame?money(p.unit):'—');row('quantity','Quantity','× '+s.qty);row('subtotal','Subtotal',s.frame?money(p.subtotal):'—');row('qty-discount','Quantity discount (5%)','−'+money(p.qtyDiscount),!!s.frame&&s.qty>=3);row('promo','Code '+s.code,'−'+money(p.promo),!!s.frame&&p.promo>0n);row('shipping','Shipping',s.frame?p.shipping?money(p.shipping):'Free':'—');row('total','Total',s.frame?money(p.total):'—');row('vat','Including VAT (20%)',s.frame?money(p.vat):'—');row('delivery','Estimated delivery',delivery());$('lines').replaceChildren();for(const [key,label,value] of rows){const div=document.createElement('div');div.dataset.testid='summary-line-'+key;div.className='line '+key+(['qty-discount','promo'].includes(key)?' discount':'');const a=document.createElement('span'),b=document.createElement('span');a.dataset.role='label';a.textContent=label;b.dataset.role='value';b.textContent=value;div.append(a,b);$('lines').append(div)}
$('promo-apply').disabled=!$('promo-input').value.trim();$('promo-remove').hidden=!s.code;show('promo-status',p.active?`Code ${s.code} applied.`:s.code==='SPRING10'?'SPRING10 requires €1,500.00 or more after the quantity discount.':'WELCOME50 cannot be combined with the quantity discount.',!!s.code);$('promo-status').style.color=p.active?'var(--color-accent)':'var(--color-muted)';$('order-button').textContent=`Order ${s.qty} ${s.qty===1?'bike':'bikes'}`;$('order-button').disabled=!recommended||!s.frame;$('order-hint').hidden=!!recommended;show('notice',s.notice,!!s.notice);preview()}
function preview(){let r=s.wheels==='29'?76:70,color=find('color',s.color)[3];$('bike-preview').innerHTML=`<g fill="none" stroke="var(--color-text)" stroke-linecap="round" stroke-linejoin="round"><circle data-part="wheel" cx="110" cy="180" r="${r}" stroke-width="7"/><circle data-part="wheel" cx="370" cy="180" r="${r}" stroke-width="7"/><g stroke="var(--color-border)" stroke-width="1"><path d="M110 110V250M40 180H180M60 130L160 230M60 230L160 130M370 110V250M300 180H440M320 130L420 230M320 230L420 130"/></g><path data-part="frame" d="M110 180L185 76L245 180Z M185 76L327 76L245 180 M327 76L370 180" stroke="${color}" stroke-width="10"/><path d="M185 76L177 51M157 49H199M327 76L316 41H346L354 51" stroke-width="7"/><circle cx="245" cy="180" r="17" stroke-width="4"/><path d="M245 180L267 201H281" stroke-width="4"/>${s.accessory.has('mudguards')?'<path data-part="mudguard" d="M29 171A82 82 0 0 1 173 126" stroke-width="5"/><path data-part="mudguard" d="M307 126A82 82 0 0 1 451 171" stroke-width="5"/>':''}${s.accessory.has('rack')?'<path data-part="rack" d="M56 88H162M67 88L110 180M150 88L110 180" stroke-width="4"/>':''}${s.accessory.has('lights')?'<rect data-part="light" x="338" y="62" width="16" height="12" rx="4" fill="#F3CD68" stroke-width="2"/>':''}${s.accessory.has('kickstand')?'<path data-part="kickstand" d="M235 186L213 250" stroke-width="5"/>':''}</g>`}
$('height-input').addEventListener('input',()=>{let v=$('height-input').value;if(v!==s.height)s.notice='';s.height=v;if(s.auto&&rec())s.frame=rec();cascade();render()});for(const [id,step]of [['qty-decrease',-1],['qty-increase',1]])$(id).onclick=()=>{s.qty+=step;s.notice='';render()};
function promoError(on){$('promo-error').hidden=!on;$('promo-input').setAttribute('aria-invalid',String(on))}function apply(){const code=$('promo-input').value.trim().toUpperCase();if(!code)return;promoError(false);if(['SPRING10','WELCOME50','FREESHIP'].includes(code)){s.code=code;$('promo-input').value=''}else promoError(true);render()}
$('promo-input').oninput=()=>{promoError(false);$('promo-apply').disabled=!$('promo-input').value.trim()};$('promo-input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();apply()}};$('promo-apply').onclick=apply;$('promo-remove').onclick=()=>{s.code=null;render()};$('order-button').onclick=()=>{if(!rec()||!s.frame)return;sequence++;show('confirmation-reference','BK-'+localDate(new Date()).replaceAll('-','')+'-'+String(sequence).padStart(3,'0'));show('confirmation-total',money(calculate().total));show('confirmation-delivery',delivery());s.notice='';$('notice').hidden=true;$('main').hidden=true;$('confirmation').hidden=false;$('confirmation-title').focus()};$('confirmation-new').onclick=()=>{s=initial();$('height-input').value='';$('promo-input').value='';promoError(false);$('confirmation').hidden=true;$('main').hidden=false;render();$('height-input').focus()};render();
</script>
</body>
</html>
