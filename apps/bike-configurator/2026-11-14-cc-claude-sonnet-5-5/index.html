<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 24px;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
header .wrap { padding-top: 24px; padding-bottom: 24px; }
h1 { margin: 0; font-size: var(--text-xl); line-height: 36px; font-weight: 700; }
main { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; display: flex; gap: 32px; align-items: flex-start; }
#configurator { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
#summary { flex: none; width: 360px; position: sticky; top: 24px; }
@media (max-width: 1023px) {
  main { padding: 0 16px 48px; flex-direction: column; align-items: stretch; gap: 32px; }
  #configurator { flex: none; width: 100%; }
  #summary { width: 100%; position: static; }
  header .wrap { padding-left: 16px; padding-right: 16px; }
}
section.panel, aside.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 24px;
}
h2 { margin: 0 0 16px; font-size: var(--text-lg); line-height: 28px; font-weight: 600; }
.grid { display: grid; gap: 12px; }
#section-frame .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
#section-wheels .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#section-drivetrain .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
#section-color .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
#section-accessories .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1023px) {
  #section-frame .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #section-drivetrain .grid { grid-template-columns: minmax(0, 1fr); }
  #section-color .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.card {
  --bw: 1px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 16px;
  cursor: pointer;
  min-width: 0;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.card.selected { --bw: 2px; border: 2px solid var(--color-accent); padding: 15px; }
.card:hover:not(.selected):not(.disabled) { border-color: var(--color-muted); }
.card.disabled { opacity: 0.45; cursor: not-allowed; }
.card:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.card input {
  position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none;
}
.card [data-role="name"] { font-size: 16px; font-weight: 600; color: var(--color-text); }
.card [data-role="price"] { font-size: 14px; line-height: 20px; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.card [data-role="reason"] { font-size: 14px; line-height: 20px; color: var(--color-muted); }
.card [data-role="reason"].off { visibility: hidden; }
.card [data-role="check"] { position: absolute; top: 8px; right: 12px; color: var(--color-accent); font-weight: 700; }
.card [data-role="swatch"] {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--color-border); flex: none; margin-bottom: 4px;
}
.card [data-role="badge"] {
  position: absolute; left: 50%; top: calc(-1 * var(--bw)); transform: translate(-50%, -50%);
  background: var(--color-accent); color: var(--color-accent-contrast);
  border-radius: var(--radius-pill); font-size: 14px; line-height: 20px; font-weight: 600; padding: 2px 8px; white-space: nowrap;
}
label.field { display: block; font-size: var(--text-sm); color: var(--color-muted); margin-bottom: 4px; }
input[type="text"] {
  display: block; width: 100%; height: 40px; padding: 0 12px;
  background: var(--color-surface); color: var(--color-text);
  border: 1px solid var(--color-border); border-radius: var(--radius-control);
  font: inherit;
}
input[type="text"]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
#height-input.invalid { border-color: var(--color-danger); }
.err { color: var(--color-danger); font-size: 14px; line-height: 20px; margin-top: 4px; }
.info { font-size: 14px; line-height: 20px; margin-top: 8px; color: var(--color-text); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.btn2 {
  background: transparent; border: 1px solid var(--color-border); color: var(--color-text);
  height: 40px; border-radius: var(--radius-control); padding: 0 16px; cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.btn2:disabled { opacity: 0.45; cursor: not-allowed; }
.qty { display: flex; align-items: center; gap: 12px; }
.qty .btn2 { width: 40px; padding: 0; font-size: 20px; line-height: 1; }
#qty-value { min-width: 32px; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
#bike-preview { display: block; width: 100%; height: 200px; margin-bottom: 8px; }
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; white-space: nowrap; }
.line [data-role="label"] { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.line [data-role="value"] { flex: none; font-variant-numeric: tabular-nums; }
.line.disc [data-role="value"] { color: var(--color-accent); }
.line.total { border-top: 1px solid var(--color-border); margin-top: 8px; padding-top: 8px; }
.line.total [data-role="label"], .line.total [data-role="value"] { font-size: 28px; line-height: 36px; font-weight: 700; }
.promo { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border); }
.promo .row { display: flex; gap: 8px; }
.promo .row input { flex: 1 1 auto; min-width: 0; }
#promo-status { font-size: 14px; line-height: 20px; margin-top: 8px; }
#promo-remove { margin-top: 8px; }
#order-button {
  display: block; width: 100%; height: 48px; margin-top: 16px; border: 0; border-radius: var(--radius-control);
  font-size: 16px; font-weight: 600; background: var(--color-accent); color: var(--color-accent-contrast); cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
#order-button:disabled { background: var(--color-disabled-bg); color: var(--color-muted); cursor: not-allowed; }
#order-hint { margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--color-muted); text-align: center; }
#notice {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(480px, calc(100vw - 32px));
  background: var(--color-surface); color: var(--color-text);
  border: 0; border-left: 4px solid var(--color-accent);
  padding: 12px 16px; border-radius: var(--radius-control);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10;
}
#confirmation { max-width: 560px; margin: 24px auto 48px; }
#confirmation-title { outline: none; margin-bottom: 16px; }
#confirmation .btn2 { margin-top: 24px; }
#confirmation dl { margin: 0; }
#confirmation .line { padding: 4px 0; }
@media (max-width: 1023px) { #confirmation { margin-left: 16px; margin-right: 16px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}
</style>
</head>
<body>
<header data-testid="app-header"><div class="wrap"><h1>Claude Sonnet 5.5</h1></div></header>
<main>
  <div id="configurator" data-testid="configurator">
    <section class="panel" id="section-rider" data-testid="section-rider">
      <h2>1. Rider</h2>
      <label class="field" for="height-input" style="color:var(--color-text)">Your height (cm)</label>
      <input type="text" inputmode="numeric" id="height-input" data-testid="height-input" autocomplete="off" aria-describedby="height-error height-recommendation">
      <div class="err" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</div>
      <div class="info" id="height-recommendation" data-testid="height-recommendation" hidden></div>
    </section>
    <section class="panel" id="section-frame" data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="grid" id="grid-frame"></div>
      <div class="err" id="frame-warning" data-testid="frame-warning" hidden style="margin-top:12px;color:var(--color-text)"></div>
    </section>
    <section class="panel" id="section-wheels" data-testid="section-wheels"><h2>3. Wheels</h2><div class="grid" id="grid-wheels"></div></section>
    <section class="panel" id="section-drivetrain" data-testid="section-drivetrain"><h2>4. Drivetrain</h2><div class="grid" id="grid-drivetrain"></div></section>
    <section class="panel" id="section-color" data-testid="section-color"><h2>5. Color</h2><div class="grid" id="grid-color"></div></section>
    <section class="panel" id="section-accessories" data-testid="section-accessories"><h2>6. Accessories</h2><div class="grid" id="grid-accessory"></div></section>
    <section class="panel" id="section-quantity" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="qty">
        <button type="button" class="btn2" id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">−</button>
        <span id="qty-value" data-testid="qty-value">1</span>
        <button type="button" class="btn2" id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>
  <aside class="panel" id="summary" data-testid="summary">
    <svg id="bike-preview" data-testid="bike-preview" viewBox="0 0 400 220" role="img" aria-label="Bike preview"></svg>
    <div id="lines"></div>
    <div class="promo">
      <label class="field" for="promo-input" style="color:var(--color-text)">Promo code</label>
      <div class="row">
        <input type="text" id="promo-input" data-testid="promo-input" autocomplete="off" aria-describedby="promo-error">
        <button type="button" class="btn2" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <div class="err" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</div>
      <div id="promo-status" data-testid="promo-status" hidden></div>
      <button type="button" class="btn2" id="promo-remove" data-testid="promo-remove" hidden>Remove code</button>
    </div>
    <button type="button" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
    <div id="order-hint" data-testid="order-hint">Enter your height to continue.</div>
  </aside>
</main>
<section class="panel" id="confirmation" data-testid="confirmation" hidden>
  <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
  <div class="line"><span>Reference</span><span id="confirmation-reference" data-testid="confirmation-reference"></span></div>
  <div class="line"><span>Total</span><span id="confirmation-total" data-testid="confirmation-total"></span></div>
  <div class="line"><span>Estimated delivery</span><span id="confirmation-delivery" data-testid="confirmation-delivery"></span></div>
  <button type="button" class="btn2" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
</section>
<div role="status" id="live"><div id="notice" data-testid="notice" hidden></div></div>

<script>
(function () {
  var FRAMES = [
    { id: 'S', name: 'Frame S', price: 119000, min: 150, max: 164 },
    { id: 'M', name: 'Frame M', price: 119000, min: 165, max: 174 },
    { id: 'L', name: 'Frame L', price: 124000, min: 175, max: 184 },
    { id: 'XL', name: 'Frame XL', price: 129000, min: 185, max: 200 }
  ];
  var WHEELS = [
    { id: '275', name: '27.5" wheels', price: 0 },
    { id: '29', name: '29" wheels', price: 12000 }
  ];
  var DRIVES = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  var COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0 }
  ];
  var ACCS = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  var CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = ['2026-12-24', '2026-12-25', '2026-12-31', '2027-01-01'];
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var $ = function (id) { return document.getElementById(id); };
  var st, orderSeq = 0;

  function fresh() {
    return { height: '', valid: false, rec: null, frame: null, auto: true, wheels: '275', drive: 'essential', color: 'graphite', acc: {}, qty: 1, promo: null };
  }

  function fmt(c) {
    var e = Math.floor(c / 100), r = c % 100;
    return '€' + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (r < 10 ? '0' : '') + r;
  }
  function signed(c) { return c === 0 ? 'Included' : '+' + fmt(c); }
  function rhu(n, d) { return Math.floor((2 * n + d) / (2 * d)); }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  // ---------- build cards ----------
  var cards = {};
  function buildCard(group, opt, type, gridId, nameAttr) {
    var label = document.createElement('label');
    label.className = 'card';
    label.setAttribute('data-testid', 'card-' + group + '-' + opt.id);
    var input = document.createElement('input');
    input.type = type;
    if (nameAttr) input.name = nameAttr;
    input.value = opt.id;
    input.setAttribute('aria-label', opt.name);
    label.appendChild(input);
    if (group === 'color') {
      var sw = document.createElement('span');
      sw.setAttribute('data-role', 'swatch');
      sw.style.background = opt.hex;
      label.appendChild(sw);
    }
    var nm = document.createElement('span'); nm.setAttribute('data-role', 'name'); nm.textContent = opt.name; label.appendChild(nm);
    var pr = document.createElement('span'); pr.setAttribute('data-role', 'price'); label.appendChild(pr);
    var ck = document.createElement('span'); ck.setAttribute('data-role', 'check'); ck.textContent = '✓'; ck.setAttribute('aria-hidden', 'true'); label.appendChild(ck);
    var c = { el: label, input: input, price: pr, check: ck, reason: null, badge: null, opt: opt, group: group };
    if (group === 'frame') {
      var b = document.createElement('span'); b.setAttribute('data-role', 'badge'); b.textContent = 'Recommended'; label.appendChild(b); c.badge = b;
    }
    if ((group === 'wheels' && opt.id === '29') || (group === 'color' && opt.id === 'glacier')) {
      var rs = document.createElement('span'); rs.setAttribute('data-role', 'reason'); label.appendChild(rs); c.reason = rs;
    }
    $(gridId).appendChild(label);
    cards[group + '-' + opt.id] = c;
    return c;
  }
  FRAMES.forEach(function (o) { buildCard('frame', o, 'radio', 'grid-frame', 'frame').input.addEventListener('click', function () { onFrame(o.id); }); });
  WHEELS.forEach(function (o) { buildCard('wheels', o, 'radio', 'grid-wheels', 'wheels').input.addEventListener('click', function () { onSingle('wheels', o.id); }); });
  DRIVES.forEach(function (o) { buildCard('drivetrain', o, 'radio', 'grid-drivetrain', 'drivetrain').input.addEventListener('click', function () { onSingle('drive', o.id); }); });
  COLORS.forEach(function (o) { buildCard('color', o, 'radio', 'grid-color', 'color').input.addEventListener('click', function () { onSingle('color', o.id); }); });
  ACCS.forEach(function (o) { buildCard('accessory', o, 'checkbox', 'grid-accessory', null).input.addEventListener('click', function (e) { onAcc(o.id, e.target.checked); }); });

  // ---------- build summary lines ----------
  var lineKeys = ['frame', 'wheels', 'drivetrain', 'color', 'accessory-mudguards', 'accessory-rack', 'accessory-lights', 'accessory-kickstand', 'unit', 'quantity', 'subtotal', 'qty-discount', 'promo', 'shipping', 'total', 'vat', 'delivery'];
  var lines = {};
  lineKeys.forEach(function (k) {
    var row = document.createElement('div');
    row.className = 'line' + (k === 'total' ? ' total' : '') + (k === 'qty-discount' || k === 'promo' ? ' disc' : '');
    row.setAttribute('data-testid', 'summary-line-' + k);
    var l = document.createElement('span'); l.setAttribute('data-role', 'label');
    var v = document.createElement('span'); v.setAttribute('data-role', 'value');
    row.appendChild(l); row.appendChild(v);
    $('lines').appendChild(row);
    lines[k] = { row: row, l: l, v: v };
  });
  function setLine(k, label, value) { lines[k].l.textContent = label; lines[k].v.textContent = value; }

  // ---------- delivery ----------
  function delivery(lead) {
    var d = new Date();
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var n = 0;
    while (n < lead) {
      d.setDate(d.getDate() + 1);
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6 && CLOSED.indexOf(iso(d)) < 0) n++;
    }
    return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ---------- calculation ----------
  function calc() {
    var r = {};
    var drive = find(DRIVES, st.drive), color = find(COLORS, st.color);
    r.colorSur = (st.color === 'red' && st.drive === 'pro') ? 0 : color.price;
    r.lead = drive.lead + (st.color === 'red' ? 3 : 0) + (st.qty >= 3 ? 2 : 0);
    var accSum = 0;
    ACCS.forEach(function (a) { if (st.acc[a.id]) accSum += a.price; });
    r.hasFrame = !!st.frame;
    r.promoActive = false;
    if (st.frame) {
      r.unit = find(FRAMES, st.frame).price + find(WHEELS, st.wheels).price + drive.price + r.colorSur + accSum;
      r.subtotal = r.unit * st.qty;
      r.qd = st.qty >= 3 ? rhu(r.subtotal * 5, 100) : 0;
      r.after = r.subtotal - r.qd;
    } else { r.after = 0; r.qd = 0; }
    var p = st.promo;
    if (p === 'SPRING10') r.promoActive = !!st.frame && r.after >= 150000;
    else if (p === 'WELCOME50') r.promoActive = st.qty < 3;
    else if (p === 'FREESHIP') r.promoActive = true;
    if (st.frame) {
      r.pd = 0;
      if (r.promoActive && p === 'SPRING10') r.pd = rhu(r.after * 10, 100);
      else if (r.promoActive && p === 'WELCOME50') r.pd = 5000;
      r.merch = r.after - r.pd;
      r.ship = (p === 'FREESHIP' || r.merch >= 200000) ? 0 : 4900;
      r.total = r.merch + r.ship;
      r.vat = rhu(r.total * 20, 120);
    }
    return r;
  }

  // ---------- render ----------
  function setCard(c, selected, disabled) {
    c.input.checked = selected;
    c.input.disabled = disabled;
    c.el.classList.toggle('selected', selected);
    c.el.classList.toggle('disabled', disabled);
    c.check.hidden = !selected;
  }
  function render() {
    var r = calc();
    FRAMES.forEach(function (o) {
      var c = cards['frame-' + o.id];
      setCard(c, st.frame === o.id, false);
      c.price.textContent = fmt(o.price);
      c.badge.hidden = !(st.valid && st.rec === o.id);
    });
    WHEELS.forEach(function (o) {
      var c = cards['wheels-' + o.id];
      var dis = o.id === '29' && st.frame === 'S';
      setCard(c, st.wheels === o.id, dis);
      c.price.textContent = signed(o.price);
      if (c.reason) { c.reason.textContent = 'Not available with frame S'; c.reason.classList.toggle('off', !dis); }
    });
    DRIVES.forEach(function (o) {
      var c = cards['drivetrain-' + o.id];
      setCard(c, st.drive === o.id, false);
      c.price.textContent = signed(o.price);
    });
    COLORS.forEach(function (o) {
      var c = cards['color-' + o.id];
      var dis = o.id === 'glacier';
      setCard(c, st.color === o.id, dis);
      c.price.textContent = (o.id === 'red' && st.drive === 'pro') ? 'Included with Pro' : signed(o.price);
      if (c.reason) c.reason.textContent = 'Out of stock';
    });
    ACCS.forEach(function (o) {
      var c = cards['accessory-' + o.id];
      setCard(c, !!st.acc[o.id], false);
      c.price.textContent = signed(o.price);
    });

    // rider
    $('height-error').hidden = !(st.height.trim() !== '' && !st.valid);
    var invalid = !$('height-error').hidden;
    $('height-input').classList.toggle('invalid', invalid);
    if (invalid) $('height-input').setAttribute('aria-invalid', 'true'); else $('height-input').removeAttribute('aria-invalid');
    $('height-recommendation').hidden = !st.valid;
    if (st.valid) $('height-recommendation').textContent = 'Recommended frame: ' + st.rec;
    var warn = false;
    if (st.valid && st.frame) {
      var order = ['S', 'M', 'L', 'XL'];
      var gap = order.indexOf(st.frame) - order.indexOf(st.rec);
      if (Math.abs(gap) >= 2) {
        warn = true;
        $('frame-warning').textContent = 'Frame ' + st.frame + ' is ' + Math.abs(gap) + ' sizes ' + (gap > 0 ? 'larger' : 'smaller') + ' than recommended.';
      }
    }
    $('frame-warning').hidden = !warn;

    // quantity
    $('qty-value').textContent = String(st.qty);
    $('qty-decrease').disabled = st.qty <= 1;
    $('qty-increase').disabled = st.qty >= 5;

    // summary
    var drive = find(DRIVES, st.drive), color = find(COLORS, st.color), wheels = find(WHEELS, st.wheels);
    var dash = '—';
    if (st.frame) setLine('frame', 'Frame ' + st.frame, fmt(find(FRAMES, st.frame).price));
    else setLine('frame', 'Frame', dash);
    setLine('wheels', wheels.name, signed(wheels.price));
    setLine('drivetrain', drive.name, signed(drive.price));
    setLine('color', color.name, signed(r.colorSur));
    ACCS.forEach(function (a) {
      var k = 'accessory-' + a.id;
      lines[k].row.hidden = !st.acc[a.id];
      setLine(k, a.name, signed(a.price));
    });
    setLine('unit', 'Unit price', st.frame ? fmt(r.unit) : dash);
    setLine('quantity', 'Quantity', '× ' + st.qty);
    setLine('subtotal', 'Subtotal', st.frame ? fmt(r.subtotal) : dash);
    lines['qty-discount'].row.hidden = !(st.frame && st.qty >= 3);
    if (st.frame) setLine('qty-discount', 'Quantity discount (5%)', '−' + fmt(r.qd));
    var showPromo = st.frame && r.promoActive && r.pd > 0;
    lines['promo'].row.hidden = !showPromo;
    if (showPromo) setLine('promo', 'Code ' + st.promo, '−' + fmt(r.pd));
    setLine('shipping', 'Shipping', st.frame ? (r.ship === 0 ? 'Free' : fmt(r.ship)) : dash);
    setLine('total', 'Total', st.frame ? fmt(r.total) : dash);
    setLine('vat', 'Including VAT (20%)', st.frame ? fmt(r.vat) : dash);
    setLine('delivery', 'Estimated delivery', delivery(r.lead));

    // promo
    var ps = $('promo-status');
    if (st.promo) {
      ps.hidden = false;
      $('promo-remove').hidden = false;
      if (r.promoActive) ps.textContent = 'Code ' + st.promo + ' applied.';
      else if (st.promo === 'SPRING10') ps.textContent = 'SPRING10 requires €1,500.00 or more after the quantity discount.';
      else ps.textContent = 'WELCOME50 cannot be combined with the quantity discount.';
      ps.style.color = r.promoActive ? 'var(--color-accent)' : 'var(--color-muted)';
    } else { ps.hidden = true; $('promo-remove').hidden = true; }

    // order
    $('order-button').textContent = st.qty === 1 ? 'Order 1 bike' : 'Order ' + st.qty + ' bikes';
    $('order-button').disabled = !(st.valid && st.frame);
    $('order-hint').hidden = st.valid;

    drawBike();
    r.dateText = lines.delivery.v.textContent;
    return r;
  }

  // ---------- bike preview ----------
  function drawBike() {
    var rad = st.wheels === '29' ? 76 : 70;
    var hex = find(COLORS, st.color).hex;
    var cy = 126, rx = 100, fx = 300;
    var NS = 'http://www.w3.org/2000/svg';
    var s = '';
    function fr(d) { return '<path data-part="frame" d="' + d + '" fill="none" stroke="' + hex + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="stroke:' + hex + '"/>'; }
    var ink = 'stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"';
    s += '<g style="color:var(--color-text)">';
    s += '<circle data-part="wheel" cx="' + rx + '" cy="' + cy + '" r="' + rad + '" ' + ink + ' stroke-width="6"/>';
    s += '<circle data-part="wheel" cx="' + fx + '" cy="' + cy + '" r="' + rad + '" ' + ink + ' stroke-width="6"/>';
    if (st.acc.mudguards) {
      [rx, fx].forEach(function (cx) {
        var R = rad + 7;
        s += '<path data-part="mudguard" d="M' + (cx - R * 0.94) + ' ' + (cy - R * 0.34) + ' A' + R + ' ' + R + ' 0 0 1 ' + (cx + R * 0.94) + ' ' + (cy - R * 0.34) + '" ' + ink + ' stroke-width="4"/>';
      });
    }
    if (st.acc.rack) s += '<path data-part="rack" d="M58 70 H142 M80 70 L' + rx + ' ' + cy + '" ' + ink + ' stroke-width="4"/>';
    if (st.acc.kickstand) s += '<line data-part="kickstand" x1="150" y1="' + cy + '" x2="136" y2="202" ' + ink + ' stroke-width="4"/>';
    s += fr('M' + rx + ' ' + cy + ' L185 ' + cy + ' L170 72 Z');
    s += fr('M170 72 L270 66 L185 ' + cy);
    s += fr('M270 66 L' + fx + ' ' + cy);
    s += '<path d="M170 72 L166 58 M154 56 H184" ' + ink + ' stroke-width="5"/>';
    s += '<path d="M270 66 L264 52 M262 52 H286" ' + ink + ' stroke-width="5"/>';
    s += '<circle cx="185" cy="' + cy + '" r="9" ' + ink + ' stroke-width="3"/>';
    if (st.acc.lights) s += '<circle data-part="light" cx="290" cy="58" r="6" fill="#F5C518" stroke="currentColor" stroke-width="2"/>';
    s += '</g>';
    $('bike-preview').innerHTML = s;
  }

  // ---------- notice ----------
  function clearNotice() { var n = $('notice'); n.hidden = true; n.textContent = ''; }
  function showNotice(t) { var n = $('notice'); n.textContent = t; n.hidden = false; }

  // ---------- handlers ----------
  function setFrame(id) {
    st.frame = id;
    if (id === 'S' && st.wheels === '29') {
      st.wheels = '275';
      showNotice('29" wheels were replaced by 27.5" wheels: not available with frame S.');
    }
  }
  function onFrame(id) {
    st.auto = false;
    if (st.frame !== id) { clearNotice(); setFrame(id); }
    render();
  }
  function onSingle(key, id) {
    if (st[key] === id) { render(); return; }
    clearNotice();
    st[key] = id;
    render();
  }
  function onAcc(id, on) {
    if (!!st.acc[id] === on) { render(); return; }
    clearNotice();
    if (on) {
      st.acc[id] = true;
      if (id === 'rack' && !st.acc.mudguards) { st.acc.mudguards = true; showNotice('Mudguards were added: required by the rear rack.'); }
    } else {
      delete st.acc[id];
      if (id === 'mudguards' && st.acc.rack) { delete st.acc.rack; showNotice('Rear rack was removed: it requires mudguards.'); }
    }
    render();
  }
  $('height-input').addEventListener('input', function () {
    clearNotice();
    var v = this.value;
    st.height = v;
    var t = v.trim();
    st.valid = /^[0-9]+$/.test(t) && +t >= 150 && +t <= 200;
    st.rec = null;
    if (st.valid) {
      var h = +t;
      for (var i = 0; i < FRAMES.length; i++) if (h >= FRAMES[i].min && h <= FRAMES[i].max) st.rec = FRAMES[i].id;
      if (st.auto && st.frame !== st.rec) setFrame(st.rec);
    }
    render();
  });
  $('qty-decrease').addEventListener('click', function () { if (st.qty > 1) { clearNotice(); st.qty--; render(); } });
  $('qty-increase').addEventListener('click', function () { if (st.qty < 5) { clearNotice(); st.qty++; render(); } });

  function syncApply() { $('promo-apply').disabled = $('promo-input').value.trim() === ''; }
  function applyPromo() {
    var code = $('promo-input').value.trim().toUpperCase();
    if (CODES.indexOf(code) < 0) {
      $('promo-error').hidden = false;
      $('promo-input').setAttribute('aria-invalid', 'true');
      return;
    }
    st.promo = code;
    $('promo-error').hidden = true;
    $('promo-input').removeAttribute('aria-invalid');
    $('promo-input').value = '';
    syncApply();
    render();
  }
  $('promo-input').addEventListener('input', function () {
    $('promo-error').hidden = true;
    this.removeAttribute('aria-invalid');
    syncApply();
  });
  $('promo-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); if (!$('promo-apply').disabled) applyPromo(); }
  });
  $('promo-apply').addEventListener('click', applyPromo);
  $('promo-remove').addEventListener('click', function () { st.promo = null; render(); });

  $('order-button').addEventListener('click', function () {
    if (this.disabled) return;
    var r = render();
    orderSeq++;
    var d = new Date();
    var ref = 'BK-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + ('00' + orderSeq).slice(-3);
    $('confirmation-reference').textContent = ref;
    $('confirmation-total').textContent = fmt(r.total);
    $('confirmation-delivery').textContent = r.dateText;
    clearNotice();
    document.querySelector('main').hidden = true;
    $('confirmation').hidden = false;
    $('confirmation-title').focus();
  });
  $('confirmation-new').addEventListener('click', function () {
    st = fresh();
    $('height-input').value = '';
    $('promo-input').value = '';
    $('promo-error').hidden = true;
    $('promo-input').removeAttribute('aria-invalid');
    syncApply();
    clearNotice();
    $('confirmation').hidden = true;
    document.querySelector('main').hidden = false;
    render();
    $('height-input').focus();
  });

  st = fresh();
  render();
})();
</script>
</body>
</html>
