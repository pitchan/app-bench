<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5</title>
<style>
:root {
  --color-bg: #F6F4F0;
  --color-surface: #FFFFFF;
  --color-text: #1B1A18;
  --color-muted: #67625B;
  --color-border: #DCD6CC;
  --color-accent: #0E6B58;
  --color-accent-contrast: #FFFFFF;
  --color-danger: #B42318;
  --color-disabled-bg: #ECE8E1;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-control: 8px;
  --radius-card: 12px;
  --radius-pill: 999px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --duration-fast: 150ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121110;
    --color-surface: #1D1B19;
    --color-text: #F3F0EA;
    --color-muted: #A59F96;
    --color-border: #38342F;
    --color-accent: #3BC4A5;
    --color-accent-contrast: #0B0A09;
    --color-danger: #F97066;
    --color-disabled-bg: #2A2724;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--text-md);
  line-height: 24px;
}

/* ---------- Layout ---------- */
.app-header-inner,
main {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: var(--space-4);
  padding-right: var(--space-4);
}
.app-header-inner { padding-top: var(--space-5); padding-bottom: var(--space-5); }
.app-header h1 {
  margin: 0;
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-6);
  align-items: start;
  padding-bottom: 112px;
}
.configurator {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}
.summary { position: static; min-width: 0; }

.panel {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-5);
}
.panel h2 {
  margin: 0 0 var(--space-4);
  font-size: var(--text-lg);
  line-height: 28px;
  font-weight: 600;
}

.grid {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid-drivetrain { grid-template-columns: minmax(0, 1fr); }

@media (min-width: 1024px) {
  .app-header-inner,
  main { padding-left: var(--space-5); padding-right: var(--space-5); }
  main { grid-template-columns: minmax(0, 1fr) 360px; }
  .summary { position: sticky; top: 24px; }
  .grid-frame, .grid-color { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-drivetrain { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* ---------- Option cards ---------- */
.card {
  --bw: 1px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  min-width: 0;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-4);
  cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
.card:hover { border-color: var(--color-muted); }
.card:has(input:checked) {
  --bw: 2px;
  border: 2px solid var(--color-accent);
  padding: 15px;
}
.card:has(input:disabled) {
  border-color: var(--color-border);
  opacity: 0.45;
  cursor: not-allowed;
}
.card:has(input:focus-visible) {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.card input {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}
.card [data-role="name"] {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--color-text);
  overflow-wrap: anywhere;
}
.card [data-role="price"] {
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
}
.card [data-role="check"] {
  display: none;
  position: absolute;
  top: calc(6px - var(--bw));
  right: calc(6px - var(--bw));
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  align-items: center;
  justify-content: center;
}
.card [data-role="check"] svg { width: 10px; height: 10px; display: block; }
.card:has(input:checked) [data-role="check"] { display: flex; }
.card [data-role="reason"] {
  display: none;
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-text);
}
.card:has(input:disabled) [data-role="reason"] { display: block; }
/* The slot keeps the card height identical whether the reason shows or not. */
.reason-slot { min-height: 20px; }
.grid-wheels .reason-slot { min-height: 40px; }
.grid-color [data-role="price"] { min-height: 40px; }
@media (min-width: 1024px) {
  .grid-wheels .reason-slot { min-height: 20px; }
  .grid-color [data-role="price"] { min-height: 20px; }
}
.card [data-role="badge"] {
  position: absolute;
  left: 50%;
  top: calc(var(--bw) * -1);
  transform: translate(-50%, -50%);
  z-index: 1;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  line-height: 20px;
  font-weight: 600;
  padding: 2px 8px;
  white-space: nowrap;
}
.card [data-role="swatch"] {
  display: block;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--color-border);
  margin-bottom: var(--space-1);
}

/* ---------- Fields ---------- */
.field-label {
  display: block;
  font-size: var(--text-sm);
  line-height: 20px;
  font-weight: 600;
  margin-bottom: var(--space-1);
}
.text-input {
  height: 40px;
  padding: 0 var(--space-3);
  background-color: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  font: inherit;
  transition: border-color var(--duration-fast);
}
.text-input:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.text-input[aria-invalid="true"] { border-color: var(--color-danger); }
#height-input { width: 160px; max-width: 100%; }
.field-error {
  margin: var(--space-2) 0 0;
  color: var(--color-danger);
  font-size: var(--text-sm);
  line-height: 20px;
}
.recommendation {
  margin: var(--space-2) 0 0;
  font-weight: 600;
}
.frame-warning {
  margin: var(--space-4) 0 0;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-danger);
  border-radius: var(--radius-control);
  font-size: var(--text-sm);
  line-height: 20px;
}

/* ---------- Buttons ---------- */
button {
  font: inherit;
  cursor: pointer;
  transition: border-color var(--duration-fast), background-color var(--duration-fast), color var(--duration-fast);
}
button:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.btn-secondary {
  height: 40px;
  padding: 0 var(--space-4);
  background-color: transparent;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  color: var(--color-text);
  white-space: nowrap;
}
.btn-secondary:hover:not(:disabled) { border-color: var(--color-muted); }
.btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-step { width: 40px; padding: 0; font-size: var(--text-lg); line-height: 1; }
.btn-primary {
  display: block;
  width: 100%;
  height: 48px;
  padding: 0 var(--space-4);
  border: none;
  border-radius: var(--radius-control);
  font-size: var(--text-md);
  font-weight: 600;
  background-color: var(--color-accent);
  color: var(--color-accent-contrast);
}
.btn-primary:disabled {
  background-color: var(--color-disabled-bg);
  color: var(--color-muted);
  cursor: not-allowed;
}

.stepper { display: flex; align-items: center; gap: var(--space-3); }
.qty-value {
  min-width: 40px;
  text-align: center;
  font-size: var(--text-lg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ---------- Summary ---------- */
.preview {
  display: block;
  width: 100%;
  height: 200px;
  border-radius: var(--radius-control);
  background-color: #F6F4F0;
}
@media (prefers-color-scheme: dark) {
  .preview { background-color: #8F897F; }
}
.lines { margin-top: var(--space-4); }
.line {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  padding: 2px 0;
}
.line [data-role="label"] {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.line [data-role="value"] {
  flex: 0 0 auto;
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.line-option [data-role="label"],
.line-vat, .line-delivery { color: var(--color-muted); }
.line-option [data-role="value"],
.line-delivery [data-role="value"] { color: var(--color-text); }
.line-unit {
  margin-top: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}
.line-discount [data-role="value"] { color: var(--color-accent); }
.line-total {
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border);
}
.line-total [data-role="label"],
.line-total [data-role="value"] {
  font-size: var(--text-xl);
  line-height: 36px;
  font-weight: 700;
}
.line-vat, .line-delivery { font-size: var(--text-sm); line-height: 20px; }

.promo {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}
.promo-row { display: flex; gap: var(--space-2); }
.promo-row .text-input { flex: 1 1 auto; min-width: 0; width: 100%; }
.promo-applied {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  margin-top: var(--space-2);
}
.promo-status {
  margin: 0;
  flex: 1 1 160px;
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
}
.promo-status.is-active { color: var(--color-accent); }
.order { margin-top: var(--space-5); }
.order-hint {
  margin: var(--space-2) 0 0;
  font-size: var(--text-sm);
  line-height: 20px;
  color: var(--color-muted);
  text-align: center;
}

/* ---------- Notice ---------- */
.notice {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  z-index: 10;
  width: fit-content;
  max-width: min(480px, calc(100% - 32px));
  margin: 0 auto;
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-accent);
  border-radius: var(--radius-control);
  padding: 12px 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

/* ---------- Confirmation ---------- */
.confirmation {
  width: calc(100% - 32px);
  max-width: 560px;
  margin: 0 auto 48px;
}
.confirmation h2 { font-size: var(--text-xl); line-height: 36px; font-weight: 700; }
.confirmation h2:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: var(--radius-control);
}
.confirmation dl { margin: 0 0 var(--space-5); }
.confirmation .row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--space-1) var(--space-4);
  padding: var(--space-3) 0;
  border-top: 1px solid var(--color-border);
}
.confirmation dt { color: var(--color-muted); }
.confirmation dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
    animation-duration: 0s !important;
  }
}
</style>
</head>
<body>
<header class="app-header" data-testid="app-header">
  <div class="app-header-inner"><h1>Claude Fable 5</h1></div>
</header>

<main id="main">
  <div class="configurator" data-testid="configurator">
    <section class="panel" data-testid="section-rider">
      <h2>1. Rider</h2>
      <label class="field-label" for="height-input">Your height (cm)</label>
      <input class="text-input" id="height-input" data-testid="height-input" type="text" inputmode="numeric" autocomplete="off">
      <p class="field-error" id="height-error" data-testid="height-error" hidden>Enter a height between 150 and 200 cm.</p>
      <p class="recommendation" id="height-recommendation" data-testid="height-recommendation" hidden></p>
    </section>
    <section class="panel" data-testid="section-frame">
      <h2>2. Frame</h2>
      <div class="grid grid-frame" id="grid-frame"></div>
      <p class="frame-warning" id="frame-warning" data-testid="frame-warning" hidden></p>
    </section>
    <section class="panel" data-testid="section-wheels">
      <h2>3. Wheels</h2>
      <div class="grid grid-wheels" id="grid-wheels"></div>
    </section>
    <section class="panel" data-testid="section-drivetrain">
      <h2>4. Drivetrain</h2>
      <div class="grid grid-drivetrain" id="grid-drivetrain"></div>
    </section>
    <section class="panel" data-testid="section-color">
      <h2>5. Color</h2>
      <div class="grid grid-color" id="grid-color"></div>
    </section>
    <section class="panel" data-testid="section-accessories">
      <h2>6. Accessories</h2>
      <div class="grid grid-accessory" id="grid-accessory"></div>
    </section>
    <section class="panel" data-testid="section-quantity">
      <h2>7. Quantity</h2>
      <div class="stepper">
        <button class="btn-secondary btn-step" type="button" id="qty-decrease" data-testid="qty-decrease" aria-label="Decrease quantity">&#x2212;</button>
        <span class="qty-value" id="qty-value" data-testid="qty-value">1</span>
        <button class="btn-secondary btn-step" type="button" id="qty-increase" data-testid="qty-increase" aria-label="Increase quantity">+</button>
      </div>
    </section>
  </div>

  <aside class="summary panel" data-testid="summary">
    <svg class="preview" id="bike-preview" data-testid="bike-preview" viewBox="0 0 400 260" role="img" aria-label="Bike preview"></svg>
    <div class="lines" id="lines"></div>
    <div class="promo">
      <label class="field-label" for="promo-input">Promo code</label>
      <div class="promo-row">
        <input class="text-input" id="promo-input" data-testid="promo-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn-secondary" type="button" id="promo-apply" data-testid="promo-apply" disabled>Apply</button>
      </div>
      <p class="field-error" id="promo-error" data-testid="promo-error" hidden>This code is not valid.</p>
      <div class="promo-applied" id="promo-applied" hidden>
        <p class="promo-status" id="promo-status" data-testid="promo-status"></p>
        <button class="btn-secondary" type="button" id="promo-remove" data-testid="promo-remove">Remove code</button>
      </div>
    </div>
    <div class="order">
      <button class="btn-primary" type="button" id="order-button" data-testid="order-button" disabled>Order 1 bike</button>
      <p class="order-hint" id="order-hint" data-testid="order-hint">Enter your height to continue.</p>
    </div>
  </aside>
</main>

<div role="status" id="status"></div>

<section class="panel confirmation" id="confirmation" data-testid="confirmation" hidden>
  <h2 id="confirmation-title" data-testid="confirmation-title" tabindex="-1">Order confirmed</h2>
  <dl>
    <div class="row"><dt>Reference</dt><dd id="confirmation-reference" data-testid="confirmation-reference"></dd></div>
    <div class="row"><dt>Total</dt><dd id="confirmation-total" data-testid="confirmation-total"></dd></div>
    <div class="row"><dt>Estimated delivery</dt><dd id="confirmation-delivery" data-testid="confirmation-delivery"></dd></div>
  </dl>
  <button class="btn-secondary" type="button" id="confirmation-new" data-testid="confirmation-new">Configure another bike</button>
</section>

<script>
(function () {
  'use strict';

  /* ---------- Catalog ---------- */
  var FRAMES = [
    { id: 'S', name: 'Frame S', min: 150, max: 164, price: 119000 },
    { id: 'M', name: 'Frame M', min: 165, max: 174, price: 119000 },
    { id: 'L', name: 'Frame L', min: 175, max: 184, price: 124000 },
    { id: 'XL', name: 'Frame XL', min: 185, max: 200, price: 129000 }
  ];
  var WHEELS = [
    { id: '275', name: '27.5" wheels', price: 0, r: 70 },
    { id: '29', name: '29" wheels', price: 12000, r: 76, reason: 'Not available with frame S' }
  ];
  var DRIVETRAINS = [
    { id: 'essential', name: 'Essential 1×10', price: 0, lead: 5 },
    { id: 'sport', name: 'Sport 1×12', price: 24000, lead: 7 },
    { id: 'pro', name: 'Pro Electronic 2×12', price: 69000, lead: 12 }
  ];
  var COLORS = [
    { id: 'graphite', name: 'Graphite', hex: '#3A3A3C', price: 0 },
    { id: 'sand', name: 'Sand', hex: '#D8C7A6', price: 0 },
    { id: 'red', name: 'Racing Red', hex: '#C8102E', price: 6000 },
    { id: 'glacier', name: 'Glacier', hex: '#A9D6E5', price: 0, reason: 'Out of stock', outOfStock: true }
  ];
  var ACCESSORIES = [
    { id: 'mudguards', name: 'Mudguards', price: 4500 },
    { id: 'rack', name: 'Rear rack', price: 6900 },
    { id: 'lights', name: 'Lights', price: 3990 },
    { id: 'kickstand', name: 'Kickstand', price: 2450 }
  ];
  var GROUPS = { frame: FRAMES, wheels: WHEELS, drivetrain: DRIVETRAINS, color: COLORS, accessory: ACCESSORIES };
  var CODES = ['SPRING10', 'WELCOME50', 'FREESHIP'];
  var CLOSED = { '2026-12-24': 1, '2026-12-25': 1, '2026-12-31': 1, '2027-01-01': 1 };
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var MSG_WHEELS = '29" wheels were replaced by 27.5" wheels: not available with frame S.';
  var MSG_MUDGUARDS = 'Mudguards were added: required by the rear rack.';
  var MSG_RACK = 'Rear rack was removed: it requires mudguards.';
  var MINUS = '−';
  var DASH = '—';

  /* ---------- State ---------- */
  var state;
  var orderCount = 0;

  function initialState() {
    return {
      heightRaw: '',
      auto: true,
      frame: null,
      wheels: '275',
      drivetrain: 'essential',
      color: 'graphite',
      accessories: { mudguards: false, rack: false, lights: false, kickstand: false },
      quantity: 1,
      code: null,
      promoError: false,
      notice: null
    };
  }

  /* ---------- Helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function find(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function pad(n, len) {
    var s = String(n);
    while (s.length < len) s = '0' + s;
    return s;
  }
  // Integer division of non-negative integers, rounded half up.
  function roundDiv(n, d) {
    var x = 2 * n + d;
    var y = 2 * d;
    return (x - x % y) / y;
  }
  function amount(cents) {
    var c = cents % 100;
    var euros = String((cents - c) / 100).replace(/\B(?=(\d{3})+$)/g, ',');
    return '€' + euros + '.' + pad(c, 2);
  }
  function signed(cents) { return cents === 0 ? 'Included' : '+' + amount(cents); }
  function discount(cents) { return MINUS + amount(cents); }
  function formatDate(d) {
    return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  function isBusinessDay(d) {
    var day = d.getDay();
    if (day === 0 || day === 6) return false;
    return !CLOSED[d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2)];
  }

  /* ---------- Derived values ---------- */
  function validHeight() {
    var t = state.heightRaw.trim();
    if (!/^[0-9]+$/.test(t)) return null;
    var h = Number(t);
    return h >= 150 && h <= 200 ? h : null;
  }
  function heightHasError() {
    return state.heightRaw.trim() !== '' && validHeight() === null;
  }
  function recommendedFrame(h) {
    for (var i = 0; i < FRAMES.length; i++) if (h >= FRAMES[i].min && h <= FRAMES[i].max) return FRAMES[i].id;
    return null;
  }
  function colorSurcharge() {
    if (state.color === 'red' && state.drivetrain === 'pro') return 0;
    return find(COLORS, state.color).price;
  }
  function compute() {
    var p = { hasFrame: state.frame !== null };
    var qty = state.quantity;
    var code = state.code;
    p.promoActive = false;
    if (code === 'FREESHIP') p.promoActive = true;
    if (code === 'WELCOME50') p.promoActive = qty < 3;
    if (!p.hasFrame) return p;

    var unit = find(FRAMES, state.frame).price + find(WHEELS, state.wheels).price +
      find(DRIVETRAINS, state.drivetrain).price + colorSurcharge();
    ACCESSORIES.forEach(function (a) { if (state.accessories[a.id]) unit += a.price; });
    p.unit = unit;
    p.subtotal = unit * qty;
    p.qtyDiscount = qty >= 3 ? roundDiv(p.subtotal * 5, 100) : 0;
    p.afterQty = p.subtotal - p.qtyDiscount;
    if (code === 'SPRING10') p.promoActive = p.afterQty >= 150000;
    p.promoDiscount = 0;
    if (p.promoActive && code === 'SPRING10') p.promoDiscount = roundDiv(p.afterQty * 10, 100);
    if (p.promoActive && code === 'WELCOME50') p.promoDiscount = 5000;
    p.merchandise = p.afterQty - p.promoDiscount;
    p.shipping = (code === 'FREESHIP' || p.merchandise >= 200000) ? 0 : 4900;
    p.total = p.merchandise + p.shipping;
    p.vat = roundDiv(p.total * 20, 120);
    return p;
  }
  function deliveryDate() {
    var lead = find(DRIVETRAINS, state.drivetrain).lead +
      (state.color === 'red' ? 3 : 0) + (state.quantity >= 3 ? 2 : 0);
    var now = new Date();
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var count = 0;
    while (count < lead) {
      d.setDate(d.getDate() + 1);
      if (isBusinessDay(d)) count++;
    }
    return d;
  }

  /* ---------- Build the cards ---------- */
  var CHECK_SVG = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.2 4.2 7.4 8 3"/></svg>';
  var inputs = {};

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function buildCards(group) {
    var grid = $('grid-' + group);
    inputs[group] = {};
    GROUPS[group].forEach(function (opt) {
      var nameId = 'name-' + group + '-' + opt.id;
      var card = el('label', { 'class': 'card', 'data-testid': 'card-' + group + '-' + opt.id });
      var input = el('input', {
        type: group === 'accessory' ? 'checkbox' : 'radio',
        name: group === 'accessory' ? 'accessory-' + opt.id : group,
        value: opt.id,
        'aria-labelledby': nameId
      });
      if (opt.outOfStock) input.disabled = true;
      card.appendChild(input);
      if (group === 'frame') {
        var badge = el('span', { 'data-role': 'badge' }, 'Recommended');
        badge.hidden = true;
        card.appendChild(badge);
      }
      if (group === 'color') {
        var swatch = el('span', { 'data-role': 'swatch' });
        swatch.style.backgroundColor = opt.hex;
        card.appendChild(swatch);
      }
      card.appendChild(el('span', { 'data-role': 'name', id: nameId }, opt.name));
      card.appendChild(el('span', { 'data-role': 'price' }));
      if (group === 'wheels' || group === 'color') {
        var slot = el('span', { 'class': 'reason-slot' });
        slot.style.display = 'block';
        if (opt.reason) slot.appendChild(el('span', { 'data-role': 'reason' }, opt.reason));
        card.appendChild(slot);
      }
      var check = el('span', { 'data-role': 'check', 'aria-hidden': 'true' });
      check.innerHTML = CHECK_SVG;
      card.appendChild(check);
      grid.appendChild(card);
      inputs[group][opt.id] = input;

      if (group === 'frame') {
        // Any activation of a frame card, even the selected one, is a manual choice.
        input.addEventListener('click', function () { state.auto = false; });
      }
      input.addEventListener('change', function () { onOptionChange(group, opt.id, input.checked); });
    });
  }

  /* ---------- Changes ---------- */
  function selectFrame(id) {
    state.frame = id;
    if (id === 'S' && state.wheels === '29') {
      state.wheels = '275';
      state.notice = MSG_WHEELS;
    }
  }

  function onOptionChange(group, id, checked) {
    state.notice = null;
    if (group === 'frame') {
      selectFrame(id);
    } else if (group === 'wheels') {
      if (!(id === '29' && state.frame === 'S')) state.wheels = id;
    } else if (group === 'drivetrain') {
      state.drivetrain = id;
    } else if (group === 'color') {
      if (!find(COLORS, id).outOfStock) state.color = id;
    } else {
      state.accessories[id] = checked;
      if (id === 'rack' && checked && !state.accessories.mudguards) {
        state.accessories.mudguards = true;
        state.notice = MSG_MUDGUARDS;
      } else if (id === 'mudguards' && !checked && state.accessories.rack) {
        state.accessories.rack = false;
        state.notice = MSG_RACK;
      }
    }
    render();
  }

  function onHeightInput() {
    var raw = $('height-input').value;
    if (raw !== state.heightRaw) {
      state.heightRaw = raw;
      state.notice = null;
      var h = validHeight();
      if (h !== null && state.auto) selectFrame(recommendedFrame(h));
    }
    render();
  }

  function changeQuantity(delta) {
    var q = state.quantity + delta;
    if (q < 1 || q > 5) return;
    state.quantity = q;
    state.notice = null;
    render();
  }

  function applyPromo() {
    var input = $('promo-input');
    var raw = input.value.trim();
    if (raw === '') return;
    var code = raw.toUpperCase();
    if (CODES.indexOf(code) !== -1) {
      state.code = code;
      state.promoError = false;
      input.value = '';
    } else {
      state.promoError = true;
    }
    render();
  }

  /* ---------- Rendering ---------- */
  function setError(input, errorEl, visible) {
    errorEl.hidden = !visible;
    if (visible) {
      input.setAttribute('aria-invalid', 'true');
      input.setAttribute('aria-describedby', errorEl.id);
    } else {
      input.removeAttribute('aria-invalid');
      input.removeAttribute('aria-describedby');
    }
  }

  function renderCards() {
    var h = validHeight();
    var rec = h === null ? null : recommendedFrame(h);
    FRAMES.forEach(function (f) {
      var input = inputs.frame[f.id];
      input.checked = state.frame === f.id;
      var card = input.parentNode;
      card.querySelector('[data-role="price"]').textContent = amount(f.price);
      card.querySelector('[data-role="badge"]').hidden = rec !== f.id;
    });
    WHEELS.forEach(function (w) {
      var input = inputs.wheels[w.id];
      input.disabled = w.id === '29' && state.frame === 'S';
      input.checked = state.wheels === w.id;
      input.parentNode.querySelector('[data-role="price"]').textContent = signed(w.price);
    });
    DRIVETRAINS.forEach(function (d) {
      var input = inputs.drivetrain[d.id];
      input.checked = state.drivetrain === d.id;
      input.parentNode.querySelector('[data-role="price"]').textContent = signed(d.price);
    });
    COLORS.forEach(function (c) {
      var input = inputs.color[c.id];
      input.checked = state.color === c.id;
      var text = signed(c.price);
      if (c.id === 'red' && state.drivetrain === 'pro') text = 'Included with Pro';
      input.parentNode.querySelector('[data-role="price"]').textContent = text;
    });
    ACCESSORIES.forEach(function (a) {
      var input = inputs.accessory[a.id];
      input.checked = !!state.accessories[a.id];
      input.parentNode.querySelector('[data-role="price"]').textContent = signed(a.price);
    });
  }

  function renderRider() {
    var h = validHeight();
    setError($('height-input'), $('height-error'), heightHasError());
    var rec = $('height-recommendation');
    var warn = $('frame-warning');
    var recId = h === null ? null : recommendedFrame(h);
    rec.hidden = recId === null;
    rec.textContent = recId === null ? '' : 'Recommended frame: ' + recId;

    var showWarn = false;
    if (recId !== null && state.frame !== null) {
      var order = FRAMES.map(function (f) { return f.id; });
      var gap = order.indexOf(state.frame) - order.indexOf(recId);
      if (Math.abs(gap) >= 2) {
        showWarn = true;
        warn.textContent = 'Frame ' + state.frame + ' is ' + Math.abs(gap) + ' sizes ' +
          (gap > 0 ? 'larger' : 'smaller') + ' than recommended.';
      }
    }
    warn.hidden = !showWarn;
    if (!showWarn) warn.textContent = '';
  }

  function renderSummary(p, delivery) {
    var lines = [];
    function add(key, label, value, cls) { lines.push({ key: key, label: label, value: value, cls: cls }); }
    var money = function (v) { return p.hasFrame ? amount(v) : DASH; };

    if (p.hasFrame) add('frame', 'Frame ' + state.frame, amount(find(FRAMES, state.frame).price), 'line-option');
    else add('frame', 'Frame', DASH, 'line-option');
    var w = find(WHEELS, state.wheels);
    add('wheels', w.name, signed(w.price), 'line-option');
    var d = find(DRIVETRAINS, state.drivetrain);
    add('drivetrain', d.name, signed(d.price), 'line-option');
    add('color', find(COLORS, state.color).name, signed(colorSurcharge()), 'line-option');
    ACCESSORIES.forEach(function (a) {
      if (state.accessories[a.id]) add('accessory-' + a.id, a.name, signed(a.price), 'line-option');
    });
    add('unit', 'Unit price', money(p.unit), 'line-unit');
    add('quantity', 'Quantity', '× ' + state.quantity, '');
    add('subtotal', 'Subtotal', money(p.subtotal), '');
    if (p.hasFrame && state.quantity >= 3) {
      add('qty-discount', 'Quantity discount (5%)', discount(p.qtyDiscount), 'line-discount');
    }
    if (p.hasFrame && state.code && p.promoActive && p.promoDiscount > 0) {
      add('promo', 'Code ' + state.code, discount(p.promoDiscount), 'line-discount');
    }
    add('shipping', 'Shipping', p.hasFrame ? (p.shipping === 0 ? 'Free' : amount(p.shipping)) : DASH, '');
    add('total', 'Total', money(p.total), 'line-total');
    add('vat', 'Including VAT (20%)', money(p.vat), 'line-vat');
    add('delivery', 'Estimated delivery', formatDate(delivery), 'line-delivery');

    var box = $('lines');
    var frag = document.createDocumentFragment();
    lines.forEach(function (l) {
      var row = el('div', { 'class': ('line ' + l.cls).trim(), 'data-testid': 'summary-line-' + l.key });
      row.appendChild(el('span', { 'data-role': 'label' }, l.label));
      row.appendChild(el('span', { 'data-role': 'value' }, l.value));
      frag.appendChild(row);
    });
    box.replaceChildren(frag);
  }

  function renderPromo(p) {
    var input = $('promo-input');
    $('promo-apply').disabled = input.value.trim() === '';
    setError(input, $('promo-error'), state.promoError);
    var applied = $('promo-applied');
    var status = $('promo-status');
    applied.hidden = state.code === null;
    if (state.code === null) {
      status.textContent = '';
      return;
    }
    if (p.promoActive) status.textContent = 'Code ' + state.code + ' applied.';
    else if (state.code === 'SPRING10') status.textContent = 'SPRING10 requires €1,500.00 or more after the quantity discount.';
    else status.textContent = 'WELCOME50 cannot be combined with the quantity discount.';
    status.classList.toggle('is-active', p.promoActive);
  }

  function renderNotice() {
    var status = $('status');
    var current = status.firstElementChild;
    if (state.notice === null) {
      if (current) status.replaceChildren();
      return;
    }
    if (current && current.textContent === state.notice) return;
    status.replaceChildren(el('div', { 'class': 'notice', 'data-testid': 'notice' }, state.notice));
  }

  function arcPath(cx, cy, r, from, to) {
    function pt(deg) {
      var a = deg * Math.PI / 180;
      return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
    }
    return 'M' + pt(from) + ' A' + r + ' ' + r + ' 0 0 1 ' + pt(to);
  }

  function renderPreview() {
    var hex = find(COLORS, state.color).hex;
    var r = find(WHEELS, state.wheels).r;
    var acc = state.accessories;
    var RX = 110, FX = 300, AY = 170;
    var tire = '#1B1A18', metal = '#67625B';
    var s = '';
    s += '<line x1="24" y1="' + (AY + r + 3) + '" x2="376" y2="' + (AY + r + 3) + '" stroke="' + metal + '" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/>';
    [RX, FX].forEach(function (cx) {
      for (var i = 0; i < 6; i++) {
        var a = (i * 30 + 15) * Math.PI / 180;
        var dx = (r - 4) * Math.cos(a), dy = (r - 4) * Math.sin(a);
        s += '<line x1="' + (cx - dx).toFixed(1) + '" y1="' + (AY - dy).toFixed(1) + '" x2="' + (cx + dx).toFixed(1) + '" y2="' + (AY + dy).toFixed(1) + '" stroke="' + metal + '" stroke-width="0.8" opacity="0.55"/>';
      }
      s += '<circle data-part="wheel" cx="' + cx + '" cy="' + AY + '" r="' + r + '" fill="none" stroke="' + tire + '" stroke-width="6"/>';
    });
    if (acc.mudguards) {
      s += '<path data-part="mudguard" d="' + arcPath(RX, AY, r + 8, 185, 345) + '" fill="none" stroke="' + tire + '" stroke-width="3" stroke-linecap="round"/>';
      s += '<path data-part="mudguard" d="' + arcPath(FX, AY, r + 8, 215, 335) + '" fill="none" stroke="' + tire + '" stroke-width="3" stroke-linecap="round"/>';
    }
    if (acc.rack) {
      var ry = AY - r - 15;
      s += '<path data-part="rack" d="M58 ' + ry + ' H170 M76 ' + ry + ' L' + RX + ' ' + AY + ' M142 ' + ry + ' L' + RX + ' ' + AY + '" fill="none" stroke="' + metal + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    if (acc.kickstand) {
      s += '<line data-part="kickstand" x1="186" y1="182" x2="164" y2="' + (AY + r + 2) + '" stroke="' + metal + '" stroke-width="4" stroke-linecap="round"/>';
    }
    // Seat post, saddle, stem and handlebar
    s += '<path d="M172 78 L168 60 M152 59 H186" fill="none" stroke="' + tire + '" stroke-width="5" stroke-linecap="round"/>';
    s += '<path d="M275 80 L271 60 L292 55" fill="none" stroke="' + tire + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
    // Frame
    var fa = ' data-part="frame" fill="none" stroke="' + hex + '" stroke-width="7" stroke-linecap="round"';
    s += '<line' + fa + ' x1="' + RX + '" y1="' + AY + '" x2="195" y2="178"/>';
    s += '<line' + fa + ' x1="' + RX + '" y1="' + AY + '" x2="172" y2="78"/>';
    s += '<line' + fa + ' x1="195" y1="178" x2="172" y2="78"/>';
    s += '<line' + fa + ' x1="172" y1="78" x2="275" y2="80"/>';
    s += '<line' + fa + ' x1="195" y1="178" x2="282" y2="104"/>';
    s += '<line' + fa + ' x1="275" y1="80" x2="282" y2="104"/>';
    s += '<line' + fa + ' x1="282" y1="104" x2="' + FX + '" y2="' + AY + '"/>';
    // Crankset and hubs
    s += '<circle cx="195" cy="178" r="13" fill="none" stroke="' + metal + '" stroke-width="3"/>';
    s += '<path d="M195 178 L207 200 M200 200 H214" fill="none" stroke="' + tire + '" stroke-width="4" stroke-linecap="round"/>';
    s += '<circle cx="' + RX + '" cy="' + AY + '" r="5" fill="' + metal + '"/>';
    s += '<circle cx="' + FX + '" cy="' + AY + '" r="5" fill="' + metal + '"/>';
    if (acc.lights) {
      s += '<circle data-part="light" cx="291" cy="90" r="6" fill="#F5B700" stroke="' + tire + '" stroke-width="1.5"/>';
    }
    $('bike-preview').innerHTML = s;
  }

  function render() {
    var p = compute();
    var delivery = deliveryDate();
    var h = validHeight();

    renderCards();
    renderRider();
    renderPreview();
    renderSummary(p, delivery);
    renderPromo(p);
    renderNotice();

    $('qty-value').textContent = String(state.quantity);
    $('qty-decrease').disabled = state.quantity <= 1;
    $('qty-increase').disabled = state.quantity >= 5;

    var order = $('order-button');
    order.textContent = state.quantity === 1 ? 'Order 1 bike' : 'Order ' + state.quantity + ' bikes';
    order.disabled = h === null || state.frame === null;
    $('order-hint').hidden = h !== null;
    return { price: p, delivery: delivery };
  }

  /* ---------- Order ---------- */
  function placeOrder() {
    if (validHeight() === null || state.frame === null) return;
    state.notice = null;
    var r = render();
    orderCount++;
    var now = new Date();
    $('confirmation-reference').textContent = 'BK-' + now.getFullYear() + pad(now.getMonth() + 1, 2) +
      pad(now.getDate(), 2) + '-' + pad(orderCount, 3);
    $('confirmation-total').textContent = amount(r.price.total);
    $('confirmation-delivery').textContent = formatDate(r.delivery);
    $('main').hidden = true;
    $('confirmation').hidden = false;
    $('confirmation-title').focus();
    window.scrollTo(0, 0);
  }

  function newConfiguration() {
    state = initialState();
    $('height-input').value = '';
    $('promo-input').value = '';
    $('confirmation').hidden = true;
    $('main').hidden = false;
    render();
    $('height-input').focus();
  }

  /* ---------- Start ---------- */
  state = initialState();
  ['frame', 'wheels', 'drivetrain', 'color', 'accessory'].forEach(buildCards);
  $('height-input').value = '';
  $('promo-input').value = '';

  $('height-input').addEventListener('input', onHeightInput);
  $('qty-decrease').addEventListener('click', function () { changeQuantity(-1); });
  $('qty-increase').addEventListener('click', function () { changeQuantity(1); });
  $('promo-input').addEventListener('input', function () {
    state.promoError = false;
    render();
  });
  $('promo-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      if (!$('promo-apply').disabled) applyPromo();
    }
  });
  $('promo-apply').addEventListener('click', applyPromo);
  $('promo-remove').addEventListener('click', function () {
    state.code = null;
    render();
  });
  $('order-button').addEventListener('click', placeOrder);
  $('confirmation-new').addEventListener('click', newConfiguration);

  render();
})();
</script>
</body>
</html>
