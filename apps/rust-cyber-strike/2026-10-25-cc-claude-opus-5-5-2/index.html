<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opus 5.5</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05030c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  h1 {
    position: fixed; top: 8px; left: 12px; margin: 0; z-index: 1; pointer-events: none;
    font: 600 16px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #c9b8ff; letter-spacing: .04em; text-shadow: 0 0 8px #6a3cff;
  }
  canvas {
    display: block;
    width: min(100vw, 45vh);
    width: min(100vw, 45dvh);
    height: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Narrow portrait screens: no side margin, so the title sits above the table. */
  @media (max-aspect-ratio: 11/20) {
    body { flex-direction: column; justify-content: flex-start; }
    h1 { position: static; padding: 4px 0 2px; font-size: 15px; height: 20px; }
    canvas {
      width: min(100vw, calc((100vh - 26px) * 0.45));
      width: min(100vw, calc((100dvh - 26px) * 0.45));
    }
  }
</style>
</head>
<body>
<h1>Opus 5.5</h1>
<canvas id="c" width="540" height="1200"></canvas>
<script>
(async () => {
  const STORE_KEY = 'cyber_strike_hiscores';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---- load and instantiate the module
  const bytes = await (await fetch('./pinball.wasm')).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, {});
  const ex = instance.exports;
  ex.init((Date.now() >>> 0) ^ 0x5bd1e995);

  // ---- system log lines exposed by Rust -> browser console
  const decoder = new TextDecoder();
  function flushLogs() {
    const n = ex.log_len();
    if (n === 0) return;
    const text = decoder.decode(new Uint8Array(ex.memory.buffer, ex.log_ptr(), n));
    ex.log_clear();
    for (const line of text.split('\n')) if (line) console.log(line);
  }

  // ---- high-score bytes <-> localStorage
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved && /^([0-9a-f]{2})+$/.test(saved)) {
      const data = new Uint8Array(saved.length / 2);
      for (let i = 0; i < data.length; i++) data[i] = parseInt(saved.substr(i * 2, 2), 16);
      const ptr = ex.hiscore_buf(data.length);
      new Uint8Array(ex.memory.buffer, ptr, data.length).set(data);
      ex.hiscore_load();
    }
  } catch (e) { /* storage unavailable */ }
  function saveHiscores() {
    try {
      const n = ex.hiscore_len();
      const ptr = ex.hiscore_ptr();
      const view = new Uint8Array(ex.memory.buffer, ptr, n);
      let hex = '';
      for (const b of view) hex += b.toString(16).padStart(2, '0');
      localStorage.setItem(STORE_KEY, hex);
    } catch (e) { /* storage unavailable */ }
  }
  flushLogs();

  // ---- audio: copy the Rust sample buffers to Web Audio.
  // The worklet below only plays the sample blocks it receives (no synthesis in JS).
  const WORKLET_SRC = `
    class RustSamples extends AudioWorkletProcessor {
      constructor() {
        super();
        this.q = [];
        this.off = 0;
        this.port.onmessage = (e) => { this.q.push(e.data); if (this.q.length > 64) this.q.shift(); };
      }
      process(_inputs, outputs) {
        const L = outputs[0][0], R = outputs[0][1] || outputs[0][0];
        let i = 0;
        while (i < L.length && this.q.length) {
          const c = this.q[0], n = Math.min(L.length - i, c[0].length - this.off);
          L.set(c[0].subarray(this.off, this.off + n), i);
          R.set(c[1].subarray(this.off, this.off + n), i);
          i += n; this.off += n;
          if (this.off >= c[0].length) { this.q.shift(); this.off = 0; }
        }
        L.fill(0, i);
        if (R !== L) R.fill(0, i);
        return true;
      }
    }
    registerProcessor('rust-samples', RustSamples);`;
  let actx = null, worklet = null, sent = 0, t0 = 0;
  async function ensureAudio() {
    if (actx) {
      if (actx.state === 'suspended') actx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC({ latencyHint: 'interactive' });
    ex.audio_init(actx.sampleRate);
    if (actx.audioWorklet) {
      try {
        const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'text/javascript' }));
        await actx.audioWorklet.addModule(url);
        const node = new AudioWorkletNode(actx, 'rust-samples', { numberOfInputs: 0, outputChannelCount: [2] });
        node.connect(actx.destination);
        t0 = actx.currentTime;
        sent = 0;
        worklet = node;
        return;
      } catch (e) { /* fall back below */ }
    }
    // Fallback for origins without AudioWorklet (plain http on a LAN address)
    const node = actx.createScriptProcessor(1024, 1, 2);
    node.onaudioprocess = (ev) => {
      const out = ev.outputBuffer;
      const n = ex.audio_render(out.length);
      out.getChannelData(0).set(new Float32Array(ex.memory.buffer, ex.audio_left_ptr(), n));
      out.getChannelData(1).set(new Float32Array(ex.memory.buffer, ex.audio_right_ptr(), n));
    };
    node.connect(actx.destination);
  }
  // Keep about 50 ms of Rust-rendered samples queued in the worklet.
  function pumpAudio() {
    if (!worklet) return;
    const sr = actx.sampleRate;
    let buffered = sent - Math.floor((actx.currentTime - t0) * sr);
    if (buffered < 0) { t0 = actx.currentTime; sent = 0; buffered = 0; }
    const target = Math.round(sr * 0.05);
    while (buffered < target) {
      const n = ex.audio_render(512);
      const l = new Float32Array(ex.memory.buffer, ex.audio_left_ptr(), n).slice();
      const r = new Float32Array(ex.memory.buffer, ex.audio_right_ptr(), n).slice();
      worklet.port.postMessage([l, r], [l.buffer, r.buffer]);
      sent += n;
      buffered += n;
    }
  }

  // ---- keyboard -> Rust (Rust says which keys it uses)
  const usedKeys = new Set();
  addEventListener('keydown', (e) => {
    ensureAudio();
    if (e.repeat) {
      if (usedKeys.has(e.keyCode)) e.preventDefault();
      return;
    }
    if (ex.key_down(e.keyCode)) {
      usedKeys.add(e.keyCode);
      e.preventDefault();
    }
  });
  addEventListener('keyup', (e) => {
    if (ex.key_up(e.keyCode)) e.preventDefault();
  });

  // ---- pointer / touch -> Rust, in canvas pixel coordinates
  const W = ex.fb_width(), H = ex.fb_height();
  canvas.width = W;
  canvas.height = H;
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  }
  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const [x, y] = toCanvas(e);
    ex.pointer_down(e.pointerId, x, y);
    e.preventDefault();
  });
  const up = (e) => ex.pointer_up(e.pointerId);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- frame loop: Rust simulates and draws, JS copies the pixels
  const image = new ImageData(W, H);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(Math.max(now - last, 0), 50);
    last = now;
    ex.frame(dt);
    pumpAudio();
    image.data.set(new Uint8ClampedArray(ex.memory.buffer, ex.fb_ptr(), W * H * 4));
    ctx.putImageData(image, 0, 0);
    flushLogs();
    if (ex.hiscore_dirty()) saveHiscores();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
