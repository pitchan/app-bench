<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Opus 5.5</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05030c; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: center; }
  h1 { position: fixed; top: 8px; left: 12px; margin: 0; font: 600 18px system-ui, sans-serif;
       color: #20e0ff; pointer-events: none; z-index: 1; }
  canvas { display: block; height: min(100vh, 200vw); width: auto; aspect-ratio: 1 / 2;
           touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<h1>Opus 5.5</h1>
<canvas id="c"></canvas>
<script>
(async () => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const AC = window.AudioContext || window.webkitAudioContext;
  const actx = AC ? new AC() : null;

  const { instance } = await WebAssembly.instantiate(await (await fetch('./pinball.wasm')).arrayBuffer(), {});
  const w = instance.exports;
  const mem = w.memory;
  w.init((Math.random() * 0xffffffff) >>> 0, actx ? actx.sampleRate : 44100);

  // High-score bytes
  const HS_KEY = 'cyber_strike_hs';
  try {
    const saved = localStorage.getItem(HS_KEY);
    if (saved) {
      const bytes = new Uint8Array(mem.buffer, w.hs_ptr(), w.hs_len());
      for (let i = 0; i < bytes.length && i * 2 < saved.length; i++) bytes[i] = parseInt(saved.substr(i * 2, 2), 16);
      w.hs_load();
    }
  } catch (e) {}

  const W = w.fb_width(), H = w.fb_height();
  canvas.width = W; canvas.height = H;
  const img = ctx.createImageData(W, H);
  const dec = new TextDecoder();

  // Audio: copy the Rust sample buffer into Web Audio
  if (actx) {
    const node = actx.createScriptProcessor(2048, 0, 2);
    node.onaudioprocess = (ev) => {
      const out0 = ev.outputBuffer.getChannelData(0);
      const out1 = ev.outputBuffer.getChannelData(1);
      const n = out0.length;
      const ptr = w.audio_fill(n);
      const src = new Float32Array(mem.buffer, ptr, n);
      out0.set(src); out1.set(src);
    };
    node.connect(actx.destination);
  }
  const wake = () => { if (actx && actx.state !== 'running') actx.resume(); };

  // Keyboard
  const KEYS = { Enter: 0, ArrowLeft: 1, KeyZ: 1, ArrowRight: 2, KeyM: 2, Space: 3, KeyX: 4 };
  const onKey = (down) => (e) => {
    const k = KEYS[e.code];
    if (k === undefined) return;
    e.preventDefault();
    wake();
    if (e.repeat) return;
    w.key(k, down ? 1 : 0);
  };
  addEventListener('keydown', onKey(true));
  addEventListener('keyup', onKey(false));

  // Pointer and touch
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  canvas.addEventListener('pointerdown', (e) => { wake(); canvas.setPointerCapture(e.pointerId); const [x, y] = pos(e); w.pointer(e.pointerId, x, y, 1); e.preventDefault(); });
  canvas.addEventListener('pointermove', (e) => { const [x, y] = pos(e); w.pointer(e.pointerId, x, y, 2); });
  const up = (e) => { const [x, y] = pos(e); w.pointer(e.pointerId, x, y, 0); };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(50, now - last); last = now;
    w.frame(dt);
    img.data.set(new Uint8ClampedArray(mem.buffer, w.fb_ptr(), W * H * 4));
    ctx.putImageData(img, 0, 0);
    const n = w.log_take();
    if (n) for (const line of dec.decode(new Uint8Array(mem.buffer, w.log_ptr(), n)).split('\n')) if (line) console.log(line);
    if (w.hs_dirty()) {
      const b = new Uint8Array(mem.buffer, w.hs_ptr(), w.hs_len());
      try { localStorage.setItem(HS_KEY, Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('')); } catch (e) {}
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
