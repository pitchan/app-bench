<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>GPT-6</title><link rel="icon" href="data:,">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09080f}body{display:flex;align-items:center;justify-content:center}canvas{display:block;width:min(100vw,144vh);height:min(100vh,69.444vw);object-fit:contain;touch-action:none;outline:none}</style></head>
<body><canvas id="game" width="1440" height="1000" tabindex="0" aria-label="GPT-6. Cyber Strike pinball. Enter to start, arrows or Z and M for flippers, hold Space to launch, X to nudge."></canvas>
<script>
(async()=>{
 const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
 const {instance}=await WebAssembly.instantiate(await (await fetch('./pinball.wasm')).arrayBuffer(),{}),w=instance.exports;
 w.init();
 try{const saved=JSON.parse(localStorage.getItem('cyber-strike-scores')||'null');if(saved&&saved.length===w.save_len())new Uint8Array(w.memory.buffer,w.save_ptr(),w.save_len()).set(saved);w.restore();}catch(e){}
 let ac,scheduled=0,last=0,savedVersion=-1;
 function unlock(){if(!ac){ac=new AudioContext();w.audio_rate(ac.sampleRate);scheduled=ac.currentTime;}if(ac.state==='suspended')ac.resume();}
 const keys={Enter:0,ArrowLeft:1,KeyZ:1,ArrowRight:2,KeyM:2,Space:3,KeyX:4,KeyS:5};
 addEventListener('keydown',e=>{if(e.code in keys){e.preventDefault();unlock();if(!e.repeat)w.key(keys[e.code],1);}});
 addEventListener('keyup',e=>{if(e.code in keys){e.preventDefault();w.key(keys[e.code],0);}});
 addEventListener('blur',()=>w.release_inputs());
 function pointer(e,down){const r=canvas.getBoundingClientRect();w.pointer(e.pointerId,(e.clientX-r.left)/r.width*1440,(e.clientY-r.top)/r.height*1000,down);}
 canvas.addEventListener('pointerdown',e=>{unlock();canvas.setPointerCapture(e.pointerId);pointer(e,1);});
 canvas.addEventListener('pointerup',e=>pointer(e,0));canvas.addEventListener('pointercancel',e=>pointer(e,0));
 function frame(t){const dt=last?Math.min((t-last)/1000,.05):1/60;last=t;w.frame(dt);
 ctx.putImageData(new ImageData(new Uint8ClampedArray(w.memory.buffer,w.pixels(),1440*1000*4),1440,1000),0,0);
 if(ac&&ac.state==='running'){if(scheduled<ac.currentTime)scheduled=ac.currentTime;while(scheduled<ac.currentTime+.09){const n=2048;w.audio(n);const b=ac.createBuffer(1,n,ac.sampleRate);b.copyToChannel(new Float32Array(w.memory.buffer,w.audio_ptr(),n),0);const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(scheduled);scheduled+=n/ac.sampleRate;}}
 const v=w.save_version();if(v!==savedVersion){savedVersion=v;try{localStorage.setItem('cyber-strike-scores',JSON.stringify(Array.from(new Uint8Array(w.memory.buffer,w.save_ptr(),w.save_len()))));}catch(e){}}
 if(w.log_len()){console.log(new TextDecoder().decode(new Uint8Array(w.memory.buffer,w.log_ptr(),w.log_len())));w.log_clear();}
 requestAnimationFrame(frame);
 }requestAnimationFrame(frame);
})();
</script></body></html>
