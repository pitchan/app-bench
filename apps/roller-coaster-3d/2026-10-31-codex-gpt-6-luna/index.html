function setCamera(dt){let f=frameAt(state.s),look=f.q.p.clone().add(V(0,2,0));if(camMode==='Front seat'){let front=sample(state.s+2).p;camera.position.copy(front).add(V(0,2.7,0));camera.lookAt(front.clone().addScaledVector(f.tangent,14).add(V(0,1,0)))}else if(camMode==='Chase'){let pos=f.q.p.clone().addScaledVector(f.tangent,-18).add(V(0,9,0));camera.position.lerp(pos,.08);camera.lookAt(look)}else{let pos=V(45+orbit.r*Math.cos(orbit.el)*Math.cos(orbit.az),orbit.r*Math.sin(orbit.el),15+orbit.r*Math.cos(orbit.el)*Math.sin(orbit.az));camera.position.copy(pos);camera.lookAt(V(45,13,15))}}
let accumulator=0,last=performance.now();function loop(now){requestAnimationFrame(loop);let real=Math.min(.1,(now-last)/1000);last=now;if(!state.paused){accumulator+=real*state.scale;let n=0;while(accumulator>=1/120&&n<24){physics(1/120);accumulator-=1/120;n++}}updateTrain();setCamera(real);updateUI();renderer.render(scene,camera)}
function readSettings(){cfg.lift=+$('lift').value;cfg.chain=+$('chain').value;cfg.cars=+$('cars').value;cfg.g=+$('gravity').value;cfg.friction=$('friction').checked;cfg.drag=$('drag').checked;$('liftval').textContent=cfg.lift+' m';$('chainval').textContent=cfg.chain.toFixed(1)+' m/s';$('carsval').textContent=cfg.cars}
for(let id of ['lift','chain','cars','gravity','friction','drag'])$(id).addEventListener('input',()=>{readSettings();rebuild()});$('dispatch').onclick=beginRide;$('reset').onclick=()=>resetRide(true);$('play').onclick=()=>{state.paused=!state.paused;$('play').textContent=state.paused?'Play':'Pause'};$('rate').onchange=()=>state.scale=+$('rate').value;$('camera').onchange=()=>camMode=$('camera').value;addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.key.toLowerCase()==='d')beginRide();if(e.key.toLowerCase()==='r')resetRide(true)});renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.prepend(renderer.domElement);scene=new THREE.Scene();scene.background=new THREE.Color(0x8299a0);scene.fog=new THREE.Fog(0x8299a0,120,290);camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,500);camera.position.set(-13,15,30);readSettings();shape();buildVisual();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{if(camMode==='Orbit'){down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(down){orbit.az-=(e.clientX-px)*.006;orbit.el=clamp(orbit.el+(e.clientY-py)*.005,-.2,1.15);px=e.clientX;py=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('wheel',e=>{if(camMode==='Orbit')orbit.r=clamp(orbit.r+e.deltaY*.08,35,210)});requestAnimationFrame(loop);
window.coasterState=()=>{let p=sample(state.s),g=gLoads(state.s,state.v),phase=state.phase==='free'?'free':state.phase;return {train:{phase,element:elem(state.s).name,distance:state.s,speed:state.v,height:p.p.y,gVertical:g.vertical,gLateral:g.lateral},energy:{kinetic:.5*totalMass*state.v**2,potential:totalMass*cfg.g*p.p.y,dissipated:state.diss},track:{length:trackLen,elements:elements.map(e=>({name:e.name,start:e.start,end:e.end}))},lastRide,settings:{...cfg}}};
})();
