<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
:root{
  --panel:rgba(13,19,27,0.80);
  --line:rgba(255,255,255,0.12);
  --text:#e7edf4;
  --muted:#8f9db0;
  --accent:#5cc8ff;
  --on:#2b6f98;
}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1118;color:var(--text);
  font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.35);}
#ui-left{top:12px;left:12px;width:236px;max-height:calc(100% - 100px);overflow:auto;padding:10px 12px;}
#brand{font-weight:700;font-size:16px;letter-spacing:.3px;margin-bottom:8px;}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:10px 0 6px;}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
#palette button{display:flex;align-items:center;gap:6px;justify-content:flex-start;text-align:left;}
#palette button small{margin-left:auto;color:var(--muted);font-size:10px;}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.25);}
.sw-cork{background:radial-gradient(circle at 30% 30%,#d4a46c,#8a5f35);}
.sw-pine{background:repeating-linear-gradient(0deg,#e0b67c 0 3px,#b9864c 3px 4px);}
.sw-ice{background:linear-gradient(135deg,#f3fbff,#a9d8f2);}
.sw-al{background:linear-gradient(90deg,#c9ced4,#eef1f4,#b5bbc2);}
.sw-steel{background:linear-gradient(135deg,#5a5f66,#2c2f34);}
.sw-custom{background:linear-gradient(135deg,#b48cff,#6b3fd6);}
.sw-plank{background:repeating-linear-gradient(90deg,#e0b67c 0 5px,#b9864c 5px 6px);}
button{font:inherit;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;cursor:pointer;}
button:hover{background:rgba(255,255,255,.14);}
button.on,button.sel{background:var(--on);border-color:#4aa6d8;}
button:disabled{opacity:.4;cursor:default;}
label.ctl{display:block;margin:8px 0;font-size:12px;color:#cfd8e3;}
label.ctl span.v{float:right;color:var(--accent);font-variant-numeric:tabular-nums;}
input[type=range]{width:100%;margin-top:4px;accent-color:#4fb6ee;}
select{width:100%;margin-top:4px;font:inherit;color:var(--text);background:#1a2430;border:1px solid var(--line);border-radius:6px;padding:5px;}
.hint{color:var(--muted);font-size:11px;margin-top:8px;}
#readout{top:12px;right:12px;width:300px;max-height:calc(100% - 100px);overflow:auto;padding:10px 12px;font-size:12px;}
#readout table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
#readout td,#readout th{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;white-space:nowrap;}
#readout th{color:var(--muted);font-weight:500;font-size:11px;}
#readout td.n{text-align:right;}
.kv{display:flex;justify-content:space-between;margin:2px 0;}
.kv b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;}
.st-floating{color:#7fe0a4;} .st-sinking{color:#ffb35c;} .st-bottom{color:#ff8a8a;} .st-settling{color:#9aa7b8;font-style:italic;}
#bar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;
  padding:8px;max-width:calc(100% - 24px);box-sizing:border-box;}
.seg{display:flex;}
.seg button{border-radius:0;margin-left:-1px;}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0;}
.seg button:last-child{border-radius:0 7px 7px 0;}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:rgba(8,12,18,.74);border:1px solid rgba(255,255,255,.16);
  border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.3;white-space:nowrap;color:#e9f0f7;font-variant-numeric:tabular-nums;}
.lbl .t{font-weight:600;}
.lbl.small{font-size:10px;padding:2px 5px;opacity:.9;}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,30,42,.9);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;}
#pausedTag{position:fixed;left:50%;top:44px;transform:translateX(-50%);font-weight:700;letter-spacing:2px;color:#ffd27a;
  text-shadow:0 2px 8px rgba(0,0,0,.6);display:none;pointer-events:none;}
@media (max-width:820px){
  #ui-left{width:190px;font-size:12px;padding:8px;}
  #palette{grid-template-columns:1fr;}
  #readout{display:none;}
  #bar button{padding:5px 7px;font-size:12px;}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="ui-left" class="panel">
  <div id="brand">Claude Opus 5.5</div>
  <div class="sec-t">Objects</div>
  <div id="palette">
    <button data-k="cork"><i class="sw sw-cork"></i>Cork<small>240</small></button>
    <button data-k="pine"><i class="sw sw-pine"></i>Pine<small>500</small></button>
    <button data-k="ice"><i class="sw sw-ice"></i>Ice<small>917</small></button>
    <button data-k="aluminium"><i class="sw sw-al"></i>Alu<small>2700</small></button>
    <button data-k="steel"><i class="sw sw-steel"></i>Steel<small>7850</small></button>
    <button data-k="custom"><i class="sw sw-custom"></i>Custom<small id="palCustom">1500</small></button>
    <button data-k="plank"><i class="sw sw-plank"></i>Plank<small>500</small></button>
  </div>
  <div class="hint" id="hint">Pick an object, then click above the tank to drop it. Drag any object to lift, push or move it.</div>
  <div class="sec-t">Settings</div>
  <label class="ctl">Liquid
    <select id="liquid">
      <option value="water">Fresh water · 1000 kg/m³</option>
      <option value="sea">Sea water · 1025 kg/m³</option>
      <option value="oil">Oil · 880 kg/m³</option>
    </select>
  </label>
  <label class="ctl">Gravity <span class="v" id="gravV">9.81 m/s²</span>
    <input type="range" id="gravity" min="1" max="20" step="0.01" value="9.81">
  </label>
  <label class="ctl">Custom cube density <span class="v" id="cdensV">1500 kg/m³</span>
    <input type="range" id="cdens" min="100" max="3000" step="10" value="1500">
  </label>
  <label class="ctl">Liquid drag <span class="v" id="ldragV">×1.0</span>
    <input type="range" id="ldrag" min="0.2" max="3" step="0.1" value="1">
  </label>
</div>

<div id="readout" class="panel"></div>

<div id="bar" class="panel">
  <button id="play">Pause</button>
  <div class="seg" id="speed">
    <button data-s="0.25">0.25×</button><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button>
  </div>
  <div class="seg" id="cams">
    <button data-c="side" class="on">Side</button><button data-c="top">Top</button><button data-c="orbit">Orbit</button>
  </div>
  <button id="waves">Make waves</button>
  <button id="weight">Add weight</button>
  <button id="reset">Reset</button>
</div>
<div id="toast"></div>
<div id="pausedTag">PAUSED</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as CANNON from 'cannon-es';

/* ============================================================
   Constants
   ============================================================ */
const HX = 1.5, HZ = 0.75, TANK_H = 1.2, REST = 0.8;   // inner tank half sizes, height, fill level
const DT = 1 / 120, MAX_STEPS = 8, WAVE_SUB = 2;      // fixed physics step, cap per frame, wave sub-steps
const NX = 100, NZ = 50, DX = 3.0 / NX;               // wave grid (3 cm cells)
const CD = 1.05;          // quadratic drag coefficient of a box face
const LIN_RATE = 2.0;     // linear (viscous) drag rate, 1/s, at drag ×1 and viscosity 1
const ANG_RATE = 3.0;     // angular drag rate, 1/s
const RIPPLE = 0.7;       // share of displaced volume injected as surface ripple
const MAX_OBJECTS = 44;

const LIQUIDS = {
  water: { key: 'water', name: 'Fresh water', density: 1000, visc: 1.0, color: 0x2f8fd0, opacity: 0.30, surface: 0x7fcaf2, sOpacity: 0.50 },
  sea:   { key: 'sea',   name: 'Sea water',   density: 1025, visc: 1.12, color: 0x1d8a6e, opacity: 0.40, surface: 0x5cbf9f, sOpacity: 0.58 },
  oil:   { key: 'oil',   name: 'Oil',         density: 880,  visc: 3.5, color: 0xc07812, opacity: 0.58, surface: 0xe8a843, sOpacity: 0.72 },
};
const MATS = {
  cork:      { name: 'Cork', density: 240 },
  pine:      { name: 'Pine', density: 500 },
  ice:       { name: 'Ice', density: 917 },
  aluminium: { name: 'Aluminium', density: 2700 },
  steel:     { name: 'Steel', density: 7850 },
  custom:    { name: 'Custom', density: 1500 },
};
const settings = { liquid: 'water', gravity: 9.81, customDensity: 1500, liquidDrag: 1.0, speed: 1, paused: false, camera: 'side' };

/* Boat geometry. Body origin = hull centre of mass, 4 cm below the geometric centre. */
const BOAT = {
  L: 0.6, W: 0.4, H: 0.2, t: 0.01, tb: 0.02, mass: 10.5, steel: 7850,
  G2L: 0.04,                 // geometric y -> body-local y offset
  IX: 0.29, IZ: 0.19, FLOOR: -0.04, RIM: 0.14,   // interior box in body-local coordinates
};
BOAT.Venv = BOAT.L * BOAT.W * BOAT.H;                       // displaced envelope, 0.048 m³
BOAT.Vmax = BOAT.Venv - BOAT.mass / BOAT.steel;             // floodable volume (envelope minus steel)
const WEIGHT = { sx: 0.16, sy: 0.04, sz: 0.10, mass: 5, density: 7850 };
const SLOTS = [[0, 0], [-0.18, 0], [0.18, 0], [0, -0.12], [0, 0.12], [-0.18, -0.12], [0.18, 0.12], [-0.18, 0.12], [0.18, -0.12]];

/* ============================================================
   Deterministic PRNG (visual textures only)
   ============================================================ */
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

/* ============================================================
   Renderer, scene, camera
   ============================================================ */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 80);

/* ---------- canvas textures ---------- */
function canvasTex(w, h, draw, srgb = true, rep = null) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
const texBg = canvasTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#0a1322'); gr.addColorStop(0.45, '#1b2b40'); gr.addColorStop(0.75, '#3b3340'); gr.addColorStop(1, '#2a211d');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
scene.background = texBg;

const texCork = canvasTex(256, 256, (g, w, h) => {
  const r = rng(11); g.fillStyle = '#a8784a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4500; i++) {
    const x = r() * w, y = r() * h, s = 0.5 + r() * 2.3, l = r();
    g.fillStyle = l < 0.5 ? `rgba(84,52,26,${0.25 + r() * 0.5})` : `rgba(222,182,130,${0.2 + r() * 0.4})`;
    g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  }
  for (let i = 0; i < 140; i++) {
    g.fillStyle = `rgba(50,30,14,${0.4 + r() * 0.4})`;
    g.beginPath(); g.ellipse(r() * w, r() * h, 1 + r() * 2.5, 0.6 + r() * 1.2, r() * 3, 0, 7); g.fill();
  }
});
const texWood = canvasTex(512, 512, (g, w, h) => {
  const r = rng(7); g.fillStyle = '#d6a96c'; g.fillRect(0, 0, w, h);
  for (let j = 0; j < 110; j++) {
    const y0 = r() * h, amp = 2 + r() * 6, ph = r() * 6.28;
    g.strokeStyle = `rgba(${(118 + r() * 40) | 0},${(72 + r() * 30) | 0},34,${0.18 + r() * 0.45})`;
    g.lineWidth = 0.6 + r() * 2.6; g.beginPath();
    for (let x = 0; x <= w; x += 8) {
      const y = y0 + amp * Math.sin(x * 0.012 + ph) + 1.5 * Math.sin(x * 0.05 + ph * 2);
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  for (let k = 0; k < 2; k++) {
    const cx = 80 + r() * 350, cy = 60 + r() * 380;
    for (let q = 0; q < 6; q++) {
      g.strokeStyle = `rgba(100,58,24,${0.5 - q * 0.06})`; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(cx, cy, 6 + q * 5, 3 + q * 2.2, 0, 0, 7); g.stroke();
    }
  }
});
const texBrushed = canvasTex(512, 256, (g, w, h) => {
  const r = rng(5); g.fillStyle = '#bfc4ca'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const v = (150 + r() * 95) | 0;
    g.fillStyle = `rgba(${v},${v},${v + 4},${0.08 + r() * 0.2})`;
    g.fillRect(r() * w - 40, r() * h, 40 + r() * 320, 0.6 + r() * 0.9);
  }
});
const texSteel = canvasTex(256, 256, (g, w, h) => {
  const r = rng(3); g.fillStyle = '#6a6f76'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) {
    const l = r(); g.fillStyle = l < 0.5 ? `rgba(30,32,36,${r() * 0.25})` : `rgba(160,166,174,${r() * 0.18})`;
    g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
  }
  g.strokeStyle = 'rgba(190,196,204,0.18)';
  for (let i = 0; i < 40; i++) { g.lineWidth = 0.5 + r(); g.beginPath(); const x = r() * w, y = r() * h; g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 60, y + (r() - 0.5) * 20); g.stroke(); }
});
const texGrid = canvasTex(1200, 600, (g, w, h) => {
  g.fillStyle = '#d9dee3'; g.fillRect(0, 0, w, h);
  const s = w / 30;
  for (let i = 0; i <= 30; i++) { g.fillStyle = i % 5 === 0 ? 'rgba(40,60,80,0.55)' : 'rgba(40,60,80,0.22)'; g.fillRect(i * s - (i % 5 === 0 ? 1.5 : 0.5), 0, i % 5 === 0 ? 3 : 1, h); }
  for (let k = 0; k <= 15; k++) { g.fillStyle = k % 5 === 0 ? 'rgba(40,60,80,0.55)' : 'rgba(40,60,80,0.22)'; g.fillRect(0, k * s - (k % 5 === 0 ? 1.5 : 0.5), w, k % 5 === 0 ? 3 : 1); }
});
const texRuler = canvasTex(96, 1440, (g, w, h) => {
  g.fillStyle = '#f2efe4'; g.fillRect(0, 0, w, h);
  const pc = h / 120; g.fillStyle = '#1b1b1b'; g.font = 'bold 20px sans-serif'; g.textBaseline = 'middle';
  for (let cm = 0; cm <= 120; cm++) {
    const y = h - cm * pc; const len = cm % 10 === 0 ? 46 : cm % 5 === 0 ? 30 : 16;
    g.fillRect(0, y - 1, len, 2);
    if (cm % 10 === 0 && cm > 0 && cm < 120) g.fillText(String(cm), 52, y);
  }
  g.fillStyle = '#c23b2b'; g.fillRect(0, h - 80 * pc - 2, w, 4);
});
const texConcrete = canvasTex(512, 512, (g, w, h) => {
  const r = rng(21); g.fillStyle = '#56595d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const v = (60 + r() * 70) | 0; g.fillStyle = `rgba(${v},${v},${v + 3},${r() * 0.25})`; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1 + r() * 3); }
}, true, [10, 10]);
const texWall = canvasTex(512, 512, (g, w, h) => {
  const r = rng(31); g.fillStyle = '#2d3440'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) { const v = (35 + r() * 40) | 0; g.fillStyle = `rgba(${v},${v + 4},${v + 10},${r() * 0.3})`; g.fillRect(r() * w, r() * h, 2, 2); }
  g.fillStyle = 'rgba(0,0,0,0.35)'; for (let x = 0; x < w; x += 128) g.fillRect(x, 0, 3, h); g.fillRect(0, 0, w, 3);
}, true, [8, 3]);
const texWeight = canvasTex(256, 160, (g, w, h) => {
  g.fillStyle = '#2b2d31'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#4a4d53'; g.lineWidth = 6; g.strokeRect(8, 8, w - 16, h - 16);
  g.fillStyle = '#b8bcc3'; g.font = 'bold 64px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('5 kg', w / 2, h / 2 + 4);
});

/* ---------- materials ---------- */
const matCork = new THREE.MeshStandardMaterial({ map: texCork, bumpMap: texCork, bumpScale: 1.2, roughness: 0.95, metalness: 0 });
const matPine = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.4, roughness: 0.68, metalness: 0 });
const matIce = new THREE.MeshPhysicalMaterial({ color: 0xe8f7ff, roughness: 0.1, metalness: 0, transmission: 0.88, thickness: 0.18, ior: 1.31,
  attenuationColor: new THREE.Color(0xa9dcf5), attenuationDistance: 0.5, envMapIntensity: 1.3, clearcoat: 0.4 });
const matAl = new THREE.MeshStandardMaterial({ color: 0xe1e4e8, map: texBrushed, roughnessMap: texBrushed, metalness: 1.0, roughness: 0.34 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x5a5f66, map: texSteel, metalness: 0.88, roughness: 0.48 });
const matCustom = new THREE.MeshPhysicalMaterial({ color: 0x9a6cff, roughness: 0.3, metalness: 0, clearcoat: 0.7, clearcoatRoughness: 0.2 });
const matHull = new THREE.MeshStandardMaterial({ color: 0x8b939c, map: texSteel, metalness: 0.85, roughness: 0.38 });
const matHullRed = new THREE.MeshStandardMaterial({ color: 0x9c2f22, metalness: 0.3, roughness: 0.55 });
const matWeightSide = new THREE.MeshStandardMaterial({ color: 0x34363b, map: texSteel, metalness: 0.7, roughness: 0.55 });
const matWeightTop = new THREE.MeshStandardMaterial({ map: texWeight, metalness: 0.6, roughness: 0.5 });
const MATERIAL_BY_KEY = { cork: matCork, pine: matPine, ice: matIce, aluminium: matAl, steel: matSteel, custom: matCustom };

/* ============================================================
   Room setting: workshop bench at dusk
   ============================================================ */
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: texConcrete, roughness: 0.92 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.95; floor.receiveShadow = true; scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 9), new THREE.MeshStandardMaterial({ map: texWall, roughness: 0.85 }));
  wall.position.set(0, 3.5, -4.2); wall.receiveShadow = true; scene.add(wall);
  const benchMat = new THREE.MeshStandardMaterial({ map: texWood, color: 0x6b4a32, roughness: 0.6 });
  const top = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.07, 2.1), benchMat);
  top.position.set(0, -0.047, 0); top.receiveShadow = true; top.castShadow = true; scene.add(top);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x2b2f35, metalness: 0.7, roughness: 0.5 });
  for (const sx of [-1.8, 1.8]) for (const sz of [-0.9, 0.9]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.87, 0.08), legMat);
    leg.position.set(sx, -0.515, sz); leg.castShadow = true; scene.add(leg);
  }
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.04, 1.9), benchMat);
  shelf.position.set(0, -0.72, 0); shelf.receiveShadow = true; scene.add(shelf);
}

/* ---------- lights ---------- */

const eta = new Float32Array(NX * NZ), etaTmp = new Float32Array(NX * NZ), etaOld = new Float32Array(NX * NZ);

const u = new Float32Array((NX + 1) * NZ), w = new Float32Array(NX * (NZ + 1));

function waveStep(dt, g, paddleVel, applySrc) {

    u[ro] = paddleVel; u[ro + NX] = 0;
    for (let i = 1; i < NX; i++) u[ro + i] = (u[ro + i] - g * dt * (eta[re + i] - eta[re + i - 1]) / DX) * damp;
  }
  for (let k = 1; k < NZ; k++) {
    for (let i = 0; i < NX; i++) { const c = k * NX + i; w[c] = (w[c] - g * dt * (eta[c] - eta[c - NX]) / DX) * damp; }

  const lam = 0.0035 * dt / (DX * DX);

      const div = (u[k * (NX + 1) + i + 1] - u[k * (NX + 1) + i] + w[c + NX] - w[c]) / DX;
      const l = (i > 0 ? eta[c - 1] : e0) + (i < NX - 1 ? eta[c + 1] : e0) + (k > 0 ? eta[c - NX] : e0) + (k < NZ - 1 ? eta[c + NX] : e0) - 4 * e0;
      let v = e0 - D * dt * div + lam * l;

}
function bil(arr, nx, nz, fx, fz) {

  let i = fx | 0, k = fz | 0; if (i > nx - 2) i = nx - 2; if (k > nz - 2) k = nz - 2;

$('gravity').addEventListener('input', e => {
  settings.gravity = parseFloat(e.target.value); world.gravity.set(0, -settings.gravity, 0);
  $('gravV').textContent = settings.gravity.toFixed(2) + ' m/s²';
});
$('cdens').addEventListener('input', e => {
  settings.customDensity = parseFloat(e.target.value);
  $('cdensV').textContent = settings.customDensity + ' kg/m³'; $('palCustom').textContent = settings.customDensity;
  for (const o of objs) if (o.key === 'custom') {
    o.density = settings.customDensity; o.body.mass = o.density * o.volume; o.body.updateMassProperties();
  }
});
$('ldrag').addEventListener('input', e => { settings.liquidDrag = parseFloat(e.target.value); $('ldragV').textContent = '×' + settings.liquidDrag.toFixed(1); });
window.addEventListener('keydown', e => {
  const a = document.activeElement, tag = a && a.tagName;
  if (e.code === 'Escape') setPlacing(null);
  if (e.code === 'Space' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') { e.preventDefault(); setPaused(!settings.paused); }
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  if (settings.camera !== 'orbit') setCamera(settings.camera);
});

/* ============================================================
   Readout & labels
   ============================================================ */
function boatMetrics() {
  if (!boat) return null;
  const bt = boatLocalToWorld(0, -0.06, 0, [0, 0, 0]), rim = boatLocalToWorld(0, BOAT.RIM, 0, [0, 0, 0]);
  const L = outsideLevel(boat.body.position.x, boat.body.position.z);
  const ok = L > -Infinity;
  return {
    draftCm: ok ? +((L - bt[1]) * 100).toFixed(2) : null,
    freeboardCm: ok ? +((rim[1] - L) * 100).toFixed(2) : null,
    weights: boat.weights, sunk: boat.sunk, floodedLiters: +(boat.Vin * 1000).toFixed(2), settled: boat.settled,
    lowering: boat.body.type === CANNON.Body.KINEMATIC,
  };
}
const STATE_TXT = { floating: 'floating', sinking: 'sinking', bottom: 'on the bottom' };
function objDensity(o) { return o.key === 'custom' ? settings.customDensity : o.density; }
function labelHtml(o, bm) {
  const sub = o.settled ? `${(o.fs * 100).toFixed(1)} % submerged` : '<span class="st-settling">settling</span>';
  if (o.isBoat) {
    if (bm.lowering) return `<div class="t">Steel boat · hull ${BOAT.mass} kg</div><span class="st-settling">lowering…</span>`;
    const vals = o.settled ? `draft ${bm.draftCm.toFixed(1)} cm · freeboard ${bm.freeboardCm.toFixed(1)} cm` : '<span class="st-settling">settling</span>';
    return `<div class="t">Steel boat · ${BOAT.steel} kg/m³ hull</div>${vals}<br>weights ${bm.weights}` +
      `${boat.Vin > 0.0002 ? ` · flooded ${(boat.Vin * 1000).toFixed(1)} L` : ''} · <span class="st-${o.state}">${bm.sunk ? 'sunk, ' : ''}${STATE_TXT[o.state]}</span>`;
  }
  return `<div class="t">${o.name} · ${objDensity(o)} kg/m³</div>${sub} · <span class="st-${o.state}">${STATE_TXT[o.state]}</span>`;
}
let lastText = -1;
const v3 = new THREE.Vector3();
function updateLabels(now) {
  const refresh = now - lastText > 120; if (refresh) lastText = now;
  const bm = boatMetrics();
  const wdt = innerWidth, hgt = innerHeight;
  for (const o of objs) {
    if (refresh) { const t = labelHtml(o, bm); if (t !== o.labelText) { o.label.innerHTML = t; o.labelText = t; } }
    const p = o.body.position;
    v3.set(p.x, p.y + (o.kind === 'plank' ? 0.14 : o.halfH + 0.08), p.z).project(camera);
    if (v3.z > 1 || v3.z < -1) { o.label.style.display = 'none'; continue; }
    o.label.style.display = '';
    o.label.style.transform = `translate(${((v3.x + 1) / 2 * wdt).toFixed(1)}px,${((1 - v3.y) / 2 * hgt).toFixed(1)}px) translate(-50%,-100%)`;
  }
  if (refresh) updateReadout(bm);
}
function updateReadout(bm) {
  const L = LIQUIDS[settings.liquid];
  let h = `<div class="kv"><span>${L.name}</span><b>${L.density} kg/m³</b></div>`;
  h += `<div class="kv"><span>Simulated time</span><b>${simTime.toFixed(1)} s</b></div>`;
  h += `<div class="kv"><span>Gravity · drag</span><b>${settings.gravity.toFixed(2)} · ×${settings.liquidDrag.toFixed(1)}</b></div>`;
  if (bm) {
    h += `<div class="sec-t">Steel boat</div>`;
    if (bm.lowering) h += `<div class="kv"><span>Status</span><b>lowering</b></div>`;
    else {
      const s = boat.settled;
      h += `<div class="kv"><span>Draft</span><b>${s ? bm.draftCm.toFixed(1) + ' cm' : 'settling'}</b></div>`;
      h += `<div class="kv"><span>Freeboard</span><b>${s ? bm.freeboardCm.toFixed(1) + ' cm' : 'settling'}</b></div>`;
    }
    h += `<div class="kv"><span>Weights</span><b>${bm.weights} × 5 kg</b></div>`;
    h += `<div class="kv"><span>Water inside</span><b>${bm.floodedLiters.toFixed(1)} L${bm.sunk ? ' · sunk' : ''}</b></div>`;
  }
  h += `<div class="sec-t">Objects</div><table><tr><th>Object</th><th>kg/m³</th><th>Subm.</th><th>State</th></tr>`;
  for (const o of objs) {
    h += `<tr><td>${o.name}</td><td class="n">${objDensity(o)}</td><td class="n">${o.settled ? (o.fs * 100).toFixed(1) + ' %' : '<span class="st-settling">settling</span>'}</td>` +
      `<td class="st-${o.state}">${STATE_TXT[o.state]}</td></tr>`;
  }
  h += `</table>`;
  $('readout').innerHTML = h;
  $('weight').disabled = !boat || boat.body.type !== CANNON.Body.DYNAMIC;
}

/* ============================================================
   Inspection API
   ============================================================ */
window.tankState = function () {
  const L = LIQUIDS[settings.liquid], bm = boatMetrics();
  return {
    liquid: { name: L.name, density: L.density },
    time: +simTime.toFixed(4),
    objects: objs.map(o => ({
      id: o.id, name: o.name, density: objDensity(o),
      submergedFraction: +Math.min(1, Math.max(0, o.fs)).toFixed(4),
      state: o.state,
      position: [+o.body.position.x.toFixed(4), +o.body.position.y.toFixed(4), +o.body.position.z.toFixed(4)],
      settled: o.settled,
    })),
    boat: bm ? { draftCm: bm.draftCm, freeboardCm: bm.freeboardCm, weights: bm.weights, sunk: bm.sunk, settled: bm.settled, floodedLiters: bm.floodedLiters }
      : { draftCm: null, freeboardCm: null, weights: 0, sunk: false },
    settings: {
      liquid: settings.liquid, gravity: settings.gravity, customDensity: settings.customDensity, liquidDrag: settings.liquidDrag,
      speed: settings.speed, paused: settings.paused, camera: settings.camera,
    },
  };
};

/* ============================================================
   Main loop
   ============================================================ */
let acc = 0, last = performance.now();
function syncVisuals() {
  for (const o of objs) { o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion); }
  paddle.group.position.x = PADDLE_X0 + paddle.disp;
  if (boat) {
    const wm = boat.waterMesh;
    if (boat.Vin > 0.00005) {
      const hIn = Math.max(0.002, boat.Vin / BOAT.Vmax * (BOAT.RIM - BOAT.FLOOR));
      wm.visible = true; wm.scale.y = hIn; wm.position.y = BOAT.FLOOR + hIn / 2;
    } else wm.visible = false;
    if (boat.body.type === CANNON.Body.KINEMATIC) {
      for (const c of boat.cables) {
        const a = boatLocalToWorld(c.c[0], BOAT.RIM, c.c[1], [0, 0, 0]);
        const pa = c.line.geometry.attributes.position;
        pa.setXYZ(0, a[0], a[1], a[2]); pa.setXYZ(1, a[0] * 0.6 + boat.body.position.x * 0.4, 2.4, a[2] * 0.6 + boat.body.position.z * 0.4); pa.needsUpdate = true;
      }
    }
  }
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!settings.paused) {
    acc += dt * settings.speed;
    let n = 0;
    while (acc >= DT && n < MAX_STEPS) { physicsStep(); acc -= DT; n++; }
    if (n >= MAX_STEPS) acc = 0;
  }
  syncVisuals();
  updateWaterMeshes();
  if (settings.camera === 'orbit') controls.update();
  renderer.render(scene, camera);
  updateLabels(now);
  requestAnimationFrame(frame);
}
applyLiquidLook();
setCamera('side');
requestAnimationFrame(frame);
</script>
</body>
</html>
