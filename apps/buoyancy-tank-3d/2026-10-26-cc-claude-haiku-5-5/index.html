<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Haiku 5.5</title>
<style>
  :root { --ink:#e8eef4; --muted:#9aa7b4; --panel:rgba(12,16,22,.86); --line:rgba(255,255,255,.12); --accent:#7fd1ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0d1117; color:var(--ink); font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(6px); }
  #brand { position:fixed; top:14px; left:16px; font-weight:600; font-size:15px; letter-spacing:.02em; }
  #status { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted); pointer-events:none; white-space:nowrap; }
  #palette { left:16px; top:52px; width:164px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  #readout { right:16px; top:52px; width:280px; max-height:calc(100vh - 150px); overflow:auto; padding:10px; }
  h2 { margin:2px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:600; }
  button, select { font:inherit; color:var(--ink); background:#1c2430; border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  button.active { background:#24476a; border-color:var(--accent); }
  button.tool { text-align:left; display:flex; justify-content:space-between; gap:8px; }
  button.tool small { color:var(--muted); }
  #bar { left:50%; bottom:14px; transform:translateX(-50%); padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:center; width:max-content; max-width:calc(100vw - 32px); }
  #bar label { display:flex; align-items:center; gap:6px; color:var(--muted); }
  #bar input[type=range] { width:110px; }
  #bar output { color:var(--ink); min-width:44px; }
  .group { display:flex; gap:4px; }
  .entry { border-top:1px solid var(--line); padding:6px 0; }
  #log { color:var(--muted); font-size:12px; margin-top:8px; }
  .tag { position:fixed; pointer-events:none; transform:translate(-50%,-100%); padding:4px 8px; background:rgba(12,16,22,.8); border:1px solid var(--line); border-radius:6px; white-space:nowrap; font-size:12px; display:none; }
  .tag b { font-weight:600; }
  @media (max-width:900px) { #readout { display:none; } #palette { top:50px; width:140px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="brand">Claude Haiku 5.5</div>
<div id="status"></div>

<div id="palette" class="panel">
  <h2>Drop an object</h2>
  <button class="tool" data-kind="cork">Cork <small>240</small></button>
  <button class="tool" data-kind="pine">Pine cube <small>500</small></button>
  <button class="tool" data-kind="ice">Ice <small>917</small></button>
  <button class="tool" data-kind="aluminium">Aluminium <small>2700</small></button>
  <button class="tool" data-kind="steel">Steel <small>7850</small></button>
  <button class="tool" data-kind="custom">Custom <small id="customTag">1500</small></button>
  <button class="tool" data-kind="plank">Pine plank <small>500</small></button>
  <button class="tool" data-kind="boat">Steel boat <small>10.5 kg</small></button>
</div>

<div id="readout" class="panel">
  <h2>Readout</h2>
  <div id="rows"></div>
  <div id="log"></div>
</div>

<div id="bar" class="panel">
  <div class="group">
    <button id="pause">Pause</button>
    <button class="speed" data-speed="0.25">0.25×</button>
    <button class="speed" data-speed="0.5">0.5×</button>
    <button class="speed active" data-speed="1">1×</button>
  </div>
  <div class="group">
    <button class="cam active" data-cam="side">Side</button>
    <button class="cam" data-cam="top">Top</button>
    <button class="cam" data-cam="orbit">Orbit</button>
  </div>
  <label>Liquid
    <select id="liquid">
      <option value="fresh">Fresh water · 1000</option>
      <option value="sea">Sea water · 1025</option>
      <option value="oil">Oil · 880</option>
    </select>
  </label>
  <button id="waves">Make waves</button>
  <button id="weight">Add weight</button>
  <button id="reset">Reset</button>
  <label>Gravity <input id="gravity" type="range" min="1" max="25" step="0.01" value="9.81"><output id="gravityOut">9.81</output></label>
  <label>Custom density <input id="customDensity" type="range" min="100" max="3000" step="10" value="1500"><output id="customOut">1500</output></label>
  <label>Liquid drag <input id="drag" type="range" min="0" max="3" step="0.05" value="1"><output id="dragOut">1.00</output></label>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

// ---------- constants ----------
const TANK = { hx: 1.5, hz: 0.75, level: 0.8 };      // inner half sizes (m), water level (m)
const DT = 1 / 240;                                  // fixed physics step (s)
const MAX_STEPS = 8;                                 // cap on physics steps per rendered frame
const DROP_Y = 1.15;                                 // release height (m)
const CELL = 0.05;                                   // buoyancy sample spacing (m)
const DRAG_LIN = 3.0;                                // 1/s, linear drag rate of a fully submerged body (× liquid drag)
const DRAG_ANG = 3.0;                                // 1/s, angular drag rate of a fully submerged body (× liquid drag)
const WAVE_SPEED = 0.9;                              // m/s, paddle wave front
const WAVE_AMP = 0.04;                               // m, paddle wave amplitude
const WAVE_K = 2 * Math.PI / 1.1;                    // rad/m, paddle wave number
const NO_FORCE = { vol: 0, sw: 0, cx: 0, cy: 0, cz: 0 };

const LIQUIDS = {
  fresh: { name: 'Fresh water', density: 1000, drag: 1.0, color: 0x2b7bb9 },
  sea:   { name: 'Sea water',   density: 1025, drag: 1.1, color: 0x1f8f8a },
  oil:   { name: 'Oil',         density: 880,  drag: 2.5, color: 0xd9962b },
};
const KINDS = {
  cork:      { name: 'Cork',       density: 240 },
  pine:      { name: 'Pine',       density: 500 },
  ice:       { name: 'Ice',        density: 917 },
  aluminium: { name: 'Aluminium',  density: 2700 },
  steel:     { name: 'Steel',      density: 7850 },
  custom:    { name: 'Custom',     density: 1500 },
  plank:     { name: 'Pine plank', density: 500 },
  boat:      { name: 'Steel boat' },
};
const BOAT = { hx: 0.3, hy: 0.1, hz: 0.2, wall: 0.02, mass: 10.5, steel: 7850 };
const BOAT_VOL = 0.048;                              // outer envelope volume (m³), air-filled until flooded
const BOAT_BOXES = [
  { h: [BOAT.hx, BOAT.wall / 2, BOAT.hz], o: [0, -BOAT.hy + BOAT.wall / 2, 0] },           // bottom
  { h: [BOAT.hx, BOAT.hy, BOAT.wall / 2], o: [0, 0, BOAT.hz - BOAT.wall / 2] },             // long wall +z
  { h: [BOAT.hx, BOAT.hy, BOAT.wall / 2], o: [0, 0, -(BOAT.hz - BOAT.wall / 2)] },          // long wall -z
  { h: [BOAT.wall / 2, BOAT.hy, BOAT.hz - BOAT.wall], o: [BOAT.hx - BOAT.wall / 2, 0, 0] },  // short wall +x
  { h: [BOAT.wall / 2, BOAT.hy, BOAT.hz - BOAT.wall], o: [-(BOAT.hx - BOAT.wall / 2), 0, 0] }, // short wall -x
];
const RIM = [[-BOAT.hx, -BOAT.hz], [BOAT.hx, -BOAT.hz], [BOAT.hx, BOAT.hz], [-BOAT.hx, BOAT.hz]];
const SCRIPT = [
  { t: 1, kind: 'cork',      x: -1.1,  z: 0.3 },
  { t: 2, kind: 'pine',      x: -0.55, z: -0.3 },
  { t: 3, kind: 'ice',       x: 0.0,   z: 0.3 },
  { t: 4, kind: 'aluminium', x: 0.55,  z: -0.3 },
  { t: 5, kind: 'steel',     x: 1.1,   z: 0.3 },
  { t: 7, kind: 'plank',     x: -0.25, z: -0.3 },
  { t: 9, kind: 'boat',      x: 1.0,   z: -0.1 },
];
const CAMS = {
  side:  { pos: [0, 0.55, 4.4], target: [0, 0.45, 0] },
  top:   { pos: [0, 5.0, 0.001], target: [0, 0, 0] },
  orbit: { pos: [2.8, 1.8, 3.6], target: [0, 0.5, 0] },
};

// ---------- shared state ----------
const S = {
  liquidKey: 'fresh', gravity: 9.81, customDensity: 1500, dragSlider: 1,
  paused: false, speed: 1, cam: 'side', tool: null,
  steps: 0, next: 0, waveT0: -1e9, ripples: [], objects: [], drag: null, nextId: 0,
  world: null, paddle: null, logLines: [], acc: 0, last: performance.now(),
};
const liq = () => LIQUIDS[S.liquidKey];
const now = () => S.steps * DT;

// ---------- three.js setup ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11161d);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 50);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x1a1f26, 0.5));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.position.set(1.8, 3.2, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2; sun.shadow.camera.right = 2;
sun.shadow.camera.top = 2; sun.shadow.camera.bottom = -2;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 12;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
scene.add(sun);

// lab: floor, bench, back wall
const labFloor = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), new THREE.MeshStandardMaterial({ color: 0x242b33, roughness: 0.9 }));
labFloor.rotation.x = -Math.PI / 2; labFloor.position.y = -0.9; labFloor.receiveShadow = true; scene.add(labFloor);
const labWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), new THREE.MeshStandardMaterial({ color: 0x1b2129, roughness: 1 }));
labWall.position.set(0, 1.5, -2.2); scene.add(labWall);
const bench = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.1, 1.5), new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.7 }));
bench.position.set(0, -0.07, 0); bench.receiveShadow = true; bench.castShadow = true; scene.add(bench);

// tank floor (visible under the water, receives object shadows)
const tankFloor = new THREE.Mesh(new THREE.PlaneGeometry(2 * TANK.hx, 2 * TANK.hz), new THREE.MeshStandardMaterial({ color: 0x8c9196, roughness: 0.8 }));
tankFloor.rotation.x = -Math.PI / 2; tankFloor.position.y = 0.002; tankFloor.receiveShadow = true; scene.add(tankFloor);

// glass: four panes, a bottom pane, and bright edges
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 1.2 });
function pane(w, h, x, y, z, rx, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); scene.add(m);
}
pane(3.04, 1.2, 0, 0.6, TANK.hz + 0.01, 0, 0);
pane(3.04, 1.2, 0, 0.6, -(TANK.hz + 0.01), 0, Math.PI);
pane(1.54, 1.2, TANK.hx + 0.01, 0.6, 0, 0, Math.PI / 2);
pane(1.54, 1.2, -(TANK.hx + 0.01), 0.6, 0, 0, -Math.PI / 2);
pane(3.04, 1.54, 0, -0.01, 0, -Math.PI / 2, 0);
const glassEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(3.04, 1.2, 1.54)),
  new THREE.LineBasicMaterial({ color: 0xcfeeff, transparent: true, opacity: 0.55 })
);
glassEdges.position.set(0, 0.6, 0); scene.add(glassEdges);

// liquid body and animated surface
const liquidMat = new THREE.MeshPhysicalMaterial({ color: LIQUIDS.fresh.color, transparent: true, opacity: 0.3, roughness: 0.08, depthWrite: false });
const liquid = new THREE.Mesh(new THREE.BoxGeometry(2 * TANK.hx, TANK.level, 2 * TANK.hz), liquidMat);
liquid.position.set(0, TANK.level / 2, 0); liquid.renderOrder = 2; scene.add(liquid);

const surfGeo = new THREE.PlaneGeometry(2 * TANK.hx, 2 * TANK.hz, 120, 40);
surfGeo.rotateX(-Math.PI / 2);
const surfPos = surfGeo.attributes.position;
const SX = new Float32Array(surfPos.count);
const SZ = new Float32Array(surfPos.count);
for (let i = 0; i < surfPos.count; i++) { SX[i] = surfPos.getX(i); SZ[i] = surfPos.getZ(i); }
const surfMat = new THREE.MeshPhysicalMaterial({ color: LIQUIDS.fresh.color, transparent: true, opacity: 0.5, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false });
const surface = new THREE.Mesh(surfGeo, surfMat);
surface.renderOrder = 3; scene.add(surface);

const surfaceLine = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-1.515, TANK.level, -0.765), new THREE.Vector3(1.515, TANK.level, -0.765),
    new THREE.Vector3(1.515, TANK.level, 0.765), new THREE.Vector3(-1.515, TANK.level, 0.765),
  ]),
  new THREE.LineBasicMaterial({ color: 0xaeeaff })
);
scene.add(surfaceLine);

const paddleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.8, 1.46), new THREE.MeshStandardMaterial({ color: 0x6b7785, metalness: 0.6, roughness: 0.4 }));
paddleMesh.castShadow = true; scene.add(paddleMesh);

// procedural textures (deterministic hash, no Math.random)
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function canvasTexture(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const woodTex = canvasTexture(256, (g, n) => {
  g.fillStyle = '#c99a5b'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 70; i++) {
    g.strokeStyle = `rgba(95,58,28,${0.1 + 0.3 * hash(i)})`;
    g.lineWidth = 0.6 + 1.6 * hash(i + 500);
    g.beginPath();
    const y0 = (i / 70) * n;
    for (let x = 0; x <= n; x += 16) g.lineTo(x, y0 + 4 * Math.sin(x * 0.03 + i * 1.3) + 2 * hash(i + x));
    g.stroke();
  }
});
const corkTex = canvasTexture(256, (g, n) => {
  g.fillStyle = '#b07b45'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = hash(i + 3000) > 0.5 ? `rgba(70,40,18,${0.25 + 0.4 * hash(i)})` : `rgba(220,170,110,${0.2 + 0.3 * hash(i + 7)})`;
    g.beginPath();
    g.arc(hash(i) * n, hash(i + 1000) * n, 0.6 + 2 * hash(i + 2000), 0, Math.PI * 2);
    g.fill();
  }
});
const MAT = {
  cork: new THREE.MeshStandardMaterial({ map: corkTex, roughness: 0.95 }),
  pine: new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7 }),
  ice: new THREE.MeshPhysicalMaterial({ color: 0xcdeeff, roughness: 0.06, transmission: 0.6, thickness: 0.2, transparent: true, opacity: 0.85 }),
  aluminium: new THREE.MeshStandardMaterial({ color: 0xd3d9e0, metalness: 1, roughness: 0.3 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x4a5059, metalness: 0.9, roughness: 0.38 }),
  weight: new THREE.MeshStandardMaterial({ color: 0x23272d, metalness: 0.7, roughness: 0.5 }),
};
const customHue = d => 0.62 - 0.5 * (d - 100) / 2900;
function customMaterial(d) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(customHue(d), 0.55, 0.5), roughness: 0.5 });
}

// ---------- physics world ----------
function addStatic(world, half, pos) {
  const b = new CANNON.Body({ mass: 0 });
  b.addShape(new CANNON.Box(new CANNON.Vec3(...half)));
  b.position.set(...pos);
  world.addBody(b);
}
function buildWorld() {
  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -S.gravity, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = false;
  world.solver.iterations = 12;
  world.defaultContactMaterial.friction = 0.4;
  world.defaultContactMaterial.restitution = 0.05;
  addStatic(world, [TANK.hx + 0.05, 0.05, TANK.hz + 0.05], [0, -0.05, 0]);          // floor, top at y = 0
  addStatic(world, [0.05, 1.0, TANK.hz + 0.05], [-(TANK.hx + 0.05), 1.0, 0]);       // glass walls
  addStatic(world, [0.05, 1.0, TANK.hz + 0.05], [TANK.hx + 0.05, 1.0, 0]);
  addStatic(world, [TANK.hx + 0.05, 1.0, 0.05], [0, 1.0, -(TANK.hz + 0.05)]);
  addStatic(world, [TANK.hx + 0.05, 1.0, 0.05], [0, 1.0, TANK.hz + 0.05]);
  S.paddle = new CANNON.Body({ type: CANNON.Body.KINEMATIC, mass: 0 });
  S.paddle.addShape(new CANNON.Box(new CANNON.Vec3(0.02, 0.4, 0.73)));
  S.paddle.position.set(-TANK.hx + 0.03, 0.4, 0);
  world.addBody(S.paddle);
  return world;
}
function makeBody(mass, boxes, x, y, z) {
  const body = new CANNON.Body({ mass, linearDamping: 0.01, angularDamping: 0.01 });
  for (const b of boxes) body.addShape(new CANNON.Box(new CANNON.Vec3(...b.h)), new CANNON.Vec3(...b.o));
  body.position.set(x, y, z);
  body.updateMassProperties();
  return body;
}

// ---------- buoyancy samples ----------
// Each sample is a small cell of the body with volume dv and height c.
// Its submerged share is a ramp across the cell, so the force changes smoothly with depth.
function gridSamples(h, n, volume) {
  const N = n[0] * n[1] * n[2], out = [];
  for (let i = 0; i < n[0]; i++) for (let j = 0; j < n[1]; j++) for (let k = 0; k < n[2]; k++) {
    out.push({
      x: -h[0] + (i + 0.5) * 2 * h[0] / n[0],
      y: -h[1] + (j + 0.5) * 2 * h[1] / n[1],
      z: -h[2] + (k + 0.5) * 2 * h[2] / n[2],
      dv: volume / N, c: 2 * h[1] / n[1],
    });
  }
  return out;
}
function shellSamples(list) {
  // outer ring of the hull: the steel that still floats once the hull is flooded
  const shell = list.filter(s => Math.abs(s.x) > BOAT.hx - CELL || Math.abs(s.z) > BOAT.hz - CELL || s.y < -BOAT.hy + CELL);
  const dv = (BOAT.mass / BOAT.steel) / shell.length;
  return shell.map(s => ({ ...s, dv }));
}

// ---------- objects ----------
function createObject(kind, x, y, z) {
  const o = {
    id: ++S.nextId, kind, name: KINDS[kind].name, density: KINDS[kind].density, volume: 0,
    frac: 0, prevFrac: 0, state: 'sinking', calm: 0, settled: false, onFloor: false,
    isBoat: false, isWeight: false, flooded: false, skipBuoyancy: false, tagY: 0.14, tag: null, tagHTML: '',
  };
  if (kind === 'boat') {
    o.isBoat = true; o.name = 'Steel boat'; o.density = null; o.tagY = 0.22; o.volume = BOAT_VOL;
    o.boxes = BOAT_BOXES;
    o.body = makeBody(BOAT.mass, BOAT_BOXES, x, y, z);
    // thin-walled hull: use the outer box inertia, not the sum of compound shapes
    const I = BOAT.mass / 12, a = 2 * BOAT.hx, b = 2 * BOAT.hy, c = 2 * BOAT.hz;
    o.body.inertia.set(I * (b * b + c * c), I * (a * a + c * c), I * (a * a + b * b));
    o.body.invInertia.set(1 / o.body.inertia.x, 1 / o.body.inertia.y, 1 / o.body.inertia.z);
    o.samples = gridSamples([BOAT.hx, BOAT.hy, BOAT.hz], [12, 4, 8], BOAT_VOL);
    o.shell = shellSamples(o.samples);
    o.mesh = new THREE.Group();
    for (const bx of BOAT_BOXES) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(2 * bx.h[0], 2 * bx.h[1], 2 * bx.h[2]), MAT.steel);
      m.position.set(...bx.o); m.castShadow = true; m.receiveShadow = true;
      m.userData.obj = o; o.mesh.add(m);
    }
    o.pickables = o.mesh.children;
    o.tag = makeTag();
  } else if (kind === 'weight') {
    const side = Math.cbrt(5 / 7850);
    o.isWeight = true; o.name = 'Steel weight 5 kg'; o.density = 7850; o.volume = 5 / 7850;
    o.boxes = [{ h: [side / 2, side / 2, side / 2], o: [0, 0, 0] }];
    o.body = makeBody(5, o.boxes, x, y, z);
    o.samples = gridSamples([side / 2, side / 2, side / 2], [2, 2, 2], o.volume);
    o.mesh = new THREE.Mesh(new THREE.BoxGeometry(side, side, side), MAT.weight);
    o.mesh.castShadow = true; o.mesh.receiveShadow = true;
    o.mesh.userData.obj = o; o.pickables = [o.mesh];
  } else if (kind === 'plank') {
    o.tagY = 0.62; o.volume = 0.02;
    o.boxes = [{ h: [0.1, 0.5, 0.05], o: [0, 0, 0] }];
    o.body = makeBody(o.density * o.volume, o.boxes, x, y, z);
    o.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), 0.03); // small tilt so it tips over by itself
    o.samples = gridSamples([0.1, 0.5, 0.05], [4, 20, 2], o.volume);
    o.mesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.1), MAT.pine);
    o.mesh.castShadow = true; o.mesh.receiveShadow = true;
    o.mesh.userData.obj = o; o.pickables = [o.mesh]; o.tag = makeTag();
  } else {
    const s = 0.2;
    if (kind === 'custom') o.density = S.customDensity;
    o.volume = s * s * s;
    o.boxes = [{ h: [0.1, 0.1, 0.1], o: [0, 0, 0] }];
    o.body = makeBody(o.density * o.volume, o.boxes, x, y, z);
    o.samples = gridSamples([0.1, 0.1, 0.1], [4, 4, 4], o.volume);
    o.mesh = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), kind === 'custom' ? customMaterial(o.density) : MAT[kind]);
    o.mesh.castShadow = true; o.mesh.receiveShadow = true;
    o.mesh.userData.obj = o; o.pickables = [o.mesh]; o.tag = makeTag();
  }
  S.world.addBody(o.body);
  scene.add(o.mesh);
  S.objects.push(o);
  return o;
}
function makeTag() {
  const el = document.createElement('div');
  el.className = 'tag';
  document.body.appendChild(el);
  return el;
}
function spawn(kind, x, y, z) {
  const o = createObject(kind, x, y, z);
  log(`${o.name} dropped`);
  return o;
}

// ---------- water surface ----------
function surfaceY(x, z, t) {
  // ambient swell, paddle wave, and ripples: the same function drives the mesh and the buoyancy
  let h = TANK.level + 0.002 * Math.sin(2.1 * x + 0.9 * t) + 0.002 * Math.sin(3.3 * z - 1.1 * t);
  const tw = t - S.waveT0;
  if (tw >= 0 && tw < 12) {
    const d = x + TANK.hx;                       // distance from the paddle wall
    const front = WAVE_SPEED * tw;
    if (d < front) {
      const fade = Math.min(1, (front - d) / 0.3);
      h += WAVE_AMP * Math.exp(-tw / 8) * fade * Math.sin(WAVE_K * (d - WAVE_SPEED * tw));
    }
  }
  for (const r of S.ripples) {
    const tau = t - r.t0;
    if (tau < 0 || tau > 5) continue;
    const dx = x - r.x, dz = z - r.z, dist = Math.sqrt(dx * dx + dz * dz);
    const ring = Math.exp(-((dist - 0.45 * tau) ** 2) / 0.01);
    h += r.a * Math.exp(-tau / 1.5) * ring * Math.sin(14 * dist - 6.3 * tau);
  }
  return h;
}
function addRipple(x, z, a, t) {
  S.ripples.push({ x, z, t0: t, a });
  if (S.ripples.length > 16) S.ripples.shift();
}
function updateSurface(t) {
  for (let i = 0; i < SX.length; i++) surfPos.setY(i, surfaceY(SX[i], SZ[i], t));
  surfPos.needsUpdate = true;
  surfGeo.computeVertexNormals();
}

// ---------- fluid forces ----------
const _q = new THREE.Quaternion();
const _qi = new THREE.Quaternion();
const _v = new THREE.Vector3();

// Sum of the submerged part of the sample list: volume, centroid, and sample weight.
function immerse(o, list, t) {
  const P = o.body.position, Q = o.body.quaternion;
  _q.set(Q.x, Q.y, Q.z, Q.w);
  let vol = 0, sw = 0, cx = 0, cy = 0, cz = 0;
  for (const s of list) {
    _v.set(s.x, s.y, s.z).applyQuaternion(_q);
    const x = P.x + _v.x, y = P.y + _v.y, z = P.z + _v.z;
    if (Math.abs(x) > TANK.hx || Math.abs(z) > TANK.hz) continue;   // no water outside the glass
    const w = Math.min(1, Math.max(0, (surfaceY(x, z, t) - y) / s.c + 0.5));
    if (w === 0) continue;
    const dv = s.dv * w;
    vol += dv; sw += w;
    cx += x * dv; cy += y * dv; cz += z * dv;
  }
  if (vol > 0) return { vol, sw, cx: cx / vol, cy: cy / vol, cz: cz / vol };
  return { vol: 0, sw, cx: P.x, cy: P.y, cz: P.z };
}

// True when a corner of the hull rim is below the water surface.
function rimUnder(o, t) {
  const P = o.body.position, Q = o.body.quaternion;
  _q.set(Q.x, Q.y, Q.z, Q.w);
  for (const [x, z] of RIM) {
    _v.set(x, BOAT.hy, z).applyQuaternion(_q);
    const wx = P.x + _v.x, wy = P.y + _v.y, wz = P.z + _v.z;
    if (Math.abs(wx) <= TANK.hx && Math.abs(wz) <= TANK.hz && wy < surfaceY(wx, wz, t)) return true;
  }
  return false;
}
function minRimY(o) {
  const P = o.body.position, Q = o.body.quaternion;
  _q.set(Q.x, Q.y, Q.z, Q.w);
  let m = Infinity;
  for (const [x, z] of RIM) {
    _v.set(x, BOAT.hy, z).applyQuaternion(_q);
    m = Math.min(m, P.y + _v.y);
  }
  return m;
}
// Lowest world y of any box corner: used for floor contact.
function lowestY(o) {
  const P = o.body.position, Q = o.body.quaternion;
  _q.set(Q.x, Q.y, Q.z, Q.w);
  let low = Infinity;
  for (const bx of o.boxes) {
    for (let i = 0; i < 8; i++) {
      _v.set(
        bx.o[0] + (i & 1 ? bx.h[0] : -bx.h[0]),
        bx.o[1] + (i & 2 ? bx.h[1] : -bx.h[1]),
        bx.o[2] + (i & 4 ? bx.h[2] : -bx.h[2])
      ).applyQuaternion(_q);
      low = Math.min(low, P.y + _v.y);
    }
  }
  return low;
}
// True when a weight sits in the air-filled hull (its volume is already counted by the hull envelope).
function insideHull(boat, o) {
  const Q = boat.body.quaternion, B = boat.body.position, P = o.body.position;
  _qi.set(Q.x, Q.y, Q.z, Q.w).invert();
  _v.set(P.x - B.x, P.y - B.y, P.z - B.z).applyQuaternion(_qi);
  return Math.abs(_v.x) < BOAT.hx - BOAT.wall && Math.abs(_v.z) < BOAT.hz - BOAT.wall
    && _v.y > -BOAT.hy + BOAT.wall && _v.y < BOAT.hy;
}

function applySpring(o) {
  const d = S.drag, b = o.body, P = b.position, V = b.velocity, m = b.mass;
  const kS = 60, dS = 15;
  b.applyForce(
    new CANNON.Vec3(m * (kS * (d.target.x - P.x) - dS * V.x), m * (kS * (d.target.y - P.y) - dS * V.y), m * (kS * (d.target.z - P.z) - dS * V.z)),
    new CANNON.Vec3(0, 0, 0)
  );
}

function applyFluid(o, t) {
  const b = o.body, P = b.position, V = b.velocity;
  const env = immerse(o, o.samples, t);
  o.frac = env.sw / o.samples.length;

  if (o.isBoat && !o.flooded && rimUnder(o, t)) {
    o.flooded = true;
    log('Steel boat flooded: the rim is under the water');
  }
  if (o.frac > 0 && o.prevFrac === 0 && !o.isWeight) {
    addRipple(P.x, P.z, Math.max(0.004, Math.min(0.03, 0.012 * Math.abs(V.y))), t);
  }
  o.prevFrac = o.frac;

  // buoyancy: rho × g × submerged volume, applied at the centre of the submerged volume
  const bu = o.skipBuoyancy ? NO_FORCE : (o.isBoat && o.flooded ? immerse(o, o.shell, t) : env);
  if (bu.vol > 0) {
    b.applyForce(
      new CANNON.Vec3(0, liq().density * S.gravity * bu.vol, 0),
      new CANNON.Vec3(bu.cx - P.x, bu.cy - P.y, bu.cz - P.z)
    );
  }

  // liquid drag: stronger in the liquid than in air, proportional to the submerged fraction
  if (o.frac > 0) {
    const k = S.dragSlider * liq().drag * o.frac;
    const fl = -DRAG_LIN * k * b.mass;
    b.applyForce(new CANNON.Vec3(fl * V.x, fl * V.y, fl * V.z), new CANNON.Vec3(0, 0, 0));
    const kg = DRAG_ANG * k, W = b.angularVelocity, I = b.inertia;
    b.torque.x -= kg * I.x * W.x;
    b.torque.y -= kg * I.y * W.y;
    b.torque.z -= kg * I.z * W.z;
  }

  if (S.drag && S.drag.o === o) applySpring(o);
}

function postStep(o) {
  const V = o.body.velocity;
  o.calm = Math.hypot(V.x, V.y, V.z) < 0.02 ? o.calm + DT : 0;
  o.settled = o.calm >= 1;
  o.onFloor = lowestY(o) < 0.012;
  o.state = o.onFloor ? 'bottom' : o.frac > 0 ? (V.y < -0.02 ? 'sinking' : 'floating') : 'sinking';
}

function physicsStep() {
  const t = S.steps * DT;
  // default sequence, fired on simulated time
  while (S.next < SCRIPT.length && t >= SCRIPT[S.next].t - 1e-6) {
    const e = SCRIPT[S.next++];
    spawn(e.kind, e.x, DROP_Y, e.z);
  }

  const boat = S.objects.find(o => o.isBoat);
  for (const o of S.objects) if (o.isWeight) o.skipBuoyancy = !!boat && !boat.flooded && insideHull(boat, o);
  for (const o of S.objects) applyFluid(o, t);

  // paddle: kinematic box at the left end, moved in a single push
  const tw = t - S.waveT0;
  const active = tw >= 0 && tw < 1.5;
  const k = Math.PI / 1.5;
  S.paddle.position.x = -TANK.hx + 0.03 + (active ? 0.05 * Math.sin(k * tw) : 0);
  S.paddle.velocity.x = active ? 0.05 * k * Math.cos(k * tw) : 0;

  S.world.step(DT);
  S.steps++;
  for (const o of S.objects) postStep(o);
}

// ---------- readout ----------
function boatInfo(t) {
  const boat = S.objects.find(o => o.isBoat);
  if (!boat) return { present: false, draftCm: 0, freeboardCm: 0, weights: 0, sunk: false };
  const P = boat.body.position;
  const surf = surfaceY(P.x, P.z, t);
  return {
    present: true,
    draftCm: Math.max(0, (surf - lowestY(boat)) * 100),
    freeboardCm: (minRimY(boat) - surf) * 100,
    weights: S.objects.filter(o => o.isWeight && insideHull(boat, o)).length,
    sunk: boat.flooded && boat.onFloor,
  };
}
function describe(o, info) {
  if (o.isBoat) {
    const extra = info.sunk ? ' · sunk' : o.flooded ? ' · flooded' : '';
    const line = o.settled
      ? `draft ${info.draftCm.toFixed(1)} cm · freeboard ${info.freeboardCm.toFixed(1)} cm · ${info.weights} weights${extra}`
      : 'settling';
    return { title: 'Steel boat', line };
  }
  const line = o.settled ? `${(o.frac * 100).toFixed(0)}% submerged · ${o.state}` : 'settling';
  return { title: `${o.name} · ${o.density} kg/m³`, line };
}
const _p = new THREE.Vector3();
function updateTags(info) {
  for (const o of S.objects) {
    if (!o.tag) continue;
    const P = o.body.position;
    _p.set(P.x, P.y + o.tagY, P.z).project(camera);
    if (_p.z > 1) { o.tag.style.display = 'none'; continue; }
    o.tag.style.display = 'block';
    o.tag.style.left = `${(_p.x * 0.5 + 0.5) * window.innerWidth}px`;
    o.tag.style.top = `${(-_p.y * 0.5 + 0.5) * window.innerHeight}px`;
    const d = describe(o, info);
    const html = `<b>${d.title}</b><br>${d.line}`;
    if (html !== o.tagHTML) { o.tag.innerHTML = html; o.tagHTML = html; }
  }
}
const rowsEl = document.getElementById('rows');
const logEl = document.getElementById('log');
function updatePanel(info) {
  const rows = S.objects.filter(o => !o.isWeight).map(o => {
    const d = describe(o, info);
    return `<div class="entry"><b>${d.title}</b><br>${d.line}</div>`;
  });
  rowsEl.innerHTML = rows.join('') || '<div class="entry">Tank is empty</div>';
  logEl.innerHTML = S.logLines.map(l => `<div>${l}</div>`).join('');
}
function log(msg) {
  S.logLines.unshift(`t=${now().toFixed(1)} s · ${msg}`);
  if (S.logLines.length > 8) S.logLines.length = 8;
}
const statusEl = document.getElementById('status');
function setStatus(s) { statusEl.textContent = s; }

// ---------- world lifecycle ----------
function reset() {
  for (const o of S.objects) {
    scene.remove(o.mesh);
    o.mesh.traverse(m => { if (m.geometry) m.geometry.dispose(); });
    if (o.tag) o.tag.remove();
  }
  S.objects = [];
  S.ripples = [];
  S.drag = null;
  S.steps = 0;
  S.next = 0;
  S.waveT0 = -1e9;
  S.logLines = [];
  S.world = buildWorld();
  liquidMat.color.set(liq().color);
  surfMat.color.set(liq().color);
  log(`Tank reset: ${liq().name.toLowerCase()}, g = ${S.gravity.toFixed(2)} m/s²`);
}

function setCamera(name) {
  S.cam = name;
  const c = CAMS[name];
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  camera.lookAt(...c.target);
  controls.enabled = name === 'orbit';
  controls.update();
  document.querySelectorAll('.cam').forEach(b => b.classList.toggle('active', b.dataset.cam === name));
}

function addWeight() {
  const boat = S.objects.find(o => o.isBoat);
  if (!boat) { setStatus('Lower the steel boat first (palette)'); return; }
  const P = boat.body.position;
  createObject('weight', P.x, P.y + 0.25, P.z);
  log('Steel weight added above the hull');
}

// ---------- pointer: drag, drop, camera ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hitPt = new THREE.Vector3();
const SIDE_PLANE = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const TOP_PLANE = new THREE.Plane(new THREE.Vector3(0, 1, 0), -DROP_Y);
function setRay(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function dropPoint(ev) {
  setRay(ev);
  return raycaster.ray.intersectPlane(S.cam === 'side' ? SIDE_PLANE : TOP_PLANE, hitPt) ? hitPt : null;
}
let clickStart = null;
canvas.addEventListener('pointerdown', ev => {
  setRay(ev);
  const hits = raycaster.intersectObjects(S.objects.flatMap(o => o.pickables), false);
  if (hits.length) {
    const o = hits[0].object.userData.obj;
    ev.stopImmediatePropagation();          // keep OrbitControls from turning the view
    const P = o.body.position;
    const centre = new THREE.Vector3(P.x, P.y, P.z);
    const dir = camera.getWorldDirection(new THREE.Vector3());
    S.drag = {
      o,
      plane: new THREE.Plane().setFromNormalAndCoplanarPoint(dir, hits[0].point),
      offset: hits[0].point.clone().sub(centre),
      target: centre.clone(),
    };
    setStatus(`Dragging ${o.name}`);
    return;
  }
  if (S.tool) clickStart = { x: ev.clientX, y: ev.clientY };
});
window.addEventListener('pointermove', ev => {
  if (!S.drag) return;
  setRay(ev);
  if (!raycaster.ray.intersectPlane(S.drag.plane, hitPt)) return;
  const d = S.drag;
  d.target.copy(hitPt).sub(d.offset);
  d.target.y = Math.max(0.03, Math.min(2.0, d.target.y));
  if (S.paused) {                             // paused: place the object directly
    d.o.body.position.set(d.target.x, d.target.y, d.target.z);
    d.o.body.velocity.set(0, 0, 0);
  }
});
window.addEventListener('pointerup', ev => {
  if (S.drag) { setStatus(''); S.drag = null; }
  if (clickStart && Math.hypot(ev.clientX - clickStart.x, ev.clientY - clickStart.y) < 6) {
    const p = dropPoint(ev);
    if (p) {
      const lim = S.tool === 'boat' ? 1.1 : 1.4;
      const x = Math.max(-lim, Math.min(lim, p.x));
      const z = S.cam === 'side' ? 0 : Math.max(-0.6, Math.min(0.6, p.z));
      if (Math.abs(p.x) <= TANK.hx + 0.2) spawn(S.tool, x, DROP_Y, z);
      else setStatus('Click above the tank');
    }
  }
  clickStart = null;
});

// ---------- UI wiring ----------
function syncToolButtons() {
  document.querySelectorAll('#palette button').forEach(b => b.classList.toggle('active', b.dataset.kind === S.tool));
}
document.querySelectorAll('#palette button').forEach(btn => btn.addEventListener('click', () => {
  S.tool = S.tool === btn.dataset.kind ? null : btn.dataset.kind;
  syncToolButtons();
  setStatus(S.tool ? `Click above the tank to drop: ${KINDS[S.tool].name}` : 'Drag objects with the pointer');
}));

const pauseBtn = document.getElementById('pause');
function togglePause() {
  S.paused = !S.paused;
  pauseBtn.textContent = S.paused ? 'Play' : 'Pause';
}
pauseBtn.addEventListener('click', togglePause);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) { e.preventDefault(); togglePause(); }
});

document.querySelectorAll('.speed').forEach(b => b.addEventListener('click', () => {
  S.speed = parseFloat(b.dataset.speed);
  document.querySelectorAll('.speed').forEach(x => x.classList.toggle('active', x === b));
}));
document.querySelectorAll('.cam').forEach(b => b.addEventListener('click', () => setCamera(b.dataset.cam)));

document.getElementById('waves').addEventListener('click', () => {
  S.waveT0 = now();
  log('Paddle started: waves sent along the tank');
});
document.getElementById('weight').addEventListener('click', addWeight);
document.getElementById('reset').addEventListener('click', reset);

const liquidSel = document.getElementById('liquid');
liquidSel.addEventListener('change', () => {
  S.liquidKey = liquidSel.value;
  reset();
});

const gravityIn = document.getElementById('gravity');
gravityIn.addEventListener('input', () => {
  S.gravity = parseFloat(gravityIn.value);
  S.world.gravity.set(0, -S.gravity, 0);
  document.getElementById('gravityOut').textContent = S.gravity.toFixed(2);
});

const customIn = document.getElementById('customDensity');
customIn.addEventListener('input', () => {
  S.customDensity = parseFloat(customIn.value);
  document.getElementById('customOut').textContent = S.customDensity;
  document.getElementById('customTag').textContent = S.customDensity;
  for (const o of S.objects) {
    if (o.kind !== 'custom') continue;
    o.density = S.customDensity;
    o.body.mass = o.density * o.volume;
    o.body.updateMassProperties();
    o.mesh.material.color.setHSL(customHue(o.density), 0.55, 0.5);
  }
});

const dragIn = document.getElementById('drag');
dragIn.addEventListener('input', () => {
  S.dragSlider = parseFloat(dragIn.value);
  document.getElementById('dragOut').textContent = S.dragSlider.toFixed(2);
});

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---------- inspection hook ----------
window.tankState = () => {
  const t = now();
  const info = boatInfo(t);
  const r = (v, d = 3) => Math.round(v * 10 ** d) / 10 ** d;
  return {
    liquid: { name: liq().name, density: liq().density },
    objects: S.objects.filter(o => !o.isBoat && !o.isWeight).map(o => ({
      id: o.id,
      name: o.name,
      density: o.density,
      submergedFraction: r(Math.min(1, Math.max(0, o.frac))),
      state: o.state,
      position: [r(o.body.position.x), r(o.body.position.y), r(o.body.position.z)],
      settled: o.settled,
    })),
    boat: {
      draftCm: r(info.draftCm, 2),
      freeboardCm: r(info.freeboardCm, 2),
      weights: info.weights,
      sunk: info.sunk,
    },
    settings: {
      liquid: S.liquidKey,
      gravity: S.gravity,
      customDensity: S.customDensity,
      liquidDrag: S.dragSlider,
      paused: S.paused,
      speed: S.speed,
      camera: S.cam,
      time: r(t, 2),
    },
  };
};

// ---------- main loop ----------
let frames = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (ts - S.last) / 1000));
  S.last = ts;
  if (!S.paused) {
    S.acc += dt * S.speed;
    let n = 0;
    while (S.acc >= DT && n < MAX_STEPS) { physicsStep(); S.acc -= DT; n++; }
    if (S.acc >= DT) S.acc = 0;                // drop backlog after hitting the cap
  }
  const t = now();
  if (S.ripples.length) S.ripples = S.ripples.filter(r => t - r.t0 < 5);
  for (const o of S.objects) {
    o.mesh.position.copy(o.body.position);
    o.mesh.quaternion.copy(o.body.quaternion);
  }
  paddleMesh.position.copy(S.paddle.position);
  updateSurface(t);
  controls.update();
  renderer.render(scene, camera);
  const info = boatInfo(t);
  updateTags(info);
  if (++frames % 6 === 0) updatePanel(info);
}

reset();
setCamera('side');
requestAnimationFrame(frame);
</script>
</body>
</html>
