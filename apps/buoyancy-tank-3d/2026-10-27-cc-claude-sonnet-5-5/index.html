<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
  :root { --bg:#0f141a; --panel:rgba(14,20,28,.74); --line:rgba(255,255,255,.13); --fg:#e8eef5; --dim:#93a3b5; --acc:#3d8bd0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #brand { position:fixed; top:10px; left:14px; margin:0; font-size:18px; font-weight:650; letter-spacing:.2px; text-shadow:0 1px 6px #000; pointer-events:none; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; backdrop-filter:blur(8px); }
  #palette { left:12px; top:46px; width:172px; }
  #palette h3, #readout h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600; }
  .pitem { display:flex; align-items:center; gap:8px; width:100%; margin:0 0 4px; padding:6px 8px; text-align:left; background:#1d2937; color:var(--fg); border:1px solid transparent; border-radius:7px; cursor:pointer; font:inherit; }
  .pitem:hover { background:#25374a; }
  .pitem.sel { border-color:var(--acc); background:#27415c; }
  .pitem .sw { width:14px; height:14px; border-radius:3px; flex:none; border:1px solid rgba(255,255,255,.3); }
  .pitem small { margin-left:auto; color:var(--dim); font-size:11px; }
  #hint { color:var(--dim); font-size:11px; margin:6px 0 0; }
  .sl { display:block; margin-top:8px; font-size:12px; color:var(--dim); }
  .sl input { width:100%; margin:3px 0 0; }
  .sl b { color:var(--fg); font-weight:600; }
  #readout { right:12px; top:12px; width:282px; max-height:calc(100vh - 130px); overflow:auto; }
  #readout .liq { color:var(--dim); font-size:12px; margin-bottom:6px; }
  .row { padding:5px 0; border-top:1px solid var(--line); }
  .row .n { font-weight:600; }
  .row .d { color:var(--dim); }
  .row .v { display:flex; justify-content:space-between; gap:8px; font-variant-numeric:tabular-nums; }
  .st-floating { color:#7fe0a4; } .st-sinking { color:#ffb36b; } .st-bottom { color:#9bb3ff; }
  #bar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 14px; max-width:96vw; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; backdrop-filter:blur(8px); }
  .grp { display:flex; align-items:center; gap:4px; }
  .grp > span { color:var(--dim); font-size:11px; margin-right:3px; }
  .btn { background:#1f2d3d; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:6px 10px; font:inherit; cursor:pointer; }
  .btn:hover { background:#294057; }
  .btn.on { background:var(--acc); border-color:var(--acc); }
  select { background:#1f2d3d; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:5px 6px; font:inherit; }
  #bar label { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  #bar label b { color:var(--fg); font-weight:600; min-width:34px; font-variant-numeric:tabular-nums; }
  #bar input[type=range] { width:96px; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; left:0; top:0; white-space:nowrap; font-size:11px; line-height:1.3; background:rgba(8,14,22,.8); border:1px solid rgba(255,255,255,.16); border-radius:6px; padding:3px 7px; will-change:transform; }
  .lbl b { font-weight:650; } .lbl i { font-style:normal; color:#b7c6d6; }
  #toast { position:fixed; top:58px; left:50%; transform:translateX(-50%); background:rgba(10,16,24,.9); border:1px solid var(--line); padding:6px 12px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; }
  @media (max-width:900px) { #readout { display:none; } #palette { top:44px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<h1 id="brand">Claude Sonnet 5.5</h1>

<aside id="palette" class="panel">
  <h3>Objects</h3>
  <div id="plist"></div>
  <label class="sl">Custom density <b id="cdVal">1200</b> kg/m³
    <input id="cd" type="range" min="100" max="3000" step="10" value="1200">
  </label>
  <p id="hint">Pick an object, then click above the tank to drop it. Drag any object with the pointer.</p>
</aside>

<aside id="readout" class="panel">
  <h3>Readout</h3>
  <div class="liq" id="liqInfo"></div>
  <div id="rows"></div>
</aside>

<div id="bar">
  <div class="grp"><button class="btn" id="bPause">Pause</button></div>
  <div class="grp"><span>Speed</span>
    <button class="btn spd" data-s="0.25">0.25×</button><button class="btn spd" data-s="0.5">0.5×</button><button class="btn spd on" data-s="1">1×</button></div>
  <div class="grp"><span>Camera</span>
    <button class="btn cam on" data-c="side">Side</button><button class="btn cam" data-c="top">Top</button><button class="btn cam" data-c="orbit">Orbit</button></div>
  <div class="grp"><button class="btn" id="bWaves">Make waves</button><button class="btn" id="bWeight">Add weight</button><button class="btn" id="bReset">Reset</button></div>
  <div class="grp"><label>Liquid
    <select id="liquid"><option value="fresh">Fresh water</option><option value="sea">Sea water</option><option value="oil">Oil</option></select></label></div>
  <div class="grp"><label>Gravity <input id="grav" type="range" min="1" max="25" step="0.01" value="9.81"><b id="gravVal">9.81</b></label></div>
  <div class="grp"><label>Liquid drag <input id="drag" type="range" min="0" max="3" step="0.05" value="1"><b id="dragVal">1.0×</b></label></div>
</div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

/* ------------------------------------------------------------------ constants */
const TL = 3.0, TW = 1.5, TH = 1.2, LEVEL = 0.8, HX = TL / 2, HZ = TW / 2;
const NX = 96, NZ = 48, DX = TL / NX, DZ = TW / NZ, INVDX = 1 / DX, INVDZ = 1 / DZ;
const DT = 1 / 180, MAXSTEPS = 8;
const K_LIN = 6, K_ANG = 0.4, CD = 1.3;
const HULL = { mass: 10.5, comY: 0.0671, cy: 0.0329, vol: 0.6 * 0.4 * 0.2, vin: 0.6 * 0.4 * 0.2 - 10.5 / 7850, rimY: 0.1329 };
const LIQ = {
  fresh: { name: 'Fresh water', density: 1000, drag: 1.0,  color: 0x3fa6e8, top: 0.5,  side: 0.22 },
  sea:   { name: 'Sea water',   density: 1025, drag: 1.08, color: 0x2fb59c, top: 0.55, side: 0.26 },
  oil:   { name: 'Oil',         density: 880,  drag: 1.9,  color: 0xe6a02c, top: 0.55, side: 0.3 }
};
const S = { liquid: 'fresh', gravity: 9.81, customDensity: 1200, drag: 1, speed: 1, paused: false, camera: 'side', selected: null };
const liq = () => LIQ[S.liquid];
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ renderer / scene */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141a21);
scene.fog = new THREE.Fog(0x141a21, 12, 30);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);

const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.set(1.6, 5, 2.6); sun.target.position.set(0, 0.4, 0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.6, right: 2.6, top: 2.4, bottom: -2.4, near: 1, far: 12 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x2a2218, 0.55));
const lamp = new THREE.PointLight(0xffc27a, 30, 10, 2); lamp.position.set(-2.4, 2.6, -1.2); scene.add(lamp);

/* ------------------------------------------------------------------ procedural textures (deterministic) */
const RND = seed => { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; };
function tex(w, h, fn, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
const T = {
  cork: tex(256, 256, (g, w, h) => {
    const r = RND(11); g.fillStyle = '#b98550'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2800; i++) {
      const v = r(); g.fillStyle = v < .5 ? `rgba(85,50,22,${.25 + r() * .4})` : `rgba(232,194,146,${.2 + r() * .4})`;
      g.beginPath(); g.arc(r() * w, r() * h, .6 + r() * 2.4, 0, 7); g.fill();
    }
  }),
  wood: tex(256, 256, (g, w, h) => {
    const r = RND(23); g.fillStyle = '#d9b27a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 80; i++) {
      g.strokeStyle = `rgba(125,78,38,${.12 + r() * .32})`; g.lineWidth = .6 + r() * 2.2;
      const x0 = r() * w, ph = r() * 6; g.beginPath(); g.moveTo(x0, 0);
      for (let y = 0; y <= h; y += 16) g.lineTo(x0 + Math.sin(y * .03 + ph) * 7 + Math.sin(y * .11 + i) * 1.5, y);
      g.stroke();
    }
    for (let k = 0; k < 3; k++) { g.strokeStyle = 'rgba(100,60,28,.35)'; g.lineWidth = 1.2;
      for (let q = 1; q < 5; q++) { g.beginPath(); g.ellipse(r() * w, r() * h, 3 + q * 3, 8 + q * 6, 0, 0, 7); g.stroke(); } }
  }),
  alu: tex(256, 256, (g, w, h) => {
    const r = RND(31); g.fillStyle = '#b6bbc2'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1100; i++) { const y = r() * h, x = r() * w, l = 40 + r() * 190;
      g.strokeStyle = r() < .5 ? `rgba(255,255,255,${.05 + r() * .12})` : `rgba(70,76,88,${.05 + r() * .1})`;
      g.lineWidth = .6 + r(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (r() - .5)); g.stroke(); }
  }),
  steel: tex(256, 256, (g, w, h) => {
    const r = RND(47); g.fillStyle = '#343a42'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 700; i++) { const y = r() * h, x = r() * w, l = 20 + r() * 120;
      g.strokeStyle = r() < .6 ? `rgba(255,255,255,${.03 + r() * .06})` : `rgba(0,0,0,${.1 + r() * .15})`;
      g.lineWidth = .6 + r() * .8; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y); g.stroke(); }
  }),
  ice: tex(256, 256, (g, w, h) => {
    const r = RND(59); const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, '#d6f1fb'); gr.addColorStop(1, '#a9d8ec'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) { g.strokeStyle = `rgba(255,255,255,${.25 + r() * .5})`; g.lineWidth = .5 + r() * 1.3;
      g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += (r() - .5) * 70; y += (r() - .5) * 70; g.lineTo(x, y); } g.stroke(); }
  }),
  floor: tex(512, 512, (g, w, h) => {
    const r = RND(71); for (let i = 0; i < 8; i++) { const l = 28 + r() * 14; g.fillStyle = `hsl(28,${28 + r() * 10}%,${l}%)`; g.fillRect(0, i * h / 8, w, h / 8);
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.strokeRect(0, i * h / 8, w, h / 8);
      for (let k = 0; k < 14; k++) { g.strokeStyle = 'rgba(40,20,8,.12)'; g.beginPath(); const y = i * h / 8 + r() * h / 8; g.moveTo(0, y); g.lineTo(w, y + (r() - .5) * 4); g.stroke(); } }
  }, [6, 6]),
  wall: tex(512, 512, (g, w, h) => {
    g.fillStyle = '#46505b'; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(0,0,0,.45)';
    for (let y = 8; y < h; y += 16) for (let x = 8; x < w; x += 16) { g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill(); }
  }, [7, 3])
};

/* ------------------------------------------------------------------ materials */
function matFor(key, density) {
  switch (key) {
    case 'cork': return new THREE.MeshStandardMaterial({ map: T.cork, roughness: .95, metalness: 0 });
    case 'pine': case 'plank': return new THREE.MeshStandardMaterial({ map: T.wood, roughness: .7, metalness: 0 });
    case 'ice': return new THREE.MeshPhysicalMaterial({ map: T.ice, transparent: true, opacity: .62, roughness: .08, metalness: 0, clearcoat: 1, ior: 1.31, envMapIntensity: 1.5 });
    case 'alu': return new THREE.MeshStandardMaterial({ map: T.alu, metalness: 1, roughness: .32, envMapIntensity: 1.2 });
    case 'steel': case 'weight': return new THREE.MeshStandardMaterial({ map: T.steel, color: 0x9aa1ab, metalness: .9, roughness: .45 });
    case 'boat': return new THREE.MeshStandardMaterial({ map: T.steel, color: 0xa4afc0, metalness: .85, roughness: .4, side: THREE.DoubleSide });
    default: return new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.75 - Math.min(density, 3000) / 3000 * 0.72, .55, .5), roughness: .45, metalness: .1 });
  }
}

/* ------------------------------------------------------------------ static workshop + glass tank */
const woodMat = new THREE.MeshStandardMaterial({ map: T.wood, roughness: .8, color: 0xb9946a });
const floorM = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshStandardMaterial({ map: T.floor, roughness: .85 }));
floorM.rotation.x = -Math.PI / 2; floorM.position.y = -1.0; floorM.receiveShadow = true; scene.add(floorM);
const wallM = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), new THREE.MeshStandardMaterial({ map: T.wall, roughness: .9 }));
wallM.position.set(0, 2, -3.2); wallM.receiveShadow = true; scene.add(wallM);
const bench = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.14, 2.0), woodMat);
bench.position.set(0, -0.11, 0); bench.receiveShadow = true; bench.castShadow = true; scene.add(bench);
for (const sx of [-1.7, 1.7]) for (const sz of [-0.85, 0.85]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.82, 0.1), new THREE.MeshStandardMaterial({ color: 0x2c333b, metalness: .7, roughness: .5 }));
  leg.position.set(sx, -0.59, sz); leg.castShadow = true; scene.add(leg);
}
const shelf = new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 0.4), woodMat); shelf.position.set(-1.8, 1.5, -3.0); scene.add(shelf);
[[-2.7, 0xb83b3b], [-2.35, 0x3b78b8], [-1.95, 0xd0a23a]].forEach(([x, c]) => {
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.26, 24), new THREE.MeshStandardMaterial({ color: c, metalness: .5, roughness: .4 }));
  can.position.set(x, 1.66, -3.0); can.castShadow = true; scene.add(can);
});
const tankFloor = new THREE.Mesh(new THREE.BoxGeometry(3.08, 0.04, 1.58), new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: .55 }));
tankFloor.position.y = -0.02; tankFloor.receiveShadow = true; scene.add(tankFloor);

const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xdff4ff, transparent: true, opacity: .1, roughness: .02, metalness: 0, clearcoat: 1, envMapIntensity: 2.4, depthWrite: false, side: THREE.DoubleSide });
function pane(w, h, d, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMat); m.position.set(x, y, z); m.renderOrder = 3; scene.add(m); return m; }
pane(TL + 0.03, TH, 0.012, 0, TH / 2, HZ + 0.006);
pane(TL + 0.03, TH, 0.012, 0, TH / 2, -HZ - 0.006);
pane(0.012, TH, TW, HX + 0.006, TH / 2, 0);
pane(0.012, TH, TW, -HX - 0.006, TH / 2, 0);
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x20262d, metalness: .6, roughness: .35 });
function beam(w, h, d, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), edgeMat); m.position.set(x, y, z); m.castShadow = false; scene.add(m); }
for (const y of [0, TH]) for (const z of [-HZ - .012, HZ + .012]) beam(TL + .06, .026, .026, 0, y, z);
for (const y of [0, TH]) for (const x of [-HX - .012, HX + .012]) beam(.026, .026, TW + .06, x, y, 0);
for (const x of [-HX - .012, HX + .012]) for (const z of [-HZ - .012, HZ + .012]) beam(.026, TH + .026, .026, x, TH / 2, z);

/* ------------------------------------------------------------------ wave field (staggered shallow-water grid) */
const eta = new Float32Array(NX * NZ);
const ux = new Float32Array((NX + 1) * NZ);
const uz = new Float32Array(NX * (NZ + 1));
let etaMin = 0, etaMax = 0, vp = 0, paddleP = 0, paddleT0 = -100;
const PADDLE = { dur: 8, amp: 0.018, freq: 1.2 };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function surfAt(x, z) {
  let fx = (x + HX) * INVDX - 0.5, fz = (z + HZ) * INVDZ - 0.5;
  if (fx < 0) fx = 0; else if (fx > NX - 1.001) fx = NX - 1.001;
  if (fz < 0) fz = 0; else if (fz > NZ - 1.001) fz = NZ - 1.001;
  const i = fx | 0, j = fz | 0, tx = fx - i, tz = fz - j, k = j * NX + i;
  return LEVEL + (eta[k] * (1 - tx) + eta[k + 1] * tx) * (1 - tz) + (eta[k + NX] * (1 - tx) + eta[k + NX + 1] * tx) * tz;
}
let wuX = 0, wuZ = 0;
function waterVel(x, z) {
  const ci = clamp(Math.floor((x + HX) * INVDX), 0, NX - 1), cj = clamp(Math.floor((z + HZ) * INVDZ), 0, NZ - 1);
  wuX = 0.5 * (ux[cj * (NX + 1) + ci] + ux[cj * (NX + 1) + ci + 1]);
  wuZ = 0.5 * (uz[cj * NX + ci] + uz[(cj + 1) * NX + ci]);
}
function inject(x, z, dV, r) {
  const ci = Math.floor((x + HX) * INVDX), cj = Math.floor((z + HZ) * INVDZ);
  const i0 = Math.max(0, ci - r), i1 = Math.min(NX - 1, ci + r), j0 = Math.max(0, cj - r), j1 = Math.min(NZ - 1, cj + r);
  const cnt = (i1 - i0 + 1) * (j1 - j0 + 1); if (cnt <= 0) return;
  const add = dV / (cnt * DX * DZ);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) eta[j * NX + i] += add;
}
function paddlePos(t) {
  const tp = t - paddleT0; if (tp <= 0 || tp >= PADDLE.dur) return 0;
  const ss = v => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
  return PADDLE.amp * Math.sin(2 * Math.PI * PADDLE.freq * tp) * ss(tp) * ss(PADDLE.dur - tp);
}
function waveStep(dt) {
  const G = Math.min(S.gravity, 15), GAM = 0.5, H = LEVEL;
  for (let j = 0; j < NZ; j++) {
    const ro = j * (NX + 1), re = j * NX;
    for (let i = 1; i < NX; i++) {
      const k = ro + i; ux[k] += dt * (-G * (eta[re + i] - eta[re + i - 1]) * INVDX - GAM * ux[k]);
    }
    ux[ro] = vp; ux[ro + NX] = 0;
  }
  for (let j = 1; j < NZ; j++) {
    const ro = j * NX, rp = (j - 1) * NX;
    for (let i = 0; i < NX; i++) { const k = ro + i; uz[k] += dt * (-G * (eta[k] - eta[rp + i]) * INVDZ - GAM * uz[k]); }
  }
  let mn = 1e9, mx = -1e9;
  for (let j = 0; j < NZ; j++) {
    const ro = j * (NX + 1), re = j * NX;
    for (let i = 0; i < NX; i++) {
      const k = re + i;
      let e = eta[k] - dt * H * ((ux[ro + i + 1] - ux[ro + i]) * INVDX + (uz[k + NX] - uz[k]) * INVDZ);
      if (e > 0.3) e = 0.3; else if (e < -0.3) e = -0.3;
      eta[k] = e; if (e < mn) mn = e; if (e > mx) mx = e;
    }
  }
  etaMin = mn; etaMax = mx;
}

/* ------------------------------------------------------------------ water meshes */
const E = 0.003, NVX = NX + 1, NVZ = NZ + 1;
const topPos = new Float32Array(NVX * NVZ * 3);

    camera.getWorldDirection(_v); plane.setFromNormalAndCoplanarPoint(_v, hit.point);
    const local = new CANNON.Vec3(); e.body.pointToLocalFrame(new CANNON.Vec3(hit.point.x, hit.point.y, hit.point.z), local);
    drag = { e, plane, local, target: hit.point.clone() }; e.held = true; e.settleT = 0;
    canvas.setPointerCapture(ev.pointerId); canvas.style.cursor = 'grabbing';
  } else if (S.selected) click = { x: ev.clientX, y: ev.clientY };
});
canvas.addEventListener('pointermove', ev => {
  setNdc(ev);
  if (drag) {
    const pt = new THREE.Vector3();
    if (ray.ray.intersectPlane(drag.plane, pt)) {
      pt.x = clamp(pt.x, -HX + 0.12, HX - 0.12); pt.z = clamp(pt.z, -HZ + 0.12, HZ - 0.12); pt.y = clamp(pt.y, 0.12, 2.4);
      drag.target.copy(pt);
    }
  } else {
    const meshes = []; for (const e of ents) meshes.push(...e.pick);
    canvas.style.cursor = ray.intersectObjects(meshes, false).length ? 'grab' : (S.selected ? 'crosshair' : 'default');
  }
});
function endDrag() { if (drag) { drag.e.held = false; drag = null; canvas.style.cursor = 'default'; } }
canvas.addEventListener('pointerup', ev => {
  if (drag) { endDrag(); return; }
  if (click && S.selected && Math.hypot(ev.clientX - click.x, ev.clientY - click.y) < 6) {
    setNdc(ev); const o = ray.ray.origin, d = ray.ray.direction; let x = null, z = 0;
    if (S.camera !== 'side' && d.y < -0.02) { const t = (1.5 - o.y) / d.y; x = o.x + d.x * t; z = o.z + d.z * t; }
    else if (S.camera === 'side' && Math.abs(d.z) > 1e-4) { const t = -o.z / d.z; x = o.x + d.x * t; z = ((dropCount % 3) - 1) * 0.25; }
    if (x !== null) {
      x = clamp(x, -HX + 0.2, HX - 0.2); z = clamp(z, -HZ + 0.2, HZ - 0.2); dropCount++;
      if (S.selected === 'boat') spawnBoat(x, z, 1.0 + HULL.comY);
      else spawnBlock(S.selected, x, S.selected === 'plank' ? 1.5 : 1.45, z);
    } else toast('Click above the tank to drop');
  }
  click = null;
});
canvas.addEventListener('pointercancel', () => { endDrag(); click = null; });
orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.target.set(0, 0.5, 0); orbit.enabled = false; orbit.userMoved = false;
orbit.addEventListener('start', () => { orbit.userMoved = true; });

/* ------------------------------------------------------------------ UI */
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; }, 1800); }
const PAL = [
  ['cork', 'Cork', '240', '#b98550'], ['pine', 'Pine cube', '500', '#d9b27a'], ['plank', 'Pine plank', '500', '#c99e62'], ['ice', 'Ice', '917', '#bfe6f5'],
  ['alu', 'Aluminium', '2700', '#b6bbc2'], ['steel', 'Steel', '7850', '#343a42'], ['custom', 'Custom', '', '#8a5cc6'], ['boat', 'Steel boat', '10.5 kg', '#59657a']
];
const plist = $('plist');
for (const [k, n, d, c] of PAL) {
  const b = document.createElement('button'); b.className = 'pitem'; b.dataset.k = k;
  b.innerHTML = `<span class="sw" style="background:${c}"></span>${n}<small>${d}</small>`;
  if (k === 'custom') b.querySelector('small').id = 'palCd';
  b.addEventListener('click', () => { S.selected = S.selected === k ? null : k; syncPalette(); canvas.style.cursor = S.selected ? 'crosshair' : 'default'; b.blur(); });
  plist.appendChild(b);
}
function syncPalette() { plist.querySelectorAll('.pitem').forEach(b => b.classList.toggle('sel', b.dataset.k === S.selected)); }
function updateCustomSwatch() {
  $('palCd').textContent = S.customDensity;
  plist.querySelector('[data-k=custom] .sw').style.background = '#' + new THREE.Color().setHSL(0.75 - S.customDensity / 3000 * 0.72, .55, .5).getHexString();
}
$('cd').addEventListener('input', ev => {
  S.customDensity = +ev.target.value; $('cdVal').textContent = S.customDensity; updateCustomSwatch();
  for (const e of ents) if (e.key === 'custom') {
    e.density = S.customDensity; e.body.mass = S.customDensity * e.vol; e.body.updateMassProperties();
    e.mesh.material.color.setHSL(0.75 - S.customDensity / 3000 * 0.72, .55, .5);
  }
});
$('grav').addEventListener('input', ev => { S.gravity = +ev.target.value; $('gravVal').textContent = S.gravity.toFixed(2); world.gravity.set(0, -S.gravity, 0); });
$('drag').addEventListener('input', ev => { S.drag = +ev.target.value; $('dragVal').textContent = S.drag.toFixed(1) + '×'; });
$('liquid').addEventListener('change', ev => { S.liquid = ev.target.value; resetScene(); ev.target.blur(); });
$('bReset').addEventListener('click', ev => { resetScene(); ev.currentTarget.blur(); });
$('bWaves').addEventListener('click', ev => { paddleT0 = simTime; ev.currentTarget.blur(); });
$('bWeight').addEventListener('click', ev => { addWeight(); ev.currentTarget.blur(); });
function setPaused(p) { S.paused = p; $('bPause').textContent = p ? 'Play' : 'Pause'; }
$('bPause').addEventListener('click', ev => { setPaused(!S.paused); ev.currentTarget.blur(); });
document.querySelectorAll('.spd').forEach(b => b.addEventListener('click', () => {
  S.speed = +b.dataset.s; document.querySelectorAll('.spd').forEach(x => x.classList.toggle('on', x === b)); b.blur();
}));
document.querySelectorAll('.cam').forEach(b => b.addEventListener('click', () => { setCamera(b.dataset.c); b.blur(); }));
window.addEventListener('keydown', ev => {
  if (ev.code !== 'Space') return;
  const t = document.activeElement && document.activeElement.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  ev.preventDefault(); if (!ev.repeat) setPaused(!S.paused);
});
window.addEventListener('keyup', ev => { if (ev.code === 'Space') { const t = document.activeElement && document.activeElement.tagName; if (t !== 'INPUT' && t !== 'SELECT') ev.preventDefault(); } });
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ readout + labels */
function fmtState(e) { return `<span class="st-${e.state}">${e.state === 'bottom' ? 'on the bottom' : e.state}</span>`; }
function describe(e) {
  if (e.isBoat) {
    const m = boatMetrics(e), sunk = e.f >= 0.95, st = sunk && e.state !== 'bottom' ? 'sinking' : e.state;
    return { head: `${e.name} · ${e.weights} weight${e.weights === 1 ? '' : 's'}`, dens: sunk ? 'flooded' : `${Math.round(e.f * 100)} % flooded`,
      l2: e.settled ? `draft ${m.draftCm.toFixed(1)} cm · freeboard ${m.freeboardCm.toFixed(1)} cm` : 'draft / freeboard: settling', st };
  }
  return { head: e.name, dens: `${Math.round(e.density)} kg/m³`, l2: e.settled ? `submerged ${(e.frac * 100).toFixed(0)} %` : 'submerged: settling', st: e.state };
}
let panelT = 0;
function updatePanel() {
  const L = liq(); $('liqInfo').textContent = `${L.name} · ${L.density} kg/m³ · g ${S.gravity.toFixed(2)} m/s²`;
  const list = ents.filter(e => !e.isWeight);
  $('rows').innerHTML = list.length ? list.map(e => { const d = describe(e);
    return `<div class="row"><div class="v"><span class="n">${d.head}</span><span class="d">${d.dens}</span></div><div class="v"><span>${d.l2}</span>${fmtState({ state: d.st })}</div></div>`;
  }).join('') : '<div class="row d">Waiting for the first drop…</div>';
  for (const e of list) { const d = describe(e);
    e.label.innerHTML = `<b>${d.head}</b> <i>${d.dens}</i><br><i>${d.l2} · ${d.st === 'bottom' ? 'on the bottom' : d.st}</i>`; }
}
const _p = new THREE.Vector3();
function placeLabels() {
  const w = window.innerWidth, h = window.innerHeight; let idx = 0;
  for (const e of ents) {
    if (e.isWeight) continue;
    _p.set(e.body.position.x, e.body.position.y + e.hy + 0.12 + (e.key === 'plank' ? 0.1 : 0), e.body.position.z).project(camera);
    const vis = _p.z < 1 && _p.z > -1;
    e.label.style.display = vis ? '' : 'none';
    if (vis) { const px = (_p.x * 0.5 + 0.5) * w, py = (-_p.y * 0.5 + 0.5) * h - (idx % 2) * 34;
      e.label.style.transform = `translate(${Math.round(px - e.label.offsetWidth / 2)}px,${Math.round(py - e.label.offsetHeight - 4)}px)`; }
    idx++;
  }
}

/* ------------------------------------------------------------------ main loop */
let last = performance.now();
function frame(now) {
  const dtf = Math.min(0.1, (now - last) / 1000); last = now;
  if (!S.paused) {
    acc += dtf * S.speed; let steps = 0;
    while (acc >= DT && steps < MAXSTEPS) { stepPhysics(); acc -= DT; steps++; }
    if (acc > DT) acc = DT;
  }
  for (const e of ents) { e.mesh.position.copy(e.body.position); e.mesh.quaternion.copy(e.body.quaternion); }
  paddleMesh.position.x = -HX + 0.02 + paddleP;
  updateWaterMesh();
  if (S.camera === 'orbit') orbit.update();
  if (now - panelT > 120) { panelT = now; updatePanel(); }
  placeLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

updateCustomSwatch(); applyLiquidLook(); resize(); setCamera('side');
requestAnimationFrame(frame);
</script>
</body>
</html>
