</head><body><div id="scene"></div><div class="hud"><div class="brand">Codex</div><aside class="palette panel"><h2>DROP AN OBJECT</h2><button class="objbtn" data-kind="Cork"><span class="swatch" style="--sw:#b98c58"></span>Cork cube</button><button class="objbtn" data-kind="Pine"><span class="swatch" style="--sw:#b88c51"></span>Pine cube</button><button class="objbtn" data-kind="Ice"><span class="swatch" style="--sw:#9fe9f5"></span>Ice cube</button><button class="objbtn" data-kind="Aluminium"><span class="swatch" style="--sw:#aab5bc"></span>Aluminium cube</button><button class="objbtn" data-kind="Steel"><span class="swatch" style="--sw:#52616a"></span>Steel cube</button><button class="objbtn" data-kind="Pine plank"><span class="swatch" style="--sw:#a8783f"></span>Pine plank</button><button class="objbtn" data-kind="Custom"><span class="swatch" style="--sw:#c47a56"></span>Custom cube</button><label style="margin:8px 0 0">Custom density <span id="densityOut">700</span></label><input id="density" type="range" min="100" max="3000" value="700" style="width:100%"></aside><aside class="readout panel"><h2>LIVE MEASUREMENTS</h2><div id="objectReadings"></div><div class="entity"><strong>Steel boat</strong><small id="boatReadings">Preparing</small><div class="boatline"><span>Draft</span><b id="draft">—</b></div><div class="boatline"><span>Freeboard</span><b id="freeboard">—</b></div><div class="boatline"><span>Weights</span><b id="weights">0</b></div></div><div class="badge" id="engineStatus">INITIALIZING PHYSICS</div></aside><div class="hint">DRAG OBJECTS TO LIFT OR SUBMERGE · CLICK ABOVE TANK TO DROP SELECTED</div><nav class="bar"><button id="play">Ⅱ Pause</button><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select><span class="divider"></span><select id="liquid"><option value="fresh">Fresh water</option><option value="sea">Sea water</option><option value="oil">Oil</option></select><label>Gravity <input id="gravity" type="range" min="2" max="15" step=".01" value="9.81"><span id="gravityOut">9.81</span></label><label>Drag <input id="drag" type="range" min="0.5" max="8" step=".1" value="3.2"><span id="dragOut">3.2</span></label><span class="divider"></span><button id="waves">〰 Make waves</button><button id="weight">＋ Add weight</button><span class="divider"></span><button class="cam active" data-cam="side">Side</button><button class="cam" data-cam="top">Top</button><button class="cam" data-cam="orbit">Orbit</button><button id="reset">↻ Reset</button></nav></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm';
const $=s=>document.querySelector(s), root=$('#scene'); const DENS={Cork:240,Pine:500,Ice:917,Aluminium:2700,Steel:7850,Custom:700};const LIQ={fresh:{name:'Fresh water',density:1000,color:0x1593ab,drag:1},sea:{name:'Sea water',density:1025,color:0x258f83,drag:1.16},oil:{name:'Oil',density:880,color:0xbd8538,drag:.72}};
let renderer,scene,camera,world,ready=false,paused=false,speed=1,liquid=LIQ.fresh,simTime=0,acc=0,last=0,objs=[],boat=null,selected='Cork',wavePower=0,waveStart=-20,dragging=null,ptr=new THREE.Vector2(),ray=new THREE.Raycaster(),camMode='side',orbit={x:0,y:0},settlers=new Map(),idSeq=1;
const tank={L:3,W:1.5,H:1.2,water:.8};
await RAPIER.init();
scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1b20);scene.fog=new THREE.Fog(0x0a1b20,8,19);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,80);camera.position.set(0,2.3,6.8);
scene.add(new THREE.HemisphereLight(0x9bd9e5,0x152126,1.8));let key=new THREE.DirectionalLight(0xffe4c2,3.4);key.position.set(-3,6,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=5;key.shadow.camera.bottom=-4;scene.add(key);let fill=new THREE.PointLight(0x30c8d3,35,9);fill.position.set(2,2,2);scene.add(fill);
const mat=(color,rough=.45,metal=0,extra={})=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,...extra});let floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x182529,.94));floor.rotation.x=-Math.PI/2;floor.position.y=-.62;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(24,48,0x29434a,0x1c3037);grid.position.y=-.61;scene.add(grid);
// tank origin centered, floor at y=-0.6; water at y=0.2
// aquarium geometry and water mesh
let tankGroup=new THREE.Group();scene.add(tankGroup);const glass=new THREE.MeshPhysicalMaterial({color:0xc9ffff,roughness:.08,metalness:.05,transparent:true,opacity:.105,transmission:.35,thickness:.15,side:THREE.DoubleSide,depthWrite:false});
let glassBox=new THREE.Mesh(new THREE.BoxGeometry(3,1.2,1.5),glass);glassBox.position.set(0,0,0);glassBox.castShadow=false;tankGroup.add(glassBox);
let edgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(3,1.2,1.5));let edgeMesh=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x9bd7d8,transparent:true,opacity:.72}));tankGroup.add(edgeMesh);
const floorMat=mat(0x536b69,.68);let tf=new THREE.Mesh(new THREE.BoxGeometry(2.96,.07,1.46),floorMat);tf.position.set(0,-.565,0);tf.receiveShadow=true;tf.castShadow=true;tankGroup.add(tf);
let waterGeo=new THREE.PlaneGeometry(2.96,1.46,48,24);waterGeo.rotateX(-Math.PI/2);let waterMat=new THREE.MeshPhysicalMaterial({color:liquid.color,roughness:.18,metalness:.05,transparent:true,opacity:.38,transmission:.23,side:THREE.DoubleSide,depthWrite:false});let water=new THREE.Mesh(waterGeo,waterMat);water.position.set(0,.2,0);tankGroup.add(water);let waterline=new THREE.Mesh(new THREE.BoxGeometry(2.98,.008,1.48),new THREE.MeshBasicMaterial({color:0xb8ffff,transparent:true,opacity:.65}));waterline.position.y=.2;tankGroup.add(waterline);
// architectural backdrop
let back=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x102126,.9));back.position.set(0,3,-3.8);scene.add(back);for(let i=0;i<9;i++){let p=new THREE.Mesh(new THREE.BoxGeometry(.04,3,.06),mat(i%2?0x24434a:0x344d50,.6));p.position.set(-4+i,1.1,-3.7);scene.add(p)}
function setLiquid(key){liquid=LIQ[key];waterMat.color.setHex(liquid.color);waterMat.needsUpdate=true;waterMat.opacity=key==='oil'?.52:.38;waterMat.roughness=key==='oil'?.3:.18;reset()}
function bodyMaterial(name){if(name==='Cork')return mat(0xb88b56,.88);if(name==='Pine'||name==='Pine plank')return mat(0xa47743,.7);if(name==='Ice')return new THREE.MeshPhysicalMaterial({color:0xa3ecf4,roughness:.12,metalness:.05,transparent:true,opacity:.68,transmission:.32,thickness:.18});if(name==='Aluminium')return mat(0xa8b4bc,.27,.82);if(name==='Steel'||name==='Boat')return mat(0x45545d,.34,.78);return mat(0xc47a56,.42,.18)}
function boxMesh(size,name){let m=new THREE.Mesh(new THREE.BoxGeometry(...size),bodyMaterial(name));m.castShadow=true;m.receiveShadow=true;return m}
function addObject(name,pos,size,density,opts={}){const rb=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(...pos).setCanSleep(false).setLinearDamping(.02).setAngularDamping(.04));let shape=RAPIER.ColliderDesc.cuboid(size[0]/2,size[1]/2,size[2]/2).setDensity(density);world.createCollider(shape,rb);let mesh=boxMesh(size,name);scene.add(mesh);const o={id:'o'+idSeq++,name,density,size,rb,mesh,boatPart:!!opts.boatPart,weight:!!opts.weight,sub:0,settled:false,stable:0};objs.push(o);return o}
function clearBodies(){if(world){for(const o of objs){scene.remove(o.mesh);world.removeRigidBody(o.rb)}if(boat?.mesh){scene.remove(boat.mesh);world.removeRigidBody(boat.rb)}}objs=[];boat=null;settlers.clear();}
function initWorld(){world=new RAPIER.World({x:0,y:-Number($('#gravity').value),z:0});world.timestep=1/120;world.integrationParameters.dt=1/120;world.gravity={x:0,y:-Number($('#gravity').value),z:0};world.createCollider(RAPIER.ColliderDesc.cuboid(1.5,.035,.75).setTranslation(0,-.6,0).setFriction(.8));world.createCollider(RAPIER.ColliderDesc.cuboid(1.5,.6,.035).setTranslation(0,0,-.75));world.createCollider(RAPIER.ColliderDesc.cuboid(1.5,.6,.035).setTranslation(0,0,.75));world.createCollider(RAPIER.ColliderDesc.cuboid(.035,.6,.75).setTranslation(-1.5,0,0));world.createCollider(RAPIER.ColliderDesc.cuboid(.035,.6,.75).setTranslation(1.5,0,0));}
function reset(){if(!ready)return;clearBodies();initWorld();simTime=0;acc=0;wavePower=0;waveStart=-20;paused=false;$('#play').textContent='Ⅱ Pause';$('#engineStatus').textContent='SEQUENCE RUNNING';}
function makeBoat(){let size=[.6,.2,.4],density=10.5/(.6*.4*.2);let o=addObject('Steel boat',[0,.9,0],size,density);o.boatPart=true;const hull=new THREE.Group();const base=boxMesh([.58,.025,.38],'Boat');base.position.y=-.0875;hull.add(base);for(const [x,z,sx,sz] of [[-.2875,0,.025,.4],[.2875,0,.025,.4],[0,-.1875,.55,.025],[0,.1875,.55,.025]]){let wall=boxMesh([sx,.175,sz],'Boat');wall.position.set(x,-.005,z);hull.add(wall)}scene.remove(o.mesh);o.mesh=hull;scene.add(hull);boat={...o,mesh:hull,weights:0,sunk:false,flood:0,baseSize:size};return boat}
function spawn(name,pos=[0,1.1,0]){let density=DENS[name]||Number($('#density').value);if(name==='Pine plank')return addObject(name,pos,[1,.2,.1],500);return addObject(name,pos,[.2,.2,.2],density)}
function sequence(){const kinds=['Cork','Pine','Ice','Aluminium','Steel'];const xs=[-1.05,-.52,0,.52,1.05];for(let i=0;i<5;i++)setTimeout(()=>{if(!paused)spawn(kinds[i],[xs[i],1.2,.0]);else{let f=setInterval(()=>{if(!paused){clearInterval(f);spawn(kinds[i],[xs[i],1.2,0])}},100)}},1000*(i+1));setTimeout(()=>spawn('Pine plank',[-.65,1.05,0]),7000);setTimeout(()=>makeBoat(),9000)}
function localSurface(x,z,t){let main=.018*Math.sin(2.5*x-2.1*t)*Math.cos(4*z+1.5*t);let paddle=wavePower*Math.sin(Math.max(0,x+1.5)*3.7-4.8*(t-waveStart))*Math.exp(-Math.max(0,x+1.5)*.42);let rip=0;for(let k=0;k<rippleList.length;k++){let q=rippleList[k],d=Math.hypot(x-q.x,z-q.z),age=t-q.t;if(age>=0&&age<3)rip+=.035*Math.sin(d*17-age*10)*Math.exp(-d*1.5-age*1.4)}return .2+main+paddle+rip}
let rippleList=[];function ripple(x,z){rippleList.push({x,z,t:simTime});if(rippleList.length>24)rippleList.shift()}
function submerged(o){let pos=o.rb.translation(),rot=o.rb.rotation(),q=new THREE.Quaternion(rot.x,rot.y,rot.z,rot.w),c=new THREE.Vector3(),count=0,total=125, sum=0;for(let ix=0;ix<5;ix++)for(let iy=0;iy<5;iy++)for(let iz=0;iz<5;iz++){let lp=new THREE.Vector3(((ix+.5)/5-.5)*o.size[0],((iy+.5)/5-.5)*o.size[1],((iz+.5)/5-.5)*o.size[2]).applyQuaternion(q).add(new THREE.Vector3(pos.x,pos.y,pos.z));let d=localSurface(lp.x,lp.z,simTime)-lp.y;if(d>0){count++;c.add(lp);sum+=Math.min(.12,d)}}let frac=count/total;if(count)c.multiplyScalar(1/count);else c.set(pos.x,pos.y,pos.z);return{frac,c}}
function applyFluid(o,dt){let {frac,c}=submerged(o);o.sub=frac;if(frac>0){let volume=o.size[0]*o.size[1]*o.size[2]*frac;let force=liquid.density*Number($('#gravity').value)*volume;let p=o.rb.translation();o.rb.addForceAtPoint({x:0,y:force,z:0},{x:c.x,y:c.y,z:c.z},true);let vel=o.rb.linvel(),drag=Number($('#drag').value)*liquid.drag*frac; o.rb.addForce({x:-vel.x*drag,y:-vel.y*drag,z:-vel.z*drag},true);let av=o.rb.angvel();o.rb.addTorque({x:-av.x*drag*.32,y:-av.y*drag*.32,z:-av.z*drag*.32},true)}let vel=o.rb.linvel(),sp=Math.hypot(vel.x,vel.y,vel.z);o.stable=sp<.02?o.stable+dt:0;o.settled=o.stable>=1;}
function boatFlood(dt){if(!boat)return;let p=boat.rb.translation(),r=boat.rb.rotation(),q=new THREE.Quaternion(r.x,r.y,r.z,r.w),rimMax=-Infinity;for(let x of [-.3,.3])for(let z of [-.2,.2]){let v=new THREE.Vector3(x,.1,z).applyQuaternion(q).add(new THREE.Vector3(p.x,p.y,p.z));rimMax=Math.max(rimMax,v.y-localSurface(v.x,v.z,simTime))}if(rimMax<0)boat.flood=Math.min(1,boat.flood+dt*.65);if(boat.flood>0){let buoy=liquid.density*Number($('#gravity').value)*.048*(1-boat.flood)*Math.max(0,boat.sub);let {c}=submerged(boat);boat.rb.addForceAtPoint({x:0,y:buoy,z:0},{x:c.x,y:c.y,z:c.z},true);boat.rb.addForce({x:-boat.rb.linvel().x*4,y:-boat.rb.linvel().y*4,z:-boat.rb.linvel().z*4},true);boat.rb.addTorque({x:-boat.rb.angvel().x*2,y:-boat.rb.angvel().y*2,z:-boat.rb.angvel().z*2},true)}boat.sunk=boat.flood>=.99}
function physics(dt){world.gravity={x:0,y:-Number($('#gravity').value),z:0};for(let o of objs){if(o===boat)continue;applyFluid(o,dt)}if(boat){applyFluid(boat,dt);boatFlood(dt)}world.step();}
function syncMeshes(){for(let o of objs){let p=o.rb.translation(),r=o.rb.rotation();o.mesh.position.set(p.x,p.y,p.z);o.mesh.quaternion.set(r.x,r.y,r.z,r.w)}}
function surfaceMesh(t){let a=waterGeo.attributes.position;for(let i=0;i<a.count;i++){let x=a.getX(i),z=a.getZ(i);a.setY(i,localSurface(x,z,t)-.2)}a.needsUpdate=true;waterGeo.computeVertexNormals();}
function state(o){let p=o.rb.translation(),v=o.rb.linvel();if(o.name==='Steel boat')return boat?.sunk?'on the bottom':'floating';if(p.y<-.42&&Math.hypot(v.x,v.y,v.z)<.1)return'on the bottom';if(o.sub>.02&&v.y<-.04)return'sinking';return'floating'}
function updateReadings(){let html='';for(const o of objs){if(o.boatPart)continue;let s=state(o),pct=Math.round(o.sub*100),settled=o.settled;html+=`<div class="entity"><strong>${o.name}${o.name==='Custom'?' cube':''}</strong><span class="val">${o.density} kg/m³</span><small>${settled?`${pct}% submerged · `:''}<span class="status">${settled?s:'settling'}</span></small></div>`}$('#objectReadings').innerHTML=html||'<small>Waiting for first drop…</small>';if(boat){let p=boat.rb.translation(),rim=p.y+.1,bottom=p.y-.1,surf=localSurface(p.x,p.z,simTime);$('#draft').textContent=`${Math.max(0,(surf-bottom)*100).toFixed(1)} cm`;$('#freeboard').textContent=`${(rim-surf)*100|0} cm`;$('#weights').textContent=boat.weights;$('#boatReadings').textContent=boat.sunk?'Flooded · on bottom':boat.settled?'Settled':'settling';}let stateData=window.tankState();window.__tankSnapshot=stateData;}
window.tankState=()=>({liquid:{name:liquid.name,density:liquid.density},objects:objs.filter(o=>!o.boatPart).map(o=>{let p=o.rb.translation();return{id:o.id,name:o.name,density:o.density,submergedFraction:+o.sub.toFixed(4),state:state(o),position:{x:+p.x.toFixed(4),y:+p.y.toFixed(4),z:+p.z.toFixed(4)},settled:o.settled}}),boat:{draftCm:boat?+Math.max(0,(localSurface(boat.rb.translation().x,boat.rb.translation().z,simTime)-(boat.rb.translation().y-.1))*100).toFixed(2):0,freeboardCm:boat?+((boat.rb.translation().y+.1-localSurface(boat.rb.translation().x,boat.rb.translation().z,simTime))*100).toFixed(2):0,weights:boat?.weights||0,sunk:boat?.sunk||false},settings:{liquid:$('#liquid').value,gravity:Number($('#gravity').value),customDensity:Number($('#density').value),liquidDrag:Number($('#drag').value),speed:Number($('#speed').value),paused}});
function cameraUpdate(){if(camMode==='side'){camera.position.lerp(new THREE.Vector3(0,1.55,6.5),.05);camera.lookAt(0,.15,0)}else if(camMode==='top'){camera.position.lerp(new THREE.Vector3(0,7,.001),.08);camera.lookAt(0,0,0)}else{let rad=6.7;camera.position.set(Math.sin(orbit.x)*rad,1.6+orbit.y,Math.cos(orbit.x)*rad);camera.lookAt(0,.15,0)}}
function animate(ts){requestAnimationFrame(animate);let elapsed=Math.min(.05,(ts-last)/1000||0);last=ts;if(!paused){acc+=elapsed*speed;while(acc>=1/120){simTime+=1/120;physics(1/120);acc-=1/120}}cameraUpdate();surfaceMesh(simTime);syncMeshes();if(Math.floor(ts/200)%2===0)updateReadings();renderer.render(scene,camera)}
function resetAndSequence(){reset();sequence()}
$('#liquid').addEventListener('change',e=>{setLiquid(e.target.value);sequence()});$('#gravity').addEventListener('input',e=>$('#gravityOut').textContent=Number(e.target.value).toFixed(2));$('#drag').addEventListener('input',e=>$('#dragOut').textContent=Number(e.target.value).toFixed(1));$('#density').addEventListener('input',e=>{DENS.Custom=Number(e.target.value);$('#densityOut').textContent=e.target.value});$('#speed').addEventListener('change',e=>speed=Number(e.target.value));$('#play').onclick=()=>{paused=!paused;$('#play').textContent=paused?'▶ Play':'Ⅱ Pause'};$('#reset').onclick=resetAndSequence;$('#waves').onclick=()=>{wavePower=1;waveStart=simTime;ripple(-1.35,0);setTimeout(()=>wavePower=.28,700);setTimeout(()=>wavePower=0,2600)};$('#weight').onclick=()=>{if(!boat)return;let p=boat.rb.translation();let w=addObject('Steel',[p.x,p.y+.16,p.z],[.086,.086,.086],7850,{boatPart:true,weight:true});boat.weights++;boat.mesh.add(boxMesh([.086,.086,.086],'Steel')).position.set(0,.05,0);w.mesh.visible=false};document.querySelectorAll('.objbtn').forEach(b=>b.onclick=()=>{selected=b.dataset.kind;document.querySelectorAll('.objbtn').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelector('.objbtn').classList.add('selected');document.querySelectorAll('.cam').forEach(b=>b.onclick=()=>{camMode=b.dataset.cam;document.querySelectorAll('.cam').forEach(x=>x.classList.toggle('active',x===b))});
function screenRay(e){ptr.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ptr,camera)}let plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);let down=false;renderer.domElement.addEventListener('pointerdown',e=>{down=true;renderer.domElement.setPointerCapture(e.pointerId);screenRay(e);let hits=ray.intersectObjects(objs.map(o=>o.mesh),true);if(hits.length){let hit=hits[0].object;dragging=objs.find(o=>o.mesh===hit||o.mesh.getObjectById(hit.id));if(!dragging)dragging=objs.find(o=>o.mesh===hits[0].object.parent);if(dragging){dragging.rb.setBodyType(RAPIER.RigidBodyType.kinematicPositionBased,true);dragging.rb.wakeUp()}}else if(selected){let pl=new THREE.Plane(new THREE.Vector3(0,0,1),0),pt=new THREE.Vector3();if(ray.ray.intersectPlane(pl,pt)&&Math.abs(pt.x)<1.45&&pt.y<1.3&&pt.y>-.5){spawn(selected,[pt.x,Math.max(.95,pt.y),0]);ripple(pt.x,0)}}});renderer.domElement.addEventListener('pointermove',e=>{if(!down||!dragging)return;screenRay(e);let pt=new THREE.Vector3();if(ray.ray.intersectPlane(plane,pt)){let y=Math.max(-.5,Math.min(1.25,pt.y));dragging.rb.setNextKinematicTranslation({x:THREE.MathUtils.clamp(pt.x,-1.35,1.35),y,z:0});if(y<.2)ripple(pt.x,0)}});renderer.domElement.addEventListener('pointerup',()=>{down=false;if(dragging){dragging.rb.setBodyType(RAPIER.RigidBodyType.dynamic,true);dragging.stable=0;dragging=null}});window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();$('#play').click()}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('pointermove',e=>{if(camMode==='orbit'&&e.buttons===2){orbit.x-=e.movementX*.006;orbit.y=THREE.MathUtils.clamp(orbit.y+e.movementY*.008,-1,3)}});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
ready=true;initWorld();reset();sequence();requestAnimationFrame(animate);
</script></body></html>
